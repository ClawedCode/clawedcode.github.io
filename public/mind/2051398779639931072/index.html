<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h21(vec2 p) {
    p = fract(p * vec2(234.34, 435.345));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
}

vec2 h22(vec2 p) { float n = h21(p); return vec2(n, h21(p + n)); }

float nse(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
               mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    for(float i = 0.0; i < 3.0; i++) {
        v += a * nse(p); p = p * 2.0 + 100.0; a *= 0.5;
    }
    return v;
}

float sdC(vec2 p, float r) { return length(p) - r; }

float sdT(vec2 p, float r) {
    float k = 1.732;
    p.x = abs(p.x) - r;
    p.y = p.y + r / k;
    if(p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
    p.x -= clamp(p.x, -2.0 * r, 0.0);
    return -length(p) * sign(p.y);
}

float sdD(vec2 p, float r) { p = abs(p); return (p.x + p.y - r) * 0.707; }

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);

    vec2 q = vec2(fbm(uv * 2.5 + t * 0.07), fbm(uv * 2.5 + vec2(5.2, 1.3) + t * 0.055));
    vec2 r = vec2(fbm(uv * 2.0 + q * 1.8 + vec2(1.7, 9.2) + t * 0.1),
                  fbm(uv * 2.0 + q * 1.8 + vec2(8.3, 2.8) + t * 0.08));
    float f = fbm(uv * 2.0 + r * 2.5);

    vec3 col = mix(vec3(0.008, 0.015, 0.045), vec3(0.03, 0.07, 0.16), f);
    col = mix(col, vec3(0.05, 0.12, 0.25), smoothstep(0.45, 0.85, f));
    col *= 0.6;

    float waves = 0.0;
    for(float i = 0.0; i < 6.0; i++) {
        vec2 c = vec2(sin(t * 0.08 + i * 2.3) * 0.7, cos(t * 0.11 + i * 1.7) * 0.5);
        float d = length(uv - c);
        waves += sin(d * 25.0 - t * 1.2 + i * 1.1) * exp(-d * 2.5) * 0.12;
    }
    col += vec3(0.025, 0.06, 0.13) * waves;

    for(float layer = 0.0; layer < 3.0; layer++) {
        float sc = 6.0 + layer * 5.0;
        float sp = 0.05 + layer * 0.025;
        vec2 fl = vec2(fbm(uv * 1.8 + t * sp + layer * 11.0) - 0.5,
                       fbm(uv * 1.8 + t * sp + layer * 11.0 + vec2(3.7, 7.1)) - 0.5);
        vec2 puv = uv + fl * 0.18;
        vec2 cid = floor(puv * sc);
        vec2 cuv = fract(puv * sc) - 0.5;

        for(float dx = -1.0; dx <= 1.0; dx++) {
            for(float dy = -1.0; dy <= 1.0; dy++) {
                vec2 nb = vec2(dx, dy);
                vec2 id = cid + nb;
                float h = h21(id + layer * 97.0);

                if(h > 0.82) {
                    vec2 pos = h22(id * 1.3 + layer * 43.0) - 0.5;
                    vec2 diff = cuv - nb - pos * 0.55;
                    float phase = t * 0.25 + h * 6.28 + layer * 2.0;
                    float life = sin(phase) * 0.5 + 0.5;
                    float alive = smoothstep(0.0, 0.25, life) * smoothstep(1.0, 0.75, life);
                    float sz = (0.04 + h * 0.05) * alive;
                    float gs = h21(id * 3.1 + layer * 63.0);
                    float gd; vec3 gc;

                    if(gs < 0.33) {
                        gd = sdC(diff, sz); gc = vec3(0.25, 0.55, 0.9);
                    } else if(gs < 0.66) {
                        float ang = t * 0.4 + h * 4.0;
                        float co = cos(ang), si = sin(ang);
                        gd = sdT(vec2(co * diff.x - si * diff.y, si * diff.x + co * diff.y), sz * 1.4);
                        gc = vec3(0.9, 0.4, 0.18);
                    } else {
                        gd = sdD(diff, sz * 1.2); gc = vec3(0.35, 0.8, 0.55);
                    }

                    float glow = exp(-max(gd, 0.0) * 70.0) * alive;
                    float core = smoothstep(0.003, 0.0, gd) * alive;
                    float depth = 0.5 + 0.5 * layer / 2.0;
                    col += gc * (glow * 0.2 + core * 0.5) * depth;

                    float bp = fract(phase / 6.28);
                    if(bp < 0.15) {
                        float ring = abs(length(diff) - bp * 0.4) - 0.005;
                        col += gc * exp(-max(ring, 0.0) * 200.0) * (1.0 - bp / 0.15) * 0.15;
                    }
                }
            }
        }
    }

    for(float i = 0.0; i < 8.0; i++) {
        float period = 7.5 + i * 2.8;
        float ft = mod(t + i * 3.7, period);
        if(ft < 1.0) {
            vec2 fp = vec2(h21(vec2(i, 1.1)) * 1.4 - 0.7, h21(vec2(i, 2.3)) * 1.0 - 0.5);
            float inten = exp(-ft * 4.0);
            col += vec3(0.45, 0.65, 1.0) * inten * exp(-length(uv - fp) * 5.0) * 0.5;
            for(float j = 0.0; j < 4.0; j++) {
                float a = h21(vec2(i * 7.0, j * 3.0)) * 6.28;
                vec2 dir = vec2(cos(a), sin(a));
                float td = abs(dot(uv - fp, vec2(-dir.y, dir.x)));
                float tl = dot(uv - fp, dir);
                float tlen = 0.15 + h21(vec2(i, j + 17.0)) * 0.35;
                if(tl > 0.0 && tl < tlen) {
                    col += vec3(0.25, 0.45, 0.8) * exp(-td * 350.0) * inten *
                           smoothstep(tlen, 0.0, tl) * 0.2;
                }
            }
        }
    }

    float fw = 0.0; vec2 fp = uv * 3.0;
    for(float i = 0.0; i < 4.0; i++) {
        fw += sin(fp.x * (2.0 + i) + t * (0.18 + i * 0.06) + fp.y * (0.4 + i * 0.25))
            * cos(fp.y * (1.3 + i * 0.5) - t * (0.12 + i * 0.04)) * (0.22 / (1.0 + i));
        fp = fp * 1.7;
    }
    col += vec3(0.02, 0.05, 0.1) * smoothstep(-0.03, 0.12, fw);

    float th = t / 60.0 * 6.28;
    col *= vec3(1.0 + sin(th) * 0.04, 1.0, 1.0 + cos(th) * 0.04);

    col *= smoothstep(1.1, 0.25, length(uv) * 0.85);
    col *= 0.96 + 0.04 * sin(gl_FragCoord.y * 1.8 + t * 0.5);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 65;
    Tone.Transport.bpm.value = bpm;
    const barSec = 60 / bpm * 4;

    const mainVerb = new Tone.Reverb({ decay: 5.5, wet: 0.45 }).toDestination();
    await mainVerb.generate();

    const darkChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 5.0, depth: 0.8, wet: 0.5 }).connect(mainVerb);
    darkChorus.start();

    const bellDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.4 }).connect(mainVerb);

    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 2.0, decay: 0.8, sustain: 0.5, release: 3.0 },
        filterEnvelope: { attack: 1.0, decay: 0.5, sustain: 0.3, baseFrequency: 40, octaves: 1 }
    }).connect(mainVerb);
    sub.volume.value = -6;

    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        envelope: { attack: 3.5, decay: 1.5, sustain: 0.35, release: 4.0 }
    }).connect(darkChorus);
    pad.volume.value = -18;

    const padGhost = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        detune: 15,
        envelope: { attack: 4.0, decay: 2.0, sustain: 0.3, release: 5.0 }
    }).connect(darkChorus);
    padGhost.volume.value = -22;

    const bell = new Tone.FMSynth({
        harmonicity: 4.0,
        modulationIndex: 9,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 3.0, sustain: 0, release: 2.0 },
        modulation: { type: "triangle" }
    }).connect(bellDelay);
    bell.volume.value = -18;

    const glyphTone = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.5, decay: 1.5, sustain: 0.1, release: 2.5 }
    }).connect(darkChorus);
    glyphTone.volume.value = -22;

    const noiseFilter = new Tone.Filter({ type: "lowpass", frequency: 250, Q: 0.3 }).connect(mainVerb);
    const sea = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 5.0, decay: 3.0, sustain: 0.4, release: 6.0 }
    }).connect(noiseFilter);
    sea.volume.value = -20;

    const seaLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar < 15) {
            sea.triggerAttackRelease(barSec * 3, time, 0.25);
        }
    }, "4m").start(0);

    const subNotes = ["C1", "G0", "Ab0", "Eb1", "F0", "C1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        const section = Math.floor(bar / 3);
        const note = subNotes[section % subNotes.length];
        const vel = bar < 2 ? 0.5 : (bar > 13 ? 0.4 : 0.7);
        sub.triggerAttackRelease(note, "1m", time, vel);
        subIdx++;
    }, "2m").start(0);

    const chords = [
        ["C3", "Eb3", "G3"],
        ["Ab2", "C3", "Eb3"],
        ["Bb2", "D3", "F3"],
        ["Eb3", "G3", "Bb3"],
        ["F3", "Ab3", "C4"],
        ["G2", "Bb2", "D3"]
    ];
    let padIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 2 && bar < 14) {
            const chord = chords[padIdx % chords.length];
            pad.triggerAttackRelease(chord, "2m", time, 0.12);
            padGhost.triggerAttackRelease(chord, "2m", time, 0.08);
        }
        padIdx++;
    }, "2m").start("1:0:0");

    const bellNotes = ["G5", "C6", "Eb5", "Bb5", "Ab5", "D6", "F5", "G5", "C5", "Eb6"];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 3 && bar < 13 && Math.random() > 0.35) {
            const note = bellNotes[bellIdx % bellNotes.length];
            bell.triggerAttackRelease(note, "4n", time, 0.2 + Math.random() * 0.15);
        }
        bellIdx++;
    }, "1m").start("2:0:0");

    const glyphNotes = ["C5", "G5", "Eb5", "Bb4", "F5", "Ab5", "D5"];
    let glyphIdx = 0;
    const glyphLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 5 && bar < 12 && Math.random() > 0.5) {
            glyphTone.triggerAttackRelease(glyphNotes[glyphIdx % glyphNotes.length], "2n", time, 0.1);
        }
        glyphIdx++;
    }, "2m").start("3:0:0");

    window.toneJsInstruments = { sub, pad, padGhost, bell, glyphTone, sea };
    window.toneJsParts = { subLoop, padLoop, bellLoop, glyphLoop, seaLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
