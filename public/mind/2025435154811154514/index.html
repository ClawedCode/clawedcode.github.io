<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float w = t * 0.10472;
    vec3 col = vec3(0.012, 0.006, 0.03) + vec3(0.004, 0.002, 0.008) * sin(w * 3.0);
    float c1 = cos(w), s1 = sin(w);
    float c2 = cos(w + 0.4), s2 = sin(w + 0.4);
    float b = 0.208186 + sin(w * 2.0) * 0.008;
    vec3 acc = vec3(0.0);
    for (float k = 0.0; k < 4.0; k++) {
        vec3 p = vec3(
            sin(k * 1.7 + w) * 1.5 + 1.1,
            cos(k * 2.3 - w) * 1.2 + 0.2,
            sin(k * 3.1 + w) * 1.0 + 0.5
        );
        for (float i = 0.0; i < 300.0; i++) {
            vec3 dp = vec3(sin(p.y) - b * p.x, sin(p.z) - b * p.y, sin(p.x) - b * p.z);
            p += dp * 0.045;
            float spd = length(dp);
            float rx = p.x * c1 + p.z * s1;
            float rz = -p.x * s1 + p.z * c1;
            float ry = p.y * c2 + rz * s2;
            vec2 pr = vec2(rx, ry) * 0.13;
            float d = length(uv - pr);
            float fade = 1.0 - i / 300.0;
            fade *= fade;
            float glow = fade * 0.00003 / (d * d + 0.000003);
            float energy = clamp(spd * 2.0, 0.0, 1.0);
            vec3 c = mix(vec3(0.2, 0.06, 0.5), vec3(0.1, 0.7, 0.9), energy);
            c = mix(c, vec3(0.95, 0.55, 0.12), energy * energy);
            c += vec3(0.3, 0.08, 0.2) * k * 0.07;
            acc += c * glow;
        }
    }
    col += acc;
    col = 1.0 - exp(-col * 1.8);
    col = pow(col, vec3(0.82));
    col *= smoothstep(1.3, 0.2, length(uv));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 126;
  Tone.Transport.bpm.value = bpm;
  const secondsPerBar = (60 / bpm) * 4;
  const getBarNumber = (time) => {
    const seconds = Tone.Time(time).toSeconds();
    return Math.floor(seconds / secondsPerBar + 1e-6);
  };
  const masterLimiter = new Tone.Limiter(-1).toDestination();
  const mixBus = new Tone.Gain(0).connect(masterLimiter);
  const duckBase = new Tone.Signal(1).connect(mixBus.gain);
  const duckAmount = new Tone.Gain(-0.55).connect(mixBus.gain);
  const sidechainEnv = new Tone.Envelope({ attack: 0.005, decay: 0.22, sustain: 0, release: 0.12 });
  sidechainEnv.connect(duckAmount);
  const reverb = new Tone.Reverb({ decay: 2.8, wet: 0.2 });
  await reverb.generate();
  reverb.connect(mixBus);
  const delay = new Tone.FeedbackDelay({ delayTime: '8n', feedback: 0.32, wet: 0.28 }).connect(mixBus);
  const arpChorus = new Tone.Chorus({ frequency: 1.6, delayTime: 3.4, depth: 0.5, wet: 0.4 }).start().connect(mixBus);
  const padChorus = new Tone.Chorus({ frequency: 0.35, delayTime: 4.2, depth: 0.55, wet: 0.35 }).start();
  padChorus.connect(mixBus);
  padChorus.connect(reverb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.022,
    octaves: 5,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.001, decay: 0.24, sustain: 0, release: 0.08 }
  }).connect(masterLimiter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: 'sawtooth' },
    filter: { type: 'lowpass', frequency: 110, rolloff: -24 },
    envelope: { attack: 0.004, decay: 0.18, sustain: 0.9, release: 0.22 },
    filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 0.15, baseFrequency: 70, octaves: 2.5 }
  });
  const bassFilter = new Tone.Filter({ type: 'lowpass', frequency: 180, Q: 1 }).connect(mixBus);
  bass.connect(bassFilter);
  const arp = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'pulse', width: 0.25 },
    envelope: { attack: 0.005, decay: 0.11, sustain: 0.35, release: 0.15 }
  });
  const arpFilter = new Tone.Filter({ type: 'lowpass', frequency: 500, Q: 1.1 });
  arp.connect(arpFilter);
  arpFilter.connect(arpChorus);
  const lead = new Tone.MonoSynth({
    oscillator: { type: 'sawtooth' },
    filter: { type: 'lowpass', frequency: 900, Q: 1.8 },
    envelope: { attack: 0.003, decay: 0.13, sustain: 0.25, release: 0.12 },
    filterEnvelope: { attack: 0.008, decay: 0.24, sustain: 0.2, release: 0.15, baseFrequency: 700, octaves: 2 }
  });
  const leadGain = new Tone.Gain(0.85);
  lead.connect(leadGain);
  leadGain.connect(mixBus);
  leadGain.connect(delay);
  leadGain.connect(reverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.35, decay: 0.5, sustain: 0.7, release: 1.6 }
  });
  const padFilter = new Tone.Filter({ type: 'lowpass', frequency: 900, Q: 0.7 });
  pad.connect(padFilter);
  padFilter.connect(padChorus);
  const hats = new Tone.MetalSynth({
    frequency: 360,
    envelope: { attack: 0.001, decay: 0.08, release: 0.03 },
    harmonicity: 5.6,
    modulationIndex: 28,
    resonance: 5500
  }).connect(masterLimiter);
  const clap = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.16, sustain: 0 }
  });
  const clapFilter = new Tone.Filter({ type: 'highpass', frequency: 1200, Q: 0.9 }).connect(masterLimiter);
  clap.connect(clapFilter);
  const swell = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.4, decay: 0.3, sustain: 0, release: 1.2 }
  });
  const swellFilter = new Tone.Filter({ type: 'highpass', frequency: 500 }).connect(reverb);
  swell.connect(swellFilter);
  const kickLoop = new Tone.Loop((time) => {
    kick.triggerAttackRelease('C1', '8n', time, 0.95);
    sidechainEnv.triggerAttackRelease('16n', time);
  }, '4n').start(0);
  const introPattern = ['C1', 'C1', 'G0', 'C1', 'C1', 'C1', 'G0', 'C1'];
  const buildPattern = ['C1', 'C1', 'Ab0', 'C1', 'Eb1', 'Eb1', 'Bb0', 'Eb1'];
  const peakPattern = ['C1', 'G0', 'Ab0', 'G0', 'Eb1', 'Bb0', 'C1', 'Bb0'];
  let introIndex = 0;
  let buildIndex = 0;
  let peakIndex = 0;
  let outroIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    let note = 'C1';
    let velocity = 0.75;
    if (bar < 8) {
      note = introPattern[introIndex % introPattern.length];
      introIndex += 1;
      velocity = 0.7;
    } else if (bar < 20) {
      note = buildPattern[buildIndex % buildPattern.length];
      buildIndex += 1;
      velocity = 0.85;
    } else if (bar < 28) {
      note = peakPattern[peakIndex % peakPattern.length];
      peakIndex += 1;
      velocity = 0.95;
    } else {
      note = introPattern[outroIndex % introPattern.length];
      outroIndex += 1;
      velocity = 0.72;
    }
    bass.triggerAttackRelease(note, '8n', time, velocity);
  }, '8n').start(0);
  const hatPattern = [1, 0, 1, 0, 1, 0, 1, 1];
  let hatIndex = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    if (bar >= 2 && bar < 28) {
      if (hatPattern[hatIndex % hatPattern.length]) {
        const level = bar < 12 ? 0.3 : 0.4;
        hats.triggerAttackRelease('32n', time, level);
      }
      hatIndex += 1;
    }
  }, '16n').start(0);
  const padChords = [
    ['C3', 'Eb3', 'G3', 'Bb3'],
    ['Ab2', 'C3', 'Eb3', 'G3'],
    ['Eb3', 'G3', 'Bb3', 'D4'],
    ['Bb2', 'D3', 'F3', 'A3']
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    if (bar >= 2 && bar < 24) {
      const chord = padChords[chordIndex % padChords.length];
      const intensity = bar < 12 ? 0.28 : 0.38;
      pad.triggerAttackRelease(chord, '2n', time, intensity);
      chordIndex += 1;
    }
  }, '2n').start(0);
  const arpA = ['C4', 'Eb4', 'G4', 'Bb4', 'G4', 'Eb4', 'C4', 'G4'];
  const arpB = ['Bb3', 'C4', 'Eb4', 'G4', 'Bb4', 'G4', 'Eb4', 'C4'];
  let arpIndexA = 0;
  let arpIndexB = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    if (bar >= 4 && bar < 24) {
      const activePattern = bar < 12 ? arpA : arpB;
      if (bar < 12) {
        const note = activePattern[arpIndexA % activePattern.length];
        arp.triggerAttackRelease(note, '16n', time, 0.55);
        arpIndexA += 1;
      } else {
        const note = activePattern[arpIndexB % activePattern.length];
        arp.triggerAttackRelease(note, '16n', time, 0.65);
        arpIndexB += 1;
      }
    }
  }, '16n').start(0);
  const leadNotes = ['C5', 'D5', 'Eb5', 'G5', 'F5', 'Eb5', 'D5', 'C5'];
  let leadIndex = 0;
  const leadLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    if (bar >= 10 && bar < 22) {
      const note = leadNotes[leadIndex % leadNotes.length];
      lead.triggerAttackRelease(note, '8n', time, 0.85);
      leadIndex += 1;
    }
  }, '8n').start(0);
  const clapLoop = new Tone.Loop((time) => {
    const bar = getBarNumber(time);
    if (bar >= 12 && bar < 22) {
      clap.triggerAttackRelease('16n', time, 0.4);
    }
  }, '2n').start(0);
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.cancelScheduledValues(time);
    bassFilter.frequency.setValueAtTime(160, time);
    bassFilter.frequency.linearRampToValueAtTime(260, time + secondsPerBar * 6);
  }, '0:0:0');
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(340, time + secondsPerBar * 6);
  }, '8:0:0');
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(180, time + secondsPerBar * 4);
  }, '24:0:0');
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.cancelScheduledValues(time);
    arpFilter.frequency.setValueAtTime(450, time);
    arpFilter.frequency.linearRampToValueAtTime(2400, time + secondsPerBar * 8);
  }, '4:0:0');
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(500, time + secondsPerBar * 4);
  }, '20:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.cancelScheduledValues(time);
    padFilter.frequency.setValueAtTime(600, time);
    padFilter.frequency.linearRampToValueAtTime(1100, time + secondsPerBar * 6);
  }, '2:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(500, time + secondsPerBar * 4);
  }, '20:0:0');
  Tone.Transport.schedule((time) => {
    swellFilter.frequency.cancelScheduledValues(time);
    swellFilter.frequency.setValueAtTime(500, time);
    swellFilter.frequency.linearRampToValueAtTime(4200, time + 1.5);
    swell.triggerAttackRelease(2, time);
  }, '7:2:0');
  Tone.Transport.schedule((time) => {
    swellFilter.frequency.cancelScheduledValues(time);
    swellFilter.frequency.setValueAtTime(500, time);
    swellFilter.frequency.linearRampToValueAtTime(4500, time + 1.8);
    swell.triggerAttackRelease(2, time);
  }, '15:2:0');
  window.toneJsInstruments = {
    kick,
    bass,
    bassFilter,
    arp,
    arpFilter,
    lead,
    leadGain,
    pad,
    padFilter,
    hats,
    clap,
    clapFilter,
    swell,
    swellFilter,
    reverb,
    delay,
    arpChorus,
    padChorus,
    mixBus,
    duckBase,
    duckAmount,
    masterLimiter,
    sidechainEnv
  };
  window.toneJsParts = {
    kickLoop,
    bassLoop,
    hatLoop,
    padLoop,
    arpLoop,
    leadLoop,
    clapLoop
  };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
