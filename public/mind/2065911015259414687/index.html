<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }

vec2 calm(float s, float t) {
    float r = s * 0.55 * (0.7 + 0.3 * sin(t * 0.105));
    float a = -0.5 + s * 2.2 + 0.45 * sin(s * 2.0 + t * 0.21);
    return vec2(cos(a), sin(a)) * r;
}

vec2 surge(float s, float t) {
    float r = s * 0.5 * (0.6 + 0.4 * sin(t * 0.42));
    float a = 2.1 + s * 3.8 + 0.25 * sin(s * 7.0 + t * 1.05);
    float j = sin(s * 14.0 + t * 2.1) * 0.035 * s;
    return vec2(cos(a) * r + j, sin(a) * r);
}

vec2 turn(float s, float t) {
    float r = s * 0.48 * (0.65 + 0.35 * sin(s * 2.5 + t * 0.157));
    float a = 4.2 + s * 2.6 - 0.55 * cos(s * 1.8 - t * 0.21);
    return vec2(cos(a), sin(a)) * r;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float breath = 0.55 + 0.45 * sin(t * 3.14159 / 30.0);

    vec3 col = vec3(0.012, 0.008, 0.022);
    col += vec3(0.008, 0.004, 0.012) * (1.0 - length(uv) * 0.5);

    vec3 c1 = vec3(0.12, 0.75, 0.7);
    vec3 c2 = vec3(0.92, 0.6, 0.12);
    vec3 c3 = vec3(0.55, 0.2, 0.82);

    float md1 = 100.0, ms1 = 0.0;
    float md2 = 100.0, ms2 = 0.0;
    float md3 = 100.0, ms3 = 0.0;

    for(float i = 0.0; i < 120.0; i++) {
        float s = i / 120.0;
        vec2 p1 = calm(s, t);
        vec2 p2 = surge(s, t);
        vec2 p3 = turn(s, t);
        float d1 = length(uv - p1);
        float d2 = length(uv - p2);
        float d3 = length(uv - p3);
        if(d1 < md1) { md1 = d1; ms1 = s; }
        if(d2 < md2) { md2 = d2; ms2 = s; }
        if(d3 < md3) { md3 = d3; ms3 = s; }
    }

    float w1 = mix(0.022, 0.004, ms1);
    float w2 = mix(0.018, 0.003, ms2);
    float w3 = mix(0.02, 0.005, ms3);

    float f1 = smoothstep(0.0, 0.08, ms1) * smoothstep(1.0, 0.4, ms1) * breath;
    float f2 = smoothstep(0.0, 0.06, ms2) * smoothstep(1.0, 0.5, ms2) * breath;
    float f3 = smoothstep(0.0, 0.1, ms3) * smoothstep(1.0, 0.35, ms3) * breath;

    float wave1 = 0.35 + 0.65 * sin(ms1 * 35.0 - t * 1.5);
    float wave2 = 0.25 + 0.75 * sin(ms2 * 55.0 - t * 4.5);
    float wave3 = 0.4 + 0.6 * sin(ms3 * 28.0 + t * 1.2);

    float r1 = smoothstep(w1, w1 * 0.12, md1) * 0.7 + w1 / (md1 + w1) * 0.45;
    float r2 = smoothstep(w2, w2 * 0.12, md2) * 0.7 + w2 / (md2 + w2) * 0.45;
    float r3 = smoothstep(w3, w3 * 0.12, md3) * 0.7 + w3 / (md3 + w3) * 0.45;

    col += c1 * r1 * f1 * wave1;
    col += c2 * r2 * f2 * wave2;
    col += c3 * r3 * f3 * wave3;

    float h1 = 0.05 / (md1 + 0.05);
    float h2 = 0.05 / (md2 + 0.05);
    float h3 = 0.05 / (md3 + 0.05);
    col += c1 * h1 * f1 * 0.06;
    col += c2 * h2 * f2 * 0.06;
    col += c3 * h3 * f3 * 0.06;

    for(float i = 0.0; i < 24.0; i++) {
        float off = hash(i + 1.0);
        float sz = 0.0025 + 0.0015 * hash(i * 3.7);

        float s1 = fract(t * (0.035 + off * 0.02) + off);
        vec2 pp = calm(s1, t);
        float pd = length(uv - pp);
        float pl = smoothstep(0.0, 0.1, s1) * smoothstep(1.0, 0.5, s1);
        col += c1 * 1.5 * sz / (pd + sz) * pl;

        float s2 = fract(t * (0.08 + off * 0.05) + off);
        pp = surge(s2, t);
        pd = length(uv - pp);
        pl = smoothstep(0.0, 0.08, s2) * smoothstep(1.0, 0.55, s2);
        col += c2 * 1.5 * sz / (pd + sz) * pl;

        float s3 = fract(t * (0.025 + off * 0.015) + off);
        pp = turn(s3, t);
        pd = length(uv - pp);
        pl = smoothstep(0.0, 0.12, s3) * smoothstep(1.0, 0.4, s3);
        col += c3 * 1.5 * sz / (pd + sz) * pl;
    }

    for(float i = 0.0; i < 35.0; i++) {
        vec2 pp = (vec2(hash(i * 1.3), hash(i * 2.7 + 5.0)) - 0.5) * 1.3;
        pp += 0.02 * vec2(sin(t * 0.04 + i * 0.9), cos(t * 0.05 + i * 1.2));
        float d = length(uv - pp);
        float g = 0.0008 / (d + 0.0008);
        float f = 0.15 + 0.85 * sin(t * 0.12 + i * 4.3);
        col += vec3(0.25, 0.2, 0.32) * g * 0.012 * f;
    }

    float cd = length(uv);
    float cg = 0.028 / (cd + 0.028);
    vec3 cm = mix(c1, mix(c2, c3, 0.5 + 0.5 * sin(t * 0.31)), 0.5 + 0.5 * cos(t * 0.21));
    col += cm * cg * 0.5 * breath;

    col *= smoothstep(1.0, 0.2, length(uv * 0.85));
    col = col / (1.0 + col);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterVerb = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).toDestination();
  await masterVerb.generate();

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 5, depth: 0.5, wet: 0.35 }).connect(masterVerb);
  padChorus.start();
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600 }).connect(padChorus);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.5, release: 2.5 }
  }).connect(padFilter);
  pad.volume.value = -20;

  const chords = [
    ["A3", "C4", "E4"], ["G3", "B3", "D4"], ["F3", "A3", "C4"],
    ["E3", "G3", "B3"], ["D3", "F3", "A3"], ["C3", "E3", "G3"],
    ["A3", "C4", "E4"]
  ];
  let chordIdx = 0;

  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 1 && bar < 16) {
      const progress = (bar - 1) / 14;
      const freq = progress < 0.55
        ? 600 + (progress / 0.55) * 1200
        : 1800 - ((progress - 0.55) / 0.45) * 1300;
      padFilter.frequency.setValueAtTime(Math.max(freq, 400), time);
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.25);
      chordIdx++;
    }
  }, "1n").start(0);

  const arpDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterVerb);
  const arpHP = new Tone.Filter({ type: "highpass", frequency: 300 }).connect(arpDelay);

  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.003, decay: 0.15, sustain: 0, release: 0.06 }
  }).connect(arpHP);
  arp.volume.value = -24;

  const arpScales = [
    ["A4", "C5", "E5", "A5", "E5", "C5"],
    ["G4", "B4", "D5", "G5", "D5", "B4"],
    ["F4", "A4", "C5", "F5", "C5", "A4"]
  ];
  let arpIdx = 0;

  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 5 && bar < 14) {
      const progress = (bar - 5) / 8;
      const density = progress < 0.6 ? 0.4 + progress * 0.8 : 0.88 - (progress - 0.6) * 0.6;
      if (Math.random() < density) {
        const scale = arpScales[Math.floor(bar / 3) % arpScales.length];
        arp.triggerAttackRelease(scale[arpIdx % scale.length], "16n", time, 0.3 + progress * 0.4);
      }
      arpIdx++;
    }
  }, "16n").start(0);

  const bellVerb = new Tone.Reverb({ decay: 5.0, wet: 0.45 }).toDestination();
  await bellVerb.generate();

  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.008, decay: 3.0, sustain: 0, release: 1.5 },
    modulation: { type: "sine" }
  }).connect(bellVerb);
  bell.volume.value = -22;

  const bellNotes = ["E5", "A4", "C5", "G4", "B4", "D5", "A4", "E4"];
  let bellIdx = 0;

  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 15) {
      const shouldPlay = bar > 8 ? bellIdx % 2 === 0 : bellIdx % 3 === 0;
      if (shouldPlay) {
        bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.35);
      }
      bellIdx++;
    }
  }, "4n").start(0);

  const subLP = new Tone.Filter({ type: "lowpass", frequency: 120 }).toDestination();
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.7, release: 3.0 }
  }).connect(subLP);
  sub.volume.value = -18;

  const subNotes = ["A1", "A1", "F1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 17) {
      sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time, 0.5);
      subIdx++;
    }
  }, "1n").start(0);

  const pulse = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.35, sustain: 0, release: 0.2 }
  }).toDestination();
  pulse.volume.value = -28;

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 14) {
      pulse.triggerAttackRelease("C1", "4n", time, 0.25);
    }
  }, "2n").start(0);

  const noiseHP = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterVerb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0, release: 0.3 }
  }).connect(noiseHP);
  noise.volume.value = -30;

  let noiseStep = 0;
  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 15 && noiseStep % 7 === 0) {
      noise.triggerAttackRelease("4n", time);
    }
    noiseStep++;
  }, "4n").start(0);

  window.toneJsInstruments = { pad, arp, bell, sub, pulse, noise };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, subLoop, pulseLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
