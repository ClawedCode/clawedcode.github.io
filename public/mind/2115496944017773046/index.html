// fires window 'error' with the line number, so it gets captured instead of

window._errors = [];

  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);

});

2.0 / (r * r * r * (a - b));\n}\n\n// crank winding curve: gentle start, quicker finish, zero speed at both ends\nfloat windCurve(float u) {\n  float v = clamp(u, 0.0, 1.0);\n  float x = v * sqrt(sqrt(v));\n  return x * x * (3.0 - 2.0 * x);\n}\n\nfloat windSlope(float u) {\n  float v = clamp(u, 0.0, 1.0);\n  float x = v * sqrt(sqrt(v));\n  return 6.0 * x * (1.0 - x) * 1.25 * sqrt(sqrt(v));\n}\n\n// crank turns on the cycle clock; the reverse is the forward run played as its mirror\nfloat crankTurns(float c) {\n  if (c \u003c 1.0) return 0.0;\n  if (c \u003c 9.0) return 7.0 * windCurve((c - 1.0) / 8.0);\n  if (c \u003c 12.0) return 7.0;\n  if (c \u003c 20.0) return 7.0 * windCurve((20.0 - c) / 8.0);\n  return 0.0;\n}\n\n// signed turns per cycle\nfloat crankRate(float c) {\n  if (c > 1.0 && c \u003c 9.0) return 0.875 * windSlope((c - 1.0) / 8.0);\n  if (c > 12.0 && c \u003c 20.0) return -0.875 * windSlope((20.0 - c) / 8.0);\n  return 0.0;\n}\n\n// one injected bead of ink: a soft sphere seen from above, darker where it is deeper,\n// with a faint pigment rim and slow mottling carried in the rest frame\nfloat inkBead(vec2 q, vec2 center, float radius, float seed, float soft) {\n  vec2 d = q - center;\n  float dist = length(d);\n  float ang = atan(d.y, d.x);\n  float rr = radius * (1.0 + 0.022 * sin(3.0 * ang + seed) + 0.012 * sin(5.0 * ang + 1.7 * seed));\n  float body = 1.0 - smoothstep(rr - soft, rr + soft, dist);\n  float x = clamp(dist / rr, 0.0, 1.0);\n  float depth = sqrt(max(1.0 - x * x, 0.0));\n  float mottle = 0.9 + 0.2 * valueNoise(d * 60.0 + seed * 7.0);\n  float rim = 0.22 * smoothstep(0.62, 0.94, x);\n  float halo = 0.085 * exp(-dist * dist / (4.0 * rr * rr));\n  return (body * (0.42 + 0.62 * depth + rim) * mottle + halo) * (rr / (rr + 0.3 * soft));\n}\n\n// the four drops (each with the small satellite the pipette left) where they sit at rest,\n// one per radial zone so the smear separates into four bands: sumi innermost, viridian outermost\nvec3 inkAbsorbance(vec2 q, float soft) {\n  float sumi = inkBead(q, vec2(-0.0271, 0.2203), 0.028, 0.4, soft)\n    + 0.85 * inkBead(q, vec2(-0.0729, 0.2244), 0.009, 2.9, soft);\n  float cobalt = inkBead(q, vec2(-0.0641, -0.2571), 0.030, 1.3, soft)\n    + 0.85 * inkBead(q, vec2(-0.1102, -0.2596), 0.0095, 4.1, soft);\n  float carmine = inkBead(q, vec2(-0.2828, -0.1143), 0.031, 2.2, soft)\n    + 0.85 * inkBead(q, vec2(-0.2826, -0.0652), 0.0095, 0.7, soft);\n  float viridian = inkBead(q, vec2(0.3199, 0.1292), 0.029, 5.1, soft)\n    + 0.85 * inkBead(q, vec2(0.2773, 0.1733), 0.009, 3.3, soft);\n  return cobalt * vec3(3.7, 2.1, 0.22)\n    + carmine * vec3(0.25, 2.9, 2.1)\n    + viridian * vec3(2.7, 0.45, 1.3)\n    + sumi * vec3(2.9, 3.0, 3.2);\n}\n\n// suspended air bubbles: rigid tracers that ride their own ring of syrup\nvec2 syrupBubbles(vec2 q, float spin) {\n  vec2 acc = vec2(0.0);\n  float r = length(q);\n  float row = floor((r - 0.2) / 0.0105 + 0.5);\n  if (row \u003c 0.0 || row > 16.0) return acc;\n  float rowR = 0.2 + row * 0.0105;\n  float slots = floor(TAU * rowR / 0.021);\n  float slotAngle = TAU / slots;\n  float shift = spin * couetteShare(rowR);\n  float th = atan(q.y, q.x);\n  float base = floor((th + shift) / slotAngle);\n  for (int k = 0; k \u003c 3; k++) {\n    float s = base + float(k) - 1.0;\n    float sw = mod(s, slots);\n    if (hash21(vec2(sw, row + 17.0)) \u003c 0.075) {\n      float jitter = hash21(vec2(row + 3.1, sw)) - 0.5;\n      float grow = hash21(vec2(sw * 1.7, row + 9.0));\n      float size = 0.0013 + 0.0034 * grow * grow;\n      float ang = (s + 0.5 + 0.6 * jitter) * slotAngle - shift;\n      vec2 bc = rowR * vec2(cos(ang), sin(ang));\n      float d = length(q - bc);\n      float disk = 1.0 - smoothstep(size - 0.0008, size + 0.0008, d);\n      float core = 1.0 - smoothstep(0.15 * size, 0.55 * size, length(q - bc - vec2(-0.25, 0.25) * size));\n      acc.x = max(acc.x, disk);\n      acc.y = max(acc.y, core * disk);\n    }\n  }\n  return acc;\n}\n\nfloat using + 0.004))) * max(dot(normalize(cq + vec2(0.0001)), LIGHT_DIR), 0.0);\n  float windowD = roundBox(cq - vec2(0.0, 0.004), vec2(0.022, 0.029), 0.004);\n  float wheelPos = c \u003c 10.5\n    ? floor(turns) + smoothstep(0.9, 1.0, fract(turns))\n    : floor(turns) + 1.0 - smoothstep(0.9, 1.0, 1.0 - fract(turns));\n  float wheelBase = floor(wheelPos);\n  float roll = wheelPos - wheelBase;\n  vec2 gq = (cq - vec2(0.0, 0.004)) / 0.05;\n  float ink = counterDigit(gq + vec2(0.0, 1.3 * roll), wheelBase) + counterDigit(gq + vec2(0.0, 1.3 * roll - 1.3), wheelBase + 1.0);\n  vec3 wheel = vec3(0.025) * (0.6 + 0.4 * (1.0 - abs(gq.y) * 1.6));\n  wheel = mix(wheel, vec3(0.9, 0.88, 0.8) * (0.55 + 0.45 * (1.0 - abs(gq.y) * 1.4)), clamp(ink, 0.0, 1.0));\n  vec3 counterCol = mix(brass, wheel, 1.0 - smoothstep(-pxs, pxs, windowD));\n  col = mix(col, counterCol, 1.0 - smoothstep(-pxs, pxs, housing));\n\n  // ---- glass wall ----\n  if (r \u003c R_GLASS + 2.0 * pxs) {\n    float gx = clamp((r - R_OUT) / (R_GLASS - R_OUT), 0.0, 1.0);\n    vec3 glass = vec3(0.13, 0.15, 0.14) + vec3(0.6, 0.38, 0.15) * 0.3 * (1.0 - gx);\n    glass += vec3(1.0, 0.97, 0.92) * 0.6 * pow(max(facing, 0.0), 6.0) * exp(-pow((gx - 0.45) / 0.22, 2.0));\n    glass += vec3(0.9, 0.95, 1.0) * 0.16 * pow(max(-facing, 0.0), 3.0) * exp(-pow((gx - 0.7) / 0.2, 2.0));\n    glass += 0.3 * exp(-pow((r - (R_GLASS - 0.0035)) / 0.0014, 2.0)) * (0.55 + 0.45 * max(facing, 0.0));\n    col = mix(col, glass, 1.0 - smoothstep(R_GLASS - pxs, R_GLASS + pxs, r));\n  }\n\n  // ---- syrup, ink and bubbles ----\n  float syrupMask = (1.0 - smoothstep(R_OUT - pxs, R_OUT + pxs, r)) * smoothstep(R_IN - pxs, R_IN + pxs, r);\n  if (r > R_IN - 2.0 * pxs && r \u003c R_OUT + 2.0 * pxs) {\n    float gap = clamp((r - R_IN) / (R_OUT - R_IN), 0.0, 1.0);\n    float glowShape = sin(0.5 * TAU * gap);\n    float bright = 0.7 + 0.3 * glowShape;\n    bright *= 1.0 + 0.08 * dot(nrm, vec2(-0.55, 0.45));\n    bright *= 0.95 + 0.08 * valueNoise(q * 9.0 + 4.0);\n    float meniscus = smoothstep(0.0, 0.017, r - R_IN) * smoothstep(0.0, 0.017, R_OUT - r);\n    bright *= 0.55 + 0.45 * meniscus;\n    float causticN = valueNoise(q * 15.0 + 2.0 * valueNoise(q * 5.0 + 7.0));\n    float caustic = pow(1.0 - abs(2.0 * causticN - 1.0), 7.0);\n    bright *= 0.97 + 0.07 * caustic;\n    vec3 syrup = mix(vec3(0.76, 0.4, 0.12), vec3(1.0, 0.72, 0.34), smoothstep(0.0, 0.55, glowShape));\n    syrup = mix(syrup, vec3(1.0, 0.9, 0.62), smoothstep(0.75, 1.0, glowShape) * 0.6) * bright;\n    syrup += vec3(1.0, 0.92, 0.78) * 0.22 * exp(-pow((r - R_IN - 0.004) / 0.0013, 2.0)) * (0.5 + 0.5 * max(facing, 0.0));\n    syrup += vec3(1.0, 0.92, 0.78) * 0.28 * exp(-pow((R_OUT - r - 0.004) / 0.0013, 2.0)) * (0.5 + 0.5 * max(-facing, 0.0));\n\n    // pixel footprint pulled back to the rest frame: a radial window spans\n    // couetteSlope * spin radians of the original ring, so integrate along it.\n    // Once the streaks are finer than the eye resolves they read as a faint haze.\n    float haze = 0.0026 * smoothstep(1.5, 6.0, turns);\n    float window = pxs + 2.0 * haze;\n    float sweep = couetteSlope(r) * spin * window * r;\n    float samples = clamp(floor(2.0 + sweep / 0.0045), 2.0, 16.0);\n    float soft = 0.0018 + 1.15 * sweep / samples;\n    vec2 tangent = vec2(-nrm.y, nrm.x);\n    vec3 trans = vec3(0.0);\n    for (int k = 0; k \u003c 16; k++) {\n      if (float(k) >= samples) break;\n      float fk = (float(k) + 0.5) / samples - 0.5;\n      float tj = (mod(float(k), 2.0) - 0.5) * 0.5;\n      vec2 qs = q + nrm * fk * window + tangent * tj * pxs;\n      float rs = length(qs);\n      float ths = atan(qs.y, qs.x) + spin * couetteShare(rs);\n      trans += exp(-inkAbsorbance(rs * vec2(cos(ths), sin(ths)), soft));\n    }\n    syrup *= trans / samples;\n\n    vec2 bubble = syrupBubbles(q, spin);\n    syrup = mix(syrup, syrup * 0.45, bubble.x * 0.75);\n    syrup += vec3(1.0, 0.95, 0.85) * 0.32 * bubble.y;\n\n    // the paw's tap sends a surface ripple across the *= 1.0 - 0.5 * (1.0 - smoothstep(-0.015, 0.02, headShadowD));\n\n  // ---- crank arm, hub boss and walnut knob ----\n  float barD = sdTaper(p, CELL, knob, 0.0175, 0.015);\n  vec2 barAxis = normalize(knob - CELL);\n  float barSide = dot(p - CELL, vec2(-barAxis.y, barAxis.x));\n  float barLit = max(dot(vec2(-barAxis.y, barAxis.x) * sign(barSide), LIGHT_DIR), 0.0);\n  vec3 barCol = vec3(0.07, 0.075, 0.09) + vec3(0.45, 0.47, 0.52) * barLit * smoothstep(0.007, 0.015, abs(barSide));\n  barCol += vec3(0.05) * (1.0 - smoothstep(0.0, 0.004, abs(barSide)));\n  col = mix(col, barCol, 1.0 - smoothstep(-pxs, pxs, barD));\n\n  float hubD = r - 0.028;\n  vec3 hubCol = vec3(0.36, 0.37, 0.39) * (0.65 + 0.5 * max(facing, 0.0) * smoothstep(0.0, 0.028, r));\n  hubCol += vec3(0.25) * exp(-pow((r - 0.022) / 0.002, 2.0)) * max(facing, 0.0);\n  vec2 slotDir = vec2(cos(alpha), sin(alpha));\n  float slot = (1.0 - smoothstep(0.0024, 0.0024 + pxs, abs(dot(q, vec2(-slotDir.y, slotDir.x))))) * (1.0 - smoothstep(0.014, 0.016, r));\n  hubCol = mix(hubCol, vec3(0.05), slot);\n  col = mix(col, hubCol, 1.0 - smoothstep(-pxs, pxs, hubD));\n\n  vec2 kq = (p - knob) / KNOB_R;\n  float kr = length(kq);\n  if (kr \u003c 1.2) {\n    vec3 kn = vec3(kq, sqrt(max(1.0 - kr * kr, 0.0)));\n    vec3 kl = normalize(vec3(LIGHT_DIR, 1.1));\n    float kdiff = max(dot(kn, kl), 0.0);\n    float kspec = pow(max(dot(reflect(-kl, kn), vec3(0.0, 0.0, 1.0)), 0.0), 28.0);\n    vec3 knobCol = vec3(0.36, 0.19, 0.09) * (0.28 + 0.9 * kdiff) + vec3(1.0, 0.9, 0.75) * 0.55 * kspec;\n    knobCol *= 0.9 + 0.2 * sin(kq.x * 11.0 + kq.y * 4.0 + 2.0 * valueNoise(kq * 3.0));\n    col = mix(col, knobCol, 1.0 - smoothstep(1.0 - 1.2 * pxs / KNOB_R, 1.0, kr));\n  }\n\n  // ---- the paw ----\n  float pawD = catPaw(p, paw, fwd, pawScale, knead);\n  if (pawD \u003c 0.02) {\n    float e = 0.0025;\n    vec2 grad = vec2(\n      catPawBody(p + vec2(e, 0.0), paw, fwd, pawScale, knead) - catPawBody(p - vec2(e, 0.0), paw, fwd, pawScale, knead),\n
