<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float n(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x),
               mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fb(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.866, 0.5, -0.5, 0.866);
    for (float i = 0.0; i < 5.0; i++) { v += a * n(p); p = m * p * 2.01; a *= 0.49; }
    return v;
}

float fl(vec2 p, float t) {
    vec2 q = vec2(fb(p + vec2(1.7, 9.2) + t * 0.15), fb(p + vec2(8.3, 2.8) + t * 0.12));
    vec2 r = vec2(fb(p + 4.0 * q + vec2(0.3, 2.5) + t * 0.08), fb(p + 4.0 * q + vec2(3.7, 7.1) + t * 0.06));
    return fb(p + 4.0 * r + t * 0.03);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0), ph = t / 60.0;

    vec2 c = vec2(sin(t * 0.02) * 0.02, 0.06 - ph * 0.04);
    float d = length(uv - c), a = atan(uv.y - c.y, uv.x - c.x);

    float sp = 0.06 + smoothstep(0.0, 0.3, ph) * 0.55;
    float fg = 0.0;
    for (float i = 0.0; i < 9.0; i++) {
        float fr = 1.5 + i * 1.7, p0 = h(vec2(i * 17.3, 3.1)) * 6.283;
        float am = 0.15 / (1.0 + i * 0.35) * smoothstep(0.05, 0.3 + i * 0.05, ph);
        fg += am * sin(a * fr + p0 + t * 0.04 * (1.0 + i * 0.3));
    }

    float pd = d - fg * sp;
    float env = smoothstep(sp + 0.12, max(0.01, sp * 0.08), pd);

    float f0 = fl(uv * 3.0, t * 0.08);
    float f1 = fl((uv - c) * 2.0 + vec2(t * 0.01, -t * 0.015), t * 0.05);
    float oe = smoothstep(sp + 0.45, sp + 0.05, d);

    float co = env * (0.2 + 0.8 * f0) + f1 * oe * 0.2 * smoothstep(0.0, 0.2, ph);
    co += smoothstep(0.15, 0.0, d) * smoothstep(0.0, 0.05, ph) * 0.5 * (1.0 - ph * 0.8);
    co = clamp(co, 0.0, 1.0);

    float edge = co * (1.0 - co) * 4.0;
    float bio = edge * (0.4 + 0.8 * fb(uv * 10.0 + t * 0.06));
    float ft = 0.0;
    for (float i = 0.0; i < 9.0; i++) {
        float fr = 1.5 + i * 1.7, p0 = h(vec2(i * 17.3, 3.1)) * 6.283;
        ft += abs(cos(a * fr + p0 + t * 0.04 * (1.0 + i * 0.3)));
    }
    bio += ft / 9.0 * edge * 1.5;

    float pulse = 1.0 + 0.25 * sin(t * 0.7) + 0.15 * sin(t * 1.3);
    vec3 water = vec3(0.006, 0.015, 0.045) + vec3(0.003, 0.002, 0.005) * sin(t * 0.08);
    vec3 ink = vec3(0.01, 0.003, 0.02);

    vec3 col = mix(water, ink, co);

    float av = 0.5 + 0.5 * sin(a * 3.0 + t * 0.1);
    vec3 g = mix(vec3(0.05, 0.45, 0.65), vec3(0.15, 0.6, 0.4), av);
    g = mix(g, vec3(0.35, 0.08, 0.3), 0.2 + 0.15 * sin(a * 5.0 - t * 0.15));

    col += g * bio * 3.0 * pulse;
    col += vec3(0.03, 0.01, 0.05) * co * co * (1.0 + 0.5 * sin(t * 0.3));
    col += vec3(0.004, 0.01, 0.018) * n(uv * 15.0 + t * 0.03) * (1.0 - co);
    col *= 0.7 + 0.3 * smoothstep(0.9, 0.3, length(uv));
    col = pow(col, vec3(0.9));
    col *= smoothstep(0.0, 5.0, t) * smoothstep(60.0, 52.0, t);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 65;
  Tone.Transport.bpm.value = bpm;

  const mainReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await mainReverb.generate();
  const darkDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(mainReverb);
  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 200, Q: 1.0 }).toDestination();
  const waterFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 2.0 }).connect(mainReverb);
  const hiPass = new Tone.Filter({ type: "highpass", frequency: 300 }).connect(darkDelay);

  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(waterFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.6, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -18;

  const padChords = [
    ["F#2", "C#3", "F#3"],
    ["D2", "A2", "D3"],
    ["E2", "B2", "E3"],
    ["F#2", "A2", "C#3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 16) {
      pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1m", time, 0.15 + Math.min(bar, 10) * 0.01);
      chordIdx++;
    }
  }, "1m").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 2.5, sustain: 0, release: 1.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 0.5 }
  }).connect(darkDelay);
  bell.volume.value = -22;

  const bellNotes = ["F#4", "C#5", "A4", "E5", "B4", "F#5", "D5", "A5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 15 && Math.random() > 0.4) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.3 + Math.random() * 0.2);
      bellIdx++;
    }
  }, "2n").start(0);

  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 0.5, sustain: 0.7, release: 1.5 },
    filterEnvelope: { attack: 0.1, decay: 0.3, sustain: 1, baseFrequency: 60, octaves: 1 }
  }).connect(subFilter);
  sub.volume.value = -12;

  const subNotes = ["F#1", "F#1", "D1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 14) {
      sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1m", time, 0.6);
      subIdx++;
    }
  }, "1m").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 400, Q: 3.0 }).connect(hiPass);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(arpFilter);
  arp.volume.value = -20;

  const arpScale = [54, 56, 57, 59, 61, 62, 64, 66];
  let arpStep = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 14) {
      const progress = (bar - 6) / 8;
      if (Math.random() < 0.6 + progress * 0.3) {
        const degree = arpScale[arpStep % arpScale.length];
        const octShift = Math.random() > 0.7 ? 12 : 0;
        arp.triggerAttackRelease(Tone.Frequency(degree + octShift, "midi"), "16n", time, 0.25 + progress * 0.15);
      }
      arpStep++;
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2400, time + 4 * (60 / bpm) * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(400, time + 2 * (60 / bpm) * 4);
  }, "12:0:0");

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 0.5 }).connect(mainReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  }).connect(noiseFilter);
  noise.volume.value = -30;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 15) {
      noise.triggerAttackRelease("2m", time);
    }
  }, "2m").start(0);

  const pluck = new Tone.PluckSynth({ resonance: 0.95, release: 1.5, dampening: 3000 }).connect(darkDelay);
  pluck.volume.value = -24;

  const pluckNotes = ["F#5", "C#6", "A5", "E6"];
  let pluckIdx = 0;
  const pluckLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 14 && Math.random() > 0.6) {
      pluck.triggerAttack(pluckNotes[pluckIdx % pluckNotes.length], time);
      pluckIdx++;
    }
  }, "4n").start(0);

  window.toneJsInstruments = { pad, bell, sub, arp, noise, pluck };
  window.toneJsParts = { padLoop, bellLoop, subLoop, arpLoop, noiseLoop, pluckLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
