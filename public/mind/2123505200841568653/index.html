<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');

(() => {
  // GHOST STRIPES. A black cat asleep on floorboards in a window's sunbeam, seen from straight above.
  // Black is one switch (non-agouti, a/a) painting over a pattern that is still there. The pattern is computed
  // here, on the cat's own body: Turing's two-chemical reaction-diffusion (Gray-Scott form) on a grid laid along
  // the spine, spreading six times faster around the body than along it. Nothing about the stripes is drawn by hand.
  const W = 900, H = 900, DURATION = 60, BPM = 120, BAR = 240 / BPM, BARS = DURATION / BAR;

  // ------------------------------------------------------------------ seeded PRNG and value noise (setup only)
  let seed = 1952;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const keys = (table, x) => {
    if (x <= table[0][0]) return table[0][1];
    for (let i = 1; i < table.length; i++) if (x <= table[i][0]) return lerp(table[i - 1][1], table[i][1], smooth(table[i - 1][0], table[i][0], x));
    return table[table.length - 1][1];
  };
  const NOISE_N = 256;
  const lattice = new Float32Array(NOISE_N * NOISE_N);
  for (let i = 0; i < lattice.length; i++) lattice[i] = rnd();
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const i0 = xi & 255, i1 = (xi + 1) & 255, j0 = (yi & 255) * NOISE_N, j1 = ((yi + 1) & 255) * NOISE_N;
    const a = lattice[j0 + i0], b = lattice[j0 + i1], c = lattice[j1 + i0], d = lattice[j1 + i1];
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  };

  // ------------------------------------------------------------------ the coat: Turing's equations on the body
  // Body coordinates in "coat units": s runs 0 (nose) .. 1080 (tail tip); n runs across the coat.
  const CELL = 4.5, NS = 240, NN = 56, COAT_L = NS * CELL;
  const PROFILE = [[0, 0], [14, 40], [50, 66], [95, 70], [125, 56], [160, 60], [260, 100], [480, 112], [570, 118], [640, 84], [700, 30], [750, 18], [1000, 12], [1068, 6], [1080, 0]];
  const halfW = (sp) => {
    if (sp <= 0) return 0;
    for (let i = 1; i < PROFILE.length; i++) if (sp <= PROFILE[i][0]) {
      const [a, wa] = PROFILE[i - 1], [b, wb] = PROFILE[i];
      const x = (sp - a) / (b - a), e = x * x * (3 - 2 * x);
      return wa + (wb - wa) * e;

  const SIM = { F: 0.030, K: 0.057, Du: 0.16, Dv: 0.08, anis: 6, steps: 3600, seeds: 90 };
  const N2 = NS * NN;

  for (let i = 0; i < NS; i++) { const w = halfW((i + 0.5) * CELL); for (let j = 0; j < NN; j++) mask[i * NN + j] = Math.abs((j + 0.5 - NN / 2) * CELL) < w + CELL ? 1 : 0; }
  const fLocal = new Float32Array(N2);
  for (let i = 0; i < NS; i++) for (let j = 0; j < NN; j++) {
    fLocal[i * NN + j] = SIM.F * (1 + 0.1 * (vnoise(i * 0.08 + 40, j * 0.08 + 9) - 0.5));
  }
  const wS = new Float32Array(NS), wN = new Float32Array(NS);
  for (let i = 0; i < NS; i++) {
    // faster across the body than along it, so bands form across it (mackerel); the head flips, so its lines run lengthways
    const head = 1 - smooth(120, 170, i * CELL);
    const a = lerp(1, SIM.anis, 1 - head), b = lerp(1, SIM.anis, head);

    const ci = Math.floor(rnd() * NS), cj = Math.floor(NN / 2 + (rnd() - 0.5) * NN * 0.7), amp = 0.25 + rnd() * 0.05;
    seedList.push([ci, cj]);
    for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) {

      if (w > 0 && i >= 0 && i < NS && j >= 0 && j < NN) { u[i * NN + j] = lerp(u[i * NN + j], 0.5, w); v[i * NN + j] = Math.max(v[i * NN + j], amp * w); }
    }

  const snapAt = Array.from({ length: NSNAP }, (_, k) => Math.round(SIM.steps * Math.pow(k / (NSNAP - 1), 2.4)));

  const t0 = performance.now();
  let next = 0;
  for (let st = 0; st <= SIM.steps; st++) {

      for (let j = 0; j < NN; j++) {

        const a = mask[im * NN + j] ? im * NN + j : id, b = mask[ip * NN + j] ? ip * NN + j : id;

        const uc = u[id], vc = v[id];
        const lu = ws * (u[a] + u[b] - 2 * uc) + wn * (u[c] + u[d] - 2 * uc);
        const lv = ws * (v[a] + v[b] - 2 * vc) + wn * (v[c] + v[d] - 2 * vc);
        const uvv = uc * vc * vc, F = fLocal[id];
        u2[id] = uc + SIM.Du * lu - uvv + F * (1 - uc);
        v2[id] = vc + SIM.Dv * lv + uvv - (F + SIM.K) * vc;
      }
    }
    let t = u; u = u2; u2 = t; t = v; v = v2; v2 = t;
  }
  const simMs = performance.now() - t0;
  const vFinal = snaps[NSNAP - 1];
  const vCur = new Float32Array(N2);

  // ------------------------------------------------------------------ the curled body, seen from above
  // Each limb is a tube along a spine polyline: projected half-width wp, raised height hp, resting height z0.
  // From straight above, the visible surface at a pixel is the highest tube there.
  const CX = 452, CY = 470;
  const limbs = [];
  const buildSpine = (x0, y0, th0, len, kappa, step) => {
    const pts = [];
    let x = x0, y = y0, th = th0;
    for (let s = 0; s <= len + 1e-6; s += step) {
      pts.push({ x, y, th, s });
      const k = kappa(s);
      th += k * step;
      x += Math.cos(th) * step;
      y += Math.sin(th) * step;
    }
    return pts;
  };
  // The torso is a closed ring about (RCX, RCY); the head lies in its middle with its nose in its own flank;
  // the tail wraps the outside. Each spine is a Catmull-Rom curve through points tagged with their coat position s.
  const RCX = 474, RCY = 468, RR = 124;
  const Z = 1.3, ZX = 450 - RCX * Z, ZY = 452 - RCY * Z; // scene -> screen
  const ring = (deg) => [RCX + RR * Math.cos(deg * Math.PI / 180), RCY + RR * Math.sin(deg * Math.PI / 180)];
  const curve = (P) => {
    const cr = (p0, p1, p2, p3, f) => {
      const f2 = f * f, f3 = f2 * f;
      return 0.5 * (2 * p1 + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2 + (-p0 + 3 * p1 - 3 * p2 + p3) * f3);
    };
    const dense = [];
    for (let i = 0; i < P.length - 1; i++) {
      const P0 = P[Math.max(0, i - 1)], P1 = P[i], P2 = P[i + 1], P3 = P[Math.min(P.length - 1, i + 2)];
      for (let k = 0; k < 400; k++) {
        const f = k / 400;
        dense.push({ s: cr(P0[0], P1[0], P2[0], P3[0], f), x: cr(P0[1], P1[1], P2[1], P3[1], f), y: cr(P0[2], P1[2], P2[2], P3[2], f) });
      }
    }
    const last = P[P.length - 1];
    dense.push({ s: last[0], x: last[1], y: last[2] });
    const pts = [];
    let acc = 0, nextAt = 0;
    for (let i = 0; i < dense.length; i++) {
      if (i > 0) acc += Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y);
      if (acc >= nextAt || i === dense.length - 1) {
        const j = Math.min(dense.length - 1, i + 1), h = Math.max(0, i - 1);
        pts.push({ x: dense[i].x, y: dense[i].y, s: dense[i].s, th: Math.atan2(dense[j].y - dense[h].y, dense[j].x - dense[h].x) });
        nextAt += 1.2;
      }
    }
    return pts;
  };
  const headW = (s) => 80 * Math.sqrt(Math.max(0, 1 - Math.pow((s - 84) / 86, 2))) * (0.78 + 0.22 * smooth(0, 70, s));
  const coatOf = (s, q) => [s / CELL, NN / 2 + (Math.asin(Math.max(-1, Math.min(1, q))) / (Math.PI / 2)) * halfW(s) / CELL];
  limbs.push({
    name: 'body',
    pts: curve([
      [150, ...ring(138)], [210, ...ring(190)], [280, ...ring(246)], [370, ...ring(303)], [470, ...ring(358)], [560, ...ring(52)], [640, ...ring(110)],
      [700, 380, 602], [780, 302, 588], [870, 250, 512], [960, 250, 414], [1030, 288, 342], [1080, 330, 304]
    ]),
    wp: (s) => halfW(s) * (s < 660 ? 0.86 : 0.95) * (0.3 + 0.7 * smooth(150, 235, s)),
    hp: (s) => halfW(s) * (s < 660 ? 0.8 : 0.9) * (0.3 + 0.7 * smooth(150, 235, s)),
    z0: () => 0,
    coat: coatOf
  });
  limbs.push({
    name: 'head',
    pts: curve([[0, 500, 560], [80, 486, 482], [160, 468, 402]]),
    // a rounded skull: broad over the cheeks and ears, a blunt muzzle, a round back
    wp: (s) => headW(s),
    hp: (s) => headW(s) * 0.9,
    z0: () => 30,
    coat: coatOf
  });
  const body = limbs[1];
  const bodyAt = (s) => {
    let best = body.pts[0];
    body.pts.forEach((p) => { if (Math.abs(p.s - s) < Math.abs(best.s - s)) best = p; });
    return best;
  };
  const bodyPoint = (s, q) => {
    // screen point on the body at coat position s and signed fraction q of the half-width (q > 0 is the left side)
    const p = bodyAt(s), w = body.wp(s) * q;
    return { x: p.x - Math.sin(p.th) * w, y: p.y + Math.cos(p.th) * w, th: p.th };
  };
  // ears: flaps at the back corners of the skull, pointing out and back
  [1, -1].forEach((side) => {
    const base = bodyPoint(118, 0.6 * side);
    const th = base.th + side * 0.62;
    const EL = 76;
    const pts = buildSpine(base.x, base.y, th, EL, () => 0, 1);
    limbs.push({
      name: side > 0 ? 'earL' : 'earR', pts,
      wp: (s) => 31 * Math.pow(1 - s / (EL + 1), 1.15),
      hp: (s) => 10 * (1 - s / 70),
      z0: (s) => 92 - s * 1.0,
      inner: (s, q) => smooth(0.75, 0.35, Math.abs(q)) * smooth(EL * 0.85, EL * 0.4, s) * smooth(0, 8, s),
      coat: (s, q) => [(98 - s * 0.3) / CELL, NN / 2 + side * (44 + s * 0.4) / CELL + q * 1.5]
    });
  });
  // ------------------------------------------------------------------ per-pixel maps
  const NPX = W * H;
  const limbId = new Int8Array(NPX).fill(-1);
  const coatI = new Float32Array(NPX), coatJ = new Float32Array(NPX), height = new Float32Array(NPX), innerEar = new Float32Array(NPX);
  const t1 = performance.now();
  limbs.forEach((L, li) => {
    // bounding box
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, wmax = 0;
    L.pts.forEach((p) => { const w = L.wp(p.s); wmax = Math.max(wmax, w); x0 = Math.min(x0, p.x - w); y0 = Math.min(y0, p.y - w); x1 = Math.max(x1, p.x + w); y1 = Math.max(y1, p.y + w); });
    x0 = Math.max(0, Math.floor(x0 * Z + ZX)); y0 = Math.max(0, Math.floor(y0 * Z + ZY)); x1 = Math.min(W - 1, Math.ceil(x1 * Z + ZX)); y1 = Math.min(H - 1, Math.ceil(y1 * Z + ZY));
    const P = L.pts.length, PX = new Float32Array(P), PY = new Float32Array(P), CS = new Float32Array(P), SN = new Float32Array(P), WP = new Float32Array(P), HP = new Float32Array(P), Z0 = new Float32Array(P);
    L.pts.forEach((p, k) => { PX[k] = p.x; PY[k] = p.y; CS[k] = Math.cos(p.th); SN[k] = Math.sin(p.th); WP[k] = L.wp(p.s); HP[k] = L.hp(p.s); Z0[k] = L.z0(p.s); });
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = (x + 0.5 - ZX) / Z, py = (y + 0.5 - ZY) / Z;
      let best = -1, bestH = -1, bestQ = 0;
      for (let k = 0; k < P; k++) {
        const dx = px - PX[k];
        const w = WP[k];
        if (dx > w || dx < -w) continue;
        const dy = py - PY[k];
        if (dy > w || dy < -w) continue;
        // distance across the spine (along its normal) and along it
        const along = dx * CS[k] + dy * SN[k];
        if (along > 2.0 || along < -2.0) continue;
        const across = -dx * SN[k] + dy * CS[k];
        const q = across / w;
        if (q >= 1 || q <= -1) continue;
        const h = Z0[k] + HP[k] * Math.sqrt(1 - q * q);
        if (h > bestH) { bestH = h; best = k; bestQ = q; }
      }
      if (best < 0) continue;
      const id = y * W + x;
      if (bestH * Z <= height[id] && limbId[id] >= 0) continue;
      height[id] = bestH * Z;
      limbId[id] = li;
      const c = L.coat(L.pts[best].s, bestQ);
      coatI[id] = c[0]; coatJ[id] = c[1];
      innerEar[id] = L.inner ? L.inner(L.pts[best].s, bestQ) : 0;
    }
  });
  // fill pinholes left by the along-spine slab test (a pixel between two samples on the outside of a bend)
  for (let pass = 0; pass < 4; pass++) for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const id = y * W + x;
    if (limbId[id] >= 0) continue;
    let n = 0, hs = 0, ci = 0, cj = 0, lid = -1;
    for (const o of [-1, 1, -W, W]) { const k = id + o; if (limbId[k] >= 0) { n++; hs += height[k]; ci += coatI[k]; cj += coatJ[k]; lid = limbId[k]; } }
    if (n >= 3) { limbId[id] = lid; height[id] = hs / n; coatI[id] = ci / n; coatJ[id] = cj / n; }
  }
  // normals from the height map, crease occlusion from a blurred height map
  const nx = new Float32Array(NPX), ny = new Float32Array(NPX), nz = new Float32Array(NPX), occ = new Float32Array(NPX).fill(1);
  const hs = Float32Array.from(height);
  for (let pass = 0; pass < 3; pass++) {
    const src = Float32Array.from(hs);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const id = y * W + x;
      if (limbId[id] < 0) continue;
      hs[id] = (src[id] * 4 + src[id - 1] + src[id + 1] + src[id - W] + src[id + W]) / 8;
    }
  }
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const id = y * W + x;
    const gx = (hs[id + 2] - hs[id - 2]) * 0.25, gy = (hs[id + 2 * W] - hs[id - 2 * W]) * 0.25;
    const l = Math.hypot(gx, gy, 1);
    nx[id] = -gx / l; ny[id] = -gy / l; nz[id] = 1 / l;
  }
  {
    const R = 14, tmp = new Float32Array(NPX), blur = new Float32Array(NPX);
    for (let y = 0; y < H; y++) { let acc = 0; for (let x = -R; x < W + R; x++) { const xa = Math.min(W - 1, Math.max(0, x)); acc += height[y * W + xa]; const xr = x - 2 * R - 1; if (xr >= -R) acc -= height[y * W + Math.min(W - 1, Math.max(0, xr))]; if (x - R >= 0 && x - R < W) tmp[y * W + x - R] = acc / (2 * R + 1); } }
    for (let x = 0; x < W; x++) { let acc = 0; for (let y = -R; y < H + R; y++) { const ya = Math.min(H - 1, Math.max(0, y)); acc += tmp[ya * W + x]; const yr = y - 2 * R - 1; if (yr >= -R) acc -= tmp[Math.min(H - 1, Math.max(0, yr)) * W + x]; if (y - R >= 0 && y - R < H) blur[(y - R) * W + x] = acc / (2 * R + 1); } }
    for (let id = 0; id < NPX; id++) occ[id] = 1 - 0.75 * smooth(0, 34, blur[id] - height[id]);
  }

  // ------------------------------------------------------------------ the sun: fixed direction, so shadows are fixed too
  const SUN_AZ = Math.atan2(-0.62, -0.78); // toward the window, up and to the left
  const SUN_EL = 0.82;                      // radians above the floor
  const sdx = Math.cos(SUN_AZ), sdy = Math.sin(SUN_AZ), rise = Math.tan(SUN_EL);
  const Lx = sdx * Math.cos(SUN_EL), Ly = sdy * Math.cos(SUN_EL), Lz = Math.sin(SUN_EL);
  const sunVis = new Float32Array(NPX).fill(1);
  const pfx = new Float32Array(NPX), pfy = new Float32Array(NPX);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = y * W + x, h = height[id];
    // where the sun ray through this point meets the floor: the beam's gate is evaluated there
    pfx[id] = x + sdx * h / rise; pfy[id] = y + sdy * h / rise;
    let minD = 1e9;
    for (let k = 1; k <= 22; k++) {
      const d = k * 6, qx = Math.round(x + sdx * d), qy = Math.round(y + sdy * d);
      if (qx < 0 || qy < 0 || qx >= W || qy >= H) break;
      const diff = (h + d * rise) - height[qy * W + qx];

    sunVis[id] = smooth(-18, 5, minD);
  }

  // ------------------------------------------------------------------ the floor
  const BOARD_ANG = 0.21, bc = Math.cos(BOARD_ANG), bs = Math.sin(BOARD_ANG), BOARD_W = 92;
  const floorR = new Float32Array(NPX), floorG = new Float32Array(NPX), floorB = new Float32Array(NPX);
  const grain = new Float32Array(NPX);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = y * W + x;
    const u1 = x * bc + y * bs, v1 = -x * bs + y * bc + 2000;
    const board = Math.floor(v1 / BOARD_W), fv = v1 / BOARD_W - board;
    const tone = 0.82 + 0.3 * lattice[(board * 37) & 0xffff & (lattice.length - 1)];
    const joint = Math.floor((u1 + 3000 + lattice[(board * 11) & 0xffff] * 700) / 640);
    const ju = (u1 + 3000 + lattice[(board * 11) & 0xffff] * 700) / 640 - joint;
    const g = vnoise(u1 * 0.012 + board * 13, v1 * 0.32) * 0.6 + vnoise(u1 * 0.05, v1 * 0.9 + board * 7) * 0.4;
    const streak = 0.78 + 0.32 * g;
    const gap = Math.min(smooth(0, 0.022, fv), smooth(0, 0.022, 1 - fv), smooth(0, 0.004, ju), smooth(0, 0.004, 1 - ju));
    const a = tone * streak * (0.25 + 0.75 * gap);
    floorR[id] = 0.40 * a; floorG[id] = 0.25 * a; floorB[id] = 0.13 * a;
    grain[id] = rnd();
  }

  // ------------------------------------------------------------------ the window's beam on the floor
  // A tall four-pane window, off frame to the upper left, projected down and to the right by a low sun. In floor
  // coordinates the beam is a parallelogram origin + a*A + b*B, a, b in [0, 1]. The muntin cross is a = 1/2, b = 1/2.
  const BEAM_A = [-sdy * 300 + sdx * 40, sdx * 300 + sdy * 40];

    const CONFIG = JSON.parse("{\"code\":\"// BPM: 120\\n// DURATION: 60\\n// FORM: the nap 0-12 | the light 12-16 | the answer 16-22 | painted over 22-24 | one look 24-28 | the nap again 28-30\\n// TONAL CENTER: Ab major\\n// MOTIF: the activator, a marimba sixteenth figure Eb5 Ab4 C5 Eb5 F5 Eb5 C5 on sixteenths 0, 2, 3, 5, 7, 8 and 10. Under the black it is muffled; in the answer it is rebuilt two notes per bar while the stripes grow\\n// HARMONIC PLAN: Dbmaj9 | Cm9 | Fm9 | Eb9sus4, one four-bar loop all the way through, voiced on a soft electric piano with the bass on the roots\\n// GROOVE: warm minimalist house on a TR-909: four on the floor, closed hats on the off-beats, claps on 2 and 4 from bar 8, and snare ghost notes on sixteenths 3, 6, 11 and 14 that are barely there while the cat is black and become full hits while the coat is shown\\n//\\n// Turing's two chemicals as two voices: a fast, short-range activator (the marimba) and a slow, wide inhibitor (the pad).\\n// The picture and this score share one clock: bars of 2 s, the beam, the flood, the paint, the solve and the eye all land on these bars.\\n\\nsamples('https://strudel.b-cdn.net/tidal-drum-machines.json')\\n\\nconst BARS = 30;\\nconst SEMI = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };\\nconst hz = (name) => {\\n  const m = name.match(/^([A-G](?:#|b)?)(-?\\\\d)$/);\\n  return 440 * Math.pow(2, (SEMI[m[1]] + 12 * (Number(m[2]) + 1) - 69) / 12);\\n};\\nconst lane = () => Array.from({ length: BARS }, () => []);\\n// an event at a bar and a beat of it, lenBeats long\\nconst put = (L, bar, beat, lenBeats, v) => {\\n  let b = bar + Math.floor(beat / 4), bt = beat - Math.floor(beat / 4) * 4;\\n  b = ((b % BARS) + BARS) % BARS;\\n  const a = bt / 4;\\n  L[b].push(pure(v).compress(a, Math.min(0.9999, a + Math.max(lenBeats, 0.02) / 4)));\\n};\\nconst play = (L) => cat(...L.map((list) => (list.length ? stack(...list) : silenc ll hits while the coat shows\\n  const p = paint(bar);\\n  [3, 6, 11, 14].forEach((six) => drum(bar, six / 4, 'sd', 3, 0.04 + 0.16 * p, { cutoff: 1800 + 6000 * p }));\\n  // sixteenth shaker from bar 8, a ride on the quarters in the answer\\n  if (bar >= 8) for (let six = 0; six \u003c 16; six++) put(KIT, bar, six / 4 + 0.02, 0.2, { s: 'sh', bank: 'RolandTR808', n: 0, gain: six % 4 === 2 ? 0.08 : 0.045, cutoff: hatCut, orbit: 1 });\\n  if (ANSWER(bar)) for (let beat = 0; beat \u003c 4; beat++) drum(bar, beat, 'rd', 0, 0.07);\\n}\\n// a snare roll into the drop\\nfor (let six = 0; six \u003c 16; six++) drum(15, six / 4, 'sd', 1, 0.05 + six * 0.012, { cutoff: 2500 + six * 300 });\\ndrum(16, 0, 'cr', 0, 0.18);\\ndrum(24, 0, 'cr', 1, 0.08, { cutoff: 2500 });\\n\\n// ------------------------------------------------------------------ the chord loop: Dbmaj9 | Cm9 | Fm9 | Eb9sus4\\nconst LOOP = [\\n  { root: 'Db2', keys: ['F3', 'Ab3', 'C4', 'Eb4'] },\\n  { root: 'C2', keys: ['Eb3', 'G3', 'Bb3', 'D4'] },\\n  { root: 'F2', keys: ['Ab3', 'C4', 'Eb4', 'G4'] },\\n  { root: 'Eb2', keys: ['Ab3', 'Bb3', 'Db4', 'F4'] }\\n];\\nconst chordOf = (bar) => LOOP[bar % 4];\\n\\n// bass: house off-beat eighths on the root, a pickup on the last sixteenth\\nfor (let bar = 0; bar \u003c BARS; bar++) {\\n  const { root } = chordOf(bar), f = hz(root), look = inRange(bar, 24, 28), breakdown = inRange(bar, 14, 16);\\n  if (breakdown) continue;\\n  const hits = look ? [0, 2.5] : [0.5, 1.5, 2.5, 3.5];\\n  hits.forEach((beat) => {\\n    put(LOW, bar, beat + 0.03, look ? 1.6 : 0.42, { s: 'sine', freq: f, attack: 0.006, decay: 0.2, sustain: 0.7, release: 0.06, gain: 0.3, orbit: 2 });\\n    put(LOW, bar, beat + 0.035, look ? 1.2 : 0.32, { s: 'sawtooth', freq: f * 2, cutoff: 1000, attack: 0.006, decay: 0.12, sustain: 0.4, release: 0.05, gain: 0.19, orbit: 2 });\\n  });\\n  if (!look && bar !== 13 && bar !== 29) {\\n    const next = chordOf(bar + 1).root;\\n    put(LOW, bar, 3.75 + 0.03, 0.2, { s: 'sine', freq: hz(next) * 2, attack: 0.004, decay: 0.12, sustain: 0.3, release: 0.04, gain: 0.22, orbit: 2 });\\n  }\\n}\\n\\n// electric piano: one held chord and an answering stab per bar; muffled under the black, open while the coat shows\\nfor (let bar = 0; bar \u003c BARS; bar++) {\\n  const { keys } = chordOf(bar), p = paint(bar), look = inRange(bar, 24, 28);\\n  const cutoff = 900 + 2600 * p;\\n  const g = look ? 0.15 : 0.2;\\n  keys.forEach((name, i) => {\\n    const f = hz(name);\\n    put(KEYS, bar, 0.04 + i * 0.012, 1.6, { s: 'triangle', freq: f, cutoff, attack: 0.01, decay: 0.9, sustain: 0.35, release: 0.35, gain: g, orbit: 3, room: 0.22, roomsize: 2 });\\n    put(KEYS, bar, 0.04 + i * 0.012, 1.6, { s: 'sine', freq: f * 2, attack: 0.004, decay: 0.25, sustain: 0, release: 0.2, gain: g * 0.35, orbit: 3 });\\n    if (!look && bar !== BARS - 1) put(KEYS, bar, 2.5 + 0.03 + i * 0.01, 0.6, { s: 'triangle', freq: f, cutoff, attack: 0.008, decay: 0.3, sustain: 0.2, release: 0.2, gain: g * 0.75, orbit: 3, room: 0.22, roomsize: 2 });\\n  });\\n}\\n\\n// ------------------------------------------------------------------ the activator: the marimba hook\\nconst HOOK_SIX = [0, 2, 3, 5, 7, 8, 10];\\nconst HOOK_NOTES = ['Eb5', 'Ab4', 'C5', 'Eb5', 'F5', 'Eb5', 'C5'];\\nconst ANSWER_NOTES = ['Ab5', 'G5', 'Eb5', 'F5', 'Eb5', 'C5', 'Bb4'];\\nconst mallet = (bar, six, name, gain, cutoff, wet = 0.18) => {\\n  const f = hz(name), bright = 0.25 + 0.75 * paint(bar);\\n  put(HOOK, bar, six / 4 + 0.012, 0.6, { s: 'sine', freq: f, attack: 0.002, decay: 0.32, sustain: 0, release: 0.08, gain, cutoff, orbit: wet ? 4 : 8, delay: wet, delaytime: 0.375, delayfeedback: 0.3 });\\n  put(HOOK, bar, six / 4 + 0.012, 0.15, { s: 'sine', freq: f * 4, attack: 0.001, decay: 0.045, sustain: 0, release: 0.02, gain: gain * 0.36 * bright, orbit: 4 });\\n  put(HOOK, bar, six / 4 + 0.012, 0.3, { s: 'triangle', freq: f, attack: 0.002, decay: 0.12, sustain: 0, release: 0.04, gain: gain * 0.5, cutoff, orbit: 4 });\\n};\\nfor (let bar = 0; bar \u003c BARS; bar++) {\\n  if (inRange(bar, 16, 17) || inRange(bar, 24, 28)) continue;\\n  const p = paint(bar);\\n  // under the black the figure is there but muffled; in the light it opens\\n  let count = 7;\\n  if (inRange(bar, 17, 21)) count = Math.min(7, (bar - 16) * 2); // the answer rebuilds it, two notes a bar, as the stripes grow\\n  const answerBar = bar === 21 || bar === 20;\\n  const notes = bar === 21 ? ANSWER_NOTES : HOOK_NOTES;\\n  const g = inRange(bar, 14, 16) ? 0.24 - (bar - 14) * 0.07 : 0.2 + 0.1 * p;\\n  // the last bar stops after the fifth note, dry, so nothing rings past 60 s\\n  if (bar === BARS - 1) count = 5;\\n  for (let i = 0; i \u003c count; i++) mallet(bar, HOOK_SIX[i], notes[i], g, 1100 + 5000 * p, bar === BARS - 1 ? 0 : 0.18);\\n  if (answerBar && bar === 20) for (let i = 0; i \u003c 4; i++) mallet(bar, 12 + i, ['Ab5', 'G5', 'F5', 'Eb5'][i], g * 0.7, 6100);\\n}\\n\\n// ------------------------------------------------------------------ the inhibitor: a slow, wide pad\\nconst pad = (bar, name, gain, cutoff, lenBeats = 4) => {\\n  const f = hz(name);\\n  [0, 0.12, -0.12].forEach((d, k) => put(AIR, bar, 0.02, lenBeats - 0.05, { s: 'sawtooth', freq: f * Math.pow(2, d / 12), cutoff, attack: 0.9, decay: 0.3, sustain: 0.85, release: 0.6, gain: gain * (k ? 0.7 : 1), orbit: 5, room: 0.35, roomsize: 3 }));\\n};\\nfor (let bar = 12; bar \u003c 28; bar++) {\\n  const { keys } = chordOf(bar);\\n  const swell = inRange(bar, 14, 16) ? 1.25 : inRange(bar, 24, 28) ? 0.9 : 0.75;\\n  const cutoff = bar \u003c 16 ? 700 + (bar - 12) * 300 : bar \u003c 22 ? 1800 : 900;\\n  [keys[0], keys[2]].forEach((name) => pad(bar, name, 0.08 * swell, cutoff));\\n}\\n// the riser: the beam widening to fill the room\\nput(AIR, 14, 0, 7.9, { s: 'white', gain: 0.06, bandf: 400, bandq: 0.6, bpenv: 4, bpattack: 3.8, bpdecay: 0.1, bpsustain: 1, attack: 3.6, decay: 0.1, sustain: 0.9, release: 0.05, orbit: 6 });\\n\\n// the look: the eyes open on bar 24.75, blink at 26.5, shut over 27.6-28\\n[['Ab5', 0], ['C6', 0.02], ['Eb6', 0.04]].forEach(([n, d]) => {\\n  const f = hz(n);\\n  put(AIR, 24, 3 + d, 4, { s: 'sine', freq: f, attack: 0.004, decay: 2.6, sustain: 0, release: 0.5, gain: 0.11, orbit: 7, room: 0.4, roomsize: 3 });\\n  put(AIR, 24, 3 + d, 0.3, { s: 'sine', freq: f * 3.01, attack: 0.002, decay: 0.3, sustain: 0, release: 0.1, gain: 0.03, orbit: 7 });\\n});\\nput(AIR, 26, 1.6, 0.25, { s: 'sine', freq: hz('Eb6'), attack: 0.002, decay: 0.18, sustain: 0, release: 0.05, gain: 0.07, orbit: 7, room: 0.3, roomsize: 2 });\\n[['Eb5', 2.4], ['C5', 3.1]].forEach(([n, beat]) => put(AIR, 27, beat, 1.4, { s: 'sine', freq: hz(n), attack: 0.004, decay: 1.2, sustain: 0, release: 0.3, gain: 0.08, orbit: 7, room: 0.4, roomsize: 3 }));\\n\\n$: play(KIT);\\n$: play(LOW);\\n$: play(KEYS);\\n$: play(HOOK);\\n$: play(AIR);\",\"bpm\":120,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.5,\"cycles\":30,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    // One shared promise: the start-up preload below and an early
    // __renderStrudelOffline() call (captureStrudelRender only waits for the
    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
