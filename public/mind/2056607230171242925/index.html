<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    vec2 uv0=uv;
    float t=iTime;
    float phase=mod(t,60.0)/60.0;
    float tau=6.28318;

    float sep=clamp(1.0-smoothstep(0.2,0.4,phase)+smoothstep(0.6,0.8,phase),0.0,1.0);
    float flare=pow(1.0-sep,2.5);
    float gAmt=smoothstep(0.56,0.63,phase)*(1.0-smoothstep(0.72,0.8,phase));
    float sr=smoothstep(0.56,0.63,phase)*(1.0-smoothstep(0.8,0.9,phase));
    float rr=smoothstep(0.56,0.88,phase)*1.4;
    float beat=0.85+0.15*pow(max(cos(t*7.54),0.0),8.0);
    float tf=exp(-pow((phase-0.4)*50.0,2.0))+exp(-pow((phase-0.6)*50.0,2.0));

    if(gAmt>0.01){
        float gh=hash(vec2(floor(uv.y*14.0),floor(t*7.0)));
        if(gh>0.91) uv.x+=(gh-0.91)*gAmt*2.8;
    }

    float ca=sin(phase*tau)*0.28;
    float cv=cos(phase*tau)*0.1;
    vec3 ro=vec3(0.0,0.0,5.5);
    vec3 rd=normalize(vec3(uv,-1.4));
    rd.xz=rot(ca)*rd.xz; ro.xz=rot(ca)*ro.xz;
    rd.yz=rot(cv)*rd.yz; ro.yz=rot(cv)*ro.yz;

    vec3 col=vec3(0.012,0.008,0.028);

    for(float i=0.0;i<64.0;i++){
        float d=0.2+i*0.1;
        vec3 p=ro+rd*d;
        float fade=exp(-d*0.2);

        vec3 grd=abs(fract(p*0.85)-0.5);
        float ex=min(min(max(grd.x,grd.y),max(grd.y,grd.z)),max(grd.x,grd.z));
        col+=vec3(0.06,0.045,0.1)*exp(-ex*55.0)*0.012*fade*(0.35+0.65*sep)*(0.7+0.3*beat);

        float zn=(p.z+3.5)/7.0;

        for(int tid=0;tid<3;tid++){
            float id=float(tid);
            float a=zn*4.0*3.14159+id*2.094+phase*tau*2.0;
            float rb=0.6+0.22*sin(zn*7.5+id*1.9+phase*tau);
            rb+=0.09*sin(zn*15.0+id*3.3+phase*tau*2.0);
            float r=sep*rb;
            vec2 tc=vec2(r*cos(a),r*sin(a));
            float dd=length(p.xy-tc);

            float core=exp(-dd*dd*350.0)*fade*0.14;
            float glow=exp(-dd*dd*50.0)*fade*0.035;
            float spk=step(0.97,hash(vec2(i*7.3+id,floor(phase*60.0+zn*5.0))))*0.25;

            vec3 tcol;
            if(tid==0) tcol=vec3(1.0,0.65,0.12);
            else if(tid==1) tcol=vec3(1.0,0.93,0.78);
            else tcol=vec3(0.18,0.78,1.0);

            col+=tcol*(core+glow+spk*exp(-dd*dd*200.0)*fade)*beat;
        }

        float fd=length(p.xy);
        col+=vec3(1.0,0.88,0.65)*flare*exp(-fd*fd*10.0)*fade*0.09;
        col+=vec3(0.6,0.8,1.0)*flare*exp(-fd*fd*45.0)*fade*0.05;
    }

    float rDist=abs(length(uv0)-rr);
    col+=vec3(0.7,0.82,1.0)*sr*exp(-rDist*rDist*180.0)*0.6;
    col+=vec3(1.0,0.92,0.72)*flare*exp(-dot(uv0,uv0)*3.5)*0.6;
    col+=vec3(0.4,0.35,0.25)*tf;

    if(gAmt>0.01){
        float sc=sin(uv0.y*55.0+t*22.0)*gAmt;
        col+=vec3(0.1,-0.03,0.07)*sc*0.5;
        float ch=hash(vec2(floor(gl_FragCoord.y*0.07),floor(t*4.5)));
        if(ch>0.93) col=mix(col,col.brg,gAmt*0.4);
    }

    col*=1.0-0.35*dot(uv0,uv0);
    col=col/(0.85+col);
    col=pow(col,vec3(0.88));

    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    var bpm = 72;
    Tone.Transport.bpm.value = bpm;
    var barSec = 60 / bpm * 4;
    var H = function(ms) { return Math.max(0, (Math.random() * ms * 2 - ms) / 1000); };

    var rev = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).toDestination();
    await rev.generate();
    var dly = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.32, wet: 0.22 }).connect(rev);
    var comp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.2 }).toDestination();
    var chr = new Tone.Chorus({ frequency: 0.5, delayTime: 4, depth: 0.5, wet: 0.25 }).connect(comp);
    chr.start();
    var filt = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(comp);

    var pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.0, decay: 0.4, sustain: 0.6, release: 2.0 },
        volume: -14
    }).connect(chr);

    var chords = [
        ["D3","F3","A3"], ["D3","F3","A3"], ["Bb2","D3","F3"], ["C3","E3","G3"],
        ["D3","A3","D4"], ["F3","A3","C4"], ["Bb2","F3","Bb3"], ["G2","Bb2","D3"],
        ["D3","F3","A3","D4"], ["D3","F3","A3","D4"], ["Bb2","D3","F3","Bb3"], ["C3","E3","G3","C4"],
        ["A2","C3","E3"], ["Bb2","D3","F3"], ["C3","E3","G3"], ["D3","F3","A3"],
        ["D3","F3","A3"], ["D3","F3","A3"]
    ];
    var padLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        var v = b >= 8 && b < 12 ? 0.38 : 0.26;
        pad.triggerAttackRelease(chords[b], "1n", time + H(10), v);
    }, "1n").start(0);

    var bell = new Tone.FMSynth({
        harmonicity: 3.5, modulationIndex: 10,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.0 },
        modulation: { type: "sine" },
        volume: -10
    }).connect(rev);

    var bellLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        if (b === 8) bell.triggerAttackRelease("D5", "2n", time + H(5), 0.45);
        if (b === 9) bell.triggerAttackRelease("F5", "2n", time + H(5), 0.3);
    }, "1n").start(0);

    var arpSynth = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.008, decay: 0.22, sustain: 0.06, release: 0.3 },
        volume: -12
    }).connect(dly);

    var arpSets = [
        ["D4","F4","A4","D5","A4","F4"],
        ["F4","A4","C5","F5","C5","A4"],
        ["Bb3","D4","F4","Bb4","F4","D4"],
        ["C4","E4","G4","C5","G4","E4"]
    ];
    var arpIdx = 0;
    var arpLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        if (b < 1 || b >= 15) { arpIdx++; return; }
        var notes = arpSets[Math.floor(b / 2) % arpSets.length];
        var vel = b >= 6 && b < 12 ? 0.5 : 0.28;
        arpSynth.triggerAttackRelease(notes[arpIdx % notes.length], "8n", time + H(8), vel);
        arpIdx++;
    }, "8n").start(0);

    var bass = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.3 },
        volume: -10
    }).connect(filt);

    var bassNotes = ["D2","D2","Bb1","C2","D2","F2","Bb1","G1",
                     "D2","D2","Bb1","C2","A1","Bb1","C2","D2","D2","D2"];
    var bassLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        bass.triggerAttackRelease(bassNotes[b], "2n", time + H(5), 0.6);
    }, "1n").start(0);

    var kick = new Tone.MembraneSynth({
        pitchDecay: 0.03, octaves: 5,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.02 },
        volume: -8
    }).toDestination();

    var kickCount = 0;
    var kickLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        if (b >= 2 && b < 16) {
            kick.triggerAttackRelease("C1", "8n", time + H(3), 0.75);
        }
        if (b === 8 && kickCount % 4 === 2) {
            bell.triggerAttackRelease("A5", "4n", time + H(5), 0.35);
        }
        kickCount++;
    }, "4n").start(0);

    var glitchNoise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 },
        volume: -20
    }).connect(rev);

    var glitchMetal = new Tone.MetalSynth({
        frequency: 380, harmonicity: 5.5, modulationIndex: 36,
        resonance: 4500,
        envelope: { attack: 0.001, decay: 0.07, release: 0.02 },
        volume: -22
    }).connect(rev);

    var glitchIdx = 0;
    var glitchLoop = new Tone.Loop(function(time) {
        var b = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec) % 18;
        if (b >= 10 && b < 14) {
            if (Math.random() > 0.45) {
                glitchNoise.triggerAttackRelease("32n", time + H(5));
            }
            if (glitchIdx % 3 === 0) {
                glitchMetal.triggerAttackRelease("32n", time + H(5), 0.25);
            }
        }
        glitchIdx++;
    }, "16n").start(0);

    Tone.Transport.schedule(function(time) {
        filt.frequency.linearRampToValueAtTime(2200, time + 4 * barSec);
    }, "4:0:0");
    Tone.Transport.schedule(function(time) {
        filt.frequency.linearRampToValueAtTime(500, time + 4 * barSec);
    }, "13:0:0");

    window.toneJsInstruments = { pad: pad, arpSynth: arpSynth, bass: bass, kick: kick, bell: bell, glitchNoise: glitchNoise, glitchMetal: glitchMetal };
    window.toneJsParts = { padLoop: padLoop, bellLoop: bellLoop, arpLoop: arpLoop, bassLoop: bassLoop, kickLoop: kickLoop, glitchLoop: glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
