<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float hash3(vec3 p) {
    return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for(int i = 0; i < 3; i++) {
        v += a * noise(p);
        p *= 2.1;
        a *= 0.5;
    }
    return v;
}

float glyph(vec2 p, float seed) {
    float d = 1.0;
    for(int i = 0; i < 4; i++) {
        float fi = float(i);
        float ang = seed * 6.283 + fi * 1.57;
        vec2 a = vec2(cos(ang), sin(ang)) * 0.3;
        vec2 b = vec2(cos(ang + 0.8), sin(ang + 0.8)) * 0.15;
        vec2 ab = b - a;
        vec2 ap = p - a;
        float t = clamp(dot(ap, ab) / dot(ab, ab), 0.0, 1.0);
        d = min(d, length(ap - ab * t));
    }
    float circle = abs(length(p) - 0.2 - 0.05 * sin(seed * 12.0));
    d = min(d, circle);
    return d;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;

    vec3 col = vec3(0.01, 0.005, 0.02);

    float gridScale = 4.0;
    vec2 gridUV = uv * gridScale;
    vec2 cellID = floor(gridUV);
    vec2 cellUV = fract(gridUV) - 0.5;

    float totalGlow = 0.0;
    vec3 totalColor = vec3(0.0);

    for(int dx = -2; dx <= 2; dx++) {
        for(int dy = -2; dy <= 2; dy++) {
            vec2 neighbor = cellID + vec2(float(dx), float(dy));
            float h = hash(neighbor);
            float h2 = hash(neighbor + vec2(43.0, 17.0));
            float h3 = hash(neighbor + vec2(91.0, 53.0));

            vec2 nodePos = (neighbor + 0.5) / gridScale;
            vec2 offset = vec2(
                sin(t * 0.3 * (h - 0.5) + h * 6.28) * 0.08,
                cos(t * 0.25 * (h2 - 0.5) + h2 * 6.28) * 0.08
            );
            nodePos += offset;

            vec2 delta = uv - nodePos;
            float dist = length(delta);

            float pulseSpeed = 0.4 + h * 0.6;
            float pulsePhase = t * pulseSpeed + h3 * 6.283;
            float brightness = 0.5 + 0.5 * sin(pulsePhase);

            float fadePhase = sin(pulsePhase * 0.7 + h * 3.14);
            float alive = smoothstep(-0.3, 0.3, fadePhase);

            float colorShift = t * 0.1 + h * 6.28 + fadePhase * 0.5;
            vec3 nodeCol = vec3(
                0.3 + 0.3 * sin(colorShift),
                0.2 + 0.3 * sin(colorShift + 2.09),
                0.4 + 0.4 * sin(colorShift + 4.18)
            );

            float decayColor = smoothstep(0.6, 0.0, alive);
            nodeCol = mix(nodeCol, vec3(0.15, 0.05, 0.1), decayColor * 0.7);

            float glow = exp(-dist * dist * 80.0) * brightness * (0.3 + alive * 0.7);
            float halo = exp(-dist * dist * 15.0) * 0.15 * alive;

            totalGlow += glow + halo;
            totalColor += nodeCol * (glow + halo);
        }
    }

    for(int dx = -2; dx <= 2; dx++) {
        for(int dy = -2; dy <= 2; dy++) {
            vec2 neighbor = cellID + vec2(float(dx), float(dy));

            for(int c = 0; c < 3; c++) {
                float fc = float(c);
                float ch = hash(neighbor + vec2(fc * 7.0, fc * 13.0));
                float ch2 = hash(neighbor + vec2(fc * 17.0 + 31.0, fc * 23.0));
                vec2 connDir = vec2(
                    floor(ch * 3.0) - 1.0,
                    floor(ch2 * 3.0) - 1.0
                );
                if(connDir.x == 0.0 && connDir.y == 0.0) connDir.x = 1.0;

                vec2 startNode = (neighbor + 0.5) / gridScale;
                vec2 endNode = (neighbor + connDir + 0.5) / gridScale;

                float sh = hash(neighbor);
                float eh = hash(neighbor + connDir);
                startNode += vec2(sin(t * 0.3 * (sh - 0.5) + sh * 6.28), cos(t * 0.25 * (hash(neighbor + vec2(43.0, 17.0)) - 0.5))) * 0.08;
                endNode += vec2(sin(t * 0.3 * (eh - 0.5) + eh * 6.28), cos(t * 0.25 * (hash(neighbor + connDir + vec2(43.0, 17.0)) - 0.5))) * 0.08;

                vec2 lineDir = endNode - startNode;
                vec2 toPoint = uv - startNode;
                float proj = clamp(dot(toPoint, lineDir) / dot(lineDir, lineDir), 0.0, 1.0);
                float lineDist = length(toPoint - lineDir * proj);

                float pulsePos = fract(t * 0.5 * (0.3 + ch * 0.4) + ch * 3.14);
                float pulseDist = abs(proj - pulsePos);
                float pulse = exp(-pulseDist * pulseDist * 60.0);

                float connAlive = sin(t * 0.4 + ch * 6.28) * 0.5 + 0.5;
                float strandGlow = exp(-lineDist * lineDist * 800.0) * 0.08 * connAlive;
                float pulseGlow = exp(-lineDist * lineDist * 1200.0) * pulse * 0.4 * connAlive;

                float hue = t * 0.05 + ch * 6.28 + proj * 2.0;
                vec3 strandCol = vec3(
                    0.2 + 0.2 * sin(hue),
                    0.15 + 0.2 * sin(hue + 2.09),
                    0.3 + 0.3 * sin(hue + 4.18)
                );

                vec3 pulseCol = vec3(
                    0.6 + 0.4 * sin(hue + t),
                    0.4 + 0.3 * sin(hue + t + 2.09),
                    0.7 + 0.3 * sin(hue + t + 4.18)
                );

                totalColor += strandCol * strandGlow + pulseCol * pulseGlow;
                totalGlow += strandGlow + pulseGlow;
            }
        }
    }

    for(int i = 0; i < 5; i++) {
        float fi = float(i);
        float gt = t * 0.15 + fi * 1.256;
        float gAlive = smoothstep(0.0, 0.3, sin(gt)) * smoothstep(1.0, 0.7, sin(gt));

        if(gAlive > 0.01) {
            vec2 gPos = vec2(
                sin(fi * 2.4 + t * 0.07) * 0.8,
                cos(fi * 1.7 + t * 0.09) * 0.5
            );

            float gScale = 12.0 + fi * 3.0;
            vec2 gUV = (uv - gPos) * gScale;
            float gd = glyph(gUV, fi + floor(t * 0.2 + fi));
            float glyphGlow = smoothstep(0.06, 0.0, gd) * gAlive * 0.25;

            vec3 glyphCol = vec3(0.5, 0.3, 0.8) + 0.2 * sin(vec3(fi * 1.1, fi * 2.3, fi * 0.7) + t * 0.3);
            totalColor += glyphCol * glyphGlow;
            totalGlow += glyphGlow;
        }
    }

    col += totalColor;

    float warpT = t * 0.08;
    vec2 warpUV = uv * 2.0 + vec2(warpT, warpT * 0.7);
    float field = fbm(warpUV + fbm(warpUV + warpT) * 0.5);
    col += vec3(0.05, 0.02, 0.08) * field;

    float vignette = 1.0 - dot(uv * 0.7, uv * 0.7);
    col *= smoothstep(0.0, 0.5, vignette);

    col = pow(col, vec3(0.9));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 64;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);

  const droneLPF = new Tone.Filter({ type: "lowpass", frequency: 400 }).connect(masterReverb);
  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.8, release: 3.0 }
  }).connect(droneLPF);
  drone.volume.value = -14;

  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(masterFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.5, release: 2.5 }
  }).connect(padChorus);
  pad.volume.value = -20;

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 2500 }).connect(masterDelay);
  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -16;

  const shimmerDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.5 }).connect(masterReverb);
  const shimmer = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.8 }
  }).connect(shimmerDelay);
  shimmer.volume.value = -22;

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).toDestination();
  subBass.volume.value = -18;

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 3000 }).connect(masterReverb);
  const hiss = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.3, release: 2.0 }
  }).connect(noiseHPF);
  hiss.volume.value = -28;

  const droneChords = [
    ["C2", "G2"],
    ["A1", "E2"],
    ["F1", "C2"],
    ["G1", "D2"]
  ];
  let droneIndex = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const chordIdx = Math.floor(bar / 4) % droneChords.length;
    drone.triggerAttackRelease(droneChords[chordIdx], "1m", time, 0.3);
    droneIndex++;
  }, "1m").start(0);

  const padVoicings = [
    ["C4", "E4", "G4", "B4"],
    ["A3", "C4", "E4", "G4"],
    ["F3", "A3", "C4", "E4"],
    ["G3", "B3", "D4", "F4"]
  ];
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = 20;
    const progress = bar / totalBars;

    if (bar < 2 || bar > 18) {
      padIndex++;
      return;
    }

    const vel = bar < 4 ? 0.1 : (bar > 16 ? 0.1 : 0.2);
    const chordIdx = Math.floor(bar / 4) % padVoicings.length;
    pad.triggerAttackRelease(padVoicings[chordIdx], "2n", time, vel);
    padIndex++;
  }, "2n").start(0);

  const bellScaleC = [60, 62, 64, 67, 69, 72, 74, 76];
  const bellScaleA = [57, 60, 62, 64, 67, 69, 72, 74];
  const bellScaleF = [53, 57, 60, 62, 65, 69, 72, 74];
  const bellScaleG = [55, 59, 62, 64, 67, 71, 74, 76];

  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);

    if (bar < 1 || bar > 17) {
      bellIndex++;
      return;
    }

    const shouldPlay = Math.random() < (bar < 6 ? 0.3 : (bar < 14 ? 0.5 : 0.25));
    if (!shouldPlay) {
      bellIndex++;
      return;
    }

    const scalePhase = Math.floor(bar / 4) % 4;
    let scale;
    if (scalePhase === 0) scale = bellScaleC;
    else if (scalePhase === 1) scale = bellScaleA;
    else if (scalePhase === 2) scale = bellScaleF;
    else scale = bellScaleG;

    const noteIdx = Math.floor(Math.random() * scale.length);
    const note = Tone.Frequency(scale[noteIdx], "midi");
    const vel = 0.15 + Math.random() * 0.25;

    bell.triggerAttackRelease(note, "4n", time, vel);
    bellIndex++;
  }, "4n").start(0);

  const shimmerNotes = [72, 74, 76, 79, 81, 84];
  let shimmerIndex = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);

    if (bar < 4 || bar > 16) {
      shimmerIndex++;
      return;
    }

    if (Math.random() > 0.35) {
      shimmerIndex++;
      return;
    }

    const noteIdx = Math.floor(Math.random() * shimmerNotes.length);
    const note = Tone.Frequency(shimmerNotes[noteIdx], "midi");
    shimmer.triggerAttackRelease(note, "16n", time, 0.15 + Math.random() * 0.15);
    shimmerIndex++;
  }, "8n").start(0);

  const subNotes = ["C2", "A1", "F1", "G1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const noteIdx = Math.floor(bar / 4) % subNotes.length;
    const vel = bar > 16 ? 0.15 : 0.25;
    subBass.triggerAttackRelease(subNotes[noteIdx], "1m", time, vel);
    subIndex++;
  }, "1m").start(0);

  const hissLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar <= 14 && Math.random() < 0.2) {
      hiss.triggerAttackRelease("2n", time, 0.08);
    }
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    droneLPF.frequency.linearRampToValueAtTime(800, time + barLen * 4);
  }, barLen * 4 + "i");

  Tone.Transport.schedule((time) => {
    bellFilter.frequency.linearRampToValueAtTime(4000, time + barLen * 4);
  }, barLen * 6 + "i");

  Tone.Transport.schedule((time) => {
    bellFilter.frequency.linearRampToValueAtTime(2000, time + barLen * 3);
    droneLPF.frequency.linearRampToValueAtTime(400, time + barLen * 4);
  }, barLen * 14 + "i");

  window.toneJsInstruments = { drone, pad, bell, shimmer, subBass, hiss };
  window.toneJsParts = { droneLoop, padLoop, bellLoop, shimmerLoop, subLoop, hissLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
