    { at: 4, kind: 'static' },

    { at: 12, kind: 'ping' },
    { at: 16, kind: 'modem' },
    { at: 20, kind: 'key' },
    { at: 24, kind: 'static' },
    { at: 25.2, kind: 'burst' },
    { at: 28, kind: 'key' },
    { at: 32, kind: 'ping' },
    { at: 35, kind: 'modem' },
    { at: 40, kind: 'key' },
    { at: 44, kind: 'ping' },
    { at: 48, kind: 'static' },
    { at: 51, kind: 'burst' },
    { at: 53, kind: 'key' },
    { at: 55, kind: 'ping' },
    { at: 57, kind: 'static' }
  ];
  const timelineEventIds = [];
  for (let i = 0; i < visualEvents.length; i += 1) {
    const event = visualEvents[i];
    const eventId = Tone.Transport.scheduleOnce((time) => {
      const bar = barAt(time);
      if (bar < 0 || bar >= totalBars) return;
      if (event.kind === 'key') {
        fireKey(time, 0.8);
      } else if (event.kind === 'ping') {
        firePing(time, 0.72);
      } else if (event.kind === 'static') {
        fireStatic(time, 0.62);
      } else if (event.kind === 'modem') {
        fireModem(time);
      } else if (event.kind === 'burst') {
        firePaperFeed(time);
      }
    }, event.at);
    timelineEventIds.push(eventId);
  }
  const pagerEventId = Tone.Transport.scheduleOnce((time) => {
    const bar = barAt(time);
    if (bar >= 0 && bar < totalBars) {
      firePager(time);
    }
  }, duration * 0.7);
  timelineEventIds.push(pagerEventId);
  let timelineCleared = false;
  const timelineEvents = {
    stop: function() {
      if (!timelineCleared) {
        for (let i = 0; i < timelineEventIds.length; i += 1) {
          Tone.Transport.clear(timelineEventIds[i]);
        }
        timelineCleared = true;
      }
      return this;
    },
    dispose: function() {
      this.stop();
      return this;
    }
  };
  // === STORE REFERENCES (required for cleanup) ===
  window.toneJsInstruments = {
    masterLimiter,
    humLevel,
    humFilter,
    humNoise,
    crtLevel,
    crtOsc,
    fanLevel,
    fanOsc,
    clickLevel,
    clickFilter,
    clickNoise,
    ceramicLevel,
    ceramicFilter,
    ceramicClick,
    pingLevel,
    pingFilter,
    pingSynth,
    crackleLevel,
    crackleFilter,
    crackleNoise,
    lineLevel,
    roomReflection,
    modemFilter,
    modemSynth,
    pagerFilter,
    pagerSynth
  };
  window.toneJsParts = {
    clickLoop,
    pingLoop,
    crackleLoop,
    timelineEvents
  };
};


document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;

window.ready = true;
