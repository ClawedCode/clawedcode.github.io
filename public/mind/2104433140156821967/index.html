  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision highp float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 40.0;
const float TAU = 6.28318530718;
const float CREATIVE_SEED = 15873001.0;
float bell(float x,float c,float w){
  return smoothstep(c-w,c,x)*(1.0-smoothstep(c,c+w,x));
}
float crackGate(float p){
  return smoothstep(0.15,0.20,p)*(1.0-smoothstep(0.82,0.99,p));
}
float invertGate(float p){
  return smoothstep(0.45,0.52,p)*(1.0-smoothstep(0.74,0.80,p));
}
float jewelGate(float p){
  return smoothstep(0.48,0.57,p)*(1.0-smoothstep(0.92,1.0,p));
}
float burstGate(float p){
  return clamp(bell(p,0.19,0.035)+bell(p,0.49,0.045)+bell(p,0.79,0.035),0.0,1.0);
}
mat2 rot2(float a){
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}
mat3 rotateY(float a){
  float c=cos(a),s=sin(a);
  return mat3(c,0.0,s,0.0,1.0,0.0,-s,0.0,c);
}
mat3 rotateZ(float a){
  float c=cos(a),s=sin(a);
  return mat3(c,-s,0.0,s,c,0.0,0.0,0.0,1.0);
}
float hash13(vec3 p){
  p=fract(p*0.1031);
  p+=dot(p,p.yzx+333.321);
  return fract((p.x+p.y)*p.z);
}
vec2 hash22(vec2 p){
  vec3 q=fract(vec3(p.x,p.y,p.x)*vec3(0.1031,0.1030,0.0973));
  q+=dot(q,q.yzx+33.33);
  return fract((q.xx+q.yz)*q.zy);
}
vec3 hash33(vec3 p){
  p=fract(p*vec3(0.1031,0.1030,0.0973));
  p+=dot(p,p.yxz+333.321);
  return fract((p.xxy+p.yxx)*p.zyx);
}
vec3 voronoi3d(vec3 p){
  vec3 c=floor(p),f=fract(p),id=vec3(0.0);
  float md=10.0;
  for(int x=-1;x<=1;x++){
    for(int y=-1;y<=1;y++){
      for(int z=-1;z<=1;z++){
        vec3 n=vec3(float(x),float(y),float(z));
        float d=length(n+hash33(c+n)-f);
        if(d<md){
          md=d;
          id=c+n;
        }
      }
    }
  }
  return id;
}
float voronoiEdge(vec3 p,float w){
  vec3 c=floor(p),f=fract(p);
  float a=10.0,b=10.0;
  for(int x=-1;x<=1;x++){
    for(int y=-1;y<=1;y++){
      for(int z=-1;z<=1;z++){
        vec3 n=vec3(float(x),float(y),float(z));
        float d=length(n+hash33(c+n)-f);
        if(d<a){
          b=a;
          a=d;
        }else if(d<b){
          b=d;
        }
      }
    }
  }
  return smoothstep(0.0,w,b-a);
}
float scene(vec3 p,float ph){
  float t=ph*TAU;
  float cr=crackGate(ph),iv=invertGate(ph),jw=jewelGate(ph),bu=burstGate(ph);
  float cadence=pow(0.5+0.5*sin(t*8.0),6.0);
  vec3 q=p;
  q.x+=q.y*0.075;
  q.z+=q.y*0.025;
  q.xz=rot2(0.04*sin(t)+0.055*bu)*q.xz;
  float ds=(abs(q.x)*0.92+abs(q.y)*0.45+abs(q.z)*1.18-0.62)*0.62;
  ds=max(ds,dot(q,normalize(vec3(0.78,0.22,0.58)))-0.54);
  ds=max(ds,dot(q,normalize(vec3(-0.70,-0.18,0.69)))-0.57);
  float dj=(abs(q.x)*0.78+abs(q.y)*0.72+abs(q.z)*0.94-0.63)*0.62;
  dj=max(dj,abs(q.y)-0.90);
  float d=mix(ds,dj,jw);
  float scar=sin(q.y*13.0+sin(q.y*4.0)*2.0)*sin(q.x*17.0-q.z*9.0);
  d+=cr*(0.010+0.022*cadence+0.018*iv)*scar;
  d-=bu*0.025*(0.5+0.5*sin(q.y*21.0-q.x*15.0));
  return d;
}
float march(vec3 ro,vec3 rd,float ph,mat3 r){
  float t=0.2;
  for(int i=0;i<88;i++){
    vec3 p=ro+rd*t;
    float d=scene(r*p,ph);
    if(d<0.001)return t;
    t+=d*0.58;
    if(t>10.0)break;
  }
  return 11.0;
}
vec3 cellColor(vec3 id,float ph,float jw){
  float salt=mod(CREATIVE_SEED,4093.0)*0.001;
  float r=hash13(id+vec3(salt,1.73,4.19));
  if(r>0.50)return vec3(0.002,0.003,0.004);
  float b=r*6.0;
  vec3 violet;
  if(b<1.0)violet=vec3(0.19,0.055,0.27);
  else if(b<2.0)violet=vec3(0.36,0.10,0.48);
  else violet=vec3(0.55,0.20,0.63);
  vec3 cool;
  if(b<1.0)cool=vec3(0.12,0.27,0.36);
  else if(b<2.0)cool=vec3(0.25,0.48,0.57);
  else cool=vec3(0.48,0.68,0.72);
  float f=0.72+0.28*pow(0.5+0.5*sin(ph*TAU*8.0+r*TAU),5.0);
  return mix(violet,cool,jw*(0.45+0.45*step(1.0,b)))*f;
}
float lineMask(float d,float w){
  return 1.0-smoothstep(w,w*2.0,d);
}
vec3 fragments(vec2 uv,float ph){
  float cr=crackGate(ph),iv=invertGate(ph),bu=burstGate(ph);
  float salt=mod(CREATIVE_SEED,8191.0);
  vec3 col=vec3(0.0);
  for(int i=0;i<72;i++){
    float fi=float(i);
    vec2 h=hash22(vec2(fi+salt*0.01,fi*1.731+salt*0.003));
    float y=(h.y-0.5)*0.58;
    float taper=1.0-0.72*abs(y)/0.30;
    vec2 base=vec2((h.x-0.5)*0.34*max(taper,0.18),y);
    vec2 dir=normalize(base+vec2(h.y-0.43,h.x-0.57)*0.16+vec2(0.001));
    vec2 tanv=vec2(-dir.y,dir.x);
    float freq=5.0+floor(h.x*5.0);
    float spread=cr*(0.018+0.075*iv+0.040*bu)*(0.55+h.y*0.65);
    vec2 pos=base+dir*spread;
    pos+=tanv*cr*(0.006+0.010*iv)*sin(ph*TAU*freq+fi*1.91);
    pos/=1.0+0.28*iv;
    vec2 q=rot2(h.y*TAU+ph*TAU*(1.0+h.x*3.0))*((uv-pos));
    float sz=0.0035+0.0045*h.x;
    float d=abs(q.x)+abs(q.y)*0.68;
    float core=lineMask(d,sz);
    float halo=lineMask(d,sz*2.6)*0.18;
    vec3 fc=h.x<0.52?vec3(0.52,0.18,0.66):vec3(0.26,0.52,0.62);
    float pulse=0.65+0.35*pow(0.5+0.5*sin(ph*TAU*freq+fi),4.0);
    col+=(fc*core+vec3(0.92,0.82,0.16)*halo)*pulse*cr;
  }
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,DURATION)/DURATION;
  float t=ph*TAU;
  float iv=invertGate(ph),jw=jewelGate(ph),cr=crackGate(ph),bu=burstGate(ph);
  float cadence=pow(0.5+0.5*sin(t*8.0),6.0);
  mat3 r=rotateZ(-0.09+0.10*sin(t)+0.035*cadence)*rotateY(0.16*sin(t*2.0)+0.10*bu);
  vec3 ro=vec3(0.0,0.0,3.5);
  vec3 rd=normalize(vec3(uv*(1.0+0.28*iv),-1.0));
  float md=march(ro,rd,ph,r);
  vec3 col=vec3(0.0);
  if(md<10.0){
    vec3 wp=ro+rd*md;
    vec3 p=r*wp;
    vec3 vp=p*3.9;
    vec3 id=voronoi3d(vp);
    float edge=voronoiEdge(vp,0.055);
    vec3 graphite=vec3(0.012,0.010,0.016);
    vec3 sulfur=vec3(0.92,0.82,0.16);
    col=cellColor(id,ph,jw);
    col+=sulfur*(1.0-edge)*(6.2+1.3*bu);
    float sf=p.x-(0.10*sin(p.y*5.2)+0.032*sin(p.y*17.0));
    float scar=lineMask(abs(sf),0.012)*(1.0-smoothstep(1.08,1.26,abs(p.y)));
    float b1=lineMask(abs(p.x-0.19*(p.y-0.05)-0.035*sin(p.y*14.0)),0.010);
    float b2=lineMask(abs(p.x+0.16*(p.y+0.18)+0.028*sin(p.y*19.0)),0.009);
    float fracture=max(scar,max(b1,b2)*cr);
    col+=sulfur*fracture*(0.42+3.8*cr+1.8*bu);
    float fy=fract((p.y+1.36)*2.45);
    float contour=lineMask(min(fy,1.0-fy),0.012);
    col=mix(col,graphite,contour*(0.38+0.22*jw));
    vec2 m=vec2(p.x+0.20,p.y-0.31);
    float ring=lineMask(abs(length(m)-0.105),0.009);
    float crossMark=lineMask(min(abs(m.x),abs(m.y)),0.007)*(1.0-smoothstep(0.105,0.135,max(abs(m.x),abs(m.y))));
    col+=sulfur*max(ring,crossMark)*(0.32+1.15*jw+0.75*bu);
    col*=1.85;
  }
  col+=fragments(uv,ph);
  col=vec3(1.0)-exp(-col*0.78);
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 40;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 40;

  <script>

  const bpm = totalBars * 240 / duration;

  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  let rngState = 0x0809e723;

    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;

    threshold: -17,
    ratio: 2.4,
    attack: 0.012,
    release: 0.24
