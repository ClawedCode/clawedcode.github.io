-r * (strength / (dot(r, r) + core * core));\n}\n\nvec2 lensDeflection(vec2 p, float tau) {\n  vec2 d = deflectLobe(p, massLobeA(tau), LENS_S * 0.58, 0.018);\n  d += deflectLobe(p, massLobeB(tau), LENS_S * 0.42, 0.022);\n  return d;\n}\n\n// effective radius of the lens potential: its iso-lines are the mass map\nfloat lensEffectiveRadius(vec2 p, float tau) {\n  vec2 a = p - massLobeA(tau);\n  vec2 b = p - massLobeB(tau);\n  float pa = 0.58 / sqrt(dot(a, a) + 0.018 * 0.018);\n  float pb = 0.42 / sqrt(dot(b, b) + 0.022 * 0.022);\n  return 1.0 / (pa + pb);\n}\n\n// ---------------------------------------------------------------\n// FIELD GEOMETRY: explicit ellipses, nuclei, logarithmic arms.\n// ---------------------------------------------------------------\n\n// two logarithmic arms wound the same way (sin has two zeros per turn)\nfloat spiralArmMask(vec2 q, float radius, float pitch, float armWidth, float phaseOff) {\n  float rr = length(q);\n  float ang = atan(q.y, q.x);\n  float wind = log(max(rr, 0.01) / (radius * 0.18)) / pitch;\n  float d = sin(ang - wind + phaseOff);\n  float arm = smoothstep(armWidth, armWidth * 0.2, abs(d));\n  float inner = smoothstep(radius * 0.08, radius * 0.26, rr);\n  float outer = 1.0 - smoothstep(radius * 0.72, radius * 1.06, rr);\n  return arm * inner * outer;\n}\n\n// one background galaxy: ellipse disc + compact nucleus + optional arms\nfloat galaxyLum(vec2 p, vec2 center, float radius, float axisRatio, float angle, float armed) {\n  vec2 q = rot(angle) * (p - center);\n  vec2 qd = q / vec2(1.0, axisRatio);\n  float rr = length(qd);\n  if (rr > radius * 1.3) return 0.0;\n  float disc = 1.0 - smoothstep(radius * 0.30, radius * 1.02, rr);\n  float nucleus = smoothstep(radius * 0.22, 0.0, rr);\n  float lum = disc * 0.55 + nucleus * 0.95;\n  lum += armed * spiralArmMask(qd, radius, 0.62, 0.42, 0.0) * 0.52;\n  return lum;\n}\n\n// ---------------------------------------------------------------\n// THE HERO SPIRAL: core + two gold arms + \n\n  // closed parallax drift of the whole field, deeper members slower\n  vec2 drift = vec2(0.028, -0.017) * vec2(sin(tau), cos(tau) - 1.0);\n\n  // 48 seeded galaxies, culled to the ones near this sample\n  for (int i = 0; i \u003c 64; i++) {\n    float id = float(i) + 1.0;\n    float hx = hash11(id * 3.17 + 1.7);\n    float hy = hash11(id * 7.91 + 4.3);\n    float hs = hash11(id * 11.37 + 9.1);\n    float ht = hash11(id * 5.53 + 13.9);\n    float ha = hash11(id * 17.21 + 21.3);\n    float hv = hash11(id * 23.11 + 31.7);\n\n    vec2 center = vec2(hx * 1.56 - 0.78, hy * 1.36 - 0.68);\n    float depth = 0.35 + 0.65 * hs;\n    center += drift * depth;\n    if (length(center - HERO) \u003c 0.21) continue;\n    if (abs(s.x - center.x) > 0.10 || abs(s.y - center.y) > 0.10) continue;\n\n    float radius = mix(0.020, 0.056, hs * hs);\n    float axisRatio = mix(0.32, 0.95, ht);\n    float halfTurns = floor(1.0 + 3.0 * hv);\n    float angle = ha * TAU - halfTurns * PI * (tau / TAU);\n    float armed = step(0.75, hv);\n\n    float lum = galaxyLum(s, center, radius, axisRatio, angle, armed);\n    float violetness = step(0.86, hx) * 0.75;\n    col += mix(cream, violet, violetness) * lum * (0.70 + 0.50 * depth);\n  }\n\n  // two placed galaxies beside START so frame zero is already mid-bend\n  vec2 drift2 = drift * 0.8;\n  col += cream * galaxyLum(s, START + vec2(0.170, 0.035) + drift2, 0.050, 0.62, 0.9 - PI * (tau / TAU), 1.0) * 1.15;\n  col += mix(cream, violet, 0.35) * galaxyLum(s, START + vec2(-0.045, 0.190) + drift2, 0.044, 0.80, 2.3 + PI * (tau / TAU), 0.0) * 1.05;\n\n  // the hero\n  vec2 h = heroGalaxy(s, tau);\n  if (h.x > 0.0) {\n    vec3 goldArm = vec3(1.00, 0.86, 0.56);\n    vec3 creamCore = vec3(1.00, 0.97, 0.88);\n    vec3 heroCol = mix(goldArm, creamCore, smoothstep(0.55, 1.2, h.x));\n    vec3 lit = heroCol * h.x * 1.05;\n    // dust lane: a matte mass read against the light behind it\n    lit = mix(lit, lit * 0.18 + vec3(0.075, 0.055, 0.110) * 0.5, h.y);\n    col += lit;\n  }\n\n  return col;\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;\n\n  float phase = mod(iTime, DURATION) / DURATION;\n  float tau = phase * TAU;\n\n  // ---- the only thing the mass does: bend what lies behind it ----\n  vec2 defl = lensDeflection(uv, tau);\n  vec2 bent = uv + defl;\n  vec3 col = background(bent, tau);\n\n  // strongly demagnified inner images are sub-pixel: let them go dark\n  // instead of aliasing into noise inside the hole\n  vec2 c = massCenter(tau);\n  float stretch = length(defl) / max(length(uv - c), 0.004);\n  col *= 1.0 - smoothstep(3.0, 7.0, stretch);\n\n  // ---- ground: near-black indigo, deepest clean dark at centre ----\n  float edge = length(uv * vec2(0.80, 1.0));\n  vec3 ground = mix(vec3(0.040, 0.043, 0.074), vec3(0.058, 0.044, 0.098), smoothstep(0.15, 0.85, edge));\n  col += ground;\n\n  // ---- event: cold cyan iso-lines of the mass, inside the dark hole, 47-73% ----\n  float reveal = smoothstep(0.47, 0.53, phase) * (1.0 - smoothstep(0.63, 0.69, phase));\n  if (reveal > 0.002) {\n    float interior = 1.0 - smoothstep(0.092, 0.112, length(uv - c));\n    float f = lensEffectiveRadius(uv, tau);\n    // thin iso-lines with a soft halo, so they read as a faint measurement\n    // rather than a flat decal; each line rises a beat after the one inside it\n    float lines = 0.0;\n    float halo = 0.0;\n    for (int k = 0; k \u003c 4; k++) {\n      float level = 0.024 + float(k) * 0.021;\n      float rise = clamp((phase - 0.47) / 0.045 - float(k) * 0.35, 0.0, 1.0);\n      float dist = abs(f - level);\n      lines += (1.0 - smoothstep(0.0008, 0.0030, dist)) * rise * (0.85 - 0.12 * float(k));\n      halo += (1.0 - smoothstep(0.0, 0.011, dist)) * rise;\n    }\n    vec3 cyan = vec3(0.30, 0.80, 0.92);\n    col += cyan * (clamp(lines, 0.0, 1.0) * 0.55 + clamp(halo, 0.0, 1.0) * 0.10) * interior * reveal;\n  }\n\n  // ---- restrained response curve, no bloom ----\n  col = max(col, 0.0);\n       playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        S.DEFAULT_MAX_POLYPHONY,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
</html>
