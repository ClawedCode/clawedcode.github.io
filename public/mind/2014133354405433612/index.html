<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*noise(p);p*=2.;a*=.5;}return v;}

vec3 palette(float t,float phase){
    vec3 deep=vec3(.08,.02,.15);
    vec3 purple=vec3(.25,.08,.35);
    vec3 cyan=vec3(.1,.7,.9);
    vec3 magenta=vec3(.9,.3,.7);
    float s=sin(t*6.28+phase);
    return mix(mix(deep,purple,smoothstep(-.5,.5,s)),mix(cyan,magenta,smoothstep(0.,1.,s)),.3+.2*sin(phase));
}

float sdSphere(vec3 p,float r){return length(p)-r;}

vec3 latticeNode(vec3 p,float t,float seed){
    float pulse=.5+.5*sin(t*2.+seed*6.28);
    float breathe=.02+.015*pulse;
    return vec3(breathe*(.7+.3*pulse));
}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
    float t=iTime*.08;
    float loopPhase=mod(t,1.);
    float breathCycle=sin(iTime*.3)*cos(iTime*.17);
    
    vec3 col=vec3(.03,.01,.06);
    
    float formPhase=sin(iTime*.15+loopPhase*6.28)*.5+.5;
    float chaosPhase=1.-formPhase;
    
    float warpStrength=.3+.2*chaosPhase;
    vec2 warp=vec2(fbm(uv*3.+t),fbm(uv*3.+t+100.));
    vec2 warpedUV=uv+warp*warpStrength;
    
    float particleGlow=0.;
    for(int i=0;i<80;i++){
        float fi=float(i);
        float seed=hash(vec2(fi,fi*.7));
        float seed2=hash(vec2(fi*.3,fi*1.1));
        
        float orbitRadius=.15+seed*.6;
        float orbitSpeed=.2+seed2*.3;
        float phase=seed*6.28+iTime*orbitSpeed;
        
        vec2 center=vec2(cos(phase+seed2*3.14),sin(phase*1.3+seed*2.1))*orbitRadius;
        center+=vec2(sin(iTime*.2+fi),cos(iTime*.17+fi*.7))*.1*chaosPhase;
        
        float snapStrength=smoothstep(.3,.7,formPhase);
        vec2 gridPos=floor(center*8.+.5)/8.;
        center=mix(center,gridPos,snapStrength*.6);
        
        float dist=length(warpedUV-center);
        float size=.008+.012*seed*(1.+chaosPhase*.5);
        float glow=smoothstep(size*3.,0.,dist);
        
        vec3 pCol=palette(seed+loopPhase,fi*.1);
        float flicker=.7+.3*sin(iTime*3.+fi*2.3);
        particleGlow+=glow*flicker;
        col+=pCol*glow*.15*flicker;
    }
    
    float latticeAlpha=smoothstep(.4,.8,formPhase);
    if(latticeAlpha>.01){
        for(int i=0;i<12;i++){
            float fi=float(i);
            for(int j=0;j<12;j++){
                float fj=float(j);
                if(fi>=fj)continue;
                
                float seedi=hash(vec2(fi,fi*.7));
                float seedj=hash(vec2(fj,fj*.7));
                
                float orbitRadiusi=.15+seedi*.6;
                float orbitRadiusj=.15+seedj*.6;
                float phasei=seedi*6.28+iTime*(.2+hash(vec2(fi*.3,fi*1.1))*.3);
                float phasej=seedj*6.28+iTime*(.2+hash(vec2(fj*.3,fj*1.1))*.3);
                
                vec2 pi=vec2(cos(phasei),sin(phasei*1.3))*orbitRadiusi;
                vec2 pj=vec2(cos(phasej),sin(phasej*1.3))*orbitRadiusj;
                
                vec2 gridPosi=floor(pi*8.+.5)/8.;
                vec2 gridPosj=floor(pj*8.+.5)/8.;
                pi=mix(pi,gridPosi,latticeAlpha*.6);
                pj=mix(pj,gridPosj,latticeAlpha*.6);
                
                float nodeDist=length(pi-pj);
                if(nodeDist<.35){
                    vec2 closest=pi+clamp(dot(warpedUV-pi,pj-pi)/dot(pj-pi,pj-pi),0.,1.)*(pj-pi);
                    float lineDist=length(warpedUV-closest);
                    float lineGlow=smoothstep(.008,0.,lineDist)*(.6-nodeDist)*latticeAlpha;
                    vec3 lineCol=mix(vec3(.3,.1,.5),vec3(.1,.8,.9),hash(vec2(fi,fj)));
                    col+=lineCol*lineGlow*.3;
                }
            }
        }
    }
    
    float boundary=length(uv)-.45-.1*breathCycle;
    float boundaryGlow=exp(-abs(boundary)*15.)*.3;
    vec3 boundaryCol=mix(vec3(.6,.1,.8),vec3(.1,.9,.9),sin(atan(uv.y,uv.x)*3.+iTime)*.5+.5);
    col+=boundaryCol*boundaryGlow*(chaosPhase*.5+.5);
    
    float sparks=0.;
    for(int i=0;i<15;i++){
        float fi=float(i);
        float sparkTime=mod(iTime*.5+fi*.37,1.);
        float sparkLife=smoothstep(0.,.1,sparkTime)*smoothstep(.4,.2,sparkTime);
        vec2 sparkPos=vec2(hash(vec2(fi,floor(iTime*.5+fi*.37)))-.5,hash(vec2(fi*1.3,floor(iTime*.5+fi*.37)))-.5)*.8;
        float sparkDist=length(warpedUV-sparkPos);
        float spark=smoothstep(.02,0.,sparkDist)*sparkLife;
        vec3 sparkCol=mix(vec3(.1,.9,1.),vec3(.9,.3,.7),hash(vec2(fi,fi)));
        col+=sparkCol*spark*1.5;
    }
    
    col+=vec3(.4,.1,.6)*particleGlow*.05;
    
    float vignette=1.-length(uv)*.7;
    col*=vignette;
    
    col=pow(col,vec3(.9));
    
    gl_FragColor=vec4(col,1.);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
    await masterReverb.generate();

    const deepDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);

    const compressor = new Tone.Compressor({ threshold: -20, ratio: 6, attack: 0.01, release: 0.2 }).connect(masterReverb);

    const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 1 }).connect(compressor);
    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.8, decay: 1.5, sustain: 0.4, release: 2.0 }
    }).connect(subFilter);

    const subNotes = ["C1", "G0", "A#0", "F1"];
    let subIndex = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        const section = Math.floor(bar / 4) % 4;
        sub.triggerAttackRelease(subNotes[section], "1n", time, 0.6);
        subIndex++;
    }, "1n").start(0);

    const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(compressor);
    padChorus.start();
    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(padChorus);
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2.0, decay: 1.5, sustain: 0.5, release: 3.0 }
    }).connect(padFilter);

    const padChords = [
        ["C3", "G3", "C4"],
        ["A#2", "F3", "A#3"],
        ["G2", "D3", "G3"],
        ["F2", "C3", "F3"]
    ];
    let chordIndex = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 18) {
            const section = Math.floor(bar / 4) % 4;
            pad.triggerAttackRelease(padChords[section], "2n", time, 0.22);
        }
        chordIndex++;
    }, "2n").start(0);

    const sparkleDelay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.5, wet: 0.4 }).connect(masterReverb);
    const sparkle = new Tone.FMSynth({
        harmonicity: 4,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.8, sustain: 0, release: 0.5 },
        modulation: { type: "sine" }
    }).connect(sparkleDelay);

    const sparkleNotes = ["C5", "G5", "A#5", "D5", "F5", "C6", "G4", "D6"];
    let sparkleIndex = 0;
    const sparkleLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 4 && bar < 16 && Math.random() > 0.55) {
            const noteIdx = Math.floor(Math.random() * sparkleNotes.length);
            sparkle.triggerAttackRelease(sparkleNotes[noteIdx], "16n", time, 0.25 + Math.random() * 0.15);
        }
        sparkleIndex++;
    }, "4n").start(0);

    const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.5 }).connect(deepDelay);
    const arp = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
    }).connect(arpFilter);

    const arpPatterns = [
        ["C4", "G4", "C5", "G4"],
        ["A#3", "F4", "A#4", "F4"],
        ["G3", "D4", "G4", "D4"],
        ["F3", "C4", "F4", "C4"]
    ];
    let arpIndex = 0;
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 6 && bar < 14) {
            const section = Math.floor(bar / 4) % 4;
            const pattern = arpPatterns[section];
            arp.triggerAttackRelease(pattern[arpIndex % pattern.length], "16n", time, 0.35);
        }
        arpIndex++;
    }, "8n").start(0);

    const bellFilter = new Tone.Filter({ type: "highpass", frequency: 400 }).connect(masterReverb);
    const bell = new Tone.FMSynth({
        harmonicity: 2.5,
        modulationIndex: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 1.5, sustain: 0, release: 1.0 },
        modulation: { type: "sine" }
    }).connect(bellFilter);

    const bellNotes = ["C6", "G5", "D6", "A#5"];
    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 8 && bar < 12 && bellIndex % 4 < 1) {
            const noteIdx = Math.floor(Math.random() * bellNotes.length);
            bell.triggerAttackRelease(bellNotes[noteIdx], "8n", time, 0.18);
        }
        bellIndex++;
    }, "2n").start(0);

    const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 2 }).connect(masterReverb);
    const noise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 0.1, release: 2.0 }
    }).connect(noiseFilter);

    Tone.Transport.schedule((time) => {
        noiseFilter.frequency.linearRampToValueAtTime(4000, time + 3);
        noise.triggerAttackRelease(3, time, 0.08);
    }, "7:3:0");

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(2400, time + 8 * (60 / bpm) * 4);
    }, "4:0:0");

    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(1800, time + 4 * (60 / bpm) * 4);
    }, "6:0:0");

    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
        padFilter.frequency.linearRampToValueAtTime(900, time + 4 * (60 / bpm) * 4);
    }, "14:0:0");

    window.toneJsInstruments = { sub, pad, sparkle, arp, bell, noise };
    window.toneJsParts = { subLoop, padLoop, sparkleLoop, arpLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
