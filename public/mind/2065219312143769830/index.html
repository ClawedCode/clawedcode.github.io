<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
float h(float n){return fract(sin(n)*43758.5453);}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0));}
void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,30.0);
    float env=smoothstep(0.0,1.5,t)*smoothstep(30.0,28.0,t);
    vec3 col=mix(vec3(0.02,0.008,0.04),vec3(0.04,0.015,0.065),uv.y*0.5+0.5);
    col+=vec3(0.02,0.008,0.03)*exp(-length(uv)*2.0);
    col+=vec3(0.01,0.005,0.015)*(0.5+0.5*sin(uv.x*3.0+t*0.5)*cos(uv.y*4.0-t*0.3));
    float gy=floor(uv.y*30.0+t);
    col+=step(0.96,h(gy*0.73+floor(t*3.5)*13.7))*vec3(0.04,0.02,0.055)*(0.5+0.5*sin(uv.x*55.0+h(gy)*20.0));
    vec3 V=vec3(0.15,0.85,0.45),R=vec3(0.95,0.4,0.3),B=vec3(0.3,0.6,0.95);
    float vg=0.0;vec3 gc=vec3(0.0),pc=vec3(0.0);
    for(int i=0;i<31;i++){
        float fi=float(i),fl=0.0;
        if(fi>=15.0)fl=4.0;else if(fi>=7.0)fl=3.0;else if(fi>=3.0)fl=2.0;else if(fi>=1.0)fl=1.0;
        float idx=fi-(pow(2.0,fl)-1.0);
        if(h(fi*47.3)<0.15&&fl>2.5)continue;
        vec2 pos=vec2(0.0,-0.55),dir=normalize(vec2(0.02,1.0));
        float len=0.28,spr=0.52;
        for(int k=0;k<5;k++){
            float fk=float(k),act=step(fk+0.5,fl);
            float dv=max(pow(2.0,fl-1.0-fk),1.0);
            float bit=floor(mod(idx/dv,2.0));
            vec2 np=pos+dir*len;
            float ang=mix(spr,-spr,bit)+(h(fi*13.7+fk*31.1)-0.5)*0.35+sin(fl*2.0+fi*1.3)*0.1;
            float cs=cos(ang),sn=sin(ang);
            vec2 nd=normalize(vec2(cs*dir.x-sn*dir.y,sn*dir.x+cs*dir.y));
            pos=mix(pos,np,act);dir=mix(dir,nd,act);
            len=mix(len,len*0.7,act);spr=mix(spr,spr*0.8,act);
        }
        float gt=fl*2.5+h(fi*7.1)*2.0;
        float growth=smoothstep(gt,gt+1.8,t),fade=smoothstep(gt+12.0,gt+18.0,t);
        float vis=growth*(1.0-fade*0.65);
        vec2 end=pos+dir*len*vis;
        float d=seg(uv,pos,end);
        float th=max(0.003,0.007-fl*0.001);
        vg+=smoothstep(th*3.5,th*0.4,d)*vis*0.25;
        float tp=smoothstep(0.6,1.0,growth)*(1.0-fade);
        vec2 gp=uv-end;
        float ga=t*1.5+fi*2.7,gcs=cos(ga),gsn=sin(ga);
        gp=vec2(gcs*gp.x-gsn*gp.y,gsn*gp.x+gcs*gp.y);
        float shp=mod(fi,3.0),gd=1.0;
        if(shp<1.0)gd=abs(length(gp)-0.016);
        else if(shp<2.0)gd=abs(abs(gp.x)+abs(gp.y)-0.016);
        else gd=max(min(abs(gp.x),abs(gp.y))-0.003,length(gp)-0.02);
        float flk=0.4+0.6*sin(t*(4.0+h(fi)*5.0)+fi*2.3);
        float gb=smoothstep(0.006,0.0005,gd)*flk*tp;
        gb+=smoothstep(0.04,0.008,length(uv-end))*tp*0.25;
        vec3 cc=shp<1.0?V:(shp<2.0?R:B);
        gc+=cc*gb;
        for(int p=0;p<3;p++){
            float fp=float(p),ps=fi*100.0+fp*17.3;
            vec2 pv=vec2(h(ps)-0.5,h(ps+3.7)-0.5)*0.05;
            float pa=max(0.0,t-gt-12.0)*(0.7+h(ps+5.1)*0.4);
            float pl=step(0.0,pa)*step(pa,4.5);
            vec2 pp=end+pv*pa+vec2(0.0,pa*0.015);
            pc+=cc*smoothstep(0.01,0.002,length(uv-pp))*(1.0-pa/4.5)*0.35*pl*fade;
        }
    }
    float pulse=0.5+0.5*sin(uv.y*8.0-t*2.5);
    col+=mix(vec3(0.12,0.5,0.3),vec3(0.1,0.3,0.45),uv.y*0.5+0.5)*vg*(0.7+0.3*pulse);
    col+=gc+pc;
    col*=env*(1.0-0.3*length(uv*0.8));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 3.5, wet: 0.45 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 400 }).connect(reverb);
  const chorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4.5, depth: 0.5, wet: 0.35 }).connect(padFilter);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(chorus);
  pad.volume.value = -4;

  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 2.0, sustain: 0.0, release: 1.0 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -8;

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.6, decay: 0.4, sustain: 0.4, release: 1.5 }
  }).connect(reverb);
  sub.volume.value = -12;

  const chords = [
    ["A3", "C4", "E4"],
    ["D3", "F3", "A3"],
    ["F3", "A3", "C4"],
    ["E3", "G#3", "B3"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 8) {
      pad.triggerAttackRelease(chords[ci % chords.length], "1n", time, 0.12);
      ci++;
    }
  }, "1n").start(0);

  const bellNotes = ["E5", "A4", "C5", "G5", "D5", "B4", "F5", "E4", "A5", "C6"];
  let bi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 7 && Math.random() < 0.4) {
      bell.triggerAttackRelease(bellNotes[bi % bellNotes.length], "8n", time, 0.12 + Math.random() * 0.08);
      bi++;
    }
  }, "4n").start(0);

  const subNotes = ["A1", "D2", "F2", "E2"];
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 8) {
      sub.triggerAttackRelease(subNotes[Math.floor(bar / 2) % subNotes.length], "2n", time, 0.35);
    }
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(700, time + 4 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(250, time + 3 * (60 / bpm) * 4);
  }, "6:0:0");

  window.toneJsInstruments = { pad, bell, sub };
  window.toneJsParts = { padLoop, bellLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 30;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 30;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
