<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
    return a + b * cos(6.28318 * (c * t + d));
}

float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdBox(vec3 p, vec3 b) {
    vec3 q = abs(p) - b;
    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sdRing(vec3 p, float r, float t) {
    vec2 q = vec2(length(p.xz) - r, abs(p.y) - t);
    return length(max(q, 0.0));
}

float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    const float DURATION = 60.0;
    float phase = mod(iTime, DURATION) / DURATION;
    float tau = phase * 6.28318530718;

    vec3 ro = vec3(7.5 * sin(tau), 2.4 + 0.5 * sin(tau * 2.0), 7.5 * cos(tau));
    vec3 forward = normalize(-ro);
    vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
    vec3 up = normalize(cross(right, forward));
    vec3 rd = normalize(forward * 1.8 + right * uv.x + up * uv.y);

    vec3 lightDir = normalize(vec3(cos(tau), 0.65, sin(tau)));
    vec3 planetCol = vec3(0.12, 0.10, 0.08);
    float planetR = 2.5;
    float t = 0.0;
    float hit = 0.0;
    vec3 p = vec3(0.0);

    for (int i = 0; i < 100; i++) {
        p = ro + rd * t;
        float dSphere = sdSphere(p, planetR);
        float rAngle = tau * 0.5;
        float cA = cos(rAngle);
        float sA = sin(rAngle);
        vec3 rp = p;
        rp.xz = mat2(cA, -sA, sA, cA) * p.xz;
        float dRing = sdRing(rp, 3.8, 0.06);
        float d = min(dSphere, dRing);
        
        if (d < 0.001) { hit = t; break; }
        t += d;
        if (t > 15.0) break;
    }

    vec3 col = vec3(0.01, 0.01, 0.02);
    if (hit > 0.0) {
        p = ro + rd * hit;
        float nDotL = max(dot(normalize(p), lightDir), 0.0);
        float rim = pow(1.0 - max(dot(normalize(p), -rd), 0.0), 4.0);
        
        vec3 surfaceCol = planetCol * (nDotL * 0.8 + 0.15);
        surfaceCol += rim * vec3(0.4, 0.6, 0.9) * 0.6;
        float longitude = atan(p.z, p.x);
        float archiveBand = smoothstep(
            0.72,
            1.0,
            0.5 + 0.5 * sin(longitude * 12.0 - tau * 4.0 + p.y * 6.0)
        );
        surfaceCol += archiveBand * vec3(0.55, 0.72, 0.95) * (0.12 + 0.35 * nDotL);
        
        float rAngle = tau * 0.5;
        float cA = cos(rAngle);
        float sA = sin(rAngle);
        vec3 rp = p;
        rp.xz = mat2(cA, -sA, sA, cA) * p.xz;
        float dRing = sdRing(rp, 3.8, 0.06);
        
        if (dRing < 0.01) {
            float distFromCenter = length(rp.xz) - 3.8;
            float density = smoothstep(0.06, 0.0, abs(rp.y));
            float pattern = smoothstep(0.02, 0.0, abs(distFromCenter - 0.1 * sin(distFromCenter * 50.0)));
            float ringSignal = 0.5 + 0.5 * sin(atan(rp.z, rp.x) * 14.0 - tau * 5.0);
            vec3 ringCol = mix(vec3(0.25, 0.55, 0.95), vec3(0.95, 0.72, 0.28), ringSignal);
            surfaceCol = mix(surfaceCol, ringCol * (0.5 + nDotL * 0.5), density * pattern * 0.8);
        }
        col = surfaceCol;
    }

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 60;
  const targetBpm = 74;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;
  const secPerBar = 240 / bpm;

  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  let rngState = 0x6d2b79f5;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === FX BUSES ===
  // Massive space for "void" and "pale gold" aesthetic
  const voidReverb = new Tone.Reverb({ decay: 12.0, wet: 0.6 }).toDestination();
  await voidReverb.generate();

  // Deep sub-bass reverb, drier to keep fundamentals tight
  const subReverb = new Tone.Reverb({ decay: 4.0, wet: 0.15 }).toDestination();
  await subReverb.generate();

  // Spatial width
  const chorus = new Tone.Chorus({ frequency: 0.8, delayTime: 3.5, depth: 0.6, wet: 0.4 }).start();
  
  // Filter for the data ring "spin"
  const spinFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2 }).toDestination();

  // === GRAVITY DRONE (Low C, sustained) ===
  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 4.0, decay: 1.0, sustain: 1.0, release: 4.0 }
  }).connect(subReverb);
  
  // Slow harmonic drift
  const droneChords = [
    ["C2", "G2"], // i
    ["Ab2", "Eb3"], // VI
    ["F2", "C3"], // IV
    ["Bb1", "F2"] // V
  ];
  let droneIdx = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Drone is constant but swells
    const vel = bar < totalBars * 0.1 ? 0.15 : 0.35;
    drone.triggerAttackRelease(droneChords[droneIdx % droneChords.length], "4m", time, vel);
    droneIdx++;
  }, "4m").start(0);

  // === DATA RINGS (Spinny Metallic Particles) ===
  // Creates the "cold and precise" data ring spin
  const ringNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
  }).connect(spinFilter);

  // Automate the spin speed (frequency) to simulate the rings spinning
  // Start slow, accelerate, then wind down
  Tone.Transport.schedule((time) => {
    spinFilter.frequency.linearRampToValueAtTime(2000, time + 20 * secPerBar);
  }, totalBars * 0.10 * secPerBar);

  Tone.Transport.schedule((time) => {
    spinFilter.frequency.linearRampToValueAtTime(800, time + 15 * secPerBar);
  }, totalBars * 0.80 * secPerBar);

  // Trigger noise bursts to simulate particles catching light
  let ringIdx = 0;
  const ringLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only active during the "spin" section (40% to 85%)
    if (bar >= totalBars * 0.25 && bar < totalBars * 0.85) {
      // Randomize timing slightly for organic "data stream" feel
      ringNoise.triggerAttackRelease("32n", time + H(5), 0.1);
    }
    ringIdx++;
  }, "8n").start(0);

  // === PALE GOLD STRINGS (High, lonely, shimmering) ===
  const strings = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    detune: 3,
    envelope: { attack: 1.2, decay: 0.8, sustain: 0.8, release: 3.0 }
  }).connect(chorus).connect(voidReverb);

  // Modal progression: C minor -> Ab -> Eb -> F (i - VI - III - VII)
  // High register for "pale gold" feel
  const stringChords = [
    ["C5", "E5", "G5", "C6"],
    ["Ab4", "C5", "Eb5", "Ab5"],
    ["Eb5", "G5", "Bb5", "Eb6"],
    ["F4", "A4", "C5", "F5"]
  ];
  let stringIdx = 0;
  const stringLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Strings enter after intro, exit before wind-down
    if (bar >= totalBars * 0.12 && bar < totalBars * 0.80) {
      // Soft attack to feel like a distant star
      strings.triggerAttackRelease(stringChords[stringIdx % stringChords.length], "2m", time, 0.25);
    }
    stringIdx++;
  }, "2m").start(0);

  // === GRAPHITE KICK (Deep, sparse impact) ===
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
  }).toDestination();

  // Very sparse. Only on the downbeat every 4 bars.
  let kickCount = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Enter in build, exit in wind-down
    if (bar >= totalBars * 0.25 && bar < totalBars * 0.80) {
      if (bar % 4 === 0) {
        kick.triggerAttackRelease("C1", "2n", time + H(2), 0.8);
      }
    }
    kickCount++;
  }, "1n").start(0);

  // === WINDING DOWNS (Reverse Cymbal Swell) ===
  // Adds "graphite silence" and "mineral skins" texture
  const windDown = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.5, decay: 1.5, sustain: 0, release: 1.0 }
  }).connect(voidReverb);

  Tone.Transport.schedule((time) => {
    windDown.triggerAttackRelease(2.5, time);
  }, totalBars * 0.85 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Fade reverb tail for the final silence
    voidReverb.wet.setValueAtTime(0.6, time);
    voidReverb.wet.linearRampToValueAtTime(0.0, time + 10);
  }, totalBars * 0.90 * secPerBar);

  // === STORE REFERENCES ===
  window.toneJsInstruments = { drone, ringNoise, strings, kick, windDown, spinFilter, chorus };
  window.toneJsParts = { droneLoop, ringLoop, stringLoop, kickLoop };
};


  </script>
