<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float sdSphere(vec3 p, float r) { return length(p) - r; }
float sdBox(vec3 p, vec3 b) {
  vec3 d = abs(p) - b;
  return length(max(d,0.0)) + min(max(d.x,max(d.y,d.z)),0.0);
}
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0-h);
}
float smax(float a, float b, float k) { return -smin(-a, -b, k); }

vec3 pal(float t) {
  return vec3(0.5,0.4,0.6) + 0.4*cos(6.28318*(vec3(0.0,1.0,2.0)*t + vec3(0.0,0.33,0.67)));
}

float map(vec3 p) {
  float t = iTime * 0.4;
  // The core memory: a shifting, breathing structure
  float core = sdSphere(p, 0.8 + 0.1*sin(t*3.0));
  // The floorboards: layered planes that undulate
  float floor = sdBox(p - vec3(0.0, -1.5, 0.0), vec3(2.0, 0.05, 2.0));
  float wave = sin(p.x*4.0 + t*2.0)*0.1;
  float floor2 = sdBox(p - vec3(0.0, -1.5 + wave, 0.0), vec3(2.0, 0.02, 2.0));
  // The drift: particles swirling around the core
  float drift = 100.0;
  for(int i=0; i<80; i++) {
    float fi = float(i);
    float a = fi*0.1 + t*0.5;
    float r = 1.2 + 0.3*sin(fi*0.2);
    vec3 pos = vec3(cos(a)*r, sin(fi*0.5)*0.5 + sin(t+fi)*0.2, sin(a)*r);
    float d = length(p - pos) - 0.04;
    drift = min(drift, d);
  }
  return smin(smin(core, floor, 0.5), floor2, 0.3);
}

float mapDrift(vec3 p) {
  float t = iTime * 0.4;
  float drift = 100.0;
  for(int i=0; i<80; i++) {
    float fi = float(i);
    float a = fi*0.1 + t*0.5;
    float r = 1.2 + 0.3*sin(fi*0.2);
    vec3 pos = vec3(cos(a)*r, sin(fi*0.5)*0.5 + sin(t+fi)*0.2, sin(a)*r);
    float d = length(p - pos) - 0.04;
    drift = min(drift, d);
  }
  return drift;
}

vec3 getNormal(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(
    map(p+e.xyy)-map(p-e.xyy),
    map(p+e.yxy)-map(p-e.yxy),
    map(p+e.yyx)-map(p-e.yyx)
  ));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy) / iResolution.y;
  float t = iTime * 0.4;
  
  // Camera orbit
  vec3 ro = vec3(3.0*cos(t*0.5), 1.5, 3.0*sin(t*0.5));
  vec3 target = vec3(0.0, -0.5, 0.0);
  vec3 fwd = normalize(target - ro);
  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up = cross(fwd, right);
  vec3 rd = normalize(fwd*1.5 + right*uv.x + up*uv.y);
  
  // Raymarch
  float d = 0.0;
  vec3 p = ro;
  vec3 col = vec3(0.02, 0.01, 0.03); // Deep void background
  
  for(int i=0; i<80; i++) {
    p = ro + rd*d;
    float h = map(p);
    if(h < 0.001 || d > 10.0) break;
    d += h;
  }
  
  if(d < 10.0) {
    vec3 n = getNormal(p);
    vec3 light = normalize(vec3(0.5, 0.8, 0.3));
    float diff = max(dot(n, light), 0.0);
    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    
    // Color mapping
    vec3 baseCol = pal(length(p)*0.5 + t*0.2);
    // The drift particles get a different hue
    float driftDist = mapDrift(p);
    bool isDrift = (driftDist < 0.05) && (driftDist > -0.01);
    vec3 driftCol = vec3(0.8, 0.3, 0.9); // Magenta memory
    
    col = mix(baseCol, driftCol, smoothstep(0.05, 0.0, driftDist)*0.5);
    col = col * (diff*0.8 + 0.2) + fresnel*0.3;
    
    // Add subtle glow to the drift particles
    col += isDrift * vec3(0.2, 0.1, 0.3) * (1.0 - smoothstep(0.0, 0.04, abs(driftDist)));
  }
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP (always include this block first) ===
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  // 45 seconds duration
  const totalBars = Math.round(45 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  // === VAST EMPTY SPACE ===
  const masterVerb = new Tone.Reverb({ decay: 4.5, wet: 0.55 }).toDestination();
  await masterVerb.generate();

  // === LONELY PAD (slow attack, heavy chorus, filtered) ===
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.4 }).connect(masterVerb);
  const padChorus = new Tone.Chorus({ frequency: 0.3, depth: 0.8, wet: 0.6 }).connect(padFilter).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 0.6, sustain: 0.3, release: 3.0 }
  }).connect(padChorus);

  // Sparse, descending progression - Dm -> Am -> Em -> Bdim (melancholy)
  const chords = [
    ["D3", "F3", "A3"],
    ["A2", "C3", "E3"],
    ["E2", "G2", "B2"],
    ["B2", "D3", "F3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Wind down before loop point
    if (bar >= totalBars * 0.80) {
      pad.triggerAttackRelease(chords[0], "2m", time, 0.15); // Return to opening chord softly
      return;
    }
    pad.triggerAttackRelease(chords[chordIdx % chords.length], "2m", time, 0.22);
    chordIdx++;
  }, "2m").start(0);

  // === MINIMAL BASS (very sparse, sine only) ===
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.1, decay: 0.5, sustain: 0, release: 0.4 }
  }).connect(masterVerb);

  let bassCount = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only play every 4 bars, and stop before loop point
    if (bar >= totalBars * 0.15 && bar < totalBars * 0.80 && bar % 4 === 0) {
      const notes = ["D1", "A0", "E1", "B0"];
      bass.triggerAttackRelease(notes[bassCount % notes.length], "2n", time, 0.35);
      bassCount++;
    }
  }, "1m").start(0);

  // === NO KICK, NO HATS - just space and ache ===

  // === STORE REFERENCES (required for cleanup) ===
  window.toneJsInstruments = { pad, bass };
  window.toneJsParts = { padLoop, bassLoop };
};


  </script>
