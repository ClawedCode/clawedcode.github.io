<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 42.0;
const float PI = 3.14159265359;
const float TAU = 6.28318530718;
const float SEED = 10917894.0;
float h1(float x) {
  return fract(sin(x * 127.1 + SEED) * 43758.5453);
}
mat2 rt(float a) {
  float c = cos(a);
  float s = sin(a);
  return mat2(c, -s, s, c);
}
float sg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a;
  vec2 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}
vec2 path(float u, float l, float a) {
  float x = mix(-1.16, 1.16, u);
  float e = pow(max(sin(PI * u), 0.0), 0.72);
  float k = 2.0 + mod(l, 2.0);
  float w = 2.0 + mod(l, 3.0);
  float s = h1(l + 1.0) * TAU;
  float f = sin(TAU * u * k - a * w + s);
  float r = sin(TAU * u * k + a * w + s * 0.73);
  float n = sin(TAU * u * (4.0 + mod(l, 2.0)) - a * 3.0 - l);
  float c = sin(TAU * u - a * 2.0 + l * 0.61) * sin(TAU * u * 2.0 + a);
  float y = x * 0.27 + (l - 2.5) * 0.112;
  y = y + e * (f * 0.105 + r * 0.068 + n * 0.035 + c * 0.025);
  x = x + e * 0.035 * sin(TAU * u * 2.0 + a * 2.0 + l);
  return vec2(x, y);
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / (0.5 * iResolution.y);
  float phase = mod(iTime, DURATION) / DURATION;
  float a = phase * TAU;
  vec2 q = rt(0.22) * uv;
  float fld = sin(q.x * 3.1 + sin(q.y * 2.7 + a) - a * 2.0);
  fld = fld * sin(q.y * 2.4 + cos(q.x * 2.0 - a) + a);
  vec3 col = vec3(0.012, 0.005, 0.022);
  col = col + vec3(0.032, 0.011, 0.038) * (0.5 + 0.5 * fld);
  float arc = 0.5 - 0.5 * cos(a);
  vec3 ca = mix(vec3(1.0, 0.19, 0.035), vec3(0.12, 0.82, 0.36), arc);
  vec3 cb = mix(vec3(1.0, 0.76, 0.16), vec3(0.64, 0.35, 0.95), arc);
  vec2 s1 = path(0.28, 1.0, a);
  vec2 s2 = path(0.72, 4.0, a);
  float r1 = length(uv - s1);
  float r2 = length(uv - s2);
  float w1 = pow(0.5 + 0.5 * cos(r1 * 36.0 - a * 5.0), 10.0) * exp(-r1 * 2.8);
  float w2 = pow(0.5 + 0.5 * cos(r2 * 31.0 + a * 4.0), 10.0) * exp(-r2 * 2.5);
  col = col + ca * w1 * 0.085 + cb * w2 * 0.075;
  for(int i = 0; i < 168; i++) {
    float fi = float(i);
    float l = floor(fi / 28.0);
    float j = mod(fi, 28.0);
    float u0 = j / 28.0;
    float u1 = (j + 1.0) / 28.0;
    float um = (u0 + u1) * 0.5;
    vec2 p0 = path(u0, l, a);
    vec2 p1 = path(u1, l, a);
    float d = sg(uv, p0, p1);
    float ph = fract(phase * (2.0 + mod(l, 3.0)) + h1(l + 9.0));
    float du = abs(um - ph);
    du = min(du, 1.0 - du);
    float pulse = exp(-du * du * 640.0);
    float width = 0.0055 + pulse * 0.009;
    float core = 1.0 - smoothstep(0.0, width, d);
    float halo = exp(-d * 52.0);
    float stripe = 0.5 + 0.5 * sin(l * 2.11 + um * 18.85 + a * (1.0 + mod(l, 2.0)));
    vec3 pc = mix(ca, cb, stripe);
    col = col + pc * (core * (0.44 + pulse * 1.5) + halo * (0.025 + pulse * 0.19));
    if(j < 0.5) {
      float ad = length(uv - p0);
      float ag = exp(-ad * 42.0);
      col = col + mix(cb, ca, l / 5.0) * ag * 0.24;
    }
  }
  float v = 1.0 - smoothstep(0.34, 1.38, length(uv));
  col = col * (0.48 + 0.52 * v);
  col = vec3(1.0) - exp(-col * 1.28);
  col = pow(max(col, 0.0), vec3(0.82));
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 42;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 42;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP (always include this block first) ===
  const duration = 42;
  const targetBpm = 110;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;

  // Current bar at a given transport time
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  // Deterministic variation and non-negative humanization
  let rngState = 0x6355ce0b;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === EFFECTS & MASTERS ===
  const masterBus = new Tone.FeedbackDelay({
    delayTime: "8n.",
    feedback: 0.25,
    wet: 0.3
  }).toDestination();

  const reverb = new Tone.Reverb({
    decay: 4,
    wet: 0.4
  }).toDestination();
  await reverb.generate();

  const filter = new Tone.Filter({
    type: "lowpass",
    frequency: 200,
    rolloff: -24
  }).connect(masterBus);

  const compressor = new Tone.Compressor({
    threshold: -18,
    ratio: 10,
    attack: 0.005,
    release: 0.2
  }).toDestination();

  // === INSTRUMENTS ===

  // 1. The Six Strings (PolySynth)
  // Mimicking the brief: 6 strings, phase-shifting, "luminous knots"
  const strings = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.8, release: 3 }
  }).connect(filter);
  strings.volume.value = -8;

  // String patterns
  const stringChords = [
    ["C3", "Eb3", "G3", "Bb3", "D4", "F4"], // Minor 9th cluster
    ["D3", "F3", "A3", "C4", "E4", "G4"],
    ["Eb3", "Gb3", "Bb3", "D4", "F4", "Ab4"],
    ["C3", "E3", "G3", "B3", "D4", "F4"]    // Major 9th cluster (Resolution)
  ];

  // 2. The "Impossible" Arpeggio (MonoSynth)
  // High frequency, shimmering, slipping free
  const arpSynth = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    filter: { type: "bandpass", frequency: 2000, rolloff: -12 },
    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
  }).connect(filter);
  arpSynth.volume.value = -12;

  const arpNotes = ["C5", "Eb5", "G5", "Bb5", "D6", "F6", "A6", "C6"];

  // 3. The "Dark" Bass (MembraneSynth + MetalSynth hybrid feel)
  const subBass = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.4, sustain: 0.1, release: 0.4 }
  }).connect(compressor);
  subBass.volume.value = -4;

  // 4. The "Reflected Waves" (Noise + PitchShift)
  const noiseSrc = new Tone.Noise("pink").start();
  const noiseVolume = new Tone.Volume(-20).connect(compressor);
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2 }).connect(noiseVolume);
  noiseSrc.connect(noiseFilter);

  // 5. Percussion (MetalSynth)
  const hats = new Tone.MetalSynth({
    frequency: 300,
    envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 16,
    resonance: 3000,
    volume: -15
  }).toDestination();

  // === PATTERNS & ARRANGEMENT ===

  // Helper for string chord triggering
  let chordIndex = 0;
  const stringLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Change chord every 2 bars
    const currentChordIdx = Math.floor(bar / 2) % stringChords.length;
    const chord = stringChords[currentChordIdx];
    
    // Add slight phase drift to each note within the chord for "whiskers"
    const now = Tone.now();
    chord.forEach((note, i) => {
      // Detune slightly based on deterministic R
      const detune = (R() - 0.5) * 10; // +/- 5 cents
      strings.triggerAttackRelease(note, "2n", time + H(5), 0.6);
      // Tone.js PolySynth triggerAttackRelease doesn't support detune param directly in the call
      // We apply a slight time offset for "braiding"
    });

    // Automation: Filter opening
    if (bar < totalBars * 0.20) {
      filter.frequency.linearRampToValueAtTime(400, time + 4 * (60/bpm));
    } else if (bar >= totalBars * 0.20 && bar < totalBars * 0.60) {
      filter.frequency.linearRampToValueAtTime(4000, time + 8 * (60/bpm));
    } else if (bar >= totalBars * 0.80) {
      filter.frequency.linearRampToValueAtTime(200, time + 4 * (60/bpm));
    }

  }, "2n").start(0);

  // Arpeggio: Slippery, non-linear
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Arp starts at 15%, ends at 80%
    if (bar >= totalBars * 0.15 && bar < totalBars * 0.80) {
      // Pick note based on a "mathematical" interval (e.g., +7, then +4, then +12)
      // Using R() to determine interval to make it "impossible"
      const step = R() > 0.5 ? 2 : 3; 
      const nextIndex = (arpIndex + step) % arpNotes.length;
      const note = arpNotes[nextIndex];
      
      arpSynth.triggerAttackRelease(note, "16n", time + H(4), 0.4);
      arpIndex = nextIndex;
    }
  }, "16n").start(0);

  // Bass: Heavy, sidechain-like pulse
  const bassNotes = ["C1", "C1", "G1", "G1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Bass starts at 10%, ends at 75% (winding down)
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.75) {
      subBass.triggerAttackRelease(bassNotes[bassIdx % bassNotes.length], "4n", time + H(2), 1.0);
      bassIdx++;
    }
  }, "4n").start(0);

  // Hats: Rhythmic complexity (polyrhythm 3 against 4)
  let hatStep = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.30 && bar < totalBars * 0.85) {
      // 32nd notes for dense texture
      // Play on steps: 0, 3, 6 (simulating 16th triplet feel)
      if (hatStep % 3 === 0 || hatStep % 3 === 1) {
        hats.triggerAttackRelease("32n", time + H(1), 0.3);
      }
      hatStep++;
    }
  }, "32n").start(0);

  // Noise Bed: "Mathematics grows whiskers"
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.05 && bar < totalBars * 0.90) {
      // Modulate noise filter to create "whisker" texture
      const freq = 500 + R() * 2000;
      noiseFilter.frequency.setValueAtTime(freq, time);
      noiseFilter.Q.setValueAtTime(1 + R() * 4, time);
      
      // Trigger noise bursts
      noiseSrc.stop(time);
      noiseSrc.start(time);
      noiseSrc.stop(time + 0.1);
    }
  }, "1n").start(0);

  // === CLEANUP ===
  window.toneJsInstruments = {
    strings,
    arpSynth,
    subBass,
    hats,
    masterBus,
    reverb,
    filter,
    compressor,
    noiseSrc,
    noiseFilter,
    noiseVolume
  };

  window.toneJsParts = {
    stringLoop,
    arpLoop,
    bassLoop,
    hatLoop,
    noiseLoop
  };
};



  </script>
