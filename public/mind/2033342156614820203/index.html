<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n){return fract(sin(n)*43758.5);}

vec3 particle(vec2 uv,float t){
  vec3 col=vec3(0);
  for(int i=0;i<800;i++){
    float fi=float(i);
    float h=hash(fi*0.1);
    float h2=hash(fi*0.13);
    float h3=hash(fi*0.17);
    float angle=h*6.28318;
    float speed=0.3+h2*0.4;
    float phase=h3*6.28318;
    float pulse=sin(t*2.0+phase)*0.5+0.5;
    float dist=t*speed*pulse;
    float angleDrift=sin(t*0.5+phase)*0.3;
    angle+=angleDrift;
    vec2 pos=vec2(cos(angle),sin(angle))*dist;
    float d=length(uv-pos);
    float brightness=0.002/d;
    brightness*=smoothstep(0.0,0.1,dist);
    brightness*=1.0-smoothstep(1.5,2.5,dist);
    vec3 c=vec3(0.5+0.5*sin(h*6.28+t*0.5),0.5+0.5*sin(h2*6.28+t*0.3),0.5+0.5*sin(h3*6.28+t*0.7));
    col+=c*brightness;
  }
  return col;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0);
  vec3 col=vec3(0.02,0.01,0.03);
  float centerPulse=0.5+0.5*sin(t*3.0);
  float centerDist=length(uv);
  col+=vec3(0.8,0.6,1.0)*0.05*centerPulse/max(centerDist,0.01);
  vec2 uvR=uv+vec2(0.015,0.0)*sin(t*2.0);
  vec2 uvG=uv;
  vec2 uvB=uv-vec2(0.015,0.0)*sin(t*2.0);
  vec3 pR=particle(uvR,t);
  vec3 pG=particle(uvG,t);
  vec3 pB=particle(uvB,t);
  col.r+=pR.r*1.2;
  col.g+=pG.g*1.0;
  col.b+=pB.b*1.3;
  col=pow(col,vec3(0.8));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.4 }).toDestination();
  await masterReverb.generate();

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.8, release: 2.0 }
  }).connect(masterReverb);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -12,
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.7, release: 2.5 }
  }).connect(masterReverb);

  const pad2 = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: 8,
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.7, release: 2.5 }
  }).connect(masterReverb);

  const pulse = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 0.3, sustain: 0, release: 0.1 }
  }).connect(masterReverb);

  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(masterReverb);

  const bassLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease("C1", "1n", time, 0.6);
  }, "1n").start(0);

  const padChords = [
    ["E3", "G3", "B3"],
    ["D3", "F3", "A3"],
    ["C3", "E3", "G3"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "2n", time, 0.15);
    pad2.triggerAttackRelease(padChords[chordIndex % padChords.length], "2n", time, 0.12);
    chordIndex++;
  }, "2n").start(0);

  let pulseCount = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 16) {
      const velocity = 0.3 + Math.sin(pulseCount * 0.5) * 0.15;
      pulse.triggerAttackRelease("E4", "16n", time, velocity);
    }
    pulseCount++;
  }, "4n").start(0);

  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 14 && bellIndex % 3 === 0) {
      const notes = ["E5", "G5", "B5", "D5"];
      const note = notes[Math.floor(Math.random() * notes.length)];
      bell.triggerAttackRelease(note, "8n", time, 0.2);
    }
    bellIndex++;
  }, "4n").start(0);

  window.toneJsInstruments = { subBass, pad, pad2, pulse, bell };
  window.toneJsParts = { bassLoop, padLoop, pulseLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
