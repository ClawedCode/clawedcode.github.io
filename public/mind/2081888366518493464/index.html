<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec3 palette(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 indigo = vec3(0.18, 0.10, 0.55);
  vec3 teal = vec3(0.10, 0.75, 0.80);
  vec3 white = vec3(0.95, 0.98, 1.0);
  if(t < 0.5) return mix(indigo, teal, smoothstep(0.0, 0.5, t));
  return mix(teal, white, smoothstep(0.5, 1.0, t));
}

float hash(vec2 p){
  return fract(sin(dot(p, vec2(12.9898, 78.233)))*43758.5453);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy)/iResolution.y;

  float glitchY = floor(uv.y * 60.0);
  float glitchT = floor(iTime * 4.0);
  float glitchAmt = step(0.93, hash(vec2(glitchY, glitchT))) * 0.025;
  vec2 guv = uv;
  guv.x += glitchAmt * sin(iTime*40.0);

  float r = length(guv);
  float a = atan(guv.y, guv.x);

  float beatT = mod(iTime, 1.5) / 1.5;
  float bp1 = (beatT - 0.10) * 8.0;
  float bp2 = (beatT - 0.32) * 10.0;
  float beat = exp(-bp1*bp1) + exp(-bp2*bp2) * 0.6;

  float breath = 0.5 + 0.5*sin(iTime * 0.41888);

  float ripples = 0.0;
  for(float i = 0.0; i < 5.0; i++){
    float pulsePhase = fract(iTime/3.0 - i*0.2);
    float pulseR = pulsePhase * 1.7;
    float ringWidth = 0.04 + 0.06*pulsePhase;
    float ring = smoothstep(ringWidth, 0.0, abs(r - pulseR));
    float fade = 1.0 - pulsePhase;
    ring *= fade * fade;
    ripples += ring * 0.85;
  }

  float refrPattern = sin(r*18.0 - iTime*4.18879)*0.5+0.5;
  refrPattern *= exp(-r*1.8);

  float core = exp(-r*4.5);
  core *= (0.55 + 0.45*beat);
  core *= (0.8 + 0.2*breath);

  float angInt = sin(a*6.0 + iTime*0.5236)*0.5+0.5;
  angInt *= sin(r*12.0 - iTime*2.094)*0.5+0.5;
  angInt *= exp(-r*2.0) * 0.28;

  float intensity = core*1.3 + ripples*0.7 + refrPattern*0.13 + angInt;

  float colorT = intensity*0.85 + (1.0 - smoothstep(0.0, 1.5, r))*0.18;
  colorT += beat * 0.12;

  vec3 col = palette(colorT) * intensity;

  float entropy = step(0.97, hash(vec2(floor(uv.y*120.0), floor(iTime*6.0))));
  col += vec3(0.3, 0.5, 0.6) * entropy * 0.18;

  vec3 bg = vec3(0.025, 0.018, 0.07) * (1.0 + 0.3*breath);
  col = col + bg * (1.0 - clamp(intensity, 0.0, 1.0));

  col *= 1.0 - r*0.15;

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 80;
  Tone.Transport.bpm.value = bpm;

  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 9, wet: 0.55 }).toDestination();
  await masterReverb.generate();

  const padReverb = new Tone.Reverb({ decay: 6, wet: 0.6 }).toDestination();
  await padReverb.generate();

  const kickFilter = new Tone.Filter({ type: "lowpass", frequency: 220 }).toDestination();
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.1 }
  }).connect(kickFilter);
  kick.volume.value = -4;

  const heartLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60/bpm) / 4);
    const v1 = bar < 2 ? 0.7 : (bar >= 17 ? 0.7 : 0.95);
    const v2 = bar < 2 ? 0.4 : (bar >= 17 ? 0.4 : 0.6);
    kick.triggerAttackRelease("A1", "4n", time + H(3), v1);
    kick.triggerAttackRelease("F1", "4n", time + 0.18 + H(3), v2);
  }, "2n").start(0);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.4 }).connect(padReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.13, delayTime: 4, depth: 0.55, wet: 0.5 }).connect(padFilter).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -7,
    envelope: { attack: 2.2, decay: 1.2, sustain: 0.7, release: 3.2 }
  }).connect(padChorus);
  pad.volume.value = -11;

  const padChords = [
    ["A2", "C3", "E3", "G3", "B3"],
    ["F2", "A2", "C3", "E3", "G3"],
    ["E2", "G2", "B2", "D3", "F3"],
    ["D2", "F2", "A2", "C3", "E3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1m", time + H(15), 0.42);
    chordIdx++;
  }, "1m").start(0);

  for (let i = 0; i < 4; i++) {
    const startBar = i * 4;
    Tone.Transport.schedule((time) => {
      padFilter.frequency.linearRampToValueAtTime(2000, time + 6);
      padFilter.frequency.linearRampToValueAtTime(600, time + 12);
    }, `${startBar}:0:0`);
  }

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 130 }).toDestination();
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.85, release: 2.5 }
  }).connect(subFilter);
  sub.volume.value = -13;

  const subRoots = ["A1", "F1", "E1", "D1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    sub.triggerAttackRelease(subRoots[subIdx % subRoots.length], "1m", time + H(8), 0.7);
    subIdx++;
  }, "1m").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.45 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.6, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.2 }
  }).connect(bellDelay);
  bell.volume.value = -17;

  const bellNotes = ["A5", "C6", "E6", "G6", "B5", "D6", "F5"];
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60/bpm) / 4);
    if (bar >= 3 && bar < 17) {
      const density = bar < 6 ? 0.12 : (bar < 14 ? 0.22 : 0.10);
      if (Math.random() < density) {
        const note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
        bell.triggerAttackRelease(note, "8n", time + H(20), 0.28 + Math.random()*0.3);
      }
    }
  }, "8n").start(0);

  const shimmerDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.6, wet: 0.5 }).connect(masterReverb);
  const shimmerFilter = new Tone.Filter({ type: "highpass", frequency: 600 }).connect(shimmerDelay);
  const shimmer = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.6, decay: 0.6, sustain: 0.2, release: 2.2 }
  }).connect(shimmerFilter);
  shimmer.volume.value = -22;

  const shimmerNotes = ["E5", "G5", "A5", "C6", "B5", "D6"];
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60/bpm) / 4);
    if (bar >= 5 && bar < 15) {
      if (Math.random() < 0.35) {
        const note = shimmerNotes[Math.floor(Math.random() * shimmerNotes.length)];
        shimmer.triggerAttackRelease(note, "2n", time + H(25), 0.4);
      }
    }
  }, "2n").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 900, Q: 4 }).connect(masterReverb);
  const noise = new Tone.Noise("pink").connect(noiseFilter);
  noise.volume.value = -36;
  noise.start();

  const noiseLfo = new Tone.LFO({
    frequency: 1/15,
    min: -40,
    max: -28
  }).connect(noise.volume);
  noiseLfo.start();

  window.toneJsInstruments = { kick, pad, sub, bell, shimmer, noise };
  window.toneJsParts = { heartLoop, padLoop, subLoop, bellLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
