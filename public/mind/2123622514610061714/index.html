<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');

(() => {
  // THE SLIDE EDGE. Johns Hopkins, 1958: Hubel and Wiesel record one cell in a cat's visual cortex while spots of light
  // are thrown on a screen in front of its eyes. For hours the cell says nothing. Then a glass slide goes into the
  // projector, the faint shadow of its edge sweeps across the screen, and the cell goes off "like a machine gun".
  // It wants lines, at one angle. We are the cat, looking at the screen; the scope at the bottom is the cell's voice
  // (its spikes are the same table the score plays). Then the whole cortex: every angle has its cells, arranged in
  // pinwheels. Machines that see were built on those cells. The last thing on the screen is what one of them saw.
  const W = 900, H = 900, DURATION = 60, BPM = 104, BAR = 240 / BPM, BARS = 26;
  const PI = Math.PI, TAU = PI * 2, DEG = PI / 180;
  const PREF = 60 * DEG; // the recorded cell's angle

  // ------------------------------------------------------------------ helpers (setup and pure math only)
  let seed = 1958;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const axial = (a) => ((a % PI) + PI) % PI; // an orientation, 0..pi
  const adiff = (a, b) => { const d = axial(a - b); return Math.min(d, PI - d); };
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) >>> 0; h = ((h ^ (h >>> 13)) * 1274126177) >>> 0; return (h ^ (h >>> 16)) / 4294967296; };

  // the orientation palette: one colour per angle, cyclic over 180 degrees
  const PAL = [[232, 163, 58], [239, 230, 210], [63, 183, 176], [212, 96, 122]];
  const pal = (theta) => {
    const x = (axial(theta) / PI) * 4, i = Math.floor(x) % 4, f = x - Math.floor(x), u = f * f * (3 - 2 * f);
    const a = PAL[i], b = PAL[(i + 1) % 4];
    return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
  };
  const rgba = (c, a, k = 1) => `rgba(${(c[0] * k) | 0},${(c[1] * k) | 0},${(c[2] * k) | 0},${a})`;

  // ------------------------------------------------------------------ the shared clock: this table is also the score's
  // Spikes on a grid of 32nd notes: g = bar * 32 + slot. The score (strudel.js) builds the same table with the same code.
  const thetaS = (b) => (b < 14.75 ? PREF : b < 19 ? PREF + PI * (b - 14.75) / 4.25 : b < 21 ? PREF + PI + PI * (b - 19) / 2 : PREF);
  const SPIKES = (() => {
    const out = [];
    [[1, 18], [2, 7], [3, 26], [4, 11], [5, 3], [5, 21], [24, 14], [25, 9]].forEach(([bar, s]) => out.push(bar * 32 + s));
    for (let s = 0; s < 32; s++) if (s < 12 || (s < 24 && s % 2 === 0) || s % 4 === 0) out.push(7 * 32 + s);
    for (let k = 0; k < 12; k++) {
      const d = adiff(k * 15 * DEG, PREF) / DEG, n = Math.round(7 * Math.exp(-Math.pow(d / 20, 2)));
      const bar = 8 + Math.floor(k / 2), base = (k % 2) * 16 + 8;
      for (let j = 0; j < n; j++) out.push(bar * 32 + base - Math.floor(n / 2) + j);
    }
    for (let g = 14 * 32; g < 21 * 32; g += 2) {
      const b = g / 32;
      if (b < 14.75) continue;
      if (adiff(thetaS(b), PREF) < 9 * DEG) out.push(g);
    }
    return out.sort((a, b) => a - b);
  })();
  const SWEEPS = Array.from({ length: 12 }, (_, k) => {
    const d = adiff(k * 15 * DEG, PREF) / DEG;
    return { a: k * 15 * DEG, n: Math.round(7 * Math.exp(-Math.pow(d / 20, 2))), start: 8 + k / 2 };
  });

  // ------------------------------------------------------------------ the lab: a tangent screen in a dark room
  const SCR = { x: 90, y: 64, w: 720, h: 560 };
  const FIX = [450, 344];
  const RF = [566, 300];
  const lab = document.createElement('canvas');
  lab.width = W; lab.height = H;
  {
    const g = lab.getContext('2d');
    g.fillStyle = '#06080b';
    g.fillRect(0, 0, W, H);
    const room = g.createRadialGradient(450, 340, 80, 450, 380, 640);
    room.addColorStop(0, 'rgba(70,64,52,0.35)');
    room.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = room;
    g.fillRect(0, 0, W, H);
    // the screen: matte board lit by the projector
    const lit = g.createRadialGradient(470, 320, 40, 450, 344, 520);
    lit.addColorStop(0, '#d9d2c1');
    lit.addColorStop(0.6, '#b9b1a0');
    lit.addColorStop(1, '#8e8778');
    g.fillStyle = lit;
    g.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
    // board texture, fixed
    const img = g.getImageData(SCR.x, SCR.y, SCR.w, SCR.h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (rnd() - 0.5) * 7;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, SCR.x, SCR.y);
    // degrees of visual angle, printed faintly
    g.save();
    g.beginPath();
    g.rect(SCR.x, SCR.y, SCR.w, SCR.h);
    g.clip();
    g.strokeStyle = 'rgba(70,62,50,0.22)';
    g.lineWidth = 1;
    [70, 150, 250, 380].forEach((r) => { g.beginPath(); g.arc(FIX[0], FIX[1], r, 0, TAU); g.stroke(); });
    for (let k = 0; k < 12; k++) {
      const a = k * 30 * DEG;
      g.beginPath();
      g.moveTo(FIX[0] + Math.cos(a) * 18, FIX[1] + Math.sin(a) * 18);
      g.lineTo(FIX[0] + Math.cos(a) * 600, FIX[1] + Math.sin(a) * 600);
      g.stroke();
    }
    g.restore();
    g.strokeStyle = 'rgba(50,44,36,0.7)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(FIX[0] - 9, FIX[1]); g.lineTo(FIX[0] + 9, FIX[1]);
    g.moveTo(FIX[0], FIX[1] - 9); g.lineTo(FIX[0], FIX[1] + 9);
    g.stroke();
    g.fillStyle = 'rgba(60,54,44,0.55)';
    g.font = '13px "Courier New", monospace';
    g.fillText('10°', FIX[0] + 152, FIX[1] - 4);
    g.fillText('20°', FIX[0] + 252, FIX[1] - 4);
  }

  // the projected spot visits one place per beat (seeded once)
  const SPOTS = Array.from({ length: 104 }, () => [SCR.x + 70 + rnd() * (SCR.w - 140), SCR.y + 60 + rnd() * (SCR.h - 120)]);

  // ------------------------------------------------------------------ the cortex: an orientation map with pinwheels
  const MN = 450, MS = W / MN;
  const mapCos = new Float32Array(MN * MN), mapSin = new Float32Array(MN * MN), mapSel = new Float32Array(MN * MN);
  const mapCol = new Uint8ClampedArray(MN * MN * 3);
  let cellAt = [450, 330];
  {
    const N = 22, k0 = TAU / 118; // about 5.5 hypercolumns across the frame
    const waves = Array.from({ length: N }, () => {
      const a = rnd() * TAU;
      return [Math.cos(a) * k0, Math.sin(a) * k0, rnd() * TAU];
    });
    let best = -1;
    for (let y = 0; y < MN; y++) {
      for (let x = 0; x < MN; x++) {
        let re = 0, im = 0;
        for (let j = 0; j < N; j++) {
          const ph = waves[j][0] * x + waves[j][1] * y + waves[j][2];
          re += Math.cos(ph); im += Math.sin(ph);
        }
        const i = y * MN + x, th = axial(Math.atan2(im, re) / 2), sel = Math.min(1, Math.hypot(re, im) / Math.sqrt(N) / 1.25);
        mapCos[i] = Math.cos(2 * th); mapSin[i] = Math.sin(2 * th); mapSel[i] = sel;
        const c = pal(th);
        mapCol[i * 3] = c[0]; mapCol[i * 3 + 1] = c[1]; mapCol[i * 3 + 2] = c[2];
        // the recorded cell: tuned to PREF, strongly selective, near the middle
        const px = x * MS, py = y * MS;
        if (Math.abs(px - 450) < 160 && Math.abs(py - 330) < 120) {
          const score = sel - adiff(th, PREF) * 3;
          if (score > best) { best = score; cellAt = [px, py]; }
        }
      }
    }
  }
  // pinwheel centres: points the angle turns all the way around (winding of arg z over a small loop)
  const PINS = [];
  {
    const ang = (i) => Math.atan2(mapSin[i], mapCos[i]);
    const wrap = (x) => x - TAU * Math.round(x / TAU);
    for (let y = 2; y < MN - 3; y += 2) for (let x = 2; x < MN - 3; x += 2) {
      const a = y * MN + x, b2 = a + 2, c = a + 2 * MN + 2, d = a + 2 * MN;
      const w = wrap(ang(b2) - ang(a)) + wrap(ang(c) - ang(b2)) + wrap(ang(d) - ang(c)) + wrap(ang(a) - ang(d));
      if (Math.abs(w) > PI && !PINS.some(([px, py]) => Math.hypot(px - (x + 1) * MS, py - (y + 1) * MS) < 24)) PINS.push([(x + 1) * MS, (y + 1) * MS]);
    }
  }
  const mapC = document.createElement('canvas');
  mapC.width = MN; mapC.height = MN;
  const mapG = mapC.getContext('2d');
  const mapImg = mapG.createImageData(MN, MN);

  // ------------------------------------------------------------------ what it saw: a black cat, known only by its edges
  const EN = 300, ES = W / EN; // edge image at 1/3 scale
  const drawFace = (g, part) => {
    g.save();
    g.scale(1 / ES, 1 / ES);
    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (part === 'base') {
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(450, 606);
      g.bezierCurveTo(372, 606, 286, 566, 262, 478);
      g.bezierCurveTo(244, 410, 262, 336, 296, 288);
      g.lineTo(268, 122);
      g.bezierCurveTo(330, 160, 372, 206, 398, 246);
      g.quadraticCurveTo(450, 230, 502, 246);
      g.bezierCurveTo(528, 206, 570, 160, 632, 122);
      g.lineTo(604, 288);
      g.bezierCurveTo(638, 336, 656, 410, 638, 478);
      g.bezierCurveTo(614, 566, 528, 606, 450, 606);
      g.closePath();
      g.fill();
      // shoulders, down into the scope
      g.beginPath();
      g.moveTo(330, 580); g.bezierCurveTo(250, 610, 200, 650, 170, 720);
      g.lineTo(730, 720);
      g.bezierCurveTo(700, 650, 650, 610, 570, 580);
      g.closePath();
      g.fill();
      g.strokeStyle = '#000';
      g.lineWidth = 7;
      // inner ears
      g.beginPath();
      g.moveTo(300, 270); g.lineTo(290, 170); g.lineTo(372, 240);
      g.moveTo(600, 270); g.lineTo(610, 170); g.lineTo(528, 240);
      g.stroke();
      // nose and mouth
      g.beginPath();
      g.moveTo(426, 470); g.lineTo(474, 470); g.lineTo(450, 494); g.closePath();
      g.fillStyle = '#000';
      g.fill();
      g.beginPath();
      g.moveTo(450, 494); g.lineTo(450, 512);
      g.quadraticCurveTo(428, 536, 404, 518);
      g.moveTo(450, 512);
      g.quadraticCurveTo(472, 536, 496, 518);
      g.stroke();
      // whiskers, out past the cheeks
      g.lineWidth = 5;
      g.strokeStyle = '#fff';
      [[-1, 0], [1, 0]].forEach(([side]) => {
        [[-14, -30], [0, 4], [14, 38]].forEach(([dy, end]) => {
          g.beginPath();
          g.moveTo(450 + side * 70, 500 + dy);
          g.quadraticCurveTo(450 + side * 200, 492 + dy + end * 0.3, 450 + side * 350, 486 + dy + end);
          g.stroke();
        });
      });
      // the seam where the chest meets the head
      g.strokeStyle = '#000';
      g.lineWidth = 6;
      g.beginPath();
      g.moveTo(320, 578); g.quadraticCurveTo(450, 640, 580, 578);
      g.stroke();
    } else {
      g.fillStyle = '#fff';
      g.strokeStyle = '#fff';
      [375, 525].forEach((cx, side) => {
        const tilt = side ? -0.12 : 0.12;
        g.save();
        g.translate(cx, 404);
        g.rotate(tilt);
        if (part === 'open') {
          g.beginPath();
          g.moveTo(-50, 0);
          g.quadraticCurveTo(0, -46, 50, 0);
          g.quadraticCurveTo(0, 40, -50, 0);
          g.fill();
          g.fillStyle = '#000';
          g.beginPath();
          g.ellipse(0, 0, 7, 25, 0, 0, TAU);
          g.fill();
          g.fillStyle = '#fff';
        } else {
          g.lineWidth = 9;
          g.beginPath();
          g.moveTo(-50, 0);
          g.quadraticCurveTo(0, 22, 50, 0);
          g.stroke();
        }
        g.restore();
      });
    }
    g.restore();
  };
  const NB = 24; // orientation buckets of 7.5 degrees
  const edgeSet = (part) => {
    const c = document.createElement('canvas');
    c.width = EN; c.height = EN;
    const g = c.getContext('2d');
    drawFace(g, part);
    const b = document.createElement('canvas');
    b.width = EN; b.height = EN;
    const bg = b.getContext('2d');
    bg.filter = 'blur(1.2px)';
    bg.drawImage(c, 0, 0);
    const d = bg.getImageData(0, 0, EN, EN).data;
    const v = (x, y) => d[(clamp(y, 0, EN - 1) * EN + clamp(x, 0, EN - 1)) * 4] / 255;
    const GX = new Float32Array(EN * EN), GY = new Float32Array(EN * EN), M = new Float32Array(EN * EN);
    for (let y = 1; y < EN - 1; y++) for (let x = 1; x < EN - 1; x++) {
      const i = y * EN + x;
      GX[i] = (v(x + 1, y) - v(x - 1, y)) * 0.5; GY[i] = (v(x, y + 1) - v(x, y - 1)) * 0.5;
      M[i] = Math.hypot(GX[i], GY[i]);
    }
    // thin to one line per edge (non-maximum suppression), then space the cells evenly along it
    const paths = Array.from({ length: NB }, () => new Path2D());
    const taken = new Uint8Array(EN * EN);
    const SP = 2.4;
    let count = 0;
    for (let y = 2; y < EN - 2; y++) for (let x = 2; x < EN - 2; x++) {
      const i = y * EN + x, m = M[i];
      if (m < 0.075) continue;
      const ox = Math.round(GX[i] / m), oy = Math.round(GY[i] / m);
      if (m < M[i + oy * EN + ox] || m < M[i - oy * EN - ox]) continue;
      let near = false;
      for (let dy = -3; dy <= 3 && !near; dy++) for (let dx = -3; dx <= 3; dx++) {
        if (dx * dx + dy * dy < SP * SP && taken[(y + dy) * EN + x + dx]) { near = true; break; }
      }
      if (near) continue;
      taken[i] = 1;
      const phi = axial(Math.atan2(GY[i], GX[i]) + PI / 2), k = Math.floor((phi / PI) * NB) % NB;
      const px = x * ES, py = y * ES, L = 3.4, ca = Math.cos(phi) * L, sa = Math.sin(phi) * L;
      if (py > 668) continue; // the scope covers below
      paths[k].moveTo(px - ca, py - sa);
      paths[k].lineTo(px + ca, py + sa);
      count++;
    }
    return { paths, count };
  };
  const EDGE = { base: edgeSet('base'), open: edgeSet('open'), shut: edgeSet('shut') };
  const bucketTheta = (k) => ((k + 0.5) / NB) * PI;

  // ------------------------------------------------------------------ the scope: one sweep per bar
  const SC = { x0: 108, x1: 792, y: 790 };
  const scopePath = (bar, from, to) => {
    // the trace of one bar between two phases, with that bar's spikes; noise is a hash of (bar, x)
    const bb = ((bar % BARS) + BARS) % BARS;
    const pts = [];
    const x0 = lerp(SC.x0, SC.x1, from), x1 = lerp(SC.x0, SC.x1, to);
    for (let x = x0; x <= x1; x += 3) pts.push([x, SC.y + (hash(bb, x | 0) - 0.5) * 3.2]);
    const sp = [];
    for (let i = 0; i < SPIKES.length; i++) {
      const g = SPIKES[i];
      if (Math.floor(g / 32) !== bb) continue;
      const ph = (g - bb * 32) / 32;
      if (ph >= from && ph < to) sp.push(lerp(SC.x0, SC.x1, ph));
    }
    return { pts, sp };
  };
  const drawScope = (t, b, alpha) => {
    if (alpha <= 0.001) return;
    const bar = Math.floor(b), ph = b - bar;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#0b0e0d';
    ctx.fillRect(60, 676, 780, 196);
    ctx.fillStyle = '#121b17';
    ctx.fillRect(84, 692, 732, 164);
    // graticule
    ctx.strokeStyle = 'rgba(110,190,140,0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) { const x = lerp(SC.x0, SC.x1, i / 8); ctx.moveTo(x, 700); ctx.lineTo(x, 848); }
    for (let i = 0; i <= 4; i++) { const y = 700 + i * 37; ctx.moveTo(SC.x0, y); ctx.lineTo(SC.x1, y); }
    ctx.stroke();
    const trace = (seg, a, w) => {
      ctx.strokeStyle = `rgba(140,255,170,${a})`;
      ctx.lineWidth = w;
      ctx.beginPath();
      seg.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
      ctx.beginPath();
      seg.sp.forEach((x) => {
        ctx.moveTo(x - 1.5, SC.y);
        ctx.lineTo(x, SC.y - 74);
        ctx.lineTo(x + 2, SC.y + 26);
        ctx.lineTo(x + 3.5, SC.y);
      });
      ctx.stroke();
    };
    trace(scopePath(bar - 1, Math.min(0.999, ph + 0.03), 1), 0.18, 1.4); // last sweep's persistence
    ctx.shadowColor = 'rgba(120,255,160,0.8)';
    ctx.shadowBlur = 8;
    trace(scopePath(bar, 0, ph), 0.9, 1.8);
    ctx.shadowBlur = 0;
    // the beam's head
    ctx.fillStyle = 'rgba(200,255,215,0.9)';
    ctx.beginPath();
    ctx.arc(lerp(SC.x0, SC.x1, ph), SC.y, 2.6, 0, TAU);
    ctx.fill();
    // the audio monitor's lamp lights on a spike
    let lamp = 0;
    const g = b * 32;
    for (let i = 0; i < SPIKES.length; i++) {
      const dt = (g - SPIKES[i]) / 32 * BAR; // seconds since that spike
      if (dt >= 0 && dt < 0.12) lamp = Math.max(lamp, 1 - dt / 0.12);
    }
    ctx.fillStyle = `rgba(${lerp(60, 255, lamp) | 0},${lerp(40, 190, lamp) | 0},${lerp(30, 90, lamp) | 0},1)`;
    ctx.beginPath();
    ctx.arc(824, 700, 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(140,200,160,0.55)';
    ctx.font = '12px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('CELL · AUDIO MONITOR', 96, 846);
    ctx.restore();
  };

  // ------------------------------------------------------------------ captions
  const CAPS = [
    [0, 6, '1958 · cat visual cortex · spots of light, for hours'],
    [6, 7, 'a glass slide goes into the projector'],
    [7, 8.25, '"like a machine gun"'],
    [8.25, 14.25, 'one cell. it wants a line, at one angle.'],
    [14.75, 19, 'every angle has its cells. they turn around points.'],
    [19.25, 23, 'machines that see were built on these cells.'],
    [24, 26.5, '1958 · cat visual cortex · spots of light, for hours']
  ];
  const caption = (b) => {
    for (const [a, z, text] of CAPS) {
      const k = Math.min(smooth(a, a + 0.25, b), 1 - smooth(z - 0.25, z, b));
      const kk = a === 24 ? Math.min(smooth(a, a + 0.25, b), 1) : k;
      const k0 = a === 0 ? 1 - smooth(z - 0.25, z, b) : kk;
      if (k0 > 0.01) {
        ctx.globalAlpha = k0;
        ctx.fillStyle = '#a7ad9f';
        ctx.font = '20px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(text, 90, 46);
        ctx.globalAlpha = 1;
      }
    }
  };

  // ------------------------------------------------------------------ the lab frame (sections on the screen)
  const labLayer = document.createElement('canvas');
  labLayer.width = W; labLayer.height = H;
  const L = labLayer.getContext('2d');
  const drawLab = (b) => {
    L.setTransform(1, 0, 0, 1, 0, 0);
    L.globalAlpha = 1;
    L.globalCompositeOperation = 'source-over';
    L.drawImage(lab, 0, 0);
    L.save();
    L.beginPath();
    L.rect(SCR.x, SCR.y, SCR.w, SCR.h);
    L.clip();
    // the spot of light, one place per beat
    const spotOn = b < 6.25 || b >= 23.75;
    if (spotOn) {
      const beat = Math.floor(((b * 4) % 104 + 104) % 104), inBeat = b * 4 - Math.floor(b * 4);
      const [sx, sy] = SPOTS[beat];

6, delay: 0.18, delaytime: 0.433, delayfeedback: 0.3 });\\n  }\\n}\\n// what it saw: the arch once, slowly, as the whole face is there\\n[['B4', 0], ['D#5', 1], ['G#5', 2], ['D#5', 3]].forEach(([n, beat]) => bell(21, beat, n, 0.16, 1.6, 0.35));\\nbell(22, 0, 'B4', 0.15, 2.4, 0.35);\\n// the eyes open (bar 21.5) and blink (22.55)\\n[['G#5', 0], ['B5', 0.04], ['D#6', 0.08]].forEach(([n, d]) => bell(21, 2 + d, n, 0.07, 3, 0.4));\\nput(BELL, 22, 2.2, 0.15, { s: 'triangle', freq: hz('D#6'), attack: 0.001, decay: 0.05, sustain: 0, release: 0.02, gain: 0.12, orbit: 7 });\\n\\n// ------------------------------------------------------------------ air: the slide's approach, the dive and the fall back to the screen\\nput(AIR, 6, 0, 3.98, { s: 'white', gain: 0.07, bandf: 500, bandq: 0.7, bpenv: 3, bpattack: 3.5, bpdecay: 0.1, bpsustain: 1, attack: 3.2, decay: 0.1, sustain: 0.9, release: 0.03, orbit: 6 });\\nput(AIR, 14, 0, 3, { s: 'white', gain: 0.06, bandf: 2500, bandq: 0.6, attack: 1.5, decay: 1.4, sustain: 0, release: 0.2, orbit: 6 });\\nput(AIR, 23, 0, 3.6, { s: 'white', gain: 0.06, bandf: 3000, bandq: 0.6, bpenv: -3, bpattack: 0.1, bpdecay: 3.2, bpsustain: 0, attack: 0.05, decay: 3.4, sustain: 0, release: 0.1, orbit: 6 });\\n// a pad under the cortex and the face\\nconst pad = (bar, name, gain, cutoff) => {\\n  const f = hz(name);\\n  [0, 0.11, -0.11].forEach((d, k) => put(AIR, bar, 0.02, 3.95, { s: 'sawtooth', freq: f * Math.pow(2, d / 12), cutoff, attack: 0.8, decay: 0.3, sustain: 0.85, release: 0.5, gain: gain * (k ? 0.7 : 1), orbit: 8, room: 0.35, roomsize: 3 }));\\n};\\nfor (let bar = 14; bar \u003c 23; bar++) {\\n  const { keys } = chordOf(bar);\\n  [keys[0], keys[2]].forEach((name) => pad(bar, name, bar >= 19 ? 0.1 : 0.075, bar >= 19 ? 1100 : 1600));\\n}\\n\\n$: play(KIT);\\n$: play(CELL);\\n$: play(LOW);\\n$: play(STAB);\\n$: play(BELL);\",\"bpm\":104,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.43333333333333335,\"cycles\":26,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);

    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {

    function hapToEvent(hap) {

        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),

        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
