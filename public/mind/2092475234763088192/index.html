<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = "precision highp float;\nuniform vec2 iResolution;\nuniform float iTime;\n\nconst float DURATION = 60.0;\nconst float TAU = 6.28318530718;\n\nfloat hash11(float n) {\n  return fract(sin(n * 127.1 + 17.7) * 43758.5453123);\n}\n\nfloat hash21(vec2 p) {\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);\n}\n\nfloat valueNoise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  f = f * f * (3.0 - 2.0 * f);\n  float a = hash21(i);\n  float b = hash21(i + vec2(1.0, 0.0));\n  float c = hash21(i + vec2(0.0, 1.0));\n  float d = hash21(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\n\nfloat fbm(vec2 p) {\n  float value = 0.0;\n  float amplitude = 0.58;\n  for (int i = 0; i \u003c 3; i++) {\n    value += amplitude * valueNoise(p);\n    p = p * 2.04 + vec2(4.7, 2.3);\n    amplitude *= 0.46;\n  }\n  return value;\n}\n\nfloat lineMask(float d, float width, float softness) {\n  return 1.0 - smoothstep(width - softness, width + softness, abs(d));\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;\n  float phase = mod(iTime, DURATION) / DURATION;\n  float t = phase * TAU;\n  vec3 black = vec3(0.006, 0.010, 0.018);\n  vec3 graphite = vec3(0.035, 0.050, 0.070);\n  vec3 signalWhite = vec3(0.88, 0.94, 0.92);\n  vec3 cyan = vec3(0.05, 0.86, 0.91);\n  vec3 violet = vec3(0.48, 0.18, 0.86);\n  vec3 magenta = vec3(0.93, 0.12, 0.52);\n\n  float surgeIn = smoothstep(0.34, 0.43, phase);\n  float surgeOut = smoothstep(0.67, 0.78, phase);\n  float surgeLife = surgeIn * (1.0 - surgeOut);\n  float surgeProgress = smoothstep(0.34, 0.70, phase);\n  float frontX = mix(-1.12, 1.12, surgeProgress);\n  float front = exp(-pow((uv.x - frontX) * 10.0, 2.0)) * surgeLife;\n\n  float paperNoise = fbm(\n    uv * vec2(5.0, 9.0) + vec2(cos(t), sin(t)) * 0.16\n  );\n  vec3 color = mix(black, graphite, paperNoise * 0.34);\n  float scanline = 0.5 + 0.5 * sin(gl_FragCoord.y * 1.57);\n  color *= 0.88 + scanline * 0.12;\n\n  float tide = 0.0;\n  float flowGlow = 0.0;\n  for (int i = 0; i \u003c 7; i++) {\n    float fi = float(i);\n    float lane = -0.46 + fi * 0.153;\n    float direction = fi \u003c 3.5 ? 1.0 : -1.0;\n    float wave = lane\n      + sin(uv.x * (2.8 + fi * 0.24) - t * direction + fi * 1.7) * 0.045\n      + sin(uv.x * 8.0 + t * 2.0 + fi) * 0.011;\n    wave += front * (fi - 3.0) * 0.013;\n    float mainLine = lineMask(uv.y - wave, 0.0045, 0.0025);\n    float echoLine = lineMask(uv.y - wave - direction * 0.022, 0.002, 0.0015);\n    float laneGate = 0.46 + 0.54 * smoothstep(\n      0.18,\n      0.86,\n      fbm(vec2(uv.x * 3.0 + fi * 4.1, fi + sin(t) * 0.16))\n    );\n    tide += mainLine * laneGate;\n    flowGlow += echoLine * laneGate;\n  }\n  tide = clamp(tide, 0.0, 1.0);\n  flowGlow = clamp(flowGlow, 0.0, 1.0);\n  vec3 tideColor = mix(violet, cyan, 0.5 + 0.5 * sin(uv.x * 2.5 + t));\n  color += tideColor * tide * 0.82;\n  color += signalWhite * flowGlow * 0.34;\n\n  float interference = 0.5 + 0.5 * sin(\n    uv.y * 92.0\n      + sin(uv.x * 7.0 - t) * 6.0\n      + paperNoise * 4.0\n  );\n  interference = smoothstep(0.80, 0.98, interference);\n  float interferenceBand = 1.0 - smoothstep(0.18, 0.62, abs(uv.y));\n  color += signalWhite * interference * interferenceBand * 0.16;\n\n  float shoal = 0.0;\n  float shoalAccent = 0.0;\n  for (int i = 0; i \u003c 30; i++) {\n    float fi = float(i);\n    float speed = 1.0 + mod(fi, 3.0);\n    float orbitPhase = t * speed + hash11(fi + 21.0) * TAU;\n    float x = hash11(fi + 31.0) * 2.0 - 1.0\n      + sin(orbitPhase) * 0.10;\n    float yBase = -0.38 + hash11(fi + 44.0) * 0.76;\n    float y = yBase + sin(orbitPhase + fi) * 0.024;\n    y += front * (hash11(fi + 77.0) - 0.5) * 0.13;\n    vec2 delta = uv - vec2(x, y);\n    float particle = 1.0 - smoothstep(0.0025, 0.007, length(delta));\n    shoal = max(shoal, particle);\n    shoalAccent = max(shoalAccent, particle * step(0.78, hash11(fi + 101.0)));\n  }\n  color += signalWhite * shoal * 0.62;\n  color += magenta * shoalAccent * 0.90;\n\n  float coherentBand = lineMask(\n    uv.y - 0.14 * sin(uv.x * 3.2 - t) - front * 0.10,\n    0.014,\n    0.006\n  ) * surgeLife;\n  color += cyan * coherentBand * (0.82 + front * 0.70);\n  color += magenta * front * (0.38 + tide * 0.36);\n\n  float edgeFade = 1.0 - smoothstep(0.46, 0.78, length(uv));\n  color *= 0.76 + edgeFade * 0.24;\n  color = pow(clamp(color, 0.0, 1.0), vec3(0.90));\n  gl_FragColor = vec4(color, 1.0);\n}";

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.



  </script>
<script type="module">
(async () => {
  window.strudelState = 'loading';
  window.strudelError = null;
  try {
    const CONFIG = JSON.parse("{\"code\":\"// BPM: 64\\n// DURATION: 60\\n// FORM: 16 cycles — separated carriers 1-5, gathering tide 6-8, coherent surge 9-11, release 12-16\\n\\n// A low carrier keeps returning to D while its neighboring intervals drift out of phase.\\n$: note(\\\"\u003cd2 a1 d2 c2 d2 f2 g2 a2 [d2,a2] [c2,g2] [d2,a2] g2 f2 d2 a1 d2>\\\")\\n  .s(\\\"sine\\\").attack(.18).release(2.5).lpf(520).room(.38).gain(.3).orbit(0)\\n\\n// The main signal motif crosses upward, compresses into dyads at the surge, then unthreads.\\n$: note(\\\"\u003ca3 ~ c4 ~ d4 f4 a4 [d4,a4] [f4,c5] [a4,d5] [f4,c5] d4 c4 ~ a3 a3>\\\")\\n  .s(\\\"triangle\\\").attack(.16).release(2.3).lpf(1900).room(.48).gain(.23)\\n  .pan(\\\"\u003c.24 .72 .38 .82>\\\").orbit(1)\\n\\n// Sparse packet groups become briefly regular only while the field coheres.\\n$: note(\\\"\u003c~ [d5 ~ a5] ~ [f5 ~ c6] [a5 ~ d6] ~ [c6 a5 f5] [d6 a5 f5] [d6 c6 a5 f5] [f5 a5 c6 d6] [d6 a5 f5] ~ [a5 ~ f5] ~ [d5 ~ a5] ~>\\\")\\n  .s(\\\"sine\\\").attack(.02).release(.72).hpf(720).lpf(3400).room(.6).gain(.1)\\n  .pan(\\\"\u003c.18 .64 .84 .36>\\\").orbit(2)\\n\\n// One rounded mid-register front supplies the surge without adding a generic beat.\\n$: note(\\\"\u003c~ ~ ~ ~ ~ ~ d3 [d3,a3] [f3,a3,d4] [g3,c4,e4] [f3,a3,d4] d3 ~ ~ ~ ~>\\\")\\n  .s(\\\"sawtooth\\\").attack(.45).release(2.7).lpf(720).room(.34).gain(.14).orbit(3)\\n\",\"bpm\":64,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.26666666666666666,\"cycles\":16,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    let inited = false;
    async function ensureInit() {
      if (inited) return;
      await S.initStrudel({ autoplay: false });
      await S.evaluate(CONFIG.code, false);
      inited = true;
      await buildTimeline();
      console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        S.DEFAULT_MAX_POLYPHONY,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
