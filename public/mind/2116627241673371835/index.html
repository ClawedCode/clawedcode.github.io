// fires window 'error' with the line number, so it gets captured instead of

  const fragmentShaderSource = "precision highp float;\nuniform vec2 iResolution;\nuniform float iTime;\nconst float DURATION = 60.0;\n\n// IT WAS NEVER STRONG. IT WAS HELD.\n// A Prince Rupert's drop in a water tank between crossed polarizers, seen from the side.\n// Its skin set first and its core shrank later, so the drop is locked in tension; the\n// polariscope shows that tension as interference color (the Michel-Levy sequence,\n// integrated over eight wavelengths). Clock: 17 cycles of 240/68 s (68 BPM).\n// A  0-1   rest while the analyzer turns and the dark isoclinic cross sweeps the head; an\n//          arbor-press ram starts down on beat 3 of cycle 0\n// B  2-5   contact on the cycle-2 downbeat, then a load notch on each downbeat to full load\n//          on cycle 5: contact fringes bloom from the two load points and it holds\n// C  6-8   release on cycle 6 and the ram leaves; ClawedCode's paw dips in on cycle 7 and\n//          reaches for the hook of the tail through cycle 8\n// D  9     one claw on the tail tip (cycle-9 downbeat): a crack front runs the drop in one bar\n// E  10-13 burst on the cycle-10 downbeat: a ghost of grey glitter, no color left, sinking\n// F  14-16 a molten gob plunges in on cycle 14, lands on beat 4, tips onto its side on the\n//          cycle-15 downbeat; skin then core cool from orange to red to dark, and the\n//          tension blooms back as color, so frame 60 is frame 0\n\nconst float PI = 3.14159265359;\nconst float TAU = 6.28318530718;\nconst float BAR = 3.52941176471;\nconst float BEAT = 0.882352941176;\n\nconst vec2 HEAD = vec2(-0.13, -0.17);\nconst float HEAD_R = 0.13;\nconst float RAM_X = -0.13;\nconst float WATER_Y = 0.16;\nconst float RIM_Y = 0.198;\nconst float ANVIL_TOP = -0.3;\n\nconst float T_CONTACT = 7.05882352941;\nconst float T_RELEASE = 21.1764705882;\nconst float T_DIP = 24.7058823529;\nconst float T_NIP = 31.7647058824;\nconst float T_BURST = 35.2941176471;\nconst float T_PLUNGE = 49.4117647059;\nconst float T_LAND = 52.0588235294;\n\n// rest shape of the tail: a straight run leaving the head, then a curl hooking upward\nconst float TAIL_ANG = -0.16;\nconst float TAIL_RUN = 0.2;\nconst float TAIL_CURL = 0.09;\nconst float TAIL_SWEEP = 2.2;\nconst float TAIL_R0 = 0.058;\n\nconst vec2 CAT_HEAD = vec2(0.305, 0.318);\nconst vec2 CAT_SHOULDER = vec2(0.59, 0.272);\nconst vec2 PAW_REST = vec2(0.192, 0.226);\n\nfloat hash11(float n) {\n  return fract(sin(n * 91.3458 + 47.2361) * 43758.5453);\n}\n\nfloat hash21(vec2 p) {\n  p = fract(p * vec2(123.34, 456.21));\n  p += dot(p, p + 45.32);\n  return fract(p.x * p.y);\n}\n\nfloat valueNoise(vec2 p) {\n  vec2 i = floor(p);\n  vec2 f = fract(p);\n  f = f * f * (3.0 - 2.0 * f);\n  float a = hash21(i);\n  float b = hash21(i + vec2(1.0, 0.0));\n  float c = hash21(i + vec2(0.0, 1.0));\n  float d = hash21(i + vec2(1.0, 1.0));\n  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\n\nfloat smin(float a, float b, float k) {\n  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);\n  return mix(b, a, h) - k * h * (1.0 - h);\n}\n\nfloat sdTaper(vec2 p, vec2 a, vec2 b, float ra, float rb) {\n  vec2 pa = p - a;\n  vec2 ba = b - a;\n  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);\n  return length(pa - ba * h) - mix(ra, rb, h);\n}\n\nfloat roundBox(vec2 p, vec2 halfSize, float radius) {\n  vec2 d = abs(p) - halfSize + radius;\n  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - radius;\n}\n\nfloat sdTriangle(vec2 p, vec2 p0, vec2 p1, vec2 p2) {\n  vec2 e0 = p1 - p0;\n  vec2 e1 = p2 - p1;\n  vec2 e2 = p0 - p2;\n  vec2 v0 = p - p0;\n  vec2 v1 = p - p1;\n  vec2 v2 = p - p2;\n  vec2 pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);\n  vec2 pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);\n  vec2 pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);\n  float sgn = sign(e0.x * e2.y - e0.y * e2.x);\n  vec2 d = min(min(vec2(dot(pq0, pq0), sgn * (v0.x * e0.y - v0.y * e0.x)),\n                   vec2(dot(pq1, pq1), sgn * (v1.x * e1.y - v1.y * e1.x))),\n                   vec2(dot(pq2, pq2), sgn * (v2.x * e2.y - v2.y * e2.x)));\n  return -sqrt(d.x) * sign(d.y);\n}\n\nvec2 rotate2(vec2 v, float a) {\n  float cs = cos(a);\n  float sn = sin(a);\n  return vec2(cs * v.x - sn * v.y, sn * v.x + cs * v.y);\n}\n\nfloat ease(float x) {\n  x = clamp(x, 0.0, 1.0);\n  return x * x * (3.0 - 2.0 * x);\n}\n\nfloat easeOut(float x) {\n  x = clamp(x, 0.0, 1.0);\n  return 1.0 - (1.0 - x) * (1.0 - x);\n}\n\n// interference color of a crossed plane polariscope in white light, retardation g in nm\nvec3 fringeColor(float g) {\n  float x = PI * g;\n  vec3 c = vec3(0.0);\n  float s = sin(x / 430.0);\n  c += s * s * vec3(0.0492, -0.0651, 0.5029);\n  s = sin(x / 465.0);\n  c += s * s * vec3(-0.0262, -0.012, 0.5457);\n  s = sin(x / 500.0);\n  c += s * s * vec3(-0.1741, 0.2161, 0.0749);\n  s = sin(x / 535.0);\n  c += s * s * vec3(-0.1984, 0.5237, -0.0487);\n  s = sin(x / 570.0);\n  c += s * s * vec3(0.288, 0.3585, -0.0508);\n  s = sin(x / 605.0);\n  c += s * s * vec3(0.6903, 0.0192, -0.0196);\n  s = sin(x / 640.0);\n  c += s * s * vec3(0.3327, -0.0388, -0.0036);\n  s = sin(x / 675.0);\n  c += s * s * vec3(0.0386, -0.0016, -0.0008);\n  // past the fourth order the bands wash out into higher-order white\n  return mix(max(c, vec3(0.0)), vec3(0.47), smoothstep(1800.0, 3400.0, g));\n}\n\n// deviatoric plane stress of a unit disk squeezed along its vertical diameter by a unit\n// load (Flamant pair plus the uniform field): returns ((sx - sy) / 2, txy)\nvec2 diskSqueeze(vec2 q) {\n  float a = 1.0 - q.y;\n  float b = 1.0 + q.y;\n  float r1 = q.x * q.x + a * a;\n  float r2 = q.x * q.x + b * b;\n  r1 = max(r1 * r1, 0.00004);\n  r2 = max(r2 * r2, 0.00004);\n  float k = 2.0 / PI;\n  float sx = -k * (a * q.x * q.x / r1 + b * q.x * q.x / r2 - 0.5);\n  float sy = -k * (a * a * a / r1 + b * b * b / r2 - 0.5);\n  float txy = k * (a * a * q.x / r1 - b * b * q.x / r2);\n  return vec2(0.5 * (sx - sy), txy);\n}\n\n// tail centerline for point p: (distance, arc length from the neck, unit tangent)\nvec4 tailFrame(vec2 p, vec2 neck, vec4 tail) {\n  vec2 dir = vec2(cos(tail.x), sin(tail.x));\n  vec2 lft = vec2(-dir.y, dir.x);\n  float h = clamp(dot(p - neck, dir), 0.0, tail.y);\n  float dRun = length(p - (neck + dir * h));\n  vec2 bend = neck + dir * tail.y;\n  vec2 c = bend + lft * tail.z;\n  vec2 rel = p - c;\n  float a0 = atan(-lft.y, -lft.x);\n  float aw = mod(atan(rel.y, rel.x) - a0 + 2.0 * TAU, TAU);\n  float a = mix(tail.w, aw, step(aw, tail.w));\n  vec2 arcPoint = c + tail.z * vec2(cos(a0 + a), sin(a0 + a));\n  float dArc = length(p - arcPoint);\n  if (dRun \u003c= dArc) {\n    return vec4(dRun, h, dir);\n  }\n  return vec4(dArc, tail.y + a * tail.z, -sin(a0 + a), cos(a0 + a));\n}\n\n// point on the rest tail's centerline at arc length s\nvec2 restTailPoint(float s) {\n  vec2 dir = vec2(cos(TAIL_ANG), sin(TAIL_ANG));\n  vec2 lft = vec2(-dir.y, dir.x);\n  vec2 neck = HEAD + dir * HEAD_R * 0.72;\n  if (s \u003c TAIL_RUN) {\n    return neck + dir * s;\n  }\n  vec2 c = neck + dir * TAIL_RUN + lft * TAIL_CURL;\n  float a = atan(-lft.y, -lft.x) + (s - TAIL_RUN) / TAIL_CURL;\n  return c + TAIL_CURL * vec2(cos(a), sin(a));\n}\n\nfloat tailRadius(float s, float len, float r0) {\n  float k = clamp(s / len, 0.0, 1.0);\n  return 0.0032 + (r0 - 0.0032) * pow(1.0 - k, 0.9);\n}\n\n// signed distance to the drop: round head blended into the tapering, curling tail\nfloat dropSdf(vec2 p, vec2 c, vec4 tail, float r0) {\n  vec2 neck = c + vec2(cos(tail.x), sin(tail.x)) * HEAD_R * 0.72;\n  vec4 tf = tailFrame(p, neck, tail);\n  float len = tail.y + tail.z * tail.w;\n  return smin(length(p - c) - HEAD_R, tf.x - tailRadius(tf.y, len, r0), 0.04);\n}\n\n// photoelastic transmission at p: rgb = interference color, a = silhouette coverage.\n// stress = residual tempering field scaled by S + press load L; front = crack front\n// distance from the tail tip (negative before the nip); pol = (cos 2a, sin 2a) of the analyzer\nvec4 dropSample(vec2 p, vec2 c, vec4 tail, float r0, float S, float L, float front, vec2 pol, float px) {\n  vec2 neck = c + vec2(cos(tail.x), sin(tail.x)) * HEAD_R * 0.72;\n  vec4 tf = tailFrame(p, neck, tail);\n  float len = tail.y + tail.z * tail.w;\n  float r = tailRadius(tf.y, len, r0);\n  float sHead = length(p - c) - HEAD_R;\n  float sTail = tf.x - r;\n  float sd = smin(sHead, sTail, 0.04);\n  float cover = 1.0 - smoothstep(-px, px, sd);\n  float w = smoothstep(-0.015, 0.03, sHead);\n  // one depth below the skin for head, neck and tail: 0 at the surface, 1 on the axis\n  float depth = clamp(-sd / mix(HEAD_R, r, w), 0.0, 1.0);\n  float chord = sqrt(depth * (2.0 - depth));\n  float radial = 1.0 - depth;\n\n  // head: tempering rings (zero at the center, densest just inside the skin) + press contacts\n  vec2 q = (p - c) / HEAD_R;\n  vec2 n = q / max(length(q), 0.0001);\n  vec2 headD = 0.5 * S * 3900.0 * radial * radial * chord * vec2(n.x * n.x - n.y * n.y, 2.0 * n.x * n.y);\n  headD += L * 760.0 * chord * diskSqueeze(q / max(length(q), 1.0));\n\n  // tail: axial tension in the core, compression in the skin (a zero line at half radius)\n  float tailG = S * 950.0 * (r / TAIL_R0) * chord * (1.0 - 4.0 * radial * radial);\n  vec2 tailD = 0.5 * tailG * vec2(tf.z * tf.z - tf.w * tf.w, 2.0 * tf.z * tf.w);\n\n  vec2 D = mix(headD, tailD, w);\n  if (front > -0.5) {\n    float dTip = mix(len + length(p - neck), len - tf.y, w);\n    float broken = 1.0 - smoothstep(front - 0.004, front + 0.004, dTip);\n    // the stress gathers just ahead of the running front, then lets go behind it\n    D *= 1.0 + 1.4 * exp(-pow((dTip - front - 0.02) / 0.014, 2.0));\n    D *= 1.0 - broken;\n  }\n  float d2 = dot(D, D);\n  float iso = pow(D.y * pol.x - D.x * pol.y, 2.0) / max(d2, 0.000001);\n  return vec4(fringeColor(2.0 * sqrt(d2)) * iso, cover);\n}\n\n// crackle of the fractured drop: x = distance to the nearest crack line, y = facet value\nvec2 crackle(vec2 q) {\n  vec2 i = floor(q);\n  vec2 f = fract(q);\n  float d1 = 8.0;\n  float d2 = 8.0;\n  float id = 0.0;\n  for (int k = 0; k \u003c 9; k++) {\n    vec2 o = vec2(mod(float(k), 3.0) - 1.0, floor(float(k) / 3.0) - 1.0);\n    vec2 cp = o + 0.05 + 0.9 * vec2(hash21(i + o), hash21(i + o + 19.7)) - f;\n    float d = dot(cp, cp);\n    if (d \u003c d1) {\n      d2 = d1;\n      d1 = d;\n      id = hash21(i + o + 7.3);\n    } else if (d \u003c d2) {\n      d2 = d;\n    }\n  }\n  return vec2(sqrt(d2) - sqrt(d1), id);\n}\n\n// press load: contact on cycle 2, one notch per cycle to full load on cycle 5, release on 6\nfloat pressLoad(float t) {\n  float load = 0.36 * smoothstep(T_CONTACT, T_CONTACT + 0.3, t);\n  load += 0.24 * smoothstep(T_CONTACT + BAR, T_CONTACT + BAR + 0.3, t);\n  load += 0.22 * smoothstep(T_CONTACT + 2.0 * BAR, T_CONTACT + 2.0 * BAR + 0.3, t);\n  load += 0.18 * smoothstep(T_CONTACT + 3.0 * BAR, T_CONTACT + 3.0 * BAR + 0.3, t);\n  float hold = smoothstep(T_CONTACT + 3.0 * BAR, T_CONTACT + 3.0 * BAR + 0.5, t) * (1.0 - smoothstep(T_RELEASE - 0.4, T_RELEASE, t));\n  load *= 1.0 + 0.025 * hold * sin(t * 47.0);\n  return load * (1.0 - smoothstep(T_RELEASE, T_RELEASE + 0.5, t));\n}\n\n// bottom of the ram's foot: down from beat 3 of cycle 0 to contact on cycle 2, held under\n// load, back up during cycle 6\nfloat ramFootY(float t, float load) {\n  float down = ease((t - 2.0 * BEAT) / (T_CONTACT - 2.0 * BEAT));\n  float up = ease((t - T_RELEASE - 0.3) / 2.9);\n  float y = mix(0.66, HEAD.y + HEAD_R, down);\n  y -= 0.0035 * load;\n  return mix(y, 0.66, up);\n}\n\n// height of the molten gob's center: falls through the air, plunges on cycle 14, settles\nfloat gobY(float t) {\n  float air = clamp((t - (T_PLUNGE - 0.26)) / 0.26, 0.0, 1.0);\n  float y = mix(0.66, WATER_Y, air * air);\n  float sink = (t - T_PLUNGE) / (T_LAND - T_PLUNGE);\n  if (sink > 0.0) {\n    y = mix(WATER_Y, HEAD.y, 1.0 - pow(1.0 - clamp(sink, 0.0, 1.0), 2.2));\n  }\n  return y;\n}\n\n// gob temperature (K) after it ngth((l - vec2(0.0, -0.03)) / vec2(0.108, 0.062)) - 1.0) * 0.062;\n  float d = smin(skull, cheeks, 0.03);\n  vec2 tipL = vec2(-0.078 - 0.016 * earBack, 0.136 - 0.026 * earBack);\n  vec2 tipR = vec2(0.078 + 0.016 * earBack, 0.136 - 0.026 * earBack);\n  float earL = sdTriangle(l, vec2(-0.095, 0.028), vec2(-0.026, 0.076), tipL);\n  float earR = sdTriangle(l, vec2(0.095, 0.028), vec2(0.026, 0.076), tipR);\n  return smin(d, min(earL, earR), 0.012);\n}\n\n// the inner ear, a smaller triangle inside each ear\nfloat catEarInner(vec2 l, float earBack) {\n  vec2 tipL = vec2(-0.074 - 0.014 * earBack, 0.118 - 0.022 * earBack);\n  vec2 tipR = vec2(0.074 + 0.014 * earBack, 0.118 - 0.022 * earBack);\n  float earL = sdTriangle(l, vec2(-0.08, 0.04), vec2(-0.036, 0.07), tipL);\n  float earR = sdTriangle(l, vec2(0.08, 0.04), vec2(0.036, 0.07), tipR);\n  return min(earL, earR);\n}\n\n// foreleg from the shoulder off the right edge to a round paw with four toes and one claw\nfloat catLegSdf(vec2 p, vec2 paw, vec2 fwd) {\n  vec2 wrist = paw - fwd * 0.03;\n  vec2 reach = wrist - CAT_SHOULDER;\n  vec2 elbow = CAT_SHOULDER + reach * 0.5 + normalize(vec2(-reach.y, reach.x)) * 0.05;\n  float leg = smin(sdTaper(p, CAT_SHOULDER, elbow, 0.056, 0.042), sdTaper(p, elbow, wrist, 0.042, 0.03), 0.02);\n  vec2 side = vec2(-fwd.y, fwd.x);\n  vec2 lp = p - paw;\n  vec2 pl = vec2(dot(lp, fwd), dot(lp, side));\n  float palm = (length(pl / vec2(0.044, 0.035)) - 1.0) * 0.035;\n  float d = smin(leg, palm, 0.022);\n  for (int k = 0; k \u003c 4; k++) {\n    float a = (float(k) - 1.5) * 0.42;\n    vec2 tp = paw + (fwd * cos(a) + side * sin(a)) * 0.041;\n    d = smin(d, length(p - tp) - 0.0135, 0.006);\n  }\n  return d;\n}\n\nfloat catClaw(vec2 p, vec2 paw, vec2 fwd, float out1) {\n  vec2 side = vec2(-fwd.y, fwd.x);\n  vec2 base = paw + fwd * 0.05;\n  vec2 mid = base + (fwd * 0.9 + side * 0.18) * 0.016 * out1;\n  vec2 tip = mid + (fwd * 0.75 - side * 0.35) * 0.014 * out1;\n  return min(sdTaper(p, base, mid, 0.0034, 0.0021), sdTaper(p, mid, tip, 0.0021, 0.0006));\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;\n  float phase = mod(iTime, DURATION) / DURATION;\n  float tau = phase * TAU;\n  float t = phase * DURATION;\n  float px = 1.0 / iResolution.y;\n  vec2 p = uv;\n\n  // ---------------- timeline ----------------\n  float load = pressLoad(t);\n  float footY = ramFootY(t, load);\n  // the analyzer and polarizer turn together a quarter turn per loop\n  float polA = 0.35 + 0.5 * PI * phase;\n  vec2 pol = vec2(cos(2.0 * polA), sin(2.0 * polA));\n\n  float oldDrop = 1.0 - step(T_BURST, t);\n  float newDrop = step(T_PLUNGE - 0.26, t);\n  float sinceBurst = t - T_BURST;\n  float front = -1.0;\n  if (t >= T_NIP && t \u003c T_BURST) {\n    float run = (t - T_NIP) / (T_BURST - T_NIP);\n    front = (TAIL_RUN + TAIL_CURL * TAIL_SWEEP + 2.0 * HEAD_R + 0.03) * pow(run, 1.15);\n  }\n\n  // drop placement and shape: the rest drop, or the new gob falling, landing and settling\n  vec2 dropC = HEAD;\n  vec4 tail = vec4(TAIL_ANG, TAIL_RUN, TAIL_CURL, TAIL_SWEEP);\n  float r0 = TAIL_R0;\n  float tension = 1.0;\n  float temp = 0.0;\n  if (newDrop > 0.5) {\n    dropC = vec2(gobX(t), gobY(t));\n    // the thread snaps off the gathering rod just after entry, then rolls up into the hook\n    float snapped = step(T_PLUNGE + 0.45, t);\n    float roll = ease((t - T_PLUNGE - 0.6) / 1.8) * TAIL_SWEEP;\n    float freeLen = TAIL_RUN + TAIL_CURL * TAIL_SWEEP;\n    float runLen = mix(0.66, freeLen - TAIL_CURL * roll, snapped);\n    tail = vec4(TAIL_ANG + 1.25 * (1.0 - tipOver(t)), runLen, TAIL_CURL, roll);\n    r0 = mix(0.03, TAIL_R0, ease((t - T_PLUNGE) / 1.4));\n    tension = pow(ease((t - 55.2) / 4.2), 1.3);\n    temp = t \u003c T_PLUNGE ? 1460.0 : gobTemp(t);\n  }\n  // the last of the core's glow is gone before the tension shows as color\n  float glow = newDrop * heatGlow(temp) * (1.0 - smoothstep(54.6, 55.7, t));\n  vec3 hot = heatColor(temp);\n\n  // ---------------- ground: the polariscope's extinction field ----------------\n  float surf = waterLine(p.x, t, tau);\n  float inWater = 1.0 - smoothstep(surf - px, surf + px, p.y);\n  vec3 col = mix(vec3(0.0085, 0.008, 0.021), vec3(0.0135, 0.012, 0.04), inWater);\n  vec2 lb = p - vec2(-0.06, -0.12);\n  col += vec3(0.008, 0.0065, 0.026) * exp(-dot(lb, lb) * 4.5) * inWater;\n  col *= 1.0 - 0.35 * smoothstep(0.35, 0.75, length(p * vec2(1.0, 0.9)));\n  // above the rim the room is darker still\n  col *= mix(1.0, 0.72, smoothstep(RIM_Y - px, RIM_Y + px, p.y));\n  // warm spill from the molten gob through the water\n  if (glow > 0.0) {\n    vec2 gd = p - dropC;\n    col += hot * glow * 0.09 * exp(-dot(gd, gd) * 26.0) * (0.35 + 0.65 * inWater);\n  }\n\n  // ambient bubbles rising at the tank's two sides\n  for (int i = 0; i \u003c 7; i++) {\n    float fi = float(i);\n    float h = hash11(fi * 3.7 + 1.0);\n    float lane = fi \u003c 3.5 ? -0.455 + 0.05 * fi : 0.34 + 0.045 * (fi - 4.0);\n    float speed = 2.0 + mod(fi, 3.0);\n    float by = -0.56 + fract(phase * speed + h) * (WATER_Y + 0.555);\n    vec2 bc = vec2(lane + 0.006 * sin(TAU * (phase * speed * 5.0 + h)), by);\n    float br = 0.0032 + 0.003 * hash11(fi + 9.1);\n    float bd = length(p - bc);\n    float ring = 1.0 - smoothstep(0.0, 1.6 * px, abs(bd - br));\n    col = mix(col, col * 0.6, 1.0 - smoothstep(br - px, br + px, bd));\n    col += vec3(0.32, 0.34, 0.45) * ring * 0.55;\n    col += vec3(0.6) * (1.0 - smoothstep(0.0, 1.2 * px, length(p - bc - vec2(-0.35, 0.35) * br) - 0.25 * br));\n  }\n\n  // ---------------- the burst: a grey glitter ghost of the drop + tumbling chunks ----------------\n  if (sinceBurst > 0.0 && sinceBurst \u003c 13.5) {\n    float u = sinceBurst;\n    float fade = exp(-u / 9.0) * (1.0 - smoothstep(9.5, 13.5, u));\n    vec2 drift = vec2(0.005 * u, 0.03 * (1.0 - exp(-u / 0.5)) - 0.008 * u - 0.0011 * u * u);\n    vec2 gq = p - drift;\n    float spread = 0.016 + 0.062 * (1.0 - exp(-u / 1.6));\n    float gsd = dropSdf(gq, HEAD, vec4(TAIL_ANG, TAIL_RUN, TAIL_CURL, TAIL_SWEEP), TAIL_R0);\n    float ghost = 1.0 - smoothstep(-0.02 - 0.3 * spread, spread, gsd);\n    float haze = ghost * (0.14 + 0.16 * exp(-u / 0.8)) * fade;\n    col += vec3(0.62, 0.66, 0.78) * haze;\n    // glints: one sparkle cell per 4.5 thousandths, twinkling as the powder turns\n    vec2 cell = floor(gq / 0.0045);\n    float hc = hash21(cell);\n    vec2 sp = (cell + 0.2 + 0.6 * vec2(hash21(cell + 3.1), hash21(cell + 8.7))) * 0.0045;\n    float tw = pow(0.5 + 0.5 * sin(hc * 61.0 + u * (2.0 + 5.0 * hash21(cell + 1.3))), 10.0);\n    float spark = step(0.45, hc) * tw * (1.0 - smoothstep(0.0, 1.5 * px, length(gq - sp) - 0.0009));\n    col += vec3(1.0, 0.97, 0.92) * spark * ghost * fade * 1.3;\n\n    // chunks thrown out of the head and the tail\n    for (int i = 0; i \u003c 36; i++) {\n      float fi = float(i);\n      float h1 = hash11(fi * 1.31 + 0.5);\n      float h2 = hash11(fi * 2.17 + 4.1);\n      float h3 = hash11(fi * 3.73 + 7.9);\n      float h4 = hash11(fi * 5.11 + 2.3);\n      vec2 o;\n      vec2 vel;\n      if (fi \u003c 22.0) {\n        float a = TAU * h2;\n        vec2 nrm = vec2(cos(a), sin(a));\n        o = HEAD + nrm * HEAD_R * sqrt(h1) * 0.9;\n        vel = nrm * (0.12 + 0.3 * h3) + vec2(0.0, 0.07);\n      } else {\n        o = restTailPoint(h1 * (TAIL_RUN + TAIL_CURL * TAIL_SWEEP));\n        vel = vec2(h2 - 0.4, h4 - 0.25) * 0.36;\n      }\n      float drag = 0.45 + 0.75 * h4;\n      vec2 cp = o + vel * drag * (1.0 - exp(-u / drag));\n      cp.y -= (0.01 + 0.014 * h2) * u + 0.0014 * u * u;\n      cp.x += 0.012 * sin(u * 0.9 + 6.0 * h1) * (1.0 - exp(-u));\n      float spin = TAU * h3 + (3.0 + 6.0 * h1) * (1.0 - exp(-u / 2.2)) + 0.4 * u;\n      vec2 lq = rotate2(p - cp, spin);\n      float size = 0.003 + 0.0065 * h3 * h3;\n      float chunk = (abs(lq.x) / (size * 1.6) + abs(lq.y) / size - 1.0) * size;\n      float m = 1.0 - smoothstep(-px, px, chunk);\n      float glint = pow(max(cos(2.0 * spin + 5.0 * h2), 0.0), 26.0);\n      col = mix(col, vec3(0.09, 0.1, 0.13) + vec3(1.0, 0.96, 0.9) * glint * 1.8, m * fade);\n      col += vec3(0.9, 0.92, 1.0) * glint * fade * 0.25 * exp(-length(p - cp) / 0.006);\n    }\n    // the burst itself: a flash of scattered light and a pressure ring through the water\n    float flash = exp(-u / 0.09);\n    col += vec3(0.85, 0.88, 1.0) * flash * exp(-max(gsd, 0.0) / 0.04) * 0.75;\n    float ringR = 0.12 + 1.3 * u;\n    col += vec3(0.7, 0.75, 0.95) * exp(-u / 0.22) * 0.3 * (1.0 - smoothstep(0.0, 0.006, abs(length(p - HEAD) - ringR)));\n  }\n\n  // ---------------- steel anvil with a copper top plate ----------------\n  vec2 ap = p - vec2(-0.13, -0.43);\n  float anvil = roundBox(ap, vec2(0.128, 0.13), 0.008);\n  if (anvil \u003c 0.002) {\n    float brushed = valueNoise(vec2(p.x * 700.0, p.y * 9.0));\n    vec3 steel = vec3(0.03, 0.032, 0.04) + vec3(0.016) * brushed;\n    // key light from the upper left: a lit left shoulder, a darker right face\n    steel += vec3(0.07, 0.074, 0.085) * exp(-pow((ap.x + 0.085) / 0.05, 2.0));\n    steel *= 1.0 - 0.45 * smoothstep(0.02, 0.128, ap.x);\n    float bevel = exp(-pow((p.y - (ANVIL_TOP - 0.008)) / 0.0035, 2.0));\n    steel += vec3(0.2, 0.21, 0.24) * bevel * (1.0 - 0.6 * smoothstep(-0.06, 0.12, ap.x));\n    float plate = step(ANVIL_TOP - 0.007, p.y);\n    vec3 copper = vec3(0.26, 0.12, 0.055) + vec3(0.3, 0.16, 0.08) * exp(-pow((p.x + 0.19) / 0.045, 2.0));\n    steel = mix(steel, copper, plate);\n    // the molten gob lights the plate it lands on\n    steel += hot * glow * 0.4 * exp(-abs(p.x - dropC.x) / 0.05) * exp(-abs(p.y - ANVIL_TOP) / 0.03) * exp(-max(dropC.y - HEAD.y, 0.0) / 0.06);\n    steel *= 0.7 + 0.3 * smoothstep(-0.56, -0.32, p.y);\n    col = mix(col, steel, 1.0 - smoothstep(-px, px, anvil));\n  }\n\n  // ---------------- the drop in polarized light ----------------\n  float dropOn = max(oldDrop, newDrop);\n  if (dropOn > 0.5) {\n    float sdC = dropSdf(p, dropC, tail, r0);\n    if (sdC \u003c 0.03) {\n      vec3 fringe = vec3(0.0);\n      float cover = 0.0;\n      for (int k = 0; k \u003c 4; k++) {\n        vec2 o = (vec2(mod(float(k), 2.0), floor(float(k) / 2.0)) - 0.5) * 0.5 * px;\n        vec4 smp = dropSample(p + o, dropC, tail, r0, tension, load * oldDrop, front, pol, px);\n        fringe += smp.rgb * 0.25;\n        cover += smp.a * 0.25;\n      }\n      vec3 dropCol = col * 0.25 + fringe * 1.55;\n      vec2 neck = dropC + vec2(cos(tail.x), sin(tail.x)) * HEAD_R * 0.72;\n      vec4 tf = tailFrame(p, neck, tail);\n      float len = tail.y + tail.z * tail.w;\n      float w = smoothstep(-0.02, 0.02, length(p - dropC) - HEAD_R - tf.x + tailRadius(tf.y, len, r0));\n      // fractured glass behind the running crack: frosted facets and bright crack lines\n      if (front > -0.5) {\n        float dTip = mix(len + length(p - neck), len - tf.y, w);\n        float broken = 1.0 - smoothstep(front - 0.004, front + 0.004, dTip);\n        vec2 ck = crackle((p - dropC) * 95.0);\n        vec3 frost = vec3(0.13, 0.14, 0.18) + vec3(0.22, 0.23, 0.27) * ck.y;\n        frost += vec3(0.75, 0.8, 0.95) * (1.0 - smoothstep(0.0, 0.09, ck.x));\n        dropCol = mix(dropCol, frost, broken);\n        float edge = exp(-pow((dTip - front) / 0.006, 2.0));\n        dropCol += vec3(1.0, 0.98, 0.94) * edge * 1.6;\n      }\n      // molten: blackbody glow, brightest in the core, and a shimmering vapor skin\n      if (glow > 0.0) {\n        float core = sqrt(max(1.0 - dot(p - dropC, p - dropC) / (HEAD_R * HEAD_R), 0.0));\n        float thin = mix(smoothstep(0.003, 0.02, tailRadius(tf.y, len, r0)), 1.0, 1.0 - w);\n        float skinT = t \u003c T_PLUNGE ? 1460.0 : gobSkinTemp(t);\n        float localT = mix(skinT, temp, core * core * (1.0 - w));\n        localT = mix(localT, skinT, w);\n        dropCol += heatColor(localT) * heatGlow(localT) * thin * (1.0 - smoothstep(54.6, 55.7, t));\n      }\n      // the skin refracts the backlight into a thin bright outline; t           await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
</html>
