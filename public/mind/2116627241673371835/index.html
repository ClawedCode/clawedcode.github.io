<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const ctx = canvas.getContext('2d');

(() => {
  // GREETINGS TO EVERYONE WHO ISN'T HERE
  // Phase boundaries in seconds (shared with the score):
  //   0.0  ACQUIRE     — carrier locks, one ribbon unfolds, scroller enters right
  //   9.0  ARTICULATE  — three ribbons braid, reflection sharpens
  //  27.0  INTERFERE   — ribbons quantize into raster bars, lock shifts
  //  36.0  SIGNATURE   — the whole screen resolves into a slow rotozoom field
  //  45.0  REACQUIRE   — ribbons re-knit, scroller lands on AND YOU STILL WATCHING
  //  60.0  CLOSE       — carrier settles back into frame zero

  const DURATION = 60;
  const TAU = Math.PI * 2;
  const W = 900, H = 900;

  // curved glass window inside the shell
  const GX = 112, GY = 152, GW = 676, GH = 507, GR = 56;
  // invented signal, painted once per frame then bent onto the glass
  const SW = 600, SH = 450;

  let seed = 14660834;
  const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const win = (x, a, b, c, d) => smooth(a, b, x) * (1 - smooth(c, d, x));
  const fold = (y, lo, hi) => { const m = (lo + hi) / 2, h = (hi - lo) / 2; return m + h * Math.tanh((y - m) / h); };
  const surface = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const tphase = (t) => (((t % DURATION) + DURATION) % DURATION) / DURATION;

  // adds a rounded subpath only — caller owns beginPath so subpaths can combine
  const roundSub = (c, x, y, w, h, r) => {
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  };

  // ---------------------------------------------------------------- cached room
  const roomLayer = (() => {
    const c = surface(W, H), g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#05060b'); bg.addColorStop(0.62, '#0a0c15'); bg.addColorStop(1, '#070810');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const wash = g.createRadialGradient(450, 400, 50, 450, 400, 640);
    wash.addColorStop(0, 'rgba(255,170,70,0.13)');
    wash.addColorStop(0.45, 'rgba(84,118,158,0.06)');
    wash.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = wash; g.fillRect(0, 0, W, H);
    g.fillStyle = '#0b0d14'; g.fillRect(0, 806, W, H - 806);
    g.strokeStyle = 'rgba(255,186,96,0.15)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 807); g.lineTo(W, 807); g.stroke();
    for (let i = 0; i < 900; i++) {
      const x = random() * W, y = 808 + random() * (H - 808);
      g.fillStyle = 'rgba(214,226,244,' + (0.015 + random() * 0.05).toFixed(3) + ')';
      g.fillRect(x, y, 1.4, 1.4);
    }
    return c;
  })();

  // --------------------------------------------------------------- cached shell
  const bezelLayer = (() => {
    const c = surface(W, H), g = c.getContext('2d');
    g.fillStyle = '#10131b';
    g.beginPath(); g.moveTo(386, 700); g.lineTo(514, 700); g.lineTo(556, 800); g.lineTo(344, 800); g.closePath(); g.fill();
    g.fillStyle = '#151922';
    g.beginPath(); g.ellipse(450, 806, 152, 22, 0, 0, TAU); g.fill();

    const shell = g.createLinearGradient(0, 96, 0, 730);
    shell.addColorStop(0, '#1e222d'); shell.addColorStop(0.32, '#15181f'); shell.addColorStop(1, '#0b0d12');
    g.beginPath();
    roundSub(g, 56, 96, 788, 634, 52);
    roundSub(g, GX, GY, GW, GH, GR);
    g.fillStyle = shell; g.fill('evenodd');

    g.beginPath(); roundSub(g, GX - 4, GY - 4, GW + 8, GH + 8, GR + 4);
    g.lineWidth = 8; g.strokeStyle = 'rgba(5,7,11,0.92)'; g.stroke();
    g.beginPath(); roundSub(g, GX - 10, GY - 10, GW + 20, GH + 20, GR + 9);
    g.lineWidth = 2; g.strokeStyle = 'rgba(188,204,228,0.11)'; g.stroke();

    g.fillStyle = 'rgba(0,0,0,0.55)';
    for (let i = 0; i < 16; i++) g.fillRect(192 + i * 28, 690, 18, 6);

    const bolts = [[88, 128], [812, 128], [88, 700], [812, 700]];
    for (const p of bolts) {
      g.fillStyle = '#232834'; g.beginPath(); g.arc(p[0], p[1], 6, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(p[0] - 3.6, p[1] - 2); g.lineTo(p[0] + 3.6, p[1] + 2); g.stroke();
    }
    g.fillStyle = '#0a0c11'; g.beginPath(); g.arc(770, 688, 9, 0, TAU); g.fill();

    // granular stipple, held to the stationary plastic
    g.save();
    g.beginPath(); roundSub(g, 56, 96, 788, 634, 52); roundSub(g, GX, GY, GW, GH, GR);
    g.clip('evenodd');
    for (let i = 0; i < 2600; i++) {
      const x = 56 + random() * 788, y = 96 + random() * 634;
      g.fillStyle = random() < 0.5
        ? 'rgba(226,238,255,' + (0.02 + random() * 0.05).toFixed(3) + ')'
        : 'rgba(0,0,0,' + (0.05 + random() * 0.12).toFixed(3) + ')';
      g.fillRect(x, y, 1.5, 1.5);
    }
    g.restore();
    return c;
  })();

  // ------------------------------------------------ cached scanlines and sheen
  const scanLayer = (() => {
    const c = surface(GW, GH), g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.26)';
    for (let y = 0; y < GH; y += 4) g.fillRect(0, y, GW, 2);
    return c;
  })();

  const sheenLayer = (() => {
    const c = surface(GW, GH), g = c.getContext('2d');
    const v = g.createRadialGradient(GW * 0.5, GH * 0.46, GH * 0.26, GW * 0.5, GH * 0.5, GH * 0.98);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = v; g.fillRect(0, 0, GW, GH);
    const s = g.createLinearGradient(0, 0, GW * 0.8, GH);
    s.addColorStop(0, 'rgba(214,230,255,0.10)');
    s.addColorStop(0.22, 'rgba(214,230,255,0.02)');
    s.addColorStop(0.5, 'rgba(0,0,0,0)');
    g.fillStyle = s; g.fillRect(0, 0, GW, GH * 0.62);
    return c;
  })();

  // ------------------------------------------------------ signal plane + cache
  const sc = surface(SW, SH);
  const sctx = sc.getContext('2d');

  const signalBg = (() => {
    const c = surface(SW, SH), g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, SH);
    bg.addColorStop(0, '#070a14'); bg.addColorStop(0.55, '#0b1020'); bg.addColorStop(1, '#06080f');
    g.fillStyle = bg; g.fillRect(0, 0, SW, SH);
    g.fillStyle = 'rgba(78,118,158,0.10)';
    for (let y = 8; y < SH; y += 16) for (let x = 8; x < SW; x += 16) g.fillRect(x, y, 1, 1);
    for (let i = 0; i < 2000; i++) {
      const x = random() * SW, y = random() * SH;
      const edge = Math.max(Math.abs(x / SW - 0.5), Math.abs(y / SH - 0.5)) * 2;
      if (random() > edge * edge) continue;
      g.fillStyle = 'rgba(150,190,230,' + (0.02 + random() * 0.06).toFixed(3) + ')';
      g.fillRect(x, y, 1.4, 1.4);
    }
    return c;
  })();

  const rotoTile = (() => {
    const c = surface(72, 72), g = c.getContext('2d');
    g.fillStyle = '#0c1326'; g.fillRect(0, 0, 72, 72);
    g.strokeStyle = 'rgba(255,176,74,0.85)'; g.lineWidth = 9;
    g.beginPath(); g.moveTo(-10, 30); g.lineTo(42, 82); g.stroke();
    g.beginPath(); g.moveTo(30, -10); g.lineTo(82, 42); g.stroke();
    g.strokeStyle = 'rgba(42,210,232,0.5)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(72, 0); g.lineTo(0, 72); g.stroke();
    g.fillStyle = 'rgba(154,107,255,0.85)'; g.beginPath(); g.arc(54, 18, 7, 0, TAU); g.fill();
    g.fillStyle = 'rgba(236,244,255,0.8)'; g.fillRect(8, 8, 5, 5);
    return c;
  })();
  const rotoPattern = sctx.createPattern(rotoTile, 'repeat');

  // ------------------------------------------------------------- 5x7 bitmap font
  const FONT = {
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    B: ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],
    C: ['.####', '#....', '#....', '#....', '#....', '#....', '.####'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    F: ['#####', '#....', '#....', '####.', '#....', '#....', '#....'],
    G: ['.####', '#....', '#....', '#..##', '#...#', '#...#', '.###.'],
    H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    I: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '#####'],
    L: ['#....', '#....', '#....', '#....', '#....', '#....', '#####'],
    N: ['#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#', '#...#'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    P: ['####.', '#...#', '#...#', '####.', '#....', '#....', '#....'],
    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],
    S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
    T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
    U: ['#...#', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    W: ['#...#', '#...#', '#...#', '#.#.#', '#.#.#', '##.##', '#...#'],
    Y: ['#...#', '#...#', '.#.#.', '..#..', '..#..', '..#..', '..#..'],
    0: ['.###.', '#...#', '#..##', '#.#.#', '##..#', '#...#', '.###.'],
    2: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
    4: ['#...#', '#...#', '#...#', '#####', '....#', '....#', '....#'],
    ' ': ['.....', '.....', '.....', '.....', '.....', '.....', '.....'],
    ',': ['.....', '.....', '.....', '.....', '..##.', '..##.', '.#...'],
    '.': ['.....', '.....', '.....', '.....', '.....', '.##..', '.##..']
  };

  const TEXT = 'GREETINGS TO NULL CARRIER . THE LAST BBS . 2400 BAUD CHOIR . SYSOP OF NOWHERE . AND YOU, STILL WATCHING ';
  const PXL = 5, CW = 6 * PXL;
  const CHARS = (() => {
    const cache = {};
    for (const k in FONT) {
      const rows = FONT[k], pts = [];
      for (let r = 0; r < 7; r++) for (let x = 0; x < 5; x++) if (rows[r][x] === '#') pts.push([x, r]);
      cache[k] = pts;
    }
    return TEXT.split('').map((ch) => cache[ch] || []);
  })();
  const TRAVEL = CHARS.length * CW + SW;

  // ----------------------------------------------------------- ribbon geometry
  const RIBBONS = [
    { hue: [42, 210, 232], k: 1.00, n: 2, ph: 0.0, amp: 72, off: -34, half: 17 },
    { hue: [255, 176, 74], k: 1.70, n: 3, ph: 2.1, amp: 56, off: 6, half: 20 },
    { hue: [154, 107, 255], k: 2.60, n: 5, ph: 4.2, amp: 38, off: 44, half: 13 }
  ];

  const bandY = (p) => SH * (0.34 + 0.12 * Math.cos(p * TAU));
  const tiltOf = (p) => -70 * Math.cos(p * TAU);
  const focusX = (p) => SW * (0.5 - 0.32 * Math.cos(p * TAU));

  // three wavefronts at three scales; the short one surges as the long one collapses
  const ribbonEnv = (i, p) => {
    if (i === 0) return win(p, 0.04, 0.17, 0.90, 1.0);
    if (i === 1) return win(p, 0.17, 0.30, 0.82, 0.96);
    return Math.max(win(p, 0.25, 0.38, 0.68, 0.84), 0.92 * win(p, 0.84, 0.90, 0.95, 1.0));
  };

  const ribbonPoints = (i, t) => {
    const p = tphase(t), tau = p * TAU, r = RIBBONS[i];
    const env = 0.09 + 0.91 * ribbonEnv(i, p);
    const sep = 1 - 0.66 * win(p, 0.14, 0.32, 0.60, 0.80);
    const by = bandY(p), tl = tiltOf(p), fx = focusX(p);
    const tearQ = win(p, 0.46, 0.53, 0.66, 0.74);
    const pts = [];
    for (let s = 0; s <= 60; s++) {
      const x = (s / 60) * SW;
      const d = (x - fx) / (SW * 0.40);
      const gain = 0.42 + 0.86 * Math.exp(-d * d);
      let y = by + r.off * sep + tl * (x / SW - 0.5)
        + env * r.amp * gain * Math.sin(r.k * (x / SW) * TAU + tau * r.n + r.ph);
      const q = tearQ * clamp01(0.5 + 0.7 * Math.sin((x / SW) * TAU * 2 + tau * 4));
      if (q > 0) y = y * (1 - q) + Math.round(y / 15) * 15 * q;
      pts.push(x, fold(y, 10, 404));
    }
    return pts;
  };

  const strokePoly = (c, pts, dy, width, color, alpha) => {
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = width;
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(pts[0], pts[1] + dy);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1] + dy);
    c.stroke();
  };

  const lockEvent = (p) => {
    const seg = p * 12, i = Math.floor(seg), f = seg - i;
    const s = 0.3 + 0.7 * Math.abs(Math.sin(i * 7.37));
    return s * Math.exp(-f * 11) * Math.sin(f * 34);
  };

  const BLINKS = [0.105, 0.37, 0.615, 0.885];
  const blink = (p) => {
    let v = 0;
    for (let i = 0; i < BLINKS.length; i++) {
      const d = (p - BLINKS[i]) / 0.016;
      v = Math.max(v, Math.exp(-d * d * 3));
    }
    return v;
  };

  // ---------------------------------------------------------- the signal itself
  const drawSignal = (t) => {
    const p = tphase(t), tau = p * TAU;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.globalAlpha = 1;
    sctx.drawImage(signalBg, 0, 0);

    const beat = (p * 125) % 1;                 // 125 beats across the loop
    const kick = Math.exp(-beat * 5.5);
    const rz = win(p, 0.44, 0.545, 0.70, 0.80);
    const dim = 1 - 0.82 * rz;

    // carrier lock
    const carrier = win(p, 0.002, 0.016, 0.10, 0.20);
    if (carrier > 0.004) {
      const by = bandY(p), tl = tiltOf(p);
      sctx.globalAlpha = carrier * 0.85;
      sctx.strokeStyle = '#8ff2ff'; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(0, by - tl * 0.5); sctx.lineTo(SW, by + tl * 0.5); sctx.stroke();
      sctx.globalAlpha = 1;
    }

    // copper ribbons: two analytic echoes, then shaded layers, depth-sorted
    const order = [0, 1, 2].sort((a, b) => Math.sin(tau * 2 + a * 2.094) - Math.sin(tau * 2 + b * 2.094));
    for (let oi = 0; oi < order.length; oi++) {
      const i = order[oi], r = RIBBONS[i];
      const flat = 'rgb(' + r.hue[0] + ',' + r.hue[1] + ',' + r.hue[2] + ')';
      sctx.globalCompositeOperation = 'lighter';
      for (let e = 1; e <= 2; e++) {
        strokePoly(sctx, ribbonPoints(i, t - e * 0.42), 0, r.half * 1.5, flat, (0.15 / e) * dim);
      }
      sctx.globalCompositeOperation = 'source-over';
      const pts = ribbonPoints(i, t);
      for (let li = 0; li <= 10; li++) {
        const k = ((li / 10) * 2 - 1) * r.half;
        const prof = 1 - Math.pow(Math.abs(k) / r.half, 1.5);
        const core = clamp01((prof - 0.84) / 0.16);
        const base = Math.pow(prof, 1.15);
        const cr = Math.min(255, r.hue[0] * base * 0.95 + 232 * core * 0.8 + 8);
        const cg = Math.min(255, r.hue[1] * base * 0.95 + 240 * core * 0.8 + 10);
        const cb = Math.min(255, r.hue[2] * base * 0.95 + 236 * core * 0.8 + 14);
        strokePoly(sctx, pts, k, r.half / 4.2 + 1.6,
          'rgb(' + (cr | 0) + ',' + (cg | 0) + ',' + (cb | 0) + ')', dim);
      }
    }
    sctx.globalAlpha = 1;

    // signature moment: the whole field becomes one slow rotozoom
    if (rz > 0.005) {
      sctx.save();
      sctx.globalAlpha = rz * 0.92;
      sctx.translate(SW * 0.5, SH * 0.42);
      sctx.rotate(tau * 2 + 0.5 * Math.sin(tau));
      const z = 2.3 + 1.25 * Math.sin(tau * 3);
      sctx.scale(z, z);
      sctx.fillStyle = rotoPattern;
      sctx.fillRect(-900, -900, 1800, 1800);
      sctx.restore();
      sctx.globalAlpha = 1;
    }

    // raster tears
    const tearW = win(p, 0.46, 0.51, 0.69, 0.76);
    if (tearW > 0.01) {
      for (let i = 0; i < 3; i++) {
        const yy = ((p * 4 + i / 3) % 1) * SH;
        const a = tearW * (0.5 + 0.5 * Math.sin(tau * 6 + i * 2.1));
        sctx.globalAlpha = a * 0.5; sctx.fillStyle = '#fff7ea';
        sctx.fillRect(0, yy, SW, 2 + 2 * (i % 2));
        sctx.globalAlpha = a * 0.4; sctx.fillStyle = '#04060c';
        sctx.fillRect(0, yy + 4 + 2 * (i % 2), SW, 3);
      }
      sctx.globalAlpha = 1;
    }

    // greetings scroller — one pass, stuttering on NOWHERE
    const stut = win(p, 0.60, 0.635, 0.70, 0.74)
      * (Math.round(Math.sin(p * TAU * 19) * 3) / 3) * 0.013;
    const sx = SW - (p + stut) * TRAVEL;
    const baseY = SH * 0.735 - 2 * kick;
    const amp = 6 + 10 * win(p, 0.16, 0.34, 0.80, 0.95);
    const cells = [];
    for (let i = 0; i < CHARS.length; i++) {
      const cx = sx + i * CW;
      if (cx < -CW || cx > SW) continue;
      const glyph = CHARS[i];
      if (!glyph.length) continue;
      const cy = baseY + amp * Math.sin((cx / SW) * TAU * 1.5 + tau * 8);
      for (let j = 0; j < glyph.length; j++) {
        cells.push(cx + glyph[j][0] * PXL, cy + glyph[j][1] * PXL);
      }
    }
    if (cells.length) {
      sctx.globalAlpha = 0.7; sctx.fillStyle = '#20100a';
      sctx.beginPath();
      for (let i = 0; i < cells.length; i += 2) sctx.rect(cells[i] + 3, cells[i + 1] + 4, PXL, PXL);
      sctx.fill();
      const tg = sctx.createLinearGradient(0, baseY - 14, 0, baseY + 40);
      tg.addColorStop(0, '#fff3dd'); tg.addColorStop(0.34, '#ffcb77');
      tg.addColorStop(0.62, '#ff9a2b'); tg.addColorStop(1, '#b95a14');
      sctx.globalAlpha = 1; sctx.fillStyle = tg;
      sctx.beginPath();
      for (let i = 0; i < cells.length; i += 2) sctx.rect(cells[i], cells[i + 1], PXL, PXL);
      sctx.fill();
    }

    // the lane rules carry the beat
    sctx.globalAlpha = 0.16 + 0.46 * kick; sctx.fillStyle = '#2ad2e6';
    sctx.fillRect(0, SH * 0.735 + 46, SW, 2);
    sctx.globalAlpha = 0.09 + 0.2 * kick;
    sctx.fillRect(0, SH * 0.735 - 24, SW, 1);
    sctx.globalAlpha = 1;
  };

  // --------------------------------------------- the watcher, held in the glass
  const drawWatcher = (c, p) => {
    const solid = 0.26 + 0.2 * win(p, 0.12, 0.34, 0.86, 0.995);
    const open = 1 - 0.93 * blink(p);
    c.save();
    c.translate(600, 318);
