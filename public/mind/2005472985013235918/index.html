<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.1+vec2(1.7,2.3);a*=0.5;}
  return v;
}

float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdCorridor(vec3 p,float w,float h){return sdBox(p,vec3(w,h,100.0));}

float sdStairs(vec3 p,float phase){
  float step=0.18;
  float y=p.y+phase*step*8.0;
  float stairY=floor(y/step)*step;
  vec3 q=vec3(p.x,y-stairY-step*0.5,p.z-stairY*1.5);
  return sdBox(q,vec3(0.6,step*0.5,0.4));
}

float sdArch(vec3 p,float r,float th){
  vec2 q=vec2(length(p.xz)-r,p.y);
  return length(q)-th;
}

float scene(vec3 p,float t){
  float phase=fract(t*0.08);
  float breathe=sin(t*0.7)*0.05;
  float warp=fbm(p.xz*0.3+t*0.1)*0.4;
  p.y+=warp*sin(p.z*0.5+t*0.3);
  p.x+=sin(p.z*0.2+t*0.15)*0.3;
  vec3 q=p;
  q.z=mod(p.z+t*0.8,8.0)-4.0;
  float angleWarp=sin(p.z*0.1+t*0.2)*0.3;
  q.xy=rot(angleWarp)*q.xy;
  float corridor=-sdCorridor(q,1.2+breathe,1.8+breathe*0.5);
  vec3 archP=q;
  archP.z=mod(q.z+2.0,4.0)-2.0;
  float arch=sdArch(archP-vec3(0,-0.3,0),0.7,0.12);
  corridor=max(corridor,-arch-0.1);
  vec3 stairP=p;
  stairP.x=abs(stairP.x)-1.8;
  stairP.xy=rot(sin(t*0.2)*0.2)*stairP.xy;
  float stairs=sdStairs(stairP,phase);
  vec3 doorP=q;
  doorP.z=mod(q.z+1.0,6.0)-3.0;
  doorP.x=abs(doorP.x)-1.19;
  float doorOpen=smoothstep(0.0,1.0,sin(p.z*0.3+t*0.4)*0.5+0.5);
  float door=sdBox(doorP-vec3(0,0.2,0),vec3(0.02+doorOpen*0.3,0.8,0.4));
  float d=min(corridor,stairs);
  d=min(d,door);
  vec3 floatP=p;
  floatP.y+=sin(p.x*2.0+t)*0.1+cos(p.z*1.5+t*0.7)*0.08;
  floatP.z=mod(floatP.z+t*0.5,5.0)-2.5;
  floatP.x=mod(floatP.x+2.5,5.0)-2.5;
  float orb=length(floatP-vec3(0,0.5+sin(t+p.z)*0.3,0))-0.08;
  d=min(d,orb);
  return d*0.7;
}

vec3 calcNormal(vec3 p,float t){
  vec2 e=vec2(0.002,0);
  return normalize(vec3(scene(p+e.xyy,t)-scene(p-e.xyy,t),scene(p+e.yxy,t)-scene(p-e.yxy,t),scene(p+e.yyx,t)-scene(p-e.yyx,t)));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float camZ=t*1.2;
  float camSway=sin(t*0.3)*0.15;
  float camBob=sin(t*0.7)*0.08;
  vec3 ro=vec3(camSway,0.3+camBob,camZ);
  vec3 lookAt=vec3(sin(t*0.15)*0.3,0.2+sin(t*0.4)*0.1,camZ+4.0);
  vec3 fwd=normalize(lookAt-ro);
  vec3 right=normalize(cross(vec3(0,1,0),fwd));
  vec3 up=cross(fwd,right);
  float fov=0.8+sin(t*0.2)*0.1;
  vec3 rd=normalize(fwd*fov+right*uv.x+up*uv.y);
  vec3 col=vec3(0);
  float td=0.0;
  float hit=0.0;
  for(int i=0;i<80;i++){
    vec3 p=ro+rd*td;
    float d=scene(p,t);
    if(d<0.003){hit=1.0;break;}
    if(td>40.0)break;
    td+=d;
  }
  if(hit>0.5){
    vec3 p=ro+rd*td;
    vec3 n=calcNormal(p,t);
    float depth=1.0-td/40.0;
    float ao=1.0-float(td)*0.02;
    vec3 lightDir=normalize(vec3(sin(t*0.3),0.8,cos(t*0.2)));
    float diff=max(dot(n,lightDir),0.0);
    float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),16.0);
    float rim=pow(1.0-max(dot(n,-rd),0.0),3.0);
    float zPhase=fract(p.z*0.1+t*0.05);
    vec3 twilight=mix(vec3(0.15,0.08,0.25),vec3(0.3,0.15,0.4),zPhase);
    vec3 memory=mix(vec3(0.12,0.18,0.35),vec3(0.2,0.25,0.5),sin(p.y*2.0+t)*0.5+0.5);
    vec3 amber=vec3(0.9,0.6,0.3)*smoothstep(0.8,1.0,sin(p.z*0.5+t*0.3)*0.5+0.5)*0.4;
    col=twilight*0.5+memory*0.3;
    col+=diff*vec3(0.5,0.4,0.6)*0.6;
    col+=spec*vec3(0.8,0.7,1.0)*0.3;
    col+=rim*vec3(0.4,0.3,0.7)*0.5;
    col+=amber;
    col*=ao*depth;
    float fog=1.0-exp(-td*0.08);
    vec3 fogCol=mix(vec3(0.1,0.05,0.15),vec3(0.2,0.1,0.3),uv.y*0.5+0.5);
    col=mix(col,fogCol,fog);
  }else{
    float grad=uv.y*0.5+0.5;
    col=mix(vec3(0.08,0.04,0.12),vec3(0.15,0.08,0.22),grad);
  }
  col=pow(col,vec3(0.9));
  float vign=1.0-length(uv)*0.4;
  col*=vign;
  float flicker=0.98+0.02*sin(t*15.0+uv.y*100.0);
  col*=flicker;
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 58;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  const dreamDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.4, wet: 0.35 }).connect(masterReverb);
  const shimmerChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.5, depth: 0.8, wet: 0.5 }).connect(dreamDelay);
  shimmerChorus.start();

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(shimmerChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.7, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -8;

  const padChords = [
    ["D3", "A3", "F4"],
    ["Bb2", "F3", "D4"],
    ["G3", "D4", "Bb4"],
    ["A3", "E4", "C5"],
    ["F3", "C4", "A4"],
    ["D3", "A3", "F4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 20) {
      pad.triggerAttackRelease(padChords[0], "1n", time, 0.15);
    } else {
      pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1n", time, 0.2);
      chordIndex++;
    }
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "highpass", frequency: 400 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0, release: 2.0 },
    modulation: { type: "triangle" }
  }).connect(bellFilter);
  bell.volume.value = -14;

  const bellNotes = ["A4", "D5", "F5", "A5", "C6", "D6", "F5", "E5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 18 && bellIndex % 3 !== 2) {
      bell.triggerAttackRelease(bellNotes[bellIndex % bellNotes.length], "2n", time, 0.25 + Math.random() * 0.1);
    }
    bellIndex++;
  }, "2n.").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, rolloff: -24 }).toDestination();
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0.6, release: 1.5 }
  }).connect(subFilter);
  sub.volume.value = -6;

  const subNotes = ["D1", "D1", "Bb0", "Bb0", "G1", "G1", "A1", "A1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 20) {
      sub.triggerAttackRelease(subNotes[subIndex % subNotes.length], "2n", time, 0.7);
    } else if (bar >= 20) {
      sub.triggerAttackRelease("D1", "2n", time, 0.5);
    }
    subIndex++;
  }, "2n").start(0);

  const glassFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 2 }).connect(dreamDelay);
  const glass = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 0.5 }
  }).connect(glassFilter);
  glass.volume.value = -18;

  let glassIndex = 0;
  const glassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 16 && Math.random() > 0.4) {
      const notes = ["F6", "A6", "D7", "C7", "Bb6"];
      glass.triggerAttackRelease(notes[glassIndex % notes.length], "16n", time, 0.3);
    }
    glassIndex++;
  }, "4n").start("0:2:0");

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 0.5 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  }).connect(noiseFilter);
  noise.volume.value = -22;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 18) {
      noise.triggerAttackRelease("4n", time);
    }
  }, "2n").start("0:1:0");

  const clickFilter = new Tone.Filter({ type: "highpass", frequency: 3000 }).connect(masterReverb);
  const click = new Tone.MetalSynth({
    frequency: 200,
    envelope: { attack: 0.001, decay: 0.08, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 20,
    resonance: 3000
  }).connect(clickFilter);
  click.volume.value = -24;

  let clickCount = 0;
  const clickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 10 && bar < 18 && clickCount % 4 !== 0) {
      click.triggerAttackRelease("32n", time, 0.15 + Math.random() * 0.1);
    }
    clickCount++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2400, time + 16 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(800, time + 4 * (60 / bpm) * 4);
  }, "18:0:0");

  window.toneJsInstruments = { pad, bell, sub, glass, noise, click };
  window.toneJsParts = { padLoop, bellLoop, subLoop, glassLoop, noiseLoop, clickLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
