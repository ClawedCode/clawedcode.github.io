<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
float hash(vec3 p){return fract(sin(dot(p,vec3(27.1,61.7,12.4)))*43758.5453);}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float n=mix(mix(mix(hash(i+vec3(0.0,0.0,0.0)),hash(i+vec3(1.0,0.0,0.0)),f.x),mix(hash(i+vec3(0.0,1.0,0.0)),hash(i+vec3(1.0,1.0,0.0)),f.x),f.y),mix(mix(hash(i+vec3(0.0,0.0,1.0)),hash(i+vec3(1.0,0.0,1.0)),f.x),mix(hash(i+vec3(0.0,1.0,1.0)),hash(i+vec3(1.0,1.0,1.0)),f.x),f.y),f.z);return n;}
float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.0;a*=0.5;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float map(vec3 p,float t){vec3 q=p;q.xz = rot(t*0.3+sin(p.y*0.8+t*0.6)*0.2) * q.xz;q.xy = rot(sin(t*0.7)*0.4) * q.xy;float warp=fbm(q*2.0+vec3(0.0,t*0.2,0.0));float core=length(q)-0.8-0.25*sin(t*0.5+warp*3.0);vec3 r=q;r.xz = rot(t*0.2+warp) * r.xz;float tor=length(r.xz)-1.1+0.1*sin(r.y*2.5+t*0.9);float tor2=length(r.xy)-1.0+0.08*cos(r.z*2.0+warp*6.0);float d=smin(core,tor*0.5,0.4);d=smin(d,tor2*0.5,0.3);d-=0.15*warp;return d;}
vec3 normal(vec3 p,float t){vec2 e=vec2(0.001,0.0);return normalize(vec3(map(p+vec3(e.x,e.y,e.y),t)-map(p-vec3(e.x,e.y,e.y),t),map(p+vec3(e.y,e.x,e.y),t)-map(p-vec3(e.y,e.x,e.y),t),map(p+vec3(e.y,e.y,e.x),t)-map(p-vec3(e.y,e.y,e.x),t)));}
float march(vec3 ro,vec3 rd,float t){float d=0.0;for(int i=0;i<120;i++){vec3 p=ro+rd*d;float m=map(p,t);if(m<0.001||d>20.0)break;d+=m*0.8;}return d;}
void main(){vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;float t=mod(iTime,48.0);vec3 ro=vec3(0.0,0.1,4.0);ro.xz = rot(0.2*sin(t*0.15)) * ro.xz;vec3 ta=vec3(0.0);vec3 ww=normalize(ta-ro);vec3 uu=normalize(cross(vec3(0.0,1.0,0.0),ww));vec3 vv=cross(ww,uu);vec3 rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);float d=march(ro,rd,t);vec3 col=vec3(0.02,0.01,0.05);vec3 glow=vec3(0.0);float acc=0.0;for(int i=0;i<40;i++){float s=float(i)/39.0;vec3 p=ro+rd*(0.2+s*(d+1.5));float field=fbm(p*1.3+vec3(0.0,t*0.35,0.0));float spiral=sin(length(p.xy)*2.5-t*1.4+field*6.0);float dens=exp(-abs(spiral)*2.5)*0.05+field*0.02;dens*=smoothstep(0.0,1.0,1.0-s);glow+=vec3(0.6+0.4*sin(field*5.0+t*0.3),0.4+0.5*sin(field*6.0+1.0),0.9-0.5*cos(field*4.0))*dens;acc+=dens;}col+=glow*0.8;if(d<20.0){vec3 p=ro+rd*d;vec3 n=normal(p,t);vec3 lightDir=normalize(vec3(0.4,0.8,0.5));float diff=clamp(dot(n,lightDir),0.0,1.0);float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);float warp=fbm(p*2.5+vec3(t*0.2,0.0,0.0));vec3 pal1=vec3(0.4,0.6,1.0);vec3 pal2=vec3(0.9,0.3,0.8);vec3 surf=mix(pal1,pal2,warp);col=mix(col,surf*(diff*1.2+0.2)+fres*vec3(1.2,0.8,1.0),0.7);col+=acc*0.8;col+=fres*0.4;}col=pow(col,vec3(0.8));gl_FragColor=vec4(col,1.0);}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm=96;
  Tone.Transport.bpm.value=bpm;
  const comp=new Tone.Compressor({threshold:-16,ratio:8,attack:0.004,release:0.18}).toDestination();
  const verb=new Tone.Reverb({decay:2.8,wet:0.32}).connect(comp);await verb.generate();
  const delay=new Tone.FeedbackDelay({delayTime:"8n.",feedback:0.32,wet:0.26}).connect(comp);
  const lpf=new Tone.Filter({type:"lowpass",frequency:900,Q:0.8}).connect(delay);
  const kick=new Tone.MembraneSynth({pitchDecay:0.02,octaves:6,envelope:{attack:0.001,decay:0.18,sustain:0,release:0.05}}).toDestination();
  const bass=new Tone.MonoSynth({oscillator:{type:"sawtooth"},filter:{type:"lowpass",frequency:140,rolloff:-24},envelope:{attack:0.01,decay:0.18,sustain:0.2,release:0.12},filterEnvelope:{attack:0.02,decay:0.2,sustain:0.4,baseFrequency:60,octaves:2.5}}).connect(lpf);
  const pad=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},envelope:{attack:0.8,decay:0.4,sustain:0.7,release:1.8}}).connect(verb);
  const arp=new Tone.FMSynth({harmonicity:1.7,modulationIndex:8,oscillator:{type:"sine"},envelope:{attack:0.02,decay:0.15,sustain:0.2,release:0.1},modulation:{type:"triangle"},modulationEnvelope:{attack:0.01,decay:0.25,sustain:0,release:0.1}}).connect(delay);
  const hat=new Tone.MetalSynth({frequency:430,envelope:{attack:0.001,decay:0.12,release:0.08},harmonicity:5,modulationIndex:24,resonance:5000}).connect(comp);
  const noise=new Tone.NoiseSynth({noise:{type:"pink"},envelope:{attack:0.3,decay:0.6,sustain:0,release:0.5}}).connect(verb);
  const bassSections=[["C2","G1","A#1","G1"],["D2","A#1","C2","F1","G1"],["C2","G1","A#1","G1"]];
  let bassIndex=0;
  const bassLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);const phase=bar%20;const pattern=phase<8?bassSections[0]:(phase<14?bassSections[1]:bassSections[2]);const vel=phase<4?0.55:phase<12?0.72:0.52;bass.triggerAttackRelease(pattern[bassIndex%pattern.length],"8n",time,vel);bassIndex++;},"8n").start(0);
  let kickCount=0;
  const kickLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);const phase=bar%20;const doubleHit=phase>=6&&phase<14&&kickCount%8===4;kick.triggerAttackRelease("C1",doubleHit?"16n":"8n",time,doubleHit?0.75:1);kickCount++;},"4n").start(0);
  const padChords=[["C3","G3","A#3","D4"],["A#2","F3","A#3","D4"],["F2","C3","F3","A3"]];
  const padLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);const phase=bar%20;const chord=phase<6?padChords[0]:(phase<12?padChords[1]:padChords[2]);const vel=phase<16?0.35:0.28;pad.triggerAttackRelease(chord,"2n",time,vel);},"2n").start(0);
  const arpNotes=["C4","D4","F4","A#4","G4","E4","D5","C5"];
  let arpIndex=0;
  const arpLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);const phase=bar%20;if(phase>=2&&phase<16){const vel=phase<8?0.35:0.5;arp.triggerAttackRelease(arpNotes[(arpIndex+phase)%arpNotes.length],"16n",time,vel);arpIndex++;}},"16n").start(0);
  let hatIndex=0;
  const hatLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);const phase=bar%20;if(phase>=6&&phase<15&&hatIndex%2===1){const vel=0.2+Math.random()*0.2;hat.triggerAttackRelease("8n",time,vel);}hatIndex++;},"8n").start(0);
  Tone.Transport.schedule((time)=>{noise.triggerAttackRelease(1.2,time,0.35);},"4:3:0");
  Tone.Transport.schedule((time)=>{noise.triggerAttackRelease(1.2,time,0.4);},"10:3:0");
  Tone.Transport.scheduleRepeat((time)=>{const seconds=Tone.Transport.getSecondsAtTime(time);const bar=Math.floor(seconds/(60/bpm)/4);const phase=bar%20;const target=phase<10?2200:phase<16?1200:800;lpf.frequency.linearRampToValueAtTime(target,time+0.5);},"1m");
  window.toneJsInstruments={kick,bass,pad,arp,hat,noise};
  window.toneJsParts={kickLoop,bassLoop,padLoop,arpLoop,hatLoop};
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
