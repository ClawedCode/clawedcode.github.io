....................                                                                    ..............................',\\n  '..............................                                                                    ..............................',\\n  '..............................                                                                    ..............................',\\n  '..............................                                                                    ..............................',\\n  '.............................                                                                      .............................',\\n  '.............................                @@@  @                          @  @@@                .............................',\\n  '.............................             @@@@@@  @@@                      @@@  @@@@@@             .............................',\\n  '.............................            @@@@@@@  @@@@                    @@@@  @@@@@@@            .............................',\\n  '............................            @@@@@@@@  @@@@@                  @@@@@  @@@@@@@@            ............................',\\n  '............................             @@@@@@@  @@@@@@                @@@@@@  @@@@@@@             ............................',\\n  '......  ....................             @@@@@@@  @@@@@@@              @@@@@@@  @@@@@@@             ....................  ......',\\n  '........   .................              @@@@@@  @@@@@@@              @@@@@@@  @@@@@@              .................   ........',\\n  '..........   ...............               @@@@@  @@@@@@@@            @@@@@@@@  @@@@@               ...............   ..........',\\n  '............   .............                @@@@  @@@@@@@              @@@@@@@  @@@@                .............   ............',\\n  '..............   ...........                  @@  @@@@@                  @@@@@  @@                  ...........   ..............',\\n  '.................   ........                     @@                          @@                     ........   .................',\\n  '...................    .....                                                                        .....    ...................',\\n  '......................    ..                                                                        ..    ......................',\\n  '.........................   **                                                                    **   .........................',\\n  '.............................*****                                                            *****.............................',\\n  '.............................    *****                                                    *****    .............................',\\n  '.............................        *******                                        *******        .............................',\\n  '..............................             ********           ****           ********             ..............................',\\n  '.     ........................                    ***          **          ***                    ........................     .',\\n  '.....        ..................                                                                  ..................        .....',\\n  '...........             ........                                                                ........             ...........',\\n  '.....................            ******************                          ******************            .....................',\\n  '..................................                                                            ..................................',\\n  '...................................                                                          ...................................',\\n  '....................................              ***                      ***              ....................................',\\n  '.....................................        *******                        *******        .....................................',\\n  '...................................... *******                                    ******* ......................................',\\n  '...................................     *                                              *     ...................................',\\n  '..............................      .....                                              .....      ..............................',\\n  '..........................     ............                                          ............     ..........................',\\n  '.......................    .................                                        .................    .......................',\\n  '....................    .....................                                      .....................    ....................',\\n  '.................   ..........................                                    ..........................   .................',\\n  '..............   .............................                                    .............................   ..............',\\n  '............   ...............................                                    ...............................   ............',\\n  '.........   ..................................                                    ..................................   .........',\\n  '.......   ....................................                                    ....................................   .......',\\n  '.....   ......................................                                    ......................................   .....',\\n  '.............................................                                      .............................................',\\n  '.............................................                                      .............................................',\\n  '............................................                                        ............................................',\\n  '...........................................                                          ...........................................',\\n  '.........................................                                              .........................................',\\n  '.......................................                                                  .......................................',\\n  '.....................................                                                      .....................................',\\n  '....................................                                                        ....................................',\\n  '.................................                                                              .................................',\\n  '...............................                                                                  ...............................',\\n  '.............................                                                                      .............................',\\n  '...........................                                                                          ...........................',\\n  '.........................                                                                              .........................',\\n  '.......................                                                                                  .......................',\\n  '.....................                                                                                      .....................',\\n  '...................                                                                                          ...................',\\n  '.................                                                                                              .................',\\n  '................                                                                                                ................',\\n  '..............                                                                                                    ..............',\\n  '.............                                                                                                      .............',\\n  '............                                                                                                        ............',\\n];\\n\\n// partials 136 to 148, every second one, above the top of the screen. Only for whoever actually runs the spectrogram.\\nconst YOU_LOOKED = [\\n  '..................................#...#..###..#...#.......#......###...###..#...#.#####.####....................................',\\n  '..................................#...#.#...#.#...#.......#.....#...#.#...#.#..#..#.....#...#...................................',\\n  '...................................#.#..#...#.#...#.......#.....#...#.#...#.#.#...#.....#...#...................................',\\n  '....................................#...#...#.#...#.......#.....#...#.#...#.##....####..#...#...................................',\\n  '....................................#...#...#.#...#.......#.....#...#.#...#.#.#...#.....#...#...................................',\\n  '....................................#...#...#.#...#.......#.....#...#.#...#.#..#..#.....#...#...................................',\\n  '....................................#....###...###........#####..###...###..#...#.#####.####....................................',\\n];\\n\\nconst WALL_LEVEL = 0.0135;\\nconst GHOST_LEVEL = 0.1;\\nconst KICK_LEVEL = 0.34;\\nconst HAT_LEVEL = 0.03;\\nconst SNARE_LEVEL = 0.062;\\n\\n// Every sound in this file is a harmonic of ROOT. At 100 BPM one sixteenth is exactly 11 periods of 73.33 Hz, so\\n// consecutive columns stay phase-locked and join without a seam.\\nconst ROOT = 220 / 3;\\nconst COLS = 128;\\nconst HIGHEST = 148;\\nconst TILT = (k) => Math.pow(k / 14, -0.62);\\n\\n// Web Audio normalizes each PeriodicWave to a peak of 1, so a column's real level is restored from its own peak.\\n// Quadratic phases keep the sum of a hundred partials from stacking into a click. @strudel/web 1.3.0 rotates phases\\n// with an updated real part (imag = amp * (cos - sin^2)); MAG cancels that, so every partial sounds at its written level.\\nconst PHASE = Array.from({ length: HIGHEST }, (_, i) => (((i + 1) * (i + 1)) / (2 * HIGHEST)) % 1);\\nconst RE = PHASE.map(p => -Math.sin(2 * Math.PI * p));\\nconst IM = PHASE.map(p => Math.cos(2 * Math.PI * p) - Math.pow(Math.sin(2 * Math.PI * p), 2));\\nconst MAG = RE.map((re, i) => Math.hypot(re, IM[i]));\\nconst TABLE = 1024;\\nconst COS = Float64Array.from({ length: TABLE }, (_, n) => Math.cos(2 * Math.PI * n / TABLE));\\nconst SIN = Float64Array.from({ length: TABLE }, (_, n) => Math.sin(2 * Math.PI * n / TABLE));\\nconst waveOf = (amps) => {\\n  const sum = new Float64Array(TABLE);\\n  amps.forEach((a, i) => {\\n    if (!a) return;\\n    const k = i + 1, re = RE[i] / MAG[i] * a, im = IM[i] / MAG[i] * a;\\n    for (let n = 0; n \u003c TABLE; n++) { const idx = (k * n) % TABLE; sum[n] += re * COS[idx] + im * SIN[idx]; }\\n  });\\n  let peak = 0;\\n  for (let n = 0; n \u003c TABLE; n++) peak = Math.max(peak, Math.abs(sum[n]));\\n  return { partials: amps.map((a, i) => a / MAG[i]), peak };\\n};\\n// one voice whose partials are the written amplitudes, at an absolute level: gain = level * peak\\nconst wave = (amps, level, env) => {\\n  const { partials, peak } = waveOf(amps);\\n  return { s: 'user', freq: ROOT, partials, phases: PHASE, gain: level * peak, ...env };\\n};\\nconst sized = (fill) => { const a = new Array(HIGHEST).fill(0); fill(a); return a; };\\n\\n// ---------- the bass that is not there ----------\\n// The first two numbers are the point: harmonics 1 and 2 of every bass note are zero. Nothing in this file plays\\n// the root. Harmonics 3-7 are all the ear gets, and it supplies the note itself.\\nconst RUNGS = [0, 0, 1, 0.8, 0.62, 0.46, 0.32];\\nconst JUST = { d2: 4 / 4, 'f#2': 5 / 4, a2: 6 / 4, c3: 7 / 4 };\\nconst GHOST_PEAK = waveOf(sized(a => RUNGS.forEach((r, i) => { a[i] = r; }))).peak;\\nconst ghost = (pat, level = GHOST_LEVEL) => reify(pat).fmap(n => ({\\n  s: 'user', freq: ROOT * JUST[n], partials: RUNGS, gain: level * GHOST_PEAK, attack: 0.008, decay: 0.2, sustain: 0.62, release: 0.05\\n}));\\nconst ON_D = \\\"d2@3 d2@3 a2@2 c3@3 a2@3 f#2@2\\\";\\nconst ON_FS = \\\"f#2@3 f#2@3 c3@2 d2@3 a2@3 f#2@2\\\";\\nconst ON_A = \\\"a2@3 a2@3 d2@2 c3@3 a2@3 f#2@2\\\";\\nconst ON_C = \\\"c3@3 c3@3 a2@2 f#2@3 a2@3 c3@2\\\";\\n\\n// ---------- the one note ----------\\n// The comb: each chord lights every 4th, 5th, 6th or 7th partial, the harmonic series of D, F#, A and C. The chord\\n// loop climbs the root's own series. An 8-bar loop, one per drawing.\\nconst CHORDS = [4, 4, 5, 5, 6, 6, 7, 6];\\nconst GATE = [0.42, 0.7, 1, 0.62, 1.22, 0.72, 0.46, 0.76, 1, 0.64, 0.82, 0.46, 1.22, 0.72, 1, 0.62];\\nconst LEVELS = [0.46, 0.5, 0.58, 0.62, 0.68, 0.72, 0.78, 0.84, 0.86, 0.88, 0.9, 0.92, 0.94, 0.96, 0.98, 1, 1, 1, 1, 1, 1, 1, 1.05, 1.1];\\nconst COMB = [2.1, 2.7, 3.2];\\n// the overtone hook, throat-singing out of the note: multiples of whichever comb is lit\\nconst PHRASE = [[3, 6], [3, 5], [2, 6], [4, 7], [2, 6], [2, 5]];\\nconst ANSWER = [[2, 8], [2, 7], [4, 6], [8, 0]];\\nconst stepsOf = (cells) => cells.flatMap(([n, m]) => new Array(n).fill(m));\\nconst CALL = stepsOf(PHRASE), REPLY = stepsOf(ANSWER);\\nconst hookAt = (c) => {\\n  const bar = Math.floor(c / 16), step = c % 16;\\n  if (bar \u003c 12) return 0;\\n  if (bar % 2 === 0) return CALL[step];\\n  return bar >= 16 ? REPLY[step] : 0;\\n};\\nconst HOOK = 6.2, EYE = 3.6, LINE = 3.4, CAPTION = 0.34;\\nconst DRAWINGS = [FIRST_DRAWING, SLEEPING_SHAPE, LOOKS_BACK];\\nconst NOTE_ENV = { attack: 0.006, decay: 0, sustain: 1, release: 0.006 };\\n\\nconst column = (c) => {\\n  const sweep = Math.floor(c / COLS), x = c % COLS, bar = Math.floor(c / 16), step = c % 16;\\n  const art = DRAWINGS[sweep], chord = CHORDS[bar % 8], level = LEVELS[bar];\\n  const gate = bar \u003c 4 && (step === 4 || step === 12) ? 1 : GATE[step];\\n  const hook = hookAt(c) * chord;\\n  const amps = sized((a) => {\\n    for (let k = 14; k \u003c= 109; k++) {\\n      const cell = k > 107 ? '.' : art[Math.min(91, 107 - k)][x];\\n      if (cell === ' ') continue;\\n      if (cell === '@') { a[k - 1] = TILT(k) * EYE; continue; }\\n      if (cell === '*') { a[k - 1] = TILT(k) * LINE; continue; }\\n      let amp = TILT(k) * level * gate;\\n      if (k % chord === 0) amp *= COMB[sweep];\\n      if (k === hook) amp = TILT(k) * level * HOOK;\\n      a[k - 1] = amp;\\n    }\\n    if (sweep === 2) YOU_LOOKED.forEach((row, r) => {\\n      if (row[x] === '#') a[148 - 2 * r - 1] = CAPTION;\\n    });\\n  });\\n  return wave(amps, WALL_LEVEL, NOTE_ENV);\\n};\\n\\n// ---------- the kit, built from the same root ----------\\nconst KICK_VOICE = { s: 'sine', freq: ROOT * 2, penv: 26, pdecay: 0.05, attack: 0.003, decay: 0.2, sustain: 0, release: 0.02, gain: KICK_LEVEL };\\nconst TOP = (from, to, shape) => sized(a => { for (let k = from; k \u003c= to; k++) a[k - 1] = shape(k); });\\nconst HAT_SHAPE = (k) => 0.7 + 0.3 * Math.sin(k * 2.4);\\nconst TICK = wave(TOP(110, 128, HAT_SHAPE), HAT_LEVEL, { attack: 0.001, decay: 0.038, sustain: 0, release: 0.01 });\\nconst SHIMMER = wave(TOP(110, 128, HAT_SHAPE), HAT_LEVEL * 0.8, { attack: 0.002, decay: 0.16, sustain: 0, release: 0.03 });\\nconst CRACK = wave(TOP(110, 128, HAT_SHAPE), SNARE_LEVEL * 0.8, { attack: 0.001, decay: 0.11, sustain: 0, release: 0.03 });\\nconst BODY = wave(TOP(3, 12, k => (k % 2 ? 1 : 0.7) * Math.pow(k / 3, -0.5)), SNARE_LEVEL, { attack: 0.001, decay: 0.085, sustain: 0, release: 0.02, penv: 5, pdecay: 0.03 });\\n\\nconst groove = (open, ticks, crack) => stack(\\n  pure(TICK).struct(ticks),\\n  pure(SHIMMER).struct(open),\\n  stack(pure(CRACK), pure(BODY)).struct(crack).late(0.003)\\n);\\n\\n$: arrange(\\n  [23, pure(KICK_VOICE).struct(\\\"x ~ ~ ~ ~ ~ x ~ ~ ~ ~ x ~ ~ ~ ~\\\")],\\n  [1, pure(KICK_VOICE).struct(\\\"x ~ ~ ~ ~ ~ x ~ x ~ ~ x ~ x x ~\\\")],\\n  [1, silence]\\n);\\n\\n$: arrange(\\n  [4, groove(\\\"~\\\", \\\"~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~\\\", \\\"~\\\")],\\n  [12, groove(\\\"~ ~ ~ ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~ ~ ~\\\", \\\"~ ~ x ~ ~ ~ x x ~ ~ x ~ ~ ~ x ~\\\", \\\"~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~\\\")],\\n  [2, groove(\\\"~ ~ ~ ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~ ~ ~\\\", \\\"x ~ x x ~ x x ~ x ~ x x ~ x x ~\\\", \\\"~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~\\\")],\\n  [4, groove(\\\"~\\\", \\\"~ ~ x ~ ~ ~ x ~ ~ ~ x ~ ~ ~ x ~\\\", \\\"~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~\\\")],\\n  [2, groove(\\\"~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~ ~ ~\\\", \\\"x x x x ~ x x x x ~ x x ~ x x x\\\", \\\"~ ~ ~ ~ x ~ ~ ~ ~ ~ ~ ~ x ~ ~ ~\\\")],\\n  [1, silence]\\n);\\n\\n// the bass enters on bar 2 and withholds D until the second drawing; the held breath keeps only D, with nothing under it\\n$: arrange(\\n  [2, silence], [2, ghost(ON_FS, GHOST_LEVEL * 0.72)], [2, ghost(ON_A, GHOST_LEVEL * 0.8)], [1, ghost(ON_C, GHOST_LEVEL * 0.86)], [1, ghost(ON_A, GHOST_LEVEL * 0.86)],\\n  [2, ghost(ON_D)], [2, ghost(ON_FS)], [2, ghost(ON_A)], [1, ghost(ON_C)], [1, ghost(ON_A)],\\n  [2, ghost(ON_D)], [2, ghost(ON_FS)], [2, ghost(ON_A)], [1, ghost(ON_C)], [1, ghost(ON_A)],\\n  [1, ghost(\\\"d2\\\", GHOST_LEVEL * 1.25)]\\n).late(0.004);\\n\\n// One note, four hundred times. 384 columns of it are the drawings; the last bar is silent.\\n$: sequence(...Array.from({ length: 400 }, (_, c) => (c \u003c 384 ? pure(column(c)) : silence))).slow(25);\",\"bpm\":100,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.4166666666666667,\"cycles\":25,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    // One shared promise: the start-up preload below and an early
    // __renderStrudelOffline() call (captureStrudelRender only waits for the
    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
