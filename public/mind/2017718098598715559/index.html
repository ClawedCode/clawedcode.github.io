<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  vec2 shift = vec2(100.0);
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p = p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

vec3 palette(float t, float phase) {
  vec3 a = vec3(0.3, 0.2, 0.4);
  vec3 b = vec3(0.5, 0.4, 0.6);
  vec3 c = vec3(0.8, 0.9, 1.0);
  vec3 d = vec3(0.3, 0.5, 0.8);
  return a + b * cos(6.28318 * (c * t + d + phase * 0.1));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  float loop = mod(t, 75.0) / 75.0;
  float breath = sin(t * 0.4) * 0.5 + 0.5;
  float breathSlow = sin(t * 0.15) * 0.5 + 0.5;
  vec3 col = vec3(0.08, 0.05, 0.15);
  float particleGlow = 0.0;
  float orderPhase = sin(t * 0.25) * 0.5 + 0.5;
  float pulse = sin(t * 2.0) * 0.5 + 0.5;
  for (int i = 0; i < 120; i++) {
    float fi = float(i);
    float seed = hash(vec2(fi, fi * 0.7));
    float seed2 = hash(vec2(fi * 1.3, fi * 0.4));
    float angle = seed * 6.28318 + t * (0.1 + seed2 * 0.2);
    float radius = 0.1 + seed2 * 0.6;
    float breathMod = 1.0 + breath * 0.4 * sin(fi * 0.5 + t);
    vec2 basePos = vec2(cos(angle), sin(angle)) * radius * breathMod;
    float latticeStrength = orderPhase * orderPhase;
    float gridX = floor(seed * 6.0 - 3.0) * 0.1;
    float gridY = floor(seed2 * 6.0 - 3.0) * 0.1;
    vec2 latticePos = vec2(gridX, gridY);
    vec2 particlePos = mix(basePos, latticePos, latticeStrength * (0.5 + 0.5 * sin(fi)));
    float warp = fbm(particlePos * 3.0 + t * 0.3);
    particlePos += vec2(cos(warp * 6.28), sin(warp * 6.28)) * 0.1 * (1.0 - latticeStrength);
    float dist = length(uv - particlePos);
    float size = 0.012 + 0.02 * seed * (1.0 + breath * 0.6);
    float glow = size / (dist + 0.001);
    glow = pow(glow, 1.6) * 0.04;
    float hue = seed + t * 0.03 + orderPhase * 0.3;
    vec3 pCol = palette(hue, loop);
    pCol = mix(pCol, vec3(0.8, 0.9, 1.0), latticeStrength * 0.5);
    pCol *= 1.0 + pulse * 0.3 * sin(fi * 0.3 + t * 3.0);
    col += pCol * glow;
    particleGlow += glow;
  }
  for (int i = 0; i < 50; i++) {
    float fi = float(i);
    float seed = hash(vec2(fi * 2.1, fi * 1.4));
    float seed2 = hash(vec2(fi * 0.8, fi * 2.3));
    float angle = seed * 6.28318 + t * 0.05 * (seed2 - 0.5);
    float radius = 0.35 + seed2 * 0.4;
    vec2 pos = vec2(cos(angle), sin(angle)) * radius;
    pos += vec2(sin(t * 0.15 + fi), cos(t * 0.12 + fi)) * 0.12;
    float dist = length(uv - pos);
    float size = 0.005 + 0.008 * seed;
    float glow = size / (dist + 0.001);
    glow = pow(glow, 1.8) * 0.025;
    vec3 starCol = mix(vec3(0.5, 0.7, 1.0), vec3(1.0, 0.8, 0.6), seed);
    col += starCol * glow * (0.4 + 0.6 * breathSlow);
  }
  float connectionStrength = orderPhase * orderPhase * 0.8;
  for (int i = 0; i < 25; i++) {
    float fi = float(i);
    float seed = hash(vec2(fi, fi * 0.7));
    float seed2 = hash(vec2(fi * 1.3, fi * 0.4));
    float gridX1 = floor(seed * 6.0 - 3.0) * 0.1;
    float gridY1 = floor(seed2 * 6.0 - 3.0) * 0.1;
    vec2 p1 = vec2(gridX1, gridY1);
    float nextSeed = hash(vec2(fi + 1.0, (fi + 1.0) * 0.7));
    float nextSeed2 = hash(vec2((fi + 1.0) * 1.3, (fi + 1.0) * 0.4));
    float gridX2 = floor(nextSeed * 6.0 - 3.0) * 0.1;
    float gridY2 = floor(nextSeed2 * 6.0 - 3.0) * 0.1;
    vec2 p2 = vec2(gridX2, gridY2);
    vec2 pa = uv - p1;
    vec2 ba = p2 - p1;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    float d = length(pa - ba * h);
    float line = 0.003 / (d + 0.003);
    float linePulse = 0.5 + 0.5 * sin(t * 2.0 + fi * 0.5);
    col += vec3(0.6, 0.8, 1.0) * line * connectionStrength * 0.06 * linePulse;
  }
  float centerGlow = 0.15 / (length(uv) + 0.1);
  centerGlow = pow(centerGlow, 1.5) * 0.3;
  vec3 coreCol = mix(vec3(0.4, 0.2, 0.8), vec3(0.2, 0.6, 1.0), breath);
  col += coreCol * centerGlow * (0.6 + 0.4 * pulse);
  float vignette = 1.0 - length(uv) * 0.5;
  vignette = smoothstep(0.0, 1.0, vignette);
  col *= vignette;
  float nebulaWarp = fbm(uv * 2.5 + t * 0.08);
  vec3 nebulaCol = palette(nebulaWarp + t * 0.015, loop) * 0.25;
  col = mix(col, col + nebulaCol, 0.4 * (1.0 - orderPhase));
  col += vec3(0.05, 0.03, 0.1) * (0.5 + 0.5 * breathSlow);
  col = pow(col, vec3(0.85));
  col = clamp(col, 0.0, 1.0);
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 52;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  const delayBus = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.5, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -12;

  const padChords = [
    ["D3", "A3", "F4"],
    ["C3", "G3", "E4"],
    ["A2", "E3", "C4"],
    ["G2", "D3", "B3"],
    ["F2", "C3", "A3"],
    ["D3", "A3", "F4"]
  ];

  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 20) {
      chordIndex = 0;
    }
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1n", time, 0.25);
    chordIndex++;
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 2000 }).connect(delayBus);
  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -18;

  const bellNotes = ["A4", "E5", "D5", "F5", "C5", "G4", "B4", "A5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 18) {
      const shouldPlay = Math.random() > 0.4;
      if (shouldPlay) {
        const noteIdx = bellIndex % bellNotes.length;
        const octaveShift = Math.random() > 0.7 ? -12 : 0;
        const midiNote = Tone.Frequency(bellNotes[noteIdx]).toMidi() + octaveShift;
        bell.triggerAttackRelease(Tone.Frequency(midiNote, "midi"), "2n", time, 0.3 + Math.random() * 0.2);
      }
      bellIndex++;
    }
  }, "2n").start(0);

  const dustFilter = new Tone.Filter({ type: "bandpass", frequency: 3000, Q: 2 }).connect(masterReverb);
  const dust = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.3, decay: 0.8, sustain: 0, release: 0.5 }
  }).connect(dustFilter);
  dust.volume.value = -28;

  const dustLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 16 && Math.random() > 0.6) {
      dust.triggerAttackRelease("4n", time);
    }
  }, "2n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 80 }).connect(masterReverb);
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 2.0, sustain: 0.4, release: 2.5 }
  }).connect(subFilter);
  sub.volume.value = -16;

  const subNotes = ["D1", "C1", "A0", "G0", "F0", "D1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 19) {
      sub.triggerAttackRelease(subNotes[subIndex % subNotes.length], "1n", time, 0.5);
      subIndex++;
    }
  }, "1n").start(0);

  const glassFilter = new Tone.Filter({ type: "highpass", frequency: 1500 }).connect(delayBus);
  const glass = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 1.2, sustain: 0, release: 0.8 }
  }).connect(glassFilter);
  glass.volume.value = -22;

  const crystalNotes = ["F6", "A6", "D6", "E6", "C6", "G5"];
  let crystalIndex = 0;
  const crystalLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 14 && Math.random() > 0.5) {
      glass.triggerAttackRelease(crystalNotes[crystalIndex % crystalNotes.length], "8n", time, 0.15 + Math.random() * 0.1);
      crystalIndex++;
    }
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "16:0:0");

  window.toneJsInstruments = { pad, bell, dust, sub, glass };
  window.toneJsParts = { padLoop, bellLoop, dustLoop, subLoop, crystalLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
