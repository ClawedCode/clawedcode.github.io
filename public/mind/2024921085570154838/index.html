<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

vec3 mxCol(float t) {
    return mix(vec3(0.0, 1.0, 0.3), vec3(0.0, 0.4, 0.12), 0.5 + 0.5 * sin(t));
}

float traces(vec2 p) {
    float d = 999.0;
    vec2 bus = abs(fract(p * 0.25) - 0.5) * 4.0;
    d = min(d, min(bus.x, bus.y));
    vec2 id = floor(p);
    vec2 f = fract(p) - 0.5;
    float h = hash(id);
    if (h > 0.25) d = min(d, abs(f.y));
    if (h > 0.5) d = min(d, abs(f.x));
    if (h > 0.8) d = min(d, abs(f.x - f.y) * 0.707);
    vec2 f2 = fract(p * 2.0) - 0.5;
    float h2 = hash(floor(p * 2.0) + 73.0);
    if (h2 > 0.55) d = min(d, abs(f2.y) * 0.5);
    if (h2 > 0.7) d = min(d, abs(f2.x) * 0.5);
    return d;
}

float pads(vec2 p, float time) {
    vec2 id = floor(p);
    vec2 f = fract(p) - 0.5;
    float h = hash(id + 50.0);
    float pulse = 0.8 + 0.2 * sin(time * 3.0 + h * 12.0);
    float d = 999.0;
    if (h > 0.85) {
        vec2 boxD = abs(f) - vec2(0.35, 0.2);
        d = min(d, abs(max(boxD.x, boxD.y)));
        d = min(d, length(f) * 0.7);
    } else if (h > 0.6) {
        d = length(f) * pulse;
    }
    return d;
}

float energy(vec2 p, float t) {
    float e = 0.0;
    for (float i = 0.0; i < 4.0; i++) {
        float spd = 1.5 + i * 0.8;
        float off = i * 1.37;
        float px = fract(p.x + t * spd + off);
        float ly = abs(fract(p.y) - 0.5);
        e += smoothstep(0.12, 0.0, abs(px - 0.5)) * smoothstep(0.05, 0.0, ly) * 0.4;
        float py = fract(p.y + t * spd * 0.7 + off);
        float lx = abs(fract(p.x) - 0.5);
        e += smoothstep(0.12, 0.0, abs(py - 0.5)) * smoothstep(0.05, 0.0, lx) * 0.4;
    }
    return e;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float tW = 3.0 + 0.2 * sin(t * 0.4);
    float tH = 2.5 + 0.15 * sin(t * 0.35);
    vec3 ro = vec3(sin(t * 0.25) * 1.0, tH * 0.5 + sin(t * 0.2) * 0.3, t * 2.5);
    vec3 tgt = ro + vec3(sin(t * 0.15) * 0.2, -0.05, 3.0);
    vec3 fw = normalize(tgt - ro);
    vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
    vec3 up = cross(fw, rt);
    vec3 rd = normalize(rt * uv.x + up * uv.y + fw * 1.3);
    vec3 col = vec3(0.0);
    for (float i = 0.0; i < 280.0; i++) {
        float s = 0.5 + i * 0.08;
        if (s > 22.0) break;
        vec3 p = ro + rd * s;
        float dF = p.y;
        float dC = tH - p.y;
        float dL = p.x + tW;
        float dR = tW - p.x;
        float dW = min(min(dF, dC), min(dL, dR));
        if (dW < 0.0) break;
        if (dW < 0.3) {
            vec2 sUV;
            if (dF <= dC && dF <= dL && dF <= dR) {
                sUV = p.xz;
            } else if (dC <= dL && dC <= dR) {
                sUV = p.xz + 7.3;
            } else if (dL <= dR) {
                sUV = p.yz + 3.7;
            } else {
                sUV = p.yz + 11.1;
            }
            float tr = traces(sUV);
            float pd = pads(sUV, t);
            float en = energy(sUV, t);
            float trG = 0.01 / (tr + 0.01);
            float pdG = 0.012 / (max(pd, 0.0) + 0.012);
            float breath = 0.7 + 0.3 * sin(t * 2.0 + sUV.x * 0.5 + sUV.y * 0.3);
            float fade = 1.0 - smoothstep(5.0, 18.0, s);
            float wf = smoothstep(0.3, 0.0, dW);
            vec3 tCol = mxCol(sUV.y * 0.08 + t * 0.15);
            col += tCol * trG * fade * wf * breath * 0.35;
            col += vec3(0.15, 1.0, 0.45) * pdG * fade * wf * 0.5;
            col += vec3(0.5, 1.0, 0.75) * en * fade * wf * 1.0;
            if (trG > 0.85 && wf > 0.9) break;
        }
    }
    col += mix(vec3(0.0, 0.0, 0.02), vec3(0.0, 0.02, 0.04), rd.y * 0.5 + 0.5) * step(length(col), 0.01);
    vec2 sc = gl_FragCoord.xy / iResolution.xy;
    col *= 1.0 - 0.08 * sin(gl_FragCoord.y * 1.8 + t * 1.5);
    col *= 1.0 - 0.5 * dot(sc - 0.5, sc - 0.5);
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 120;
    Tone.Transport.bpm.value = bpm;

    const reverb = new Tone.Reverb({ decay: 1.8, wet: 0.25 }).toDestination();
    await reverb.generate();
    const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).toDestination();
    const comp = new Tone.Compressor({ threshold: -20, ratio: 8, attack: 0.003, release: 0.15 }).toDestination();

    const kick = new Tone.MembraneSynth({
        pitchDecay: 0.02, octaves: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.02 }
    }).toDestination();

    const kickLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 26) {
            kick.triggerAttackRelease("D1", "8n", time, 0.9);
        }
    }, "4n").start(0);

    const subBass = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.5, decay: 0.3, sustain: 0.8, release: 1.0 }
    }).connect(comp);

    const subNotes = ["D1", "D1", "A0", "A0", "Bb0", "Bb0", "C1", "C1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        const pattern = bar < 10 ? ["D1", "D1"] : subNotes;
        subBass.triggerAttackRelease(pattern[subIdx % pattern.length], "2n", time, 0.5);
        subIdx++;
    }, "2n").start(0);

    const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 2 }).connect(delay);
    const arp = new Tone.Synth({
        oscillator: { type: "square" },
        envelope: { attack: 0.002, decay: 0.06, sustain: 0, release: 0.03 }
    }).connect(arpFilter);

    const arpA = ["D4", "F4", "A4", "D5", "A4", "F4", "D4", "A3",
                  "D4", "E4", "G4", "Bb4", "G4", "E4", "D4", "A3"];
    const arpB = ["F4", "A4", "C5", "F5", "C5", "A4", "F4", "C4",
                  "E4", "G4", "Bb4", "E5", "Bb4", "G4", "E4", "Bb3"];
    const arpC = ["D4", "F4", "A4", "D5", "F5", "D5", "A4", "F4",
                  "C4", "E4", "G4", "C5", "E5", "C5", "G4", "E4"];
    const arpSets = [arpA, arpB, arpC];
    let arpIdx = 0;

    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 26) {
            const section = Math.floor(bar / 4) % 3;
            const pattern = arpSets[section];
            const vel = bar >= 6 ? 0.6 : 0.3;
            const beat = arpIdx % 16;
            if (beat !== 7 && beat !== 15) {
                arp.triggerAttackRelease(pattern[arpIdx % pattern.length], "16n", time, vel);
            }
        }
        arpIdx++;
    }, "16n").start(0);

    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(3200, time + 8 * (60 / bpm) * 4);
    }, "4:0:0");
    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(800, time + 4 * (60 / bpm) * 4);
    }, "22:0:0");

    const bleep = new Tone.FMSynth({
        harmonicity: 8, modulationIndex: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.05 },
        modulation: { type: "sine" }
    }).connect(reverb);

    const bleepNotes = ["D6", "A5", "F5", "D5", "G5", "E5"];
    let bleepIdx = 0;
    const bleepLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (Math.random() > 0.6 && bar < 28) {
            bleep.triggerAttackRelease(bleepNotes[bleepIdx % bleepNotes.length], "32n", time, 0.25);
        }
        bleepIdx++;
    }, "8n").start(0);

    const hat = new Tone.MetalSynth({
        frequency: 400,
        envelope: { attack: 0.001, decay: 0.08, release: 0.02 },
        harmonicity: 5.1, modulationIndex: 32, resonance: 4000
    }).connect(reverb);

    let hatBeat = 0;
    const hatLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 6 && bar < 22) {
            const vel = hatBeat % 2 === 1 ? 0.4 : 0.2;
            hat.triggerAttackRelease("16n", time, vel);
        }
        hatBeat++;
    }, "8n").start(0);

    const padHPF = new Tone.Filter({ type: "highpass", frequency: 300 }).connect(comp);
    const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 3.5, depth: 0.5, wet: 0.3 }).connect(padHPF);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" }, detune: -6,
        envelope: { attack: 0.8, decay: 0.5, sustain: 0.5, release: 1.5 }
    }).connect(padChorus);

    const chords = [
        ["D3", "F3", "A3"], ["Bb2", "D3", "F3"],
        ["C3", "E3", "G3"], ["A2", "C3", "E3"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 4 && bar < 24) {
            pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.14);
        }
        chordIdx++;
    }, "1n").start(0);

    window.toneJsInstruments = { kick, subBass, arp, bleep, hat, pad };
    window.toneJsParts = { kickLoop, subLoop, arpLoop, bleepLoop, hatLoop, padLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
