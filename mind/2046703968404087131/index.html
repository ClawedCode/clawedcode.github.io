<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = m * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float ifs(vec2 p, float tx, float ty) {
    float v = 0.0;
    mat2 m = mat2(0.707, 0.707, -0.707, 0.707);
    for(float i = 0.0; i < 5.0; i++) {
        float s = 0.55 + sin(i * 1.3 + tx * 0.5) * 0.12 + cos(i * 0.9 + ty * 0.4) * 0.1;
        p = abs(p) - s;
        p = m * p;
        v += exp(-4.0 * abs(p.x)) + exp(-4.0 * abs(p.y));
    }
    return clamp(v * 0.08, 0.0, 1.0);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float tau = 6.28318;
    float tx = sin(ph * tau);
    float ty = cos(ph * tau);
    float breath = sin(ph * tau * 4.0) * 0.14 + sin(ph * tau * 2.0) * 0.08;

    float gs = floor(ph * 6.0);
    float gb = step(0.96, fract(sin(floor(uv.y * 25.0 + gs * 7.3) * 43.7) * 17.3));
    float gd = gb * (fract(sin(gs * 73.1) * 41.3) - 0.5) * 0.14;
    vec2 guv = uv + vec2(gd, 0.0);

    vec2 p = guv * 2.5;
    vec2 q = vec2(fbm(p + vec2(1.3 + tx * 0.55, 0.7 + ty * 0.45)),
                  fbm(p + vec2(5.2 + ty * 0.4, 1.3 + tx * 0.45)));
    vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7 + tx * 0.3, 9.2 + ty * 0.35)),
                  fbm(p + 4.0 * q + vec2(8.3 + ty * 0.3, 2.8 + tx * 0.35)));
    float f = fbm(p + 4.0 * r);

    float lat = ifs(uv * 3.5, tx, ty);
    float dis = sin(ph * tau * 3.0 + length(uv) * 2.5 + f * 4.0) * 0.5 + 0.5;
    dis *= smoothstep(0.15, 0.8, sin(ph * tau * 1.5) * 0.5 + 0.5);
    lat *= dis;

    vec3 dv = vec3(0.02, 0.005, 0.06);
    vec3 ind = vec3(0.22, 0.08, 0.5);
    vec3 indb = vec3(0.4, 0.22, 0.72);
    vec3 amb = vec3(0.92, 0.6, 0.06);
    vec3 ambp = vec3(0.95, 0.82, 0.5);

    float cm = f + breath;
    vec3 col = mix(dv, ind, smoothstep(0.1, 0.35, cm));
    col = mix(col, indb, smoothstep(0.35, 0.6, cm) * smoothstep(0.38, 0.62, q.x));
    col = mix(col, amb, smoothstep(0.3, 0.55, cm) * smoothstep(0.4, 0.65, q.y) * 0.8);
    col = mix(col, ambp, smoothstep(0.8, 0.95, cm));

    col += lat * mix(indb * 1.3, amb * 1.1, dis) * 0.5;

    if(gb > 0.5) {
        float gi = fract(sin(gs * 31.7) * 73.1);
        col = mix(col, vec3(col.b * 1.2, col.r * 0.9, col.g * 1.1) + amb * 0.08, gi * 0.55);
    }

    float ca = 0.004 + gb * 0.015;
    col.r *= 1.0 + ca * sin(f * 11.0) * 3.0;
    col.b *= 1.0 - ca * cos(f * 9.0) * 3.0;

    col *= smoothstep(-0.12, 0.5, 1.0 - length(uv) * (0.6 + breath * 0.2));
    col *= 0.93 + 0.07 * sin(ph * tau * 5.0 + length(uv) * 4.0);
    col *= 0.97 + 0.03 * sin(gl_FragCoord.y * 2.0);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 58;
    Tone.Transport.bpm.value = bpm;
    const barLen = 60 / bpm * 4;

    const hall = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).toDestination();
    await hall.generate();
    const warmLP = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 0.8 }).connect(hall);
    const shimmer = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.45, wet: 0.35 }).connect(hall);

    const hum = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 3.0, decay: 1.0, sustain: 0.7, release: 4.0 }
    }).connect(warmLP);
    hum.volume.value = -14;

    const humNotes = ["A1", "E1", "D1", "A1"];
    let humIdx = 0;
    const humLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        const vel = bar >= 14 ? 0.3 : 0.5;
        hum.triggerAttackRelease(humNotes[humIdx % humNotes.length], "2m", time, vel);
        humIdx++;
    }, "2m").start(0);

    const padChorus = new Tone.Chorus({ frequency: 0.12, delayTime: 4.5, depth: 0.55, wet: 0.3 }).connect(hall);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.45, release: 3.0 }
    }).connect(padChorus);
    pad.volume.value = -16;

    const chords = [
        ["A3", "C4", "E4"], ["D3", "F3", "A3"],
        ["F3", "A3", "C4"], ["E3", "G3", "B3"],
        ["A3", "C4", "E4"], ["F3", "A3", "C4"],
        ["G3", "B3", "D4"], ["E3", "G3", "B3"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        let vel = 0.2;
        if (bar >= 4 && bar < 12) vel = 0.28;
        if (bar >= 14) vel = 0.12;
        pad.triggerAttackRelease(chords[chordIdx % chords.length], "1m", time, vel);
        chordIdx++;
    }, "1m").start(0);

    const bell = new Tone.FMSynth({
        harmonicity: 3.2, modulationIndex: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.02, decay: 3.0, sustain: 0.0, release: 1.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.15, decay: 2.0, sustain: 0.0, release: 1.0 }
    }).connect(shimmer);
    bell.volume.value = -18;

    const bellPool = ["E5", "C5", "A4", "G4", "D5", "F4", "B4", "E4", "A5"];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        let prob = 0.15;
        if (bar >= 3 && bar < 10) prob = 0.35;
        if (bar >= 10 && bar < 14) prob = 0.25;
        if (bar >= 14) prob = 0.08;
        if (Math.random() < prob) {
            bell.triggerAttackRelease(bellPool[bellIdx % bellPool.length], "2n", time, 0.25 + Math.random() * 0.15);
            bellIdx++;
        }
    }, "2n").start(0);

    const breathBP = new Tone.Filter({ type: "bandpass", frequency: 350, Q: 0.6 }).connect(hall);
    const breathNoise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 2.0, decay: 0.5, sustain: 0.25, release: 2.5 }
    }).connect(breathBP);
    breathNoise.volume.value = -26;

    const breathLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 14) {
            breathNoise.triggerAttackRelease("2m", time, 0.25);
            breathBP.frequency.setValueAtTime(250, time);
            breathBP.frequency.linearRampToValueAtTime(550, time + barLen);
            breathBP.frequency.linearRampToValueAtTime(250, time + barLen * 2);
        }
    }, "2m").start(0);

    const glitchHP = new Tone.Filter({ type: "highpass", frequency: 2500 }).connect(shimmer);
    const glitch = new Tone.MetalSynth({
        frequency: 600,
        envelope: { attack: 0.001, decay: 0.035, release: 0.01 },
        harmonicity: 10, modulationIndex: 35, resonance: 4500
    }).connect(glitchHP);
    glitch.volume.value = -30;

    const glitchLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 2 && bar < 13 && Math.random() < 0.1) {
            glitch.triggerAttackRelease("32n", time, 0.12 + Math.random() * 0.08);
        }
    }, "4n").start(0);

    const subLP = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 2.0 }).connect(warmLP);
    const sub = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 4.0, decay: 2.0, sustain: 0.5, release: 5.0 }
    }).connect(subLP);
    sub.volume.value = -18;

    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 14) {
            sub.triggerAttackRelease("A0", "4m", time, 0.3);
        }
    }, "4m").start(0);

    window.toneJsInstruments = { hum, pad, bell, breathNoise, glitch, sub };
    window.toneJsParts = { humLoop, padLoop, bellLoop, breathLoop, glitchLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
