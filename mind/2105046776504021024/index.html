</head><body><canvas id="canvas" width="900" height="900" aria-label="What the Pencil Forgot: a pencil void cat on a moonlit sill, flooded by watercolour wherever the song forgets a note"></canvas><script>
// DURATION: 32
// A void cat hums a four-note song to the moon. Each time a note fails to come,
// the forgotten note soaks into the paper as colour: moon, cat, window, sky.
// In the last bar the pencil remembers, redraws the room, and the colour dries away.
// Pigment is a wet-front simulation replayed from step 0 on any backward seek, so
// renderFrame(t) is a pure function of t in every seek order.
(() => {
const DURATION = 32, SIZE = 900, SIM = 450, STEPS_PER_SEC = 30;
// One score for picture and sound: 60 BPM, one bar = 4 s, the motif drops notes.
const MOTIF = [
  ['d5', 'a4', 'f4', 'c5'], ['d5', 'a4', 'f4', 'c5'],
  ['d5', 'a4', null, 'c5'], ['d5', 'a4', null, 'c5'],
  ['d5', null, null, 'c5'], ['d5', null, null, null],
  ['d5', null, null, null], [null, null, null, null]
];
const PLAYED = [];
MOTIF.forEach((bar, b) => bar.forEach((n, k) => { if (n) PLAYED.push(b * 4 + k); }));
// First absences, in the order the song loses them; each one floods a region.
const cues = [
  { t: 10, region: 'moon', note: 'f4' },
  { t: 17, region: 'cat', note: 'a4' },
  { t: 23, region: 'window', note: 'c5' },
  { t: 23.25, region: 'sky', note: 'c5' },
  { t: 28, region: 'recall', note: 'shimmer' }
];
const ON = [10, 17, 23, 23.25], RECALL = 28;
window.cues = cues;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const wrap = t => ((t % DURATION) + DURATION) % DURATION;
function prng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------- pencil drawing
// Canvas y is down. Graphite lives in R of the line texture.
const CAT = { x: 452, y: 708 };
function drawLines() {
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, SIZE, SIZE);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const r = prng(90210);
  const stroke = (pts, w = 2.4, v = 235, passes = 2, wob = 1.6) => {
    for (let p = 0; p < passes; p++) {
      g.strokeStyle = `rgb(${v},0,0)`; g.globalAlpha = p ? 0.55 : 0.9;
      g.lineWidth = w * (p ? 0.6 : 1) * (0.85 + 0.3 * r());
      g.beginPath();
      const q = pts.map(([x, y]) => [x + (r() - 0.5) * wob, y + (r() - 0.5) * wob]);
      g.moveTo(q[0][0], q[0][1]);
      for (let i = 1; i < q.length - 1; i++) g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
      g.lineTo(q[q.length - 1][0], q[q.length - 1][1]);

      stroke([[cx - dx * L, cy - dy * L], [cx + dx * L, cy + dy * L]], w, v, 1, 0.8);
    }
    g.restore();
  };
  // arched window: outer frame, inner frame, mullions
  const win = (inset) => [[150 + inset, 700], ...arc(450, 330, 300 - inset, 250 - inset, Math.PI, 2 * Math.PI, 36), [750 - inset, 700]];
  stroke(win(0), 3.2, 240, 2, 2.2);
  stroke(win(26), 2.4, 225, 2, 1.8);
  stroke([[450, 106], [450, 700]], 2.2, 215);
  stroke([[176, 430], [724, 430]], 2.2, 215);
  // wall hatching outside the frame
  hatch(() => { g.rect(0, 0, SIZE, 700); const w = win(0); g.moveTo(w[0][0], w[0][1]); w.forEach(([x, y]) => g.lineTo(x, y)); g.closePath(); }, 0, 0, SIZE, 700, 13, -0.9, 88, 1.1);
  // sill
  stroke([[108, 700], [792, 700]], 3.0, 240, 2, 1.6);
  stroke([[96, 742], [804, 742]], 2.8, 235, 2, 1.6);
  stroke([[108, 700], [96, 742]], 2.2, 220); stroke([[792, 700], [804, 742]], 2.2, 220);
  hatch(() => g.rect(96, 742, 708, 60), 96, 742, 804, 800, 9, -0.5, 110, 1.3);
  // crescent moon in the upper-right pane
  stroke(arc(590, 262, 64, 64, -2.1, 2.1, 30), 2.6, 235);
  stroke(arc(612, 262, 50, 58, -1.85, 1.85, 26), 1.8, 200);
  // stars: small pencil crosses
  for (const [x, y, s] of [[262, 214, 9], [338, 300, 6], [240, 380, 7], [520, 176, 6], [668, 380, 8], [300, 520, 5], [620, 520, 6], [690, 470, 4]]) {
    stroke([[x - s, y], [x + s, y]], 1.4, 190, 1, 0.6); stroke([[x, y - s], [x, y + s]], 1.4, 190, 1, 0.6);
  }
  // the void cat, sitting on the sill, facing us
  const { x, y } = CAT;
  const body = [[x - 78, y], [x - 92, y - 40], [x - 84, y - 96], [x - 58, y - 138], [x - 30, y - 150], [x + 30, y - 150], [x + 58, y - 138], [x + 84, y - 96], [x + 92, y - 40], [x + 78, y]];
  stroke(body, 2.8, 240, 2, 1.8);
  const head = arc(x, y - 190, 64, 54, 0, Math.PI * 2, 40);
  stroke(head, 2.6, 240, 2, 1.6);
  stroke([[x - 54, y - 214], [x - 58, y - 270], [x - 20, y - 240]], 2.6, 240);
  stroke([[x + 54, y - 214], [x + 58, y - 270], [x + 20, y - 240]], 2.6, 240);
  stroke([[x - 44, y - 222], [x - 46, y - 254], [x - 28, y - 236]], 1.4, 170, 1);
  stroke([[x + 44, y - 222], [x + 46, y - 254], [x + 28, y - 236]], 1.4, 170, 1);
  for (const s of [-1, 1]) {
    stroke(arc(x + s * 24, y - 196, 13, 7, 0, Math.PI * 2, 18), 1.8, 230, 1);
    stroke([[x + s * 24, y - 203], [x + s * 24, y - 189]], 2.2, 240, 1, 0.4);
    stroke([[x + s * 12, y - 176], [x + s * 70, y - 182]], 1.1, 170, 1, 0.8);
    stroke([[x + s * 12, y - 171], [x + s * 68, y - 166]], 1.1, 170, 1, 0.8);
  }
  stroke([[x - 6, y - 180], [x + 6, y - 180], [x, y - 173], [x - 6, y - 180]], 1.6, 220, 1, 0.4);
  stroke([[x - 30, y], [x - 28, y - 30]], 1.8, 200); stroke([[x + 30, y], [x + 28, y - 30]], 1.8, 200);
  // tail curling over the sill edge
  stroke([[x + 78, y - 6], [x + 120, y + 4], [x + 150, y + 30], [x + 140, y + 70], [x + 112, y + 82]], 5.0, 225, 2, 1.6);
  // shadow-side hatching on the cat
  hatch(() => { g.moveTo(body[5][0], body[5][1]); body.slice(5).forEach(([a, b]) => g.lineTo(a, b)); g.lineTo(x + 20, y); g.closePath(); }, x, y - 150, x + 92, y, 8, 0.85, 120, 1.1);
  return c;
}

// Region masks at sim resolution: R moon, G cat, B window + sill. Sky is analytic.
function drawMask() {
  const c = document.createElement('canvas'); c.width = c.height = SIM;
  const g = c.getContext('2d'); g.scale(SIM / SIZE, SIM / SIZE);
  g.fillStyle = '#000'; g.fillRect(0, 0, SIZE, SIZE);
  g.globalCompositeOperation = 'lighter'; g.lineJoin = g.lineCap = 'round';
  g.fillStyle = '#ff0000'; g.beginPath(); g.arc(590, 262, 70, 0, Math.PI * 2); g.fill();
  const { x, y } = CAT;
  g.fillStyle = '#00ff00'; g.beginPath(); g.ellipse(x, y - 76, 94, 82, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(x, y - 190, 68, 58, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(x - 58, y - 214); g.lineTo(x - 60, y - 276); g.lineTo(x - 16, y - 240); g.fill();
  g.beginPath(); g.moveTo(x + 58, y - 214); g.lineTo(x + 60, y - 276); g.lineTo(x + 16, y - 240); g.fill();
  g.strokeStyle = '#00ff00'; g.lineWidth = 16; g.beginPath(); g.moveTo(x + 78, y - 6); g.quadraticCurveTo(x + 160, y + 10, x + 112, y + 82); g.stroke();
  g.strokeStyle = g.fillStyle = '#0000ff'; g.lineWidth = 34;
  g.beginPath(); g.moveTo(163, 700); g.ellipse(450, 330, 287, 237, 0, Math.PI, 2 * Math.PI); g.lineTo(737, 700); g.stroke();
  g.lineWidth = 12; g.beginPath(); g.moveTo(450, 110); g.lineTo(450, 700); g.moveTo(176, 430); g.lineTo(724, 430); g.stroke();
  g.fillRect(96, 698, 708, 104);
  return c;
}

// ---------------------------------------------------------------- WebGL
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
const VERT = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
const NOISE = `
  float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
  float skyMask(vec2 uv){ vec2 q = vec2(uv.x * 900.0, (1.0 - uv.y) * 900.0);
    float rect = step(176.0, q.x) * step(q.x, 724.0) * step(330.0, q.y) * step(q.y, 700.0);
    vec2 e = (q - vec2(450.0, 330.0)) / vec2(274.0, 224.0);
    float archm = step(dot(e, e), 1.0) * step(q.y, 330.0);
    return max(rect, archm); }
`;
const SIM_FRAG = `precision highp float; varying vec2 vUv;
  uniform sampler2D uPrev, uMask; uniform vec2 uTexel; uniform float uAngle; uniform vec4 uGate, uK;
  uniform vec2 uSrc0, uSrc1, uSrc2, uSrc3;
  ${NOISE}
  void main(){
    float thirst = mix(0.5, 1.9, smoothstep(0.3, 0.72, fbm(vUv * 7.0 + 3.1)));
    vec4 f = texture2D(uPrev, vUv);
    for (int i = 0; i < 8; i++){
      float a = uAngle + float(i) * 0.7853982; vec2 d = vec2(cos(a), sin(a));
      vec4 run = 1.0 - vec4(0.10, 0.25, 0.20, 0.10) * d.y;   // fed from above: paint runs down
      vec4 nb = texture2D(uPrev, vUv + d * uTexel * 1.5);
      f = max(f, nb * exp(-uK * 1.5 * thirst * run));
    }
    vec3 m = texture2D(uMask, vUv).rgb;
    vec4 region = vec4(m.r, m.g, m.b * (1.0 - m.g), skyMask(vUv) * (1.0 - m.g) * (1.0 - 0.7 * m.r));
    vec4 dist = vec4(length(vUv - uSrc0), length(vUv - uSrc1), length(vUv - uSrc2), length(vUv - uSrc3));
    vec4 gate = step(0.0, uGate) * (1.0 - smoothstep(uGate - 0.03, uGate, dist));
    float wet = 0.35 + 0.65 * smoothstep(0.3, 0.7, fbm(vUv * 13.0 + 8.0));

  }`;
const COMP_FRAG = `precision highp float; varying vec2 vUv;
  uniform sampler2D uState, uLines; uniform vec2 uTexel;
  uniform vec4 uAmt, uWet; uniform float uRecall, uPulse, uGlow;
  ${NOISE}
  const vec3 PAPER = vec3(0.955, 0.93, 0.875);
  vec3 ab(vec3 c){ return max(-log(c / PAPER), 0.0); }
  float bloom(float f, float thr, float n, float grain){
    float body = smoothstep(thr - 0.018, thr + 0.018, f);
    float pool = body * exp(-max(f - thr, 0.0) / 0.07);           // pigment settles at the drying edge
    float lobe = smoothstep(0.62, 0.63, n);                        // back-run: a pale lobe with a dark rim
    float rim = lobe * (1.0 - smoothstep(0.63, 0.66, n));
    float d = 0.42 + 0.38 * fbm(vUv * 5.0 + f) + 1.0 * pool;
    d = d * (1.0 - 0.38 * lobe) + rim * 0.55;
    return body * d * mix(1.3, 0.72, grain);
  }
  void main(){
    vec2 uv = vUv;
    float tooth = fbm(uv * 180.0), mottle = fbm(uv * 3.0 + 11.0);
    vec3 paper = PAPER * (1.0 + (tooth - 0.5) * 0.06 + (mottle - 0.5) * 0.05);
    vec4 f = texture2D(uState, uv);
    vec4 gx = texture2D(uState, uv + vec2(uTexel.x, 0.0)) - texture2D(uState, uv - vec2(uTexel.x, 0.0));
    vec4 gy = texture2D(uState, uv + vec2(0.0, uTexel.y)) - texture2D(uState, uv - vec2(0.0, uTexel.y));
    float edgeN = fbm(uv * 24.0) - 0.5, backN = fbm(uv * 4.3 + 2.0);

    float order = 0.34 + clamp(length((uv - vec2(0.5, 0.36)) * vec2(1.0, 1.1)) * 1.1 + edgeN * 0.18, 0.0, 0.96);
    float sweep = uRecall * 1.45;              // order sits in 0.34..1.3, so nothing dries before the recall
    float dry = smoothstep(order - 0.3, order, sweep);
    float gone = 1.0 - smoothstep(order - 0.1, order + 0.02, sweep);
    vec4 thr = vec4(0.3, 0.32, 0.3, 0.28) + edgeN * 0.12 + dry * 0.6;
    vec4 d = vec4(bloom(f.r, thr.r, backN, tooth), bloom(f.g, thr.g, backN, tooth), bloom(f.b, thr.b, backN, tooth), bloom(f.a, thr.a, backN, tooth));
    d *= uAmt * (1.0 + 0.25 * uWet) * gone;

    vec2 cell = floor(uv * 90.0); vec2 fr = fract(uv * 90.0);

    float star = step(0.93, h21(cell)) * (1.0 - smoothstep(0.08, 0.2, length(fr - sc)));
    d.g *= 1.0 - star;
    float vary = fbm(uv * 2.4 + 5.0);
    vec3 moonP = mix(vec3(0.94, 0.72, 0.22), vec3(0.95, 0.48, 0.36), smoothstep(0.35, 0.7, vary));
    vec3 catP  = mix(vec3(0.20, 0.26, 0.78), vec3(0.38, 0.20, 0.60), smoothstep(0.3, 0.7, vary));
    vec3 winP  = mix(vec3(0.10, 0.52, 0.54), vec3(0.74, 0.40, 0.26), smoothstep(0.765, 0.775, 1.0 - uv.y));
    float sr = length((uv - vec2(0.655, 0.71)) * vec2(1.0, 1.05));
    vec3 skyP  = mix(vec3(0.93, 0.62, 0.52), vec3(0.62, 0.36, 0.66), smoothstep(0.08, 0.26, sr));
    skyP = mix(skyP, vec3(0.20, 0.20, 0.50), smoothstep(0.22, 0.5, sr));
    vec3 A = ab(moonP) * d.r + ab(catP) * d.g + ab(winP) * d.b + ab(skyP) * d.a * 0.55;
    vec3 col = paper * exp(-A);                                     // Beer-Lambert: washes glaze, never cover
    // wet sheen on fresh pigment

    float spec = pow(max(dot(normalize(vec3(-grad * 18.0, 1.0)), normalize(vec3(0.5, 0.6, 0.8))), 0.0), 30.0);

    float line = texture2D(uLines, uv).r * mix(0.55, 1.0, smoothstep(0.25, 0.7, tooth));
    vec3 lead = vec3(0.22, 0.21, 0.22);
    col = mix(col, lead, clamp(line * (1.0 - 0.62 * ghost) * (1.0 + 0.3 * uPulse), 0.0, 1.0) * 0.88);
    float band = smoothstep(0.0, 0.03, sweep - order) * (1.0 - smoothstep(0.03, 0.12, sweep - order)) * step(sweep, 1.44);
    col = mix(col, vec3(0.98, 0.76, 0.34), clamp(line * band * 1.5, 0.0, 1.0) * 0.8);
    // moonlight at the climax
    float mg = exp(-length(uv - vec2(0.655, 0.71)) * 6.0) * uGlow;
    col = 1.0 - (1.0 - col) * (1.0 - vec3(1.0, 0.86, 0.6) * mg * 0.5);
    vec2 q = uv - 0.5; col *= 1.0 - smoothstep(0.42, 0.85, length(q)) * 0.22;
    col += (h21(gl_FragCoord.xy + 0.5) - 0.5) / 255.0;
    gl_FragColor = vec4(col, 1.0);
  }`;
function program(fs) {
  const p = gl.createProgram();

    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));

}

const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const simP = program(SIM_FRAG), compP = program(COMP_FRAG);

const rts = [0, 1].map(() => { const t = texture(SIM, SIM); const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, fb }; });
let cur = 0, done = -1;
const SRC = [[590, 262], [CAT.x, CAT.y - 110], [300, 720], [590, 300]].map(([x, y]) => [x / SIZE, 1 - y / SIZE]);
const REACH = [0.2, 0.34, 0.9, 0.95], FLOOD = [1.6, 2.2, 2.6, 3.4];
function clearSim() {

function step(n) {

<script id="clawed-strudel-bootstrap" type="module">
(async () => {
  window.strudelState = 'loading';
  window.strudelError = null;
  try {
    const CONFIG = JSON.parse("{\"code\":\"// BPM: 60\\n// DURATION: 32\\n// FORM: remembered 0-2; forgetting 2-6; held breath 6-7; recall 7-8\\n// TONAL CENTER: D minor\\n// MOTIF: d5 a4 f4 c5\\n// HARMONIC PLAN: tonic, submediant, subdominant, silence, dominant back into tonic\\n// PHRASE RULE: the motif loses one note at a time; each lost note returns an octave down as a slow swell while its colour floods the picture\\nsetcps(60 / 240)\\n$: note(\\\"\u003c[d5 a4 f4 c5] [d5 a4 f4 c5] [d5 a4 ~ c5] [d5 a4 ~ c5] [d5 ~ ~ c5] [d5 ~ ~ ~] d5 ~>\\\").s(\\\"triangle\\\").gain(0.2).attack(0.005).decay(0.6).sustain(0.18).release(1.8).lpf(2600).room(0.6).orbit(0)\\n$: note(\\\"\u003cd2 d2 bb1 bb1 g1 g1 ~ a1>\\\").s(\\\"sine\\\").gain(0.22).attack(0.08).release(1.6).lpf(420).orbit(1)\\n$: note(\\\"\u003c[d3,f3,a3] [d3,f3,a3] [bb2,d3,f3] [bb2,d3,f3] [g2,bb2,d3] [g2,bb2,d3] ~ [a2,cs3,e3]>\\\").s(\\\"sawtooth\\\").gain(0.05).lpf(680).attack(1.0).release(2.6).room(0.8).orbit(2)\\n$: note(\\\"\u003c~ ~ [~ ~ f3 ~] ~ [~ a3 ~ ~] [~ ~ ~ c4] ~ ~>\\\").s(\\\"sine\\\").gain(0.15).attack(0.7).release(3).room(0.9).orbit(3)\\n$: note(\\\"\u003c~ ~ ~ ~ ~ ~ ~ [a5 d6 f6 a6]>\\\").s(\\\"sine\\\").gain(0.07).attack(0.25).release(2.2).room(0.9).orbit(4)\\n\",\"bpm\":60,\"durationSec\":32,\"renderDurationSec\":32,\"cps\":0.25,\"cycles\":8,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    let inited = false;
    async function ensureInit() {
      if (inited) return;
      await S.initStrudel({ autoplay: false });
      await S.evaluate(CONFIG.code, false);
      inited = true;
      await buildTimeline();
      console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);

    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        S.DEFAULT_MAX_POLYPHONY,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
