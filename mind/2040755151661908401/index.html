<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
float h1(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}

float n2(vec2 p){
    vec2 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    return mix(mix(h1(i),h1(i+vec2(1.0,0.0)),f.x),mix(h1(i+vec2(0.0,1.0)),h1(i+vec2(1.0,1.0)),f.x),f.y);
}

float fbm(vec2 p){return 0.5*n2(p)+0.25*n2(p*2.0)+0.125*n2(p*4.0);}

vec2 nAt(vec2 c,float off,float t){
    vec2 jt=h2(c+off);
    return c+0.5+0.35*sin(jt*6.2832+t*0.1*(0.5+jt.x));
}

float pls(vec2 np,float sc,float t){
    float dist=length(np/sc),p=0.0;
    for(float k=0.0;k<5.0;k++){
        float el=mod(t-k*12.0,60.0);
        float dt=el-dist/(0.22+0.04*k);
        if(dt>0.0&&dt<5.0) p+=max(sin(dt*1.1)*exp(-dt*0.5),0.0)*(0.35+0.65*abs(sin(k*3.7)));
    }
    return clamp(p,0.0,1.5);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);

    vec3 col=vec3(0.01,0.005,0.035)+vec3(0.015,0.008,0.04)*fbm(uv*1.5+t*0.01);

    vec2 w=vec2(fbm(uv*3.0+t*0.015),fbm(uv*3.0+vec2(5.2,1.3)+t*0.012));
    vec2 wu=uv+w*0.08;

    vec3 tl=vec3(0.06,0.78,0.62),ph=vec3(0.2,0.95,0.85);
    vec3 ig=vec3(0.12,0.06,0.35),am=vec3(1.0,0.65,0.15);

    float sc=5.0;
    vec2 sp=wu*sc,ip=floor(sp);
    float md=100.0;
    vec2 cn=vec2(0.0),cc=vec2(0.0);

    for(float i=-2.0;i<=2.0;i++)
        for(float j=-2.0;j<=2.0;j++){
            vec2 c=ip+vec2(i,j);
            vec2 np=nAt(c,0.0,t);
            float d=length(sp-np);
            if(d<md){md=d;cn=np;cc=c;}
        }

    float mp=pls(cn,sc,t);
    float pg=0.0,pp=0.0;

    for(float i=-1.0;i<=1.0;i++)
        for(float j=-1.0;j<=1.0;j++){
            if(i==0.0&&j==0.0) continue;
            vec2 nc=cc+vec2(i,j);
            vec2 lo=min(cc,nc),hi=max(cc,nc);
            if(h1(lo*17.3+hi*31.7)>0.55) continue;
            vec2 nn=nAt(nc,0.0,t);
            vec2 pa=sp-cn,ba=nn-cn;
            float lt=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
            float sd=length(pa-ba*lt);
            float np2=pls(nn,sc,t);
            float ep=mix(mp,np2,lt);
            float g=exp(-sd*sd*80.0);
            pg+=g; pp+=g*ep;
        }

    float bs=1.0+mp*0.4;
    float ng=exp(-md*md*(12.0/bs));
    float bloom=exp(-md*md*2.0)*mp*0.25;
    vec3 nc=mix(ig,tl,smoothstep(0.0,0.4,mp));
    nc=mix(nc,ph,smoothstep(0.6,1.3,mp));
    col+=nc*ng*(0.08+mp*0.92)*2.0;
    col+=tl*bloom;

    float avgP=pp/max(pg,0.001);
    vec3 pc=mix(ig*0.4,tl*0.5,smoothstep(0.0,0.3,avgP));
    col+=pc*pg*(0.05+avgP*0.4);
    col+=am*smoothstep(2.0,4.0,pg)*smoothstep(0.5,1.0,mp)*0.4;

    float sc2=11.0;
    vec2 sp2=wu*sc2,ip2=floor(sp2);
    float d1=100.0,d2=100.0;
    vec2 cn2=vec2(0.0),cc2=vec2(0.0);

    for(float i=-2.0;i<=2.0;i++)
        for(float j=-2.0;j<=2.0;j++){
            vec2 c=ip2+vec2(i,j);
            vec2 np=nAt(c,200.0,t*0.7);
            float d=length(sp2-np);
            if(d<d1){d2=d1;d1=d;cn2=np;cc2=c;}
            else if(d<d2) d2=d;
        }

    float e2=1.0-smoothstep(0.0,0.04,d2-d1);
    float p2=pls(cn2,sc2,t*1.1+3.0);
    float ng2=exp(-d1*d1*20.0);
    vec3 nc2=mix(ig*0.3,tl*0.5,smoothstep(0.0,0.3,p2));
    col+=nc2*ng2*(0.03+p2*0.3);
    col+=tl*0.12*e2*(0.02+p2*0.2);

    col*=smoothstep(0.0,0.35,1.0-length(uv)*0.4);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 66;
  Tone.Transport.bpm.value = bpm;
  const barLen = 4 * (60 / bpm);

  const padRev = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await padRev.generate();
  const padFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.8 }).connect(padRev);
  const padChor = new Tone.Chorus({ frequency: 0.08, delayTime: 4.0, depth: 0.6, wet: 0.3 }).connect(padFilt);
  padChor.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.7, release: 3.0 }
  }).connect(padChor);
  pad.volume.value = -12;

  const breathe = new Tone.Loop((time) => {
    padFilt.frequency.linearRampToValueAtTime(1200, time + barLen * 2);
    padFilt.frequency.linearRampToValueAtTime(400, time + barLen * 4);
  }, "4m").start(0);

  const chords = [
    ["D3", "A3", "F4"],
    ["A2", "E3", "C4"],
    ["F3", "A3", "C4"],
    ["G3", "Bb3", "D4"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const vel = bar >= 14 ? 0.15 : 0.2;
    const chord = bar >= 14 ? chords[0] : chords[ci % chords.length];
    pad.triggerAttackRelease(chord, "2m", time, vel);
    ci++;
  }, "2m").start(0);

  const synRev = new Tone.Reverb({ decay: 3.0, wet: 0.5 }).toDestination();
  await synRev.generate();
  const synDel = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.25, wet: 0.3 }).connect(synRev);

  const synapse = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.8, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.3 }
  }).connect(synDel);
  synapse.volume.value = -18;

  const synNotes = ["A4", "D5", "F5", "E5", "C5", "A5", "D4", "G4"];
  const synLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 15) return;
    const prob = bar < 4 ? 0.15 : bar < 12 ? 0.35 : 0.12;
    if (Math.random() < prob) {
      const note = synNotes[Math.floor(Math.random() * synNotes.length)];
      synapse.triggerAttackRelease(note, "8n", time, 0.25 + Math.random() * 0.25);
    }
  }, "8n").start(0);

  const bellRev = new Tone.Reverb({ decay: 5.0, wet: 0.6 }).toDestination();
  await bellRev.generate();

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.0 },
    modulation: { type: "triangle" }
  }).connect(bellRev);
  bell.volume.value = -20;

  const bellNotes = ["D6", "A5", "F6", "C6"];
  let bi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 13) return;
    if (Math.random() < 0.3) {
      bell.triggerAttackRelease(bellNotes[bi % bellNotes.length], "4n", time, 0.18 + Math.random() * 0.15);
      bi++;
    }
  }, "2n").start(0);

  const subFilt = new Tone.Filter({ type: "lowpass", frequency: 80 }).toDestination();
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.4, release: 1.5 }
  }).connect(subFilt);
  sub.volume.value = -10;

  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 14) {
      sub.triggerAttackRelease("D1", "1m", time, 0.25);
    }
  }, "1m").start(0);

  const cascRev = new Tone.Reverb({ decay: 3.0, wet: 0.5 }).toDestination();
  await cascRev.generate();
  const casc = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(cascRev);
  casc.volume.value = -22;

  const cascNotes = ["A5", "F5", "D5", "A4", "F4"];
  const cascLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 14) return;
    for (let i = 0; i < cascNotes.length; i++) {
      casc.triggerAttackRelease(cascNotes[i], "32n", time + i * 0.08, 0.12 - i * 0.015);
    }
  }, "4m").start("3:0:0");

  const whFilt = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 2 }).connect(synRev);
  const whisper = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.2, release: 2.0 }
  }).connect(whFilt);
  whisper.volume.value = -30;

  const whLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 13 && Math.random() < 0.2) {
      whFilt.frequency.value = 1000 + Math.random() * 3000;
      whisper.triggerAttackRelease("2n", time, 0.08);
    }
  }, "2n").start(0);

  window.toneJsInstruments = { pad, synapse, bell, sub, casc, whisper };
  window.toneJsParts = { breathe, padLoop, synLoop, bellLoop, subLoop, cascLoop, whLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
