<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,45.0),ph=t/45.0;
    float cv=pow(sin(ph*12.566)*0.5+0.5,2.5),sp=1.0-cv;
    float hb=pow(max(sin(t*5.0),0.0),12.0)*cv;
    vec3 col=vec3(0.008,0.003,0.018);
    for(float i=0.0;i<56.0;i++){
        float s=t-i*0.045;
        float sph=mod(s,45.0)/45.0;
        float sc=pow(sin(sph*12.566)*0.5+0.5,2.5),ss=1.0-sc;
        float f=exp(-i*0.05),sz=0.006+hb*0.004;
        vec2 p1=vec2(cos(s*0.85),sin(s*0.85))*(0.05+ss*0.42);
        vec2 p2=vec2(sin(s*2.1+2.3)*0.85+cos(s*3.7)*0.15,cos(s*1.6+0.9)*0.75+sin(s*3.2)*0.18)*(0.04+ss*0.35);
        float rs=s-1.4;
        vec2 p3=vec2(-cos(rs*0.85)*0.85+sin(rs*0.3)*0.12,-sin(rs*0.85)*0.85+cos(rs*0.45)*0.1)*(0.05+ss*0.42);
        float d1=length(uv-p1),d2=length(uv-p2),d3=length(uv-p3);
        col+=mix(vec3(0.1,0.4,0.95),vec3(0.95,0.2,0.12),sc)*sz/(d1*d1+0.00004)*f*0.00032;
        col+=mix(vec3(0.1,0.75,0.9),vec3(1.0,0.45,0.08),sc)*sz/(d2*d2+0.00004)*f*0.00038;
        col+=mix(vec3(0.4,0.12,0.9),vec3(0.75,0.15,0.55),sc)*sz/(d3*d3+0.00004)*f*0.00032;
    }
    for(float i=0.0;i<120.0;i++){
        float id=i+500.0;
        float pt=mod(t+h(vec2(id,7.0))*45.0,45.0);
        float pc=pow(sin(pt/45.0*12.566)*0.5+0.5,2.5),ps=1.0-pc;
        vec2 j=(vec2(h(vec2(id,1.0)),h(vec2(id,2.0)))-0.5)*0.07;
        vec2 pp;vec3 c;
        float th=mod(i,3.0);
        if(th<1.0){
            pp=vec2(cos(pt*0.85),sin(pt*0.85))*(0.05+ps*0.42)+j;
            c=mix(vec3(0.2,0.5,1.0),vec3(1.0,0.3,0.18),pc);
        }else if(th<2.0){
            pp=vec2(sin(pt*2.1+2.3)*0.85+cos(pt*3.7)*0.15,cos(pt*1.6+0.9)*0.75+sin(pt*3.2)*0.18)*(0.04+ps*0.35)+j*1.2;
            c=mix(vec3(0.15,0.8,0.95),vec3(1.0,0.5,0.1),pc);
        }else{
            float rs=pt-1.4;
            pp=vec2(-cos(rs*0.85)*0.85+sin(rs*0.3)*0.12,-sin(rs*0.85)*0.85+cos(rs*0.45)*0.1)*(0.05+ps*0.42)+j;
            c=mix(vec3(0.5,0.2,1.0),vec3(0.85,0.2,0.6),pc);
        }
        float d=length(uv-pp);
        col+=c*0.0018/(d+0.004)*(0.3+0.7*h(vec2(id,3.0)));
    }
    float cd=length(uv);
    float pulse=cv*(0.5+hb);
    col+=mix(vec3(0.35,0.6,1.0),vec3(1.0,0.4,0.25),cv)*pulse*0.02/(cd*cd+0.002);
    float gt=h(vec2(floor(t*3.0),0.0));
    if(gt>0.82){
        vec2 off=vec2((h(vec2(floor(t*5.0),1.0))-0.5)*0.2,0.0);
        vec2 gp=vec2(cos(t*0.85),sin(t*0.85))*(0.05+sp*0.42);
        col+=vec3(0.5,0.85,1.0)*0.01/(length(uv+off-gp)+0.005);
    }
    col.r*=1.0+cv*0.12*abs(uv.x);
    col.b*=1.0+cv*0.08*abs(uv.x);
    col*=1.0-0.5*dot(uv,uv);
    col=col/(1.0+col);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 65;
  Tone.Transport.bpm.value = bpm;
  const barDur = 4 * (60 / bpm);

  const rev = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
  await rev.generate();
  const echo = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.38, wet: 0.22 }).connect(rev);
  const lp = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.7 }).connect(rev);

  const pulse = new Tone.MembraneSynth({
    pitchDecay: 0.06, octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 0.35, sustain: 0, release: 0.15 }
  }).connect(lp);

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.04, decay: 0.5, sustain: 0.1, release: 0.4 }
  }).connect(lp);

  const bell = new Tone.FMSynth({
    harmonicity: 2.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.0, sustain: 0, release: 0.6 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.4 }
  }).connect(echo);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.0, decay: 0.6, sustain: 0.4, release: 2.0 }
  }).connect(rev);

  const glitch = new Tone.MetalSynth({
    frequency: 250,
    envelope: { attack: 0.001, decay: 0.05, release: 0.02 },
    harmonicity: 6, modulationIndex: 24, resonance: 4500
  }).connect(echo);

  let pulseIdx = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barDur);
    pulse.triggerAttackRelease("C1", "4n", time, 0.5);
    const notes = ["C2", "C2", "G1", "C2"];
    sub.triggerAttackRelease(notes[pulseIdx % notes.length], "4n", time, bar < 10 ? 0.25 : 0.15);
    pulseIdx++;
  }, "2n").start(0);

  const coolScale = ["C5", "E5", "G5", "B5", "E5", "C5"];
  const warmScale = ["D5", "F5", "A5", "C6", "F5", "D5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barDur);
    const inConv = (bar >= 2 && bar < 5) || (bar >= 7 && bar < 10);
    if (inConv && Math.random() > 0.3) {
      const scale = bar >= 7 ? warmScale : coolScale;
      const vel = (bar === 3 || bar === 4 || bar === 8 || bar === 9) ? 0.3 : 0.15;
      bell.triggerAttackRelease(scale[bellIdx % scale.length], "8n", time, vel);
    }
    bellIdx++;
  }, "4n").start(0);

  const coolChords = [["C3", "G3", "E4"], ["A2", "E3", "C4"]];
  const warmChords = [["F3", "C4", "A4"], ["D3", "A3", "F4"]];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barDur);
    const inPeak = (bar >= 3 && bar < 5) || (bar >= 8 && bar < 10);
    if (inPeak) {
      const chords = bar >= 8 ? warmChords : coolChords;
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "2n", time, 0.12);
      chordIdx++;
    }
  }, "2n").start(0);

  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barDur);
    const inConv = (bar >= 2 && bar < 5) || (bar >= 7 && bar < 10);
    if (inConv && Math.random() > 0.85) {
      glitch.triggerAttackRelease("32n", time, 0.12);
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    lp.frequency.linearRampToValueAtTime(1800, time + 2 * barDur);
  }, "2:0:0");
  Tone.Transport.schedule((time) => {
    lp.frequency.linearRampToValueAtTime(500, time + 2 * barDur);
  }, "4:0:0");
  Tone.Transport.schedule((time) => {
    lp.frequency.linearRampToValueAtTime(2200, time + 2 * barDur);
  }, "7:0:0");
  Tone.Transport.schedule((time) => {
    lp.frequency.linearRampToValueAtTime(500, time + 2 * barDur);
  }, "9:0:0");

  window.toneJsInstruments = { pulse, sub, bell, pad, glitch };
  window.toneJsParts = { pulseLoop, bellLoop, padLoop, glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
