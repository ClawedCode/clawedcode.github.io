<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){
    v+=a*noise(p);
    p=rot(0.5)*p*2.03;
    a*=0.5;
  }
  return v;
}

float braid(vec2 uv, float phase, float offset, float twist){
  float t = uv.y * 2.0 + phase;
  float wobble = sin(t * 3.14159 + twist) * 0.18;
  float x = uv.x - offset - wobble;
  return exp(-x*x*45.0);
}

float pulse(vec2 uv, vec2 origin, float birth, float now, float life){
  float age = now - birth;
  if(age < 0.0 || age > life) return 0.0;
  float r = age / life;
  float d = length(uv - origin);
  float ring = exp(-pow((d - r*0.95)*14.0, 2.0));
  return ring * (1.0 - r);
}

float glyph(vec2 uv, vec2 origin, float birth, float now, float life, float seed){
  float age = now - birth;
  if(age < 0.2 || age > life*0.7) return 0.0;
  vec2 q = (uv - origin) * 18.0;
  float ang = atan(q.y, q.x);
  float r = length(q);
  float spokes = abs(sin(ang*3.0 + seed*6.28)) + abs(cos(ang*5.0 - seed*3.14));
  float rings = abs(sin(r*2.0 - seed*4.0));
  float g = smoothstep(0.85, 1.0, spokes*0.5 + rings*0.5);
  float window = smoothstep(0.2, 0.4, age/life) * smoothstep(0.7, 0.4, age/life);
  float falloff = exp(-r*0.18);
  return g * window * falloff;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy) / iResolution.y;
  float t = iTime;
  float loopT = mod(t, 60.0);

  vec2 wuv = uv + vec2(fbm(uv*1.4 + t*0.07), fbm(uv*1.4 - t*0.05)) * 0.06;

  float ampB = braid(wuv, t*0.6, -0.22, t*0.9);
  float crmB = braid(wuv, t*0.6 + 2.1, 0.0, t*0.9 + 1.5);
  float cynB = braid(wuv, t*0.6 + 4.2, 0.22, t*0.9 + 3.0);

  vec3 amber = vec3(1.0, 0.62, 0.18);
  vec3 crimson = vec3(0.95, 0.18, 0.28);
  vec3 cyan = vec3(0.32, 0.85, 1.0);

  vec3 col = vec3(0.012, 0.008, 0.02);
  col += amber * ampB * 0.85;
  col += crimson * crmB * 0.85;
  col += cyan * cynB * 0.85;

  float intersect = ampB * crmB + crmB * cynB + ampB * cynB;
  col += vec3(1.0) * intersect * 1.8;

  float pulseAcc = 0.0;
  float glyphAcc = 0.0;
  for(int i=0;i<6;i++){
    float fi = float(i);
    float birth = fi * 2.0 + 0.5;
    float life = 4.5;
    float yPos = -0.7 + mod(fi*0.31 + sin(fi*2.1)*0.2, 1.4);
    float xJit = sin(fi*1.7)*0.05;
    vec2 origin = vec2(xJit, yPos);
    pulseAcc += pulse(wuv, origin, birth, loopT, life);
    pulseAcc += pulse(wuv, origin, birth + 30.0, loopT, life);
    glyphAcc += glyph(uv, origin, birth, loopT, life, fi*0.37);
    glyphAcc += glyph(uv, origin, birth + 30.0, loopT, life, fi*0.37 + 0.5);
  }

  col += vec3(1.0, 0.96, 0.92) * pulseAcc * 1.2;
  col += vec3(1.0, 0.92, 0.85) * glyphAcc * 0.9;

  float beat = pow(sin(t * 78.0/60.0 * 3.14159 * 0.5), 8.0);
  col += vec3(0.4, 0.3, 0.5) * beat * 0.04;

  float vig = 1.0 - dot(uv,uv)*0.55;
  col *= vig;

  float hueShift = sin(t*0.08)*0.04;
  col.r += hueShift;
  col.b -= hueShift*0.5;

  col = pow(col, vec3(0.92));
  col = clamp(col, 0.0, 1.0);

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 5.5, wet: 0.42 }).toDestination();
  await masterReverb.generate();

  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 4500, Q: 0.5 }).connect(masterReverb);

  const amberSynth = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.4, decay: 0.6, sustain: 0.5, release: 1.8 },
    filter: { type: "lowpass", frequency: 800, Q: 1.0 },
    filterEnvelope: { attack: 0.5, decay: 0.4, sustain: 0.6, baseFrequency: 300, octaves: 2 }
  }).connect(masterFilter);
  amberSynth.volume.value = -12;

  const crimsonDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.3 }).connect(masterFilter);
  const crimsonSynth = new Tone.FMSynth({
    harmonicity: 1.5,
    modulationIndex: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 1.2, sustain: 0.2, release: 1.5 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.5, decay: 0.5, sustain: 0.3, release: 1.0 }
  }).connect(crimsonDelay);
  crimsonSynth.volume.value = -16;

  const cyanChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.5, depth: 0.6, wet: 0.5 }).connect(masterFilter);
  cyanChorus.start();
  const cyanPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.7, release: 3.5 }
  }).connect(cyanChorus);
  cyanPad.volume.value = -22;

  const whitePulseBell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 1.5, sustain: 0, release: 0.5 }
  }).connect(masterReverb);
  whitePulseBell.volume.value = -14;

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.8, release: 2.0 }
  }).connect(masterFilter);
  subBass.volume.value = -18;

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterReverb);
  const shimmer = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.2, release: 2.0 }
  }).connect(noiseHPF);
  shimmer.volume.value = -32;

  const amberNotes = ["F2", "F2", "Eb2", "G2"];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 18) {
      amberSynth.triggerAttackRelease(amberNotes[amberIdx % amberNotes.length], "2n", time + H(10), 0.6);
    }
    amberIdx++;
  }, "2n").start(0);

  const crimsonNotes = ["Ab3", "Bb3", "C4", "Ab3", "Eb4", "C4"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 17 && Math.random() > 0.25) {
      crimsonSynth.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "4n", time + H(12), 0.5);
    }
    crimsonIdx++;
  }, "4n").start(0);

  const cyanChords = [
    ["F3", "Ab3", "C4", "Eb4"],
    ["Eb3", "G3", "Bb3", "D4"],
    ["Db3", "F3", "Ab3", "C4"],
    ["F3", "Ab3", "C4", "Eb4"]
  ];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 18) {
      const vel = bar < 3 ? 0.25 : (bar > 14 ? 0.3 : 0.45);
      cyanPad.triggerAttackRelease(cyanChords[cyanIdx % cyanChords.length], "1n", time + H(15), vel);
    }
    cyanIdx++;
  }, "1n").start(0);

  let pulseStep = 0;
  const pulseNotes = ["F5", "Ab5", "C6", "Eb5", "G5", "Bb5"];
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 16 && pulseStep % 2 === 0 && Math.random() > 0.3) {
      const note = pulseNotes[Math.floor(Math.random() * pulseNotes.length)];
      const vel = 0.3 + Math.random() * 0.25;
      whitePulseBell.triggerAttackRelease(note, "2n", time + H(8), vel);
    }
    pulseStep++;
  }, "2n").start(0);

  let subIdx = 0;
  const subNotes = ["F1", "F1", "Eb1", "Db1"];
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 16) {
      subBass.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time + H(6), 0.7);
    }
    subIdx++;
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    shimmer.triggerAttackRelease(4.0, time);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(6500, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(4500, time + 4 * (60 / bpm) * 4);
  }, "14:0:0");

  window.toneJsInstruments = { amberSynth, crimsonSynth, cyanPad, whitePulseBell, subBass, shimmer };
  window.toneJsParts = { amberLoop, crimsonLoop, cyanLoop, pulseLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
