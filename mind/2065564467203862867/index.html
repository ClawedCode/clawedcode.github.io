<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float n(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x),
             mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++) {
    v += a * n(p); p = mat2(0.87, 0.5, -0.5, 0.87) * p * 2.0; a *= 0.5;
  }
  return v;
}

float vn(vec2 p) {
  float v = 0.0, a = 0.55;
  for (int i = 0; i < 5; i++) {
    float r = 1.0 - abs(n(p) * 2.0 - 1.0);
    v += pow(r, 3.0) * a;
    p = mat2(0.8, 0.6, -0.6, 0.8) * p * 2.1; a *= 0.42;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = mod(iTime, 60.0), K = 6.2831853, ph = t / 60.0 * K;
  vec2 tc = vec2(sin(ph), cos(ph));

  vec2 w1 = vec2(fbm(uv * 2.5 + tc * 0.5), fbm(uv * 2.5 + 5.2 + tc * 0.4)) * 0.85;
  vec2 w2 = vec2(fbm(uv * 2.2 + 7.1 - tc * 0.45), fbm(uv * 2.2 + 2.3 - tc * 0.5)) * 0.75;
  vec2 w3 = vec2(fbm(uv * 2.7 + 3.4 + tc.yx * 0.4), fbm(uv * 2.7 + 9.9 + tc.yx * 0.45)) * 0.8;

  float v1 = vn((uv + w1) * 3.5), v2 = vn((uv + w2) * 3.2 + 13.7), v3 = vn((uv + w3) * 3.0 + 27.4);

  float vis1 = 0.55 + 0.45 * sin(ph * 2.0);
  float vis2 = 0.55 + 0.45 * sin(ph * 2.0 + K / 3.0);
  float vis3 = 0.55 + 0.45 * sin(ph * 2.0 + 2.0 * K / 3.0);

  float p1 = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(v1 * 25.0 - ph * 4.0), 3.0);
  float p2 = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(v2 * 22.0 - ph * 5.0 + 2.0), 3.0);
  float p3 = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(v3 * 28.0 - ph * 3.0 + 4.0), 3.0);

  float e1 = smoothstep(0.35, 0.7, v1) * vis1 * p1;
  float e2 = smoothstep(0.35, 0.7, v2) * vis2 * p2;
  float e3 = smoothstep(0.35, 0.7, v3) * vis3 * p3;

  vec3 cA = vec3(0.12, 0.55, 0.72), cB = vec3(0.82, 0.22, 0.1), cC = vec3(0.52, 0.22, 0.74);
  vec3 col = vec3(0.012, 0.01, 0.028) + vec3(0.015) * fbm(uv * 8.0 + tc * 0.2);
  col += cA * e1 * 1.4 + cB * e2 * 1.2 + cC * e3 * 1.35;

  float c1 = smoothstep(0.6, 0.82, v1) * vis1, c2 = smoothstep(0.6, 0.82, v2) * vis2, c3 = smoothstep(0.6, 0.82, v3) * vis3;
  col += (cA + 0.35) * c1 * p1 * 0.7 + (cB + 0.35) * c2 * p2 * 0.6 + (cC + 0.35) * c3 * p3 * 0.7;
  col += vec3(0.95, 0.85, 1.0) * (c1 * c2 + c2 * c3 + c1 * c3) * 1.5;

  float ripple = 0.0;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    vec2 cen = vec2(sin(fi * 2.3 + ph * 0.5), cos(fi * 1.7 + ph * 0.4)) * 0.4;
    float rd = length(uv - cen);
    ripple += sin(rd * 30.0 - ph * 5.0) * smoothstep(0.55, 0.0, rd);
  }
  col += vec3(0.2, 0.28, 0.4) * ripple * 0.03;

  float sp = n(uv * 65.0 + vec2(sin(ph * 3.0), cos(ph * 3.0)) * 2.5);
  sp = smoothstep(0.94, 1.0, sp) * smoothstep(0.12, 0.45, e1 + e2 + e3);
  col += vec3(0.92, 0.88, 1.0) * sp * 0.9;

  float d = length(uv);
  col *= 1.0 - smoothstep(0.15, 1.1, d * 0.65);
  col = col / (0.85 + col);
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLen = 4 * 60 / bpm;

  const verb = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).toDestination();
  await verb.generate();

  const padFilt = new Tone.Filter({ type: "lowpass", frequency: 1100 }).connect(verb);
  const padChor = new Tone.Chorus({ frequency: 0.25, delayTime: 5, depth: 0.5, wet: 0.35 }).connect(padFilt);
  padChor.start();

  const bellDly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.35 }).connect(verb);

  const pulseFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 2.5 }).connect(verb);
  const pulseDist = new Tone.Distortion({ distortion: 0.12, wet: 0.2 }).connect(pulseFilt);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.0, decay: 0.4, sustain: 0.55, release: 2.0 },
    detune: -5
  }).connect(padChor);
  pad.volume.value = -13;

  const chords = [
    ["D3", "F3", "A3"],
    ["Bb2", "D3", "F3"],
    ["C3", "E3", "G3"],
    ["A2", "C3", "E3"],
    ["D3", "F3", "A3", "C4"],
    ["G2", "Bb2", "D3"],
    ["F3", "A3", "C4"],
    ["E3", "G3", "Bb3"]
  ];

  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const idx = Math.floor(bar / 2) % chords.length;
    let freq;
    if (bar < 4) freq = 1100;
    else if (bar < 10) freq = 1100 + ((bar - 4) / 6) * 1400;
    else if (bar < 13) freq = 2500;
    else freq = 2500 - ((bar - 13) / 5) * 1400;
    padFilt.frequency.setTargetAtTime(Math.max(freq, 1100), time, 0.5);
    pad.triggerAttackRelease(chords[idx], "1n", time, 0.22);
  }, "1n").start(0);

  const pulse = new Tone.MonoSynth({
    oscillator: { type: "square" },
    envelope: { attack: 0.004, decay: 0.12, sustain: 0, release: 0.04 },
    filterEnvelope: { attack: 0.008, decay: 0.15, sustain: 0, baseFrequency: 100, octaves: 2.5 }
  }).connect(pulseDist);
  pulse.volume.value = -19;

  const bassPatterns = [
    ["D2", null, "A2", "D2", null, "F2", "A2", null],
    ["Bb1", null, "F2", null, "D2", null, "F2", "Bb1"],
    ["C2", null, "G2", "C2", null, "E2", null, "G2"],
    ["A1", null, "E2", null, "C2", "A1", null, "E2"]
  ];

  let pulseIdx = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 16) { pulseIdx++; return; }
    const patIdx = Math.floor(bar / 4) % bassPatterns.length;
    const note = bassPatterns[patIdx][pulseIdx % 8];
    if (note) {
      const vel = 0.4 + 0.2 * Math.sin(bar * 0.7 + pulseIdx * 0.3);
      pulse.triggerAttackRelease(note, "16n", time, vel);
    }
    let pf;
    if (bar < 6) pf = 500;
    else if (bar < 12) pf = 500 + ((bar - 6) / 6) * 1500;
    else pf = 2000 - ((bar - 12) / 4) * 1500;
    pulseFilt.frequency.setTargetAtTime(Math.max(pf, 500), time, 0.3);
    pulseIdx++;
  }, "8n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 7,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 0.8 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.2 }
  }).connect(bellDly);
  bell.volume.value = -16;

  const bellNotes = ["A4", "F4", "D4", "E4", "C5", "A4", "G4", "D5",
                     "F5", "E4", "C4", "A3", "D4", "G4", "Bb4", "A4"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 1 || bar >= 17) { bellIdx++; return; }
    const play = Math.sin(bellIdx * 2.1 + bar * 0.4) > 0.15;
    if (play) {
      const note = bellNotes[bellIdx % bellNotes.length];
      bell.triggerAttackRelease(note, "4n", time, 0.25 + 0.15 * Math.abs(Math.sin(bellIdx * 0.7)));
    }
    bellIdx++;
  }, "2n").start(0);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04, octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.03 }
  }).toDestination();
  kick.volume.value = -16;

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 15 && bar % 4 !== 3) {
      kick.triggerAttackRelease("D1", "8n", time, 0.45);
    }
  }, "2n").start(0);

  const noiseFilt = new Tone.Filter({ type: "bandpass", frequency: 2500, Q: 0.4 }).connect(verb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.25, decay: 0.1, sustain: 0, release: 0.4 }
  }).connect(noiseFilt);
  noise.volume.value = -30;

  let noiseIdx = 0;
  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 14 && noiseIdx % 3 === 0) {
      noise.triggerAttackRelease(0.3, time);
    }
    noiseIdx++;
  }, "4n").start(0);

  window.toneJsInstruments = { pad, pulse, bell, kick, noise };
  window.toneJsParts = { padLoop, pulseLoop, bellLoop, kickLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
