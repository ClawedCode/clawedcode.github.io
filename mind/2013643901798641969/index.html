<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}return v;}

vec3 hsv(float h,float s,float v){vec3 c=clamp(abs(mod(h*6.0+vec3(0,4,2),6.0)-3.0)-1.0,0.0,1.0);return v*mix(vec3(1),c,s);}

float sdOctahedron(vec3 p,float s){p=abs(p);return(p.x+p.y+p.z-s)*0.57735027;}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime*0.08;
    float breath=sin(t*6.28318)*0.5+0.5;
    float pulse=sin(t*12.56636+breath*3.0)*0.5+0.5;
    
    vec3 col=vec3(0.02,0.01,0.04);
    
    float numParticles=800.0;
    for(float i=0.0;i<800.0;i++){
        float id=i/numParticles;
        float angle=id*6.28318*13.0+t*0.5;
        float radius=0.1+id*0.6;
        
        float clusterPhase=sin(t*3.0+id*20.0)*0.5+0.5;
        float latticeStrength=smoothstep(0.3,0.7,clusterPhase);
        
        vec2 chaosPos=vec2(cos(angle+sin(id*50.0+t)),sin(angle*1.3+cos(id*30.0+t*0.7)))*radius;
        chaosPos+=vec2(fbm(vec2(id*10.0,t*0.5))-0.5,fbm(vec2(id*10.0+100.0,t*0.5))-0.5)*0.3;
        
        float gridScale=6.0;
        vec2 latticePos=floor(chaosPos*gridScale+0.5)/gridScale;
        latticePos+=vec2(sin(latticePos.y*20.0+t),cos(latticePos.x*20.0+t))*0.02;
        
        vec2 pos=mix(chaosPos,latticePos,latticeStrength*pulse);
        pos*=0.8+breath*0.15;
        
        float d=length(uv-pos);
        float size=0.003+0.002*sin(id*100.0+t*2.0);
        size*=1.0+latticeStrength*0.5;
        
        float glow=smoothstep(size*4.0,0.0,d);
        float core=smoothstep(size,size*0.3,d);
        
        float hue=0.55+id*0.1+latticeStrength*0.1-breath*0.05;
        float sat=0.6-latticeStrength*0.3;
        float val=0.7+latticeStrength*0.3;
        vec3 particleCol=hsv(hue,sat,val);
        
        col+=particleCol*glow*0.08*(0.5+latticeStrength*0.5);
        col+=vec3(0.9,0.95,1.0)*core*0.3;
    }
    
    float centralPulse=sin(t*4.0)*0.5+0.5;
    float latticeGlow=exp(-length(uv)*3.0)*centralPulse*0.15;
    col+=vec3(0.3,0.5,0.9)*latticeGlow;
    
    for(float j=0.0;j<6.0;j++){
        float lineAngle=j*1.0472+t*0.3;
        vec2 lineDir=vec2(cos(lineAngle),sin(lineAngle));
        float lineDist=abs(dot(uv,vec2(-lineDir.y,lineDir.x)));
        float lineGlow=exp(-lineDist*40.0)*centralPulse*0.1;
        lineGlow*=smoothstep(0.5,0.1,length(uv));
        col+=vec3(0.4,0.6,1.0)*lineGlow;
    }
    
    float vignette=1.0-length(uv)*0.5;
    col*=vignette;
    
    col=pow(col,vec3(0.9));
    
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 58;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.25, wet: 0.2 }).connect(masterReverb);
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 2000, Q: 0.5 }).connect(masterDelay);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.0 }).connect(masterFilter);
  const padChorus = new Tone.Chorus({ frequency: 0.1, delayTime: 4.5, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -12;

  const padChords = [
    ["A2", "E3", "A3"],
    ["F2", "C3", "F3"],
    ["G2", "D3", "G3"],
    ["E2", "B2", "E3"]
  ];
  
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 18) {
      pad.triggerAttackRelease(padChords[padIndex % padChords.length], "1n", time, 0.25);
    }
    padIndex++;
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 4,
    modulationIndex: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -18;

  const bellNotes = ["A4", "E5", "C5", "G4", "B4", "F5", "D5", "A5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 17 && Math.random() > 0.4) {
      const note = bellNotes[bellIndex % bellNotes.length];
      bell.triggerAttackRelease(note, "2n", time, 0.3 + Math.random() * 0.2);
    }
    bellIndex++;
  }, "2n").start(0);

  const crystallineFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterDelay);
  const crystalline = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.8, sustain: 0, release: 0.5 }
  }).connect(crystallineFilter);
  crystalline.volume.value = -22;

  const crystalScale = [69, 71, 72, 74, 76, 77, 79, 81, 83, 84];
  let crystalIndex = 0;
  const crystalLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const progress = bar / 20;
    
    if (bar >= 4 && bar < 16 && Math.random() > 0.6 - progress * 0.2) {
      const noteIndex = Math.floor(Math.random() * crystalScale.length);
      const note = Tone.Frequency(crystalScale[noteIndex], "midi");
      crystalline.triggerAttackRelease(note, "8n", time, 0.2 + Math.random() * 0.15);
    }
    crystalIndex++;
  }, "8n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 80, rolloff: -24 }).connect(masterFilter);
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).connect(subFilter);
  sub.volume.value = -8;

  const subNotes = ["A1", "A1", "F1", "G1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 18) {
      sub.triggerAttackRelease(subNotes[subIndex % subNotes.length], "2n", time, 0.5);
    }
    subIndex++;
  }, "2n").start(0);

  const textureNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.3, release: 4.0 }
  });
  const textureFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 0.8 }).connect(masterReverb);
  textureNoise.connect(textureFilter);
  textureNoise.volume.value = -28;

  let textureIndex = 0;
  const textureLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 16 && textureIndex % 2 === 0) {
      textureNoise.triggerAttackRelease("4n", time);
    }
    textureIndex++;
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "14:0:0");

  window.toneJsInstruments = { pad, bell, crystalline, sub, textureNoise };
  window.toneJsParts = { padLoop, bellLoop, crystalLoop, subLoop, textureLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
