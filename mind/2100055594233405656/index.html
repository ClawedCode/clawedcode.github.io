      let velocity = 0.6;
      if (bar < totalBars * 0.25) {
        velocity = 0.6 * ((bar - totalBars * 0.15) / (totalBars * 0.10));
      }
      // Fade out for loop
      if (bar >= totalBars * 0.80) {
        velocity = 0.6 * (1.0 - ((bar - totalBars * 0.80) / (totalBars * 0.20)));
      }

      if (velocity > 0.05) {
        bloom.triggerAttackRelease(chord, "1n", time, velocity);
      }
    }
  }, "1n").start(0);

  // D. Noise Bed (Continuous "flesh" texture)
  const noiseBed = new Tone.Noise("pink").start();
  const noiseFilter = new Tone.Filter({ type: "lowpass", frequency: 400 }).toDestination();
  noiseBed.connect(noiseFilter);

  // E. Filter Sweep Automation (The "Morphogenesis" arc)
  // Starts narrow (skeleton), opens wide (bloom), closes for loop
  const secPerBar = 240 / bpm;

  Tone.Transport.schedule((time) => {
    // Open filter at 15%
    globalFilter.frequency.setValueAtTime(400, time);
    globalFilter.frequency.linearRampToValueAtTime(3500, time + totalBars * 0.35 * secPerBar);
  }, totalBars * 0.12 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Close filter at 75% to wind down
    globalFilter.frequency.setValueAtTime(3500, time);
    globalFilter.frequency.linearRampToValueAtTime(300, time + totalBars * 0.15 * secPerBar);
  }, totalBars * 0.75 * secPerBar);

  // F. Drone Volume Automation
  Tone.Transport.schedule((time) => {
    // Fade in noise bed
    droneNoise.envelope.attack = 0.1;
    droneNoise.envelope.decay = 0.1;
    droneNoise.volume.rampToValueAtTime(-12, time + 5);
  }, totalBars * 0.10 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Fade out noise bed for loop
    droneNoise.volume.rampToValueAtTime(-30, time + 10);
  }, totalBars * 0.85 * secPerBar);

  // === STORE REFERENCES ===
  window.toneJsInstruments = {
    skeleton,
    droneNoise,
    fleshPulse,
    bloom,
    masterCompressor,
    reverb,
    globalFilter,
    chorus,
    noiseBed,
    noiseFilter
  };

  window.toneJsParts = {
    skeletonLoop,
    pulseLoop,
    bloomLoop
  };
};





window.audioDuration = 72;

window.ready = true;
  </script>
