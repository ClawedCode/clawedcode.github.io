<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float nse(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
               mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    for (float i = 0.0; i < 3.0; i++) { v += a * nse(p); p = p * 2.0 + vec2(100.0); a *= 0.5; }
    return v;
}

float seg(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
}

void main() {
    float t = mod(iTime, 50.0);
    float br = 0.5 + 0.5 * sin(t * 0.4);
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y * (1.0 + 0.02 * sin(t * 0.25));

    vec2 q = vec2(fbm(uv * 3.0 + t * 0.08), fbm(uv * 3.0 + vec2(5.2, 1.3) + t * 0.06));
    vec2 r = vec2(fbm(uv * 3.0 + q * 4.0 + vec2(1.7, 9.2) + t * 0.05),
                  fbm(uv * 3.0 + q * 4.0 + vec2(8.3, 2.8) + t * 0.07));
    float f = fbm(uv * 3.0 + r * 2.5 + t * 0.03);
    float f2 = fbm(uv * 4.0 + r * 1.5 + vec2(3.1, 7.4) + t * 0.04);

    vec3 col = mix(vec3(0.05, 0.02, 0.1), vec3(0.15, 0.08, 0.35), smoothstep(0.1, 0.5, f));
    col = mix(col, vec3(0.3, 0.2, 0.6), smoothstep(0.35, 0.6, f) * 0.8);

    float am = smoothstep(0.45, 0.65, f2) * smoothstep(0.85, 0.65, f2);
    col = mix(col, vec3(0.75, 0.45, 0.08), am * 0.7);
    col += vec3(1.0, 0.7, 0.25) * am * 0.3 * (0.7 + 0.3 * br);

    col += vec3(0.45, 0.35, 0.85) * smoothstep(0.48, 0.52, f) * smoothstep(0.56, 0.52, f) * 2.0 * br;

    float e = 0.01;
    float fx = fbm(uv * 3.0 + r * 2.5 + t * 0.03 + vec2(e, 0.0));
    float fy = fbm(uv * 3.0 + r * 2.5 + t * 0.03 + vec2(0.0, e));
    col += vec3(0.45, 0.35, 0.85) * length(vec2(fx - f, fy - f)) / e * 0.12 * br;

    vec2 lu = uv * 6.0 + q * 2.0;
    float lat = max(smoothstep(0.02, 0.0, abs(fract(lu.x) - 0.5) - 0.48),
                    smoothstep(0.02, 0.0, abs(fract(lu.y) - 0.5) - 0.48));
    col += vec3(0.25, 0.2, 0.55) * lat * 0.06 * (0.3 + 0.7 * sin(t * 0.2 + f * 4.0));

    col += vec3(0.22, 0.15, 0.4) * smoothstep(0.3, 0.0, abs(length(uv) - mod(t * 0.12, 1.0) * 0.7)) * 0.07 * br;

    for (float i = 0.0; i < 18.0; i++) {
        vec2 pos = vec2(h21(vec2(i * 1.7, 3.1)) - 0.5, h21(vec2(2.3, i * 2.1)) - 0.5) * 1.4;
        float id = h21(vec2(i, i * 0.7));
        pos += vec2(sin(t * 0.08 + id * 5.0), cos(t * 0.06 + id * 7.0)) * 0.15;
        float fade = pow(max(sin(t * 0.12 + id * 6.28), 0.0), 4.0);
        vec2 gp = (uv - pos) / (0.7 + 0.5 * id);
        float d = 1e9;
        if (id < 0.2) d = min(max(abs(gp.x) - 0.018, abs(gp.y) - 0.002),
                               max(abs(gp.x) - 0.002, abs(gp.y) - 0.018));
        else if (id < 0.35) d = abs(length(gp) - 0.014) - 0.001;
        else if (id < 0.5) d = min(seg(gp, vec2(-0.012, 0.015), vec2(0.012, 0.0)),
                                    seg(gp, vec2(0.012, 0.0), vec2(-0.012, -0.015)));
        else if (id < 0.65) d = max(abs(gp.x) - 0.012, abs(gp.y) - 0.001);
        else if (id < 0.8) d = min(seg(gp, vec2(-0.01, -0.015), vec2(0.01, -0.015)),
                                    min(seg(gp, vec2(0.01, -0.015), vec2(0.0, 0.015)),
                                        seg(gp, vec2(0.0, 0.015), vec2(-0.01, -0.015))));
        else d = min(max(abs(gp.x) - 0.002, abs(gp.y) - 0.018),
                     max(abs(gp.x) - 0.008, abs(gp.y + 0.016) - 0.002));
        col += mix(vec3(0.4, 0.35, 0.65), vec3(0.9, 0.7, 0.3), id) * smoothstep(0.003, 0.0, d) * fade * 0.35;
    }

    col *= 1.0 - dot(uv, uv) * 0.6;
    col *= 0.88 + 0.12 * sin(t * 0.25);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 58;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 5.0, wet: 0.5 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(reverb);

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4.5, depth: 0.7, wet: 0.5 }).connect(reverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.5, release: 4.0 }
  }).connect(padChorus);

  const chords = [
    ["D3", "A3", "F4"],
    ["Bb2", "F3", "D4"],
    ["G3", "D4", "Bb4"],
    ["C3", "G3", "Eb4"],
    ["F3", "C4", "A4"],
    ["D3", "A3", "F4"]
  ];

  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 11) {
      pad.triggerAttackRelease(chords[0], "1n", time, 0.06);
    } else {
      const idx = Math.floor(bar / 2) % chords.length;
      pad.triggerAttackRelease(chords[idx], "1n", time, 0.1);
    }
    ci++;
  }, "1n").start(0);

  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180 }).connect(reverb);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.8, decay: 1.0, sustain: 0.3, release: 2.0 }
  }).connect(bassFilter);

  const bassA = ["D2", "F2", "D2", "A1"];
  const bassB = ["Bb1", "D2", "G2", "F2"];
  const bassC = ["C2", "Eb2", "C2", "G1"];
  let bi = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 11) {
      let pattern = bar < 5 ? bassA : bar < 8 ? bassB : bassC;
      bass.triggerAttackRelease(pattern[bi % pattern.length], "2n", time, 0.2);
    }
    bi++;
  }, "2n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 4.0,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 3.0, sustain: 0, release: 1.5 },
    modulation: { type: "sine" }
  }).connect(delay);

  const bellPool = ["A5", "D5", "F5", "Bb4", "C5", "G5", "E5", "D6", "A4"];
  let belli = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 10 && Math.random() > 0.45) {
      bell.triggerAttackRelease(bellPool[belli % bellPool.length], "16n", time, 0.04 + Math.random() * 0.04);
    }
    belli++;
  }, "2n.").start(0);

  const breathFilter = new Tone.Filter({ type: "bandpass", frequency: 600, Q: 0.4 }).connect(reverb);
  const breath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.05, release: 2.5 }
  }).connect(breathFilter);

  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 11) {
      breath.triggerAttackRelease("2n", time, 0.02);
    }
  }, "1n").start(0);

  const shimmer = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 2.0, sustain: 0.1, release: 3.0 }
  }).connect(delay);

  const shimmerNotes = ["F6", "A5", "D6", "Bb5"];
  let si = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 5 && bar < 9 && Math.random() > 0.6) {
      shimmer.triggerAttackRelease(shimmerNotes[si % shimmerNotes.length], "4n", time, 0.02);
    }
    si++;
  }, "1n").start(0);

  window.toneJsInstruments = { pad, bass, bell, breath, shimmer };
  window.toneJsParts = { padLoop, bassLoop, bellLoop, breathLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 50;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 50;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
