<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i = 0; i < 3; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float glyphField(vec2 p, float t) {
    vec2 id = floor(p * 3.0);
    float h = hash(id + floor(t * 0.3));
    float fade = smoothstep(0.0, 0.3, fract(t * 0.3 + h)) *
                 smoothstep(1.0, 0.7, fract(t * 0.3 + h));
    float g = step(0.85, h) * fade;
    vec2 lp = fract(p * 3.0) - 0.5;
    float bar = smoothstep(0.02, 0.0, abs(lp.y)) * step(-0.3, lp.x) * step(lp.x, 0.3);
    float dot1 = smoothstep(0.05, 0.03, length(lp - vec2(0.15, 0.1)));
    return g * (bar * 0.4 + dot1 * 0.6);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float phase = mod(t, 75.0) / 75.0;

    float breathe = sin(phase * 6.28318 * 2.0) * 0.5 + 0.5;
    float drift = sin(phase * 6.28318) * 0.5 + 0.5;

    vec3 indigo = vec3(0.08, 0.04, 0.22);
    vec3 deepBlue = vec3(0.05, 0.08, 0.28);
    vec3 amber = vec3(0.85, 0.55, 0.15);
    vec3 paleGold = vec3(0.95, 0.82, 0.45);
    vec3 duskRose = vec3(0.45, 0.15, 0.35);

    float sleepWake = smoothstep(-0.2, 0.8, sin(phase * 6.28318 - 1.2));

    vec3 bgA = mix(indigo, deepBlue, length(uv) * 0.8);
    vec3 bgB = mix(duskRose, mix(paleGold, amber, length(uv)), 0.5);
    vec3 bg = mix(bgA, bgB, sleepWake * 0.6);

    vec2 warpUV = uv + vec2(
        fbm(uv * 2.0 + t * 0.05) * 0.15,
        fbm(uv * 2.0 + 100.0 + t * 0.04) * 0.15
    );

    float lattice1 = fbm(warpUV * 3.0 + t * 0.08);
    float lattice2 = fbm(warpUV * 5.0 - t * 0.06 + 50.0);
    float latticeBlend = mix(lattice1, lattice2, breathe);

    float expand = 1.0 + 0.15 * sin(phase * 6.28318 * 3.0);
    float latticePattern = fbm(warpUV * 4.0 * expand + t * 0.03);
    float latticeEdge = smoothstep(0.35, 0.55, latticePattern) -
                        smoothstep(0.55, 0.75, latticePattern);
    latticeEdge *= 0.4 + 0.3 * breathe;

    vec3 latticeColor = mix(
        vec3(0.3, 0.15, 0.6),
        vec3(0.7, 0.5, 0.2),
        sleepWake
    );

    vec3 col = bg + latticeColor * latticeEdge * 0.5;

    float rippleT = t * 0.12;
    for(int i = 0; i < 5; i++) {
        float fi = float(i);
        vec2 center = vec2(
            sin(rippleT + fi * 1.8) * 0.4,
            cos(rippleT * 0.7 + fi * 2.3) * 0.3
        );
        float d = length(uv - center);
        float wave = sin(d * 25.0 - t * 1.5 + fi * 0.8) * 0.5 + 0.5;
        wave *= smoothstep(0.6, 0.1, d);
        wave *= 0.08 + 0.05 * sin(t * 0.3 + fi);

        vec3 rippleCol = mix(
            vec3(0.2, 0.3, 0.7),
            vec3(0.8, 0.6, 0.2),
            sleepWake + fi * 0.1
        );
        col += rippleCol * wave;
    }

    float glyphs = glyphField(uv * 2.0 + vec2(t * 0.02, t * 0.01), t);
    glyphs += glyphField(uv * 1.5 + vec2(-t * 0.015, t * 0.025) + 73.0, t * 0.7);

    float glyphFade = 0.25 + 0.2 * sin(t * 0.4);
    vec3 glyphColor = mix(vec3(0.5, 0.4, 0.9), vec3(0.9, 0.7, 0.3), sleepWake);
    col += glyphColor * glyphs * glyphFade;

    for(int i = 0; i < 40; i++) {
        float fi = float(i);
        vec2 starPos = vec2(
            hash(vec2(fi, 0.0)) * 2.0 - 1.0,
            hash(vec2(0.0, fi)) * 2.0 - 1.0
        ) * 0.9;
        float twinkle = sin(t * (0.5 + hash(vec2(fi, fi)) * 2.0) + fi * 3.7);
        twinkle = twinkle * 0.5 + 0.5;
        twinkle *= step(0.7, hash(vec2(fi * 1.3, floor(t * 0.2))));
        float sd = length(uv - starPos);
        float star = smoothstep(0.015, 0.0, sd) * twinkle;
        vec3 starCol = mix(vec3(0.6, 0.5, 1.0), vec3(1.0, 0.85, 0.5), hash(vec2(fi * 2.1, 1.0)));
        col += starCol * star * 0.7;
    }

    float packetTrail = 0.0;
    for(int i = 0; i < 8; i++) {
        float fi = float(i);
        float speed = 0.15 + hash(vec2(fi, 33.0)) * 0.1;
        float angle = hash(vec2(fi, 77.0)) * 6.28318;
        vec2 dir = vec2(cos(angle), sin(angle));
        float progress = fract(t * speed + fi * 0.125);
        vec2 packetPos = dir * (progress * 1.5 - 0.75);
        float pd = length(uv - packetPos);

        float trail = smoothstep(0.08, 0.0, pd);
        trail *= smoothstep(0.0, 0.3, progress) * smoothstep(1.0, 0.7, progress);
        packetTrail += trail * 0.12;
    }
    vec3 packetCol = mix(vec3(0.3, 0.5, 0.9), vec3(0.9, 0.6, 0.3), drift);
    col += packetCol * packetTrail;

    float vignette = 1.0 - length(uv) * 0.7;
    vignette = smoothstep(0.0, 1.0, vignette);
    col *= vignette;

    col = pow(col, vec3(0.95));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);
  const masterChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(masterReverb);
  masterChorus.start();

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -12;

  const padChords = [
    ["A3", "E4", "B4"],
    ["F#3", "C#4", "A4"],
    ["D3", "A3", "F#4"],
    ["E3", "B3", "G#4"],
    ["A3", "E4", "C#5"],
    ["F#3", "A3", "D4"],
    ["D3", "F#3", "B3"],
    ["E3", "G#3", "B3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 18) return;
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1m", time, 0.25);
    chordIdx++;
  }, "1m").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0, release: 2.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 1.0 }
  }).connect(bellFilter);
  bell.volume.value = -18;

  const bellNotes = ["E5", "B4", "C#5", "A4", "F#5", "G#4", "D5", "E4", "B5", "A5"];
  let bellIdx = 0;
  let bellStep = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 17) return;

    const density = bar < 6 ? 0.25 : bar < 12 ? 0.45 : 0.3;
    const h = Math.sin(bellStep * 127.1 + 311.7) * 43758.5453;
    const shouldPlay = (h - Math.floor(h)) < density;

    if (shouldPlay) {
      const noteOffset = bar >= 8 ? 3 : 0;
      const note = bellNotes[(bellIdx + noteOffset) % bellNotes.length];
      bell.triggerAttackRelease(note, "2n", time, 0.15 + (h - Math.floor(h)) * 0.1);
      bellIdx++;
    }
    bellStep++;
  }, "4n").start(0);

  const driftFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2.0 }).connect(masterReverb);
  const drift = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 2.0, sustain: 0.3, release: 2.5 }
  }).connect(driftFilter);
  drift.volume.value = -20;

  const driftNotes = ["A3", "E3", "F#3", "D3", "B3", "C#3"];
  let driftIdx = 0;
  const driftLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 16) return;
    if (driftIdx % 3 !== 0) { driftIdx++; return; }

    drift.triggerAttackRelease(driftNotes[driftIdx % driftNotes.length], "2m", time, 0.18);
    driftIdx++;
  }, "2n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120 }).toDestination();
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 2.0, sustain: 0.4, release: 3.0 }
  }).connect(subFilter);
  sub.volume.value = -14;

  const subNotes = ["A1", "F#1", "D1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 18) return;
    sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "2m", time, 0.35);
    subIdx++;
  }, "2m").start(0);

  const shimmer = new Tone.FMSynth({
    harmonicity: 5.0,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 1.0, sustain: 0, release: 1.5 },
    modulation: { type: "triangle" }
  }).connect(masterReverb);
  shimmer.volume.value = -24;

  let shimmerStep = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 6 || bar >= 15) return;

    const h = Math.sin(shimmerStep * 73.1) * 43758.5453;
    if ((h - Math.floor(h)) < 0.3) {
      const notes = ["C#6", "E6", "A5", "B5", "F#6", "G#5"];
      const note = notes[shimmerStep % notes.length];
      shimmer.triggerAttackRelease(note, "8n", time, 0.08);
    }
    shimmerStep++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 6 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2400, time + 4 * barLen);
  }, "8:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
  }, "14:0:0");

  window.toneJsInstruments = { pad, bell, drift, sub, shimmer };
  window.toneJsParts = { padLoop, bellLoop, driftLoop, subLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
