<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float sig = 10.0, rho = 28.0 + 2.5 * sin(t * 0.105), bet = 2.667;
    float dt = 0.011;
    float c1 = cos(t * 0.065), s1 = sin(t * 0.065);
    float c2 = cos(t * 0.038 + 0.5), s2 = sin(t * 0.038 + 0.5);
    vec3 ctr = vec3(0.0, 0.0, 27.0);
    vec3 col = vec3(0.0);

    vec3 p1 = vec3(0.1, 0.1, 0.1 + sin(t * 0.03) * 2.0);
    vec3 p2 = p1 + vec3(0.001, 0.0, 0.0);

    for (int i = 0; i < 60; i++) {
        p1 += vec3(sig*(p1.y-p1.x), p1.x*(rho-p1.z)-p1.y, p1.x*p1.y-bet*p1.z) * 0.02;
        p2 += vec3(sig*(p2.y-p2.x), p2.x*(rho-p2.z)-p2.y, p2.x*p2.y-bet*p2.z) * 0.02;
    }

    vec3 q1 = p1 - ctr;
    float rx1 = q1.x*c1 - q1.z*s1, rz1 = q1.x*s1 + q1.z*c1;
    vec2 pp1 = vec2(rx1, q1.y*c2 - rz1*s2) * 0.019;

    vec3 q2 = p2 - ctr;
    float rx2 = q2.x*c1 - q2.z*s1, rz2 = q2.x*s1 + q2.z*c1;
    vec2 pp2 = vec2(rx2, q2.y*c2 - rz2*s2) * 0.019;

    for (int i = 0; i < 420; i++) {
        vec3 dp1 = vec3(sig*(p1.y-p1.x), p1.x*(rho-p1.z)-p1.y, p1.x*p1.y-bet*p1.z);
        p1 += dp1 * dt;
        q1 = p1 - ctr;
        rx1 = q1.x*c1 - q1.z*s1;
        rz1 = q1.x*s1 + q1.z*c1;
        vec2 cp1 = vec2(rx1, q1.y*c2 - rz1*s2) * 0.019;
        vec2 pa1 = uv - pp1, ba1 = cp1 - pp1;
        float ht1 = clamp(dot(pa1,ba1)/(dot(ba1,ba1)+1e-6), 0.0, 1.0);
        float d1 = length(pa1 - ba1*ht1);
        float v1 = length(dp1)*dt*0.35;
        float g1 = 0.0035/(d1+0.001);
        g1 *= g1;
        float g2 = 0.011/(d1+0.005);
        vec3 tc1 = mix(vec3(0.08,0.3,0.92), vec3(0.85,0.15,0.65), smoothstep(0.0,0.55,v1));
        tc1 = mix(tc1, vec3(1.0,0.75,0.25), smoothstep(0.45,1.1,v1));
        col += tc1 * (g1*0.018 + g2*0.005);
        pp1 = cp1;

        vec3 dp2 = vec3(sig*(p2.y-p2.x), p2.x*(rho-p2.z)-p2.y, p2.x*p2.y-bet*p2.z);
        p2 += dp2 * dt;
        q2 = p2 - ctr;
        rx2 = q2.x*c1 - q2.z*s1;
        rz2 = q2.x*s1 + q2.z*c1;
        vec2 cp2 = vec2(rx2, q2.y*c2 - rz2*s2) * 0.019;
        vec2 pa2 = uv - pp2, ba2 = cp2 - pp2;
        float ht2 = clamp(dot(pa2,ba2)/(dot(ba2,ba2)+1e-6), 0.0, 1.0);
        float d2 = length(pa2 - ba2*ht2);
        float v2 = length(dp2)*dt*0.35;
        float g3 = 0.003/(d2+0.001);
        g3 *= g3;
        float g4 = 0.009/(d2+0.005);
        vec3 tc2 = mix(vec3(0.15,0.55,0.85), vec3(0.7,0.25,0.9), smoothstep(0.0,0.55,v2));
        tc2 = mix(tc2, vec3(0.95,0.6,0.2), smoothstep(0.45,1.1,v2));
        col += tc2 * (g3*0.012 + g4*0.004);
        pp2 = cp2;
    }

    col = 1.0 - exp(-col * 2.8);
    col = pow(col, vec3(0.85));
    float fade = smoothstep(0.0, 2.5, t) * smoothstep(60.0, 57.0, t);
    col *= (1.0 - 0.25 * length(uv)) * fade;
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLength = (60 / bpm) * 4;
  const getBar = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) / barLength);
  const H = (ms) => (Math.random() * ms * 2 - ms) / 1000;
  const master = new Tone.Gain(0.82).toDestination();
  const intimateVerb = new Tone.Reverb({ decay: 2.4, preDelay: 0.012, wet: 0.34 });
  await intimateVerb.generate();
  intimateVerb.connect(master);
  const stringVerb = new Tone.Reverb({ decay: 3.2, preDelay: 0.02, wet: 0.32 });
  await stringVerb.generate();
  stringVerb.connect(master);
  const glueCompressor = new Tone.Compressor({ threshold: -28, ratio: 3, attack: 0.005, release: 0.6 }).connect(master);
  const piano = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.01, decay: 2.4, sustain: 0.12, release: 3.2 },
    volume: -9
  }).connect(intimateVerb);
  const pianoLH = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.02, decay: 1.8, sustain: 0.18, release: 2.8 },
    volume: -13
  }).connect(intimateVerb);
  const stringFilter = new Tone.Filter({ type: 'lowpass', frequency: 2100, Q: 0.9 });
  const stringsChorus = new Tone.Chorus({ frequency: 3.8, delayTime: 2.6, depth: 0.22, wet: 0.35 });
  stringsChorus.start();
  stringFilter.connect(stringsChorus);
  stringsChorus.connect(stringVerb);
  const strings = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sawtooth' },
    detune: -6,
    envelope: { attack: 1.3, decay: 0.6, sustain: 0.72, release: 2.8 },
    volume: -18
  });
  strings.connect(stringFilter);
  const glitchHPF = new Tone.Filter({ type: 'highpass', frequency: 3200, Q: 1.2 }).connect(intimateVerb);
  const glitchClick = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.01, sustain: 0 },
    volume: -27
  }).connect(glitchHPF);
  const glitchPop = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.0008, decay: 0.03, sustain: 0, release: 0.02 },
    volume: -24
  }).connect(intimateVerb);
  const droneFilter = new Tone.Filter({ type: 'lowpass', frequency: 240, Q: 0.6 }).connect(glueCompressor);
  const drone = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 4.0, decay: 3.0, sustain: 0.5, release: 5.0 },
    volume: -22
  }).connect(droneFilter);
  const textureNoise = new Tone.Noise('pink');
  const textureFilter = new Tone.Filter({ type: 'bandpass', frequency: 1900, Q: 2.5 });
  const textureGain = new Tone.Gain(0.018).connect(intimateVerb);
  textureNoise.connect(textureFilter).connect(textureGain);
  textureNoise.start();
  const pianoMelodyEvents = [
    { time: '0:0:0', note: 'A4', dur: '2n', vel: 0.46 },
    { time: '0:2:0', note: 'E4', dur: '4n', vel: 0.34 },
    { time: '0:3:0', note: 'C5', dur: '4n', vel: 0.52 },
    { time: '1:1:0', note: 'D5', dur: '2n', vel: 0.4 },
    { time: '1:3:0', note: 'B4', dur: '4n', vel: 0.33 },
    { time: '2:0:0', note: 'G4', dur: '2n', vel: 0.42 },
    { time: '2:2:0', note: 'A4', dur: '4n', vel: 0.37 },
    { time: '2:3:0', note: 'E5', dur: '4n', vel: 0.5 },
    { time: '3:1:0', note: 'F4', dur: '2n', vel: 0.38 },
    { time: '3:3:0', note: 'D4', dur: '2n', vel: 0.35 },
    { time: '4:0:0', note: 'C5', dur: '2n', vel: 0.44 },
    { time: '4:2:0', note: 'A4', dur: '4n', vel: 0.36 },
    { time: '5:0:0', note: 'E5', dur: '2n', vel: 0.48 },
    { time: '5:2:0', note: 'G4', dur: '4n', vel: 0.33 },
    { time: '6:1:0', note: 'F4', dur: '2n', vel: 0.39 },
    { time: '6:3:0', note: 'D4', dur: '4n', vel: 0.32 },
    { time: '7:0:0', note: 'A4', dur: '2n', vel: 0.45 },
    { time: '7:2:0', note: 'E4', dur: '4n', vel: 0.34 },
    { time: '8:0:0', note: 'A4', dur: '2n', vel: 0.41 },
    { time: '8:2:0', note: 'C5', dur: '4n', vel: 0.38 },
    { time: '9:1:0', note: 'B4', dur: '2n', vel: 0.36 },
    { time: '9:3:0', note: 'G4', dur: '4n', vel: 0.32 },
    { time: '10:0:0', note: 'E4', dur: '2n', vel: 0.35 },
    { time: '10:2:0', note: 'A4', dur: '4n', vel: 0.33 },
    { time: '11:0:0', note: 'D5', dur: '2n', vel: 0.4 },
    { time: '11:2:0', note: 'B4', dur: '4n', vel: 0.34 },
    { time: '12:0:0', note: 'A4', dur: '2n', vel: 0.38 },
    { time: '12:2:0', note: 'E4', dur: '4n', vel: 0.32 },
    { time: '13:0:0', note: 'C5', dur: '2n', vel: 0.37 },
    { time: '13:2:0', note: 'A4', dur: '4n', vel: 0.33 },
    { time: '14:0:0', note: 'G4', dur: '2n', vel: 0.34 },
    { time: '14:2:0', note: 'D4', dur: '4n', vel: 0.3 },
    { time: '15:0:0', note: 'A4', dur: '2n', vel: 0.36 },
    { time: '15:2:0', note: 'E4', dur: '4n', vel: 0.31 }
  ];
  const pianoRH = new Tone.Part((time, ev) => {
    piano.triggerAttackRelease(ev.note, ev.dur, time + H(35), ev.vel);
  }, pianoMelodyEvents);
  pianoRH.loop = true;
  pianoRH.loopEnd = '16m';
  pianoRH.start(0);
  const pianoLHEvents = [
    { time: '0:0:0', note: 'A2', dur: '2m', vel: 0.4 },
    { time: '2:0:0', note: 'F2', dur: '2m', vel: 0.36 },
    { time: '4:0:0', note: 'G2', dur: '2m', vel: 0.38 },
    { time: '6:0:0', note: 'E2', dur: '2m', vel: 0.34 },
    { time: '8:0:0', note: 'A2', dur: '2m', vel: 0.4 },
    { time: '10:0:0', note: 'F2', dur: '2m', vel: 0.35 },
    { time: '12:0:0', note: 'G2', dur: '2m', vel: 0.33 },
    { time: '14:0:0', note: 'E2', dur: '2m', vel: 0.32 }
  ];
  const pianoLHPart = new Tone.Part((time, ev) => {
    pianoLH.triggerAttackRelease(ev.note, ev.dur, time + H(25), ev.vel);
  }, pianoLHEvents);
  pianoLHPart.loop = true;
  pianoLHPart.loopEnd = '16m';
  pianoLHPart.start(0);
  const stringEvents = [
    { time: '3:0:0', chord: ['A3', 'C4', 'E4'], dur: '2m', vel: 0.32 },
    { time: '5:0:0', chord: ['F3', 'A3', 'C4'], dur: '2m', vel: 0.35 },
    { time: '7:0:0', chord: ['G3', 'B3', 'D4'], dur: '2m', vel: 0.33 },
    { time: '9:0:0', chord: ['E3', 'G3', 'B3'], dur: '2m', vel: 0.3 },
    { time: '11:0:0', chord: ['A3', 'C4', 'E4'], dur: '2m', vel: 0.28 }
  ];
  const stringPart = new Tone.Part((time, ev) => {
    strings.triggerAttackRelease(ev.chord, ev.dur, time, ev.vel);
  }, stringEvents);
  stringPart.loop = true;
  stringPart.loopEnd = '16m';
  stringPart.start(0);
  const droneEvents = [
    { time: '0:0:0', note: 'A1', dur: '8m' },
    { time: '8:0:0', note: 'E1', dur: '8m' }
  ];
  const dronePart = new Tone.Part((time, ev) => {
    drone.triggerAttackRelease(ev.note, ev.dur, time, 0.24);
  }, droneEvents);
  dronePart.loop = true;
  dronePart.loopEnd = '16m';
  dronePart.start(0);
  const glitchLoop = new Tone.Loop((time) => {
    const bar = getBar(time);
    if (bar >= 5 && bar < 12 && Math.random() > 0.78) {
      glitchClick.triggerAttackRelease('64n', time + H(12), 0.3);
    }
  }, '8n').start(0);
  const glitchPopLoop = new Tone.Loop((time) => {
    const bar = getBar(time);
    if (bar >= 6 && bar < 11 && Math.random() > 0.94) {
      const freq = 1800 + Math.random() * 3200;
      glitchPop.frequency.setValueAtTime(freq, time);
      glitchPop.triggerAttackRelease('64n', time + H(8), 0.27);
    }
  }, '16n').start(0);
  Tone.Transport.schedule((t) => {
    stringFilter.frequency.cancelScheduledValues(t);
    stringFilter.frequency.linearRampToValueAtTime(3600, t + Tone.Time('4m').toSeconds());
  }, '4:0:0');
  Tone.Transport.schedule((t) => {
    stringFilter.frequency.cancelScheduledValues(t);
    stringFilter.frequency.linearRampToValueAtTime(1700, t + Tone.Time('2m').toSeconds());
  }, '12:0:0');
  Tone.Transport.schedule((t) => {
    droneFilter.frequency.cancelScheduledValues(t);
    droneFilter.frequency.linearRampToValueAtTime(160, t + Tone.Time('2m').toSeconds());
  }, '12:0:0');
  window.toneJsInstruments = {
    piano,
    pianoLH,
    strings,
    glitchClick,
    glitchPop,
    drone,
    textureNoise,
    intimateVerb,
    stringVerb,
    stringsChorus,
    stringFilter,
    droneFilter
  };
  window.toneJsParts = {
    pianoRH,
    pianoLHPart,
    stringPart,
    dronePart,
    glitchLoop,
    glitchPopLoop
  };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
