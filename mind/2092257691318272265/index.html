  const feltKeys = new Tone.AMSynth({
    harmonicity: 1.25,
    oscillator: { type: 'sine' },
    modulation: { type: 'triangle' },
    envelope: {
      attack: 0.008,
      decay: 0.22,
      sustain: 0.06,
      release: 0.48
    },
    modulationEnvelope: {
      attack: 0.015,
      decay: 0.12,
      sustain: 0.04,
      release: 0.28
    }
  }).connect(feltFilter);
  const sandVolume = new Tone.Volume(-23).connect(masterBus);
  const sandFilter = new Tone.Filter({
    type: 'bandpass',
    frequency: 520,
    Q: 0.75,
    rolloff: -24
  }).connect(sandVolume);
  const sandBreath = new Tone.NoiseSynth({
    noise: { type: 'brown' },
    envelope: {
      attack: 0.12,
      decay: 0.55,
      sustain: 0.08,
      release: 0.7
    }
  }).connect(sandFilter);
  const resonanceVolume = new Tone.Volume(-17).connect(masterBus);
  const deepResonance = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 2.2,
    oscillator: { type: 'sine' },
    envelope: {
      attack: 0.008,
      decay: 0.7,
      sustain: 0.01,
      release: 1.1
    }
  }).connect(resonanceVolume);
  const openingCenter = ['A2', 'E2', 'C3', 'E2'];
  const hollowCenter = ['C3', 'E3'];
  const distantCenter = ['Eb2', 'Bb2', 'G2', 'Bb2'];
  const commonToneBridge = ['C3', 'E3', 'Bb2', 'E3'];
  const separatedCenters = ['A2', 'Eb2'];
  const motifA = ['A3', 'C4', 'E4', 'Eb4', 'C4'];
  const motifHollow = ['C4', 'E4', 'G4', 'E4', 'C4'];
  const motifEb = ['Eb4', 'G4', 'Bb4', 'C5', 'G4'];
  const motifBridge = ['C4', 'E4', 'Bb4', 'G4', 'C4'];
  const motifSeparated = ['A3', 'Eb4', 'C4'];
  const motifOffsets = [0.18, 0.98, 1.84, 2.78, 3.48];
  const currentEvents = [];
  for (let bar = 0; bar < totalBars; bar += 1) {
    let note;
    let velocity;
    if (bar < removeStart) {
      note = openingCenter[bar % openingCenter.length];
      velocity = 0.7 + R() * 0.07;
    } else if (bar < rebuildStart) {
      if ((bar - removeStart) % 2 !== 0) {
        continue;
      }
      note = hollowCenter[
        Math.floor((bar - removeStart) / 2) % hollowCenter.length
      ];
      velocity = 0.54 + R() * 0.06;
    } else if (bar < bridgeStart) {
      note = distantCenter[(bar - rebuildStart) % distantCenter.length];
      velocity = 0.64 + R() * 0.08;
    } else if (bar < thinStart) {
      note = commonToneBridge[(bar - bridgeStart) % commonToneBridge.length];
      velocity = 0.68 + R() * 0.08;
    } else if (bar < returnStart) {
      if ((bar - thinStart) % 2 !== 0) {
        continue;
      }
      note = separatedCenters[
        Math.floor((bar - thinStart) / 2) % separatedCenters.length
      ];
      velocity = 0.5 + R() * 0.05;
    } else {
      note = openingCenter[(bar - returnStart) % openingCenter.length];
      velocity = 0.68 + R() * 0.06;
    }
    currentEvents.push([
      bar * barSeconds + H(12),
      {
        note,
        velocity,
        startBar: bar,
        endBar: bar + 1
      }
    ]);
  }
  const currentPart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (
      bar >= event.startBar &&
      bar < event.endBar &&
      bar >= 0 &&
      bar < totalBars
    ) {
      current.triggerAttackRelease(event.note, '2n', time, event.velocity);
    }
  }, currentEvents).start(0);
  const motifEvents = [];
  const addMotif = (startBar, endBar, notes, cutoff, level) => {
    notes.forEach((note, index) => {
      motifEvents.push([
        startBar * barSeconds +
          motifOffsets[index] * beatSeconds +
          H(15),
        {
          note,
          cutoff,
          velocity: level + R() * 0.07,
          startBar,
          endBar
        }
      ]);
    });
  };
  addMotif(0, removeStart, motifA, 1250, 0.62);
  addMotif(removeStart, rebuildStart, motifHollow, 820, 0.47);
  addMotif(rebuildStart, bridgeStart, motifEb, 1680, 0.58);
  addMotif(bridgeStart, thinStart, motifBridge, 2180, 0.66);
  addMotif(thinStart, returnStart, motifSeparated, 980, 0.45);
  addMotif(returnStart, totalBars, motifA, 1250, 0.59);
  const motifPart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (
      bar >= event.startBar &&
      bar < event.endBar &&
      bar >= 0 &&
      bar < totalBars
    ) {
      feltFilter.frequency.setValueAtTime(event.cutoff, time);
      feltKeys.triggerAttackRelease(event.note, '8n', time, event.velocity);
    }
  }, motifEvents).start(0);
  const sandEvents = [];
  for (let bar = 0; bar < totalBars; bar += 2) {
    let cutoff = 520;
    let velocity = 0.18 + R() * 0.05;
    if (bar >= removeStart && bar < rebuildStart) {
      if ((bar - removeStart) % 4 !== 0) {
        continue;
      }
      cutoff = 380;
      velocity = 0.12 + R() * 0.03;
    } else if (bar >= rebuildStart && bar < bridgeStart) {
      cutoff = 690;
      velocity = 0.22 + R() * 0.06;
    } else if (bar >= bridgeStart && bar < thinStart) {
      cutoff = 860;
      velocity = 0.25 + R() * 0.06;
    } else if (bar >= thinStart && bar < returnStart) {
      if ((bar - thinStart) % 4 !== 0) {
        continue;
      }
      cutoff = 440;
      velocity = 0.13 + R() * 0.03;
    } else if (bar >= returnStart) {
      cutoff = 520;
      velocity = 0.17 + R() * 0.04;
    }
    sandEvents.push([
      bar * barSeconds + 0.62 * beatSeconds + H(18),
      {
        cutoff,
        velocity,
        startBar: bar,
        endBar: Math.min(totalBars, bar + 1)
      }
    ]);
  }
  const sandPart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (
      bar >= event.startBar &&
      bar < event.endBar &&
      bar >= 0 &&
      bar < totalBars
    ) {
      sandFilter.frequency.setValueAtTime(event.cutoff, time);
      sandBreath.triggerAttackRelease('2n', time, event.velocity);
    }
  }, sandEvents).start(0);
  const resonanceEvents = [
    [
      0.72 * barSeconds + H(10),
      {
        note: 'A1',
        velocity: 0.46,
        startBar: 0,
        endBar: removeStart
      }
    ],
    [
      rebuildStart * barSeconds + 0.12 * beatSeconds + H(10),
      {
        note: 'Eb1',
        velocity: 0.52,
        startBar: rebuildStart,
        endBar: bridgeStart
      }
    ],
    [
      returnStart * barSeconds + 0.12 * beatSeconds + H(10),
      {
        note: 'A1',
        velocity: 0.42,
        startBar: returnStart,
        endBar: totalBars
      }
    ]
  ];
  const resonancePart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (
      bar >= event.startBar &&
      bar < event.endBar &&
      bar >= 0 &&
      bar < totalBars
    ) {
      deepResonance.triggerAttackRelease(
        event.note,
        '8n',
        time,
        event.velocity
      );
    }
  }, resonanceEvents).start(0);
  window.toneJsInstruments = {
    masterLimiter,
    masterBus,
    currentVolume,
    current,
    feltVolume,
    feltFilter,
    feltKeys,
    sandVolume,
    sandFilter,
    sandBreath,
    resonanceVolume,
    deepResonance
  };
  window.toneJsParts = {
    currentPart,
    motifPart,
    sandPart,
    resonancePart
  };
};


  </script>
    <script src="/lib/mind-audio-player.js"></script>
