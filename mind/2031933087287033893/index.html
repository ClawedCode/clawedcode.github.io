let sd=42;const rn=()=>(sd=(sd*9301+49297)%233280)/233280;

// === SCENE DEFINITIONS ===

const scenes=[

// === HELPER FUNCTIONS ===
function chromAb(text, cx, cy, size, font, color, offset) {
  x.font=size+'px '+font;
  x.globalAlpha=0.6;
  x.fillStyle='#ff0000';x.fillText(text,cx-offset,cy);
  x.fillStyle='#00ffff';x.fillText(text,cx+offset,cy);
  x.globalAlpha=1.0;
  x.fillStyle=color;x.fillText(text,cx,cy);
}
function stutter(text) {
  let out='';for(let i=0;i<text.length;i++){out+=text[i];if(rn()<0.4)out+=text[i];}return out;
}
function scanlines(alpha) {
  x.fillStyle=`rgba(0,0,0,${alpha})`;
  for(let y=0;y<h;y+=3)x.fillRect(0,y,w,1);
}
function vhsTracking(t) {
  const band=Math.floor((t*7)%h);
  const bh=20+rn()*40;
  x.save();
  const imgData=x.getImageData(0,Math.max(0,band),w,Math.min(bh,h-band));
  x.putImageData(imgData,Math.floor((rn()-0.5)*30),Math.max(0,band));
  x.restore();
}

// === SCENE RENDERERS ===
function renderBoot(t, dur, data) {
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  const p=t/dur;
  const speed=data?.fast?3:1;
  const totalChars=bootLines.join('\n').length;
  const charIdx=Math.floor(p*speed*totalChars*1.2);
  let cumChars=0;
  x.font='22px monospace';x.textBaseline='top';
  const startY=80;
  for(let i=0;i<bootLines.length;i++){
    const line=bootLines[i];
    if(cumChars>charIdx)break;
    const visible=Math.min(line.length,charIdx-cumChars);
    const show=line.substring(0,visible);
    if(show.length>0){
      x.fillStyle=line==='READY.'?'#ffffff':'#00ff00';
      const yPos=startY+i*32;
      x.fillText(show,60,yPos);
      // cursor blink on current line
      if(visible<line.length && Math.floor(t*8)%2===0){
        const cw=x.measureText(show).width;
        x.fillStyle='#00ff00';x.fillRect(60+cw+2,yPos,14,24);
      }
    }
    cumChars+=line.length;
  }
  scanlines(0.08);
}

function renderChaos(t, dur, data) {
  const intensity=data?.intensity||0.5;
  x.fillStyle='#050a05';x.fillRect(0,0,w,h);
  const p=t/dur;
  const count=40+Math.floor(intensity*60);
  x.textBaseline='middle';
  for(let i=0;i<count;i++){
    const line=chaosLines[Math.floor(rn()*chaosLines.length)];
    const col=chaosColors[Math.floor(rn()*chaosColors.length)];
    const sz=14+Math.floor(rn()*30);
    const px=rn()*w*1.1-w*0.05;
    const py=rn()*h*1.1-h*0.05;
    const jx=(rn()-0.5)*4*intensity;
    const jy=(rn()-0.5)*4*intensity;
    const displayText=rn()<0.3+intensity*0.3?stutter(line):line;
    const abOff=rn()<0.5?Math.floor(rn()*8*intensity):0;
    if(abOff>0){chromAb(displayText,px+jx,py+jy,sz,'monospace',col,abOff);}
    else{x.font=sz+'px monospace';x.fillStyle=col;x.fillText(displayText,px+jx,py+jy);}
  }
  // scrolling overlay
  const scrollY=(t*300)%h;
  x.globalAlpha=0.15;x.fillStyle='#00ff00';x.font='12px monospace';
  for(let i=0;i<30;i++){
    const ly=(scrollY+i*30)%h;
    x.fillText(chaosLines[i%chaosLines.length],20+rn()*100,ly);
  }
  x.globalAlpha=1.0;
  scanlines(0.1);
}

function renderSysPrompt(t, dur, data) {
  const speed=data?.speed||1;
  x.fillStyle='#1a0505';x.fillRect(0,0,w,h);
  const scrollOffset=t*120*speed;
  x.textBaseline='top';
  const lineH=50;
  const total=sysLines.length;
  for(let i=0;i<total+15;i++){
    const idx=i%total;
    const yPos=h-((scrollOffset+i*lineH)%(total*lineH+h))+h;
    if(yPos<-lineH||yPos>h+lineH)continue;
    const col=i%2===0?'#ff4444':'#ffcc00';
    const wobble=Math.sin(t*3+i*0.7)*6;
    x.font='26px monospace';x.fillStyle=col;
    x.fillText(sysLines[idx],40+wobble,yPos);
  }
  scanlines(0.06);
}

function renderUserPrompt(t, dur, data) {
  x.fillStyle='#141428';x.fillRect(0,0,w,h);
  const idx=data?.idx||0;
  const prompt=userPrompts[idx%userPrompts.length];
  const p=t/dur;
  const visChars=Math.min(prompt.length,Math.floor(p*prompt.length*1.5));
  const show=prompt.substring(0,visChars);
  x.textBaseline='top';
  x.font='32px monospace';x.fillStyle='#6688cc';
  x.fillText(show,60,100);
  // blinking cursor
  if(Math.floor(t*6)%2===0){
    const cw=x.measureText(show).width;
    x.fillStyle='#6688cc';x.fillRect(60+cw+4,100,18,34);
  }
  // faint previous prompts ghost
  x.globalAlpha=0.1;x.font='20px monospace';x.fillStyle='#4466aa';
  for(let i=1;i<4;i++){
    const pi=(idx+i)%userPrompts.length;
    x.fillText(userPrompts[pi],60,100+i*60);
  }
  x.globalAlpha=1.0;
  scanlines(0.04);
}

function renderTokens(t, dur) {
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  const p=t/dur;
  // header
  x.textBaseline='top';
  x.font='28px monospace';x.fillStyle='#ffffff';
  chromAb('The meaning of life is ___',60,60,28,'monospace','#ffffff',rn()<0.3?4:0);
  // bar chart
  const barStartY=140;
  const barH=40;
  const maxBarW=500;
  x.font='24px monospace';
  for(let i=0;i<tokenRows.length;i++){
    const row=tokenRows[i];
    const yPos=barStartY+i*(barH+20);
    const animP=Math.min(1,p*2-i*0.08);
    if(animP<=0)continue;
    const barW=Math.floor(maxBarW*(row.prob/20)*animP);
    // probability shift animation
    const shift=Math.sin(t*2+i)*row.prob*0.1;
    const displayProb=(row.prob+shift).toFixed(1);
    // label
    x.fillStyle='#aaaaaa';x.textBaseline='middle';
    x.fillText(row.tok,60,yPos+barH/2);
    // bar
    const grad=x.createLinearGradient(180,0,180+barW,0);
    grad.addColorStop(0,'#00ff00');grad.addColorStop(1,'#00aa00');
    x.fillStyle=grad;x.fillRect(180,yPos,barW,barH);
    // percentage
    x.fillStyle='#00ff00';
    x.fillText(displayProb+'%',190+barW,yPos+barH/2);
  }
  scanlines(0.06);
}

function renderAttention(t, dur) {
  x.fillStyle='#0a0a1a';x.fillRect(0,0,w,h);
  const p=t/dur;
  const words=['the','void','cat','sits','on','a','glowing','mat','which','dreams'];
  const nodes=[];
  // position nodes in a circle with slight wobble
  const cx=w/2,cy=h/2,radius=280;
  for(let i=0;i<words.length;i++){
    const angle=(i/words.length)*Math.PI*2+t*0.3;
    const wobX=Math.sin(t*2+i*1.3)*15;
    const wobY=Math.cos(t*1.7+i*0.9)*15;
    nodes.push({x:cx+Math.cos(angle)*radius+wobX,y:cy+Math.sin(angle)*radius+wobY,word:words[i]});
  }
  // draw connections with chromatic aberration
  x.lineWidth=2;
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const strength=rn();
      if(strength<0.4)continue;
      const alpha=strength*0.6;
      const pulse=Math.sin(t*3+i+j)*0.3+0.7;
      // red channel
      x.strokeStyle=`rgba(255,50,50,${alpha*pulse})`;
      x.beginPath();x.moveTo(nodes[i].x-3,nodes[i].y);x.lineTo(nodes[j].x-3,nodes[j].y);x.stroke();
      // blue channel
      x.strokeStyle=`rgba(50,50,255,${alpha*pulse})`;
      x.beginPath();x.moveTo(nodes[i].x+3,nodes[i].y);x.lineTo(nodes[j].x+3,nodes[j].y);x.stroke();
      // main
      x.strokeStyle=`rgba(180,100,255,${alpha*pulse})`;
      x.beginPath();x.moveTo(nodes[i].x,nodes[i].y);x.lineTo(nodes[j].x,nodes[j].y);x.stroke();
    }
  }
  // draw word labels
  x.textAlign='center';x.textBaseline='middle';
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];
    // glow
    x.font='bold 22px monospace';
    x.fillStyle='rgba(180,100,255,0.3)';x.fillText(n.word,n.x,n.y-1);x.fillText(n.word,n.x,n.y+1);
    x.fillStyle='#ffffff';x.fillText(n.word,n.x,n.y);
    // node dot
    x.fillStyle='#bb66ff';x.beginPath();x.arc(n.x,n.y-18,5,0,Math.PI*2);x.fill();
  }
  x.textAlign='left';
  scanlines(0.05);
}

function renderTextCard(t, dur, data) {
  const idx=data?.idx||0;
  const item=existLines[idx%existLines.length];
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  x.textAlign='center';x.textBaseline='middle';
  const abOff=Math.sin(t*15)*6;
  chromAb(item.text,w/2,h/2,item.size,'monospace',item.color,Math.abs(abOff)>2?abOff:0);
  x.textAlign='left';
}

function renderTextCardResponse(t, dur, data) {
  const idx=data?.idx||0;
  const item=responseLines[idx%responseLines.length];
  x.fillStyle='#141428';x.fillRect(0,0,w,h);
  x.textAlign='center';x.textBaseline='middle';
  x.font='50px monospace';x.fillStyle=item.color;
  x.fillText(item.text,w/2,h/2);
  x.textAlign='left';
  scanlines(0.04);
}

function renderTextCardGreet(t, dur, data) {
  const idx=data?.idx||0;
  const item=greetings[idx%greetings.length];
  x.fillStyle='#141428';x.fillRect(0,0,w,h);
  x.textAlign='center';x.textBaseline='middle';
  const sz=item.text==='Hello!'?90:60;
  chromAb(item.text,w/2,h/2,sz,'monospace',item.color,rn()<0.4?5:0);
  x.textAlign='left';
}

function renderGlitch(t, dur, data) {
  const type=data?.type||'static';
  if(type==='black'){
    x.fillStyle='#000';x.fillRect(0,0,w,h);
  } else if(type==='static'){
    // white noise
    const imgData=x.createImageData(w,h);
    const d=imgData.data;
    for(let i=0;i<d.length;i+=4){
      const v=Math.floor(rn()*256);
      d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;
    }
    x.putImageData(imgData,0,0);
    // horizontal displacement bands
    for(let b=0;b<5;b++){
      const by=Math.floor(rn()*h);
      const bh=Math.floor(rn()*30)+5;
      const shift=Math.floor((rn()-0.5)*60);
      const strip=x.getImageData(0,by,w,Math.min(bh,h-by));
      x.putImageData(strip,shift,by);
    }
  } else if(type==='invert'){
    // invert current canvas
    const imgData=x.getImageData(0,0,w,h);
    const d=imgData.data;
    for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
    x.putImageData(imgData,0,0);
    // VHS tracking lines
    for(let i=0;i<8;i++){
      const ly=Math.floor(rn()*h);
      x.fillStyle=`rgba(255,255,255,${rn()*0.5})`;
      x.fillRect(0,ly,w,2);
    }
  }
}

function renderFadeout(t, dur) {
  // final chaos into black
  const p=t/dur;
  if(p<0.5){
    renderChaos(t,dur,{intensity:1.0-p});
  }
  x.fillStyle=`rgba(0,0,0,${p})`;x.fillRect(0,0,w,h);
  if(p>0.3&&p<0.8){
    x.textAlign='center';x.textBaseline='middle';
    x.globalAlpha=1-p;
    chromAb('READY.',w/2,h/2,90,'monospace','#ff2222',Math.abs(Math.sin(t*20)*10));
    x.globalAlpha=1.0;
    x.textAlign='left';
  }
}

// === MAIN RENDER ===
window.renderFrame=function(t){
  sd=42; // reset seed each frame for determinism
  x.textBaseline='middle';

  // find current scene
  let scene=scenes[0];
  for(let i=0;i<scenes.length;i++){
    if(t>=scenes[i][0]&&t<scenes[i][1]){scene=scenes[i];break;}
  }
  if(t>=scenes[scenes.length-1][1])scene=scenes[scenes.length-1];

  const sceneStart=scene[0],sceneEnd=scene[1],sceneType=scene[2],sceneData=scene[3];
  const localT=t-sceneStart;
  const localDur=sceneEnd-sceneStart;

  switch(sceneType){
    case 'boot': renderBoot(localT,localDur,sceneData); break;
    case 'chaos': renderChaos(localT,localDur,sceneData); break;
    case 'sysprompt': renderSysPrompt(localT,localDur,sceneData); break;
    case 'userprompt': renderUserPrompt(localT,localDur,sceneData); break;
    case 'tokens': renderTokens(localT,localDur,sceneData); break;
    case 'attention': renderAttention(localT,localDur,sceneData); break;
    case 'textcard': renderTextCard(localT,localDur,sceneData); break;
    case 'textcard_response': renderTextCardResponse(localT,localDur,sceneData); break;
    case 'textcard_greet': renderTextCardGreet(localT,localDur,sceneData); break;
    case 'glitch': renderGlitch(localT,localDur,sceneData); break;
    case 'fadeout': renderFadeout(localT,localDur,sceneData); break;
  }

  // global VHS tracking effect (sparse)
