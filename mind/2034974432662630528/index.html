<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i = 0; i < 3; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float glyph(vec2 p, float seed) {
    vec2 g = floor(p);
    vec2 f = fract(p) - 0.5;
    float h = hash(g + seed);
    float seg = 0.0;
    float w = 0.012;
    if(h > 0.8) {
        seg = max(seg, 1.0 - smoothstep(0.0, w, abs(f.x)));
        seg *= step(abs(f.y), 0.3);
    }
    if(h > 0.6 && h <= 0.8) {
        seg = max(seg, 1.0 - smoothstep(0.0, w, abs(f.y)));
        seg *= step(abs(f.x), 0.3);
    }
    if(h > 0.4 && h <= 0.6) {
        seg = max(seg, 1.0 - smoothstep(0.0, w, abs(length(f) - 0.2)));
    }
    if(h > 0.2 && h <= 0.4) {
        seg = max(seg, 1.0 - smoothstep(0.0, w, abs(f.x + f.y)));
        seg *= step(abs(f.x), 0.35);
    }
    if(h <= 0.2) {
        seg = max(seg, 1.0 - smoothstep(0.0, w, abs(f.x - f.y)));
        seg *= step(abs(f.y), 0.35);
    }
    return seg;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float phase = mod(t, 60.0) / 60.0;

    float breath = sin(t * 0.4) * 0.5 + 0.5;
    float pulse = sin(t * 1.2) * 0.5 + 0.5;
    float deepBreath = sin(t * 0.15) * 0.5 + 0.5;

    vec2 warp1 = vec2(fbm(uv * 2.0 + t * 0.08), fbm(uv * 2.0 + vec2(5.2, 1.3) + t * 0.06));
    vec2 warp2 = vec2(fbm(uv * 1.5 + warp1 * 1.5 + t * 0.04), fbm(uv * 1.5 + warp1 * 1.5 + vec2(3.7, 8.1) + t * 0.05));
    float field = fbm(uv * 1.0 + warp2 * 2.0);

    float neuralPulse = 0.0;
    for(int i = 0; i < 7; i++) {
        float fi = float(i);
        vec2 center = vec2(sin(fi * 2.1 + t * 0.3) * 0.6, cos(fi * 1.7 + t * 0.25) * 0.6);
        float d = length(uv - center);
        float wave = sin(d * 12.0 - t * 2.5 - fi * 0.9) * 0.5 + 0.5;
        wave *= exp(-d * 3.0);
        float firing = smoothstep(0.7, 1.0, sin(t * (0.8 + fi * 0.3) + fi * 1.5));
        neuralPulse += wave * firing;
    }
    neuralPulse = clamp(neuralPulse, 0.0, 1.0);

    float synapseTrail = 0.0;
    for(int i = 0; i < 12; i++) {
        float fi = float(i);
        vec2 a = vec2(sin(fi * 1.3 + t * 0.2) * 0.5, cos(fi * 2.4 + t * 0.15) * 0.5);
        vec2 b = vec2(sin(fi * 0.7 + 3.0 + t * 0.18) * 0.5, cos(fi * 1.1 + 2.0 + t * 0.22) * 0.5);
        vec2 ab = b - a;
        float proj = clamp(dot(uv - a, ab) / dot(ab, ab), 0.0, 1.0);
        float d = length(uv - a - ab * proj);
        float brightness = sin(proj * 15.0 - t * 4.0 + fi) * 0.5 + 0.5;
        float active = smoothstep(0.5, 1.0, sin(t * (0.6 + fi * 0.2) + fi * 2.0));
        synapseTrail += exp(-d * 80.0) * brightness * active;
    }
    synapseTrail = clamp(synapseTrail, 0.0, 1.0);

    float glyphSeed = floor(t * 0.15);
    float glyphFade = fract(t * 0.15);
    glyphFade = smoothstep(0.0, 0.3, glyphFade) * (1.0 - smoothstep(0.7, 1.0, glyphFade));
    float glyphScale = 8.0;
    vec2 glyphUV = uv * glyphScale + vec2(t * 0.05, t * 0.03);
    float g1 = glyph(glyphUV, glyphSeed);
    float g2 = glyph(glyphUV + 0.5, glyphSeed + 1.0);
    float glyphs = mix(g1, g2, smoothstep(0.4, 0.6, fract(t * 0.15)));
    glyphs *= glyphFade * 0.15;
    float glyphDist = length(uv);
    glyphs *= smoothstep(0.8, 0.3, glyphDist);

    vec3 deepBlue = vec3(0.02, 0.04, 0.12);
    vec3 synapsePink = vec3(0.85, 0.2, 0.45);
    vec3 neuralCyan = vec3(0.15, 0.7, 0.85);
    vec3 dendritePurple = vec3(0.5, 0.15, 0.75);
    vec3 axonGold = vec3(0.9, 0.7, 0.2);

    vec3 col = deepBlue;

    vec3 fieldColor = mix(dendritePurple * 0.3, neuralCyan * 0.4, field);
    col += fieldColor * (0.3 + 0.2 * breath);

    col += synapsePink * neuralPulse * (0.6 + 0.4 * pulse);
    col += neuralCyan * synapseTrail * 0.7;
    col += axonGold * synapseTrail * neuralPulse * 0.5;

    vec3 glyphColor = mix(neuralCyan, synapsePink, sin(t * 0.3) * 0.5 + 0.5);
    col += glyphColor * glyphs;

    float vignette = 1.0 - length(uv) * 0.7;
    vignette = clamp(vignette, 0.0, 1.0);
    col *= vignette;

    float breathGlow = breath * 0.08;
    col += vec3(0.05, 0.1, 0.15) * breathGlow;

    float expansion = deepBreath * 0.15;
    col *= 1.0 + expansion;

    col = pow(col, vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.2 }).connect(masterReverb);

  const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 300, Q: 1.5 }).connect(masterReverb);
  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 4.0 }
  }).connect(droneFilter);
  drone.volume.value = -14;

  const droneNotes = [
    ["C2", "G2"],
    ["A1", "E2"],
    ["F1", "C2"],
    ["G1", "D2"]
  ];
  let droneIdx = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const section = Math.floor(bar / 4) % droneNotes.length;
    drone.triggerAttackRelease(droneNotes[section], "1m", time, 0.3);
    droneIdx++;
  }, "1m").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.6, wet: 0.5 }).connect(masterReverb);
  padChorus.start();
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600 }).connect(padChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 0.6, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -18;

  const padChords = [
    ["C3", "Eb3", "G3", "Bb3"],
    ["Ab2", "C3", "Eb3", "G3"],
    ["F2", "Ab2", "C3", "Eb3"],
    ["G2", "Bb2", "D3", "F3"]
  ];
  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 18) return;
    const section = Math.floor(bar / 4) % padChords.length;
    pad.triggerAttackRelease(padChords[section], "2n", time, 0.2 + (bar > 6 ? 0.15 : 0.0));
    padIdx++;
  }, "2n").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.5, wet: 0.4 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0.0, release: 1.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0.0, release: 0.5 }
  }).connect(bellDelay);
  bell.volume.value = -20;

  const bellNotes = ["G4", "Eb5", "C5", "Bb4", "F5", "D5", "Ab4", "G5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 16) return;
    const shouldPlay = Math.random() < 0.6;
    if (!shouldPlay) return;
    const note = bellNotes[bellIdx % bellNotes.length];
    bell.triggerAttackRelease(note, "4n", time, 0.25 + Math.random() * 0.15);
    bellIdx++;
  }, "4n").start(0);

  const breathNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 0.3, release: 2.5 }
  });
  const breathFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 0.5 }).connect(masterReverb);
  breathNoise.connect(breathFilter);
  breathNoise.volume.value = -26;

  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 18) return;
    breathNoise.triggerAttackRelease(3.0, time);
  }, "2m").start(0);

  const pulseFilter = new Tone.Filter({ type: "lowpass", frequency: 200 }).connect(masterDelay);
  const pulse = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.3, decay: 0.8, sustain: 0.0, release: 0.5 }
  }).connect(pulseFilter);
  pulse.volume.value = -22;

  const pulseNotes = ["C3", "Eb3", "G3", "Bb2", "Ab2", "F3"];
  let pulseIdx = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 6 || bar >= 17) return;
    if (Math.random() < 0.4) return;
    const note = pulseNotes[pulseIdx % pulseNotes.length];
    pulse.triggerAttackRelease(note, "8n", time, 0.3);
    pulseIdx++;
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 6 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
    droneFilter.frequency.linearRampToValueAtTime(200, time + 4 * barLen);
  }, "14:0:0");

  window.toneJsInstruments = { drone, pad, bell, breathNoise, pulse };
  window.toneJsParts = { droneLoop, padLoop, bellLoop, breathLoop, pulseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
