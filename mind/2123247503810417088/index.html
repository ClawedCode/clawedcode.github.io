  // ---------------------------------------------------------------- field on a tile: inner nodes, then a ghost ring
  const makeGrids = () => ({ u: Array.from({ length: NT }, () => new Float32Array(SZ * SZ)), gx: Array.from({ length: NT }, () => new Float32Array(SZ * SZ)), gy: Array.from({ length: NT }, () => new Float32Array(SZ * SZ)) });
  const GCAT = makeGrids(), GBLANK = makeGrids();
  const INNER = [];
  for (let i = 0; i <= n; i++) for (let j = 0; j + i <= n; j++) INNER.push(gid(i, j));

  function loadCat(frame) {

      const row = T6[j];
      for (let m = 0; m < NT; m++) {
        const w = row[m] / 6, U = GCAT.u[m];

    }
  }
  function finishGrids(G, perms) {
    for (let t = 0; t < NT; t++) {

      const s0 = perms[COLOUR_OF_SIDE[0]][t], s1 = perms[COLOUR_OF_SIDE[1]][t], s2 = perms[COLOUR_OF_SIDE[2]][t];
      const V0 = G.u[s0], V1 = G.u[s1], V2 = G.u[s2];
      for (let i = 0; i <= n; i++) U[gid(i, -1)] = i + 1 > n ? 0 : (s0 === t ? -U[gid(i, 1)] : V0[gid(i, 1)]);
      for (let j = 0; j <= n; j++) U[gid(-1, j)] = j + 1 > n ? 0 : (s1 === t ? -U[gid(1, j)] : V1[gid(1, j)]);
      for (let i = 0; i <= n + 1; i++) {
        const j = n + 1 - i;
        const ii = n - j, jj = n - i;
        if (ii < 0 || jj < 0) { U[gid(i, j)] = 0; continue; }

      }
    }
    for (let t = 0; t < NT; t++) {
      const U = G.u[t], X = G.gx[t], Y = G.gy[t];
      for (let c = 0; c < INNER.length; c++) {
        const g = INNER[c];
        X[g] = (U[g + SZ] - U[g - SZ]) * 0.5;
        Y[g] = (U[g + 1] - U[g - 1]) * 0.5;
      }
      // the far ghost diagonal only feeds bilinear samples: copy its neighbour's slope
      for (let i = 0; i <= n + 1; i++) {
        const j = n + 1 - i;
        const g = gid(i, j);
        const src = i > 0 ? gid(i - 1, j) : gid(i, j - 1);
        X[g] = X[src]; Y[g] = Y[src];
      }
    }
  }

  // ---------------------------------------------------------------- lacquer: a matcap read by the skin's slope
  const LUTS = 256;
  const lutFull = new Float32Array(LUTS * LUTS * 3);
  const lutCrest = new Float32Array(LUTS * LUTS * 3);
  const lut = new Uint32Array(LUTS * LUTS);
  (() => {
    const lobe = (nx, ny, nz, lx, ly, lz, p) => Math.pow(Math.max(0, nx * lx + ny * ly + nz * lz), p);
    for (let y = 0; y < LUTS; y++) {
      for (let x = 0; x < LUTS; x++) {
        const nx = (x - 127.5) / 127.5, ny = (y - 127.5) / 127.5;
        const r2 = Math.min(1, nx * nx + ny * ny), nz = Math.sqrt(1 - r2);
        const q = (y * LUTS + x) * 3;
        // Black lacquer in a dark studio: a flat skin reflects almost nothing and only a tilt finds a light.
        // A long softbox high to the left, a thin cold strip across the lower right, one small warm lamp, and a faint room.
        const r = Math.sqrt(r2);
        const box = (cx, cy, hw, hh, rot, edge) => {
          const c = Math.cos(rot), s = Math.sin(rot);
          const dx = (nx - cx) * c + (ny - cy) * s, dy = -(nx - cx) * s + (ny - cy) * c;
          return smooth((hw - Math.abs(dx)) / edge) * smooth((hh - Math.abs(dy)) / edge);
        };
        const soft = box(-0.3, -0.34, 0.22, 0.06, -0.72, 0.045) * (0.45 + 0.55 * smooth((0.56 - r) / 0.2));
        const strip = box(0.3, 0.3, 0.46, 0.022, -0.72, 0.016);
        const strip2 = box(-0.36, 0.26, 0.2, 0.014, 0.74, 0.012);

        lutFull[q + 2] = room * (1.0 - 0.17 * warm) + 0.9 * soft + 0.98 * strip + 0.68 * strip2 + 0.34 * lamp;

  // ---------------------------------------------------------------- background
  const W = 900, H = 900;
  const img = ctx.createImageData(W, H);
  const pix = new Uint32Array(img.data.buffer);

  for (let y = 0; y < H; y++) {

    for (let f = ECHO_FROM - 3; f < ECHO_TO; f++) {

  const READ = new Float32Array(FRAMES * K);
  for (let f = 0; f < FRAMES; f++) {
    const base = f * M;

  // ---------------------------------------------------------------- the blank's spectrum, measured on its own Laplacian

  const BLANK_LAM = new Float64Array(K);
  let transplantResidual = 0;
  {
    const q = SZ * SZ;

    for (let kk = 0; kk < K; kk++) {
      const phi = SPEC.vecs[kk];
      w.fill(0);
      for (let j = 0; j < NT; j++) {
        for (let c = 0; c < INNER.length; c++) {
          const g = INNER[c], tk = BLANK.key[j * q + g];
          if (tk < 0) continue;
          let val = 0;
          for (let m = 0; m < NT; m++) { const ck = CAT.key[m * q + g]; if (ck >= 0) val += T6[j][m] / 6 * phi[ck]; }

        }
      }
      applyL(BLANK, w, o);
      let num = 0, den = 0, res = 0;
      for (let k = 0; k < BLANK.M; k++) { num += w[k] * o[k]; den += w[k] * w[k]; }
      BLANK_LAM[kk] = num / den;
      for (let k = 0; k < BLANK.M; k++) { const d = o[k] - BLANK_LAM[kk] * w[k]; res += d * d; }
      transplantResidual = Math.max(transplantResidual, Math.sqrt(res / den));
    }
  }

  // ---------------------------------------------------------------- pose helpers
  const matrixFor = (L, P) => {
    const u = P.S / n;
    return [L.a[0] * u, L.a[1] * u, L.b[0] * u, L.b[1] * u, P.cx + L.o[0] * P.S, P.cy + L.o[1] * P.S];

  const unit = (L) => [L.a[0], L.a[1], L.b[0], L.b[1]];
  const mixPose = (A, B, k) => ({ cx: lerp(A.cx, B.cx, k), cy: lerp(A.cy, B.cy, k), S: lerp(A.S, B.S, k) });
  const HERO = { cx: 450, cy: 438, S: 168 };
  const BLANK_HERO = { cx: 450, cy: 568, S: 168 };
  const PROOF_CAT = { cx: 192, cy: 366, S: 100 };
  const PROOF_BLANK = { cx: 632, cy: 366, S: 100 };

  // Rigid part of a flight from layout A to layout B: a turn in the plane plus a flip through the third dimension.
  const flightKey = (LA, LB) => {
    const a = LA.a, b = LA.b, c = LB.a, d = LB.b;
    const det0 = a[0] * b[1] - a[1] * b[0];
    const i00 = b[1] / det0, i01 = -b[0] / det0, i10 = -a[1] / det0, i11 = a[0] / det0;
    const r00 = c[0] * i00 + d[0] * i10, r01 = c[0] * i01 + d[0] * i11, r10 = c[1] * i00 + d[1] * i10, r11 = c[1] * i01 + d[1] * i11;
    const det = r00 * r11 - r01 * r10;
    return { alpha: Math.atan2(r10, r00), flips: det < 0 ? 1 : 2 };
  };
  const MATCH = TAB.match;
  const FLIGHT_C2B = MATCH.map((j, i) => flightKey(LAYOUT.cat[i], LAYOUT.blank[j]));
  const FLIGHT_B2C = MATCH.map((j, i) => flightKey(LAYOUT.blank[j], LAYOUT.cat[i]));
  const centroid = (L) => [L.o[0] + (L.a[0] + L.b[0]) / 3, L.o[1] + (L.a[1] + L.b[1]) / 3];
  const ORDER_DOWN = MATCH.map((_, i) => i).sort((p, q) => centroid(LAYOUT.cat[q])[1] - centroid(LAYOUT.cat[p])[1]);
  const RANK = new Array(NT); ORDER_DOWN.forEach((tile, rank) => { RANK[tile] = rank; });

  function flyTile(GA, tA, LA, PA, GB, tB, LB, PB, key, s, lift) {
    const e = smooth(s);
    const phi = Math.PI * key.flips * e;
    const cosPhi = Math.cos(phi);
    const scale = lerp(PA.S, PB.S, e) * (1 + 0.1 * Math.sin(Math.PI * s));
    const al = key.alpha * e, ca = Math.cos(al), sa = Math.sin(al);
    // Rot(al) * diag(1, cos phi) applied to A's unit axes
    const ax = LA.a[0], ay = LA.a[1] * cosPhi, bx = LA.b[0], by = LA.b[1] * cosPhi;
    const r = [ca * ax - sa * ay, sa * ax + ca * ay, ca * bx - sa * by, sa * bx + ca * by];
    const c0 = centroid(LA), c1 = centroid(LB);
    const x0 = PA.cx + c0[0] * PA.S, y0 = PA.cy + c0[1] * PA.S, x1 = PB.cx + c1[0] * PB.S, y1 = PB.cy + c1[1] * PB.S;
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    const arc = lift * Math.sin(Math.PI * s);
    const mx = lerp(x0, x1, e) - dy / len * arc, my = lerp(y0, y1, e) + dx / len * arc;
    const u = scale / n;
    const m = [r[0] * u, r[1] * u, r[2] * u, r[3] * u, 0, 0];
    m[4] = mx - (m[0] + m[2]) * n / 3;
    m[5] = my - (m[1] + m[3]) * n / 3;
    const swapAt = key.flips === 1 ? 0.5 : 0.25;
    const useB = e >= swapAt;
    const shade = 0.42 + 0.58 * Math.abs(cosPhi);
    drawTile(useB ? GB : GA, useB ? tB : tA, m, r, shade);
    return { m, edge: Math.sin(Math.PI * s) };
  }

  const SIDES_OF_TILE = (key, t) => {
    const perms = key === 'cat' ? TAB.permsCat : TAB.permsBlank;
    return SIDE_ENDS.map(([p, q], s) => ({ p, q, wall: perms[COLOUR_OF_SIDE[s]][t] === t }));
  };

  function strokeTile(key, t, P, wallAlpha, doorAlpha, width) {
    const tri = TAB[key][t];
    for (const side of SIDES_OF_TILE(key, t)) {
      const al = side.wall ? wallAlpha : doorAlpha;
      if (al <= 0.004) continue;
      ctx.strokeStyle = `rgba(232,196,132,${al.toFixed(3)})`;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(P.cx + tri[side.p][0] * P.S, P.cy + tri[side.p][1] * P.S);
      ctx.lineTo(P.cx + tri[side.q][0] * P.S, P.cy + tri[side.q][1] * P.S);
      ctx.stroke();
    }
  }

  function strokeEdges(m, alpha) {
    if (alpha <= 0.004) return;
    const [a, b, c, d, e, f] = m;
    ctx.strokeStyle = `rgba(232,196,132,${alpha.toFixed(3)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(e, f);
    ctx.lineTo(e + a * n, f + b * n);
    ctx.lineTo(e + c * n, f + d * n);
    ctx.closePath();
    ctx.stroke();
  }

  // ---------------------------------------------------------------- a slit-eyed lacquer eye, drawn on the skin or in the air
  function eye(x, y, r, open, slit, gx, gy) {
    if (open <= 0.012) return;
    ctx.save();
    ctx.translate(x, y);
    // a soft amber halo so the eye reads at phone size and in the dark
    const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.1);
    halo.addColorStop(0, `rgba(255,170,60,${(0.2 * open).toFixed(3)})`);
    halo.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(-r * 2.2, -r * 2.2, r * 4.4, r * 4.4);
    ctx.beginPath();
    const h = r * 0.74 * open;
    ctx.moveTo(-r, 0);
    ctx.bezierCurveTo(-r * 0.45, -h * 1.28, r * 0.45, -h * 1.28, r, 0);
    ctx.bezierCurveTo(r * 0.45, h * 1.28, -r * 0.45, h * 1.28, -r, 0);
    ctx.closePath();
    ctx.fillStyle = '#050406';
    ctx.fill();
    ctx.clip();
    const ix = gx * r * 0.22, iy = gy * r * 0.12;
    const g = ctx.createRadialGradient(ix, iy, r * 0.05, ix, iy, r * 0.98);
    g.addColorStop(0, '#ffe08a');
    g.addColorStop(0.42, '#f7ab38');
    g.addColorStop(0.78, '#b4610f');
    g.addColorStop(1, '#311705');
    ctx.fillStyle = g;
    ctx.fillRect(-r * 1.2, -r, r * 2.4, r * 2);
    ctx.fillStyle = '#040305';
    ctx.beginPath();
    const px = gx * r * 0.34, py = gy * r * 0.16, w = r * (0.06 + 0.52 * slit);
    ctx.moveTo(px, py - r * 0.8);
    ctx.bezierCurveTo(px + w, py - r * 0.26, px + w, py + r * 0.26, px, py + r * 0.8);
    ctx.bezierCurveTo(px - w, py + r * 0.26, px - w, py - r * 0.26, px, py - r * 0.8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,246,224,0.9)';
    ctx.beginPath();
    ctx.ellipse(px - r * 0.3, py - r * 0.24, r * 0.1, r * 0.075, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------- nose and whiskers, painted on the cat alone
  const nearestNode = (x, y) => {
    let best = 0, bd = 1e9;
    for (let k = 0; k < M; k++) { const d = (POS[k * 2] - x) ** 2 + (POS[k * 2 + 1] - y) ** 2; if (d < bd) { bd = d; best = k; } }
    return best;
  };
  const WHISKERS = [];
  for (const side of [-1, 1]) {
    [[0.98, 1.74, 0.72], [1.1, 1.84, 1.12], [1.21, 1.72, 1.5]].forEach(([y0, x1, y1], w) => {
      const root = [side * 0.3, y0], tip = [side * x1, y1];
      WHISKERS.push({ root, tip, node: nearestNode(root[0] * 1.6, root[1]), side, w });
    });
  }
  function face(P, alpha, frame) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.9, P.S / 120);
    ctx.strokeStyle = `rgba(236,226,206,${(0.62 * alpha).toFixed(3)})`;
    for (const wh of WHISKERS) {
      const sway = FIELD[frame * M + wh.node] / FSCALE * 0.34;
      const x0 = P.cx + wh.root[0] * P.S, y0 = P.cy + wh.root[1] * P.S;
      const x1 = P.cx + wh.tip[0] * P.S, y1 = P.cy + (wh.tip[1] + sway) * P.S;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 - 0.1 * P.S, x1, y1);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(216,132,108,${(0.95 * alpha).toFixed(3)})`;
    const nx = P.cx, ny = P.cy + 0.96 * P.S, ns = 0.1 * P.S;
    ctx.beginPath();
    ctx.moveTo(nx - ns, ny - ns * 0.55);
    ctx.quadraticCurveTo(nx, ny - ns * 0.8, nx + ns, ny - ns * 0.55);
    ctx.quadraticCurveTo(nx + ns * 0.3, ny + ns * 0.5, nx, ny + ns * 0.72);
    ctx.quadraticCurveTo(nx - ns * 0.3, ny + ns * 0.5, nx - ns, ny - ns * 0.55);
    ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------- the readout: the only thing a listener ever has
  const RULER_X0 = 70, RULER_X1 = 830, RULER_Y = 866;
  const LOGMAX = Math.log(RATIO[K - 1]);
  const rungX = (k) => RULER_X0 + (RULER_X1 - RULER_X0) * Math.log(RATIO[k]) / LOGMAX;
  const FIRST_HEARD = new Array(K).fill(Infinity);
  for (const e of EVENTS) if (e.kind === 'mode' && e.role === 'bell' && e.t >= 2 * BAR && e.t < FIRST_HEARD[e.k]) FIRST_HEARD[e.k] = e.t;
  const LAST_BELL = EVENTS.filter((e) => e.kind === 'mode' && e.role === 'bell');
  const bellAt = (t) => { let c = LAST_BELL[LAST_BELL.length - 1]; for (const e of LAST_BELL) { if (e.t <= t) c = e; else break; } return c; };

  function ruler(t, frame, alphaAll, reveal) {
    ctx.save();
    ctx.lineCap = 'butt';
    for (let k = 0; k < K; k++) {
      const seen = reveal ? seg(t, FIRST_HEARD[k] - 0.02, FIRST_HEARD[k] + 0.08) : 1;
      const al = alphaAll * Math.max(seen, 0);
      if (al <= 0.01) continue;
      const amp = clamp(READ[frame * K + k] * 2.1, 0, 1);
      const h = 6 + 34 * Math.pow(amp, 0.8);
      const x = rungX(k);
      ctx.strokeStyle = `rgba(${Math.round(190 + 60 * amp)},${Math.round(186 + 8 * amp)},${Math.round(170 - 100 * amp)},${(al * (0.5 + 0.5 * amp)).toFixed(3)})`;
      ctx.lineWidth = 1.6 + 1.5 * amp;
      ctx.beginPath();
      ctx.moveTo(x, RULER_Y);
      ctx.lineTo(x, RULER_Y - h);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- when things happen, in bars
  const B_DARK = 2, B_LIGHT = 6.75, B_DROP = 7;
  const RETILE_A = 12, RETILE_B = 14;
  const SPLIT_A = 15, SPLIT_B = 16.5;
  const RETURN_A = 19.5, RETURN_B = 20.75;

  window.renderFrame = function (time) {
    let t = time % DURATION; if (t < 0) t += DURATION;
    const frame = Math.round(t * FPS) % FRAMES;
    const tq = frame / FPS;
    const b = tq / BAR, six = b * 16;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    pix.set(BG);

    const lit = 1 - seg(b, B_DARK, B_DARK + 0.5) + seg(b, B_LIGHT, B_DROP);
    setLut(clamp(lit, 0, 1));
    SLOPE = lerp(SLOPE_DARK, SLOPE_LIT, clamp(lit, 0, 1));
    voidK = 1 - clamp(lit, 0, 1);
    loadCat(frame);
    finishGrids(GCAT, TAB.permsCat);
    const blankOn = b >= RETILE_A && b < RETURN_B + 0.02;
    if (blankOn) { loadBlank(); finishGrids(GBLANK, TAB.permsBlank); }

    // the cat's and the blank's poses for this moment
    const splitK = seg(b, SPLIT_A, SPLIT_A + 1);
    const blankPose = mixPose(BLANK_HERO, PROOF_BLANK, splitK);
    const returnK = seg(b, RETURN_A, RETURN_B - 0.1);
    const catPose = b >= SPLIT_A ? mixPose(PROOF_CAT, HERO, returnK) : HERO;
    const flying = [];

    if (b < RETILE_A || b >= RETURN_B) {
      LAYOUT.cat.forEach((L, c) => drawTile(GCAT, c, matrixFor(L, catPose), unit(L), 1));
    } else if (b < SPLIT_A) {
      // the cat becomes the blank, one tile per sixteenth or so, chin first and the long ear last. The score does not change.
      const start = RETILE_A * 16, len = 7, spread = (RETILE_B - RETILE_A) * 16 - len;
      for (let i = 0; i < NT; i++) {
        const j = MATCH[i];
        const s = clamp((six - start - Math.floor(RANK[i] * spread / (NT - 1))) / len, 0, 1);
        if (s <= 0) drawTile(GCAT, i, matrixFor(LAYOUT.cat[i], HERO), unit(LAYOUT.cat[i]), 1);
        else if (s >= 1) drawTile(GBLANK, j, matrixFor(LAYOUT.blank[j], BLANK_HERO), unit(LAYOUT.blank[j]), 1);
        else flying.push(flyTile(GCAT, i, LAYOUT.cat[i], HERO, GBLANK, j, LAYOUT.blank[j], BLANK_HERO, FLIGHT_C2B[i], s, 70));
      }
    } else {
      // a copy of the blank's tiles leaves it and builds the cat again beside it
      if (b < RETURN_A) {
        for (let j = 0; j < NT; j++) drawTile(GBLANK, j, matrixFor(LAYOUT.blank[j], blankPose), unit(LAYOUT.blank[j]), 1);
        const start = (SPLIT_A + 0.25) * 16, len = 7, spread = (SPLIT_B - SPLIT_A - 0.25) * 16 - len;
        for (let i = 0; i < NT; i++) {
          const j = MATCH[i];
          const s = clamp((six - start - Math.floor(RANK[i] * spread / (NT - 1))) / len, 0, 1);
          if (s >= 1) drawTile(GCAT, i, matrixFor(LAYOUT.cat[i], PROOF_CAT), unit(LAYOUT.cat[i]), 1);
          else if (s > 0) flying.push(flyTile(GBLANK, j, LAYOUT.blank[j], blankPose, GCAT, i, LAYOUT.cat[i], PROOF_CAT, FLIGHT_B2C[i], s, 40));
        }
      } else {
        // the blank goes back into the cat, tile by tile, while the cat comes forward
        const start = RETURN_A * 16, len = 6, spread = (RETURN_B - RETURN_A) * 16 - len;
        for (let i = 0; i < NT; i++) {
          const j = MATCH[i];
          const s = clamp((six - start - Math.floor(RANK[NT - 1 - i] * spread / (NT - 1))) / len, 0, 1);
          if (s <= 0) drawTile(GBLANK, j, matrixFor(LAYOUT.blank[j], PROOF_BLANK), unit(LAYOUT.blank[j]), 1);
        }
        LAYOUT.cat.forEach((L, c) => drawTile(GCAT, c, matrixFor(L, catPose), unit(L), 1));
        for (let i = 0; i < NT; i++) {
          const j = MATCH[i];
          const s = clamp((six - start - Math.floor(RANK[NT - 1 - i] * spread / (NT - 1))) / len, 0, 1);
          if (s > 0 && s < 1) flying.push(flyTile(GBLANK, j, LAYOUT.blank[j], PROOF_BLANK, GCAT, i, LAYOUT.cat[i], catPose, FLIGHT_B2C[i], s, 50));
        }
      }
    }
    ctx.putImageData(img, 0, 0);

    // walls. In the dark each stretch appears when an echo first reaches it, and that is all anyone knows of the outline.
    ctx.lineCap = 'round';
    if (b < RETILE_A || b >= RETURN_B) {
      if (b >= B_DARK && b < B_DROP) {
        const fadeOld = 1 - seg(b, B_DARK, B_DARK + 0.42);
        const all = seg(b, B_LIGHT - 0.04, B_LIGHT + 0.1);
        const buckets = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
        const P = catPose;
        for (const w of WALL_BITS) {
          const known = Math.max(fadeOld, all, frame >= w.hit ? 0.25 + 0.75 * seg(frame, w.hit, w.hit + 10) : 0);
          if (known <= 0.01) continue;
          const q = Math.min(3, Math.floor(known * 3.999));
          buckets[q].moveTo(P.cx + w.ax * P.S, P.cy + w.ay * P.S);
          buckets[q].lineTo(P.cx + w.bx * P.S, P.cy + w.by * P.S);
        }
        const A = [0.3, 0.5, 0.72, 0.95];
        ctx.lineWidth = 2.1;
        buckets.forEach((path, q) => { ctx.strokeStyle = `rgba(232,196,132,${A[q]})`; ctx.stroke(path); });
      } else {
        for (let c = 0; c < NT; c++) strokeTile('cat', c, catPose, 0.92, 0, 2.1);
      }
    } else if (b < SPLIT_A) {
      const start = RETILE_A * 16, len = 7, spread = (RETILE_B - RETILE_A) * 16 - len;
      for (let i = 0; i < NT; i++) {
        const j = MATCH[i];
        const s = clamp((six - start - Math.floor(RANK[i] * spread / (NT - 1))) / len, 0, 1);
        const door = 0.34 * (seg(b, RETILE_A, RETILE_A + 0.1) * (1 - seg(b, RETILE_B, RETILE_B + 0.2)));
        if (s <= 0) strokeTile('cat', i, HERO, 0.92, door, 2.1);
        else if (s >= 1) strokeTile('blank', j, BLANK_HERO, 0.92, door, 2.1);
      }
    } else {
      const wid = 2.1 * blankPose.S / 168 + 0.7;
      if (b < RETURN_A) {
        for (let j = 0; j < NT; j++) strokeTile('blank', j, blankPose, 0.92, 0, wid);
        const start = (SPLIT_A + 0.25) * 16, len = 7, spread = (SPLIT_B - SPLIT_A - 0.25) * 16 - len;
        for (let i = 0; i < NT; i++) {
          const s = clamp((six - start - Math.floor(RANK[i] * spread / (NT - 1))) / len, 0, 1);
          if (s >= 1) strokeTile('cat', i, PROOF_CAT, 0.92, 0.26 * (1 - seg(b, SPLIT_B, SPLIT_B + 0.25)), wid);
        }
      } else {
        const start = RETURN_A * 16, len = 6, spread = (RETURN_B - RETURN_A) * 16 - len;
        for (let i = 0; i < NT; i++) {
          const s = clamp((six - start - Math.floor(RANK[NT - 1 - i] * spread / (NT - 1))) / len, 0, 1);
          if (s <= 0) strokeTile('blank', MATCH[i], PROOF_BLANK, 0.92, 0.28, wid);
          strokeTile('cat', i, catPose, 0.92, 0, 2.1 * catPose.S / 168 + 0.7 * (1 - returnK));
        }
      }
    }
    for (const f of flying) strokeEdges(f.m, 0.85 * f.edge + 0.15);

    // the painted face belongs to the cat alone; the blank has nothing painted on it
    const faceAlpha = (1 - seg(b, B_DARK, B_DARK + 0.3)) * (b < B_DARK + 1 ? 1 : 0) + (b >= B_LIGHT && b < RETILE_A ? seg(b, B_LIGHT, B_LIGHT + 0.25) : 0)
      + (b >= RETILE_A ? (1 - seg(b, RETILE_A, RETILE_A + 0.5)) * (b < SPLIT_A ? 1 : 0) : 0) + (b >= SPLIT_B ? seg(b, SPLIT_B - 0.1, SPLIT_B + 0.2) : 0);
    face(catPose, clamp(faceAlpha, 0, 1), frame);

    // the eyes stay when everything else has gone
    const eyesOf = (P) => ({ x: P.cx, y: P.cy - 0.02 * P.S, d: 0.7071 * P.S, r: 0.205 * P.S });
    const home = eyesOf(catPose), heroEyes = eyesOf(HERO), AIR = { x: 450, y: 214, d: 94, r: 30 };
    let eyes = home;
    if (b >= RETILE_A + 0.5 && b < SPLIT_A + 0.5) {
      const up = seg(b, RETILE_A + 0.5, RETILE_B);
      eyes = { x: 450, y: lerp(heroEyes.y, AIR.y, up), d: lerp(heroEyes.d, AIR.d, up), r: lerp(heroEyes.r, AIR.r, up) };
    } else if (b >= SPLIT_A + 0.5) {
      const k = seg(b, SPLIT_A + 0.5, SPLIT_B);
      eyes = { x: lerp(AIR.x, home.x, k), y: lerp(AIR.y, home.y, k), d: lerp(AIR.d, home.d, k), r: lerp(AIR.r, home.r, k) };
    }
    let open = 1;
    open *= 1 - seg(b, B_DARK, B_DARK + 0.14);
    if (b >= B_DARK + 0.14) open = seg(b, B_LIGHT - 0.1, B_LIGHT + 0.05);
    if (b >= 14.55 && b < 15.72) open = 1 - seg(b, 14.55, 14.92);
    else if (b >= 15.72 && b < 16.2) open = seg(b, 15.72, 16.05);
    // two quick blinks so it is plainly alive
    for (const bl of [9.5, 11.0, 17.75]) open *= 1 - 0.96 * (seg(b, bl, bl + 0.035) * (1 - seg(b, bl + 0.05, bl + 0.09)));
    // gaze: at you, except that it inspects the blank, twice
    let gx = 0, gy = 0;
    const lookDown = seg(b, 13.9, 14.05) * (1 - seg(b, 14.45, 14.55));
    gy += 1 * lookDown;
    const lookAcross = seg(b, 17.1, 17.2) * (1 - seg(b, 17.62, 17.72)) + seg(b, 18.6, 18.7) * (1 - seg(b, 19.1, 19.2));
    gx += 1 * lookAcross;
    const slit = 0.16 + 0.34 * lookDown + 0.25 * seg(b, B_LIGHT, B_DROP) * (1 - seg(b, B_DROP, B_DROP + 0.5));
    eye(eyes.x - eyes.d, eyes.y, eyes.r, open, slit, gx, gy);
    eye(eyes.x + eyes.d, eyes.y, eyes.r, open, slit, gx, gy);

    // the proof: the note on the skin, as each drum's own Laplacian measures it
    const proof = seg(b, SPLIT_B - 0.1, SPLIT_B + 0.25) * (1 - seg(b, RETURN_A, RETURN_A + 0.2));
    if (proof > 0.01) {
      const e = bellAt(tq);
      const left = LAM[e.k].toFixed(10), right = BLANK_LAM[e.k].toFixed(10);
      ctx.save();
      ctx.globalAlpha = proof;
      ctx.font = '500 29px Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      const y = 730;
      const glow = Math.exp(-(tq - e.t) * 3.2);
      ctx.fillStyle = `rgb(${Math.round(226 + 26 * glow)},${Math.round(216 - 10 * glow)},${Math.round(196 - 90 * glow)})`;
      ctx.fillText(left, PROOF_CAT.cx, y);
      ctx.fillText(right, PROOF_BLANK.cx, y);
      ctx.fillStyle = '#f7ab38';
      ctx.font = '500 33px Menlo, Consolas, monospace';
      ctx.fillText('=', (PROOF_CAT.cx + PROOF_BLANK.cx) / 2, y + 1);
      ctx.fillStyle = 'rgba(205,197,180,0.8)';
      ctx.font = '400 15px Menlo, Consolas, monospace';
      ctx.fillText(`note ${e.k + 1}`, PROOF_CAT.cx, y + 27);
      ctx.fillText(`note ${e.k + 1}`, PROOF_BLANK.cx, y + 27);
