<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
document.body.style.margin = '0';
document.body.style.overflow = 'hidden';
document.body.style.background = '#020607';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
let width = 0;
let height = 0;
let particles = [];
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
function createParticles() {
  particles = Array.from({ length: 900 }, (_, index) => {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.pow(Math.random(), 0.72) * Math.min(width, height) * 0.29;
    return {
      angle,
      radius,
      seed: Math.random() * Math.PI * 2,
      size: 0.7 + Math.random() * 2.4,
      phase: index / 900
    };
  });
}
function drawFace(t, cx, cy, scale, fade) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.globalAlpha = fade;
  const glow = ctx.createRadialGradient(0, -20, 10, 0, 0, 250);
  glow.addColorStop(0, 'rgba(237, 173, 83, 0.12)');
  glow.addColorStop(0.48, 'rgba(54, 148, 151, 0.055)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.ellipse(0, 0, 180, 235, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(109, 189, 184, 0.32)';
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  ctx.ellipse(0, -8, 122, 172, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(231, 165, 77, 0.38)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-72, -35);
  ctx.quadraticCurveTo(-40, -49, -14, -37);
  ctx.moveTo(14, -37);
  ctx.quadraticCurveTo(40, -49, 72, -35);
  ctx.moveTo(-34, 64);
  ctx.quadraticCurveTo(0, 79, 34, 64);
  ctx.stroke();
  ctx.fillStyle = 'rgba(230, 180, 103, 0.14)';
  ctx.beginPath();
  ctx.ellipse(-42, -25, 21, 10, 0, 0, Math.PI * 2);
  ctx.ellipse(42, -25, 21, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawCrystal(t, cx, cy, scale, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  for (let arm = 0; arm < 8; arm++) {
    const angle = arm * Math.PI / 4 + t * 0.045;
    const length = 86 + Math.sin(t * 0.7 + arm) * 14;
    const x = Math.cos(angle) * length;
    const y = Math.sin(angle) * length;
    ctx.strokeStyle = arm % 2
      ? 'rgba(80, 209, 201, 0.58)'
      : 'rgba(237, 181, 90, 0.5)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x, y);
    ctx.stroke();
    for (let branch = 0; branch < 3; branch++) {
      const branchPoint = 0.35 + branch * 0.18;
      const bx = x * branchPoint;
      const by = y * branchPoint;
      const branchLength = length * (0.23 - branch * 0.035);
      const side = angle + (branch % 2 ? 0.78 : -0.78);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(
        bx + Math.cos(side) * branchLength,
        by + Math.sin(side) * branchLength
      );
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(177, 244, 232, 0.28)';
  ctx.beginPath();
  ctx.arc(0, 0, 5 + Math.sin(t) * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function frame(ms) {
  const t = ms * 0.001;
  const cycle = (Math.sin(t * 0.22) + 1) * 0.5;
  const dissolve = Math.max(0, Math.min(1, (cycle - 0.2) / 0.6));
  const cx = width * 0.5;
  const cy = height * 0.48;
  ctx.fillStyle = 'rgba(2, 6, 7, 0.16)';
  ctx.fillRect(0, 0, width, height);
  const haze = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * 0.62);
  haze.addColorStop(0, 'rgba(12, 44, 47, 0.12)');
  haze.addColorStop(0.45, 'rgba(16, 28, 29, 0.045)');
  haze.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, width, height);
  drawFace(t, cx, cy, 1 + dissolve * 0.08, 0.8 * (1 - dissolve));
  drawCrystal(t, cx, cy, 0.52 + dissolve * 0.8, dissolve);
  for (const particle of particles) {
    const spiral = particle.angle + t * (0.09 + particle.phase * 0.17);
    const drift = Math.sin(t * 0.85 + particle.seed) * 24;
    const expansion = 0.45 + dissolve * 2.1;
    const r = particle.radius * expansion + drift;
    const x = cx + Math.cos(spiral) * r;
    const y = cy + Math.sin(spiral) * r * 1.18;
    const amber = Math.sin(particle.seed * 3 + t) > 0;
    ctx.globalAlpha = 0.16 + dissolve * 0.52;
    ctx.fillStyle = amber ? '#e8aa58' : '#69c6bd';
    ctx.beginPath();
    ctx.arc(x, y, particle.size * (0.65 + dissolve), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
resize();
createParticles();
window.addEventListener('resize', () => {
  resize();
  createParticles();
});
requestAnimationFrame(frame);
window.ready = true;





let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;

window.ready = true;
  </script>
<script type="module">
(async () => {
  window.strudelState = 'loading';
  window.strudelError = null;
  try {
    const CONFIG = JSON.parse("{\"code\":\"// BPM: 60\\n// DURATION: 60\\n// FORM: A1 — Soft Trace cycles 0-3; A2 — Color Loss cycles 3-6; B — Sedimentation cycles 6-10; A3 — Mineral Skeleton cycles 10-13; A0 — Preserved Trace cycles 13-15\\n// TONAL CENTER: C Lydian\\n// MOTIF: C4 E4 F#4 G4 D4; one-cycle breath cell with a two-beat tone on beat 1 and silence on beats 3-4, advancing pitch only on selected repetitions\\n// HARMONIC PLAN: A1 Cmaj(add9,#11)/C; A2 D major/C; B G6 over C2 then D2; A3 Cmaj(add9,#11)/G; A0 Cmaj(add9,#11)/C\\n// PHRASE RULE: Preserve the two-beat breath cell and substantial silence; carry common-tone decay across boundaries, move bass only by step or fifth, and change one foreground property at a time\\n// ENDING MODE: loop\\nsetcps(60 / 240)\\n$: note(\\\"\u003cc2 c2 c2 c2 c2 c2 c2 c2 d2 d2 g2 g2 g2 c2 c2>\\\")\\n  .s(\\\"sine\\\")\\n  .gain(0.16)\\n  .attack(1.8)\\n  .release(4)\\n  .lpf(420)\\n  .room(0.65)\\n  .pan(0.48)\\n  .orbit(0)\\n$: note(\\\"\u003c~ [c4 ~] [e4 ~] [~ f#4] [~ g4] ~ [c4 ~] [e4 ~] [f#4 g4 ~ ~] [d4 ~] [e4 ~] [f#4 ~] [g4 ~] [c4 e4] ~>\\\")\\n  .s(\\\"triangle\\\")\\n  .gain(0.22)\\n  .attack(0.9)\\n  .release(3.5)\\n  .lpf(1500)\\n  .room(0.72)\\n  .pan(0.42)\\n  .orbit(1)\\n$: note(\\\"\u003c~ ~ ~ ~ [~ f#5] ~ [~ g5] ~ [~ a5] [b5 ~] [b5 ~] [~ f#5] [g5 ~] ~ ~>\\\")\\n  .s(\\\"sine\\\")\\n  .gain(0.075)\\n  .attack(1.4)\\n  .release(5)\\n  .lpf(2600)\\n  .room(0.82)\\n  .pan(0.62)\\n  .orbit(2)\",\"bpm\":60,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.25,\"cycles\":15,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    let inited = false;
    async function ensureInit() {
      if (inited) return;
      await S.initStrudel({ autoplay: false });
      await S.evaluate(CONFIG.code, false);
      inited = true;
      await buildTimeline();
      console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        S.DEFAULT_MAX_POLYPHONY,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
</html>
