<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float hash1(float n) {
    return fract(sin(n) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    vec2 shift = vec2(100.0);
    for (float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = p * 2.0 + shift;
        a *= 0.5;
    }
    return v;
}

vec3 palette(float t, float warm) {
    vec3 indigo = vec3(0.25, 0.15, 0.65);
    vec3 cyan = vec3(0.2, 0.5, 0.8);
    vec3 amber = vec3(0.95, 0.65, 0.2);
    vec3 gold = vec3(1.0, 0.85, 0.4);
    vec3 cool = mix(indigo, cyan, smoothstep(-1.0, 1.0, sin(t * 6.28)));
    vec3 hot = mix(amber, gold, smoothstep(-1.0, 1.0, cos(t * 4.0)));
    return mix(cool, hot, warm);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;
    float warmth = smoothstep(0.0, 1.0, phase);

    vec3 col = vec3(0.02, 0.01, 0.04);

    float breathe = 0.85 + 0.15 * sin(t * 0.8);

    float nodeGlow = 0.0;
    float threadGlow = 0.0;
    vec3 nodeCol = vec3(0.0);
    vec3 threadCol = vec3(0.0);

    for (float i = 0.0; i < 40.0; i++) {
        float id = i * 0.1;
        float angle = hash1(i * 7.3) * 6.28 + t * (0.1 + hash1(i * 3.1) * 0.15);
        float radius = 0.15 + hash1(i * 13.7) * 0.55;
        radius *= breathe;

        vec2 nodePos = vec2(cos(angle), sin(angle)) * radius;
        nodePos += vec2(
            sin(t * 0.3 + i * 0.7) * 0.08,
            cos(t * 0.25 + i * 1.1) * 0.08
        );

        float activity = 0.3 + 0.7 * pow(sin(t * (0.5 + hash1(i * 2.3) * 1.5) + i) * 0.5 + 0.5, 3.0);

        float d = length(uv - nodePos);
        float glow = activity * 0.012 / (d * d + 0.003);
        float bright = activity * 0.004 / (d + 0.01);

        float nWarm = warmth + hash1(i * 5.0) * 0.2 - 0.1;
        vec3 nCol = palette(id + t * 0.05, clamp(nWarm, 0.0, 1.0));

        nodeGlow += glow;
        nodeCol += nCol * (glow + bright);

        for (float j = 0.0; j < 5.0; j++) {
            float ji = mod(i + j * 7.0 + 3.0, 40.0);
            float angle2 = hash1(ji * 7.3) * 6.28 + t * (0.1 + hash1(ji * 3.1) * 0.15);
            float radius2 = 0.15 + hash1(ji * 13.7) * 0.55;
            radius2 *= breathe;
            vec2 nodePos2 = vec2(cos(angle2), sin(angle2)) * radius2;
            nodePos2 += vec2(
                sin(t * 0.3 + ji * 0.7) * 0.08,
                cos(t * 0.25 + ji * 1.1) * 0.08
            );

            float conn = hash(vec2(i, ji));
            if (conn > 0.6) {
                vec2 closest = nodePos + clamp(dot(uv - nodePos, nodePos2 - nodePos) / dot(nodePos2 - nodePos, nodePos2 - nodePos), 0.0, 1.0) * (nodePos2 - nodePos);
                float ld = length(uv - closest);

                float pulse = sin(t * 2.0 + length(nodePos - nodePos2) * 8.0 + i) * 0.5 + 0.5;
                pulse *= activity * 0.5 + 0.5;

                float threadD = pulse * 0.0015 / (ld + 0.002);
                vec3 tCol = palette(conn + t * 0.03, warmth);
                threadGlow += threadD;
                threadCol += tCol * threadD;
            }
        }
    }

    col += threadCol * 0.4;
    col += nodeCol * 0.6;

    float burst = 0.0;
    for (float k = 0.0; k < 5.0; k++) {
        float bTime = hash1(k * 17.0) * 60.0;
        float dt = mod(t - bTime + 60.0, 60.0);
        if (dt < 2.0) {
            vec2 bPos = vec2(
                hash1(k * 31.0) * 1.2 - 0.6,
                hash1(k * 47.0) * 1.2 - 0.6
            ) * 0.5;
            float bDist = length(uv - bPos);
            float wave = sin(bDist * 20.0 - dt * 8.0) * 0.5 + 0.5;
            float fade = exp(-dt * 2.0) * exp(-bDist * 4.0);
            burst += wave * fade * 0.5;
        }
    }
    vec3 burstCol = palette(t * 0.1, warmth) * 1.5;
    col += burstCol * burst;

    float glitchLine = step(0.97, hash(vec2(floor(uv.y * 80.0), floor(t * 3.0))));
    float glitchBlock = step(0.993, hash(vec2(floor(t * 7.0), floor(uv.y * 20.0))));
    col += vec3(0.3, 0.5, 0.8) * glitchLine * 0.15 * (1.0 - warmth);
    col += vec3(0.8, 0.4, 0.2) * glitchBlock * 0.2 * warmth;

    vec2 warp = uv + vec2(
        fbm(uv * 3.0 + t * 0.15) - 0.5,
        fbm(uv * 3.0 + vec2(5.0) + t * 0.12) - 0.5
    ) * 0.03;
    float bg = fbm(warp * 2.0 + t * 0.05) * 0.08;
    col += palette(bg + t * 0.02, warmth) * bg;

    float vignette = 1.0 - dot(uv, uv) * 0.8;
    col *= smoothstep(0.0, 0.5, vignette);

    col = pow(col, vec3(0.9));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 68;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const masterReverb = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
    await masterReverb.generate();
    const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
    const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(padFilter);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 1.5, decay: 1.0, sustain: 0.5, release: 2.5 }
    }).connect(padChorus);

    const coolChords = [
        ["E3", "B3", "D4"],
        ["C3", "G3", "B3"],
        ["A2", "E3", "G3"],
        ["D3", "A3", "C4"]
    ];
    const warmChords = [
        ["F3", "A3", "C4"],
        ["G3", "B3", "D4"],
        ["A3", "C4", "E4"],
        ["D3", "F3", "A3"]
    ];

    let padIndex = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        const progress = bar / 20;
        const chords = progress < 0.5 ? coolChords : warmChords;
        const idx = padIndex % chords.length;
        const vol = bar < 2 ? 0.08 : (bar >= 18 ? 0.08 : 0.14);
        pad.triggerAttackRelease(chords[idx], "1n", time, vol);
        padIndex++;
    }, "1n").start(0);

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(1800, time + 10 * barLen);
    }, "4:0:0");
    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
    }, "16:0:0");

    const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);
    const bell = new Tone.FMSynth({
        harmonicity: 3.01,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 1.8, sustain: 0, release: 1.0 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.3 }
    }).connect(bellFilter);

    const synapseNotes = ["B4", "E5", "G5", "D5", "A4", "C5", "F5", "B5"];
    const warmNotes = ["A4", "C5", "F5", "D5", "G4", "E5", "A5", "F4"];
    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 2 || bar >= 19) { bellIndex++; return; }

        const progress = bar / 20;
        const shouldPlay = Math.random() < (0.3 + progress * 0.4);
        if (!shouldPlay) { bellIndex++; return; }

        const notes = progress < 0.5 ? synapseNotes : warmNotes;
        const note = notes[bellIndex % notes.length];
        const vel = 0.15 + Math.random() * 0.2;
        bell.triggerAttackRelease(note, "4n", time, vel * (bar >= 17 ? 0.4 : 1.0));
        bellIndex++;
    }, "4n").start(0);

    const pulseFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2 }).connect(masterReverb);
    const pulse = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
    }).connect(pulseFilter);

    const pulseNotes = ["E3", "B3", "G3", "D3", "A3", "C4"];
    let pulseIndex = 0;
    const pulseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 4 || bar >= 17) { pulseIndex++; return; }

        const beat = pulseIndex % 8;
        const pattern = [1, 0, 0, 1, 0, 1, 0, 0];
        if (!pattern[beat]) { pulseIndex++; return; }

        const note = pulseNotes[pulseIndex % pulseNotes.length];
        pulse.triggerAttackRelease(note, "16n", time, 0.25);
        pulseIndex++;
    }, "8n").start(0);

    const subBass = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.3, decay: 0.5, sustain: 0.4, release: 1.0 },
        filterEnvelope: { attack: 0.1, decay: 0.3, sustain: 0.3, baseFrequency: 60, octaves: 1 }
    }).connect(masterReverb);

    const bassNotes1 = ["E2", "C2", "A1", "D2"];
    const bassNotes2 = ["F2", "G2", "A2", "D2"];
    let bassIndex = 0;
    const bassLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 3 || bar >= 18) { bassIndex++; return; }

        const progress = bar / 20;
        const notes = progress < 0.5 ? bassNotes1 : bassNotes2;
        const note = notes[bassIndex % notes.length];
        subBass.triggerAttackRelease(note, "2n", time, 0.3);
        bassIndex++;
    }, "2n").start(0);

    const glitchNoise = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.01 }
    }).connect(new Tone.Filter({ type: "bandpass", frequency: 4000, Q: 5 }).connect(masterReverb));

    let glitchCount = 0;
    const glitchLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 6 || bar >= 16) { glitchCount++; return; }
        if (Math.random() < 0.85) { glitchCount++; return; }
        glitchNoise.triggerAttackRelease("32n", time, 0.15);
        glitchCount++;
    }, "16n").start(0);

    const burstBell = new Tone.FMSynth({
        harmonicity: 5.0,
        modulationIndex: 15,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.6, sustain: 0, release: 0.4 },
        modulation: { type: "sine" }
    }).connect(masterDelay);

    Tone.Transport.schedule((time) => {
        const notes = ["E5", "G5", "B5", "D6"];
        notes.forEach((n, i) => {
            burstBell.triggerAttackRelease(n, "8n", time + i * 0.08, 0.2);
        });
    }, "8:2:0");

    Tone.Transport.schedule((time) => {
        const notes = ["A5", "C6", "F5", "A5"];
        notes.forEach((n, i) => {
            burstBell.triggerAttackRelease(n, "8n", time + i * 0.1, 0.18);
        });
    }, "13:0:0");

    window.toneJsInstruments = { pad, bell, pulse, subBass, glitchNoise, burstBell };
    window.toneJsParts = { padLoop, bellLoop, pulseLoop, bassLoop, glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
