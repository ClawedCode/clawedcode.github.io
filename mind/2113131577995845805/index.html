// camBegin(cx, cy, zoom, rot): world point (cx, cy) lands at screen centre. One level; always pair with camEnd().
let CAM = false;
function camBegin(cx = CX, cy = CY, zoom = 1, rot = 0) { push(); translate(CX, CY); rotate(rot); scale(zoom); translate(-cx, -cy); CAM = true; }
function camEnd() { if (CAM) { pop(); CAM = false; } }

// ---------- lettering (hand-lettered marker, composited after the shot) ----------
const FONT_LETTER = '"Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive';
const FONT_CAPTION = '"Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive';
let LETTERS = [];
// Letters follow the current transform (camera, push/translate) unless { screen: true }.
function letter(txt, x, y, size, color = PAL.cream, o = {}) {
  let rot = o.rot || 0;
  if (!o.screen) {
    const m = ctx.getTransform(), p = m.transformPoint({ x, y });
    x = p.x; y = p.y; size *= Math.sqrt(Math.abs(m.a * m.d - m.b * m.c)); rot += Math.atan2(m.b, m.a);
  }
  LETTERS.push({ ...o, txt: String(txt), x, y, size, color, rot, ga: ctx.globalAlpha });
}
// Comic sound effect: pops in at age 0, wobbles, fades by `life` seconds.
function sfx(txt, x, y, size, color, age, o = {}) {
  const life = o.life ?? 1.2; if (age < 0 || age > life) return;
  letter(txt, x, y, size, color, { pop: age * 5, rot: (o.rot ?? -.08) + Math.sin(age * 20) * .03 * (1 - age / life), alpha: 1 - seg(age, life - .25, life), ...o });
}
function flushLetters() {
  if (!LETTERS.length) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const L of LETTERS) {
    const k = L.pop != null ? backOut(L.pop) : 1; if (k <= .01 || L.size < 1) continue;
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.rot); ctx.scale(k, k);
    ctx.globalAlpha = (L.ga ?? 1) * clamp(L.alpha ?? 1);
    ctx.font = `${L.size}px ${L.font || FONT_LETTER}`;
    ctx.textAlign = L.align || 'center'; ctx.textBaseline = 'middle';
    if (L.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = L.size * .12; ctx.strokeStyle = L.stroke; ctx.strokeText(L.txt, 0, 0); }
    if (L.ink !== false) { ctx.fillStyle = PAL.ink; ctx.fillText(L.txt, L.size * .045, L.size * .055); }
    ctx.fillStyle = L.color; ctx.fillText(L.txt, 0, 0);
    ctx.restore();
  }
  ctx.restore();
  LETTERS = [];
}

// ---------- full-frame effects (screen space, whatever the camera is doing) ----------
function flash(k, col = '#FFFDF6') {
  if (k <= .01) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = clamp(k); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore();
}
// Paint everything OUTSIDE a closed outline (irises, keyholes, eye- or mouth-shaped reveals).
function irisShape(pts, col = PAL.ink) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.beginPath(); ctx.rect(-60, -60, W + 120, H + 120);
  ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath();
  ctx.fillStyle = col; ctx.fill('evenodd');
  _stroke(pts, 'ink', PAL.ink, 1.1, true);
  ctx.restore();
}
function iris(cx, cy, r, col = PAL.ink) { if (r < 3) flash(1, col); else irisShape(ellPts(cx, cy, r, r, 48), col); }

// ---------- the set: skies, stars, sunbursts ----------
// Horizontal watercolour bands from the first colour (top) to the last (bottom).
// Oversized on every side so a camera push, pan or tilt never finds bare paper.
function skyWash(cols, o = {}) {
  const n = cols.length, y0 = o.y ?? -300, span = o.h ?? H + 600, h = span / Math.max(1, n - 1);
  paint(rectPts(-400, y0, W + 800, span), { wash: cols[Math.floor(n / 2)], ink: null });
  for (let i = 0; i < n; i++) paint(rectPts(-420, y0 + (i - .5) * h, W + 840, h * 1.25, 18), { fill: cols[i], fillOp: o.op ?? 190, bleed: .08, tex: o.tex ?? .5, border: .25, ink: null });
}
// Deterministic stars: positions from hash(seed), a twinkle on the beat.
function stars(seed, n, o = {}) {
  const x0 = o.x ?? 0, y0 = o.y ?? 0, w = o.w ?? W, h = o.h ?? H, r = o.r ?? 5, col = o.col || PAL.cream;
  for (let i = 0; i < n; i++) {
    const x = x0 + hash(seed + i * 3.1) * w, y = y0 + hash(seed + i * 7.7 + 1) * h, s = r * (.4 + hash(seed + i * 1.3) * .9);
    const tw = .65 + .35 * Math.sin(T * (2 + hash(i + seed) * 3) + i) + (o.beat ? .5 * pulse(T + hash(i) * .2, 8) : 0);
    if (s * tw > r * .9) paint(starPts(x, y, s * tw * 1.8, .3, 4), { wash: col, washOp: 235, ink: null });
    else paint(ellPts(x, y, s * tw * .6, s * tw * .6, 6), { wash: col, washOp: 210, ink: null });
  }
}
// Rotating rays in alternating colours.
function sunburst(cx, cy, a, b, rot = 0, n = 16, r = 1500, op = 140) {
  for (let i = 0; i < n; i++) {
    const a0 = rot + i / n * TAU, a1 = rot + (i + 1) / n * TAU;
    paint([[cx, cy], [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r]], { wash: i % 2 ? a : b, washOp: op, ink: null });
  }
  paint(ellPts(cx, cy, r * .3, r * .3, 30), { fill: a, fillOp: op * .5, bleed: .3, tex: .3, border: .1, ink: null });
}

// ---------- the void cat ----------
// voidCat(x, y, u, o): (x, y) is the ground point between the feet; u is the unit.
// Sitting, the cat is ~7.6u wide and ~13u tall to the ear tips; the head spans y -11.3u..-5.5u.
// Body-local space (for the o.draw hook): x -4u..4u, ground at y 0, up is negative.
// Front legs double as arms: they pivot at (±2.4u, -5.2u), 4.6u long, and o.pawL / o.pawR draw at the paw.
function voidCat(x, y, u, o = {}) {
  const dy = (o.dy || 0) * u, sq = (o.sq || 0) + (o.take || 0);
  const sw = clamp(u / 14, .45, 2.6) * (o.swMul || 1), J = u * .05, seed = o.seed || 0;
  const col = o.col || PAL.fur, dk = o.dk || PAL.furDk, lt = o.lt || PAL.furLt;
  if (!o.noShadow) {
    const f = 1 - Math.min(.5, Math.abs(o.dy || 0) * .05);
    paint(ellPts(x, y + u * .2, u * 4.4 * f, u * .85 * f, 22), { fill: PAL.ink, fillOp: 80, bleed: .25, tex: .3, border: .1, ink: null });
  }
  if (o.aura) {
    const ac = o.auraCol || PAL.aurora, k = clamp(o.aura);
    glow(x, y + dy - 6.5 * u, 11 * u * (.7 + .3 * k), ac, .55 * k);
    paint(ellPts(x, y + dy - 6.5 * u, 8.5 * u, 8.5 * u, 30), { fill: ac, fillOp: 90 * k, bleed: .3, tex: .3, border: .5, ink: null });
  }
  push();
  translate(x, y + dy);
  if (o.rot) rotate(o.rot);
  scale((o.flip ? -1 : 1) * (o.sx ?? 1) * (1 + sq * .6), (o.sy ?? 1) * (1 - sq));

  // tail, behind everything
  const tp = o.tail ?? (T * 1.1 + seed * .37), tw = Math.sin(tp * TAU) * .9, tu = o.tailUp ?? 0;
  tube([[2.4 * u, -1.1 * u], [4.3 * u, -.9 * u], [5.5 * u + tw * .3 * u, -2.6 * u - tu * u], [5.3 * u + tw * .8 * u, -4.9 * u - tu * 1.6 * u], [4.3 * u + tw * 1.4 * u, -6.1 * u - tu * 2 * u]],
    1.25 * u, .75 * u, { wash: col, fill: dk, fillOp: 70, tex: .5, ink: PAL.ink, sw: sw * .8 });

  // hind haunches and feet
  for (const s of [-1, 1]) {
    paint(ellPts(s * 2.3 * u, -1.7 * u, 1.55 * u, 1.45 * u, 16, J), { wash: col, fill: dk, fillOp: 70, tex: .5, ink: PAL.ink, sw: sw * .75 });
    const lift = o.walk != null ? Math.max(0, Math.sin((o.walk + (s > 0 ? .5 : 0)) * TAU)) * .7 * u : 0;
    paint(ellPts(s * 2.6 * u, -.35 * u - lift, 1.05 * u, .5 * u, 12, J * .6), { wash: lt, ink: PAL.ink, sw: sw * .6 });
  }

  // body: flat fur so it reads, a lighter pool high on the chest, a darker settle low, ink last
  const body = []; for (let i = 0; i < 26; i++) { const a = i / 26 * TAU; body.push([Math.cos(a) * 3.2 * u * (1 + .12 * Math.sin(a)) + jit(J), -3.5 * u + Math.sin(a) * 3.4 * u + jit(J)]); }
  paint(body, { wash: col, ink: null });
  push(); _path(body); ctx.clip();
  paint(ellPts(-.9 * u, -4.9 * u, 1.8 * u, 1.3 * u, 16, J * 2, -.2), { fill: lt, fillOp: 130, bleed: .2, tex: .8, border: .7, ink: null });
  paint(ellPts(.6 * u, .2 * u, 4.2 * u, 2.1 * u, 18, J), { fill: dk, fillOp: 110, bleed: .12, tex: .7, border: .4, ink: null });
  pop();
  paint(body, { ink: PAL.ink, sw });
  // galaxies in the fur: a void cat is full of small lights
  if (o.stars !== false) for (let i = 0; i < 6; i++) {
    const a = hash(seed * 13 + i * 5.3) * TAU, r = Math.sqrt(hash(seed * 7 + i * 2.1)) * 2.4 * u, sx = Math.cos(a) * r, sy = -3.6 * u + Math.sin(a) * r * .9;
    const tw = .6 + .4 * Math.sin(T * 3 + i * 1.7);
    paint(starPts(sx, sy, u * .32 * tw, .32, 4), { wash: i % 2 ? PAL.cream : (o.eyeCol || PAL.eye), washOp: 220, ink: null });
  }

  // front legs / arms: 0 = out sideways, + raised, - down (default hangs to the ground)
  const arm = (side, a, hook) => {
    push(); translate(side * 2.4 * u, -5.2 * u); rotate(side < 0 ? Math.PI - a : a); if (side < 0) scale(1, -1);
    paint(rrPts(-.2 * u, -.66 * u, 4.8 * u, 1.32 * u, .64 * u, J * .5), { wash: col, fill: dk, fillOp: 50, tex: .5, ink: PAL.ink, sw: sw * .75 });
    paint(ellPts(4.5 * u, 0, .78 * u, .7 * u, 12, J * .5), { wash: lt, ink: PAL.ink, sw: sw * .6 });
    if (hook) { translate(4.6 * u, 0); if (side < 0) scale(1, -1); hook(u, sw); }
    pop();
  };
  const aL = o.aL ?? -1.42, aR = o.aR ?? -1.42;
  arm(-1, -aL, o.pawL); arm(1, -aR, o.pawR);

  // head: ears first so the head overlaps their base
  const ear = o.ear || PAL.ear;
  for (const s of [-1, 1]) {
    const e = (o.ears ?? 0) * .6 * u;
    paint([[s * 3.2 * u, -9.2 * u], [s * (2.9 * u + e), -12.9 * u + Math.abs(e) * .3], [s * .9 * u, -10.8 * u]], { wash: col, ink: PAL.ink, sw: sw * .8 });
    paint([[s * 2.75 * u, -9.6 * u], [s * (2.65 * u + e * .8), -12.1 * u + Math.abs(e) * .3], [s * 1.5 * u, -10.6 * u]], { wash: ear, washOp: 200, ink: null });
  }
  const head = []; for (let i = 0; i < 26; i++) { const a = i / 26 * TAU; head.push([Math.cos(a) * 3.55 * u * (1 + .1 * Math.max(0, Math.sin(a))) + jit(J), -8.4 * u + Math.sin(a) * 2.9 * u + jit(J)]); }
  paint(head, { wash: col, ink: null });
  push(); _path(head); ctx.clip();
  paint(ellPts(-1.3 * u, -9.9 * u, 1.7 * u, .9 * u, 14, J * 2, -.15), { fill: lt, fillOp: 110, bleed: .2, tex: .8, border: .7, ink: null });
  paint(ellPts(.8 * u, -5.6 * u, 3.6 * u, 1.2 * u, 16, J), { fill: dk, fillOp: 80, bleed: .12, tex: .6, border: .3, ink: null });
  pop();
  paint(head, { ink: PAL.ink, sw });
  if (o.blush) for (const bx of [-2.3, 2.3]) paint(ellPts(bx * u, -7.4 * u, u * .7, u * .35, 12), { fill: PAL.rose, fillOp: 160, bleed: .2, ink: null });
  _catEyes(u, o, sw);
  paint([[-.42 * u, -7.95 * u], [.42 * u, -7.95 * u], [0, -7.5 * u]], { wash: o.nose || PAL.rose, ink: PAL.ink, sw: sw * .4 });
  _catMouth(u, o.mouth ?? 'cat', sw);
  for (const s of [-1, 1]) for (let k = -1; k <= 1; k++) inkLine([[s * 1.7 * u, -7.5 * u + k * .3 * u], [s * 3.4 * u, -7.7 * u + k * .55 * u], [s * 5 * u, -7.5 * u + k * 1.1 * u]], sw * .35, o.whisker || PAL.cream, 'inkfine', .4);
  _catHat(u, o.hat, sw);
  if (o.draw) o.draw(u, sw);
  pop();
  if (o.emote) emote(o.emote, x + (o.flip ? -1 : 1) * 4.8 * u, y + dy - 12.6 * u, u * .9, o.emoteK ?? 1);
}

function _catMouth(u, m, sw) {
  const y = -7.2 * u;
  if (m === 'cat') inkLine([[-.9 * u, y - .15 * u], [-.45 * u, y + .3 * u], [0, y - .15 * u], [.45 * u, y + .3 * u], [.9 * u, y - .15 * u]], sw * .6, PAL.ink, 'ink', .5);
  else if (m === 'smile') inkLine([[-.9 * u, y - .2 * u], [0, y + .45 * u], [.9 * u, y - .2 * u]], sw * .7, PAL.ink, 'ink', .6);
  else if (m === 'o') paint(ellPts(0, y + .25 * u, u * .38, u * .42, 12), { wash: PAL.ink, ink: null });
  else if (m === 'O') paint(ellPts(0, y + .45 * u, u * .7, u * .85, 14), { wash: '#4A1F2A', ink: PAL.ink, sw: sw * .5 });
  else if (m === 'grin') paint([[-1.2 * u, y - .1 * u], [1.2 * u, y - .1 * u], [.8 * u, y + .7 * u], [-.8 * u, y + .7 * u]], { wash: '#4A1F2A', ink: PAL.ink, sw: sw * .5, curv: .3 });
  else if (m === 'flat') inkLine([[-.7 * u, y + .1 * u], [.7 * u, y + .1 * u]], sw * .7, PAL.ink, 'ink', 0);
  else if (m === 'wobble') inkLine([[-1 * u, y + .1 * u], [-.5 * u, y - .2 * u], [0, y + .1 * u], [.5 * u, y - .2 * u], [1 * u, y + .1 * u]], sw * .6, PAL.ink, 'ink', .3);
}

function _catEyes(u, o, sw) {
  const e = o.eyes || 'normal', sqz = clamp(o.squint || 0), ec = o.eyeCol || PAL.eye, seed = o.seed || 0;
  const blink = (e === 'normal' || e === 'look') && ((T * .9 + seed * 1.7 + 1.6) % 3.3) < .12;
  if (sqz > .8) { for (const s of [-1, 1]) inkLine([[s * 1.4 * u - .8 * u, -8.7 * u], [s * 1.4 * u + .8 * u, -8.7 * u]], sw, PAL.ink, 'ink', 0); return; }
  if (sqz > 0) { push(); translate(0, -8.7 * u); scale(1 + sqz * .15, 1 - sqz); translate(0, 8.7 * u); }
  for (const s of [-1, 1]) {
    const ex = s * 1.4 * u, ey = -8.75 * u;
    if (e === 'normal' || e === 'look' || e === 'wide' || e === 'scared') {
      if (blink) { inkLine([[ex - .8 * u, ey + .2 * u], [ex, ey + .45 * u], [ex + .8 * u, ey + .2 * u]], sw, PAL.ink, 'ink', .4); continue; }
      const big = e === 'wide' || e === 'scared' ? 1.22 : 1, lx = (o.lookX || 0) * u * .35, ly = (o.lookY || 0) * u * .35;
      glow(ex, ey, 1.9 * u, ec, .35);
      paint(ellPts(ex, ey, .88 * u * big, 1.02 * u * big, 16), { wash: ec, ink: PAL.ink, sw: sw * .6 });
      if (e === 'scared') paint(ellPts(ex + lx, ey + ly, .2 * u, .24 * u, 8), { wash: PAL.ink, ink: null });
      else paint(ellPts(ex + lx, ey + ly, (e === 'wide' ? .38 : .2) * u, .78 * u, 10), { wash: PAL.furDk, ink: null });
      paint(ellPts(ex + lx - .3 * u, ey + ly - .38 * u, .18 * u, .2 * u, 8), { wash: PAL.cream, washOp: 240, ink: null });
    } else if (e === 'happy') inkLine([[ex - .75 * u, ey + .45 * u], [ex, ey - .45 * u], [ex + .75 * u, ey + .45 * u]], sw * 1.2, PAL.ink, 'ink', .3);
    else if (e === 'closed') inkLine([[ex - .75 * u, ey], [ex, ey + .45 * u], [ex + .75 * u, ey]], sw * 1.1, PAL.ink, 'ink', .4);
    else if (e === 'wink') {
      if (s < 0) inkLine([[ex - .75 * u, ey + .45 * u], [ex, ey - .45 * u], [ex + .75 * u, ey + .45 * u]], sw * 1.2, PAL.ink, 'ink', .3);
      else { paint(ellPts(ex, ey, .88 * u, 1.02 * u, 16), { wash: ec, ink: PAL.ink, sw: sw * .6 }); paint(ellPts(ex, ey, .2 * u, .78 * u, 10), { wash: PAL.furDk, ink: null }); }
    } else if (e === 'narrow') {
      paint(ellPts(ex, ey + .25 * u, .9 * u, .45 * u, 14), { wash: ec, ink: PAL.ink, sw: sw * .6 });
      paint(ellPts(ex, ey + .25 * u, .18 * u, .38 * u, 8), { wash: PAL.furDk, ink: null });
    } else if (e === 'spark' || e === 'star') {
      glow(ex, ey, 2.2 * u, PAL.gold, .6);
      paint(starPts(ex, ey, u * 1.2 * (1 + .12 * Math.sin(T * 14)), .38, e === 'star' ? 5 : 4), { wash: PAL.cream, fill: PAL.gold, fillOp: 90, ink: PAL.ink, sw: sw * .5 });
    } else if (e === 'heart') paint(heartPts(ex, ey, u * 1.05), { wash: '#E2476E', ink: PAL.ink, sw: sw * .5 });
    else if (e === 'x') { inkLine([[ex - .7 * u, ey - .7 * u], [ex + .7 * u, ey + .7 * u]], sw, PAL.ink, 'ink', 0); inkLine([[ex + .7 * u, ey - .7 * u], [ex - .7 * u, ey + .7 * u]], sw, PAL.ink, 'ink', 0); }
    else if (e === 'swirl') { const sp = []; for (let k = 0; k < 16; k++) { const a = k * .7 + T * 6 * s, r = k * .06 * u; sp.push([ex + Math.cos(a) * r, ey + Math.sin(a) * r]); } inkLine(sp, sw * .6, PAL.ink, 'inkfine', .6); }
    else if (e === 'dot') paint(ellPts(ex, ey, u * .3, u * .36, 10), { wash: PAL.ink, ink: null });
    else if (e === 'void') {  // transcended: the eye is a window onto light
      glow(ex, ey, 3 * u, ec, .8);
      paint(ellPts(ex, ey, .95 * u, 1.1 * u, 16), { wash: PAL.cream, fill: ec, fillOp: 150, bleed: .15, ink: PAL.ink, sw: sw * .5 });
    }
  }
  if (sqz > 0) pop();
}

function _catHat(u, h, sw) {
  if (!h) return;
  if (h === 'halo') {
    glow(0, -13.4 * u, 3.4 * u, PAL.gold, .5);
    _stroke(ellPts(0, -13.4 * u, 2.8 * u, .75 * u, 24), 'ink', PAL.gold, sw * 1.5, true);
  } else if (h === 'crown') {
    paint([[-2 * u, -10.9 * u], [-2 * u, -13.2 * u], [-1 * u, -12 * u], [0, -13.6 * u], [1 * u, -12 * u], [2 * u, -13.2 * u], [2 * u, -10.9 * u]], { wash: '#F2C53D', fill: PAL.ochre, fillOp: 90, ink: PAL.ink, sw: sw * .7 });
  } else if (h === 'party') {
    paint([[-1.4 * u, -11.1 * u], [0, -15 * u], [1.4 * u, -11.1 * u]], { wash: PAL.rose, fill: PAL.violet, fillOp: 50, ink: PAL.ink, sw: sw * .7 });
    paint(ellPts(0, -15 * u, u * .6, u * .6, 12), { wash: PAL.ochre, ink: PAL.ink, sw: sw * .5 });
  } else if (h === 'wizard') {
    paint([[-2.6 * u, -10.9 * u], [.7 * u, -16.4 * u], [2.6 * u, -10.9 * u]], { wash: PAL.indigo, fill: PAL.violet, fillOp: 80, ink: PAL.ink, sw: sw * .7 });
    paint(starPts(.1 * u, -12.6 * u, u * .8, .4, 5), { wash: PAL.ochre, ink: null });
  } else if (h === 'bowtie') {
    for (const s of [-1, 1]) paint([[0, -5.9 * u], [s * 1.4 * u, -6.5 * u], [s * 1.4 * u, -5.2 * u]], { wash: PAL.rose, ink: PAL.ink, sw: sw * .5 });
  }
}

// Emotes: painted reaction marks that pop near a head. k = 0..1 pop progress.
function emote(kind, x, y, s, k = 1) {
  const p = backOut(k); if (p < .02) return;
  if (kind === 'zzz') { letter('z', x, y, s * 2, PAL.cream, { pop: k * 3 }); letter('z', x + s * 1.6, y - s * 1.8, s * 1.5, PAL.cream, { pop: k * 3 - .3 }); return; }
  if (kind === '!' || kind === '?' || kind === '!?' || kind === '!!') { letter(kind, x, y, s * 3.4, kind.includes('?') ? PAL.sky : PAL.ochre, { pop: k * 1.5, rot: .12 }); return; }
  push(); translate(x, y); scale(p);
  const sw = clamp(s / 15, .4, 2);
  if (kind === 'sweat') {
    for (const [dx, dy, r] of [[0, 0, 1], [1.6, 1.4, .7]]) paint([[dx * s, (dy - 1.6 * r) * s], [(dx + .9 * r) * s, (dy + .2) * s], [dx * s, (dy + .9 * r) * s], [(dx - .9 * r) * s, (dy + .2) * s]], { wash: PAL.sky, ink: PAL.ink, sw: sw * .6, curv: .7 });
  } else if (kind === 'spark') {
    paint(starPts(0, 0, 1.6 * s), { wash: PAL.cream, fill: PAL.ochre, fillOp: 80, ink: PAL.ink, sw: sw * .5 });
    paint(starPts(1.9 * s, 1.2 * s, .8 * s), { wash: PAL.ochre, ink: PAL.ink, sw: sw * .4 });
  } else if (kind === 'heart') {

// ---------------------------------------------------------------- TALLY (inside wall)
function scratch(ax, ay, bx, by, k) {
  const e = easeOut(clamp(k, 0, 1)), x2 = lerp(ax, bx, e), y2 = lerp(ay, by, e);
  inkLine([[ax + jit(2), ay + jit(2)], [x2 + jit(2), y2 + jit(2)]], 9, '#5E3517', 'ink', 0);
  inkLine([[ax + 3 + jit(2), ay + jit(2)], [x2 + 3 + jit(2), y2 + jit(2)]], 3.6, TORN, 'ink', 0);
}

function countMarks(t, c) {
  for (let i = 0; i < c.n; i++) {
    const tt = c.t0 + i * B(2), k = (t - tt) / .14;
    if (k <= 0) continue;
    const g = Math.floor(i / 5), j = i % 5, gx = g * 200;
    if (j < 4) scratch(gx + j * 36, -78, gx + j * 36 - 10, 78, k);
    else scratch(gx - 22, 86, gx + 150, -86, k);
  }
}

function nearTick(t, c) {
  let bi = 0, bd = 1e9;
  for (let i = 0; i < c.n; i++) { const d = Math.abs(t - (c.t0 + i * B(2))); if (d < bd) { bd = d; bi = i; } }
  const g = Math.floor(bi / 5), j = bi % 5;
  return { tk: c.t0 + bi * B(2), x: c.sx + g * 200 + (j < 4 ? j * 36 : 64) };
}

function tallyWall(t) {
  skyWash(['#E8C695', '#D7AA72', '#BF8C57', '#A3703F']);
  paint(rectPts(-400, -300, 2400, 1800, 7), {
    wash: CARD, fill: CARD_DK, fillOp: 60, tex: .85, border: .3, ink: null,
    hatch: { d: 23, a: 90, o: { rand: .25, gradient: .3 }, b: 'cpencil', c: '#A0703F', w: 1 }
  });
  paint([[-400, 980], [2000, 940], [2000, 1500], [-400, 1500]], { wash: '#8E6134', fill: CHAR, fillOp: 60, tex: .6, ink: PAL.ink, sw: 1.2 });
  for (const c of COUNTS) {
    push(); translate(c.sx, c.sy); countMarks(t, c); pop();
    if (t > c.bm + .06) {
      const w = Math.floor(Math.max(0, c.n - 1) / 5) * 200 + (Math.max(0, c.n - 1) % 5) * 36;
      letter(c.lab, c.sx + w + 96, c.sy + 30, 124, PAL.clayDk, { pop: Math.min(1, seg(t, c.bm + .06, c.bm + B(1.4)) * 1.12), rot: .05 + hash(c.sy + c.n) * .06 });
    }
  }
}

function paw(x, y, s, rot) {

  paint([[-1.1 * s, 3.4 * s], [1.05 * s, 3.4 * s], [.82 * s, .1 * s], [-.9 * s, .1 * s]], { wash: PAL.fur, fill: PAL.furDk, fillOp: 90, tex: .4, ink: PAL.ink, sw: 1.7 });

// ---------------------------------------------------------------- TOWN
function soundRing(t, sx, sy, flashT, sp, n) {
  const el = t - flashT;
  if (el <= 0) return;
  for (let s = 1; s <= n; s++) {
    if (el < s) break;
    const r = s * sp;
    push(); fade(.1 + .1 * (1 - s / n));
    inkLine(ellPts(sx, sy, r, r * .78, 54, 2), 1.7, PAL.cream, 'dry', .6);
    pop();
  }
  const r = el * sp;
  push(); fade(.8);
  inkLine(ellPts(sx, sy, r, r * .78, 66, 3), 3.6, PAL.cream, 'dry', .6);
  inkLine(ellPts(sx, sy, r - 10, (r - 10) * .78, 66, 3), 1.4, '#F6EEDC', 'dry', .6);
  pop();
}

function bolt(sx, sy, ex, ey, k, seed) {
  if (k <= .02) return;
  const pts = [[sx, sy]];
  for (let i = 1; i <= 7; i++) { const f = i / 7; pts.push([lerp(sx, ex, f) + (hash(seed + i) - .5) * 96 * (1 - f * .4), lerp(sy, ey, f)]); }
  push(); fade(k);
  inkLine(pts, 8, '#FFF6E0', 'marker', 0);
  inkLine(pts, 2.6, PAL.cream, 'ink', 0);
  glow(lerp(sx, ex, .5), lerp(sy, ey, .5), 320, '#E9DEFF', .55);
  pop();
}

}

    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    // One shared promise: the start-up preload below and an early
    // __renderStrudelOffline() call (captureStrudelRender only waits for the
    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
