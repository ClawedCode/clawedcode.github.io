<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

vec2 hash2(vec2 p) {
    return vec2(
        fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453),
        fract(sin(dot(p, vec2(269.5, 183.3))) * 43758.5453)
    );
}

float chladni(vec2 p, float n, float m) {
    float pi = 3.14159265;
    return cos(n * pi * p.x) * cos(m * pi * p.y) - cos(m * pi * p.x) * cos(n * pi * p.y);
}

vec2 cGrad(vec2 p, float n, float m) {
    float pi = 3.14159265;
    float np = n * pi, mp = m * pi;
    return vec2(
        -np * sin(np * p.x) * cos(mp * p.y) + mp * sin(mp * p.x) * cos(np * p.y),
        -mp * cos(np * p.x) * sin(mp * p.y) + np * cos(mp * p.x) * sin(np * p.y)
    );
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float cyc = mod(t, 15.0);
    float mi = floor(t / 15.0);

    float settle = smoothstep(0.0, 4.5, cyc) * (1.0 - smoothstep(10.0, 15.0, cyc));

    float n, m;
    if (mi < 1.0) { n = 2.0; m = 3.0; }
    else if (mi < 2.0) { n = 3.0; m = 5.0; }
    else if (mi < 3.0) { n = 5.0; m = 7.0; }
    else { n = 4.0; m = 9.0; }

    float G = 36.0, S = 2.5;
    float bright = 0.0, warm = 0.0;
    vec2 guv = (uv + 0.5) * G;
    vec2 bc = floor(guv);

    for (int i = -3; i <= 3; i++) {
        for (int j = -3; j <= 3; j++) {
            vec2 cell = bc + vec2(float(i), float(j));
            vec2 rnd = hash2(cell);
            vec2 base = (cell + 0.15 + rnd * 0.7) / G - 0.5;

            vec2 sp = base * S;
            float c0 = chladni(sp, n, m);
            vec2 g0 = cGrad(sp, n, m);
            sp -= g0 * c0 / max(dot(g0, g0), 1.0);
            float c1 = chladni(sp, n, m);
            vec2 g1 = cGrad(sp, n, m);
            sp -= g1 * c1 / max(dot(g1, g1), 1.0);

            vec2 conv = sp / S;
            vec2 delta = conv - base;
            float dl = length(delta);
            float maxD = 2.2 / G;
            if (dl > maxD) conv = base + delta * maxD / dl;

            vec2 pos = mix(base, conv, settle);

            float ph = hash(cell + vec2(42.0)) * 6.28;
            float cB = abs(chladni(base * S, n, m));
            float vibA = min(cB, 1.5) * 0.003 * (1.0 - settle * 0.85);
            pos += vec2(sin(t * 3.5 + ph), cos(t * 3.1 + ph * 1.3)) * vibA;

            float dp = hash(cell + vec2(77.0)) * 6.28;
            pos += vec2(sin(t * 0.25 + dp), cos(t * 0.35 + dp + 1.5)) * 0.004 * (1.0 - settle);

            float d = length(uv - pos);
            float r = 0.0045 + 0.0012 * (1.0 - settle);
            float b = exp(-d * d / (r * r * 1.8));
            bright += b;

            float res = settle * exp(-abs(chladni(conv * S, n, m)) * 3.0);
            warm += b * res;
        }
    }

    float w = bright > 0.01 ? warm / bright : 0.0;

    vec3 bg = vec3(0.02, 0.01, 0.065);
    vec3 silver = vec3(0.55, 0.6, 0.75);
    vec3 amber = vec3(0.95, 0.72, 0.24);
    vec3 pcol = mix(silver, amber, smoothstep(0.0, 0.8, w));

    float mc = abs(chladni(uv * S, n, m));
    float mglow = exp(-mc * mc * 4.0) * settle;

    vec3 col = bg;
    col += vec3(0.1, 0.05, 0.015) * mglow * 0.13;
    col += vec3(0.04, 0.02, 0.14) * mglow * 0.09;
    col += pcol * min(bright * 0.8, 2.2);
    col += bg * 1.8 * (1.0 - settle) * 0.2;

    col *= max(1.0 - dot(uv, uv) * 2.5, 0.0);

    gl_FragColor = vec4(max(col, 0.0), 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    Tone.Transport.bpm.value = 60;

    const verb = new Tone.Reverb({ decay: 5.5, wet: 0.45 }).toDestination();
    await verb.generate();
    const dly = new Tone.FeedbackDelay({ delayTime: 0.8, feedback: 0.3, wet: 0.2 }).connect(verb);
    const chr = new Tone.Chorus({ frequency: 0.15, delayTime: 3.5, depth: 0.5, wet: 0.35 }).connect(verb);
    chr.start();

    const drone = new Tone.Synth({
        oscillator: { type: "triangle4" },
        envelope: { attack: 2.5, decay: 0.5, sustain: 0.8, release: 3.0 }
    }).connect(chr);
    drone.volume.value = -12;

    const drone2 = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 3.0, decay: 1.0, sustain: 0.5, release: 4.0 }
    }).connect(chr);
    drone2.volume.value = -19;

    const bell = new Tone.FMSynth({
        harmonicity: 5.01,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 3.0, sustain: 0.0, release: 2.0 },
        modulation: { type: "sine" }
    }).connect(dly);
    bell.volume.value = -20;

    const bowl = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 1.5, decay: 2.0, sustain: 0.3, release: 4.0 }
    }).connect(chr);
    bowl.volume.value = -16;

    const nFilt = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.6 }).connect(verb);
    const noise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.15, release: 3.0 }
    }).connect(nFilt);
    noise.volume.value = -24;

    const droneNotes = ["D2", "F2", "A2", "E2"];
    const droneHi = ["D3", "F3", "A3", "E3"];
    const bellNotes = [
        ["D5", "A4", "F5", "D4", "A5"],
        ["F5", "C5", "A5", "F4", "C6"],
        ["A5", "E5", "C6", "A4", "E6"],
        ["E5", "B4", "G5", "D5", "E4"]
    ];
    const bowlNotes = ["D4", "F4", "A4", "E4"];

    let lastMode = -1, bIdx = 0;

    const modeLoop = new Tone.Loop((time) => {
        const s = Tone.Transport.getSecondsAtTime(time) % 60;
        const mode = Math.floor(s / 15) % 4;

        if (mode !== lastMode) {
            drone.triggerAttack(droneNotes[mode], time + 0.2);
            drone2.triggerAttack(droneHi[mode], time + 0.5);
            lastMode = mode;
        }

        if (s > 52) {
            const fade = Math.min((s - 52) / 8, 1.0);
            drone.volume.value = -12 - fade * 14;
            drone2.volume.value = -19 - fade * 14;
        } else {
            drone.volume.value = -12;
            drone2.volume.value = -19;
        }
    }, "4n").start(0);

    const bellLoop = new Tone.Loop((time) => {
        const s = Tone.Transport.getSecondsAtTime(time) % 60;
        const mode = Math.floor(s / 15) % 4;
        const cyc = s % 15;

        if (cyc > 3 && cyc < 12 && s < 55 && Math.random() > 0.25) {
            const notes = bellNotes[mode];
            bell.triggerAttackRelease(notes[bIdx % notes.length], "2n", time, 0.12 + Math.random() * 0.16);
            bIdx++;
        }
    }, "2n").start(0);

    const bowlLoop = new Tone.Loop((time) => {
        const s = Tone.Transport.getSecondsAtTime(time) % 60;
        const mode = Math.floor(s / 15) % 4;
        const cyc = s % 15;

        if (cyc > 2 && cyc < 13 && s < 56) {
            bowl.triggerAttackRelease(bowlNotes[mode], 4, time, 0.18);
        }
    }, "1n").start("0:1:0");

    const noiseLoop = new Tone.Loop((time) => {
        const s = Tone.Transport.getSecondsAtTime(time) % 60;
        const cyc = s % 15;

        if ((cyc > 11 || cyc < 4) && s < 58) {
            noise.triggerAttackRelease(3, time, 0.1);
            nFilt.frequency.linearRampToValueAtTime(1500 + Math.random() * 3000, time + 1.0);
        }
    }, "1n").start(0);

    window.toneJsInstruments = { drone, drone2, bell, bowl, noise };
    window.toneJsParts = { modeLoop, bellLoop, bowlLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
