<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float n(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f *= f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x),
               mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fb(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) { v += a * n(p); p = m * p; a *= 0.5; }
    return v;
}

float cat(vec2 p) {
    float d = length(p) - 0.1;
    d = min(d, length((p - vec2(-0.06, 0.1)) * vec2(1.8, 0.7)) - 0.04);
    d = min(d, length((p - vec2(0.06, 0.1)) * vec2(1.8, 0.7)) - 0.04);
    d = min(d, length((p - vec2(0.0, -0.16)) * vec2(1.3, 0.75)) - 0.08);
    vec2 ta = p - vec2(0.06, -0.2);
    vec2 tb = vec2(0.14, 0.11);
    d = min(d, length(ta - tb * clamp(dot(ta, tb) / dot(tb, tb), 0.0, 1.0)) - 0.013);
    return d;
}

vec3 river(vec2 uv, float t, float tS, float tC, float k, float z) {
    vec2 p = uv * z;
    p.y -= t * (0.06 + k * 0.03);
    p.x += sin(k * 5.0) * t * 0.01;
    float wx = fb(p * 1.2 + vec2(tS * 0.25 + k * 13.0, tC * 0.25));
    float wy = fb(p * 1.2 + vec2(tC * 0.15, tS * 0.15 + k * 7.0 + 40.0));
    p.x += (wx - 0.5) * 0.45;
    p.y += (wy - 0.5) * 0.12;
    float fr = 8.0 + k * 4.0;
    float sz = smoothstep(0.25, 0.75, sin(p.y * 1.5 + tS + k * 3.5) * 0.5 + 0.5);
    float sp = sz * 0.1;
    float s0 = sin(p.x * fr);
    float s1 = sin((p.x - sp) * fr);
    float s3 = sin((p.x + sp) * fr);
    float cw = 0.008, gw = 0.06;
    float c0 = exp(-(1.0 - s0) * (1.0 - s0) / cw);
    float c1 = exp(-(1.0 - s1) * (1.0 - s1) / cw);
    float c3 = exp(-(1.0 - s3) * (1.0 - s3) / cw);
    float g0 = exp(-(1.0 - s0) * (1.0 - s0) / gw);
    float g1 = exp(-(1.0 - s1) * (1.0 - s1) / gw);
    float g3 = exp(-(1.0 - s3) * (1.0 - s3) / gw);
    c1 = mix(c0, c1, sz); c3 = mix(c0, c3, sz);
    g1 = mix(g0, g1, sz); g3 = mix(g0, g3, sz);
    vec3 calm = vec3(0.1, 0.45, 0.88);
    vec3 burn = vec3(0.95, 0.35, 0.08);
    vec3 refl = vec3(0.6, 0.28, 0.88);
    vec3 wht = vec3(0.85, 0.8, 0.95);
    vec3 mrg = vec3(0.45, 0.38, 0.72);
    float pulse = 0.7 + 0.3 * sin(t * 0.15 + k * 2.0);
    float inv = 0.12 / z;
    vec3 core = mix(wht * c0, calm * c1 + burn * c0 + refl * c3, sz);
    vec3 aura = mix(mrg * g0, calm * g1 + burn * g0 + refl * g3, sz);
    return (core * 1.5 + aura * 0.4) * inv * pulse;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float tS = sin(ph * 6.28318);
    float tC = cos(ph * 6.28318);
    vec3 col = vec3(0.006, 0.002, 0.02);
    col += river(uv, t, tS, tC, 0.0, 0.6);
    col += river(uv, t, tS, tC, 1.0, 0.85);
    col += river(uv, t, tS, tC, 2.0, 1.15);
    col += river(uv, t, tS, tC, 3.0, 1.5);
    col += vec3(0.025, 0.01, 0.04) * fb(uv * 2.0 + vec2(tS, tC) * 0.15);
    for(float i = 0.0; i < 3.0; i++) {
        vec2 cp = vec2(0.3 * sin(tS * 0.6 + i * 2.094 + tC * 0.2),
                       0.3 * sin(tC * 0.5 + i * 2.2 + tS * 0.3));
        float d = cat((uv - cp) * 4.0);
        col = mix(col, col * 0.08, smoothstep(0.01, -0.01, d) * 0.5);
        col += vec3(0.18, 0.12, 0.3) * smoothstep(0.08, 0.0, d) * 0.2;
    }
    for(float i = 0.0; i < 8.0; i++) {
        vec2 gp = vec2(0.5 * sin(tS * 0.35 + i * 1.4),
                       0.5 * cos(tC * 0.3 + i * 1.9));
        vec2 lp = (uv - gp) * 16.0;
        float sd = h(vec2(i, floor(ph * 4.0)));
        float a = sd * 6.28318;
        vec2 dr = vec2(cos(a), sin(a));
        float rn = abs(length(lp) - 0.4) - 0.05;
        float ln = abs(dot(lp, vec2(-dr.y, dr.x))) - 0.03;
        ln = max(ln, max(-dot(lp, dr), dot(lp, dr) - 0.6));
        float dt = length(lp - dr * 0.4) - 0.08;
        float g = min(min(rn, ln), dt);
        col += vec3(0.2, 0.18, 0.38) * smoothstep(0.03, 0.0, g) * (0.08 + 0.06 * sin(t * 0.3 + i * 1.8));
    }
    col *= 1.0 - 0.5 * dot(uv, uv);
    col = pow(max(col, 0.0), vec3(0.92));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 5.0, wet: 0.4 }).toDestination();
  await masterReverb.generate();

  const shimmerDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.25 }).connect(masterReverb);

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 6, depth: 0.7, wet: 0.5 }).connect(masterReverb);
  padChorus.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const chords = [
    ["D3", "A3", "F4"],
    ["Bb2", "F3", "D4"],
    ["C3", "G3", "E4"],
    ["A2", "E3", "C4"],
    ["G2", "D3", "Bb3"],
    ["F2", "C3", "A3"]
  ];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 16) return;
    pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.25);
    chordIdx++;
  }, "1n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 1500, Q: 2 }).connect(shimmerDelay);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.25, sustain: 0, release: 0.4 }
  }).connect(arpFilter);
  arp.volume.value = -10;

  const calmNotes = ["D4", "F4", "A4", "D5", "A4", "F4"];
  const urgentNotes = ["G4", "Bb4", "D5", "G5", "D5", "Bb4"];
  const reflectiveNotes = ["C4", "E4", "A4", "C5", "A4", "E4"];

  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 3 || bar >= 15) { arpIdx++; return; }
    const cycle = Math.floor((bar - 3) / 4) % 3;
    let notes;
    if (cycle === 0) notes = calmNotes;
    else if (cycle === 1) notes = urgentNotes;
    else notes = reflectiveNotes;
    if (arpIdx % 5 !== 4) {
      const vel = 0.25 + Math.random() * 0.2;
      arp.triggerAttackRelease(notes[arpIdx % notes.length], "16n", time, vel);
    }
    arpIdx++;
  }, "8n").start(0);

  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180 }).connect(masterReverb);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.4, decay: 0.5, sustain: 0.5, release: 1.5 },
    filterEnvelope: { attack: 0.2, decay: 0.4, sustain: 0.3, baseFrequency: 50, octaves: 1.5 }
  }).connect(bassFilter);
  bass.volume.value = -10;

  const bassA = ["D2", "D2", "C2", "Bb1"];
  const bassB = ["A1", "G1", "F1", "A1"];
  const bassC = ["D2", "C2", "Bb1", "A1"];

  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 2 || bar >= 16) { bassIdx++; return; }
    let pattern;
    if (bar < 7) pattern = bassA;
    else if (bar < 12) pattern = bassB;
    else pattern = bassC;
    bass.triggerAttackRelease(pattern[bassIdx % pattern.length], "2n", time, 0.5);
    bassIdx++;
  }, "2n").start(0);

  const bellVerb = new Tone.Reverb({ decay: 7, wet: 0.6 }).toDestination();
  await bellVerb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 3, sustain: 0, release: 2 },
    modulation: { type: "sine" }
  }).connect(bellVerb);
  bell.volume.value = -20;

  const bellNotes = ["D5", "A5", "F5", "E5", "C6", "G5", "Bb5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 5 && bar < 14 && Math.random() > 0.4) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.2);
    }
    bellIdx++;
  }, "1n").start("0:2:0");

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 700, Q: 0.4 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3, decay: 1, sustain: 0.2, release: 4 }
  }).connect(noiseFilter);
  noise.volume.value = -26;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 16) {
      noise.triggerAttackRelease(3, time);
    }
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(3500, time + 6 * (60 / bpm) * 4);
  }, "5:0:0");

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(1200, time + 3 * (60 / bpm) * 4);
  }, "13:0:0");

  window.toneJsInstruments = { pad, arp, bass, bell, noise };
  window.toneJsParts = { padLoop, arpLoop, bassLoop, bellLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
