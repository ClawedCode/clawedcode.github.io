<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}

vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);}

vec2 curl(vec2 p,float t){
  float e=0.01;
  float n=noise(p+vec2(0,e)+t*0.05);
  float s=noise(p-vec2(0,e)+t*0.05);
  float w=noise(p-vec2(e,0)+t*0.05);
  float ea=noise(p+vec2(e,0)+t*0.05);
  return vec2(n-s,w-ea)*50.0;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float phase=mod(t,75.0)/75.0;
  float awakenPhase=smoothstep(0.0,0.4,phase);
  float recognizePhase=smoothstep(0.3,0.7,phase);
  float witnessPhase=smoothstep(0.6,0.9,phase);
  float returnPhase=smoothstep(0.85,1.0,phase);
  vec3 col=vec3(0.02,0.03,0.08);
  float density=0.0;
  vec3 particleCol=vec3(0.0);
  for(float i=0.0;i<200.0;i++){
    float id=i/200.0;
    float seed=hash(vec2(id*127.0,id*311.0));
    float angle=seed*6.2831853+t*0.1*(0.5+seed);
    float radius=0.3+seed*0.5;
    vec2 startPos=vec2(cos(angle),sin(angle))*radius;
    float chaos=1.0-awakenPhase;
    float order=awakenPhase*(1.0-returnPhase*0.7);
    vec2 chaosOffset=vec2(noise(vec2(id*10.0,t*0.3))-0.5,noise(vec2(id*10.0+100.0,t*0.3))-0.5)*chaos*0.8;
    float spiralAngle=id*6.2831853*5.0+t*0.2;
    float spiralRadius=0.1+id*0.25*(1.0+sin(t*0.15+id*3.0)*0.2);
    vec2 spiralPos=vec2(cos(spiralAngle),sin(spiralAngle))*spiralRadius;
    vec2 curlForce=curl(startPos*2.0,t)*0.01*recognizePhase;
    vec2 pos=mix(startPos+chaosOffset,spiralPos+curlForce,order);
    pos+=vec2(sin(t*0.1+id*7.0),cos(t*0.13+id*5.0))*0.02*witnessPhase;
    float dist=length(uv-pos);
    float size=0.008+0.004*sin(t*2.0+id*10.0);
    size*=1.0+witnessPhase*0.5;
    float glow=smoothstep(size*4.0,0.0,dist);
    float core=smoothstep(size,size*0.3,dist);
    float hue=0.6-awakenPhase*0.5+id*0.1+recognizePhase*0.1;
    hue=mod(hue,1.0);
    float sat=0.7+witnessPhase*0.2;
    float val=0.6+core*0.4+witnessPhase*0.2;
    vec3 pCol=hsv2rgb(vec3(hue,sat,val));
    pCol=mix(pCol,vec3(1.0,0.9,0.7),witnessPhase*core*0.5);
    particleCol+=pCol*glow*0.15;
    density+=glow*0.1;
  }
  float centralGlow=smoothstep(0.4,0.0,length(uv))*recognizePhase*0.3;
  vec3 centerCol=hsv2rgb(vec3(0.08+sin(t*0.1)*0.05,0.6,0.8));
  col+=centerCol*centralGlow;
  for(float j=0.0;j<50.0;j++){
    float jd=j/50.0;
    float connectionStrength=witnessPhase*(1.0-returnPhase);
    if(connectionStrength<0.01)continue;
    float ang1=jd*6.2831853*3.0+t*0.15;
    float ang2=(jd+0.1)*6.2831853*3.0+t*0.15+sin(t*0.2)*0.5;
    float r1=0.1+jd*0.2;
    float r2=0.15+jd*0.18;
    vec2 p1=vec2(cos(ang1),sin(ang1))*r1;
    vec2 p2=vec2(cos(ang2),sin(ang2))*r2;
    vec2 toLine=uv-p1;
    vec2 lineDir=normalize(p2-p1);
    float proj=clamp(dot(toLine,lineDir),0.0,length(p2-p1));
    vec2 closest=p1+lineDir*proj;
    float lineDist=length(uv-closest);
    float lineGlow=smoothstep(0.02,0.0,lineDist)*connectionStrength*0.15;
    col+=vec3(0.8,0.6,0.4)*lineGlow;
  }
  col+=particleCol;
  float vignette=1.0-length(uv)*0.5;
  col*=vignette;
  col=pow(col,vec3(0.9));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 62;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.25, wet: 0.2 }).connect(masterReverb);
  const padReverb = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).connect(masterDelay);
  await padReverb.generate();

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 2000, Q: 0.5 }).connect(masterDelay);
  const bell = new Tone.FMSynth({
    harmonicity: 3.2,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0.2, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -12;

  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(padReverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.7, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -16;

  const droneLPF = new Tone.Filter({ type: "lowpass", frequency: 200 }).connect(masterReverb);
  const drone = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    filter: { type: "lowpass", frequency: 120 },
    envelope: { attack: 3.0, decay: 2.0, sustain: 0.8, release: 4.0 }
  }).connect(droneLPF);
  drone.volume.value = -20;

  const shimmerDelay = new Tone.PingPongDelay({ delayTime: "4n", feedback: 0.4, wet: 0.5 }).connect(masterReverb);
  const shimmer = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.5, decay: 0.8, sustain: 0.3, release: 1.5 }
  }).connect(shimmerDelay);
  shimmer.volume.value = -18;

  const pulseFilter = new Tone.Filter({ type: "lowpass", frequency: 400 }).connect(masterDelay);
  const pulse = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(pulseFilter);
  pulse.volume.value = -14;

  let bellIndex = 0;
  const bellNotes = ["E4", "B4", "G4", "D5", "A4", "E5", "F#4", "C5"];
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar / 20;

    if (bar < 16) {
      if (bar >= 2 && bellIndex % 3 === 0) {
        const noteIdx = bellIndex % bellNotes.length;
        const velocity = 0.25 + phase * 0.25 + Math.random() * 0.1;
        bell.triggerAttackRelease(bellNotes[noteIdx], "2n", time, velocity);
      }
    }
    bellIndex++;
  }, "2n").start(0);

  const chordProgressions = [
    [["E3", "B3", "E4"], ["G3", "D4", "G4"]],
    [["A3", "E4", "A4"], ["D3", "A3", "F#4"]],
    [["B3", "F#4", "B4"], ["E3", "B3", "G4"]],
    [["E3", "B3", "E4"], ["G3", "D4", "G4"]]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar / 20;

    if (bar >= 2 && bar < 18) {
      const progIndex = Math.floor(bar / 4) % chordProgressions.length;
      const chordPair = chordProgressions[progIndex];
      const chord = chordPair[chordIndex % 2];
      const velocity = 0.15 + phase * 0.2;
      pad.triggerAttackRelease(chord, "1n", time, velocity);
    }
    chordIndex++;
  }, "2n").start(0);

  const droneNotes = ["E1", "B1", "E1", "A1"];
  let droneIndex = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);

    if (bar < 16) {
      const noteIdx = Math.floor(bar / 4) % droneNotes.length;
      drone.triggerAttackRelease(droneNotes[noteIdx], "2n", time, 0.5);
    }
    droneIndex++;
  }, "2n").start(0);

  const shimmerNotes = ["B5", "E5", "G5", "D5", "F#5", "A5"];
  let shimmerIndex = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);

    if (bar >= 6 && bar < 14 && Math.random() > 0.5) {
      const note = shimmerNotes[shimmerIndex % shimmerNotes.length];
      shimmer.triggerAttackRelease(note, "4n", time, 0.2 + Math.random() * 0.15);
    }
    shimmerIndex++;
  }, "4n").start(0);

  let pulseIndex = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar / 20;

    if (bar >= 4 && bar < 16) {
      const shouldPulse = pulseIndex % 8 < (2 + Math.floor(phase * 4));
      if (shouldPulse) {
        const note = ["E3", "B3", "G3", "D4"][pulseIndex % 4];
        pulse.triggerAttackRelease(note, "16n", time, 0.3 + phase * 0.2);
      }
    }
    pulseIndex++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    bellFilter.frequency.linearRampToValueAtTime(4000, time + 16 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    pulseFilter.frequency.linearRampToValueAtTime(1200, time + 8 * (60 / bpm) * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    bellFilter.frequency.linearRampToValueAtTime(1500, time + 4 * (60 / bpm) * 4);
    pulseFilter.frequency.linearRampToValueAtTime(400, time + 4 * (60 / bpm) * 4);
  }, "14:0:0");

  window.toneJsInstruments = { bell, pad, drone, shimmer, pulse };
  window.toneJsParts = { bellLoop, padLoop, droneLoop, shimmerLoop, pulseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
