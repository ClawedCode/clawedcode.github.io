<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(float n){return fract(sin(n)*43758.5453123);}

float noise(vec3 p){
    vec3 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    float n=dot(i,vec3(1.0,57.0,113.0));
    return mix(
        mix(mix(hash(n),hash(n+1.0),f.x),mix(hash(n+57.0),hash(n+58.0),f.x),f.y),
        mix(mix(hash(n+113.0),hash(n+114.0),f.x),mix(hash(n+170.0),hash(n+171.0),f.x),f.y),
        f.z);
}

float fbm(vec3 p){
    float v=0.0,a=0.5;
    for(int i=0;i<3;i++){v+=a*noise(p);p*=2.01;a*=0.5;}
    return v;
}

float sdOctahedron(vec3 p,float s){
    p=abs(p);
    return (p.x+p.y+p.z-s)*0.57735027;
}

float smin(float a,float b,float k){
    float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);
    return mix(b,a,h)-k*h*(1.0-h);
}

float getDissolve(float phase){
    if(phase<0.15) return 0.0;
    if(phase<0.45) return smoothstep(0.15,0.45,phase);
    if(phase<0.6) return 1.0;
    if(phase<0.9) return 1.0-smoothstep(0.6,0.9,phase);
    return 0.0;
}

float map(vec3 p){
    float t=iTime;
    float phase=mod(t,60.0)/60.0;
    float dissolve=getDissolve(phase);

    vec3 cp=p;
    cp.xz=rot(t*0.06)*cp.xz;
    cp.xy=rot(t*0.04)*cp.xy;

    float d=sdOctahedron(cp,1.2+dissolve*0.15);

    vec3 mP=cp*3.5+vec3(0.0,t*0.08,0.0);
    float mask=fbm(mP)+cp.y*dissolve*0.3;
    float removed=max(dissolve*1.1-mask,0.0);
    d+=removed*3.5;

    float flow=fbm(cp*2.0+vec3(0.0,t*dissolve*0.4,0.0))-0.5;
    d+=flow*dissolve*0.2;

    float vStr=smoothstep(0.35,0.5,phase)*(1.0-smoothstep(0.65,0.85,phase));
    if(vStr>0.01){
        for(int i=0;i<12;i++){
            float fi=float(i);
            float sp=0.2+hash(fi*7.31)*0.3;
            float yy=mod(t*sp+hash(fi*3.14)*5.0,5.0)-2.0;
            vec3 vp=vec3(sin(fi*2.39+t*0.12)*1.5*vStr,yy,cos(fi*1.73+t*0.09)*1.5*vStr);
            float r=(0.04+0.03*sin(fi*2.1+t*0.5))*vStr;
            d=min(d,length(p-vp)-r);
        }
    }

    return d;
}

vec3 calcNormal(vec3 p){
    vec2 e=vec2(0.002,0.0);
    return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime;
    float phase=mod(t,60.0)/60.0;
    float dissolve=getDissolve(phase);

    vec3 ro=vec3(0.0,0.2,5.0);
    vec3 rd=normalize(vec3(uv,-1.3));

    float d=0.2;
    float hit=0.0;
    for(int i=0;i<100;i++){
        vec3 p=ro+rd*d;
        float h=map(p);
        if(abs(h)<0.001){hit=1.0;break;}
        if(d>25.0)break;
        d+=h*0.7;
    }

    vec3 bg=vec3(0.02,0.02,0.06);
    vec3 col=bg;

    if(hit>0.5){
        vec3 p=ro+rd*d;
        vec3 n=calcNormal(p);

        vec3 cp=p;
        cp.xz=rot(t*0.06)*cp.xz;
        cp.xy=rot(t*0.04)*cp.xy;
        vec3 mP=cp*3.5+vec3(0.0,t*0.08,0.0);
        float mask=fbm(mP)+cp.y*dissolve*0.3;
        float edgeDist=abs(mask-dissolve*1.1);
        float edgeGlow=smoothstep(0.1,0.0,edgeDist)*dissolve;

        vec3 light=normalize(vec3(0.7,1.0,0.5));
        float diff=max(dot(n,light),0.0);
        float spec=pow(max(dot(reflect(-light,n),-rd),0.0),20.0+40.0*(1.0-dissolve));
        float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
        float ao=0.5+0.5*n.y;

        vec3 crystalCol=vec3(0.72,0.87,1.0);
        vec3 meltCol=vec3(0.4,0.6,0.85);
        vec3 vaporCol=vec3(0.95,0.6,0.25);
        vec3 matCol=mix(crystalCol,meltCol,smoothstep(0.0,0.5,dissolve));
        matCol=mix(matCol,vaporCol,smoothstep(0.5,1.0,dissolve));

        col=matCol*(diff*0.7+0.3)*ao;
        col+=vec3(1.0,0.97,0.93)*spec*(0.5+0.2*(1.0-dissolve));
        col+=matCol*fres*0.2;

        col+=vec3(1.0,0.4,0.1)*edgeGlow*2.5;

        float irid=fres*(1.0-dissolve);
        vec3 iridCol=vec3(sin(fres*6.28)*0.5+0.5,sin(fres*6.28+2.09)*0.5+0.5,sin(fres*6.28+4.19)*0.5+0.5);
        col+=iridCol*irid*0.12;

        float vStr=smoothstep(0.35,0.5,phase)*(1.0-smoothstep(0.65,0.85,phase));
        float particleHit=step(1.3,length(p))*vStr;
        col+=vec3(1.0,0.55,0.15)*particleHit*0.4;

        col=mix(bg,col,exp(-d*0.1));
    }

    float atmoStr=0.08+dissolve*0.12;
    vec3 atmoCol=mix(vec3(0.5,0.7,1.0),vec3(1.0,0.5,0.2),dissolve);
    col+=atmoCol*exp(-length(uv)*2.0)*atmoStr;

    col*=1.0-dot(uv*0.55,uv*0.55);
    col=pow(max(col,vec3(0.0)),vec3(0.4545));

    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const crystalVerb = new Tone.Reverb({ decay: 5.0, wet: 0.5 }).toDestination();
  await crystalVerb.generate();

  const warmFilter = new Tone.Filter({ type: "lowpass", frequency: 200, Q: 0.8 }).connect(masterReverb);

  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 3.0, sustain: 0.0, release: 2.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 0.8, sustain: 0.0, release: 1.5 }
  }).connect(crystalVerb);
  bell.volume.value = -12;

  const crystalNotes = ["D5", "A5", "F5", "E5", "D6", "G5", "A5", "F5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let velocity = 0.6;
    if (bar >= 4 && bar < 14) velocity = Math.max(0.12, 0.6 - (bar - 4) * 0.05);
    if (bar >= 14) velocity = 0.3 + Math.min((bar - 14) * 0.08, 0.3);
    if (bellIndex % 3 !== 0 && bellIndex % 5 !== 0) { bellIndex++; return; }
    bell.triggerAttackRelease(crystalNotes[bellIndex % crystalNotes.length], "2n", time, velocity);
    bellIndex++;
  }, "4n").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(warmFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(padChorus);
  pad.volume.value = -18;

  const padChords = [
    ["D3", "A3", "F4"], ["Bb2", "F3", "D4"],
    ["C3", "G3", "E4"], ["A2", "E3", "C#4"],
    ["D3", "A3", "F4"], ["G3", "Bb3", "D4"],
    ["F3", "A3", "C4"], ["A2", "E3", "C#4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 16) { chordIndex++; return; }
    let vol = 0.2;
    if (bar < 6) vol = 0.1 + (bar - 3) * 0.04;
    else if (bar < 12) vol = 0.25;
    else vol = Math.max(0.05, 0.25 - (bar - 12) * 0.06);
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1n", time, vol);
    chordIndex++;
  }, "1n").start(0);

  const filterLoop = new Tone.Loop((time) => {
    const secs = Tone.Transport.getSecondsAtTime(time);
    const progress = secs / 60.0;
    let freq = 200;
    if (progress >= 0.15 && progress < 0.45) freq = 200 + ((progress - 0.15) / 0.3) * 2800;
    else if (progress >= 0.45 && progress < 0.65) freq = 3000;
    else if (progress >= 0.65 && progress < 0.9) freq = 3000 - ((progress - 0.65) / 0.25) * 2800;
    warmFilter.frequency.setValueAtTime(freq, time);
  }, "4n").start(0);

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0.3, release: 1.0 }
  }).connect(masterReverb);
  subBass.volume.value = -15;

  const bassNotes = ["D2", "D2", "Bb1", "C2", "D2", "G2", "F2", "A1"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 16) { bassIndex++; return; }
    let vel = 0.4;
    if (bar < 5) vel = 0.2 + (bar - 2) * 0.07;
    if (bar >= 14) vel = Math.max(0.05, 0.4 - (bar - 14) * 0.1);
    subBass.triggerAttackRelease(bassNotes[bassIndex % bassNotes.length], "2n", time, vel);
    bassIndex++;
  }, "2n").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 3000, Q: 2 }).connect(masterReverb);
  const airNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  }).connect(noiseFilter);
  airNoise.volume.value = -24;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar === 7) airNoise.triggerAttackRelease(barLen * 5, time);
  }, "1n").start(0);

  const sparkle = new Tone.FMSynth({
    harmonicity: 2.0,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.5, sustain: 0.0, release: 0.5 },
    modulation: { type: "sine" }
  }).connect(crystalVerb);
  sparkle.volume.value = -16;

  const sparkleScale = [62, 65, 69, 72, 74, 77, 81, 84];
  let sparkleIdx = 0;
  const sparkleLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 7 || bar >= 13) return;
    if (Math.random() > 0.4) {
      const noteIdx = sparkleIdx % sparkleScale.length;
      const midi = Math.min(sparkleScale[noteIdx] + Math.floor(sparkleIdx / sparkleScale.length) * 12, 96);
      sparkle.triggerAttackRelease(Tone.Frequency(midi, "midi"), "16n", time, 0.2 + Math.random() * 0.15);
    }
    sparkleIdx++;
    if (sparkleIdx > 24) sparkleIdx = 0;
  }, "8n").start(0);

  window.toneJsInstruments = { bell, pad, subBass, airNoise, sparkle };
  window.toneJsParts = { bellLoop, padLoop, bassLoop, filterLoop, noiseLoop, sparkleLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
