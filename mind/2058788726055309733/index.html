<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 hash(vec2 p) {
    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
    return fract(sin(p) * 43758.5453);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 45.0);

    float order = smoothstep(8.0, 20.0, t) * (1.0 - smoothstep(30.0, 42.0, t));
    float crystal = smoothstep(18.0, 22.0, t) * (1.0 - smoothstep(28.0, 32.0, t));
    float fracture = smoothstep(28.0, 33.0, t) * (1.0 - smoothstep(36.0, 42.0, t));

    vec3 col = vec3(0.02, 0.01, 0.03);

    for (float i = 0.0; i < 100.0; i++) {
        float row = floor(i / 10.0);
        float cx = i - row * 10.0;
        vec2 id = vec2(cx, row);

        vec2 lattice = (id - 4.5) * 0.17;
        if (mod(row, 2.0) > 0.5) lattice.x += 0.085;

        vec2 rnd = hash(id) * 1.4 - 0.7;
        rnd += 0.18 * vec2(
            sin(t * (0.3 + hash(id).x * 0.5) + rnd.x * 9.0),
            cos(t * (0.4 + hash(id).y * 0.4) + rnd.y * 9.0)
        );

        vec2 fractureDir = hash(id + 99.0) * 2.0 - 1.0;
        vec2 pos = mix(rnd, lattice, order);
        pos += fractureDir * fracture * 0.5;

        float d = length(uv - pos);

        float hue = hash(id + 33.0).x * 0.12;
        vec3 warmCol = vec3(0.95, 0.55 + hue, 0.12);
        vec3 coolCol = vec3(0.55 + hue, 0.82, 1.0);
        float iriPhase = dot(id, vec2(0.7, 1.3)) + t * 0.6;
        vec3 iriCol = vec3(
            0.5 + 0.5 * sin(iriPhase),
            0.5 + 0.5 * sin(iriPhase + 2.1),
            0.5 + 0.5 * sin(iriPhase + 4.2)
        );

        vec3 pCol = mix(warmCol, coolCol, order);
        pCol = mix(pCol, iriCol, fracture);

        float sharpness = mix(14.0, 42.0, crystal);
        sharpness = mix(sharpness, 18.0, fracture);
        float glow = exp(-d * sharpness);

        float bright = (0.4 + 0.6 * hash(id + 50.0).x) * mix(0.7, 1.0, crystal);
        col += glow * pCol * bright;
    }

    if (crystal > 0.01) {
        vec2 g = uv * 5.88;
        float hx = min(
            abs(fract(g.x + 0.5) - 0.5),
            abs(fract(g.y * 0.866 + 0.5) - 0.5)
        );
        col += smoothstep(0.025, 0.0, hx) * crystal * 0.12 * vec3(0.5, 0.75, 1.0);
    }

    if (fracture > 0.01) {
        float crack = 0.0;
        for (float j = 0.0; j < 7.0; j++) {
            float ang = hash(vec2(j, 7.7)).x * 6.2832;
            vec2 dir = vec2(cos(ang), sin(ang));
            float off = hash(vec2(j, 13.1)).x * 0.6 - 0.3;
            crack += smoothstep(0.006, 0.0, abs(dot(uv, dir) - off));
        }
        col += crack * fracture * vec3(1.0, 0.65, 0.25) * 0.45;
    }

    col *= 1.0 - dot(uv, uv) * 0.35;
    col = col / (1.0 + col);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({decay: 4.0, wet: 0.45}).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({delayTime: "8n.", feedback: 0.3, wet: 0.2}).connect(reverb);

  const bell = new Tone.FMSynth({
    harmonicity: 3.01, modulationIndex: 12,
    oscillator: {type: "sine"},
    envelope: {attack: 0.002, decay: 2.0, sustain: 0, release: 0.5},
    modulation: {type: "sine"}
  }).connect(delay);

  const padFilter = new Tone.Filter({type: "lowpass", frequency: 300}).connect(reverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: {type: "triangle"},
    envelope: {attack: 1.0, decay: 0.5, sustain: 0.4, release: 2.0}
  }).connect(padFilter);

  const sub = new Tone.Synth({
    oscillator: {type: "sine"},
    envelope: {attack: 0.1, decay: 0.3, sustain: 0.6, release: 0.5}
  }).connect(reverb);
  sub.volume.value = -8;

  const noiseFilter = new Tone.Filter({type: "bandpass", frequency: 600, Q: 1.5}).connect(reverb);
  const noise = new Tone.NoiseSynth({
    noise: {type: "pink"},
    envelope: {attack: 0.2, decay: 0.4, sustain: 0.1, release: 0.6}
  }).connect(noiseFilter);
  noise.volume.value = -12;

  const metal = new Tone.MetalSynth({
    frequency: 200,
    envelope: {attack: 0.001, decay: 0.3, release: 0.1},
    harmonicity: 5.1, modulationIndex: 20, resonance: 3000
  }).connect(reverb);
  metal.volume.value = -15;

  const chaosPool = ["E4","F#4","G4","A4","B4","C5","D5","E5"];
  const crystalSeq = ["E5","B4","G#4","E4","B4","G#4"];
  const chords = [["E3","G#3","B3"],["C#3","E3","G#3"],["A2","C#3","E3"],["B2","D#3","F#3"]];
  const bassNotes = ["E2","C#2","A1","B1"];

  let bellIdx = 0, chordIdx = 0, bassIdx = 0;

  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 4) {
      if (Math.random() > 0.45) {
        bell.triggerAttackRelease(chaosPool[Math.floor(Math.random() * chaosPool.length)], "16n", time, 0.25 + Math.random() * 0.15);
      }
    } else if (bar < 8) {
      bell.triggerAttackRelease(crystalSeq[bellIdx % crystalSeq.length], "8n", time, 0.35 + (bar - 4) * 0.06);
    } else if (bar < 11) {
      bell.triggerAttackRelease(crystalSeq[bellIdx % crystalSeq.length], "4n", time, 0.6);
    } else {
      if (Math.random() > 0.55) {
        bell.triggerAttackRelease(chaosPool[Math.floor(Math.random() * chaosPool.length)], "16n", time, 0.15);
      }
    }
    bellIdx++;
  }, "8n").start(0);

  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 12) {
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "2n", time, 0.12);
    }
    chordIdx++;
  }, "2n").start(0);

  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 11) {
      sub.triggerAttackRelease(bassNotes[bassIdx % bassNotes.length], "2n", time, 0.5);
    }
    bassIdx++;
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(300, time + 3 * (60 / bpm) * 4);
  }, "10:0:0");

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if ((bar < 3 || bar >= 11) && Math.random() > 0.5) {
      noise.triggerAttackRelease("4n", time, 0.3);
    }
  }, "4n").start(0);

  const metalLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 9 && bar < 12 && Math.random() > 0.65) {
      metal.triggerAttackRelease("8n", time, 0.4);
    }
  }, "4n").start(0);

  window.toneJsInstruments = {bell, pad, sub, noise, metal};
  window.toneJsParts = {bellLoop, padLoop, bassLoop, noiseLoop, metalLoop};
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
