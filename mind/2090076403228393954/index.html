<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define TAU 6.28318530718
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=h(i),b=h(i+vec2(1.0,0.0)),c=h(i+vec2(0.0,1.0)),d=h(i+1.0);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
float b4(vec2 p){vec2 c=floor(mod(p,4.0));float x=c.x,y=c.y;if(y<1.0){if(x<1.0)return 0.0/16.0;if(x<2.0)return 8.0/16.0;if(x<3.0)return 2.0/16.0;return 10.0/16.0;}if(y<2.0){if(x<1.0)return 12.0/16.0;if(x<2.0)return 4.0/16.0;if(x<3.0)return 14.0/16.0;return 6.0/16.0;}if(y<3.0){if(x<1.0)return 3.0/16.0;if(x<2.0)return 11.0/16.0;if(x<3.0)return 1.0/16.0;return 9.0/16.0;}if(x<1.0)return 15.0/16.0;if(x<2.0)return 7.0/16.0;if(x<3.0)return 13.0/16.0;return 5.0/16.0;}
vec3 pal(float x,float q){vec3 a=vec3(0.42,0.30,0.46),b=vec3(0.42,0.28,0.34),c=vec3(1.0,0.82,1.18),d=vec3(0.03,0.17,0.31);vec3 r=a+b*cos(TAU*(c*x+d));return mix(r,vec3(0.03,0.015,0.05),q);}
float fb(vec2 p,float t){float v=0.0,a=0.55;for(int i=0;i<3;i++){v+=a*n(p);p=rot(p*2.02,t*0.11+float(i));a*=0.5;}return v;}
vec2 fl(vec2 p,float t){float e=0.12;vec2 cyc=vec2(cos(t),sin(t))*1.7;float a=fb(p*0.58+cyc,t),b=fb((p+vec2(0.0,e))*0.58+cyc,t),c=fb((p+vec2(e,0.0))*0.58+cyc,t);vec2 curl=vec2((c-a)/e,-(b-a)/e);vec2 to=-p/(dot(p,p)+0.42);vec2 v=vec2(-p.y,p.x)*0.13+curl*1.18+to*0.55;return normalize(v+0.001)*min(1.35,length(v));}
float line(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float k=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*k);}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,45.0)/45.0,t=ph*TAU,bp=pow(0.5+0.5*sin(t*18.0),8.0);
  vec2 p=uv*3.1;
  vec3 col=vec3(0.012,0.009,0.024);
  float veil=0.0;
  vec2 q=p;
  for(int k=0;k<18;k++){vec2 v=fl(q,t+float(k)*0.07);q+=v*0.12;veil+=0.025/(0.28+length(q-p)*length(q-p));}
  col+=pal(0.08+ph*0.22,0.65)*veil*0.28;
  vec3 acc=vec3(0.0);
  float glow=0.0;
  for(int i=0;i<22;i++){
    float fi=float(i),ang=TAU*fi/22.0+t*0.17;
    vec2 pos=vec2(cos(ang),sin(ang))*mix(1.15,2.3,mod(fi,5.0)/5.0);
    pos+=vec2(sin(fi*4.11+t*2.0),cos(fi*2.73-t))*0.24;
    vec2 last=pos;
    for(int j=0;j<8;j++){
      float fj=float(j);
      vec2 v=fl(pos,t+fi*0.031);
      pos+=v*(0.18+0.018*fj);
      float d=line(p,last,pos);
      float w=0.034+0.018*sin(fj*0.9+fi+t)*sin(fj*0.9+fi+t);
      float m=smoothstep(w,0.0,d);
      float sp=length(v);
      vec3 cc=pal(0.38+sp*0.21+fi*0.017+ph*0.18,length(pos)*0.12);
      float echo=0.55+0.45*sin(fj*1.7-fi*0.33+t*3.0);
      acc+=cc*m*(0.21+0.18*echo+bp*0.16);
      glow+=m*(0.05+0.08*sp);
      last=pos;
    }
  }
  float core=smoothstep(0.42,0.0,abs(length(p)-0.62-0.08*sin(t*3.0+atan(p.y,p.x)*5.0)));
  col+=acc+pal(0.7+ph*0.2,0.15)*core*(0.11+bp*0.12);
  col+=vec3(0.12,0.36,0.55)*pow(max(0.0,1.0-length(uv*1.15)),3.0)*0.34;
  col=mix(col,col.brg,0.035*length(uv));
  col=floor(col*5.0+b4(gl_FragCoord.xy))/5.0;
  col*=0.86+0.14*sin((gl_FragCoord.y/iResolution.y)*900.0);
  col=pow(max(col,0.0),vec3(0.82));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(45 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.22 }).toDestination();
  const verb = new Tone.Reverb({ decay: 5.8, wet: 0.38 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.36, wet: 0.28 }).connect(verb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.045,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.34, sustain: 0, release: 0.08 }
  }).connect(master);
  kick.volume.value = -8;
  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 0.8 }).connect(master);
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 0.22, sustain: 0.48, release: 0.8 },
    portamento: 0.06
  }).connect(subFilter);
  sub.volume.value = -13;
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 620, Q: 0.7 }).connect(verb);
  const chorus = new Tone.Chorus({ frequency: 0.12, delayTime: 4.2, depth: 0.55, wet: 0.42 }).connect(padFilter);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "fatsawtooth", count: 3, spread: 18 },
    envelope: { attack: 1.6, decay: 0.4, sustain: 0.72, release: 3.0 }
  }).connect(chorus);
  pad.volume.value = -18;
  const bell = new Tone.FMSynth({
    harmonicity: 2.7,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.004, decay: 2.8, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -15;
  const whisperFilter = new Tone.Filter({ type: "bandpass", frequency: 700, Q: 0.9 }).connect(verb);
  const whisper = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.04, decay: 0.35, sustain: 0, release: 0.5 }
  }).connect(whisperFilter);
  whisper.volume.value = -25;
  const hat = new Tone.MetalSynth({
    frequency: 260,
    envelope: { attack: 0.001, decay: 0.07, release: 0.02 },
    harmonicity: 4.2,
    modulationIndex: 18,
    resonance: 3200
  }).connect(delay);
  hat.volume.value = -24;
  const chords = [
    ["D3", "A3", "C4", "E4"],
    ["Bb2", "F3", "A3", "C4"],
    ["G2", "D3", "F3", "A3"],
    ["C3", "G3", "Bb3", "D4"]
  ];
  const bassA = ["D1", "D1", "A1", "C2", "Bb1", "A1"];
  const bassB = ["G1", "D2", "F1", "A1", "C2", "A1", "Bb1"];
  const bellPool = ["A4", "C5", "D5", "E5", "G5", "A5", "C6"];
  let chordIndex = 0, bassIndex = 0, bellIndex = 0, hatIndex = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.82 || bar % 2 === 0) {
      kick.triggerAttackRelease("D1", "8n", time + H(3), bar < totalBars * 0.12 ? 0.55 : 0.82);
      padFilter.frequency.setValueAtTime(420, time);
      padFilter.frequency.exponentialRampToValueAtTime(620, time + 0.18);
    }
  }, "2n").start(0);
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const body = bar >= totalBars * 0.12 && bar < totalBars * 0.82;
    const pattern = bar < totalBars * 0.58 ? bassA : bassB;
    if (body || bassIndex % 3 === 0) {
      sub.triggerAttackRelease(pattern[bassIndex % pattern.length], body ? "4n" : "2n", time + H(8), body ? 0.68 : 0.38);
    }
    bassIndex++;
  }, "4n").start(0);
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const vel = bar < totalBars * 0.12 || bar >= totalBars * 0.84 ? 0.22 : 0.34;
    pad.triggerAttackRelease(chords[chordIndex % chords.length], "1m", time + H(15), vel);
    chordIndex++;
  }, "1m").start(0);
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const open = bar >= totalBars * 0.18 && bar < totalBars * 0.78;
    const sparse = bar < totalBars * 0.18 || bar >= totalBars * 0.78;
    if (open || (sparse && bellIndex % 5 === 0)) {
      const drift = Math.floor((bar / Math.max(1, totalBars)) * 4);
      const note = bellPool[(bellIndex * 2 + drift) % bellPool.length];
      bell.triggerAttackRelease(note, open ? "8n" : "4n", time + H(11), open ? 0.34 : 0.2);
    }
    bellIndex++;
  }, "8n").start(0);
  const hatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const active = bar >= totalBars * 0.36 && bar < totalBars * 0.74;
    const pat = [1,0,0,1,0,1,0,0,1,0,1,0];
    if (active && pat[hatIndex % pat.length]) hat.triggerAttackRelease("32n", time + H(4), 0.22 + Math.random() * 0.16);
    hatIndex++;
  }, "16n").start(0);
  const whisperLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.08 && bar < totalBars * 0.86 && hatIndex % 4 === 0) {
      whisperFilter.frequency.setValueAtTime(420 + Math.random() * 900, time);
      whisper.triggerAttackRelease("8n", time + H(14), 0.18);
    }
  }, "2n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2100, time + totalBars * 0.32 * secPerBar);
    subFilter.frequency.linearRampToValueAtTime(220, time + totalBars * 0.28 * secPerBar);
  }, totalBars * 0.16 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(560, time + totalBars * 0.18 * secPerBar);
    subFilter.frequency.linearRampToValueAtTime(120, time + totalBars * 0.14 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, sub, pad, bell, whisper, hat, verb, delay, master, subFilter, padFilter, chorus, whisperFilter };
  window.toneJsParts = { kickLoop, subLoop, padLoop, bellLoop, hatLoop, whisperLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
