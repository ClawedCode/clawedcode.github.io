<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 ab = b - a;
  vec3 ap = p - a;
  float t = clamp(dot(ap, ab) / dot(ab, ab), 0.0, 1.0);
  return length(ap - ab * t) - r;
}

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise3D(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
        mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
    mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
        mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y),
    f.z);
}

float fbm(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  vec3 shift = vec3(100.0);
  for (int i = 0; i < 4; i++) {
    v += a * noise3D(p);
    p = p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

vec3 curl(vec3 p) {
  float e = 0.1;
  float n1 = fbm(p + vec3(0.0, e, 0.0));
  float n2 = fbm(p - vec3(0.0, e, 0.0));
  float dx = (n1 - n2) / (2.0 * e);
  
  n1 = fbm(p + vec3(0.0, 0.0, e));
  n2 = fbm(p - vec3(0.0, 0.0, e));
  float dy = (n1 - n2) / (2.0 * e);
  
  n1 = fbm(p + vec3(e, 0.0, 0.0));
  n2 = fbm(p - vec3(e, 0.0, 0.0));
  float dz = (n1 - n2) / (2.0 * e);
  
  return vec3(dy - dz, dz - dx, dx - dy);
}

float map(vec3 p, float time) {
  float t = time * 0.15;
  vec3 flow = curl(p * 0.8 + t) * 1.2;
  p += flow;
  
  float n = fbm(p * 0.5 + t);
  p += n * 0.5;
  
  float r = sdTorus(p, vec2(1.5 + n * 0.5, 0.25));
  float c = sdCapsule(p, vec3(-2.0, 0.0, 0.0), vec3(2.0, 0.0, 0.0), 0.3);
  return smin(r, c, 0.4);
}

vec3 normal(vec3 p, float time) {
  vec3 n;
  float e = 0.001;
  n.x = map(p + vec3(e,0.0,0.0), time) - map(p - vec3(e,0.0,0.0), time);
  n.y = map(p + vec3(0.0,e,0.0), time) - map(p - vec3(0.0,e,0.0), time);
  n.z = map(p + vec3(0.0,0.0,e), time) - map(p - vec3(0.0,0.0,e), time);
  return normalize(n);
}

vec3 palette(float t, float d) {
  vec3 a = vec3(0.5, 0.5, 0.5);
  vec3 b = vec3(0.5, 0.5, 0.5);
  vec3 c = vec3(1.0, 1.0, 1.0);
  vec3 d1 = vec3(0.00, 0.10, 0.20);
  return a + b * cos(6.28318 * (c * t + d1));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  const float DURATION = 40.0;
  float phase = mod(iTime, DURATION) / DURATION;
  float time = phase * DURATION;
  
  vec3 ro = vec3(0.0, 0.0, 5.0);
  vec3 rd = normalize(vec3(uv, -1.0));
  
  float t = 0.0;
  float d = 0.0;
  vec3 p = vec3(0.0);
  
  for (int i = 0; i < 80; i++) {
    p = ro + rd * t;
    d = map(p, time);
    if (d < 0.001 || t > 10.0) break;
    t += d;
  }
  
  vec3 col = vec3(0.02, 0.03, 0.05);
  
  if (d < 0.001) {
    vec3 n = normal(p, time);
    vec3 light = normalize(vec3(1.0, 1.0, 2.0));
    float diff = max(dot(n, light), 0.0);
    
    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    
    vec3 emerald = vec3(0.1, 0.9, 0.4);
    vec3 ultra = vec3(0.6, 0.0, 1.0);
    vec3 white = vec3(1.0, 1.0, 1.0);
    
    vec3 baseCol = mix(ultra, emerald, dot(n, light) + 0.2);
    
    float flow = fbm(p * 2.0 + time * 0.5);
    vec3 flowCol = mix(baseCol, white, smoothstep(0.4, 0.6, flow));
    
    col = flowCol * (diff * 0.8 + 0.2);
    col += emerald * fresnel * 0.6;
    
    float rim = pow(max(dot(n, rd), 0.0), 2.0);
    col += ultra * rim * 0.4;
  }
  
  col = pow(col, vec3(0.8));
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 40;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 40;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 40;
  const targetBpm = 98;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  let rngState = 0x6d2b79f5;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;
  const secPerBar = 240 / bpm;

  // === FX BUSES ===
  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const wetReverb = new Tone.Reverb({ decay: 2.0, wet: 0.45 }).toDestination();
  await wetReverb.generate();

  const compressor = new Tone.Compressor({ threshold: -18, ratio: 4, attack: 0.01, release: 0.2 }).toDestination();

  // === NOISE TEXTURE (Emergent Bed) ===
  const noiseNoise = new Tone.Noise("pink");
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 1.5 }).connect(new Tone.Gain(0.06).connect(masterReverb));
  noiseNoise.connect(noiseFilter);
  noiseNoise.start();

  // === RHODES PIANO (Luminous, Wide) ===
  const rhodesChorus = new Tone.Chorus({ frequency: 0.5, delayTime: 4, depth: 0.2, wet: 0.3 }).connect(masterReverb);
  rhodesChorus.start();

  const rhodesFilter = new Tone.Filter({ type: "lowpass", frequency: 1500, Q: 0.8 }).connect(rhodesChorus);

  const rhodes = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 3,
    modulationIndex: 1.2,
    oscillator: { type: "sine" },
    modulation: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0.3, release: 3.0 },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0.2, release: 2.0 },
    volume: -8
  }).connect(rhodesFilter);

  // === WARM SUB BASS (Organic) ===
  const subBassFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 2 }).toDestination();
  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.08, decay: 0.8, sustain: 0.6, release: 0.5 },
    filterEnvelope: { attack: 0.02, decay: 0.4, sustain: 0.4, baseFrequency: 60, octaves: 1.5 },
    volume: -4
  }).connect(subBassFilter);

  // === SPARKLE SYNTH (Ultraviolet Fragments) ===
  const sparkleDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.2, wet: 0.25 }).connect(wetReverb);
  const sparkle = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 0.002, decay: 0.8, sustain: 0.1, release: 1.5 },
    volume: -10
  }).connect(sparkleDelay);

  // === PULSATION (Breathing Structure) ===
  const pulse = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.5, sustain: 0.02, release: 0.6 },
    volume: -12
  }).toDestination();

  // === ARRANGEMENT LOGIC ===
  let noteIndex = 0;
  let sparkIndex = 0;

  // Rhodes Loops extended chords (Ebmaj9 -> Abmaj7#11 -> Fm11 -> Bbsus4)
  const rhodesChords = [
    ["Eb3", "G3", "Bb3", "D4", "F4"],
    ["Ab3", "C4", "Eb4", "G4", "D4"],
    ["F3", "Ab3", "C4", "Eb4", "G4"],
    ["Bb3", "Eb4", "F4", "Ab4"]
  ];

  const rhodesLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Chord changes every 4 bars
    const chordIdx = Math.floor(bar / 4) % rhodesChords.length;
    // Play every 2 bars
    if (bar % 2 === 0) {
      rhodes.triggerAttackRelease(rhodesChords[chordIdx], "4m", time + H(15), 0.4);
    }
  }, "1n").start(0);

  // Sub Bass Pattern (Roots)
  const subNotes = ["Eb1", "Ab1", "F1", "Bb1"];
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.85) {
      const noteIdx = Math.floor(bar / 4) % subNotes.length;
      subBass.triggerAttackRelease(subNotes[noteIdx], "1n", time + H(8), 0.8);
    }
  }, "1n").start(0);

  // Pulse (Breathing on off-beats)
  const pulseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.70) {
      // Gentle throb, not a kick drum
      const vel = 0.3 + R() * 0.2;
      pulse.triggerAttackRelease("C1", "2n", time + H(5), vel);
    }
  }, "2n").start(0);

  // Sparkle (Ultraviolet fragments)
  const sparkleNotes = ["Bb4", "D5", "F5", "G5", "Ab5", "Eb5"];
  const sparkleLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.15 && bar < totalBars * 0.80) {
      // Play on random 16th notes
      if (R() > 0.4) {
        const note = sparkleNotes[Math.floor(R() * sparkleNotes.length)];
        sparkle.triggerAttackRelease(note, "16n", time + H(10), 0.3);
      }
    }
  }, "16n").start(0);

  // === DYNAMIC AUTOMATION ===

  // Rhodes Filter Opening (Emerald -> Ultraviolet)
  Tone.Transport.schedule((time) => {
    // Start opening at 10%
    rhodesFilter.frequency.linearRampToValueAtTime(2500, time + totalBars * 0.30 * secPerBar);
  }, totalBars * 0.10 * secPerBar);

  // Rhodes Filter Closing (Ultraviolet -> Emerald)
  Tone.Transport.schedule((time) => {
    // Close back down at 75%
    rhodesFilter.frequency.linearRampToValueAtTime(1200, time + totalBars * 0.25 * secPerBar);
  }, totalBars * 0.75 * secPerBar);

  // Sub Bass Decay
  Tone.Transport.schedule((time) => {
    subBassFilter.frequency.linearRampToValueAtTime(80, time + totalBars * 0.15 * secPerBar);
  }, totalBars * 0.85 * secPerBar);

  // Noise Texture Filter Sweep
  Tone.Transport.schedule((time) => {
    // Open noise filter
    noiseFilter.frequency.linearRampToValueAtTime(800, time + totalBars * 0.30 * secPerBar);
  }, totalBars * 0.10 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Close noise filter
    noiseFilter.frequency.linearRampToValueAtTime(300, time + totalBars * 0.20 * secPerBar);
  }, totalBars * 0.80 * secPerBar);

  // === STORE REFERENCES ===
  window.toneJsInstruments = { noiseNoise, noiseFilter, rhodes, rhodesFilter, rhodesChorus, subBass, subBassFilter, sparkle, sparkleDelay, pulse, masterReverb, wetReverb, compressor };
  window.toneJsParts = { rhodesLoop, subLoop, pulseLoop, sparkleLoop };
};


  </script>
