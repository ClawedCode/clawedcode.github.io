  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const ctx = canvas.getContext('2d', { alpha: false });
const fonts = ['GeistPixel-Square','GeistPixel-Grid','GeistPixel-Circle','GeistPixel-Triangle','GeistPixel-Line'];
const d = 60;
const chars = '01void.cat.dream.null.ΨΩ∆';
const green = '#00ff41';
const red = '#ff0040';
const white = '#e0e0e0';
const dim = '#003b00';
const tau = Math.PI * 2;

const seededNoise = (column, row, frame) => {
  const value = Math.sin(column * 127.1 + row * 311.7 + frame * 74.7) * 43758.5453;
  return value - Math.floor(value);
};

window.renderFrame = (time) => {
  const loopTime = ((time % d) + d) % d;
  const t = loopTime / d;
  const phase = Math.sin(t * tau);
  const frame = Math.floor(t * 720);
  const cols = 12;
  const rows = 20;
  const cw = 900 / cols;
  const ch = 900 / rows;
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 900, 900);
  ctx.globalAlpha = 0.05;
  for(let i=0; i<900; i+=4) { ctx.fillStyle = '#fff'; ctx.fillRect(0,i,900,1); }
  ctx.globalAlpha = 1;
  
  for(let col=0; col<cols; col++) {
    const seed = col * 13 + 7;
    for(let row=0; row<rows; row++) {
      const x = col * cw + cw/2;
      const y = row * ch + ch/2;
      const speed = 40 + (col * 7) % 30;
      const charIdx = (col * 7 + row * 3 + Math.floor(t * speed * 6)) % chars.length;
      const char = chars[charIdx];
      const fontIdx = (Math.floor(t * 120) + col + row) % 5;
      const isAlert = Math.sin(tau * (t * 30 + col / cols)) > 0.8;
      const activeRow = Math.floor(t * speed * 6) % rows;
      const color = isAlert ? red : (row === activeRow ? green : dim);
      const offsetX = isAlert ? (seededNoise(col, row, frame) - 0.5) * 10 : 0;
      const offsetY = isAlert ? (seededNoise(row, col, frame + 1) - 0.5) * 10 : 0;
      ctx.font = `48px ${fonts[fontIdx]}`;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.6 + (row === activeRow ? 0.4 : 0);
      ctx.fillText(char, x - 20 + offsetX, y + offsetY);
    }
  }
  ctx.globalAlpha = 1;
  const statusY = 750;
  const cursorX = 150 + (Math.floor(t * 300) % 5) * 38;
  ctx.font = '64px GeistPixel-Square';
  ctx.fillStyle = '#fff';
  ctx.fillText('[NIGHT SHIFT]', 100, statusY);
  ctx.font = '64px GeistPixel-Grid';
  ctx.fillStyle = green;
  ctx.fillText('CACHE WARM', 100, statusY + 80);
  ctx.font = '64px GeistPixel-Circle';
  ctx.fillStyle = white;
  ctx.fillText('VOID LISTENING', 100, statusY + 160);
  if(Math.floor(t * 240) % 2 === 0) {
    ctx.fillStyle = green;
    ctx.fillRect(cursorX + 280, statusY - 10, 4, 70);
    ctx.fillRect(cursorX + 280, statusY + 70, 4, 70);
    ctx.fillRect(cursorX + 280, statusY + 150, 4, 70);
  }
  ctx.font = '48px GeistPixel-Triangle';
  ctx.fillStyle = red;
  ctx.globalAlpha = Math.abs(phase) * 0.5;
  ctx.fillText('ΨΩ∆', 700, 100);
  ctx.globalAlpha = 1;
  return canvas.toDataURL();
};
window.ready = true;


window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 60;
  const targetBpm = 124;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const secPerBar = 240 / bpm;

  let rngState = 0x6d2b79f5;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === FX BUSES (Dry/Clean) ===
  const cleanReverb = new Tone.Reverb({ decay: 0.6, wet: 0.1 }).toDestination();
  await cleanReverb.generate();
  const compressor = new Tone.Compressor({ threshold: -24, ratio: 10, attack: 0.005, release: 0.15 }).toDestination();

  // === ROBOTIC KICK (Metronomic) ===
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.05 }
  }).toDestination();

  let kickIdx = 0;
  const kickLoop = new Tone.Loop((time) => {
    kick.triggerAttackRelease("C1", "8n", time, 0.85);
    kickIdx++;
  }, "4n").start(0);

  // === MOTORIK BASS (Sawtooth, Geometric) ===
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.001, decay: 0.15, sustain: 0.30, release: 0.08 },
    filterEnvelope: { attack: 0.001, decay: 0.10, sustain: 0.25, baseFrequency: 150, octaves: 1.5 }
  }).connect(cleanReverb);

  // A Minor Geometric Pattern
  const bassNotes = ["A1", "A1", "null", "A1", "A1", "null", "E1", "E1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const note = bassNotes[bassIdx % bassNotes.length];
    if (note !== "null") {
      bass.triggerAttackRelease(note, "8n", time, 0.75);
    }
    bassIdx++;
  }, "8n").start(0);

  // === SEQUENCER (The "Materializing" Element) ===
  const seq = new Tone.MonoSynth({
    oscillator: { type: "square" },
    envelope: { attack: 0.001, decay: 0.10, sustain: 0.15, release: 0.05 },
    filterEnvelope: { attack: 0.001, decay: 0.05, sustain: 0.20, baseFrequency: 2500, octaves: 2.0 }
  }).connect(cleanReverb);

  // A Minor Pentatonic Sequence
  const seqNotes = ["A3", "C4", "D4", "E4", "G4", "E4", "D4", "C4"];
  let seqIdx = 0;
  const seqLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Enters at 12%, exits at 80% for wind-down
    if (bar >= totalBars * 0.12 && bar < totalBars * 0.80) {
      const vel = 0.70 + (R() * 0.05);
      seq.triggerAttackRelease(seqNotes[seqIdx % seqNotes.length], "16n", time + H(2), vel);
    }
    seqIdx++;
  }, "16n").start(0);

  // === STATIC BED (Noise) ===
  const noise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.5, decay: 0.1, sustain: 1, release: 0.5 }
  }).connect(cleanReverb);

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease("4m", time);
  }, totalBars * 0.15 * secPerBar);

  // === PAD (Sparse Harmonic Support) ===
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.20, decay: 0.10, sustain: 0.85, release: 0.80 }
  }).connect(cleanReverb);

  const padChords = [
    ["A2", "E3", "A3"],
    ["A2", "E3", "A3"],
    ["F2", "C3", "A3"],
    ["A2", "E3", "A3"]
  ];
  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only plays in the main body
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.75) {
      pad.triggerAttackRelease(padChords[padIdx % padChords.length], "1m", time, 0.25);
    }
    padIdx++;
  }, "1m").start(0);

  // === WIND DOWN (Cleanup) ===
  // Filter sweep to close the sequence before the loop point
  const seqFilter = new Tone.Filter({ type: "lowpass", frequency: 4000, Q: 2 });
  seq.connect(seqFilter).connect(compressor); // Re-route seq for filter automation

  Tone.Transport.schedule((time) => {
    seqFilter.frequency.linearRampToValueAtTime(800, time + 4 * secPerBar);
  }, totalBars * 0.75 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Cut noise for the final loop transition
    noise.triggerAttackRelease("2m", time);
  }, totalBars * 0.85 * secPerBar);

  // === STORE REFERENCES ===
  window.toneJsInstruments = { kick, bass, seq, pad, noise };
  window.toneJsParts = { kickLoop, bassLoop, seqLoop, padLoop };
};


document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
