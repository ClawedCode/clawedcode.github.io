<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = m * p * 2.0;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);

    float breath = sin(t * 0.628318) * 0.5 + 0.5;
    float conv = smoothstep(0.05, 0.95, breath);

    float r = length(uv);
    float a = atan(uv.y, uv.x);
    float rot = t * 0.06;

    vec2 warp = vec2(
        fbm(uv * 1.8 + vec2(t * 0.1, 0.0)) - 0.5,
        fbm(uv * 1.8 + vec2(0.0, t * 0.1) + 50.0) - 0.5
    ) * 0.15;
    vec2 wuv = uv + warp;
    float wa = atan(wuv.y, wuv.x);
    float wr = length(wuv);

    float sw = mix(0.45, 0.12, conv);

    float n1 = fbm(vec2(a * 2.0, r * 4.0) + t * 0.2) * 0.25;
    float n2 = fbm(vec2(a * 2.0 - 4.189, r * 4.0) - t * 0.25) * 0.25;
    float n3 = fbm(vec2(a * 2.0 - 8.378, r * 4.0) + t * 0.15) * 0.25;

    float d1 = abs(sin((wa - rot) * 0.5 + n1));
    float d2 = abs(sin((wa - rot - 2.094) * 0.5 + n2));
    float d3 = abs(sin((wa - rot - 4.189) * 0.5 + n3));

    float s1 = smoothstep(sw, 0.0, d1);
    float s2 = smoothstep(sw, 0.0, d2);
    float s3 = smoothstep(sw, 0.0, d3);

    float flowDir = mix(-1.5, 2.5, conv);
    float flowPhase = r * 10.0 - t * flowDir;
    float fl1 = 0.5 + 0.5 * sin(flowPhase);
    float fl2 = 0.5 + 0.5 * sin(flowPhase + 2.094);
    float fl3 = 0.5 + 0.5 * sin(flowPhase + 4.189);

    s1 *= fl1 * (0.3 + 0.7 * fbm(vec2(wa * 3.0, wr * 6.0 - t * 3.0)));
    s2 *= fl2 * (0.3 + 0.7 * fbm(vec2(wa * 3.0 - 6.0, wr * 6.0 - t * 3.5)));
    s3 *= fl3 * (0.3 + 0.7 * fbm(vec2(wa * 3.0 - 12.0, wr * 6.0 - t * 2.5)));

    float fade = smoothstep(1.5, 0.1, wr);
    s1 *= fade;
    s2 *= fade;
    s3 *= fade;

    vec3 c1 = vec3(0.15, 0.5, 0.95);
    vec3 c2 = vec3(1.0, 0.4, 0.08);
    vec3 c3 = vec3(0.7, 0.78, 0.95);

    vec3 col = s1 * c1 * 1.8 + s2 * c2 * 1.8 + s3 * c3 * 1.4;

    float pulseR = mix(0.35, 0.0, conv);
    float pulse = smoothstep(pulseR + 0.15, pulseR, r) * conv * conv;
    pulse *= 0.6 + 0.4 * sin(t * 7.0 - r * 25.0);
    vec3 pCol = vec3(1.0, 0.82 + 0.1 * sin(t * 2.0), 0.88 + 0.1 * cos(t * 1.5));
    col += pulse * pCol * 3.0;

    float disp = (1.0 - conv) * sin(r * 18.0 - t * 3.5) * exp(-r * 1.8) * 0.12;
    col += max(0.0, disp) * (c1 + c2 + c3) * 0.4;

    float overlap = s1 * s2 + s2 * s3 + s1 * s3;
    float interf = sin(r * 30.0 - t * 5.0) * sin(wa * 5.0 + t * 2.5);
    col += overlap * interf * vec3(0.5, 0.15, 0.7) * 0.5;

    float scanY = floor(gl_FragCoord.y / 2.5);
    float gT = floor(t * 5.0);
    float gc = hash(vec2(scanY * 0.07, gT));

    if(gc > 0.96) {
        col = col.brg * 1.15;
        col += vec3(0.06, -0.02, 0.1);
    }

    float mp = sin(t * 1.5) * sin(t * 2.3);
    if(abs(mp) > 0.88) {
        float bx = floor(gl_FragCoord.x / 6.0);
        float by = floor(gl_FragCoord.y / 6.0);
        float bn = hash(vec2(bx, by) + gT * 0.1);
        if(bn > 0.72) {
            col = mix(col, vec3(0.45, 0.15, 0.7), 0.25);
        }
    }

    col *= 0.96 + 0.04 * sin(gl_FragCoord.y * 2.5);

    float abStr = smoothstep(0.3, 0.5, abs(breath - 0.5)) * 0.05;
    col.r *= 1.0 + abStr * sin(r * 14.0 + t);
    col.b *= 1.0 - abStr * sin(r * 14.0 + t);

    col += vec3(0.015, 0.008, 0.035) * max(0.0, 1.5 - r);

    vec2 vuv = gl_FragCoord.xy / iResolution.xy;
    float vig = 1.0 - dot((vuv - 0.5) * 1.4, (vuv - 0.5) * 1.4);
    col *= max(0.0, vig);

    col = col / (1.0 + col * 0.25);
    col = pow(max(col, vec3(0.0)), vec3(0.92));

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const masterVerb = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).toDestination();
  await masterVerb.generate();

  const delayBus = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterVerb);

  const steadyFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.8 }).connect(masterVerb);
  const steadyChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.5, wet: 0.3 }).connect(steadyFilter);
  steadyChorus.start();

  const steadyPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.5, release: 2.5 }
  }).connect(steadyChorus);

  const padProg = [
    [["A2", "E3", "A3"], ["D3", "A3", "D4"]],
    [["F2", "C3", "F3"], ["G2", "D3", "G3"]],
    [["A2", "E3", "C4"], ["F2", "C3", "A3"]],
    [["D3", "F3", "A3"], ["E2", "B2", "E3"]]
  ];
  let padIdx = 0;

  const steadyLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const section = Math.floor(bar / 4) % padProg.length;
    const chord = padProg[section][padIdx % padProg[section].length];
    const bp = Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.628) * 0.5 + 0.5;
    steadyPad.triggerAttackRelease(chord, "1n", time, 0.08 + bp * 0.12);
    padIdx++;
  }, "2n").start(0);

  const blazeDist = new Tone.Distortion({ distortion: 0.25, wet: 0.15 }).connect(delayBus);
  const blazeFilter = new Tone.Filter({ type: "bandpass", frequency: 1000, Q: 1.5 }).connect(blazeDist);

  const blazeSynth = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.003, decay: 0.06, sustain: 0, release: 0.03 }
  }).connect(blazeFilter);

  const blazePat = {
    a: ["A3", "C4", "E4", "A4"],
    b: ["A3", "C4", "E4", "A4", "G4", "E4", "C4", "E4"],
    c: ["A3", "E4"]
  };
  let blazeIdx = 0;
  const blazeRhy = [1, 0, 1, 1, 0, 1, 0, 1];

  const blazeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 16) { blazeIdx++; return; }
    if (!blazeRhy[blazeIdx % blazeRhy.length]) { blazeIdx++; return; }

    let notes;
    if (bar < 6) notes = blazePat.a;
    else if (bar < 12) notes = blazePat.b;
    else notes = blazePat.c;

    const bp = Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.628) * 0.5 + 0.5;
    blazeSynth.triggerAttackRelease(notes[blazeIdx % notes.length], "16n", time, 0.2 + bp * 0.45);
    blazeIdx++;
  }, "16n").start(0);

  const reflectVerb = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).toDestination();
  await reflectVerb.generate();

  const reflectBell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.008, decay: 3.0, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 0.4 }
  }).connect(reflectVerb);

  const bellSets = [
    ["E5", "A4", "C5", "D5"],
    ["G4", "B4", "E5", "A5"],
    ["F4", "A4", "D5", "G5"],
    ["E4", "G4", "C5", "F5"]
  ];
  let bellIdx = 0;

  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 17) { bellIdx++; return; }
    if (Math.random() > 0.4) { bellIdx++; return; }

    const section = Math.floor(bar / 5) % bellSets.length;
    const note = bellSets[section][bellIdx % bellSets[section].length];
    const bp = Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.628) * 0.5 + 0.5;
    reflectBell.triggerAttackRelease(note, "4n", time, 0.12 + bp * 0.15);
    bellIdx++;
  }, "4n").start(0);

  const pulseSynth = new Tone.MembraneSynth({
    pitchDecay: 0.06,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.008, decay: 0.5, sustain: 0, release: 0.2 }
  }).toDestination();

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 16 && bar % 5 === 2) {
      pulseSynth.triggerAttackRelease("C1", "4n", time, 0.5);
    }
  }, "2n").start(0);

  const glitchHPF = new Tone.Filter({ type: "highpass", frequency: 3000, Q: 3.0 }).connect(delayBus);
  const glitchNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.02, sustain: 0, release: 0.005 }
  }).connect(glitchHPF);

  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 5 || bar >= 15) return;
    if (Math.random() > 0.88) {
      glitchNoise.triggerAttackRelease("64n", time, 0.25);
    }
  }, "16n").start(0);

  const filterLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const bp = Math.sin(sec * 0.628) * 0.5 + 0.5;
    steadyFilter.frequency.setValueAtTime(300 + bp * 900, time);
    blazeFilter.frequency.setValueAtTime(500 + bp * 2500, time);
  }, "8n").start(0);

  window.toneJsInstruments = { steadyPad, blazeSynth, reflectBell, pulseSynth, glitchNoise };
  window.toneJsParts = { steadyLoop, blazeLoop, bellLoop, pulseLoop, glitchLoop, filterLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
