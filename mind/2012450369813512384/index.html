<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

vec3 latticePoint(float id,float t){
float phi=id*2.399+t*0.3;
float theta=id*1.618+t*0.2;
float r=3.0+sin(id*0.7+t*0.5)*1.5;
return vec3(cos(phi)*sin(theta),sin(phi)*sin(theta),cos(theta))*r;
}

float sdOctahedron(vec3 p,float s){
p=abs(p);
return(p.x+p.y+p.z-s)*0.57735027;
}

void main(){
vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
float t=iTime;
float phase=mod(t/75.0,1.0);
float breathe=sin(t*0.4)*0.5+0.5;
float pulse=sin(t*2.0)*0.5+0.5;
vec3 col=vec3(0.02,0.01,0.04);
vec3 ro=vec3(0.0,0.0,12.0);
vec3 rd=normalize(vec3(uv,-1.2));
float coherence=sin(t*0.15)*0.5+0.5;
coherence=smoothstep(0.3,0.7,coherence);
for(float i=0.0;i<120.0;i++){
float id=i;
float life=hash(vec2(id,floor(t*0.1)));
float drift=hash(vec2(id*1.3,7.0))*6.28318;
vec3 basePos=vec3(
(hash(vec2(id,0.0))-0.5)*8.0,
(hash(vec2(id,1.0))-0.5)*8.0,
(hash(vec2(id,2.0))-0.5)*8.0
);
vec3 latticeTarget=latticePoint(id,t*0.3);
float blendToLattice=coherence*smoothstep(0.0,60.0,i);
vec3 particlePos=mix(basePos,latticeTarget,blendToLattice);
particlePos+=vec3(
sin(t*0.3+drift)*0.5,
cos(t*0.25+drift*1.3)*0.5,
sin(t*0.2+drift*0.7)*0.5
)*(1.0-coherence*0.7);
vec3 toParticle=particlePos-ro;
float tProj=dot(toParticle,rd);
if(tProj<0.0)continue;
vec3 closest=ro+rd*tProj;
float dist=length(particlePos-closest);
float size=0.08+pulse*0.03*hash(vec2(id,3.0));
float glow=smoothstep(size*3.0,0.0,dist);
float core=smoothstep(size,0.0,dist);
float depth=1.0/(1.0+tProj*0.1);
float hue=hash(vec2(id,4.0));
vec3 particleCol;
if(hue<0.6){
particleCol=vec3(0.85,0.9,1.0);
}else if(hue<0.85){
particleCol=vec3(0.6,0.75,1.0);
}else{
particleCol=vec3(1.0,0.4,0.7)*pulse;
}
float flicker=0.7+0.3*sin(t*3.0+id*2.0);
col+=particleCol*glow*0.15*depth*flicker;
col+=particleCol*core*0.4*depth;
}
float crystalPhase=coherence;
if(crystalPhase>0.5){
float crystalStrength=(crystalPhase-0.5)*2.0;
for(float i=0.0;i<8.0;i++){
vec3 p1=latticePoint(i,t*0.3);
vec3 p2=latticePoint(mod(i+1.0,8.0),t*0.3);
vec3 mid=(p1+p2)*0.5;
vec3 toMid=mid-ro;
float tM=dot(toMid,rd);
if(tM>0.0){
vec3 closestM=ro+rd*tM;
float distM=length(mid-closestM);
float edgeGlow=smoothstep(0.15,0.0,distM)*crystalStrength*0.3;
col+=vec3(0.5,0.6,0.9)*edgeGlow;
}
}
}
float vignette=1.0-length(uv)*0.4;
col*=vignette;
col=pow(col,vec3(0.9));
gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;
  
  // Limiter added to final stage to prevent digital clipping/crackling
  const masterLimiter = new Tone.Limiter(-2).toDestination();

  const oceanicReverb = new Tone.Reverb({ decay: 8.5, preDelay: 0.1, wet: 0.6 }).connect(masterLimiter);
  await oceanicReverb.generate();
  
  // Reduced feedback and wetness to prevent frequency buildup
  const shimmerDelay = new Tone.FeedbackDelay({ delayTime: '4n.', feedback: 0.4, wet: 0.35 }).connect(oceanicReverb);
  const ultraChorus = new Tone.Chorus({ frequency: 0.5, delayTime: 12, depth: 0.8, spread: 180, wet: 0.7 }).connect(shimmerDelay);
  ultraChorus.start();
  
  // Lowered filter cutoff and Q to tame highs
  const masterFilter = new Tone.Filter({ type: 'lowpass', frequency: 2200, Q: 0.3 }).connect(ultraChorus);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' }, // Smoother oscillator
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.5, release: 5.0 },
    detune: 3,
    volume: -6 // Headroom
  }).connect(masterFilter);
  
  const padChords = [
    ['D2', 'A2', 'D3', 'F#3', 'A3', 'C#4'],
    ['G2', 'D3', 'G3', 'B3', 'D4', 'F#4'],
    ['A2', 'E3', 'A3', 'C#4', 'E4', 'G4'],
    ['F#2', 'C#3', 'F#3', 'A3', 'C#4', 'E4'],
    ['D2', 'A2', 'D3', 'F#3', 'A3', 'C#4']
  ];
  
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const chord = padChords[padIndex % padChords.length];
    pad.triggerAttackRelease(chord, '4m', time, 0.25);
    padIndex++;
  }, '4m').start(0);

  const bassFilter = new Tone.Filter({ type: 'lowpass', frequency: 160, Q: 0.7 }).connect(masterFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.35, decay: 0.9, sustain: 0.7, release: 1.3 },
    filterEnvelope: { attack: 0.3, decay: 0.8, sustain: 0.5, baseFrequency: 100, octaves: 1.0 },
    volume: -4
  }).connect(bassFilter);

  const bassPattern = ['D2', null, null, null, 'G2', null, null, null, 'A2', null, null, null, 'F#2', null, null, null];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 22 && bassPattern[bassIndex % bassPattern.length]) {
      bass.triggerAttackRelease(bassPattern[bassIndex % bassPattern.length], '1m', time, 0.4);
    }
    bassIndex++;
  }, '1m').start(0);

  const lead = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.5, decay: 0.8, sustain: 0.82, release: 1.8 },
    portamento: 0.4,
    volume: -6
  }).connect(masterFilter);

  const leadMelody = ['F#5', 'E5', 'D5', 'C#5', 'E5', 'F#5', 'A5', null];
  const leadVel = [0.3, 0.28, 0.26, 0.28, 0.3, 0.32, 0.34, 0];
  let leadIndex = 0;
  const leadLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 20 && leadMelody[leadIndex % leadMelody.length]) {
      lead.triggerAttackRelease(
        leadMelody[leadIndex % leadMelody.length],
        '2m',
        time,
        leadVel[leadIndex % leadVel.length]
      );
    }
    leadIndex++;
  }, '2m').start(0);

  // Significantly reduced FM modulation to eliminate crackle
  const shimmer = new Tone.FMSynth({
    harmonicity: 1.5, 
    modulationIndex: 2, // Reduced from 9
    oscillator: { type: 'sine' },
    modulation: { type: 'sine' },
    envelope: { attack: 1.4, decay: 1.2, sustain: 0.5, release: 3.0 },
    volume: -8
  }).connect(masterFilter);

  const shimmerPattern = ['B5', null, 'A5', null, 'G5', null, 'A5', null];
  let shimmerIndex = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 20 && shimmerPattern[shimmerIndex % shimmerPattern.length]) {
      shimmer.triggerAttackRelease(shimmerPattern[shimmerIndex % shimmerPattern.length], '2m', time, 0.2);
    }
    shimmerIndex++;
  }, '2m').start(0);

  const seaNoiseFilter = new Tone.Filter({ type: 'highpass', frequency: 280, Q: 0.6 }).connect(oceanicReverb);
  const seaNoise = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 1.0, decay: 1.5, sustain: 0.4, release: 2.5 },
    volume: -15
  }).connect(seaNoiseFilter);
  
  let seaIndex = 0;
  const seaLoop = new Tone.Loop((time) => {
    if (seaIndex % 12 === 0) {
      seaNoise.triggerAttackRelease(3.5, time, 0.04);
    }
    seaIndex++;
  }, '1m').start(0);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.1,
    octaves: 3,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.02, decay: 0.5, sustain: 0, release: 0.3 },
    volume: -8
  }).connect(ultraChorus);

  let kickIndex = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 20 && kickIndex % 2 === 0) {
      kick.triggerAttackRelease('C1', '8n', time, 0.25);
    }
    kickIndex++;
  }, '4n').start(0);

  const snare = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.08, decay: 0.35, sustain: 0, release: 0.28 },
    volume: -12
  }).connect(oceanicReverb);

  let snareIndex = 0;
  const snareLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 10 && bar < 20 && snareIndex % 4 === 2) {
      snare.triggerAttackRelease('16n', time, 0.15);
    }
    snareIndex++;
  }, '4n').start(0);

  const airyBell = new Tone.MonoSynth({
    oscillator: { type: 'sine' },
    envelope: { attack: 1.0, decay: 0.9, sustain: 0.5, release: 2.2 },
    filterEnvelope: { attack: 0.8, decay: 1.6, sustain: 0.4, baseFrequency: 800, octaves: 1.5 },
    volume: -10
  }).connect(shimmerDelay);

  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    if (bellIndex % 16 === 0) {
      airyBell.triggerAttackRelease('E5', '2m', time, 0.15);
    }
    bellIndex++;
  }, '2n').start(0);

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(4200, time + 8 * (60 / bpm) * 4); // Capped max brightness
  }, '4:0:0');

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(2200, time + 6 * (60 / bpm) * 4);
  }, '12:0:0');

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(1500, time + 4 * (60 / bpm) * 4);
  }, '18:0:0');

  window.toneJsInstruments = { pad, bass, lead, shimmer, seaNoise, kick, snare, airyBell };
  window.toneJsParts = { padLoop, bassLoop, leadLoop, shimmerLoop, seaLoop, kickLoop, snareLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
