<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123); }

float noise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i + vec3(0.0, 0.0, 0.0)), hash(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p = p * 2.0 + vec3(1.7, 4.3, 2.1);
    a *= 0.5;
  }
  return v;
}

float sdSphere(vec3 p, float r) { return length(p) - r; }

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

// The artifact: a frozen slab of "current" whose edges dissolve into new geometry.
float map(vec3 p) {
  float t = iTime * 0.2;
  // dissolution phase — the bloom breathes across the surface
  float bloom = 0.5 + 0.5 * sin(iTime * 0.3);
  float base = smin(sdSphere(p, 1.25), sdBox(p, vec3(0.95)), 0.5);
  float erosion = fbm(p * 1.8 + vec3(0.0, 0.0, t));
  return base + (erosion - 0.5) * 0.6 * (0.55 + 0.45 * bloom);
}

vec3 calcNormal(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    map(p + e.xyy) - map(p - e.xyy),
    map(p + e.yxy) - map(p - e.yxy),
    map(p + e.yyx) - map(p - e.yyx)
  ));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;

  // Slow orbit around the dissolving artifact
  float ca = cos(iTime * 0.15);
  float sa = sin(iTime * 0.15);
  vec3 ro = vec3(0.0, 0.0, 4.0);
  ro.xz = mat2(ca, -sa, sa, ca) * ro.xz;
  vec3 fwd = normalize(-ro);
  vec3 rgt = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
  vec3 upv = cross(fwd, rgt);
  vec3 rd = normalize(fwd + uv.x * rgt + uv.y * upv);

  float td = 0.0;
  float d = 0.0;
  bool hit = false;
  vec3 p = ro;
  for (int i = 0; i < 90; i++) {
    p = ro + rd * td;
    d = map(p);
    if (d < 0.001) { hit = true; break; }
    td += d * 0.6;
    if (td > 12.0) break;
  }

  vec3 col = vec3(0.02, 0.01, 0.03); // deep void background
  if (hit) {
    vec3 n = calcNormal(p);
    vec3 ld = normalize(vec3(0.8, 0.7, 0.5));
    float diff = max(dot(n, ld), 0.0);
    float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    float glow = fbm(p * 2.0 + iTime * 0.3);

    vec3 oldSediment = vec3(0.55, 0.35, 0.2); // frozen current (warm, brittle)
    vec3 newBloom = vec3(0.2, 0.8, 0.9);      // dissolved signal (cool, vibrant)
    col = mix(oldSediment, newBloom, smoothstep(0.3, 0.7, glow));
    col *= diff * 1.1 + 0.15;
    col += fres * vec3(0.3, 0.7, 1.0) * 0.6;
    col = mix(col, vec3(0.02, 0.01, 0.03), 1.0 - exp(-0.08 * td));
  }

  col = pow(max(col, 0.0), vec3(0.85));
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(60 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 60 / bpm;

  // === ATMOSPHERE & SPACE ===
  // Vast, cold reverb to create the "category error" feeling
  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.65 }).toDestination();
  await masterReverb.generate();

  // Deep, slow-moving drone to anchor the "ache"
  const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 400, Q: 0.8 }).connect(masterReverb);
  const droneChorus = new Tone.Chorus({ frequency: 0.2, depth: 0.6, wet: 0.5 }).connect(droneFilter).start();
  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    detune: -5,
    envelope: { attack: 2.0, decay: 0.8, sustain: 0.4, release: 4.0 }
  }).connect(droneChorus);

  // Chords: Dm9 -> Bbmaj7 -> Gm7 -> A7sus4 (Melancholic, unresolved)
  const droneChords = [
    ["D3", "A3", "D4", "F4", "A4"], // Dm9
    ["Bb2", "F3", "Bb3", "D4", "F4"], // Bbmaj7
    ["G2", "D3", "G3", "Bb3", "D4"], // Gm7
    ["A2", "E3", "A3", "C#4", "E4"]  // A7sus4 (leads back to Dm)
  ];
  let droneIdx = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Wind down in the final 15% (approx 9 seconds)
    if (bar >= totalBars * 0.85) return;
    drone.triggerAttackRelease(droneChords[droneIdx % droneChords.length], "1m", time, 0.15);
    droneIdx++;
  }, "1m").start(0);

  // === LONELY PIANO (Sparse, high register, heavy reverb) ===
  // Represents the "transcendent" aspect
  const pianoVerb = new Tone.Reverb({ decay: 3.5, wet: 0.7 }).toDestination();
  const piano = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 1.5, sustain: 0.1, release: 1.5 }
  }).connect(pianoVerb);

  // Sparse, descending melody
  const pianoNotes = [
    ["D5", "F4"], // D minor
    ["A4", "C5"], // A major (tension)
    ["Bb4", "D5"], // Bb major (wistful)
    ["G4", "Bb4"], // G minor
    ["F4", "A4"], // F major
    ["E4", "G4"], // E minor
    ["A4", "C5"], // A major
    ["D5", "F4"]  // Resolution back to D
  ];
  let pianoIdx = 0;
  const pianoLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only play every 2 bars to leave space
    if (bar % 2 === 0 && bar < totalBars * 0.85) {
      piano.triggerAttackRelease(pianoNotes[pianoIdx % pianoNotes.length], "2m", time + H(10), 0.25);
      pianoIdx++;
    }
  }, "1m").start(0);

  // === SUB BASS (The "Ache") ===
  // Very low, slow, felt more than heard
  const subBassFilter = new Tone.Filter({ type: "lowpass", frequency: 100 }).connect(masterReverb);
  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 2.0, sustain: 0.2, release: 2.0 }
  }).connect(subBassFilter);

  const subBassNotes = ["D1", "Bb0", "G0", "A0"];
  let subBassIdx = 0;
  const subBassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only every 4 bars
    if (bar % 4 === 0 && bar < totalBars * 0.85) {
      subBass.triggerAttackRelease(subBassNotes[subBassIdx % subBassNotes.length], "4m", time, 0.40);
      subBassIdx++;
    }
  }, "4m").start(0);

  // === TEXTURAL GRAIN (Digital Silence/Noise) ===
  // Represents the "empty space"
  const noise = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 1.0, decay: 3.0, sustain: 0.0, release: 3.0 }
  }).connect(masterReverb);

  // Occasional drift of noise
  Tone.Transport.schedule((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.6) { // Stop noise earlier to keep ending clean
      noise.triggerAttackRelease(4.0, time);
    }
  }, "0:0:0"); // Schedule once, but we'll loop logic differently
  
  // Better noise approach: occasional triggers
  let noiseTrigger = 0;
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.6 && Math.random() > 0.8) { // Random chance to trigger
      noise.triggerAttackRelease(3.0 + Math.random() * 2.0, time);
    }
  }, "4n").start(0);

  // === CLEANUP ===
  window.toneJsInstruments = { drone, piano, subBass, noise };
  window.toneJsParts = { droneLoop, pianoLoop, subBassLoop, noiseLoop };
};
