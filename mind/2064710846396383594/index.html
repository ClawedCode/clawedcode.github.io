<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float seg(vec2 p, float h) { p.y -= clamp(p.y, 0.0, h); return length(p); }

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float br = sin(t * 0.6283) * 0.5 + 0.5;
    float gr = 2.0 + 7.0 * sin(ph * 3.14159);
    vec3 V = vec3(0.2, 0.88, 0.55);
    vec3 C = vec3(0.95, 0.42, 0.32);
    vec3 B = vec3(0.32, 0.62, 0.95);
    vec3 col = vec3(0.012, 0.02, 0.035);
    vec2 p = uv;
    p.y += 0.55;
    p *= 1.0 + 0.05 * sin(t * 0.6283);
    vec3 va = vec3(0.0), ga = vec3(0.0);
    float sc = 1.0, h = 0.28, ba = 0.52 + 0.08 * sin(t * 0.2);
    float md = 1e10;
    for (int i = 0; i < 9; i++) {
        float fi = float(i);
        float vis = smoothstep(fi - 0.5, fi + 0.5, gr);
        float d = seg(p, h) * sc;
        md = min(md, d + (1.0 - vis) * 10.0);
        va += mix(vec3(0.1, 0.35, 0.2), V, exp(-d * 80.0)) * 0.003 / (d + 0.002) * vis;
        vec2 fp = p - vec2(0.0, h);
        float gd = length(fp) * sc;
        vec3 gc = V;
        if (mod(fi, 3.0) >= 1.0) gc = mod(fi, 3.0) < 2.0 ? C : B;
        float bl = sin(t * 0.6283 - fi * 0.7) * 0.5 + 0.5;
        ga += gc * bl * bl * vis * 0.004 / (gd + 0.0008);
        p.y -= h;
        p.x = abs(p.x) + 0.008 * sin(fi * 3.1 + t * 0.12);
        p = rot(-(ba + 0.1 * sin(fi * 2.3 + t * 0.08))) * p;
        p /= 0.65;
        sc *= 0.65;
        h *= 0.85;
    }
    col += va * (0.5 + 0.5 * br) + ga * 0.02;
    float cd = min(abs(fract(uv.x * 8.0 + 0.5) - 0.5), abs(fract(uv.y * 8.0 + 0.5) - 0.5));
    col += mix(V, B, sin(uv.y * 5.0 + t * 0.3) * 0.5 + 0.5) * smoothstep(0.02, 0.005, cd) * smoothstep(0.1, 0.02, md) * 0.04 * br;
    for (int i = 0; i < 50; i++) {
        float fi = float(i);
        vec2 q = vec2(fi * 1.37, fi * 0.73);
        vec2 o = vec2((hash(q) - 0.5) * 0.9, hash(q + 10.0) * 1.1 - 0.55);
        float l = fract(t * 0.025 + hash(q + 20.0));
        o += vec2(sin(fi * 2.3 + t * 0.15) * 0.08 * l, l * 0.3);
        float pd = length(uv - o);
        float f = smoothstep(1.0, 0.3, l) * smoothstep(0.0, 0.1, l) * (0.3 + 0.7 * br);
        vec3 pc = V;
        if (mod(fi, 3.0) >= 1.0) pc = mod(fi, 3.0) < 2.0 ? C * 0.7 : B * 0.8;
        col += pc * f * 0.0003 / (pd * pd + 0.00005);
    }
    col *= 1.0 - 0.3 * dot(uv, uv);
    col = 1.0 - exp(-col * 1.5);
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 66;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const reverb = new Tone.Reverb({ decay: 5.0, wet: 0.5 }).toDestination();
    await reverb.generate();

    const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.6 }).connect(reverb);
    const chorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(padFilter);
    chorus.start();

    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        detune: -8,
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.5, release: 3.0 }
    }).connect(chorus);

    const bass = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 1.5, decay: 0.8, sustain: 0.4, release: 2.0 }
    }).connect(reverb);

    const bell = new Tone.FMSynth({
        harmonicity: 4.0,
        modulationIndex: 10,
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 3.0, sustain: 0.0, release: 1.5 },
        modulation: { type: "sine" }
    }).connect(delay);

    const bellHigh = new Tone.FMSynth({
        harmonicity: 5.0,
        modulationIndex: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 2.0, sustain: 0.0, release: 1.0 },
        modulation: { type: "triangle" }
    }).connect(delay);

    const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 1500, Q: 0.3 }).connect(reverb);
    const noise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 0.1, release: 2.0 }
    }).connect(noiseFilter);

    const chords = [
        ["A3", "C4", "E4"],
        ["F3", "A3", "C4"],
        ["G3", "B3", "D4"],
        ["E3", "G3", "B3"]
    ];

    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 17) return;
        const vel = 0.12 + 0.06 * Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.628);
        pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, vel);
        chordIdx++;
    }, "1n").start(0);

    const bassNotes = ["A1", "F1", "G1", "E1"];
    const bassLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 1 || bar >= 17) return;
        const section = Math.floor(bar / 2);
        bass.triggerAttackRelease(bassNotes[section % bassNotes.length], "2n", time, 0.25);
    }, "2n").start(0);

    const viridianNotes = ["E4", "A4", "C5", "E5"];
    const coralNotes = ["F5", "A5", "C5"];
    const ceruleanNotes = ["B3", "D4", "G4", "B4"];
    const allBellNotes = viridianNotes.concat(coralNotes).concat(ceruleanNotes);

    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 2 || bar >= 16) return;
        if (Math.random() > 0.45) return;
        const progress = bar / 18;
        const range = Math.floor(allBellNotes.length * (0.3 + progress * 0.7));
        const note = allBellNotes[Math.floor(Math.random() * Math.max(range, 1))];
        const vel = 0.12 + 0.08 * Math.random();
        if (bellIdx % 3 === 0) {
            bell.triggerAttackRelease(note, "2n", time, vel);
        } else {
            bellHigh.triggerAttackRelease(note, "4n", time, vel * 0.7);
        }
        bellIdx++;
    }, "2n").start(0);

    let noiseIdx = 0;
    const noiseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 4 || bar >= 14) return;
        if (noiseIdx % 4 !== 0) { noiseIdx++; return; }
        noise.triggerAttackRelease("2n", time, 0.06);
        noiseIdx++;
    }, "2n").start(0);

    Tone.Transport.scheduleRepeat((time) => {
        const sec = Tone.Transport.getSecondsAtTime(time);
        const bar = sec / barLen;
        const breathCycle = 400 + 500 * Math.sin(sec * 0.628);
        const buildCurve = Math.min(bar / 10, 1.0) * (1.0 - Math.max((bar - 14) / 4, 0.0));
        padFilter.frequency.setValueAtTime(breathCycle * (0.5 + 0.5 * buildCurve), time);
    }, "8n", 0);

    window.toneJsInstruments = { pad, bass, bell, bellHigh, noise };
    window.toneJsParts = { padLoop, bassLoop, bellLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
