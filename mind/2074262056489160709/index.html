<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}

float wave(vec2 p,vec2 src,float freq,float spd,float t){
  float d=length(p-src);
  return sin(d*freq-t*spd)/(1.0+d*0.7);
}

vec3 pal(float x){
  vec3 a=vec3(0.3,0.25,0.55);
  vec3 b=vec3(0.25,0.45,0.35);
  vec3 c=vec3(1.0,1.0,0.8);
  vec3 d=vec3(0.0,0.3,0.55);
  return a+b*cos(6.2831*(c*x+d));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float breath=sin(t*0.18)*0.5+0.5;

  vec2 s1=vec2(cos(t*0.27)*0.62,sin(t*0.27)*0.62);
  vec2 s2=vec2(cos(t*0.41+2.094)*0.72,sin(t*0.41+2.094)*0.72);
  vec2 s3=vec2(cos(-t*0.33+4.188)*0.68,sin(-t*0.33+4.188)*0.68);

  float w1=wave(uv,s1,22.0,3.5,t);
  float w2=wave(uv,s2,28.0,5.5,t)*(0.7+0.6*sin(t*0.6));
  float w3=wave(uv,s3,18.0,2.8,-t);
  float interference=w1+w2+w3;

  float echoRing=sin(t*0.5-length(uv)*9.0)*(0.4+0.4*sin(t*0.13));
  interference+=echoRing*0.35;

  vec2 grid=uv*7.0;
  vec2 cell=floor(grid);
  vec2 fc=fract(grid)-0.5;
  float nd=length(fc);
  vec2 npos=(cell+0.5)/7.0;
  float nw=wave(npos,s1,22.0,3.5,t)+wave(npos,s2,28.0,5.5,t)+wave(npos,s3,18.0,2.8,-t);
  float stagger=hash(cell)*12.566;
  float life=sin(t*0.55+stagger)*0.5+0.5;
  life=pow(life,7.0);
  float nodeBright=max(nw*0.4,0.0);
  float node=exp(-nd*14.0)*(life*0.85+nodeBright*0.5);

  vec3 indigo=vec3(0.18,0.12,0.48);
  vec3 teal=vec3(0.08,0.65,0.62);
  vec3 col=mix(indigo,teal,smoothstep(-1.2,1.4,interference));
  col+=pal(interference*0.25+t*0.04)*abs(interference)*0.28;
  col+=vec3(0.55,0.92,0.95)*node;

  float band=step(0.94,sin(uv.y*22.0+t*2.3));
  float glitchN=hash(floor(gl_FragCoord.xy*0.5)+floor(t*5.0));
  col+=band*(glitchN-0.5)*0.35*vec3(0.4,0.7,0.9);

  col*=0.92+0.08*sin(gl_FragCoord.y*1.6);

  float ent=hash(floor(gl_FragCoord.xy*0.25)+floor(t*2.0))*0.12*breath;
  col+=ent*vec3(0.3,0.5,0.7);

  col*=smoothstep(1.55,0.35,length(uv));

  float dith=hash(gl_FragCoord.xy)-0.5;
  col+=dith*0.02;

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 74;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 7, wet: 0.42 }).toDestination();
  await masterReverb.generate();

  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 2200, Q: 0.6 }).connect(masterReverb);

  const pulse = new Tone.MembraneSynth({
    pitchDecay: 0.09,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.6, sustain: 0, release: 0.3 }
  }).connect(masterFilter);

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const vel = bar < 1 ? 0.55 : (bar > 13 ? 0.55 : 0.78);
    pulse.triggerAttackRelease("A1", "2n", time + H(3), vel);
  }, "2n").start(0);

  const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 700 }).connect(masterFilter);
  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -7,
    envelope: { attack: 2.5, decay: 1, sustain: 0.65, release: 5 }
  }).connect(droneFilter);

  const droneChords = [
    ["A2", "E3", "C4"],
    ["F2", "C3", "Ab3"],
    ["G2", "D3", "Bb3"],
    ["A2", "E3", "C4"]
  ];
  let dIdx = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 13) {
      drone.triggerAttackRelease(droneChords[dIdx % droneChords.length], "1m", time + H(15), 0.22);
      dIdx++;
    }
  }, "1m").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.45 }).connect(masterFilter);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.8, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(bellDelay);

  const bellNotes = ["E5", "G5", "B5", "D6", "C6", "A5", "E5", "G5"];
  let bIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 12 && Math.random() > 0.55) {
      bell.triggerAttackRelease(bellNotes[bIdx % bellNotes.length], "8n", time + H(10), 0.32);
      bIdx++;
    }
  }, "2n").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.25, delayTime: 4.2, depth: 0.6, wet: 0.5 }).connect(masterFilter);
  padChorus.start();
  const padHPF = new Tone.Filter({ type: "highpass", frequency: 220 }).connect(padChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.8, decay: 0.6, sustain: 0.5, release: 3.5 }
  }).connect(padHPF);

  const padChords = [
    ["A3", "E4", "G4"],
    ["F3", "C4", "Eb4"],
    ["G3", "D4", "F4"],
    ["A3", "E4", "G4"]
  ];
  let pIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 14) {
      pad.triggerAttackRelease(padChords[pIdx % padChords.length], "1m", time + H(12), 0.18);
      pIdx++;
    }
  }, "1m").start(0);

  const pluckReverb = new Tone.Reverb({ decay: 4, wet: 0.55 }).connect(masterFilter);
  await pluckReverb.generate();
  const pluck = new Tone.PluckSynth({
    attackNoise: 0.6,
    dampening: 3500,
    resonance: 0.86
  }).connect(pluckReverb);

  const latticeScale = ["A3", "C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5"];
  const pluckLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 13) {
      const density = bar < 5 ? 0.18 : (bar < 10 ? 0.42 : 0.22);
      if (Math.random() < density) {
        const note = latticeScale[Math.floor(Math.random() * latticeScale.length)];
        pluck.triggerAttackRelease(note, "16n", time + H(7), 0.35 + Math.random() * 0.2);
      }
    }
  }, "16n").start(0);

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 2400 }).connect(masterReverb);
  const bitCrush = new Tone.BitCrusher(5).connect(noiseHPF);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.003, decay: 0.05, sustain: 0 }
  }).connect(bitCrush);

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 12 && Math.random() > 0.82) {
      noise.triggerAttackRelease("32n", time + H(4), 0.12);
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(6500, time + 5 * (60 / bpm) * 4);
  }, "3:0:0");

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(2200, time + 3 * (60 / bpm) * 4);
  }, "12:0:0");

  window.toneJsInstruments = { pulse, drone, bell, pad, pluck, noise };
  window.toneJsParts = { pulseLoop, droneLoop, bellLoop, padLoop, pluckLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 50;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 50;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
