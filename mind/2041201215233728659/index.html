<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = m * p;
        a *= 0.5;
    }
    return v;
}

vec3 stratum(float idx) {
    float h = fract(sin(idx * 73.137) * 43758.5);
    vec3 c;
    if (h < 0.14) c = vec3(0.28, 0.18, 0.10);
    else if (h < 0.28) c = vec3(0.40, 0.37, 0.32);
    else if (h < 0.42) c = vec3(0.65, 0.50, 0.25);
    else if (h < 0.55) c = vec3(0.22, 0.15, 0.08);
    else if (h < 0.68) c = vec3(0.58, 0.45, 0.32);
    else if (h < 0.80) c = vec3(0.50, 0.25, 0.14);
    else if (h < 0.90) c = vec3(0.35, 0.30, 0.22);
    else c = vec3(0.45, 0.40, 0.35);
    c += (fract(sin(idx * 127.3) * 31415.9) - 0.5) * 0.06;
    return c;
}

void main() {
    vec2 uv = gl_FragCoord.xy / iResolution.xy;
    float phase = mod(iTime, 75.0) / 75.0 * 6.28318;

    float compression = 1.0 + 0.12 * sin(phase);
    float shear = sin(phase * 0.5) * 0.06;

    vec2 p = uv;
    p.y = (p.y - 0.5) * compression + 0.5;
    p.x += shear * (p.y - 0.5);

    float w1 = fbm(vec2(p.x * 2.5 + sin(phase * 0.3) * 0.4, p.y * 1.8));
    float w2 = fbm(vec2(p.x * 1.8 + w1 * 0.25, p.y * 2.5 + cos(phase * 0.25) * 0.3));
    float wy = p.y + w1 * 0.07 + w2 * 0.04;

    float ly = wy * 16.0;
    float idx = floor(ly);
    float frc = fract(ly);

    float drift = (hash(vec2(idx, 99.0)) - 0.5) * 0.04 * sin(phase * 0.6 + idx * 0.7);
    float px = p.x + drift;

    vec3 col = stratum(idx);
    float epoch = sin(phase * 0.5 + idx * 0.3) * 0.12;
    col.r += epoch;
    col.b -= epoch;

    col *= 0.7 + 0.6 * fbm(vec2(px * 8.0 + idx * 5.7, wy * 18.0));
    col *= 0.88 + 0.24 * noise(vec2(px * 40.0, wy * 3.0 + idx * 7.0));

    float bnd = 1.0 - smoothstep(0.0, 0.04, frc) * smoothstep(1.0, 0.96, frc);
    float stress = fbm(vec2(px * 5.0 + sin(phase) * 0.6, wy * 10.0));
    float crack = smoothstep(0.56, 0.60, stress);
    float deep = fbm(vec2(px * 1.2 + phase * 0.05, wy * 4.0));
    float deepCrack = smoothstep(0.63, 0.67, deep);
    float breathe = 0.7 + 0.3 * sin(phase * 1.5);
    float totalFrac = max(bnd * 0.5, max(crack * 0.4 * breathe, deepCrack * 0.6 * breathe));

    vec3 glow = mix(vec3(0.15, 0.58, 0.95), vec3(0.95, 0.65, 0.15), hash(vec2(idx, 13.0)));
    float pulse = 0.65 + 0.35 * sin(phase * 2.5 + idx * 1.3 + px * 4.0);
    glow *= pulse * 1.8;

    col = mix(col, glow, totalFrac * 0.85);

    float halo = max(smoothstep(0.48, 0.56, stress) * 0.12, smoothstep(0.55, 0.63, deep) * 0.2);
    col += glow * halo * 0.4 * breathe;

    float waveCenter = 0.5 + 0.3 * sin(phase * 2.0);
    float seismic = exp(-12.0 * (uv.y - waveCenter) * (uv.y - waveCenter));
    seismic *= max(sin(phase * 2.0), 0.0) * 0.08;
    col += glow * seismic;

    if (totalFrac > 0.1) {
        float dots = step(0.96, hash(floor(p * 80.0)));
        col += glow * dots * totalFrac * pulse * 1.5;
    }

    col *= 0.55 + 0.55 * uv.y;
    float edgeFade = smoothstep(0.0, 0.08, uv.y) * smoothstep(1.0, 0.92, uv.y);
    col *= edgeFade * 0.7 + 0.3;

    vec2 vc = uv - 0.5;
    col *= 1.0 - 0.3 * dot(vc, vc);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 48;
    Tone.Transport.bpm.value = bpm;

    const masterRev = new Tone.Reverb({ decay: 10, wet: 0.45 }).toDestination();
    await masterRev.generate();

    const drone = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 5.0, decay: 3.0, sustain: 0.7, release: 5.0 },
        filter: { type: "lowpass", frequency: 180 }
    }).connect(masterRev);
    drone.volume.value = -4;

    const droneNotes = ["C1", "A0", "F1"];
    const droneLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        const section = Math.floor(bar / 5);
        drone.triggerAttackRelease(droneNotes[section % droneNotes.length], "5m", time, 0.5);
    }, "5m").start(0);

    const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 5, depth: 0.7, wet: 0.5 }).connect(masterRev);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 4.0, decay: 3.0, sustain: 0.4, release: 5.0 }
    }).connect(padChorus);
    pad.volume.value = -14;

    const padChords = [["C3", "G3"], ["A2", "E3"], ["F2", "C3"]];
    let padIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 3 && bar < 13) {
            const section = Math.floor(bar / 5);
            pad.triggerAttackRelease(padChords[section % padChords.length], "2m", time, 0.1);
        }
        padIdx++;
    }, "2m").start(0);

    const rumbleLP = new Tone.Filter({ type: "lowpass", frequency: 80, Q: 1.5 }).connect(masterRev);
    const rumble = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 3.0, decay: 4.0, sustain: 0.15, release: 4.0 }
    }).connect(rumbleLP);
    rumble.volume.value = -8;

    const rumbleLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 3 && bar < 12) {
            rumble.triggerAttackRelease("2m", time);
        }
    }, "3m").start(0);

    const crackDelay = new Tone.FeedbackDelay({ delayTime: "2n", feedback: 0.25, wet: 0.5 }).connect(masterRev);
    const crack = new Tone.FMSynth({
        harmonicity: 6,
        modulationIndex: 18,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 1.2, sustain: 0, release: 0.3 },
        modulation: { type: "triangle" }
    }).connect(crackDelay);
    crack.volume.value = -22;

    const crackNotes = ["C5", "G4", "E5", "A4"];
    let crackIdx = 0;
    const crackLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 6 && bar < 13) {
            const trigger = Math.sin(crackIdx * 5.7 + bar * 3.1) > 0.55;
            if (trigger) {
                crack.triggerAttackRelease(crackNotes[crackIdx % crackNotes.length], "16n", time, 0.12);
            }
        }
        crackIdx++;
    }, "1m").start(0);

    const lumBP = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 4 }).connect(masterRev);
    const lum = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 3.0, decay: 2.0, sustain: 0.25, release: 4.0 }
    }).connect(lumBP);
    lum.volume.value = -24;

    const lumNotes = ["G5", "E5", "C5"];
    let lumIdx = 0;
    const lumLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 8 && bar < 12) {
            lum.triggerAttackRelease(lumNotes[lumIdx % lumNotes.length], "1m", time, 0.08);
        }
        lumIdx++;
    }, "1m").start(0);

    window.toneJsInstruments = { drone, pad, rumble, crack, lum };
    window.toneJsParts = { droneLoop, padLoop, rumbleLoop, crackLoop, lumLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
