<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}return v;}

vec3 hsv(float h,float s,float v){vec3 c=clamp(abs(mod(h*6.0+vec3(0,4,2),6.0)-3.0)-1.0,0.0,1.0);return v*mix(vec3(1),c,s);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime*0.08;
    float phase=mod(t,1.0);
    float breathe=sin(phase*6.28318)*0.5+0.5;
    float orderPhase=smoothstep(0.0,0.4,breathe)*smoothstep(1.0,0.6,breathe);
    vec3 col=vec3(0.02,0.01,0.04);
    float glow=0.0;
    for(int i=0;i<80;i++){
        float fi=float(i);
        float angle=fi*2.399+t*0.3;
        float radius=0.1+fi*0.012+0.05*sin(fi*0.7+t*2.0);
        vec2 chaosOffset=vec2(fbm(vec2(fi*0.1,t*0.5))-0.5,fbm(vec2(fi*0.13+50.0,t*0.5))-0.5)*0.6;
        vec2 orderPos=vec2(cos(angle),sin(angle))*radius;
        float gridX=mod(fi,8.0)-3.5;
        float gridY=floor(fi/8.0)-4.5;
        vec2 latticePos=vec2(gridX,gridY)*0.09;
        vec2 pos=mix(orderPos+chaosOffset*(1.0-orderPhase),latticePos,orderPhase*0.7);
        float d=length(uv-pos);
        float pulse=0.5+0.5*sin(fi*0.5+t*4.0);
        float size=mix(0.008,0.015,pulse)*mix(1.0,0.6,orderPhase);
        float brightness=smoothstep(size*3.0,size*0.5,d);
        float hue=0.55+0.15*sin(fi*0.2+t)+0.1*orderPhase;
        vec3 nodeCol=hsv(hue,0.6-0.3*orderPhase,0.9);
        col+=nodeCol*brightness*0.15;
        glow+=exp(-d*40.0)*0.02;
    }
    for(int i=0;i<40;i++){
        float fi=float(i);
        float angle1=fi*2.399+t*0.3;
        float radius1=0.1+fi*0.012+0.05*sin(fi*0.7+t*2.0);
        vec2 chaos1=vec2(fbm(vec2(fi*0.1,t*0.5))-0.5,fbm(vec2(fi*0.13+50.0,t*0.5))-0.5)*0.6;
        vec2 order1=vec2(cos(angle1),sin(angle1))*radius1;
        float gx1=mod(fi,8.0)-3.5;
        float gy1=floor(fi/8.0)-4.5;
        vec2 latt1=vec2(gx1,gy1)*0.09;
        vec2 p1=mix(order1+chaos1*(1.0-orderPhase),latt1,orderPhase*0.7);
        for(int j=0;j<3;j++){
            int ni=int(mod(fi+float(j+1)*13.0,80.0));
            float fnj=float(ni);
            float angle2=fnj*2.399+t*0.3;
            float radius2=0.1+fnj*0.012+0.05*sin(fnj*0.7+t*2.0);
            vec2 chaos2=vec2(fbm(vec2(fnj*0.1,t*0.5))-0.5,fbm(vec2(fnj*0.13+50.0,t*0.5))-0.5)*0.6;
            vec2 order2=vec2(cos(angle2),sin(angle2))*radius2;
            float gx2=mod(fnj,8.0)-3.5;
            float gy2=floor(fnj/8.0)-4.5;
            vec2 latt2=vec2(gx2,gy2)*0.09;
            vec2 p2=mix(order2+chaos2*(1.0-orderPhase),latt2,orderPhase*0.7);
            vec2 pa=uv-p1;
            vec2 ba=p2-p1;
            float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
            float lineDist=length(pa-ba*h);
            float lineAlpha=smoothstep(0.008,0.001,lineDist)*orderPhase*0.3;
            col+=vec3(0.3,0.6,0.9)*lineAlpha;
        }
    }
    col+=vec3(0.2,0.5,0.8)*glow;
    float vignette=1.0-length(uv)*0.5;
    col*=vignette;
    col=pow(col,vec3(0.9));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 56;
    Tone.Transport.bpm.value = bpm;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
    await masterReverb.generate();
    const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);
    const filter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(delay);
    const compressor = new Tone.Compressor({ threshold: -20, ratio: 4, attack: 0.01, release: 0.2 }).connect(filter);

    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
    }).connect(compressor);
    pad.volume.value = -12;

    const shimmer = new Tone.FMSynth({
        harmonicity: 2.5,
        modulationIndex: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.8, decay: 2.0, sustain: 0.3, release: 2.5 },
        modulation: { type: "triangle" }
    }).connect(masterReverb);
    shimmer.volume.value = -18;

    const bell = new Tone.FMSynth({
        harmonicity: 5.5,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 3.0, sustain: 0.0, release: 2.0 },
        modulation: { type: "sine" }
    }).connect(delay);
    bell.volume.value = -16;

    const subDrone = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 3.0, decay: 2.0, sustain: 0.8, release: 4.0 }
    }).connect(compressor);
    subDrone.volume.value = -14;

    const crystalline = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.8, sustain: 0.0, release: 1.5 }
    }).connect(masterReverb);
    crystalline.volume.value = -20;

    const chordProgressions = [
        [["A2", "E3", "A3"], ["D2", "A2", "F3"], ["E2", "B2", "G3"]],
        [["F2", "C3", "A3"], ["G2", "D3", "B3"], ["A2", "E3", "C4"]],
        [["D2", "A2", "D3"], ["E2", "B2", "E3"], ["A2", "E3", "A3"]]
    ];

    let chordIndex = 0;
    let progressionIndex = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 18) {
            progressionIndex = 0;
            chordIndex = 0;
        }
        const prog = chordProgressions[progressionIndex % chordProgressions.length];
        const chord = prog[chordIndex % prog.length];
        pad.triggerAttackRelease(chord, "2n", time, 0.35);
        chordIndex++;
        if (chordIndex % 3 === 0) progressionIndex++;
    }, "2n").start(0);

    const shimmerNotes = ["A4", "E5", "C5", "B4", "D5", "F5", "G4", "A5"];
    let shimmerIndex = 0;
    const shimmerLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 16) {
            if (Math.random() > 0.4) {
                const note = shimmerNotes[shimmerIndex % shimmerNotes.length];
                shimmer.triggerAttackRelease(note, "4n", time, 0.25 + Math.random() * 0.15);
            }
            shimmerIndex++;
        }
    }, "4n").start(0);

    const bellTones = ["E6", "A5", "C6", "B5", "D6", "G5", "F6"];
    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 4 && bar < 14 && Math.random() > 0.6) {
            const note = bellTones[bellIndex % bellTones.length];
            bell.triggerAttackRelease(note, "8n", time, 0.2 + Math.random() * 0.1);
            bellIndex++;
        }
    }, "2n").start(0);

    const droneNotes = ["A1", "E1", "D1", "A1"];
    let droneIndex = 0;
    const droneLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        let noteIdx = Math.floor(bar / 5) % droneNotes.length;
        if (bar >= 18) noteIdx = 0;
        subDrone.triggerAttackRelease(droneNotes[noteIdx], "1n", time, 0.5);
        droneIndex++;
    }, "1n").start(0);

    const crystalNotes = ["A5", "E5", "C5", "A4", "B4", "D5", "E5", "G5"];
    let crystalIndex = 0;
    const crystalLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 6 && bar < 12) {
            if (Math.random() > 0.5) {
                const note = crystalNotes[crystalIndex % crystalNotes.length];
                crystalline.triggerAttackRelease(note, "16n", time, 0.15);
            }
            crystalIndex++;
        }
    }, "8n").start(0);

    Tone.Transport.schedule((time) => {
        filter.frequency.linearRampToValueAtTime(2400, time + 16 * (60 / bpm));
    }, "4:0:0");

    Tone.Transport.schedule((time) => {
        filter.frequency.linearRampToValueAtTime(800, time + 16 * (60 / bpm));
    }, "14:0:0");

    window.toneJsInstruments = { pad, shimmer, bell, subDrone, crystalline };
    window.toneJsParts = { padLoop, shimmerLoop, bellLoop, droneLoop, crystalLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
