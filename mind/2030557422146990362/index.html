<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 hash(vec2 p){
    p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
    return fract(sin(p)*43758.5453);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);
    float ph=t/60.0;
    float grow=sin(ph*3.14159)*1.6;
    vec3 deep=vec3(0.25,0.08,0.55);
    vec3 warm=vec3(1.0,0.75,0.15);
    vec3 col=vec3(0.04,0.02,0.08);
    for(float L=0.0;L<3.0;L++){
        float sc=5.0+L*4.0;
        vec2 g=uv*sc;
        vec2 id=floor(g);
        float md=10.0,md2=10.0;
        for(float x=-1.0;x<=1.0;x++){
            for(float y=-1.0;y<=1.0;y++){
                vec2 n=id+vec2(x,y);
                vec2 o=hash(n);
                float v=0.04*sin(t*(2.0+o.x*3.0)+o.y*6.28);
                vec2 p=n+o+vec2(v,v*0.7);
                float d=length(g-p);
                if(d<md){md2=md;md=d;}
                else if(d<md2){md2=d;}
            }
        }
        float edge=md2-md;
        float wire=1.0-smoothstep(0.0,0.05,edge);
        float wd=length(id/sc);
        float mask=1.0-smoothstep(grow-0.2,grow,wd);
        float pulse=0.7+0.3*sin(t*3.0-wd*6.0+L*2.0);
        float cm=clamp(wd/1.5+0.3*sin(t*0.7),0.0,1.0);
        vec3 tc=mix(deep*3.5,warm*2.2,cm);
        col+=tc*wire*mask*pulse*(0.7/(1.0+L*0.35));
        float ng=0.004/(md*md+0.002);
        col+=mix(deep*3.0,warm*1.5,pulse)*ng*mask*0.2/(1.0+L);
    }
    float cg=0.015/(length(uv)+0.01);
    float bp=0.7+0.3*sin(t*2.0);
    col+=mix(deep*4.0,warm*1.5,0.5+0.5*sin(t*0.4))*cg*0.6*bp;
    col*=1.0-0.25*length(uv);
    gl_FragColor=vec4(pow(col,vec3(0.85)),1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm=72;
  Tone.Transport.bpm.value=bpm;
  const barSec=60/bpm*4;
  const rev=new Tone.Reverb({decay:4,wet:0.4}).toDestination();
  await rev.generate();
  const del=new Tone.FeedbackDelay({delayTime:"4n.",feedback:0.35,wet:0.25}).connect(rev);
  const pf=new Tone.Filter({type:"lowpass",frequency:600}).connect(rev);
  const pad=new Tone.PolySynth(Tone.Synth,{
    oscillator:{type:"sawtooth"},
    envelope:{attack:1.2,decay:0.5,sustain:0.6,release:2.0}
  }).connect(pf);
  const chords=[["D3","F3","A3"],["C3","E3","G3"],["A2","C3","E3"],["G2","B2","D3"]];
  let ci=0;
  const padLoop=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/barSec);
    if(bar<17){
      pad.triggerAttackRelease(chords[ci%chords.length],"1n",time,0.12+bar*0.008);
      ci++;
    }
  },"1n").start(0);
  const bell=new Tone.FMSynth({
    harmonicity:3.5,modulationIndex:8,
    envelope:{attack:0.001,decay:1.5,sustain:0,release:0.5},
    modulation:{type:"sine"}
  }).connect(del);
  const bn=["A4","E5","D5","C5","F5","G4","B4","A5"];
  let bi=0;
  const bellLoop=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/barSec);
    const p=bar/18;
    if(Math.random()<0.25+p*0.4&&bar>=3&&bar<15){
      bell.triggerAttackRelease(bn[bi%bn.length],"8n",time,0.12+p*0.15);
      bi++;
    }
  },"4n").start(0);
  const sub=new Tone.Synth({
    oscillator:{type:"sine"},
    envelope:{attack:0.5,decay:0.5,sustain:0.9,release:1.5}
  }).toDestination();
  const sn=["D2","C2","A1","G1"];
  const subLoop=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/barSec);
    if(bar<16) sub.triggerAttackRelease(sn[Math.floor(bar/4)%sn.length],"1n",time,0.18);
  },"1n").start(0);
  const nf=new Tone.Filter({type:"bandpass",frequency:800,Q:2}).connect(rev);
  const noise=new Tone.NoiseSynth({
    noise:{type:"pink"},envelope:{attack:0.3,decay:0.5,sustain:0.2,release:1}
  }).connect(nf);
  const noiseLoop=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/barSec);
    if(bar>=4&&bar<14&&Math.random()<0.35){
      nf.frequency.value=400+Math.random()*1200;
      noise.triggerAttackRelease("4n",time,0.07);
    }
  },"2n").start(0);
  Tone.Transport.schedule((time)=>{
    pf.frequency.linearRampToValueAtTime(2400,time+9*barSec);
  },"3:0:0");
  Tone.Transport.schedule((time)=>{
    pf.frequency.linearRampToValueAtTime(600,time+3*barSec);
  },"14:0:0");
  window.toneJsInstruments={pad,bell,sub,noise};
  window.toneJsParts={padLoop,bellLoop,subLoop,noiseLoop};
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
