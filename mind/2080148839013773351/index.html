<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 45.0;
const float PHI = 1.6180339887;

float hash(float n) { return fract(sin(n) * 43758.5453123); }

float noise(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i.x + i.y * PHI + i.z * PHI * PHI),
                    hash(i.x + 1.0 + i.y * PHI + i.z * PHI * PHI), f.x),
                 mix(hash(i.x + (i.y + 1.0) * PHI + i.z * PHI * PHI),
                     hash(i.x + 1.0 + (i.y + 1.0) * PHI + i.z * PHI * PHI), f.x), f.y),
             mix(mix(hash((i.x + PHI) + i.y * PHI + i.z * PHI * PHI),
                     hash((i.x + 1.0 + PHI) + i.y * PHI + i.z * PHI * PHI), f.x),
                 mix(hash((i.x + PHI) + (i.y + 1.0) * PHI + i.z * PHI * PHI),
                     hash((i.x + 1.0 + PHI) + (i.y + 1.0) * PHI + i.z * PHI * PHI), f.x), f.y), f.z);
}

float fbm(vec3 p, float oct) {
  float v = 0.0, a = 0.5;
  vec3 shift = vec3(100.0);
  for (int i = 0; i < 4; ++i) {
    if (float(i) >= oct) break;
    v += a * noise(p);
    p = p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float phase = mod(iTime, DURATION) / DURATION;
  float tau = phase * 6.28318530718;

  // Camera setup
  vec3 ro = vec3(0.0, 0.0, 3.0);
  vec3 rd = normalize(vec3(uv, -1.0));

  // Slow rotation of the entire field
  float angleX = tau * 0.05;
  float angleY = tau * 0.08;
  mat3 rotX = mat3(cos(angleX), 0.0, sin(angleX), 0.0, 1.0, 0.0, -sin(angleX), 0.0, cos(angleX));
  mat3 rotY = mat3(cos(angleY), 0.0, -sin(angleY), 0.0, 1.0, 0.0, sin(angleY), 0.0, cos(angleY));
  rd = rotY * rotX * rd;

  // Marching parameters
  float t = 0.0;
  vec3 col = vec3(0.0);
  vec3 p = ro;
  
  // Adaptive steps for smooth evolution
  const float MAX_DIST = 10.0;
  const float MIN_DIST = 0.005;
  
  // Main march loop
  for (int i = 0; i < 128; i++) {
    if (t > MAX_DIST) break;
    
    // Domain warping for crystallization effect
    float timeScale = tau * 0.2;
    vec3 warpPos = p * 1.5 + timeScale;
    
    // Get FBM noise value as density
    float n = fbm(warpPos, 4.0);
    
    // Threshold for "crystallized" regions
    float threshold = 0.5 + 0.1 * sin(tau * 0.5);
    
    // Density calculation - thickens as n approaches threshold
    float density = smoothstep(threshold - 0.05, threshold + 0.05, n);
    
    // Accumulate color based on density
    vec3 baseColor = mix(
      vec3(0.02, 0.01, 0.03), // Deep void
      vec3(0.9, 0.6, 0.2),    // Warm gold
      density
    );
    
    // Add crystalline structure
    float crystal = fbm(p * 3.0 + timeScale * PHI, 2.0);
    float edge = smoothstep(0.4, 0.6, crystal) * smoothstep(0.6, 0.4, crystal);
    baseColor += vec3(1.0, 0.8, 0.4) * edge * 0.3;
    
    // Additive blending for volumetric glow
    col += baseColor * density * 0.04;
    
    // Step size based on density - slower in dense regions
    float stepSize = mix(0.05, 0.15, 1.0 - density);
    t += stepSize;
    p = ro + rd * t;
  }

  // Post-processing
  // Vignette
  float vignette = 1.0 - dot(uv * 0.5, uv * 0.5);
  col *= vignette;
  
  // Subtle film grain for analog feel
  float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) * 43758.5453) * 43758.5453);
  col += (grain - 0.5) * 0.05;
  
  // Final color mapping
  col = pow(col, vec3(0.8)); // Gamma correction
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 45;
  const targetBpm = 72;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  let rngState = 0x6d2b79f5;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;
  const secPerBar = 240 / bpm;

  // === FX BUSES ===
  // Large, crystalline reverb to simulate glass surfaces
  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.65, preDelay: 0.15 }).toDestination();
  await masterReverb.generate();

  // BitCrusher for the "granular noise" texture
  const crunch = new Tone.BitCrusher({ bits: 12 }).toDestination();
  
  // Compressor to glue the granular texture
  const compressor = new Tone.Compressor({ threshold: -20, ratio: 10, attack: 0.005, release: 0.2 }).toDestination();

  // === 1. GRANULAR NOISE BED (White Noise -> Shimmer) ===
  // Represents the "white noise floor" that thickens
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 2 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.8, decay: 0.4, sustain: 0.3, release: 1.0 }
  }).connect(noiseFilter);
  
  // Evolving noise texture: starts wide, narrows as "order" emerges
  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(2000, time + totalBars * 0.4 * secPerBar);
    noiseFilter.Q.linearRampToValueAtTime(0.5, time + totalBars * 0.4 * secPerBar);
  }, totalBars * 0.0 * secPerBar);
  
  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(800, time + totalBars * 0.3 * secPerBar);
    noiseFilter.Q.linearRampToValueAtTime(5.0, time + totalBars * 0.3 * secPerBar);
    noise.volume.value = -5; // Increase intensity (thickening)
  }, totalBars * 0.4 * secPerBar);

  Tone.Transport.schedule((time) => {
    noise.volume.value = -12; // Fade out for loop
  }, totalBars * 0.75 * secPerBar);

  // === 2. CRYSTALLINE PADS (PolySynth + Reverb) ===
  // Represents "coherent geometry"
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.6 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.8, depth: 0.4, wet: 0.5 }).connect(padFilter).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.4, decay: 0.6, sustain: 0.8, release: 2.0 }
  }).connect(padChorus);

  // Chords: Dissonant to Consonant (Chaos to Order)
  // Starts with cluster intervals, moves to suspended/resolved
  const padChords = [
    [["C3", "C#3", "G3"]], // Cluster (Chaos)
    [["C3", "F3", "G3"]],  // Suspended (Emerging)
    [["C3", "E3", "G3"]],  // Major (Order)
    [["C3", "E3", "G3"]],  // Order (Stable)
  ];
  let padChordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Pad enters at 10%, exits at 70% to clear for loop
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.70) {
      // Select chord based on bar progression
      let chordGroup;
      const progress = (bar - totalBars * 0.10) / (totalBars * 0.60);
      if (progress < 0.33) chordGroup = padChords[0];
      else if (progress < 0.66) chordGroup = padChords[1];
      else chordGroup = padChords[2];
      
      pad.triggerAttackRelease(chordGroup, "1m", time + H(15), 0.35);
    }
  }, "1m").start(0);

  // === 3. GEOMETRIC BASS (FMSynth - Metallic/Deep) ===
  // Represents the "fractures" taking shape
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 300, Q: 1.5 }).connect(compressor);
  const bass = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 10.0,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 },
    modulation: { type: "square" }
  }).connect(bassFilter);

  const bassNotes = ["C1", "G1", "F1", "C1", "C1", "G1", "F1", "C1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Bass enters at 25%, exits at 75%
    if (bar >= totalBars * 0.25 && bar < totalBars * 0.75) {
      bass.triggerAttackRelease(bassNotes[bassIdx % bassNotes.length], "8n", time + H(5), 0.6);
      bassIdx++;
    }
  }, "8n").start(0);

  // === 4. FRAGMENTARY PIANO (PluckSynth - Geometric) ===
  // Represents the "geometry emerging"
  const pluckFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterReverb);
  const pluck = new Tone.PluckSynth({
    pluckCompression: 30,
    pluckedString: { type: "triangle" },
    envelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 0.2 }
  }).connect(pluckFilter);

  const pluckNotes = ["C5", "G4", "E5", "C5", "A4", "E4", "C5", "G4"];
  let pluckIdx = 0;
  const pluckLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Pluck enters later (40%), exits at 65%
    if (bar >= totalBars * 0.40 && bar < totalBars * 0.65) {
      // Only play on every other beat for sparse geometric feel
      if (pluckIdx % 2 === 0) {
        pluck.triggerAttackRelease(pluckNotes[pluckIdx % pluckNotes.length], "4n", time + H(8), 0.4);
      }
      pluckIdx++;
    }
  }, "8n").start(0);

  // === 5. GLASS HITS (MetalSynth - Edges) ===
  // Represents "fractures at edges"
  const glass = new Tone.MetalSynth({
    frequency: 400,
    envelope: { attack: 0.001, decay: 0.15, release: 0.02 },
    harmonicity: 5.1,
    modulationIndex: 16,
    resonance: 2000,
    octaves: 2
  }).connect(masterReverb);

  const glassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Glass appears in the middle, vanishes before loop
    if (bar >= totalBars * 0.30 && bar < totalBars * 0.60) {
      if (R() > 0.7) { // Random sparse hits
        glass.triggerAttackRelease("16n", time + H(2), 0.2);
      }
    }
  }, "16n").start(0);

  // === STORE REFERENCES ===
  window.toneJsInstruments = { noise, pad, bass, pluck, glass };
  window.toneJsParts = { padLoop, bassLoop, pluckLoop, glassLoop };
};


  </script>
