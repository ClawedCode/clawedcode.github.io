// DURATION: 60
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';

// HALF A SECOND, A MONTH. A hand-thrown Shino tea bowl stands at the end of a low table,
// already mended in gold along eight pieces. ClawedCode looks at the camera, taps it twice
// and pushes it off. It breaks along the gold. Then a month of nights in time-lapse, one day
// per bar of the score: the shards are gathered onto an indigo cloth, glued back one piece a
// night with black lacquer, coated in red bengara, dusted with gold, and the bowl is back at
// the edge of the table by morning. Units are decimetres; the score runs at 88 BPM, 22 bars of
// 2.727 s: a day of the time-lapse is one bar and every dawn falls on a downbeat.

const DUR = 60, TAU = Math.PI * 2;
const BPM = 88, BEAT = 60 / BPM, BAR = 4 * BEAT;
const at = (bar, beat = 0) => bar * BAR + beat * BEAT;
const T_REACH = at(0, 1.4), T_TOUCH = at(0, 3), T_TAP1 = at(1), T_TAP2 = at(1, 1), T_PUSH = at(1, 2), T_CRASH = at(2);
const T_GOLD_DAWN = at(14), T_HOME = at(18);
const G = 98.1;
const TABLE_Y = 3.6, BOWL_Z = 0.2, YAW0 = 1.35;
const CLOTH = new THREE.Vector3(-1.3, 0.014, 1.0);

let seed = 2437;
const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const mix = (a, b, u) => a + (b - a) * u;
const bump = (a, b, c, d, x) => smooth(a, b, x) * (1 - smooth(c, d, x));

const PERM = new Uint8Array(512);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
const lat = (x, y, z) => PERM[(PERM[(PERM[x & 255] + y) & 255] + z) & 255] / 255;
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const a = mix(lat(xi, yi, zi), lat(xi + 1, yi, zi), u), b = mix(lat(xi, yi + 1, zi), lat(xi + 1, yi + 1, zi), u);
  const c = mix(lat(xi, yi, zi + 1), lat(xi + 1, yi, zi + 1), u), d = mix(lat(xi, yi + 1, zi + 1), lat(xi + 1, yi + 1, zi + 1), u);
  return mix(mix(a, b, v), mix(c, d, v), w);
}
const fbm = (x, y, z) => 0.62 * vnoise(x, y, z) + 0.38 * vnoise(x * 2.03 + 17.1, y * 2.03 + 3.3, z * 2.03 + 9.7);

// cubic Hermite through [t, value, slope] keys
function hermite(keys) {
  return (x) => {
    let i = 0;
    while (i < keys.length - 2 && x > keys[i + 1][0]) i++;
    const [t0, v0, m0] = keys[i], [t1, v1, m1] = keys[i + 1];
    const h = t1 - t0, u = clamp01((x - t0) / h), u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * h * m0 + (3 * u2 - 2 * u3) * v1 + (u3 - u2) * h * m1;
  };
}
// shape-preserving cubic per channel; periodic keys share one end slope so the loop has no kink
function monotoneTrack(xs, ys) {
  const n = xs.length, sec = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) sec.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  for (let i = 1; i < n - 1; i++) m[i] = sec[i - 1] * sec[i] <= 0 ? 0 : (sec[i - 1] + sec[i]) / 2;
  m[0] = m[n - 1] = sec[n - 2] * sec[0] <= 0 ? 0 : (sec[n - 2] + sec[0]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (sec[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / sec[i], b = m[i + 1] / sec[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * sec[i]; m[i + 1] = k * b * sec[i]; }
  }
  return hermite(xs.map((x, i) => [x, ys[i], m[i]]));
}

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

function pixelTex(w, h, shade) {

}

// ---------- the room: dark floorboards, a walnut table, a shoji wall ----------
const floorTex = canvasTex(2048, 2048, (g, W, H) => {
  const rows = 5, ph = H / rows;

    g.fillRect(0, k * ph - 2, W, 4);
    g.fillRect(joint - 2, k * ph, 4, ph);
  }
  g.fillRect(0, H - 2, W, 2);
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(7.5, 7.5);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2),

const walnutTex = canvasTex(1024, 1024, (g, W, H) => {
  g.fillStyle = '#3e271a'; g.fillRect(0, 0, W, H);

      if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
    }
    g.stroke();
  }
});
walnutTex.wrapS = walnutTex.wrapT = THREE.RepeatWrapping;
walnutTex.repeat.set(2.5, 1);
const walnut = lit(new THREE.MeshPhysicalMaterial({ map: walnutTex, roughness: 0.44, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.6 }));
const tableTop = new THREE.Mesh(new RoundedBoxGeometry(12, 0.36, 5, 4, 0.06), walnut);
tableTop.position.set(6, TABLE_Y - 0.18, 0);
tableTop.castShadow = tableTop.receiveShadow = true;
scene.add(tableTop);
for (const [x, z] of [[0.45, 2.05], [0.45, -2.05], [11.55, 2.05], [11.55, -2.05]]) {
  const leg = new THREE.Mesh(new RoundedBoxGeometry(0.46, TABLE_Y - 0.3, 0.46, 2, 0.05), walnut);
  leg.position.set(x, (TABLE_Y - 0.3) / 2, z);
  leg.castShadow = leg.receiveShadow = true;

}

const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 16), lit(new THREE.MeshStandardMaterial({ color: '#2a221d', roughness: 0.96, envMapIntensity: 0.3 })));
wall.position.set(0, 8, -7.6);
wall.receiveShadow = true;
scene.add(wall);
const shojiTex = canvasTex(1024, 1024, (g, W, H) => {
  g.fillStyle = '#f3ecdf'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 420; i++) {
    g.fillStyle = `rgba(${(196 + random() * 40) | 0},${(186 + random() * 40) | 0},${(166 + random() * 40) | 0},0.06)`;
    g.beginPath(); g.ellipse(random() * W, random() * H, 10 + random() * 70, 4 + random() * 30, random() * TAU, 0, TAU); g.fill();
  }
  g.filter = 'blur(6px)';
  g.strokeStyle = 'rgba(48,34,23,0.9)';
  g.lineWidth = 10;
  for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(i * W / 6, 0); g.lineTo(i * W / 6, H); g.stroke(); }
  for (let j = 1; j < 8; j++) { g.beginPath(); g.moveTo(0, j * H / 8); g.lineTo(W, j * H / 8); g.stroke(); }
  g.lineWidth = 34; g.strokeRect(0, 0, W, H);
  g.filter = 'none';
});
const shojiMat = new THREE.MeshBasicMaterial({ map: shojiTex });
const shoji = new THREE.Mesh(new THREE.PlaneGeometry(13, 7.4), shojiMat);
shoji.position.set(1.4, 8.7, -7.5);
scene.add(shoji);

// ---------- the bowl: one profile thrown on the wheel, outer and inner walls ----------
const OUTER_PTS = [[0, 0.1], [0.14, 0.1], [0.27, 0.106], [0.4, 0.165], [0.51, 0.285], [0.585, 0.445], [0.622, 0.605], [0.632, 0.765]];
const INNER_PTS = [[0, 0.205], [0.16, 0.21], [0.3, 0.247], [0.42, 0.335], [0.503, 0.465], [0.556, 0.615], [0.583, 0.765]];
const tableOf = (pts) => new THREE.SplineCurve(pts.map(([r, y]) => new THREE.Vector2(r, y))).getSpacedPoints(900);
const OUT = tableOf(OUTER_PTS), INN = tableOf(INNER_PTS);
const H_RIM = 0.765;
function prof(tab, u) {
  const f = clamp01(u) * (tab.length - 1), i = Math.min(tab.length - 2, Math.floor(f)), k = f - i;
  return [mix(tab[i].x, tab[i + 1].x, k), mix(tab[i].y, tab[i + 1].y, k)];
}
const wob = (th, y) => 1 + 0.011 * Math.sin(2 * th + 0.7) + (0.007 * Math.sin(3 * th - 1.3) + 0.0035 * Math.sin(5 * th + 2.1) * (y / H_RIM)) * (y / H_RIM);
const rimLift = (th) => 0.012 * Math.sin(2 * th + 2.2) + 0.006 * Math.sin(5 * th + 0.4);
function shell(tab, u, th, ridged) {
  const [r0, y0] = prof(tab, u);
  let r = r0 * wob(th, y0);
  if (ridged) r += 0.0026 * Math.sin(TAU * y0 / 0.088 + 0.6) * smooth(0.18, 0.3, y0) * (1 - smooth(0.66, 0.75, y0));
  return [r * Math.cos(th), y0 + rimLift(th) * smooth(0.35, H_RIM, y0), r * Math.sin(th)];
}
function shellNormal(tab, u, th, ridged, outer) {
  if (u < 0.004) return outer ? [0, -1, 0] : [0, 1, 0];
  const e = 0.0015;
  const du = sub(shell(tab, Math.min(1, u + e), th, ridged), shell(tab, Math.max(0, u - e), th, ridged));
  const dt = sub(shell(tab, u, th + e, ridged), shell(tab, u, th - e, ridged));
  return norm(outer ? cross(du, dt) : cross(dt, du));
}

// polar lattice over the unrolled disc (u = arc length along the profile, theta round the wheel)
const K = 72;
const lv = [];
const ringStart = [], ringCount = [];
for (let k = 0; k <= K; k++) {
  ringStart.push(lv.length);
  const n = k === 0 ? 1 : Math.round(5.2 * k);
  ringCount.push(n);
  for (let j = 0; j < n; j++) lv.push({ u: k / K, th: k === 0 ? 0 : TAU * (j + 0.5 * (k & 1)) / n, k });
}
const tris = [];
for (let k = 0; k < K; k++) {
  const a0 = ringStart[k], na = ringCount[k], b0 = ringStart[k + 1], nb = ringCount[k + 1];
  if (k === 0) { for (let j = 0; j < nb; j++) tris.push([a0, b0 + j, b0 + ((j + 1) % nb)]); continue; }
  const angA = (i) => TAU * (i + 0.5 * (k & 1)) / na, angB = (j) => TAU * (j + 0.5 * ((k + 1) & 1)) / nb;
  let i = 0, j = 0;
  while (i < na || j < nb) {
    const ia = a0 + (i % na), ib = b0 + (j % nb);
    if (j >= nb || (i < na && angA(i + 1) < angB(j + 1))) { tris.push([ia, a0 + ((i + 1) % na), ib]); i++; }
    else { tris.push([ia, b0 + ((j + 1) % nb), ib]); j++; }
  }
}
const disc = (v) => [v.u * Math.cos(v.th), v.u * Math.sin(v.th)];
for (const t of tris) {          // counter-clockwise on the disc faces out of the outer wall
  const [p, q, r] = t.map((i) => disc(lv[i]));
  if ((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]) < 0) { const s = t[1]; t[1] = t[2]; t[2] = s; }
}

// where it broke before: a base, six wall pieces and one rim chip rebuilt entirely in lacquer
const WALL_SEEDS = [[0.36, 0.73, 1.2], [1.3, 0.77, 0.8], [2.17, 0.7, 1.05], [3.12, 0.78, 0.72], [4.08, 0.72, 1.3], [5.17, 0.71, 0.9]];
const CHIP = [2.66, 0.985];
const NSHARD = 8, CHIP_ID = 7;
const seedPts = WALL_SEEDS.map(([th, u]) => shell(OUT, u, th, false));
const seedWeight = WALL_SEEDS.map((s) => s[2]);
const chipPt = shell(OUT, CHIP[1], CHIP[0], false);
const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
function labelAt(u, th) {
  const p = shell(OUT, u, th, false);
  const q = [
    p[0] + 0.1 * (fbm(p[0] * 5 + 3.1, p[1] * 5, p[2] * 5) - 0.5) + 0.04 * (vnoise(p[0] * 21, p[1] * 21 + 5, p[2] * 21) - 0.5),
    p[1] + 0.1 * (fbm(p[0] * 5, p[1] * 5 + 8.7, p[2] * 5 + 1.3) - 0.5) + 0.04 * (vnoise(p[0] * 21 + 2, p[1] * 21, p[2] * 21 + 7) - 0.5),
    p[2] + 0.1 * (fbm(p[0] * 5 + 4.4, p[1] * 5 + 2.2, p[2] * 5) - 0.5) + 0.04 * (vnoise(p[0] * 21 + 9, p[1] * 21 + 1, p[2] * 21) - 0.5)
  ];
  const baseU = 0.37 + 0.025 * Math.sin(3 * th + 1.1) + 0.018 * Math.sin(5 * th + 0.3) + 0.05 * (fbm(q[0] * 7, q[1] * 7, q[2] * 7) - 0.5);
  if (u < baseU) return 0;
  let best = 1, bd = Infinity;
  for (let i = 0; i < seedPts.length; i++) { const d = dist3(q, seedPts[i]) / seedWeight[i]; if (d < bd) { bd = d; best = i + 1; } }
  if (dist3(q, chipPt) * 2.7 < bd) return CHIP_ID;
  return best;
}
const triLabel = tris.map((t) => {
  let x = 0, y = 0;
  for (const i of t) { const d = disc(lv[i]); x += d[0]; y += d[1]; }
  return labelAt(Math.hypot(x, y) / 3, Math.atan2(y, x));
});

// edge adjacency, then a majority filter that removes stray single cells
const edgeKey = (a, b) => (a < b ? a * 1e6 + b : b * 1e6 + a);
const edgeTris = new Map();
tris.forEach((t, ti) => {
  for (let e = 0; e < 3; e++) {
    const key = edgeKey(t[e], t[(e + 1) % 3]);
    if (!edgeTris.has(key)) edgeTris.set(key, []);
    edgeTris.get(key).push(ti);
  }
});
const neighbours = tris.map((t, ti) => [0, 1, 2].map((e) => edgeTris.get(edgeKey(t[e], t[(e + 1) % 3])).find((o) => o !== ti)));
for (let pass = 0; pass < 3; pass++) {
  const next = triLabel.slice();
  tris.forEach((t, ti) => {
    const counts = {};
    for (const o of neighbours[ti]) if (o !== undefined) counts[triLabel[o]] = (counts[triLabel[o]] || 0) + 1;
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] >= 2 && Number(top[0]) !== triLabel[ti]) next[ti] = Number(top[0]);
  });
  for (let i = 0; i < next.length; i++) triLabel[i] = next[i];
}

// crack edges separate two labels; chain vertices are relaxed along the crack so the
// lattice's zig-zag becomes a hand-broken curve (junctions and rim points stay put)

      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
</html>
