<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p*=2.03;a*=0.5;}
  return v;
}

vec3 strand(vec2 uv,float phase,float t,vec3 tint,float thickness){
  float x=uv.x;
  float wave=sin(x*2.4+phase+t*0.6)*0.28
           +sin(x*5.1-phase*1.3+t*0.4)*0.12
           +sin(x*11.0+phase*0.7-t*0.9)*0.05;
  float d=abs(uv.y-wave);
  float core=exp(-d*d*180.0/thickness);
  float halo=exp(-d*d*30.0/thickness)*0.35;
  return tint*(core+halo);
}

float lattice(vec2 uv,float t){
  vec2 g=uv*8.0;
  g.x+=t*0.15;
  vec2 q=abs(fract(g)-0.5);
  float line=min(q.x,q.y);
  float pattern=smoothstep(0.02,0.0,line);
  float diag=sin(uv.x*14.0+uv.y*9.0+t*0.3)*0.5+0.5;
  return pattern*0.4+diag*0.04;
}

float symbolField(vec2 uv,float t){
  vec2 p=uv*3.0;
  p+=vec2(fbm(p+t*0.05),fbm(p-t*0.07))*0.4;
  float ring=abs(length(p)-1.5-sin(t*0.2)*0.3);
  float spiral=sin(atan(p.y,p.x)*5.0+length(p)*4.0-t*0.5);
  return exp(-ring*ring*4.0)*0.3+spiral*0.05;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float loopT=mod(t,60.0)/60.0;

  float breath=sin(loopT*6.28318)*0.5+0.5;
  float convergence=pow(sin(loopT*6.28318*1.0),8.0);
  float scatter=smoothstep(0.45,0.55,loopT)*smoothstep(0.65,0.55,loopT);

  vec2 cuv=uv;
  float pinch=1.0-convergence*0.7;
  cuv.x*=mix(1.0,pinch,smoothstep(0.3,0.5,loopT));
  cuv.y*=mix(1.0,pinch,smoothstep(0.3,0.5,loopT));

  vec3 col=vec3(0.02,0.015,0.04);

  col+=vec3(0.05,0.04,0.08)*lattice(uv,t);
  col+=vec3(0.18,0.10,0.22)*symbolField(uv,t);
  col+=vec3(0.04,0.06,0.1)*fbm(uv*2.0+t*0.05);

  vec3 steady=vec3(0.3,0.55,0.95);
  vec3 blazing=vec3(1.0,0.45,0.18);
  vec3 reflect=vec3(0.55,0.95,0.85);

  float weave=sin(t*0.3)*0.4;

  vec2 s1=cuv;
  s1.y+=sin(s1.x*1.2+t*0.4)*0.25;
  col+=strand(s1,0.0+weave,t,steady,1.0);

  vec2 s2=cuv;
  s2.y+=sin(s2.x*1.2+t*0.4+2.094)*0.25;
  float blaze=0.8+sin(t*1.4)*0.3+sin(t*3.7)*0.15;
  col+=strand(s2,2.094-weave,t,blazing*blaze,1.2);

  vec2 s3=cuv;
  s3.y+=sin(s3.x*1.2+t*0.4+4.189)*0.25;
  col+=strand(s3,4.189+weave*0.5,t,reflect,0.9);

  float pulseR=length(uv);
  float pulse=exp(-pulseR*pulseR*8.0)*convergence;
  col+=vec3(1.0,0.98,0.95)*pulse*3.0;
  col+=vec3(0.9,0.85,1.0)*exp(-pulseR*pulseR*2.0)*convergence*0.6;

  float ringR=loopT*2.5;
  float ring=exp(-pow(pulseR-ringR,2.0)*40.0)*scatter*0.6;
  col+=vec3(0.7,0.85,1.0)*ring;

  float glints=0.0;
  for(float i=0.0;i<6.0;i++){
    float a=i*1.047+t*0.2;
    vec2 gp=vec2(cos(a),sin(a))*(0.4+sin(t*0.5+i)*0.15);
    float gd=length(uv-gp);
    glints+=exp(-gd*gd*400.0)*(0.5+sin(t*2.0+i*1.7)*0.5);
  }
  col+=vec3(0.9,0.95,1.0)*glints*0.4*(1.0-convergence*0.5);

  float vig=1.0-length(uv)*0.4;
  col*=vig;

  col+=vec3(0.04,0.03,0.06)*breath;

  col=pow(col,vec3(0.92));
  col=col/(1.0+col*0.3);

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 64;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 6.5, wet: 0.42 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -20, ratio: 2.5, attack: 0.02, release: 0.3 }).connect(masterReverb);

  const padHPF = new Tone.Filter({ type: "highpass", frequency: 120 }).connect(masterComp);
  const padChorus = new Tone.Chorus({ frequency: 0.18, delayTime: 4.5, depth: 0.6, wet: 0.5 }).connect(padHPF);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 4.0 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const steadyChords = [
    ["A2", "E3", "A3", "B3"],
    ["F2", "C3", "F3", "G3"],
    ["G2", "D3", "G3", "A3"],
    ["A2", "E3", "A3", "B3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(steadyChords[chordIdx % steadyChords.length], "1m", time + H(15), 0.35);
    chordIdx++;
  }, "1m").start(0);

  const blazeDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.4 }).connect(masterComp);
  const blazeFilter = new Tone.Filter({ type: "bandpass", frequency: 1800, Q: 2.5 }).connect(blazeDelay);
  const blaze = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 1.2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.02, decay: 0.3, sustain: 0, release: 0.5 }
  }).connect(blazeFilter);
  blaze.volume.value = -16;

  const blazeNotes = ["E5", "A5", "C6", "B5", "G5", "E5", "F5", "A5"];
  let blazeIdx = 0;
  const blazeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14 && Math.random() > 0.35) {
      const vel = 0.25 + Math.random() * 0.3;
      blaze.triggerAttackRelease(blazeNotes[blazeIdx % blazeNotes.length], "16n", time + H(10), vel);
    }
    blazeIdx++;
  }, "8n").start(0);

  const reflectShimmer = new Tone.PingPongDelay({ delayTime: "4n", feedback: 0.55, wet: 0.5 }).connect(masterComp);
  const reflectFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(reflectShimmer);
  const reflect = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 1.8, sustain: 0, release: 2.5 },
    modulation: { type: "sine" }
  }).connect(reflectFilter);
  reflect.volume.value = -18;

  const reflectNotes = ["A6", "E6", "C7", "B6", "D7", "A6"];
  let reflectIdx = 0;
  const reflectLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 13 && Math.random() > 0.6) {
      reflect.triggerAttackRelease(reflectNotes[reflectIdx % reflectNotes.length], "8n", time + H(12), 0.3);
    }
    reflectIdx++;
  }, "2n").start(0);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.8, release: 2.0 },
    filter: { type: "lowpass", frequency: 200 }
  }).connect(masterComp);
  subBass.volume.value = -12;

  const subNotes = ["A1", "A1", "F1", "G1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1m", time + H(8), 0.6);
    subIdx++;
  }, "1m").start(0);

  const bellReverb = new Tone.Reverb({ decay: 8, wet: 0.7 }).connect(masterComp);
  await bellReverb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 3.0, sustain: 0, release: 4.0 },
    modulation: { type: "sine" }
  }).connect(bellReverb);
  bell.volume.value = -10;

  Tone.Transport.schedule((time) => {
    bell.triggerAttackRelease("A5", "2n", time, 0.7);
  }, "8:0:0");
  Tone.Transport.schedule((time) => {
    bell.triggerAttackRelease("E6", "2n", time + 0.3, 0.5);
  }, "8:0:0");

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterComp);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3.0, decay: 1.5, sustain: 0, release: 3.0 }
  }).connect(noiseHPF);
  noise.volume.value = -28;

  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(6000, time + 4.0);
    noise.triggerAttackRelease(4.0, time);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    blazeFilter.frequency.linearRampToValueAtTime(3500, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    blazeFilter.frequency.linearRampToValueAtTime(1800, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  window.toneJsInstruments = { pad, blaze, reflect, subBass, bell, noise };
  window.toneJsParts = { padLoop, blazeLoop, reflectLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
