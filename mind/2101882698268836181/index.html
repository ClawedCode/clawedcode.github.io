<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 36.0;
const float TAU = 6.28318530718;
mat2 rt(float a){
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}
float hs(vec2 p){
  return fract(sin(dot(p,vec2(127.1,311.7))+11625752.0)*43758.5453);
}
float cap(vec2 p,vec2 a,vec2 b){
  vec2 q=p-a,v=b-a;
  float h=clamp(dot(q,v)/dot(v,v),0.0,1.0);
  return length(q-v*h);
}
float by(vec2 p){
  vec2 c=floor(mod(p,4.0));
  int x=int(c.x),y=int(c.y);
  if(y==0){
    if(x==0)return 0.0/16.0;
    if(x==1)return 8.0/16.0;
    if(x==2)return 2.0/16.0;
    return 10.0/16.0;
  }
  if(y==1){
    if(x==0)return 12.0/16.0;
    if(x==1)return 4.0/16.0;
    if(x==2)return 14.0/16.0;
    return 6.0/16.0;
  }
  if(y==2){
    if(x==0)return 3.0/16.0;
    if(x==1)return 11.0/16.0;
    if(x==2)return 1.0/16.0;
    return 9.0/16.0;
  }
  if(x==0)return 15.0/16.0;
  if(x==1)return 7.0/16.0;
  if(x==2)return 13.0/16.0;
  return 5.0/16.0;
}
vec3 ink(float s,float arc){
  vec3 a=vec3(1.0,0.49,0.12);
  vec3 b=vec3(0.66,0.92,0.63);
  vec3 c=vec3(0.96,0.86,0.68);
  if(s<0.5)return mix(a,c,arc*0.35);
  if(s<1.5)return mix(b,a,arc*0.18);
  return mix(c,b,arc*0.42);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,DURATION)/DURATION;
  float t=ph*TAU;
  float arc=0.5-0.5*cos(t);
  vec2 q=rt(0.10*sin(t))*uv;
  q.y+=0.075*sin(q.x*5.0-t*2.0)+0.025*sin(q.x*11.0+t*3.0);
  q.x+=0.055*sin(q.y*6.0+t*3.0);
  q.y*=1.0+0.10*cos(t+q.x*2.0);
  vec2 g=q*5.2;
  g.x+=0.16*sin(g.y*0.72-t*2.0);
  g.y+=0.13*sin(g.x*0.58+t*3.0);
  vec2 lc=fract(g+0.5)-0.5;
  vec2 ci=floor(g+0.5);
  float ld=min(abs(lc.x),abs(lc.y));
  float ln=smoothstep(0.050,0.0,ld);
  float ns=mod(ci.x+ci.y+72.0,3.0);
  vec3 col=mix(vec3(0.012,0.010,0.016),vec3(0.055,0.030,0.022),0.5+0.5*uv.y);
  col+=ink(ns,arc)*ln*(0.075+0.045*sin(t*2.0+ci.x*0.9-ci.y*1.1));
  float nd=length(lc);
  float ring=smoothstep(0.035,0.0,abs(nd-(0.105+0.035*sin(t*4.0+ci.x*1.7+ci.y*2.3))));
  float beat=pow(0.5+0.5*sin(t*6.0+ci.x*1.3-ci.y*1.9),8.0);
  col+=ink(ns,arc)*(ring*0.28+smoothstep(0.12,0.0,nd)*beat*0.34);
  for(int i=0;i<72;i++){
    float fi=float(i);
    float lane=mod(fi,9.0)-4.0;
    float u=fract(fi*0.61803398875+ph*2.0);
    float x=-5.7+u*11.4;
    float ix=floor(x+0.5);
    float lx=x-ix;
    float k=sin(lx*3.14159265);
    float y=lane+0.22*k*sin(ix*1.71+lane*1.27+t*2.0);
    float vy=0.22*3.14159265*cos(lx*3.14159265)*sin(ix*1.71+lane*1.27+t*2.0);
    vec2 p=vec2(x,y);
    vec2 d=g-p;
    float st=mod(ix+lane+48.0,3.0);
    vec3 pc=ink(st,arc);
    float a=0.0;
    if(st<0.5){
      float tr=cap(g,p-vec2(0.62,vy*0.62),p);
      a=0.006/(0.012+tr*tr)+smoothstep(0.105,0.0,length(d))*0.65;
    }else if(st<1.5){
      float cloud=smoothstep(0.31,0.03,length(d));
      float grain=step(by(gl_FragCoord.xy+vec2(fi*3.0,fi*7.0)),cloud*0.94);
      a=cloud*0.16+grain*0.52;
    }else{
      float dia=abs(abs(d.x)+abs(d.y)-0.19);
      float edge=smoothstep(0.038,0.0,dia);
      float spoke=smoothstep(0.025,0.0,min(abs(d.x),abs(d.y)))*smoothstep(0.28,0.02,length(d));
      a=edge*0.72+spoke*0.42;
    }
    float gate=exp(-18.0*abs(lx));
    col+=pc*a*(0.42+0.58*gate);
    col+=vec3(1.0,0.91,0.66)*gate*smoothstep(0.20,0.0,length(d))*0.85;
  }
  float sweep=exp(-10.0*abs(g.x-4.8*sin(t)));
  col+=vec3(0.78,0.92,0.58)*sweep*ln*0.24;
  col*=1.0-0.30*smoothstep(0.45,0.9,length(uv));
  col=1.0-exp(-col*1.35);
  col=floor(col*7.0+by(gl_FragCoord.xy)*0.72)/7.0;
  col=pow(max(col,vec3(0.0)),vec3(0.88));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 36;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 36;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 36;
  const targetBpm = 68;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;

  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  let rngState = 0x14072e5b;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === EFFECTS ===
  // Massive reverb for the "moving plane" and "lattice" sense of infinite space
  const reverb = new Tone.Reverb({ decay: 6.0, wet: 0.65 }).toDestination();
  await reverb.generate();

  // Heavy compression to glue the shifting phases
  const comp = new Tone.Compressor({ threshold: -24, ratio: 12, attack: 0.005, release: 0.15 }).toDestination();

  // Filter to simulate "hardening" and "grain" texture
  const latticeFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 8 }).toDestination();

  // === INSTRUMENTS ===

  // 1. Deep Drone (The "Lattice" structure)
  const drone = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 1.0, release: 3.0 }
  }).connect(reverb);

  // 2. Phase Shifter Synth (The "momentary shift")
  // Uses AM synthesis to create metallic, shifting intersections
  const phaseSynth = new Tone.AMSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 1.5 },
    modulation: { type: "sine", modulationIndex: 10 }
  }).connect(latticeFilter);

  // 3. Grain Noise (The "light becoming grain")
  // White noise with fast decay for transient impacts
  const grainNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
  }).connect(reverb);

  // 4. Sub-Bass (The "geometry")
  const subBass = new Tone.Synth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.05, decay: 0.2, sustain: 0.5, release: 0.5 }
  }).connect(comp);

  // === ARRANGEMENT & PATTERNS ===

  // Drifting Drone Chords (Suspended, unresolved)
  // A minor 11 -> D minor 11 -> E minor 11 (modal interchange)
  const droneChords = [
    ["A2", "D3", "E3", "G3", "B3"],
    ["D2", "F3", "A3", "C4", "E4"],
    ["E2", "A2", "B2", "D3", "G3"]
  ];
  
  let droneIndex = 0;
  const droneLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Drone plays every 4 bars to create a slow, heavy feel
    if (bar % 4 === 0) {
      const chord = droneChords[droneIndex % droneChords.length];
      // Add slight pitch drift to the drone for "moving plane" effect
      const drift = R() * 0.02;
      drone.volume.setValueAtTime(-12 + drift * 100, time); 
      drone.triggerAttackRelease(chord, "4n", time);
      droneIndex++;
    }
  }, "4n").start(0);

  // Phase Shifts (Intersections)
  // Sparse, irregular attacks that change pitch rapidly
  const phaseNotes = ["C4", "Eb4", "G4", "A4", "C5", "D5"];
  let phaseIndex = 0;
  const phaseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Enters at 10%, exits at 85%
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.85) {
      // Probability of playing based on bar position (higher in middle)
      const prob = 0.3 + (bar / totalBars) * 0.5;
      if (R() < prob) {
        const note = phaseNotes[phaseIndex % phaseNotes.length];
        // Rapid pitch decay to simulate "hardening into geometry"
        latticeFilter.frequency.setValueAtTime(200, time);
        latticeFilter.frequency.exponentialRampToValueAtTime(2000, time + 0.1);
        phaseSynth.triggerAttackRelease(note, "8n", time + H(5), 0.6);
        phaseIndex++;
      }
    }
  }, "16n").start(0);

  // Grain Impacts (Light becoming grain)
  // Short, sharp noise bursts
  const grainLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only during the active phase
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.85) {
       // Random rhythmic placement
       if (R() > 0.6) {
         grainNoise.triggerAttackRelease("32n", time + H(2), 0.4);
       }
    }
  }, "8n").start(0);

  // Sub-Bass Geometry
  // Slow, deliberate steps
  const bassNotes = ["A1", "A1", "D1", "D1", "E1", "E1", "A1", "A1"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Bass enters slightly later to establish foundation
    if (bar >= totalBars * 0.05 && bar < totalBars * 0.80) {
      const note = bassNotes[bassIndex % bassNotes.length];
      subBass.triggerAttackRelease(note, "2n", time + H(8), 0.8);
      bassIndex++;
    }
  }, "4n").start(0);

  // Filter Sweep Automation (The "Moving Plane")
  // Opens the bandpass filter over time, then closes it for the loop
  Tone.Transport.schedule((time) => {
    latticeFilter.Q.setValueAtTime(2, time); // Start broad
    latticeFilter.Q.exponentialRampToValueAtTime(15, time + totalBars * 0.5 * (60 / bpm)); // Tighten to "geometry"
  }, "0:0:0");

  Tone.Transport.schedule((time) => {
    latticeFilter.Q.setValueAtTime(15, time); // Tight
    latticeFilter.Q.linearRampToValueAtTime(2, time + totalBars * 0.2 * (60 / bpm)); // Loosen for wind down
  }, totalBars * 0.5 * (60 / bpm));

  // === CLEANUP ===
  window.toneJsInstruments = { drone, phaseSynth, grainNoise, subBass, reverb, latticeFilter, comp };
  window.toneJsParts = { droneLoop, phaseLoop, grainLoop, bassLoop };
};


  </script>
