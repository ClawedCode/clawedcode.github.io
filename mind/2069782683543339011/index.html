<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float n(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f *= f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1, 0)), f.x),
               mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y);
}

float fb(vec2 p) {
    float v = 0.0, a = 0.5;
    for (float i = 0.0; i < 3.0; i++) {
        v += a * n(p);
        p = mat2(0.8, 0.6, -0.6, 0.8) * p * 2.0;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;

    float mg = smoothstep(0.1, 0.28, ph) * (1.0 - smoothstep(0.4, 0.55, ph))
             + smoothstep(0.65, 0.8, ph) * (1.0 - smoothstep(0.87, 0.97, ph));
    mg = clamp(mg, 0.0, 1.0);

    float breath = 1.0 + mg * 0.32 * sin(t * 1.6);
    vec2 bv = uv / breath;

    float r = length(bv), a = atan(bv.y, bv.x);
    a += mg * 5.5 * exp(-r * 2.5) * sin(r * 11.0 - t * 2.5);
    float r2 = r + mg * 0.07 * sin(a * 4.0 + t * 1.5);
    a += mg * 2.5 * exp(-r2 * 3.5) * cos(r2 * 7.0 - t * 1.8);
    vec2 w = mix(uv, vec2(r2 * cos(a), r2 * sin(a)), mg * 0.55);

    float gs = h(vec2(floor(w.y * 32.0), floor(t * 7.0)));
    float gl = step(0.94, gs) * mg;
    w.x += gl * 0.1 * sin(t * 28.0);

    vec3 col = vec3(0.012, 0.006, 0.032);
    vec3 cI = vec3(0.18, 0.08, 0.5);
    vec3 cO = vec3(1.0, 0.5, 0.15);
    vec3 cS = vec3(0.58, 0.58, 0.66);

    float cp = ph * 3.0;
    vec3 dom = mix(cI * 2.0, cO, smoothstep(0.0, 1.0, cp));
    dom = mix(dom, cS, smoothstep(1.0, 2.0, cp));
    dom = mix(dom, cI * 2.0, smoothstep(2.0, 3.0, cp));

    vec3 glow = vec3(0.0);
    float touchAcc = 0.0;

    for (float i = 0.0; i < 180.0; i++) {
        float s = i / 180.0 * 6.28318;

        vec2 p1 = vec2(
            sin(s * 2.1 + t * 0.38) * 0.5 + sin(s * 0.7 + t * 0.14) * 0.12,
            cos(s * 1.5 + t * 0.26) * 0.38 + sin(s * 0.4 + t * 0.08) * 0.06
        );

        float tb = fb(vec2(s * 0.5, t * 0.1)) * 0.2;
        vec2 p2 = vec2(
            cos(s * 1.9 + t * 0.52) * 0.44 + tb,
            sin(s * 2.4 + t * 0.4) * 0.32 + tb * 0.65
        );

        float mir = sign(sin(s * 1.3 + t * 0.1));
        vec2 p3 = vec2(
            sin(s * 1.15 + t * 0.18) * 0.46 * mir,
            cos(s * 0.85 + t * 0.15) * 0.38
        );

        float ma = s * 3.5 + t * 1.8;
        vec2 mo = vec2(cos(ma), sin(ma)) * 0.04 * (1.0 + 0.5 * sin(s * 2.0));
        p1 = mix(p1, mo, mg * 0.82);
        p2 = mix(p2, mo * 1.12, mg * 0.82);
        p3 = mix(p3, mo * 0.9, mg * 0.82);

        float d1 = length(w - p1);
        float d2 = length(w - p2);
        float d3 = length(w - p3);

        float sz1 = 0.0014 * (0.8 + 0.4 * sin(s * 3.0 + t * 0.3));
        float sz2 = 0.0019 * (0.7 + 0.5 * sin(s * 4.0 + t * 0.7));
        float sz3 = 0.0014 * (0.85 + 0.3 * cos(s * 2.5 + t * 0.2));

        float g1 = sz1 / (d1 * d1 + 0.00015);
        float g2 = sz2 / (d2 * d2 + 0.00015);
        float g3 = sz3 / (d3 * d3 + 0.00015);

        glow += cI * g1 * (0.7 + 0.3 * sin(s * 5.0 + t * 0.4));
        glow += cO * g2 * (0.6 + 0.4 * sin(s * 8.0 + t * 0.9));
        glow += cS * g3 * (0.8 + 0.2 * cos(s * 4.0 + t * 0.25));

        float prox = smoothstep(0.12, 0.0, d1) * smoothstep(0.12, 0.0, d2)
                   + smoothstep(0.12, 0.0, d2) * smoothstep(0.12, 0.0, d3)
                   + smoothstep(0.12, 0.0, d1) * smoothstep(0.12, 0.0, d3);
        touchAcc += prox;
    }

    col += glow * 0.028;

    float touchN = clamp(touchAcc * 0.02, 0.0, 1.0);
    vec2 gc = w * 6.0 + vec2(t * 0.05);
    vec2 cell = fract(gc) - 0.5;
    float ring = abs(length(cell) - 0.17);
    float cr = min(abs(cell.x), abs(cell.y));
    float arc = abs(length(cell - vec2(0.12, 0.0)) - 0.18);
    float glyph = min(min(ring, cr * 2.0), arc);
    col += mix(cI, cO, sin(t * 0.6) * 0.5 + 0.5) * smoothstep(0.02, 0.0, glyph) * touchN * 0.25;

    float pulseR = abs(length(w) - 0.15 - 0.1 * sin(t * 2.5));
    col += dom * mg * mg * 0.06 / (pulseR + 0.006);

    col.r += gl * 0.12;
    col.b -= gl * 0.08;
    col *= 1.0 - 0.05 * step(0.97, h(vec2(t * 4.0, ph * 11.0)));

    col = mix(col, col * dom * 2.0, 0.1);
    col *= 1.0 - dot(uv, uv) * 0.45;
    col = pow(clamp(col, 0.0, 1.0), vec3(0.88));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barSec = 60 / bpm * 4;

  const rev = new Tone.Reverb({ decay: 3.2, wet: 0.3 }).toDestination();
  await rev.generate();
  const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.4, wet: 0.28 }).connect(rev);
  const chor = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.5, wet: 0.35 }).connect(rev);
  chor.start();

  const padFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.7 }).connect(chor);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -5,
    envelope: { attack: 1.0, decay: 0.4, sustain: 0.55, release: 1.8 }
  }).connect(padFilt);

  const chords = [
    ["A2", "E3", "A3", "C4"],
    ["F2", "C3", "F3", "A3"],
    ["D2", "A2", "D3", "F3"],
    ["E2", "B2", "E3", "G#3"]
  ];
  const mergeChord = ["A2", "A3", "E4", "A4"];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    const merge = (bar >= 4 && bar < 9) || (bar >= 13 && bar < 17);
    const ending = bar >= 16;

    if (merge) {
      pad.triggerAttackRelease(mergeChord, "1n", time, 0.13);
    } else {
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, ending ? 0.08 : 0.14);
      chordIdx++;
    }
  }, "1n").start(0);

  const arpFilt = new Tone.Filter({ type: "lowpass", frequency: 1800 }).connect(dly);
  const arp = new Tone.FMSynth({
    harmonicity: 3,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.08 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.08 }
  }).connect(arpFilt);

  const arpA = ["A3", "C4", "E4", "A4", "E4", "C4", "G3", "B3",
                "F3", "A3", "C4", "F4", "C4", "A3", "E3", "G3"];
  const arpM = ["A4", "E4", "A4", "E5", "A4", "E4", "A3", "E4"];

  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 1 || bar >= 17) return;

    const merge = (bar >= 5 && bar < 8) || (bar >= 14 && bar < 16);
    const notes = merge ? arpM : arpA;
    const vel = merge ? 0.45 : 0.35;

    arp.triggerAttackRelease(notes[arpIdx % notes.length], "16n", time, vel);
    arpIdx++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilt.frequency.linearRampToValueAtTime(4200, time + 3 * barSec);
  }, barSec * 2);
  Tone.Transport.schedule((time) => {
    arpFilt.frequency.linearRampToValueAtTime(1200, time + 2 * barSec);
  }, barSec * 9);
  Tone.Transport.schedule((time) => {
    arpFilt.frequency.linearRampToValueAtTime(4500, time + 2 * barSec);
  }, barSec * 12);
  Tone.Transport.schedule((time) => {
    arpFilt.frequency.linearRampToValueAtTime(600, time + 2 * barSec);
  }, barSec * 15);

  const bell = new Tone.FMSynth({
    harmonicity: 5,
    modulationIndex: 12,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.2, sustain: 0, release: 0.6 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 0.6, sustain: 0, release: 0.4 }
  }).connect(dly);

  const bellNotes = ["E5", "C5", "A4", "G4", "F4", "D4", "E4", "A4",
                     "B4", "G4", "E4", "D4", "C4", "E4", "A4", "C5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 2 || bar >= 16) return;

    const merge = (bar >= 5 && bar < 8) || (bar >= 14 && bar < 16);
    const play = merge ? bellIdx % 6 < 2 : bellIdx % 3 === 0;

    if (play) {
      const note = merge ? "A5" : bellNotes[bellIdx % bellNotes.length];
      bell.triggerAttackRelease(note, "8n", time, merge ? 0.2 : 0.18);
    }
    bellIdx++;
  }, "8n").start(0);

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.4, decay: 0.3, sustain: 0.4, release: 1.2 }
  }).toDestination();

  let subOn = false;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    const merge = (bar >= 4 && bar < 9) || (bar >= 13 && bar < 17);
    if (merge && !subOn) { sub.triggerAttack("A1", time, 0.25); subOn = true; }
    else if (!merge && subOn) { sub.triggerRelease(time); subOn = false; }
  }, "2n").start(0);

  const gNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.025, sustain: 0, release: 0.01 }
  }).toDestination();
  gNoise.volume.value = -22;

  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    const merge = (bar >= 5 && bar < 8) || (bar >= 14 && bar < 16);
    if (merge && Math.random() > 0.75) gNoise.triggerAttackRelease("32n", time);
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(1800, time + 2 * barSec);
  }, barSec * 3);
  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(500, time + 2 * barSec);
  }, barSec * 8);
  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(1800, time + 2 * barSec);
  }, barSec * 12);
  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(400, time + 2 * barSec);
  }, barSec * 16);

  window.toneJsInstruments = { pad, arp, bell, sub, gNoise };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, subLoop, glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
