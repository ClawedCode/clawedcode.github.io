<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 h22(vec2 p){vec3 a=fract(vec3(p.xyx)*vec3(213.897,653.453,417.867));a+=dot(a,a.yzx+79.76);return fract(vec2((a.x+a.y)*a.z,(a.x+a.z)*a.y));}
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2d(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);

    float gp=0.0;
    if(t>=8.0&&t<25.0) gp=smoothstep(8.0,25.0,t);
    else if(t>=25.0&&t<35.0) gp=1.0;
    else if(t>=35.0&&t<52.0) gp=1.0-smoothstep(35.0,52.0,t);

    float sc=11.0;
    vec2 gv=uv*sc,ci=floor(gv),cf=fract(gv);
    float md1=10.0,md2=10.0,mlp=0.0;
    vec2 mc=vec2(0.0);

    for(float dy=-1.0;dy<=1.0;dy++){
        for(float dx=-1.0;dx<=1.0;dx++){
            vec2 off=vec2(dx,dy),cell=ci+off;
            vec2 r=h22(cell);
            float ang=r.x*6.2832+t*(0.35+r.y*0.3);
            vec2 flow=vec2(sin(ang+n2d(cell*0.7+vec2(t*0.12))*4.0),cos(ang*0.7+n2d(cell*0.7+vec2(t*0.12+50.0))*4.0))*0.36;
            float hx=mod(cell.y+100.0,2.0)<1.0?0.0:0.5;
            vec2 latt=vec2(0.5+hx,0.5);
            float dc=length((cell+0.5)/sc);
            float lp=smoothstep(dc-0.06,dc+0.1,gp*1.5);
            float bnd=lp*(1.0-lp)*4.0;
            vec2 jit=vec2(sin(t*22.0+r.x*50.0),cos(t*17.0+r.y*50.0))*bnd*0.055;
            vec2 pos=off+mix(flow+vec2(0.5),latt+jit,lp);
            float d=length(cf-pos);
            if(d<md1){md2=md1;md1=d;mc=cell;mlp=lp;}
            else if(d<md2) md2=d;
        }
    }

    float edge=md2-md1,ch=h21(mc);
    vec3 wA=vec3(0.95,0.35,0.08),wB=vec3(1.0,0.65,0.2);
    vec3 cA=vec3(0.12,0.35,0.85),cB=vec3(0.45,0.75,1.0);
    vec3 wh=vec3(0.9,0.95,1.0);
    vec3 cc=mix(mix(wA,wB,ch),mix(cA,cB,ch*0.5),mlp);
    vec3 col=cc*mix(0.55,0.25,smoothstep(0.0,0.4,md1));
    col=mix(col,wh*0.75,smoothstep(0.05,0.008,edge)*mlp*0.9);
    col+=wB*smoothstep(0.1,0.03,edge)*(1.0-mlp)*0.08;
    col+=mix(wB*1.4,wh,mlp)*(0.005/(md1*md1+0.001))*0.1;
    float bnd=mlp*(1.0-mlp)*4.0;
    col+=vec3(1.0,0.85,0.55)*bnd*smoothstep(0.2,0.0,md1)*0.7;
    col+=wh*bnd*pow(h21(mc+floor(vec2(t*12.0))),14.0)*2.0*smoothstep(0.12,0.0,md1);
    float wr=gp*0.95;
    col+=vec3(1.0,0.88,0.6)*smoothstep(0.035,0.0,abs(length(uv)-wr*0.7))*gp*(1.0-gp)*4.0*0.5;
    col*=max(1.0-dot(uv*1.3,uv*1.3),0.0);
    col+=mix(vec3(0.03,0.01,0.0),vec3(0.0,0.01,0.04),gp)*0.5;
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 88;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await masterReverb.generate();
  const shimmer = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);
  const darkSpace = new Tone.Reverb({ decay: 7.0, wet: 0.6 }).toDestination();
  await darkSpace.generate();

  const chime = new Tone.FMSynth({
    harmonicity: 4.0, modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.8, sustain: 0, release: 0.4 },
    modulation: { type: "triangle" }
  }).connect(shimmer);
  chime.volume.value = -10;

  const warmTone = new Tone.FMSynth({
    harmonicity: 2.0, modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.08, decay: 1.2, sustain: 0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(darkSpace);
  warmTone.volume.value = -14;

  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 0.4, sustain: 0.5, release: 0.3 }
  }).toDestination();
  sub.volume.value = -10;

  const noiseHP = new Tone.Filter({ type: "highpass", frequency: 400 }).connect(darkSpace);
  const noiseLP = new Tone.Filter({ type: "lowpass", frequency: 2500 }).connect(noiseHP);
  const noiseSynth = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.5, decay: 0.8, sustain: 0.3, release: 1.5 }
  }).connect(noiseLP);
  noiseSynth.volume.value = -22;

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.4, release: 2.5 }
  }).connect(masterReverb);
  pad.volume.value = -20;

  const latticeClick = new Tone.MetalSynth({
    frequency: 1000,
    envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
    harmonicity: 10, modulationIndex: 30, resonance: 6000
  }).connect(masterReverb);
  latticeClick.volume.value = -24;

  function getPhase(time) {
    const s = Tone.Transport.getSecondsAtTime(time) % 60;
    if (s < 8) return 0;
    if (s < 25) return (s - 8) / 17;
    if (s < 35) return 1;
    if (s < 52) return 1 - (s - 35) / 17;
    return 0;
  }

  const crystalArp = [69, 72, 76, 81, 76, 72, 69, 64];
  const scalePool = [57, 59, 60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81];

  let noteStep = 0;
  const bellLoop = new Tone.Loop((time) => {
    const phase = getPhase(time);
    const playProb = 0.08 + phase * 0.55;
    if (Math.random() > playProb) { noteStep++; return; }
    if (Math.random() < phase * phase) {
      const note = crystalArp[noteStep % crystalArp.length];
      chime.triggerAttackRelease(Tone.Frequency(note, "midi"), "8n", time, 0.35 + phase * 0.3);
    } else {
      const note = scalePool[Math.floor(Math.random() * scalePool.length)];
      warmTone.triggerAttackRelease(Tone.Frequency(note, "midi"), "4n", time, 0.2 + (1 - phase) * 0.15);
    }
    noteStep++;
  }, "16n").start(0);

  let subStep = 0;
  const subNotes = ["A1", "A1", "E1", "E1"];
  const subLoop = new Tone.Loop((time) => {
    const phase = getPhase(time);
    if (phase > 0.4) {
      const vol = Math.min(0.6, (phase - 0.4) * 1.5);
      sub.triggerAttackRelease(subNotes[subStep % subNotes.length], "2n", time, vol);
    }
    subStep++;
  }, "2n").start(0);

  const noiseLoop = new Tone.Loop((time) => {
    const phase = getPhase(time);
    if (phase < 0.7) {
      const vol = 0.12 * Math.max(0, 1 - phase / 0.7);
      noiseLP.frequency.linearRampToValueAtTime(600 + (1 - phase) * 3000, time + 0.5);
      noiseSynth.triggerAttackRelease(2.0, time, vol);
    }
  }, "1n").start(0);

  let padStep = 0;
  const warmChords = [["A3", "C4", "E4"], ["F3", "A3", "C4"]];
  const coldChords = [["A3", "E4", "B4"], ["E3", "B3", "G4"]];
  const padLoop = new Tone.Loop((time) => {
    const phase = getPhase(time);
    const chords = phase > 0.5 ? coldChords : warmChords;
    pad.triggerAttackRelease(chords[padStep % chords.length], "1n", time, 0.1);
    padStep++;
  }, "1n").start(0);

  let clickStep = 0;
  const clickLoop = new Tone.Loop((time) => {
    const phase = getPhase(time);
    const boundary = phase * (1 - phase) * 4;
    if (boundary > 0.3 && Math.random() < boundary * 0.35) {
      latticeClick.triggerAttackRelease("32n", time, 0.12 + boundary * 0.12);
    }
    clickStep++;
  }, "16n").start(0);

  window.toneJsInstruments = { chime, warmTone, sub, noiseSynth, pad, latticeClick };
  window.toneJsParts = { bellLoop, subLoop, noiseLoop, padLoop, clickLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
