<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);
    float ca=t*0.10472;
    float el=sin(t*0.20944)*0.18;
    float rv=min(t*480.0,2400.0);
    vec3 col=vec3(0.008,0.004,0.028);

    for(int trail=0;trail<4;trail++){
        float tf=float(trail);
        vec3 p=vec3(
            1.0+sin(tf*2.3)*3.0,
            1.0+cos(tf*1.7)*2.0,
            25.0+sin(tf*3.1)*3.0
        );
        for(int i=0;i<600;i++){
            float fi=float(i);
            float pIdx=fi+tf*600.0;
            float vis=clamp((rv-pIdx)/50.0,0.0,1.0);
            if(vis<0.001)break;

            vec3 dp=vec3(
                10.0*(p.y-p.x),
                p.x*(28.0-p.z)-p.y,
                p.x*p.y-2.667*p.z
            );
            p+=dp*0.004;

            vec3 sp=(p-vec3(0.0,0.0,25.0))*0.035;
            sp.xz=rot(ca)*sp.xz;
            sp.xy=rot(el)*sp.xy;

            float depth=sp.z+2.5;
            if(depth<0.1)continue;
            vec2 pr=sp.xy/depth;
            float dd=length(uv-pr);

            float sz=0.0028/depth;
            float glow=sz*sz/(dd*dd+sz*sz*0.35);

            float age=pIdx/2400.0;
            vec3 tc=mix(
                vec3(1.0,0.58,0.06),
                vec3(0.18,0.62,1.0),
                age
            );

            float fog=exp(-max(depth-1.0,0.0)*0.25);
            col+=tc*glow*vis*fog*0.038;
        }
    }

    col*=0.7+0.3*smoothstep(0.7,0.0,length(uv));
    col=1.0-exp(-col*2.8);
    col=pow(col,vec3(0.9));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 5.5, wet: 0.5 }).toDestination();
  await reverb.generate();

  const longDelay = new Tone.FeedbackDelay({ delayTime: "2n.", feedback: 0.42, wet: 0.3 }).connect(reverb);
  const shortDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.22, wet: 0.2 }).connect(reverb);

  const bell = new Tone.FMSynth({
    harmonicity: 3.0,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0, release: 2.0 },
    modulation: { type: "triangle" }
  }).connect(longDelay);
  bell.volume.value = -14;

  const chorus = new Tone.Chorus({ frequency: 0.12, delayTime: 4, depth: 0.8, wet: 0.5 }).connect(reverb);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.5, decay: 0.4, sustain: 0.5, release: 3.0 }
  }).connect(chorus);
  pad.volume.value = -22;

  const pluck = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 0.8, sustain: 0, release: 0.5 }
  }).connect(shortDelay);
  pluck.volume.value = -16;

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 4.0, decay: 1.0, sustain: 0.6, release: 5.0 }
  }).toDestination();
  sub.volume.value = -20;

  const lobe1 = [69, 72, 74, 76];
  const lobe2 = [74, 77, 79, 81];
  let currentLobe = lobe1;
  let bellDirection = 1;
  let bellIdx = 0;

  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const density = bar < 3 ? 0.3 : (bar < 13 ? 0.5 : 0.3);
    if (Math.random() > density) return;

    if (Math.random() > 0.88) {
      currentLobe = currentLobe === lobe1 ? lobe2 : lobe1;
      bellIdx = Math.floor(Math.random() * currentLobe.length);
    }

    const note = currentLobe[bellIdx % currentLobe.length];
    bell.triggerAttackRelease(Tone.Frequency(note, "midi").toNote(), "4n", time, 0.3 + Math.random() * 0.2);

    bellIdx += bellDirection;
    if (bellIdx >= currentLobe.length - 1) bellDirection = -1;
    if (bellIdx <= 0) bellDirection = 1;
  }, "4n").start(0);

  const padChords = [
    ["A3", "E4", "A4"],
    ["F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["E3", "G3", "B3"]
  ];

  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 2 || bar > 15) return;
    const idx = Math.floor(bar / 3) % padChords.length;
    pad.triggerAttackRelease(padChords[idx], "1n", time, 0.2);
  }, "2n").start(0);

  const pluckChords = [
    [57, 60, 64, 67, 69],
    [53, 57, 60, 64, 67],
    [55, 59, 62, 65, 67],
    [52, 55, 59, 62, 64]
  ];
  let pluckStep = 0;
  const pluckPattern = [1, 0, 1, 1, 0, 1, 0, 1];

  const pluckLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 3 || bar > 14) { pluckStep++; return; }
    if (!pluckPattern[pluckStep % pluckPattern.length]) { pluckStep++; return; }

    const chordIdx = Math.floor(bar / 4) % pluckChords.length;
    const chord = pluckChords[chordIdx];
    const note = chord[pluckStep % chord.length];
    pluck.triggerAttackRelease(Tone.Frequency(note, "midi").toNote(), "16n", time, 0.25 + Math.random() * 0.15);
    pluckStep++;
  }, "8n").start(0);

  const subRoots = ["A1", "F1", "G1", "E1"];
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 1 || bar > 15) return;
    const idx = Math.floor(bar / 4) % subRoots.length;
    sub.triggerAttackRelease(subRoots[idx], "2n", time, 0.5);
  }, "1n").start(0);

  window.toneJsInstruments = { bell, pad, pluck, sub };
  window.toneJsParts = { bellLoop, padLoop, pluckLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
