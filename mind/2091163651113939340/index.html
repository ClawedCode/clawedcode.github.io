<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 hash22(vec2 p){
  p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
  return fract(sin(p)*43758.5453);
}
float noise2(vec2 p){
  vec2 i=floor(p);vec2 f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  float a=fract(sin(dot(i,vec2(127.1,311.7)))*43758.5453);
  float b=fract(sin(dot(i+vec2(1.0,0.0),vec2(127.1,311.7)))*43758.5453);
  float c=fract(sin(dot(i+vec2(0.0,1.0),vec2(127.1,311.7)))*43758.5453);
  float d=fract(sin(dot(i+vec2(1.0,1.0),vec2(127.1,311.7)))*43758.5453);
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}

vec3 voro(vec2 p){
  vec2 cell=floor(p);
  vec2 f=fract(p);
  float f1=8.0;float f2=8.0;
  vec2 site1=vec2(0.0);
  for(int x=-1;x<=1;x++){
    for(int y=-1;y<=1;y++){
      vec2 g=vec2(float(x),float(y));
      vec2 o=hash22(cell+g);
      vec2 rp=g+o-f;
      float d=dot(rp,rp);
      if(d<f1){f2=f1;f1=d;site1=cell+g;}
      else if(d<f2){f2=d;}
    }
  }
  return vec3(sqrt(f1),sqrt(f2),fract(sin(dot(site1,vec2(127.1,311.7)))*43758.5453));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0);
  float phase=t*0.10471976;

  float unfold=0.5-0.5*cos(phase);
  float R=0.12+1.35*unfold;

  float r=length(uv);
  float ang=atan(uv.y,uv.x);
  float frontier=R+noise2(vec2(ang*2.5,3.7))*0.22;
  float reveal=smoothstep(frontier,frontier-0.18,r);

  vec3 v=voro(uv*5.0);
  float edge=v.y-v.x;
  float lines=smoothstep(0.075,0.015,edge);
  float nodes=smoothstep(0.10,0.02,v.x);

  vec3 col=vec3(0.010,0.014,0.035);
  col+=vec3(0.03,0.05,0.09)*noise2(uv*3.0+vec2(0.0,phase*0.4));

  vec3 lineCol=mix(vec3(0.05,0.65,0.65),vec3(0.95,0.75,0.25),v.z);
  col+=lineCol*lines*reveal*0.75;

  float pw=fract(phase*0.95492966);
  float wave=pow(max(0.0,1.0-abs(r-pw*1.5)*4.0),2.0);
  col+=lineCol*lines*reveal*wave*1.6;

  float nodePulse=0.5+0.5*sin(phase*4.0+v.z*6.28318);
  col+=vec3(0.95,0.85,0.5)*nodes*reveal*nodePulse*0.85;

  float frontGlow=pow(max(0.0,1.0-abs(r-frontier)*6.0),2.0)*step(0.02,unfold);
  col+=vec3(0.3,0.9,0.8)*frontGlow*0.5;

  float seed=0.012/(r*r+0.012);
  col+=vec3(1.0,0.85,0.55)*seed*(0.55+0.45*sin(phase*8.0));

  float vig=1.0-0.35*dot(uv,uv);
  col*=vig;
  col=pow(col,vec3(0.92));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  const bpm = 92;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(60 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const limiter = new Tone.Limiter(-3).toDestination();
  const reverb = new Tone.Reverb({ decay: 3.5, wet: 0.32 }).connect(limiter);
  const delay = new Tone.PingPongDelay({ delayTime: "8n.", feedback: 0.42, wet: 0.35 }).connect(reverb);

  const pluck = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.003, decay: 0.18, sustain: 0.02, release: 0.4 },
    volume: -16
  }).connect(delay);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.035,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.32, sustain: 0.01, release: 0.8 },
    volume: -11
  }).connect(limiter);

  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    filter: { type: "lowpass", frequency: 280, Q: 1 },
    envelope: { attack: 0.02, decay: 0.35, sustain: 0.45, release: 0.8 },
    volume: -13
  }).connect(limiter);

  const click = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.03, sustain: 0 },
    volume: -25
  }).connect(reverb);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.6, release: 3.0 },
    volume: -20
  }).connect(reverb);

  // Pluck motif spreads like the network: sparse at first, denser as it unfolds
  const motif = ["A3", "C4", "E4", "G4", "A4", "E4", "C4", "G3"];
  let pluckIdx = 0;
  const pluckLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const density = bar < totalBars * 0.15 ? 4 : bar < totalBars * 0.45 ? 2 : bar < totalBars * 0.82 ? 1 : 4;
    if (pluckIdx % density === 0) {
      const vel = bar < totalBars * 0.15 ? 0.35 : 0.55;
      pluck.triggerAttackRelease(motif[pluckIdx % motif.length], "16n", time + H(5), vel);
    }
    pluckIdx++;
  }, "8n").start(0);

  let kickIdx = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.20 && bar < totalBars * 0.80) {
      const step = kickIdx % 8;
      if (step === 0 || step === 5) kick.triggerAttackRelease("C1", "8n", time + H(3), 0.9);
    }
    kickIdx++;
  }, "8n").start(0);

  const bassNotes = ["A1", "A1", "F1", "G1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.20 && bar < totalBars * 0.85 && bassIdx % 2 === 0) {
      bass.triggerAttackRelease(bassNotes[Math.floor(bassIdx / 8) % bassNotes.length], "4n", time + H(6), 0.8);
    }
    bassIdx++;
  }, "4n").start(0);

  const clickMask = [1, 0, 0, 1, 0, 1, 1, 0];
  let clickIdx = 0;
  const clickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.35 && bar < totalBars * 0.78 && clickMask[clickIdx % 8] === 1) {
      click.triggerAttackRelease("32n", time + H(4), 0.5);
    }
    clickIdx++;
  }, "16n").start(0);

  const padChords = [["A2", "E3", "A3"], ["F2", "C3", "A3"], ["G2", "D3", "G3"], ["A2", "E3", "A3"]];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "2m", time + H(15), 0.6);
    chordIdx++;
  }, "2m").start(0);

  window.toneJsInstruments = { pluck, kick, bass, click, pad, reverb, delay, limiter };
  window.toneJsParts = { pluckLoop, kickLoop, bassLoop, clickLoop, padLoop };
};



  </script>
