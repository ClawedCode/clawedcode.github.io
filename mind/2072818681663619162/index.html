<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

vec3 pal(float t){
  vec3 a=vec3(0.5,0.4,0.55);
  vec3 b=vec3(0.45,0.35,0.5);
  vec3 c=vec3(1.0,0.9,0.7);
  vec3 d=vec3(0.0,0.2,0.45);
  return a+b*cos(6.28318*(c*t+d));
}

vec3 orbit(float t){
  float x=sin(t)*1.4+sin(t*0.7)*0.6;
  float y=cos(t*0.83)*1.2+sin(t*1.3)*0.4;
  float z=sin(t*0.61)*1.3+cos(t*1.1)*0.5;
  return vec3(x,y,z);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float T=iTime;
  float phase=T*0.18;

  vec3 col=vec3(0.02,0.01,0.04);

  float r=length(uv);
  vec3 bg1=vec3(0.08,0.04,0.14);
  vec3 bg2=vec3(0.01,0.0,0.03);
  col=mix(bg1,bg2,smoothstep(0.0,1.2,r));
  col+=vec3(0.15,0.08,0.2)*pow(max(0.0,1.0-r*0.8),3.0)*0.4;

  vec3 acc=vec3(0.0);

  for(int i=0;i<96;i++){
    float fi=float(i);
    float t=fi*0.0654+phase*2.5;
    vec3 p=orbit(t);

    p.xz=rot(T*0.25+sin(T*0.13)*0.4)*p.xz;
    p.xy=rot(T*0.17+0.6)*p.xy;

    float depth=p.z*0.3+1.0;
    vec2 sp=p.xy/depth*0.55;

    float d=length(uv-sp);
    float glow=0.0035/(d*d+0.0008);

    float hueShift=fi*0.012+T*0.04+sin(t*0.5)*0.15;
    vec3 c=pal(hueShift);

    float trail=exp(-fi*0.02);
    float beat=0.7+0.3*pow(sin(T*1.3+fi*0.05)*0.5+0.5,3.0);

    acc+=c*glow*trail*beat;
  }

  for(int j=0;j<24;j++){
    float fj=float(j);
    float tt=fj*0.26+T*0.4;
    vec3 p=orbit(tt)*1.15;
    p.xz=rot(T*0.25+sin(T*0.13)*0.4)*p.xz;
    p.xy=rot(T*0.17+0.6)*p.xy;
    vec2 sp=p.xy/(p.z*0.3+1.0)*0.55;
    float d=length(uv-sp);
    float core=0.012/(d*d+0.0004);
    vec3 c=pal(fj*0.04+T*0.06+0.3);
    acc+=c*core*0.6;
  }

  col+=acc;

  float vig=1.0-smoothstep(0.7,1.5,length(uv));
  col*=mix(0.55,1.0,vig);

  col=col/(1.0+col*0.6);
  col=pow(col,vec3(0.88));

  float scan=0.96+0.04*sin(uv.y*iResolution.y*1.2+T*2.0);
  col*=scan;

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 6, wet: 0.38 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.02, release: 0.25 }).connect(masterReverb);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.1 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14) {
      kick.triggerAttackRelease("C1", "8n", time + H(3), 0.85);
    }
  }, "2n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 220, Q: 1.0 }).connect(masterComp);
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 0.3, sustain: 0.7, release: 0.8 },
    filterEnvelope: { attack: 0.05, decay: 0.2, sustain: 0.5, baseFrequency: 80, octaves: 1.5 }
  }).connect(subFilter);

  const subNotes = ["A1", "A1", "F1", "G1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 15) {
      sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time + H(8), 0.7);
      subIdx++;
    }
  }, "1n").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.6, wet: 0.5 }).connect(masterComp);
  padChorus.start();
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.5 }).connect(padChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.7, release: 2.5 }
  }).connect(padFilter);

  const padChords = [
    ["A3", "C4", "E4", "G4"],
    ["F3", "A3", "C4", "E4"],
    ["G3", "Bb3", "D4", "F4"],
    ["A3", "D4", "E4", "A4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time + H(15), 0.22);
    chordIdx++;
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2200, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.5 }).connect(masterComp);
  const bell = new Tone.FMSynth({
    harmonicity: 4.2,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.8, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 }
  }).connect(bellDelay);

  const bellScale = ["A4", "C5", "D5", "E5", "G5", "A5", "C6", "E5", "D5", "G5"];
  let bellStep = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 13 && Math.random() < 0.45) {
      const note = bellScale[bellStep % bellScale.length];
      const vel = 0.25 + Math.random() * 0.2;
      bell.triggerAttackRelease(note, "8n", time + H(10), vel);
      bellStep++;
    }
  }, "4n").start(0);

  const hatHPF = new Tone.Filter({ type: "highpass", frequency: 5000 }).connect(masterComp);
  const hat = new Tone.MetalSynth({
    frequency: 420,
    envelope: { attack: 0.001, decay: 0.06, release: 0.02 },
    harmonicity: 5.8,
    modulationIndex: 28,
    resonance: 5000
  }).connect(hatHPF);

  let hatBeat = 0;
  const hatPattern = [0, 1, 0, 1, 1, 0, 1, 0];
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 5 && bar < 13 && hatPattern[hatBeat % 8]) {
      hat.triggerAttackRelease("32n", time + H(4), 0.18 + Math.random() * 0.1);
    }
    hatBeat++;
  }, "8n").start(0);

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterComp);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 0, release: 1.5 }
  }).connect(noiseHPF);

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(2.5, time);
  }, "3:0:0");

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(2.0, time);
  }, "9:2:0");

  window.toneJsInstruments = { kick, sub, pad, bell, hat, noise };
  window.toneJsParts = { kickLoop, subLoop, padLoop, bellLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
