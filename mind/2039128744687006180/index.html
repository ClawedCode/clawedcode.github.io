<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i = 0; i < 3; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

vec2 sporePos(float id, float t) {
    float angle = hash(vec2(id, 0.0)) * 6.2832;
    float speed = 0.2 + hash(vec2(id, 1.0)) * 0.4;
    float radius = speed * t;
    float wobble = sin(t * 1.5 + id * 3.7) * 0.15;
    float drift = cos(t * 0.8 + id * 2.1) * 0.1;
    return vec2(cos(angle + wobble) * radius + drift,
                sin(angle + drift) * radius + wobble);
}

float tendril(vec2 uv, vec2 a, vec2 b, float w) {
    vec2 ab = b - a;
    vec2 ap = uv - a;
    float t = clamp(dot(ap, ab) / dot(ab, ab), 0.0, 1.0);
    float d = length(ap - ab * t);
    float warp = fbm(uv * 3.0 + vec2(iTime * 0.1)) * 0.08;
    return smoothstep(w + warp, 0.0, d);
}

float pulse(float t, float offset, float speed) {
    return 0.5 + 0.5 * sin(t * speed + offset);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);

    float growth = smoothstep(0.0, 40.0, t);
    float fade = 1.0 - smoothstep(55.0, 60.0, t);

    vec3 bg = vec3(0.02, 0.015, 0.01);
    float bgNoise = fbm(uv * 2.0 + t * 0.02) * 0.03;
    bg += bgNoise;

    vec3 col = bg;

    float nodeGlow = 0.0;
    float tendrilGlow = 0.0;
    vec3 tendrilCol = vec3(0.0);

    float sporeCount = 40.0;

    for(int i = 0; i < 40; i++) {
        float id = float(i);
        float birthTime = id * 0.8 + hash(vec2(id, 7.0)) * 2.0;
        float alive = smoothstep(birthTime, birthTime + 1.0, t);
        if(alive < 0.01) continue;

        float localT = max(0.0, t - birthTime);
        vec2 pos = sporePos(id, localT * (0.3 + hash(vec2(id, 3.0)) * 0.2));

        float maxReach = 1.8 * growth;
        pos = pos * min(1.0, maxReach / max(length(pos), 0.001));

        float d = length(uv - pos);

        float signalPhase = pulse(t, id * 1.7, 2.0 + hash(vec2(id, 5.0)));
        float brightness = 0.4 + 0.6 * signalPhase;

        float nodeSize = 0.008 + 0.004 * sin(t * 1.2 + id);
        float node = smoothstep(nodeSize, 0.0, d) * alive * brightness;

        vec3 nodeColor = mix(
            vec3(0.8, 0.5, 0.15),
            vec3(0.6, 0.85, 0.3),
            signalPhase * 0.6
        );

        float halo = exp(-d * 25.0) * alive * 0.15 * brightness;
        nodeGlow += node + halo;

        col += (node * 2.0 + halo) * nodeColor * fade;

        for(int j = 0; j < 40; j++) {
            if(j <= i) continue;
            float jd = float(j);
            float jBirth = jd * 0.8 + hash(vec2(jd, 7.0)) * 2.0;
            float jAlive = smoothstep(jBirth, jBirth + 1.0, t);
            if(jAlive < 0.01) continue;

            float jLocalT = max(0.0, t - jBirth);
            vec2 jPos = sporePos(jd, jLocalT * (0.3 + hash(vec2(jd, 3.0)) * 0.2));
            jPos = jPos * min(1.0, maxReach / max(length(jPos), 0.001));

            float dist = length(pos - jPos);
            float connectThresh = 0.3 + 0.2 * growth;

            if(dist < connectThresh) {
                float connectStrength = (1.0 - dist / connectThresh) * alive * jAlive;

                float signalTravel = fract(t * 0.8 + hash(vec2(id, jd)) * 6.28);
                float signalBright = exp(-pow(signalTravel - 0.5, 2.0) * 8.0);

                float w = 0.003 + 0.002 * connectStrength;
                float ten = tendril(uv, pos, jPos, w) * connectStrength;

                vec3 tCol = mix(
                    vec3(0.55, 0.3, 0.1),
                    vec3(0.9, 0.75, 0.2),
                    signalBright * 0.7
                );

                tCol = mix(tCol, vec3(0.4, 0.8, 0.25), signalBright * 0.3);

                col += ten * tCol * fade * (0.3 + signalBright * 0.7);
                tendrilGlow += ten;
            }
        }
    }

    float originPulse = exp(-length(uv) * 8.0) * (0.5 + 0.5 * sin(t * 1.5));
    vec3 originCol = mix(vec3(0.9, 0.6, 0.1), vec3(0.5, 0.9, 0.2), sin(t * 0.5) * 0.5 + 0.5);
    col += originPulse * originCol * 0.6 * fade;

    float sporeField = 0.0;
    for(int i = 0; i < 80; i++) {
        float id = float(i) + 100.0;
        vec2 sp = vec2(
            hash(vec2(id, 0.0)) * 4.0 - 2.0,
            hash(vec2(id, 1.0)) * 4.0 - 2.0
        );
        float drift = t * (0.01 + hash(vec2(id, 2.0)) * 0.02);
        sp += vec2(sin(drift + id), cos(drift * 0.7 + id)) * 0.3;
        float d = length(uv - sp);
        float flicker = pulse(t, id * 2.3, 1.0 + hash(vec2(id, 4.0)));
        sporeField += exp(-d * 60.0) * 0.02 * flicker;
    }

    col += sporeField * vec3(0.7, 0.5, 0.2) * growth * fade;

    float vignette = 1.0 - length(uv) * 0.4;
    col *= vignette;

    col = pow(col, vec3(0.9));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 58;
    Tone.Transport.bpm.value = bpm;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
    await masterReverb.generate();

    const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

    const droneLPF = new Tone.Filter({ type: "lowpass", frequency: 300, Q: 1.0 }).connect(masterReverb);
    const drone = new Tone.MonoSynth({
        oscillator: { type: "sawtooth" },
        envelope: { attack: 3.0, decay: 2.0, sustain: 0.7, release: 4.0 },
        filterEnvelope: { attack: 4.0, decay: 2.0, sustain: 0.3, baseFrequency: 60, octaves: 1.5 }
    }).connect(droneLPF);

    const droneLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        const notes = ["A1", "E1", "D1", "A1"];
        const idx = Math.floor(bar / 4) % notes.length;
        drone.triggerAttackRelease(notes[idx], "2m", time, 0.3);
    }, "2m").start(0);

    const bellFilter = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 0.8 }).connect(masterDelay);
    const bell = new Tone.FMSynth({
        harmonicity: 5.5,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.002, decay: 3.0, sustain: 0.0, release: 2.0 },
        modulation: { type: "triangle" },
        modulationEnvelope: { attack: 0.5, decay: 1.0, sustain: 0.3, release: 1.0 }
    }).connect(bellFilter);

    const bellNotes = ["A4", "E5", "C5", "D5", "A5", "F5", "G4", "B4", "E4", "C6"];
    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        const progress = bar / 20;

        if (bar < 2) return;
        if (bar >= 18) return;

        const shouldPlay = Math.random() < (0.3 + progress * 0.4);
        if (!shouldPlay) return;

        const note = bellNotes[bellIndex % bellNotes.length];
        const vel = 0.15 + Math.random() * 0.15 + progress * 0.1;
        bell.triggerAttackRelease(note, "2n", time, Math.min(vel, 0.4));
        bellIndex++;
    }, "4n").start(0);

    const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(masterReverb);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 2.0, decay: 1.5, sustain: 0.5, release: 3.0 }
    }).connect(padChorus);

    const chords = [
        ["A3", "C4", "E4"],
        ["F3", "A3", "C4"],
        ["D3", "F3", "A3"],
        ["E3", "G3", "B3"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar < 4) return;
        if (bar >= 17) return;

        const chord = chords[chordIdx % chords.length];
        const vel = bar < 8 ? 0.08 : (bar < 14 ? 0.14 : 0.06);
        pad.triggerAttackRelease(chord, "1m", time, vel);
        chordIdx++;
    }, "1m").start(0);

    const pulseFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 2.0 }).connect(masterReverb);
    const pulseSynth = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0.0, release: 0.2 }
    }).connect(pulseFilter);

    const pulseNotes = ["A2", "E3", "A2", "C3", "E3", "A2", "D3", "E3"];
    let pulseIdx = 0;
    const pulseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar < 6) return;
        if (bar >= 16) return;

        const pattern = [1, 0, 1, 0, 0, 1, 0, 1];
        if (!pattern[pulseIdx % pattern.length]) {
            pulseIdx++;
            return;
        }

        const note = pulseNotes[pulseIdx % pulseNotes.length];
        pulseSynth.triggerAttackRelease(note, "16n", time, 0.2 + Math.random() * 0.1);
        pulseIdx++;
    }, "8n").start(0);

    const texNoise = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.2, release: 3.0 }
    });
    const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 0.5 }).connect(masterReverb);
    texNoise.connect(noiseFilter);

    const noiseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 4 && bar < 16) {
            texNoise.triggerAttackRelease("4m", time, 0.04);
        }
    }, "4m").start(0);

    Tone.Transport.schedule((time) => {
        droneLPF.frequency.linearRampToValueAtTime(600, time + 8 * (60 / bpm) * 4);
    }, "4:0:0");

    Tone.Transport.schedule((time) => {
        pulseFilter.frequency.linearRampToValueAtTime(1800, time + 4 * (60 / bpm) * 4);
    }, "8:0:0");

    Tone.Transport.schedule((time) => {
        droneLPF.frequency.linearRampToValueAtTime(200, time + 4 * (60 / bpm) * 4);
        pulseFilter.frequency.linearRampToValueAtTime(400, time + 4 * (60 / bpm) * 4);
    }, "14:0:0");

    window.toneJsInstruments = { drone, bell, pad, pulseSynth, texNoise };
    window.toneJsParts = { droneLoop, bellLoop, padLoop, pulseLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
