<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define TAU 6.28318530718
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=h(i),b=h(i+vec2(1.0,0.0)),c=h(i+vec2(0.0,1.0)),d=h(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fb(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){
    v+=n(p)*a;
    p=p*2.03+vec2(7.1,-3.4);
    a*=0.5;
  }
  return v;
}
vec2 curl(vec2 p,vec2 l){
  float e=0.13;
  float a=fb(p+vec2(0.0,e)+l),b=fb(p-vec2(0.0,e)+l);
  float c=fb(p+vec2(e,0.0)-l.yx),d=fb(p-vec2(e,0.0)-l.yx);
  return vec2((c-d)/(2.0*e),-(a-b)/(2.0*e));
}
vec2 field(vec2 p,float ph){
  vec2 l=vec2(cos(TAU*ph),sin(TAU*ph))*1.8;
  vec2 v=curl(p*0.62,l)*1.5+curl(p*1.28,-l*0.7)*0.45;
  vec2 q=p+vec2(sin(p.y*0.7+TAU*ph),cos(p.x*0.6-TAU*ph))*0.4;
  v+=vec2(-q.y,q.x)*0.035;
  return normalize(v+0.0001)*(0.55+0.75*fb(p*0.33+l));
}
vec3 pal(float x){
  vec3 a=vec3(0.34,0.31,0.39),b=vec3(0.42,0.34,0.28),c=vec3(0.92,0.78,0.66),d=vec3(0.02,0.17,0.37);
  return a+b*cos(TAU*(c*x+d));
}
float line(vec2 p,vec2 a,vec2 b,float w){
  vec2 pa=p-a,ba=b-a;
  float t=clamp(dot(pa,ba)/max(dot(ba,ba),0.0001),0.0,1.0);
  return smoothstep(w,0.0,length(pa-ba*t));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0;
  float beat=pow(0.5+0.5*sin(iTime*72.0/60.0*3.14159265),9.0);
  vec3 col=vec3(0.004,0.005,0.009);
  float veil=fb(uv*1.2+vec2(cos(TAU*ph),sin(TAU*ph))*0.8);
  col+=vec3(0.015,0.018,0.033)*veil;
  for(int i=0;i<40;i++){
    float fi=float(i);
    float gx=mod(fi,8.0)-3.5;
    float gy=floor(fi/8.0)-2.0;
    vec2 p=vec2(gx,gy)*0.56;
    p+=vec2(sin(fi*2.17+TAU*ph),cos(fi*1.63-TAU*ph))*0.18;
    vec2 last=p;
    float glow=0.0;
    for(int j=0;j<5;j++){
      float fj=float(j);
      vec2 v=field(p,ph+fi*0.003);
      p+=v*0.24;
      p=mod(p+vec2(3.6),vec2(7.2))-vec2(3.6);
      float m=line(uv,last,p,0.012+fj*0.002);
      float d=length(uv-p);
      float pulse=0.35+0.65*sin(TAU*ph*3.0+fi*1.11+fj*0.9);
      vec3 pc=pal(0.16+0.5*length(v)+fi*0.013+ph*0.3);
      col+=pc*m*(0.12+0.08*pulse)*(1.0-fj*0.12);
      glow+=0.0025/(d*d+0.002);
      last=p;
    }
    float flash=smoothstep(0.982,1.0,sin(fi*12.989+ph*TAU*5.0))*smoothstep(0.82,1.0,fb(p*1.7));
    col+=pal(0.7+fi*0.01)*glow*(0.018+flash*0.13+beat*0.012);
  }
  for(int k=0;k<24;k++){
    float fk=float(k);
    vec2 q=vec2(sin(fk*2.399),cos(fk*1.873))*2.15;
    q+=field(q,ph)*0.7;
    float d=length(uv-q);
    float f=smoothstep(0.028,0.0,d);
    col+=vec3(0.95,0.76,0.48)*f*(0.12+0.5*smoothstep(0.97,1.0,sin(TAU*ph*4.0+fk)));
  }
  float vign=smoothstep(1.7,0.25,length(uv));
  col*=vign;
  col=pow(col,vec3(0.82));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.22 }).toDestination();
  const verb = new Tone.Reverb({ decay: 7.5, wet: 0.42 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.34, wet: 0.28 }).connect(verb);
  const low = new Tone.Filter({ type: "lowpass", frequency: 900, Q: 0.8 }).connect(delay);
  const air = new Tone.Filter({ type: "highpass", frequency: 900 }).connect(verb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 0.7, sustain: 0.72, release: 3.0 }
  }).connect(low);
  pad.volume.value = -14;
  const pulse = new Tone.FMSynth({
    harmonicity: 1.5,
    modulationIndex: 4.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 1.6, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(delay);
  pulse.volume.value = -17;
  const sub = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    filter: { type: "lowpass", frequency: 120, rolloff: -24 },
    envelope: { attack: 0.08, decay: 0.3, sustain: 0.42, release: 1.0 },
    filterEnvelope: { attack: 0.2, decay: 0.7, sustain: 0.2, baseFrequency: 45, octaves: 1.4 }
  }).connect(master);
  sub.volume.value = -18;
  const bell = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.006, decay: 2.8, sustain: 0, release: 2.0 },
    modulation: { type: "sine" }
  }).connect(air);
  bell.volume.value = -18;
  const breath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.4, decay: 1.8, sustain: 0, release: 2.2 }
  }).connect(verb);
  breath.volume.value = -24;
  const chords = [
    ["D3", "A3", "E4", "F4"],
    ["Bb2", "F3", "C4", "D4"],
    ["G2", "D3", "A3", "C4"],
    ["A2", "E3", "B3", "D4"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const v = bar < totalBars * 0.18 || bar >= totalBars * 0.82 ? 0.20 : 0.31;
    pad.triggerAttackRelease(chords[ci % chords.length], "1m", time + H(14), v);
    ci++;
  }, "1m").start(0);
  const roots = ["D1", "D1", "Bb0", "G0", "A0", "D1"];
  let si = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.84) {
      const v = bar < totalBars * 0.25 ? 0.28 : bar < totalBars * 0.68 ? 0.42 : 0.24;
      sub.triggerAttackRelease(roots[si % roots.length], "2n", time + H(8), v);
    }
    si++;
  }, "2n").start(0);
  const notes = ["D5", "E5", "A4", "F5", "C5", "D6", "A5", "G5", "E5"];
  let pi = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.16 && bar < totalBars * 0.78) {
      const sparse = bar < totalBars * 0.36 ? pi % 3 === 0 : pi % 2 === 0 || Math.random() > 0.62;
      if (sparse) pulse.triggerAttackRelease(notes[(pi * 5 + bar) % notes.length], "8n", time + H(10), 0.28 + Math.random() * 0.18);
    }
    pi++;
  }, "8n").start(0);
  let bi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.34 && bar < totalBars * 0.74 && (bi % 7 === 0 || Math.random() > 0.88)) {
      bell.triggerAttackRelease(notes[(bi * 2 + 3) % notes.length], "16n", time + H(12), 0.18 + Math.random() * 0.22);
    }
    bi++;
  }, "16n").start(0);
  const breathLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.90 && Math.random() > 0.45) {
      breath.triggerAttackRelease("2n", time + H(15), bar < totalBars * 0.65 ? 0.18 : 0.10);
    }
  }, "1m").start(0);
  Tone.Transport.schedule((time) => {
    low.frequency.linearRampToValueAtTime(2600, time + totalBars * 0.34 * secPerBar);
  }, totalBars * 0.18 * secPerBar);
  Tone.Transport.schedule((time) => {
    low.frequency.linearRampToValueAtTime(760, time + totalBars * 0.16 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { pad, pulse, sub, bell, breath, verb, delay, low, air, master };
  window.toneJsParts = { padLoop, subLoop, pulseLoop, bellLoop, breathLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
