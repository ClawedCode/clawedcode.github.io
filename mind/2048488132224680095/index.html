<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float n(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);
}

float fb(vec2 p){
  float v=0.0,a=0.5;
  for(float i=0.0;i<3.0;i++){v+=a*n(p);p*=2.0;a*=0.5;}
  return v;
}

float beat(float t){
  float p=mod(t,1.0);
  return exp(-8.0*(p-0.15)*(p-0.15))+0.6*exp(-12.0*(p-0.3)*(p-0.3));
}

float seg(vec2 p,vec2 a,vec2 b){
  vec2 pa=p-a,ba=b-a;
  float k=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  return length(pa-ba*k);
}

float vx(float y,float t){
  return 0.012*sin(y*3.0+t*0.5)+0.008*sin(y*7.1-t*0.8)+0.004*sin(y*13.0+t*0.3);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0);
  float br=sin(t*0.7854)*0.5+0.5;
  float hb=beat(t*1.2);

  vec3 bg=mix(vec3(0.02,0.015,0.01),vec3(0.008,0.015,0.035),uv.y*0.5+0.5);
  vec3 col=bg+0.008*fb(uv*4.0+t*0.05);
  vec3 vi=vec3(0.25,0.51,0.43);
  vec3 co=vec3(1.0,0.5,0.31);
  vec3 ce=vec3(0.0,0.48,0.65);

  float tx=vx(uv.y,t);
  float vn=n(vec2(uv.y*20.0,t*0.3))*0.002;
  float td=abs(uv.x-tx+vn);
  float tw=0.008+0.005*hb+0.008*smoothstep(0.0,-0.5,uv.y);
  col+=smoothstep(tw+0.002,tw-0.001,td)*vi*(0.7+0.5*hb);
  col+=exp(-td*45.0)*vi*0.15*(0.5+0.5*hb);

  float sp=mod(t*0.3,2.0)-1.0;
  col+=exp(-abs(uv.y-sp)*8.0)*exp(-td*80.0)*0.4*mix(vi,vec3(0.4,0.9,0.6),0.5);

  float vtp=mod(t*0.05,1.0)*1.4-0.7;
  float vtd=length(uv-vec2(vx(vtp,t),vtp));
  col+=exp(-vtd*50.0)*vec3(0.3,0.8,0.4)*0.2;

  for(float i=0.0;i<12.0;i++){
    float yb=-0.55+i*0.1;
    float s=i*7.13;
    float dir=mod(i,2.0)<1.0?1.0:-1.0;

    float cl=h(vec2(s,5.0));
    float cyc=cl<0.33?5.0:(cl<0.66?6.0:10.0);
    float ph=mod(t/cyc-i*0.08,1.0);
    float gr=smoothstep(0.0,0.3,ph)*smoothstep(0.85,0.5,ph)*(0.5+0.5*br);

    float bl=(0.12+0.1*h(vec2(s,1.0)))*gr;
    float ang=1.5708+dir*(0.3+0.5*h(vec2(s,2.0)));
    float txb=vx(yb,t);
    vec2 bs=vec2(txb,yb);
    vec2 bm=bs+bl*0.5*vec2(cos(ang),sin(ang));
    bm.y+=0.025*sin(s+t*0.7);
    bm.x-=dir*0.02*gr;
    vec2 be=bs+bl*vec2(cos(ang),sin(ang));
    be.y+=0.03*sin(s*1.3+t*0.5);

    float d1=seg(uv,bs,bm),d2=seg(uv,bm,be);
    float bd=min(d1,d2);
    float bw=(0.004+0.002*hb)*gr;
    float branch=smoothstep(bw+0.002,bw,bd)*gr;

    float em=h(vec2(s,3.0));
    vec3 bc=em<0.33?vi:(em<0.66?co:ce);
    col+=branch*bc*0.8;
    col+=exp(-bd*30.0)*bc*0.12*gr;

    float gpa=smoothstep(0.3,0.5,ph)*smoothstep(0.85,0.6,ph);
    vec2 gp=uv-be;
    float gs=0.028*gpa;
    float gd=0.0;
    float gt=h(vec2(s,4.0));
    if(gt<0.33) gd=abs(length(gp)-gs);
    else if(gt<0.66) gd=abs(abs(gp.x)+abs(gp.y)-gs);
    else gd=min(abs(gp.x),abs(gp.y))+smoothstep(gs,gs*2.0,max(abs(gp.x),abs(gp.y)))*0.05;

    float gm=smoothstep(gs*2.5,gs*0.3,length(gp));
    float fl=0.5+0.5*sin(t*10.0+s*5.0);
    float ga=smoothstep(0.004,0.001,gd)*gpa*fl*gm;
    float gg=exp(-gd*100.0)*gpa*0.4*gm;

    vec3 gc=mix(bc,vec3(1.0,0.95,0.85),0.6);
    col+=ga*gc;
    col+=gg*bc*fl;
  }

  for(float i=0.0;i<60.0;i++){
    float s=i*3.71+17.0;
    float px=(h(vec2(s,0.0))-0.5)*1.0;
    float py=h(vec2(s,1.0))*1.4-0.7;
    float spd=0.015*(0.3+0.7*h(vec2(s,2.0)));
    py=mod(py-t*spd+0.7,1.4)-0.7;
    px+=0.03*sin(t*0.4+s*2.0)+0.015*sin(t*0.9+s);

    float pd=length(uv-vec2(px,py));
    float ps=0.002+0.001*h(vec2(s,3.0));
    float pt=smoothstep(ps+0.001,ps-0.0005,pd);
    float pg=exp(-pd*200.0)*0.06;

    float pe=h(vec2(s,4.0));
    vec3 pc=pe<0.33?vi:(pe<0.66?co:ce);
    pc*=0.4+0.3*sin(t*1.5+s);
    col+=(pt+pg)*pc;
  }

  col+=exp(-length(uv)*2.0)*vi*0.025*(0.6+0.4*br);
  col*=1.0-0.35*length(uv*vec2(0.7,0.5));

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 66;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await reverb.generate();

  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.7 }).connect(reverb);
  const chorus = new Tone.Chorus({ frequency: 0.2, delayTime: 5, depth: 0.5, wet: 0.35 }).connect(padFilter);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 0.7, release: 2.5 }
  }).connect(chorus);

  const drone = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 3.0 }
  }).connect(reverb);
  drone.volume.value = -14;

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.06,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.15 }
  }).toDestination();
  kick.volume.value = -10;

  const bell = new Tone.FMSynth({
    harmonicity: 4,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0, release: 1.0 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.2, decay: 1.5, sustain: 0, release: 0.5 }
  }).connect(delay);
  bell.volume.value = -14;

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 300, Q: 0.4 }).connect(reverb);
  const noiseGain = new Tone.Gain(0.06).connect(noiseFilter);
  const ambient = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 3.0 }
  }).connect(noiseGain);

  Tone.Transport.schedule((time) => {
    ambient.triggerAttack(time);
    drone.triggerAttack("A1", time, 0.3);
  }, "0:0:0");

  const chords = [
    ["A3", "C4", "E4"],
    ["A3", "C4", "E4"],
    ["F3", "A3", "C4"],
    ["F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["E3", "G3", "B3"],
    ["D3", "F3", "A3"],
    ["D3", "F3", "A3"],
    ["A3", "C4", "E4"],
    ["G3", "B3", "D4"],
    ["F3", "A3", "C4"],
    ["E3", "G3", "B3"],
    ["D3", "F3", "A3"],
    ["A3", "C4", "E4"],
    ["A3", "C4", "E4"],
    ["A3", "C4", "E4"]
  ];

  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    let vol = 0.12;
    if (bar < 2) vol = 0.08;
    else if (bar < 6) vol = 0.16;
    else if (bar < 10) vol = 0.2;
    else if (bar < 14) vol = 0.15;
    else vol = 0.08;
    pad.triggerAttackRelease(chords[chordIndex % chords.length], "1m", time, vol);
    chordIndex++;
  }, "1m").start(0);

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14) {
      kick.triggerAttackRelease("C1", "8n", time, 0.45);
    }
  }, "2n").start(0);

  const bellNotes = ["E5", "A5", "C6", "G5", "D5", "B5", "F5", "E6"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 13 && bellIndex % 3 === 0) {
      const note = bellNotes[bellIndex % bellNotes.length];
      bell.triggerAttackRelease(note, "2n", time, 0.25 + 0.1 * Math.sin(bellIndex * 1.1));
    }
    bellIndex++;
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1400, time + 8 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(400, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  Tone.Transport.schedule((time) => {
    drone.triggerRelease(time);
    ambient.triggerRelease(time);
  }, "14:0:0");

  window.toneJsInstruments = { pad, drone, kick, bell, ambient };
  window.toneJsParts = { padLoop, kickLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
