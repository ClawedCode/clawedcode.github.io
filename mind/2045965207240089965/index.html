<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float n(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x),mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x),f.y);
}

float fb(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*n(p);p*=2.1;a*=0.5;}
  return v;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0),ph=t/60.0;
  float gr=smoothstep(0.0,0.4,ph),ds=smoothstep(0.55,0.9,ph);
  float fd=smoothstep(0.0,0.03,ph)*(1.0-smoothstep(0.95,1.0,ph));
  vec2 p=uv;
  p.y+=0.5;
  p.x+=0.018*sin(p.y*3.5+t*0.3)*(0.7+0.3*n(p*2.0+t*0.05));
  float vi=0.0,gw=0.0,dp=0.0,fr=0.0,md=10.0,s=1.0;
  for(int i=0;i<11;i++){
    float fi=float(i);
    float lG=clamp(gr*13.0-fi,0.0,1.0),lD=clamp(ds*13.0-(10.0-fi),0.0,1.0);
    float ln=0.12*min(lG,1.0);
    float cv=0.035*sin(fi*2.1+t*0.5)*(0.6+0.4*n(vec2(fi,t*0.15)));
    vec2 tp=vec2(cv,ln);
    vec2 ba=tp;
    float ht=clamp(dot(p,ba)/max(dot(ba,ba),0.0001),0.0,1.0);
    float sg=length(p-ba*ht),wd=sg/s;
    md=min(md,wd);
    float th=mix(0.016,0.002,fi/10.0),vs=lG*(1.0-lD);
    float br=smoothstep(th,th*0.08,wd)*vs;
    if(lD>0.1){
      float fn=n(p*s*12.0+vec2(fi*3.7,0.0));
      float mk=step(lD*0.65,fn);
      fr+=br*(1.0-mk)*lD;
      br*=mk;
    }
    vi=max(vi,br);
    dp+=br*fi/10.0;
    float pp=fract(t*0.2-fi*0.065);
    float pd=length(p-tp*pp)/s;
    gw+=exp(-500.0*pd*pd)*vs*0.55;
    float pp2=fract(t*0.11+fi*0.09+0.5);
    float pd2=length(p-tp*pp2)/s;
    gw+=exp(-250.0*pd2*pd2)*vs*0.2;
    p-=tp;
    p.x=abs(p.x)+0.002;
    float a=0.5+0.14*sin(t*0.3+fi*1.6)+0.05*n(vec2(fi*2.5,t*0.1));
    float c=cos(a),si=sin(a);
    p=mat2(c,-si,si,c)*p;
    p*=1.42;
    s*=1.42;
  }
  vec3 bg=vec3(0.012,0.016,0.032);
  bg+=vec3(0.012,0.018,0.035)*fb(uv*3.0+t*0.015);
  bg+=vec3(0.008,0.01,0.015)*max(0.0,0.3-uv.y);
  vec2 gu=uv*12.0;
  vec2 gc=fract(gu)-0.5;
  float cl=smoothstep(0.49,0.485,abs(gc.x))+smoothstep(0.49,0.485,abs(gc.y));
  cl*=step(0.7,n(floor(gu)*0.3+t*0.04))*0.04*(1.0-vi);
  bg+=vec3(0.12,0.18,0.35)*cl;
  float gt=step(0.93,n(vec2(floor(gu.y*0.5),t*2.0)));
  bg+=vec3(0.06,0.12,0.25)*gt*0.035*(1.0-vi);
  vec3 vc=mix(vec3(0.08,0.45,0.18),vec3(0.05,0.32,0.42),clamp(dp,0.0,1.0));
  vc*=0.85+0.15*sin(t*0.8);
  float tg=exp(-25.0*md)*0.12;
  vec3 col=bg;
  col+=vec3(0.02,0.06,0.03)*tg;
  col=mix(col,vc,vi);
  col+=vec3(0.55,0.42,0.1)*min(fr,1.0)*0.65;
  col+=vec3(0.85,0.7,0.28)*gw;
  col+=vec3(0.03,0.07,0.04)*vi;
  col*=1.0-0.3*dot(uv,uv);
  col*=fd;
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLen = 4 * 60 / bpm;

  const rev = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
  await rev.generate();
  const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(rev);
  const chr = new Tone.Chorus({ frequency: 0.3, delayTime: 4.5, depth: 0.6, wet: 0.4 }).connect(rev);
  chr.start();
  const hpf = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(dly);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.0 }
  }).connect(chr);
  pad.volume.value = -12;

  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.5 }
  }).connect(dly);
  arp.volume.value = -16;

  const bell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 1.5, sustain: 0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(hpf);
  bell.volume.value = -20;

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05, octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
  }).toDestination();
  kick.volume.value = -22;

  const nFilt = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 0.5 }).connect(rev);
  const nEnv = new Tone.AmplitudeEnvelope({
    attack: 0.5, decay: 0.3, sustain: 0.2, release: 1.0
  }).connect(nFilt);
  const noi = new Tone.Noise({ type: "pink" }).connect(nEnv);
  noi.start();
  noi.volume.value = -28;

  const chords = [
    ["D3", "F3", "A3"],
    ["Bb2", "D3", "F3"],
    ["C3", "E3", "G3"],
    ["A2", "C3", "E3"],
    ["G2", "Bb2", "D3"],
    ["F2", "A2", "C3"]
  ];

  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let prog;
    if (bar < 7) prog = [chords[0], chords[1], chords[2], chords[3]];
    else if (bar < 12) prog = [chords[4], chords[1], chords[5], chords[3]];
    else prog = [chords[0], chords[5], chords[2], chords[0]];
    pad.triggerAttackRelease(prog[ci % prog.length], "1n", time, 0.3);
    ci++;
  }, "1n").start(0);

  const scale = [62, 65, 69, 72, 74, 77, 81];
  let ai = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 15) { ai++; return; }
    const prog = (bar - 3) / 12;
    const dens = bar < 10 ? 0.4 + prog * 0.4 : 0.8 - (bar - 10) * 0.12;
    if (Math.random() > dens) { ai++; return; }
    const range = Math.min(Math.floor(3 + prog * 4), scale.length);
    const oct = Math.random() > 0.75 ? 12 : 0;
    arp.triggerAttackRelease(
      Tone.Frequency(scale[ai % range] + oct, "midi"),
      "8n", time, 0.3 + Math.random() * 0.2
    );
    ai++;
  }, "8n").start(0);

  let bi = 0;
  const bellNotes = [74, 77, 81, 84, 86];
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 5 || bar >= 14) { bi++; return; }
    if (Math.random() > 0.15) { bi++; return; }
    bell.triggerAttackRelease(
      Tone.Frequency(bellNotes[bi % bellNotes.length], "midi"),
      "4n", time, 0.2 + Math.random() * 0.15
    );
    bi++;
  }, "4n").start(0);

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 15) return;
    kick.triggerAttackRelease("D1", "4n", time, 0.3);
  }, "2n").start(0);

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 14) return;
    if (Math.random() > 0.3) return;
    nEnv.triggerAttackRelease(0.4, time, 0.15 + Math.random() * 0.1);
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    nFilt.frequency.linearRampToValueAtTime(2400, time + 6 * barLen);
  }, "3:0:0");

  Tone.Transport.schedule((time) => {
    nFilt.frequency.linearRampToValueAtTime(800, time + 3 * barLen);
  }, "12:0:0");

  window.toneJsInstruments = { pad, arp, bell, kick, noi };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, kickLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
