<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define TAU 6.28318530718
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=h(i),b=h(i+vec2(1.0,0.0)),c=h(i+vec2(0.0,1.0)),d=h(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
vec2 curl(vec2 p,float a){
  float e=.16;
  vec2 q=vec2(cos(a),sin(a))*1.7;
  float y1=n(p+vec2(0.0,e)+q),y2=n(p-vec2(0.0,e)+q);
  float x1=n(p+vec2(e,0.0)-q),x2=n(p-vec2(e,0.0)-q);
  return vec2((x1-x2)/(2.0*e),-(y1-y2)/(2.0*e));
}
vec2 field(vec2 p,float a){
  vec2 v=curl(p*.75,a)*1.4+curl(p*1.55,-a*.7)*.5;
  float r=length(p)+.08;
  vec2 spin=vec2(-p.y,p.x)/(r*r+.35);
  vec2 pull=-p/(r+1.0);
  return v+spin*.72+pull*.18;
}
vec3 pal(float x){
  vec3 a=vec3(.42,.34,.48),b=vec3(.45,.28,.38),c=vec3(.95,.72,1.08),d=vec3(.06,.18,.34);
  return a+b*cos(TAU*(c*x+d));
}
float lineGlow(vec2 p,vec2 a,vec2 b,float w){
  vec2 pa=p-a,ba=b-a;
  float q=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  float d=length(pa-ba*q);
  return smoothstep(w,0.0,d);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0;
  float a=ph*TAU;
  float bpm=92.0;
  float beat=pow(.5+.5*sin(iTime*bpm/60.0*TAU),8.0);
  vec3 col=vec3(.008,.01,.022);
  float core=exp(-dot(uv,uv)*5.8);
  col+=vec3(.08,.035,.12)*core;
  float ring=abs(length(uv)-(.48+.035*sin(a*3.0)));
  col+=pal(ph+.3)*smoothstep(.034,.0,ring)*(.16+.12*beat);
  for(int i=0;i<16;i++){
    float fi=float(i);
    float seed=fi/16.0;
    float ang=seed*TAU+a*.23;
    float rad=.35+1.22*h(vec2(fi,4.0));
    vec2 p=vec2(cos(ang),sin(ang))*rad+vec2(sin(fi*2.11+a),cos(fi*1.73-a))*.18;
    vec2 old=p;
    for(int j=0;j<12;j++){
      float fj=float(j);
      vec2 f=field(p,a+seed*TAU);
      old=p;
      p+=f*.115;
      p=mod(p+2.7,5.4)-2.7;
      float g=lineGlow(uv,old,p,.018+.006*sin(fj+fi));
      float sp=clamp(length(f)*.75,0.0,1.0);
      vec3 cc=mix(vec3(1.0,.52,.22),vec3(.18,.88,1.0),sp);
      cc=mix(cc,pal(seed+ph*.5),.45);
      col+=cc*g*(.062+.018*beat)*(1.0-fj/14.0);
    }
    float dotp=smoothstep(.052,.0,length(uv-p));
    col+=pal(seed+ph)*dotp*.16;
  }
  float sig=sin(atan(uv.y,uv.x)*9.0-length(uv)*8.0+a*2.0);
  col+=vec3(.22,.08,.36)*smoothstep(.78,.18,abs(sig))*exp(-length(uv)*2.1)*.08;
  col*=1.0-.22*length(uv);
  col+=vec3(.05,.13,.18)*beat*exp(-dot(uv,uv)*2.4);
  col=pow(max(col,0.0),vec3(.82));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  // === SETUP (always include this block first) ===
  const bpm = 92;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -17, ratio: 3, attack: 0.01, release: 0.18 }).toDestination();
  const verb = new Tone.Reverb({ decay: 4.2, wet: 0.34 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.32, wet: 0.22 }).connect(verb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.028,
    octaves: 5.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.19, sustain: 0, release: 0.03 }
  }).connect(master);
  kick.volume.value = -6;
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.1 }).connect(master);
  const bassDrive = new Tone.Distortion({ distortion: 0.28, wet: 0.25 }).connect(bassFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    filter: { type: "lowpass", frequency: 120, rolloff: -24 },
    envelope: { attack: 0.004, decay: 0.12, sustain: 0.12, release: 0.08 },
    filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.25, baseFrequency: 70, octaves: 2.1 }
  }).connect(bassDrive);
  bass.volume.value = -9;
  const padHPF = new Tone.Filter({ type: "highpass", frequency: 180 }).connect(verb);
  const chorus = new Tone.Chorus({ frequency: 0.16, delayTime: 4.2, depth: 0.62, wet: 0.42 }).connect(padHPF);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "fatsawtooth", count: 3, spread: 18 },
    envelope: { attack: 0.8, decay: 0.4, sustain: 0.65, release: 1.8 }
  }).connect(chorus);
  pad.volume.value = -15;
  const bell = new Tone.FMSynth({
    harmonicity: 2.7,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.006, decay: 1.5, sustain: 0.02, release: 1.1 },
    modulation: { type: "triangle" }
  }).connect(delay);
  bell.volume.value = -14;
  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 650, Q: 1.4 }).connect(delay);
  const arp = new Tone.Synth({
    oscillator: { type: "pulse", width: 0.38 },
    envelope: { attack: 0.003, decay: 0.09, sustain: 0, release: 0.05 }
  }).connect(arpFilter);
  arp.volume.value = -16;
  const hat = new Tone.MetalSynth({
    frequency: 410,
    envelope: { attack: 0.001, decay: 0.08, release: 0.02 },
    harmonicity: 5.7,
    modulationIndex: 24,
    resonance: 3600
  }).connect(verb);
  hat.volume.value = -22;
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 620, Q: 0.7 }).connect(verb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.05, decay: 0.35, sustain: 0, release: 0.4 }
  }).connect(noiseFilter);
  noise.volume.value = -24;
  let kickStep = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    const skip = p > 0.82 && kickStep % 8 === 6;
    if (!skip) kick.triggerAttackRelease("C1", "8n", time + H(3), p > 0.38 && p < 0.72 ? 1.0 : 0.82);
    master.threshold.setValueAtTime(-27, time);
    master.threshold.linearRampToValueAtTime(-17, time + 0.12);
    kickStep++;
  }, "4n").start(0);
  const bassA = ["F1", "F1", "C2", "Eb2", "F1", "Ab1", "C2", "Bb1"];
  const bassB = ["F1", "C2", "Eb2", "F2", "Ab1", "C2", "Bb1", "Eb2", "F1", "G1", "Ab1", "C2"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    if (p < 0.1) return;
    const pat = p < 0.38 || p > 0.82 ? bassA : bassB;
    if (p > 0.82 && bassIndex % 4 === 2) return;
    bass.triggerAttackRelease(pat[bassIndex % pat.length], "8n", time + H(6), p > 0.35 && p < 0.76 ? 0.78 : 0.58);
    bassIndex++;
  }, "8n").start(0);
  const chords = [
    ["F3", "Ab3", "C4", "G4"],
    ["Db3", "Ab3", "C4", "Eb4"],
    ["Eb3", "Bb3", "D4", "F4"],
    ["C3", "G3", "Bb3", "Eb4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    const vel = p > 0.32 && p < 0.74 ? 0.24 : 0.16;
    pad.triggerAttackRelease(chords[chordIndex % chords.length], "2n", time + H(12), vel);
    chordIndex++;
  }, "2n").start(0);
  const arpScale = [0, 3, 7, 10, 12, 15, 19, 22, 24, 19, 15, 10];
  const roots = ["F3", "Db3", "Eb3", "C3"];
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    if (p >= 0.16 && p < 0.8) {
      const root = Tone.Frequency(roots[Math.floor(bar / 2) % roots.length]).toMidi();
      const drift = p > 0.56 && arpIndex % 9 === 0 ? 1 : 0;
      const note = Tone.Frequency(root + arpScale[arpIndex % arpScale.length] + drift, "midi");
      const vel = p > 0.36 && p < 0.66 ? 0.52 : 0.34;
      arp.triggerAttackRelease(note, "16n", time + H(7), vel);
    }
    arpIndex++;
  }, "16n").start(0);
  const bellPool = ["C5", "Eb5", "F5", "G5", "Bb5", "C6", "Ab5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    if (p > 0.08 && p < 0.78 && bellIndex % 3 !== 1) {
      const note = bellPool[(bellIndex * 2 + Math.floor(bar)) % bellPool.length];
      bell.triggerAttackRelease(note, "8n", time + H(14), p > 0.44 && p < 0.68 ? 0.34 : 0.22);
    }
    bellIndex++;
  }, "2n").start(0);
  let hatIndex = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    const pat = [1, 0, 1, 1, 0, 1, 0, 1];
    if (p > 0.34 && p < 0.76 && pat[hatIndex % pat.length]) {
      hat.triggerAttackRelease("16n", time + H(4), 0.18 + Math.random() * 0.16);
    }
    hatIndex++;
  }, "8n").start(0);
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const p = bar / totalBars;
    if (p > 0.22 && p < 0.7 && bar % 4 === 1) {
      noiseFilter.frequency.setValueAtTime(420 + Math.random() * 360, time);
      noise.triggerAttackRelease("16n", time + H(10), 0.18);
    }
  }, "1m").start(0);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(3600, time + totalBars * 0.28 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(900, time + totalBars * 0.28 * secPerBar);
  }, totalBars * 0.16 * secPerBar);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(560, time + totalBars * 0.16 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(180, time + totalBars * 0.16 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, bass, pad, bell, arp, hat, noise, master, verb, delay, bassFilter, bassDrive, padHPF, chorus, arpFilter, noiseFilter };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, bellLoop, arpLoop, hatLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
