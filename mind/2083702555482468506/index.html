<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec3 streamColor(int idx) {
  if (idx == 0) return vec3(1.0, 0.62, 0.18);
  if (idx == 1) return vec3(1.0, 0.18, 0.12);
  return vec3(0.22, 0.82, 1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  float cycle = mod(t, 14.0) / 14.0;

  vec3 col = vec3(0.015, 0.008, 0.03);

  for (int s = 0; s < 3; s++) {
    float fs = float(s);
    float baseAngle = fs * 2.0944 + t * 0.18;
    vec3 sc = streamColor(s);

    for (int i = 0; i < 70; i++) {
      float fi = float(i) / 70.0;
      float r = 1.25 - fi * 1.18;
      float spin = baseAngle + fi * 7.5 + sin(t * 0.4 + fi * 4.0 + fs) * 0.45;
      float braid = sin(fi * 14.0 + t * 1.6 + fs * 2.0944) * 0.09 * (1.0 - fi * 0.6);
      float wob = cos(fi * 8.0 - t * 0.7 + fs) * 0.04 * fi;
      vec2 p = vec2(cos(spin), sin(spin)) * (r + braid + wob);

      float particlePhase = fract(fi * 1.3 + cycle + fs * 0.333);
      float ignition = pow(1.0 - abs(particlePhase - 0.5) * 2.0, 2.5);
      float taper = smoothstep(0.0, 0.15, 1.0 - fi) * smoothstep(0.0, 0.1, fi);

      float d = length(uv - p);
      float glow = 0.0085 / (d * d + 0.0007);

      col += sc * glow * ignition * taper * 0.18;
    }
  }

  float coreD = length(uv);
  float corePulse = 0.55 + 0.45 * sin(t * 1.1);
  float coreBreath = 0.4 + 0.6 * pow(0.5 + 0.5 * sin(t * 0.6), 2.0);
  float core = exp(-coreD * 7.5) * corePulse * coreBreath;
  col += vec3(1.0, 0.96, 0.92) * core * 1.8;
  col += vec3(1.0, 0.92, 0.85) * exp(-coreD * 18.0) * 0.9;

  for (int r = 0; r < 5; r++) {
    float fr = float(r);
    float rippleT = mod(t * 0.55 + fr * 0.7, 3.0) / 3.0;
    float rippleR = rippleT * 1.5;
    float rippleD = abs(coreD - rippleR);
    float ripple = exp(-rippleD * 28.0) * (1.0 - rippleT) * (1.0 - rippleT) * 0.55;

    float hueShift = rippleT * 6.28 + fr * 1.3;
    vec3 rc = vec3(0.5) + vec3(0.45) * vec3(
      cos(hueShift),
      cos(hueShift + 2.094),
      cos(hueShift + 4.188)
    );
    rc = mix(rc, streamColor(int(mod(fr, 3.0))), 0.4);
    col += rc * ripple;
  }

  float angle = atan(uv.y, uv.x);
  for (int a = 0; a < 3; a++) {
    float fa = float(a);
    float armAngle = fa * 2.0944 + t * 0.18 + 1.5708;
    float angDiff = abs(mod(angle - armAngle + 3.14159, 6.28318) - 3.14159);
    float dispersal = exp(-angDiff * 4.0) * exp(-coreD * 1.8) * (1.0 - cycle) * 0.15;
    col += streamColor(a) * dispersal;
  }

  col *= 1.0 - length(uv) * 0.25;
  col = col / (1.0 + col * 0.85);
  col = pow(col, vec3(0.82));

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 6.5, wet: 0.42 }).toDestination();
  await masterReverb.generate();
  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.02, release: 0.25 }).connect(masterReverb);

  const subDelay = new Tone.FeedbackDelay({ delayTime: "2n.", feedback: 0.55, wet: 0.3 }).connect(masterComp);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.2, decay: 0.4, sustain: 0.7, release: 2.5 },
    filter: { type: "lowpass", frequency: 200 }
  }).connect(masterComp);
  subBass.volume.value = -10;

  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 900, Q: 1.4 }).connect(subDelay);
  const amberPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.5, decay: 1.0, sustain: 0.7, release: 4.0 }
  }).connect(amberFilter);
  amberPad.volume.value = -14;

  const crimsonDist = new Tone.Distortion({ distortion: 0.18, wet: 0.25 }).connect(masterComp);
  const crimsonFilter = new Tone.Filter({ type: "bandpass", frequency: 1400, Q: 2.2 }).connect(crimsonDist);
  const crimsonPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.8, decay: 0.6, sustain: 0.4, release: 2.5 }
  }).connect(crimsonFilter);
  crimsonPad.volume.value = -18;

  const cyanChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.6, wet: 0.5 }).connect(masterComp).start();
  const cyanFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(cyanChorus);
  const cyanPad = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 0.8, sustain: 0.5, release: 3.5 }
  }).connect(cyanFilter);
  cyanPad.volume.value = -16;

  const bellDelay = new Tone.PingPongDelay({ delayTime: "4n.", feedback: 0.55, wet: 0.45 }).connect(masterComp);
  const coreBell = new Tone.FMSynth({
    harmonicity: 4.0,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 3.5, sustain: 0, release: 2.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.02, decay: 1.5, sustain: 0, release: 1.0 }
  }).connect(bellDelay);
  coreBell.volume.value = -12;

  const subRoot = "A0";
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease(subRoot, "1m", time + H(15), 0.6);
  }, "1m").start(0);

  const amberChords = [
    ["A2", "C3", "E3"],
    ["F2", "A2", "C3"],
    ["G2", "Bb2", "D3"],
    ["E2", "G2", "B2"]
  ];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 14) {
      amberPad.triggerAttackRelease(amberChords[amberIdx % 4], "1m", time + H(18), 0.45);
    }
    amberIdx++;
  }, "1m").start(0);

  const crimsonNotes = ["A3", "E4", "G3", "C4", "F3", "A3", "G3", "E4"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 13 && crimsonIdx % 2 === 0) {
      crimsonPad.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "2n", time + H(10), 0.35);
    }
    crimsonIdx++;
  }, "2n").start(0);

  const cyanChords = [
    ["E4", "A4", "B4"],
    ["C4", "F4", "A4"],
    ["D4", "G4", "Bb4"],
    ["E4", "G4", "B4"]
  ];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14) {
      cyanPad.triggerAttackRelease(cyanChords[cyanIdx % 4], "1m", time + (60 / bpm) * 2 + H(12), 0.4);
    }
    cyanIdx++;
  }, "1m").start(0);

  const bellNotes = ["A5", "E6", "C6", "G5", "B5", "A5", "F5", "E6"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const beatInBar = bellIdx % 4;
    let shouldRing = false;
    if (bar < 2) shouldRing = beatInBar === 0;
    else if (bar < 8) shouldRing = beatInBar === 0 || beatInBar === 2;
    else if (bar < 13) shouldRing = beatInBar === 0 || beatInBar === 2 || (beatInBar === 3 && Math.random() > 0.4);
    else shouldRing = beatInBar === 0;

    if (shouldRing) {
      const note = bellNotes[bellIdx % bellNotes.length];
      const vel = bar < 2 || bar >= 13 ? 0.3 : 0.5;
      coreBell.triggerAttackRelease(note, "2n", time + H(6), vel);
    }
    bellIdx++;
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    amberFilter.frequency.linearRampToValueAtTime(2400, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    amberFilter.frequency.linearRampToValueAtTime(900, time + 4 * (60 / bpm) * 4);
  }, "10:0:0");

  Tone.Transport.schedule((time) => {
    crimsonFilter.frequency.linearRampToValueAtTime(2800, time + 4 * (60 / bpm) * 4);
  }, "5:0:0");

  Tone.Transport.schedule((time) => {
    crimsonFilter.frequency.linearRampToValueAtTime(1400, time + 3 * (60 / bpm) * 4);
  }, "11:0:0");

  window.toneJsInstruments = { subBass, amberPad, crimsonPad, cyanPad, coreBell };
  window.toneJsParts = { subLoop, amberLoop, crimsonLoop, cyanLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
