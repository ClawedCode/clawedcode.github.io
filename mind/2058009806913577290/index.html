<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float ph = t * 6.28318 / 75.0;
    vec2 s1 = vec2(0.3 * sin(ph) + 0.1 * sin(ph * 3.0), 0.22 * cos(ph * 2.0) + 0.07 * cos(ph * 5.0));
    vec2 s2 = vec2(-0.25 * sin(ph * 2.0 + 2.1) + 0.11 * cos(ph * 4.0), -0.18 * cos(ph * 3.0 + 1.0) + 0.09 * sin(ph * 5.0));
    float d1 = length(uv - s1);
    float d2 = length(uv - s2);
    float a1 = 1.0 / (1.0 + d1 * 3.0);
    float a2 = 1.0 / (1.0 + d2 * 3.0);
    float w1 = sin(38.0 * d1 - 2.3 * t) * a1 + 0.3 * sin(76.0 * d1 - 4.9 * t) * a1 * a1;
    float w2 = sin(40.0 * d2 - 2.39 * t) * a2 + 0.3 * sin(80.0 * d2 - 4.81 * t) * a2 * a2;
    float amp = w1 + w2;
    float n = clamp(amp * 0.32 + 0.5, 0.0, 1.0);
    float pk = pow(n, 3.0);
    float sf = pow(n, 1.5);
    vec3 col = mix(vec3(0.002, 0.005, 0.015), vec3(0.01, 0.06, 0.12), smoothstep(0.0, 0.5, sf));
    col = mix(col, vec3(0.05, 0.38, 0.48), smoothstep(0.3, 0.7, pk));
    col = mix(col, vec3(0.65, 0.88, 0.93), smoothstep(0.7, 1.0, pk));
    float g1 = sin(12.0 * d1 - 2.3 * t) * a1;
    float g2 = sin(12.6 * d2 - 2.39 * t) * a2;
    col += vec3(0.01, 0.05, 0.06) * pow(clamp((g1 + g2) * 0.4 + 0.5, 0.0, 1.0), 2.0);
    col += vec3(0.02, 0.07, 0.09) * pow(abs(w1 * w2), 2.0) * 4.0;
    col += vec3(0.06, 0.25, 0.32) * (exp(-d1 * d1 * 25.0) + exp(-d2 * d2 * 25.0)) * 0.18;
    col *= 0.2 + 0.8 * (1.0 - smoothstep(0.35, 0.82, length(uv)));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 58;
    Tone.Transport.bpm.value = bpm;
    const barSec = 4 * 60 / bpm;

    const verb = new Tone.Reverb({ decay: 7, wet: 0.55 }).toDestination();
    await verb.generate();

    const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(verb);

    const chor = new Tone.Chorus({ frequency: 0.25, delayTime: 5, depth: 0.5, wet: 0.3 }).connect(verb);
    chor.start();

    const src1 = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 4.0, decay: 1.5, sustain: 0.7, release: 5.0 }
    }).connect(chor);
    src1.volume.value = -14;

    const src2 = new Tone.Synth({
        oscillator: { type: "sine" },
        detune: 4,
        envelope: { attack: 4.0, decay: 1.5, sustain: 0.7, release: 5.0 }
    }).connect(chor);
    src2.volume.value = -14;

    const sub = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 5.0, decay: 2.0, sustain: 0.5, release: 6.0 }
    }).toDestination();
    sub.volume.value = -8;

    const bell = new Tone.FMSynth({
        harmonicity: 5.01,
        modulationIndex: 7,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 3.5, sustain: 0, release: 2.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 }
    }).connect(dly);
    bell.volume.value = -22;

    const nFilt = new Tone.Filter({ type: "bandpass", frequency: 450, Q: 0.6 }).connect(verb);
    const water = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 2.5, decay: 1.5, sustain: 0.15, release: 3.5 }
    }).connect(nFilt);
    water.volume.value = -26;

    const subTones = ["F#1", "C#2", "B1", "E2"];
    let si = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar < 17) sub.triggerAttackRelease(subTones[si % subTones.length], "1m", time, 0.45);
        si++;
    }, "1m").start(0);

    const padTones = ["F#3", "C#3", "A3", "E3", "B2", "F#3"];
    let p1 = 0;
    const src1Loop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 2 && bar < 16) {
            src1.triggerAttackRelease(padTones[p1 % padTones.length], "1m", time, 0.3);
        }
        p1++;
    }, "1m").start(0);

    let p2 = 0;
    const src2Loop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 4 && bar < 15) {
            src2.triggerAttackRelease(padTones[(p2 + 2) % padTones.length], "1m", time, 0.25);
        }
        p2++;
    }, "1m").start("0:2:0");

    const bellTones = ["F#5", "C#6", "A5", "E5", "B5"];
    let bi = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 6 && bar < 13 && Math.random() > 0.45) {
            bell.triggerAttackRelease(bellTones[bi % bellTones.length], "2n", time, 0.1 + Math.random() * 0.08);
        }
        bi++;
    }, "2n").start(0);

    const waterLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
        if (bar >= 8 && bar < 13 && Math.random() > 0.55) {
            water.triggerAttackRelease("2n", time, 0.08);
            nFilt.frequency.linearRampToValueAtTime(250 + Math.random() * 700, time + 2.0);
        }
    }, "1n").start(0);

    window.toneJsInstruments = { src1, src2, sub, bell, water };
    window.toneJsParts = { subLoop, src1Loop, src2Loop, bellLoop, waterLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
