<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) { return fract(sin(n) * 43758.5453); }
float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

vec2 rotate(vec2 p, float a) {
  float c = cos(a), s = sin(a);
  return vec2(p.x * c - p.y * s, p.x * s + p.y * c);
}

float particleField(vec2 uv, float t, float chaos, float order) {
  float acc = 0.0;
  for (float i = 0.0; i < 200.0; i++) {
    float id = i / 200.0;
    float phase = hash(i * 7.31) * 6.28318;
    float speed = 0.3 + hash(i * 3.17) * 2.0;
    float chaosPhase = t * speed + phase;
    vec2 chaosPos = vec2(
      sin(chaosPhase * 1.3 + hash(i * 1.1) * 10.0) * (0.8 + 0.4 * sin(t * 0.7 + i)),
      cos(chaosPhase * 0.9 + hash(i * 2.3) * 10.0) * (0.8 + 0.4 * cos(t * 0.5 + i))
    );
    float spiralAngle = id * 6.28318 * 5.0 + t * 0.5;
    float spiralR = 0.1 + id * 0.7;
    vec2 spiralPos = vec2(cos(spiralAngle), sin(spiralAngle)) * spiralR;
    int gridIdx = int(mod(i, 16.0));
    float gx = mod(float(gridIdx), 4.0) - 1.5;
    float gy = floor(float(gridIdx) / 4.0) - 1.5;
    vec2 gridPos = vec2(gx, gy) * 0.4;
    float eyeAngle = id * 6.28318 + sin(t * 0.3 + id * 5.0) * 0.5;
    float eyeR = 0.3 + 0.2 * sin(id * 20.0 + t);
    vec2 eyePos = vec2(cos(eyeAngle), sin(eyeAngle)) * eyeR;
    vec2 orderPos = mix(mix(spiralPos, gridPos, sin(t * 0.2) * 0.5 + 0.5), eyePos, sin(t * 0.15 + 1.5) * 0.5 + 0.5);
    vec2 pos = mix(chaosPos, orderPos, order);
    pos = rotate(pos, sin(t * 0.1 + id * 3.0) * chaos * 0.5);
    float d = length(uv - pos);
    float size = 0.008 + 0.012 * hash(i * 5.5);
    size *= 1.0 + 0.5 * sin(t * 3.0 + id * 20.0);
    float glow = smoothstep(size * 3.0, 0.0, d);
    float core = smoothstep(size, size * 0.3, d);
    acc += glow * 0.15 + core * 0.4;
  }
  return acc;
}

vec3 getColor(vec2 uv, float t, float chaos, float order) {
  float hueBase = t * 0.05;
  float hueShift = length(uv) * 0.3 + atan(uv.y, uv.x) * 0.1;
  float saturation = 0.7 + 0.3 * order;
  vec3 cyan = hsv2rgb(vec3(0.5 + hueBase, saturation, 1.0));
  vec3 magenta = hsv2rgb(vec3(0.85 + hueBase * 0.5, saturation, 1.0));
  vec3 purple = hsv2rgb(vec3(0.75 + sin(t * 0.3) * 0.05, saturation, 0.8));
  float mixer = sin(t * 0.4 + length(uv) * 3.0) * 0.5 + 0.5;
  vec3 col = mix(cyan, magenta, mixer);
  col = mix(col, purple, sin(t * 0.25 + atan(uv.y, uv.x)) * 0.5 + 0.5);
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  float cycle = mod(t / 75.0, 1.0) * 75.0;
  float chaosWave = sin(cycle * 0.15) * 0.5 + 0.5;
  float orderPulse = pow(sin(cycle * 0.08 + 1.0) * 0.5 + 0.5, 1.5);
  float breathe = sin(cycle * 0.5) * 0.3;
  float chaos = 0.3 + chaosWave * 0.7 + breathe * 0.2;
  float order = orderPulse * (1.0 - chaosWave * 0.5);
  vec3 bg = vec3(0.02, 0.01, 0.04);
  bg += vec3(0.02, 0.0, 0.03) * (1.0 - length(uv));
  float field = particleField(uv, t, chaos, order);
  vec3 particleColor = getColor(uv, t, chaos, order);
  vec3 col = bg + particleColor * field;
  float flash = pow(max(0.0, sin(t * 8.0 + length(uv) * 10.0)), 20.0);
  flash *= chaos * 0.3;
  col += vec3(1.0, 0.8, 1.0) * flash;
  float vignette = 1.0 - length(uv) * 0.5;
  col *= vignette;
  col = pow(col, vec3(0.9));
  col = clamp(col, 0.0, 1.0);
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 88;
  Tone.Transport.bpm.value = bpm;
  const masterCompressor = new Tone.Compressor({ threshold: -16, ratio: 6, attack: 0.01, release: 0.2 }).toDestination();
  const masterReverb = new Tone.Reverb({ decay: 3.2, wet: 0.28 }).connect(masterCompressor);
  await masterReverb.generate();
  const darkDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.4, wet: 0.32 }).connect(masterReverb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1100, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.8, depth: 0.6, delayTime: 3.5, wet: 0.35 }).connect(padFilter).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 1.2, decay: 0.7, sustain: 0.55, release: 2.8 }
  }).connect(padChorus);
  const arpHPF = new Tone.Filter({ type: "highpass", frequency: 320, Q: 0.7 }).connect(darkDelay);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.09, sustain: 0, release: 0.07 }
  }).connect(arpHPF);
  const leadVerb = new Tone.Reverb({ decay: 2.6, wet: 0.34 }).connect(masterCompressor);
  await leadVerb.generate();
  const lead = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    portamento: 0.09,
    envelope: { attack: 0.01, decay: 0.18, sustain: 0.05, release: 0.25 },
    filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.1, baseFrequency: 500, octaves: 2 }
  }).connect(leadVerb);
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.1 }).connect(masterCompressor);
  const bassDrive = new Tone.Distortion({ distortion: 0.18, wet: 0.2 }).connect(bassFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.01, decay: 0.12, sustain: 0.08, release: 0.12 }
  }).connect(bassDrive);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.22, sustain: 0, release: 0.08 }
  }).connect(masterCompressor);
  const hat = new Tone.MetalSynth({
    frequency: 360,
    envelope: { attack: 0.001, decay: 0.1, release: 0.02 },
    harmonicity: 5.4,
    modulationIndex: 30,
    resonance: 4200
  }).connect(masterReverb);
  const snare = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.004, decay: 0.14, sustain: 0, release: 0.08 }
  }).connect(masterReverb);
  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 500 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.3, decay: 0.18, sustain: 0, release: 0.5 }
  }).connect(noiseHPF);
  const padChords = [
    ["E3", "G3", "B3"],
    ["D3", "F#3", "A3"],
    ["C3", "E3", "G3"],
    ["B2", "D#3", "F#3"]
  ];
  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[padIdx % padChords.length], "2m", time, 0.22);
    padIdx++;
  }, "2m").start(0);
  const arpPattern = ["E4", "G4", "B4", "D4", "G4", "B4", "E5", "B4"];
  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    if (bar >= 2 && bar < 24) {
      const vel = bar < 6 ? 0.28 : bar < 18 ? 0.45 : 0.32;
      arp.triggerAttackRelease(arpPattern[arpIdx % arpPattern.length], "16n", time, vel);
      arpIdx++;
    }
  }, "16n").start(0);
  const leadSequence = [
    [0, "E4"], [1, "G4"], [2.5, "B4"], [3.25, "A4"],
    [4.5, "G4"], [5.25, "E4"], [6, "D4"], [7.5, "E4"]
  ];
  const leadPart = new Tone.Part((time, note) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    if (bar >= 8 && bar < 21) {
      lead.triggerAttackRelease(note, "8n", time, 0.75);
    }
  }, leadSequence).start(0);
  const bassSections = [
    ["E1", "E1", "D1", "E1"],
    ["E1", "B0", "C1", "D1", "E1", "C1", "B0", "D1"],
    ["E1", "D1", "C1", "B0"],
    ["E1", "E1", "D1", "E1"]
  ];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    let pattern;
    if (bar < 6) pattern = bassSections[0];
    else if (bar < 16) pattern = bassSections[1];
    else if (bar < 22) pattern = bassSections[2];
    else pattern = bassSections[3];
    if (bar >= 2) {
      bass.triggerAttackRelease(pattern[bassIdx % pattern.length], "8n", time, bar < 22 ? 0.65 : 0.5);
      bassIdx++;
    }
  }, "8n").start(0);
  let kickStep = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    if (bar >= 4) {
      const vel = bar >= 22 ? 0.55 : 0.78;
      kick.triggerAttackRelease("C1", "8n", time, vel);
    }
    kickStep++;
  }, "4n").start(0);
  let hatStep = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    if (bar >= 10 && bar < 22) {
      if (hatStep % 2 === 1) {
        const vel = 0.32 + Math.random() * 0.08;
        hat.triggerAttackRelease("16n", time, vel);
      }
    }
    hatStep++;
  }, "8n").start(0);
  let snareStep = 0;
  const snareLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / ((60 / bpm) * 4));
    if (bar >= 10 && bar < 21 && snareStep % 2 === 1) {
      snare.triggerAttackRelease("16n", time, 0.6);
    }
    snareStep++;
  }, "4n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2200, time + (60 / bpm) * 8);
  }, "6:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(900, time + (60 / bpm) * 6);
  }, "21:0:0");
  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(2800, time + 1.2);
    noise.triggerAttackRelease(1.2, time);
  }, "3:2:0");
  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(2500, time + 1.0);
    noise.triggerAttackRelease(1.0, time);
  }, "12:0:0");
  window.toneJsInstruments = { pad, arp, lead, bass, kick, hat, snare, noise };
  window.toneJsParts = { padLoop, arpLoop, leadPart, bassLoop, kickLoop, hatLoop, snareLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
