<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float n(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);
}

float fb(vec2 p,float s){
  float v=0.0,a=0.5;
  mat2 m=mat2(0.8,0.6,-0.6,0.8);
  for(float i=0.0;i<4.0;i++){v+=a*n(p+s);p=m*p*2.0;a*=0.5;}
  return v;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,50.0),ph=t/50.0,r=length(uv);
  float breathe=1.0+0.03*sin(t*0.8);

  vec2 p=uv*4.0*breathe;
  float w1=fb(p+vec2(t*0.08,t*0.06),t*0.02);
  float w2=fb(p+vec2(w1*1.2,-t*0.05),t*0.015);
  float w3=fb(p+vec2(w2*0.8,w1*0.9),t*0.01);
  p+=vec2(w2,w3)*0.75;

  float sc=2.5+sin(ph*6.283)*0.8;
  float th=0.42+0.08*sin(ph*12.566+r*3.0);

  float a1=fb(p*sc,t*0.03);
  float i1=fb(p+vec2(77,33),t*0.02);
  float v1=a1-i1*0.55+0.25;
  float p1=smoothstep(th-0.03,th+0.03,v1);

  float a2=fb(p*1.8+vec2(t*0.01),t*0.025);
  float i2=fb(p*0.7+vec2(55,-22),t*0.018);
  float p2=smoothstep(0.38,0.48,a2-i2*0.5+0.2);

  float a3=fb(p*3.2+vec2(sin(ph*6.283)*0.4),t*0.015);
  float i3=fb(p*1.2+vec2(-40,60),t*0.012);
  float p3=smoothstep(0.4,0.5,a3-i3*0.5+0.22);

  float edge=abs(v1-th);
  edge=exp(-edge*edge*80.0)*2.5;

  vec3 deep=vec3(0.01,0.02,0.06);
  vec3 cyan=vec3(0.05,0.55,0.65);
  vec3 amber=vec3(0.85,0.5,0.1);
  vec3 red=vec3(0.75,0.08,0.03);
  vec3 mem=vec3(0.15,0.85,0.65);

  vec3 col=mix(deep,cyan,p1*0.7);
  col+=amber*p2*p1*0.35;
  col+=red*abs(p1-p2)*0.45*smoothstep(0.15,0.5,p3);
  col+=mem*edge*0.13*(0.5+0.5*sin(t*1.5));
  col+=cyan*0.07*(0.5+0.5*sin(t*0.8+w3*6.0))*p1;

  float micro=smoothstep(0.82,0.8,r)*smoothstep(0.0,0.05,0.8-r);
  col=mix(deep*0.5,col,smoothstep(0.78,0.72,r));
  col+=mem*0.04*smoothstep(0.71,0.73,r)*smoothstep(0.75,0.73,r);

  col*=1.0-r*0.5;
  col=pow(max(col,0.0),vec3(0.95));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const bl = 60 / bpm * 4;

  const rev = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await rev.generate();
  const cho = new Tone.Chorus({ frequency: 0.3, delayTime: 5, depth: 0.7, wet: 0.4 }).connect(rev);
  cho.start();
  const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(rev);

  const sf = new Tone.Filter({ type: "lowpass", frequency: 120, rolloff: -24 }).toDestination();
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.4, decay: 0.6, sustain: 0.4, release: 1.5 }
  }).connect(sf);
  sub.volume.value = -6;

  const sn = ["D1","D1","A0","A0","F1","F1","E1","E1"];
  let si = 0;
  const subL = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / bl);
    if (bar >= 4 && bar < 13) sub.triggerAttackRelease(sn[si % sn.length], "2n", time, 0.7);
    si++;
  }, "2n").start(0);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(cho);
  pad.volume.value = -14;

  const chords = [["D3","F3","A3"],["D3","F3","A3"],["A2","C3","E3"],["Bb2","D3","F3"],["C3","E3","G3"],["A2","C3","E3"]];
  let ci = 0;
  const padL = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / bl);
    if (bar < 14) pad.triggerAttackRelease(chords[ci % chords.length], "1n", time, 0.15);
    ci++;
  }, "1n").start(0);

  const drip = new Tone.FMSynth({
    harmonicity: 4.5, modulationIndex: 15,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.8, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(dly);
  drip.volume.value = -18;

  const dn = ["A5","D5","F5","E5","C6","A4","D6","G5"];
  let di = 0;
  const dripL = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / bl);
    if (bar >= 6 && bar < 12 && Math.random() > 0.4)
      drip.triggerAttackRelease(dn[di % dn.length], "8n", time, 0.3 + Math.random() * 0.2);
    di++;
  }, "4n").start(0);

  const nf = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2 }).connect(rev);
  const ns = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  }).connect(nf);
  ns.volume.value = -22;

  const noiseL = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / bl);
    if (bar >= 2 && bar < 13) ns.triggerAttackRelease("2n", time);
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    nf.frequency.linearRampToValueAtTime(2000, time + 4 * bl);
  }, bl * 6);
  Tone.Transport.schedule((time) => {
    nf.frequency.linearRampToValueAtTime(600, time + 3 * bl);
  }, bl * 11);

  window.toneJsInstruments = { sub, pad, drip, ns };
  window.toneJsParts = { subL, padL, dripL, noiseL };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 50;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 50;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
