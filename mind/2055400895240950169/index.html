<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(float n){return fract(sin(n)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f*=f*(3.0-2.0*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float sdb(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.0))+min(max(d.x,max(d.y,d.z)),0.0);}

float map(vec3 p){
    float d=sdb(p-vec3(-1.1,0,0),vec3(0.04,3.0,0.26));
    d=min(d,sdb(p-vec3(1.1,0,0),vec3(0.04,3.0,0.26)));
    d=min(d,sdb(p-vec3(0,3.0,0),vec3(1.1,0.03,0.26)));
    d=min(d,sdb(p-vec3(0,-3.0,0),vec3(1.1,0.03,0.26)));
    vec3 q=p;q.y=mod(q.y+0.25,0.5)-0.25;
    d=min(d,sdb(q,vec3(1.0,0.21,0.22)));
    return d;
}

vec3 nm(vec3 p){vec2 e=vec2(0.001,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);
    float tw=6.283185;
    vec3 ro=vec3(0.12*sin(t*tw/60.0),0.08*cos(t*tw/60.0),3.2);
    vec3 rd=normalize(vec3(uv,-1.1));
    vec3 col=vec3(0.012,0.01,0.02);
    float td=0.2;
    bool hit=false;
    for(float i=0.0;i<64.0;i++){float d=map(ro+rd*td);if(d<0.002){hit=true;break;}if(td>10.0)break;td+=d;}
    if(hit){
        vec3 p=ro+rd*td,n=nm(p);
        float diff=max(dot(n,normalize(vec3(0.1,0.2,1.0))),0.0)*0.1;
        col=vec3(0.05,0.05,0.07)*(diff+0.035);
        col+=vec3(0.08,0.1,0.12)*pow(max(dot(n,normalize(normalize(vec3(0.1,0.2,1.0))+normalize(ro-p))),0.0),20.0)*0.08;
        if(n.z>0.8){
            float uid=floor((p.y+0.25)/0.5);
            vec2 luv=vec2(p.x,mod(p.y+0.25,0.5)-0.25);
            vec2 gc=floor(luv*vec2(18.0,7.0));
            vec2 gf=fract(luv*vec2(18.0,7.0));
            float ld=length(gf-0.5);
            float has=step(0.55,h2(gc*13.0+vec2(uid*7.0,3.0)));
            float se=h2(gc*17.0+vec2(uid*11.0,0.0));
            float on=step(0.45,fract(sin(t*(4.0+se*22.0)+se*77.0)*43758.5453));
            vec3 lc=mix(mix(vec3(0.1,0.8,0.2),vec3(0.9,0.5,0.05),step(0.5,se)),vec3(0.8,0.1,0.05),step(0.82,se));
            col+=lc*has*on*0.003/(ld*ld+0.001);
        }
        col+=vec3(0.1,0.025,0.005)*smoothstep(1.0,-2.5,p.y);
    }
    vec3 cg=vec3(0.0);
    for(float s=0.0;s<20.0;s++){
        float sd=0.3+s*0.2;
        vec3 sp=ro+rd*sd;
        for(float c=0.0;c<3.0;c++){
            float ph=c*2.094;
            float bx=-1.35-c*0.05;
            float cx=bx+0.06*sin(sp.y*2.5+ph+t*0.4);
            float cz=-0.05+0.07*cos(sp.y*1.8+ph*1.5+t*0.3);
            float cd=length(vec2(sp.x-cx,sp.z-cz));
            float sg=0.5+0.5*sin(sp.y*5.0-t*3.0+ph*2.0);sg*=sg;
            cg+=mix(vec3(0.05,0.3,0.8),vec3(0.1,0.7,0.4),sg)*sg*0.002/(cd*cd+0.0002)*0.008;
            float rx=-bx-0.06*sin(sp.y*2.5+ph+t*0.45);
            cd=length(vec2(sp.x-rx,sp.z-cz));
            sg=0.5+0.5*sin(sp.y*5.0-t*2.7+ph*2.0+3.14);sg*=sg;
            cg+=mix(vec3(0.05,0.3,0.8),vec3(0.1,0.7,0.4),sg)*sg*0.002/(cd*cd+0.0002)*0.008;
        }
    }
    col+=cg;
    for(float i=0.0;i<18.0;i++){
        float ps=h(i*47.3),spd=0.3+ps*0.5;
        vec3 pp=vec3(mix(-1.6,1.6,h(i*23.1)),mod(-3.0+t*spd+ps*12.0,6.0)-3.0,mix(-0.2,0.3,h(i*11.9)));
        vec3 ap=pp-ro;float pr=dot(ap,rd);
        if(pr>0.5){float pd=length(pp-(ro+rd*pr));col+=mix(vec3(0.3,0.6,1.0),vec3(0.7,0.9,1.0),ps)*0.003/(pd*pd+0.0008)*smoothstep(0.5,1.5,pr)*smoothstep(8.0,4.0,pr)*0.07;}
    }
    for(float i=0.0;i<6.0;i++){
        float bt=fract(t*0.25+h(i*19.0));
        vec3 bp=vec3(mix(-1.3,1.3,bt),-2.0+i*0.8+0.05*sin(t*0.5+i),0.27);
        vec3 ap=bp-ro;float pr=dot(ap,rd);
        if(pr>0.5){float pd=length(bp-(ro+rd*pr));col+=vec3(0.2,0.7,1.0)*(0.4+0.4*sin(t*3.0+i*1.5))*0.002/(pd*pd+0.0006)*0.05;}
    }
    col+=vec3(0.12,0.03,0.005)*smoothstep(0.15,-0.55,uv.y)*ns(vec2(uv.x*4.0-t*0.08,t*0.4-uv.y*3.0))*0.5;
    col+=vec3(0.015,0.008,0.025)*smoothstep(0.9,0.0,length(uv));
    col*=0.96+0.04*sin(gl_FragCoord.y*2.0);
    col*=1.0-0.3*length(uv*0.85);
    col=col/(0.8+col);
    col=pow(col,vec3(0.93));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 72;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const masterVerb = new Tone.Reverb({ decay: 3.5, wet: 0.22 }).toDestination();
    await masterVerb.generate();

    const droneLPF = new Tone.Filter({ type: "lowpass", frequency: 95, Q: 2.5 }).connect(masterVerb);
    const drone = new Tone.Synth({
        oscillator: { type: "sawtooth" },
        envelope: { attack: 0.05, decay: 0.3, sustain: 1.0, release: 0.8 }
    }).connect(droneLPF);
    drone.volume.value = -10;

    const droneLoop = new Tone.Loop((time) => {
        drone.triggerAttackRelease("A0", "2n", time, 0.6);
    }, "2n").start(0);

    const fanBPF = new Tone.Filter({ type: "bandpass", frequency: 700, Q: 0.25 }).connect(masterVerb);
    const fan = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 0.8, decay: 0.3, sustain: 0.7, release: 1.0 }
    }).connect(fanBPF);
    fan.volume.value = -22;

    const fanLoop = new Tone.Loop((time) => {
        fan.triggerAttackRelease(2.5, time);
    }, "2n").start(0);

    const clickDly = new Tone.FeedbackDelay({ delayTime: "16n", feedback: 0.12, wet: 0.18 }).connect(masterVerb);
    const click = new Tone.MetalSynth({
        frequency: 900,
        envelope: { attack: 0.001, decay: 0.035, release: 0.008 },
        harmonicity: 12,
        modulationIndex: 38,
        resonance: 5500
    }).connect(clickDly);
    click.volume.value = -19;

    let clickStep = 0;
    const clickLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 3 && bar < 16) {
            const density = bar < 7 ? 0.25 : bar < 12 ? 0.5 : 0.35;
            if (Math.random() < density) {
                click.triggerAttackRelease("32n", time, 0.15 + Math.random() * 0.25);
            }
        }
        clickStep++;
    }, "16n").start(0);

    const sub = new Tone.MembraneSynth({
        pitchDecay: 0.04,
        octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.1 }
    }).toDestination();
    sub.volume.value = -7;

    const subNotes = ["C1", "C1", "G0", "A0"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 3 && bar < 16) {
            const pattern = bar < 8 ? subNotes.slice(0, 2) : subNotes;
            sub.triggerAttackRelease(pattern[subIdx % pattern.length], "8n", time, 0.65);
            subIdx++;
        }
    }, "2n").start(0);

    const padCh = new Tone.Chorus({ frequency: 0.07, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(masterVerb);
    padCh.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.8, decay: 0.5, sustain: 0.45, release: 2.5 }
    }).connect(padCh);
    pad.volume.value = -17;

    const chords = [
        ["A2", "C3", "E3"],
        ["F2", "A2", "C3"],
        ["G2", "B2", "D3"],
        ["E2", "G#2", "B2"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 5 && bar < 15) {
            pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.18);
            chordIdx++;
        }
    }, "1n").start(0);

    const arpFlt = new Tone.Filter({ type: "lowpass", frequency: 1800 }).connect(masterVerb);
    const arp = new Tone.FMSynth({
        harmonicity: 4,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.08 },
        modulation: { type: "sine" }
    }).connect(arpFlt);
    arp.volume.value = -15;

    const scale = [60, 63, 67, 70, 72, 75, 79, 84];
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 7 && bar < 14) {
            const progress = (bar - 7) / 7;
            if (Math.random() < 0.3 + progress * 0.35) {
                const idx = Math.floor(Math.random() * scale.length);
                const shift = Math.random() > 0.8 ? 12 : 0;
                arp.triggerAttackRelease(
                    Tone.Frequency(scale[idx] + shift, "midi"),
                    "32n", time, 0.2 + Math.random() * 0.2
                );
            }
        }
    }, "16n").start(0);

    Tone.Transport.schedule((time) => {
        arpFlt.frequency.linearRampToValueAtTime(4200, time + 5 * barLen);
    }, "8:0:0");

    Tone.Transport.schedule((time) => {
        arpFlt.frequency.linearRampToValueAtTime(1200, time + 3 * barLen);
    }, "13:0:0");

    const glitchNoise = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.06, sustain: 0, release: 0.02 }
    }).connect(masterVerb);
    glitchNoise.volume.value = -24;

    const glitchLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 9 && bar < 13 && Math.random() < 0.12) {
            glitchNoise.triggerAttackRelease(0.04, time);
        }
    }, "8n").start(0);

    window.toneJsInstruments = { drone, fan, click, sub, pad, arp, glitchNoise };
    window.toneJsParts = { droneLoop, fanLoop, clickLoop, subLoop, padLoop, arpLoop, glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
