<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for(int i = 0; i < 3; i++) {
        v += a * noise(p);
        p *= 2.1;
        a *= 0.5;
    }
    return v;
}

float sdEye(vec2 p, float w, float h) {
    p.x = abs(p.x);
    float top = sqrt(max(0.0, h * h - (h * h / (w * w)) * p.x * p.x));
    float bot = -top * 0.6;
    float d = 1e9;
    if(p.y > 0.0) {
        d = p.y - top;
    } else {
        d = -p.y + bot;
    }
    float side = p.x - w;
    return max(side, d);
}

float sdPupil(vec2 p, float openness) {
    float w = 0.02 + 0.12 * openness;
    float h = 0.28;
    p.x /= w;
    p.y /= h;
    return (length(p) - 1.0) * min(w, h);
}

vec3 irisColor(float r, float angle, float depth, float t) {
    float warmth = smoothstep(0.0, 0.4, depth);
    vec3 amber = vec3(0.95, 0.65, 0.1);
    vec3 copper = vec3(0.85, 0.45, 0.15);
    vec3 violet = vec3(0.45, 0.15, 0.7);
    vec3 abyss = vec3(0.05, 0.02, 0.12);

    vec3 col = mix(amber, copper, smoothstep(0.0, 0.3, r));
    col = mix(col, violet, warmth * 0.8);
    col = mix(col, abyss, smoothstep(0.3, 1.0, depth));

    float fibers = sin(angle * 40.0 + r * 60.0 + depth * 20.0) * 0.5 + 0.5;
    fibers *= smoothstep(0.02, 0.15, r);
    col += fibers * 0.15 * mix(amber, violet, warmth);

    float sparkle = pow(noise(vec2(angle * 5.0, r * 30.0 + t * 0.3)), 3.0);
    col += sparkle * 0.3 * mix(vec3(1.0, 0.9, 0.5), vec3(0.7, 0.5, 1.0), warmth);

    return col;
}

vec3 renderEyeLayer(vec2 uv, float scale, float depth, float t, float dilate) {
    vec2 p = uv * scale;

    float eyeW = 0.55;
    float eyeH = 0.28;
    float eyeDist = sdEye(p, eyeW, eyeH);

    if(eyeDist > 0.02) return vec3(-1.0);

    float eyeMask = smoothstep(0.02, -0.01, eyeDist);
    float irisR = length(p);
    float irisSize = 0.32;
    float irisMask = smoothstep(irisSize, irisSize - 0.02, irisR);

    float angle = atan(p.y, p.x);
    vec3 irisCol = irisColor(irisR / irisSize, angle, depth, t);

    float pupilOpen = 0.3 + 0.7 * dilate;
    float pupilDist = sdPupil(p, pupilOpen);
    float pupilMask = smoothstep(0.005, -0.005, pupilDist);

    float limbus = smoothstep(irisSize + 0.01, irisSize - 0.01, irisR);
    vec3 limbusCol = mix(vec3(0.15, 0.08, 0.02), vec3(0.2, 0.1, 0.35), depth);

    vec3 scleraBase = mix(vec3(0.95, 0.93, 0.9), vec3(0.85, 0.82, 0.88), depth * 0.3);
    float veinNoise = fbm(p * 15.0 + depth * 3.0);
    vec3 sclera = scleraBase - vec3(0.05, 0.08, 0.02) * veinNoise;

    float specAngle = atan(p.y - 0.08, p.x - 0.1);
    float specR = length(p - vec2(0.1, 0.08));
    float spec = smoothstep(0.04, 0.01, specR) * 0.8;
    float spec2 = smoothstep(0.025, 0.005, length(p - vec2(-0.06, 0.05))) * 0.4;

    vec3 col = sclera;
    col = mix(col, limbusCol, limbus * (1.0 - irisMask) * 0.5);
    col = mix(col, irisCol, irisMask);
    col = mix(col, vec3(0.01, 0.005, 0.03 + depth * 0.05), pupilMask);
    col += spec + spec2;

    float edgeShadow = smoothstep(-0.01, -0.15, eyeDist);
    col *= 0.7 + 0.3 * edgeShadow;

    return col * eyeMask;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;

    float t = mod(iTime, 75.0);
    float phase = t / 75.0;

    float breathe = sin(t * 0.4) * 0.03;
    uv.y += breathe;

    float dilateWave = sin(phase * 6.28318 * 2.0 - 1.5708) * 0.5 + 0.5;
    float slowPulse = sin(t * 0.2) * 0.15;
    float dilate = clamp(dilateWave + slowPulse, 0.0, 1.0);

    vec3 bg = vec3(0.02, 0.01, 0.04);
    float vigR = length(uv);
    bg += vec3(0.08, 0.04, 0.02) * exp(-vigR * vigR * 3.0);

    vec3 col = bg;

    float recursionDepth = 5.0;
    float innerScale = 1.0;

    for(int i = 4; i >= 0; i--) {
        float fi = float(i);
        float depth = fi / recursionDepth;

        float layerScale = pow(3.2, fi) * 1.2;

        float layerAngle = fi * 0.15 + t * 0.02 * (1.0 + fi * 0.3);
        float cs = cos(layerAngle);
        float sn = sin(layerAngle);
        vec2 rotUv = vec2(uv.x * cs - uv.y * sn, uv.x * sn + uv.y * cs);

        float layerDilate = clamp(dilate - fi * 0.08, 0.0, 1.0);

        vec3 eyeCol = renderEyeLayer(rotUv, layerScale, depth, t, layerDilate);

        if(eyeCol.r >= 0.0) {
            float outerFade = smoothstep(0.4 / layerScale, 0.2 / layerScale, length(rotUv));
            col = mix(col, eyeCol, outerFade);
        }
    }

    float particleVal = 0.0;
    for(int i = 0; i < 40; i++) {
        float fi = float(i);
        float seed = fi * 7.31;
        float px = (hash(vec2(seed, 1.0)) - 0.5) * 1.2;
        float speed = 0.03 + hash(vec2(seed, 2.0)) * 0.06;
        float py = mod(hash(vec2(seed, 3.0)) + t * speed, 2.0) - 1.0;

        px += sin(t * 0.5 + fi * 0.8) * 0.05;

        float size = 0.002 + hash(vec2(seed, 4.0)) * 0.004;
        float bright = 0.3 + hash(vec2(seed, 5.0)) * 0.7;

        float fade = smoothstep(-1.0, -0.5, py) * smoothstep(1.0, 0.5, py);
        float d = length(uv - vec2(px, py));
        float glow = bright * fade * smoothstep(size * 3.0, 0.0, d);

        float warmth = hash(vec2(seed, 6.0));
        vec3 pCol = mix(vec3(1.0, 0.85, 0.4), vec3(0.7, 0.5, 1.0), warmth);
        col += pCol * glow * 0.15;
    }

    float outerIrisFade = smoothstep(0.55, 0.25, vigR);
    vec3 ambientGlow = mix(vec3(0.4, 0.2, 0.05), vec3(0.15, 0.05, 0.25), phase);
    col += ambientGlow * 0.08 * outerIrisFade;

    col *= 1.0 - 0.4 * vigR * vigR;

    col = pow(col, vec3(0.95));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 54;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterVerb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterVerb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterVerb);

  const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 300, Q: 2 }).connect(masterVerb);
  const drone = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 2.0, sustain: 0.8, release: 4.0 },
    filterEnvelope: { attack: 2.0, decay: 1.0, sustain: 0.5, baseFrequency: 60, octaves: 1 }
  }).connect(droneFilter);

  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const roots = ["C1", "G0", "Eb1", "Bb0"];
    const idx = Math.floor(bar / 4) % roots.length;
    drone.triggerAttackRelease(roots[idx], "1m", time, 0.4);
  }, "1m").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(masterVerb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 1.0, sustain: 0.6, release: 2.5 }
  }).connect(padChorus);

  const padChords = [
    ["C3", "Eb3", "G3", "Bb3"],
    ["Ab2", "C3", "Eb3", "G3"],
    ["Bb2", "D3", "F3", "Ab3"],
    ["G2", "Bb2", "D3", "F3"],
    ["C3", "Eb3", "Ab3"],
    ["Bb2", "D3", "G3"],
    ["Ab2", "C3", "F3"],
    ["G2", "B2", "D3"]
  ];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.round(75 / barLen);
    if (bar >= totalBars - 3) {
      pad.triggerAttackRelease(padChords[0], "1m", time, 0.08);
      return;
    }
    const vol = bar < 2 ? 0.1 : bar < 8 ? 0.18 : 0.22;
    const ci = chordIdx % padChords.length;
    pad.triggerAttackRelease(padChords[ci], "1m", time, vol);
    chordIdx++;
  }, "1m").start(0);

  const bellVerb = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).toDestination();
  await bellVerb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 5.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 3.0, sustain: 0.0, release: 2.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0.0, release: 1.0 }
  }).connect(bellVerb);

  const bellNotes = ["C5", "Eb5", "G5", "Bb5", "C6", "G5", "Eb5", "D5", "F5", "Ab5", "C6", "Bb5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.round(75 / barLen);
    if (bar < 2 || bar >= totalBars - 2) return;

    const playChance = bar < 4 ? 0.25 : bar < 10 ? 0.45 : 0.35;
    if (Math.random() > playChance) return;

    const range = bar < 6 ? 6 : bellNotes.length;
    const ni = bellIdx % range;
    const vel = 0.12 + Math.random() * 0.1;
    bell.triggerAttackRelease(bellNotes[ni], "2n", time, vel);
    bellIdx++;
  }, "2n").start(0);

  const glassFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 3 }).connect(masterDelay);
  const glass = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.8, sustain: 0.0, release: 0.5 }
  }).connect(glassFilter);

  const glassScale = [60, 63, 67, 70, 72, 75, 79, 82, 84];
  let glassStep = 0;
  const glassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.round(75 / barLen);
    if (bar < 4 || bar >= totalBars - 3) return;

    if (Math.random() > 0.5) return;

    const progression = bar / 16;
    const rangeIdx = Math.min(Math.floor(3 + progression * 5), glassScale.length - 1);
    const noteIdx = Math.floor(Math.random() * (rangeIdx + 1));
    const note = Tone.Frequency(glassScale[noteIdx], "midi");
    glass.triggerAttackRelease(note, "8n", time, 0.08 + Math.random() * 0.06);
    glassStep++;
  }, "4n").start(0);

  const subBoom = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 0.6, sustain: 0.0, release: 0.3 }
  }).toDestination();

  let boomCount = 0;
  const boomLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.round(75 / barLen);
    if (bar < 6 || bar >= totalBars - 4) return;
    if (boomCount % 3 !== 0) { boomCount++; return; }
    subBoom.triggerAttackRelease("C1", "4n", time, 0.2);
    boomCount++;
  }, "2m").start(0);

  const breathNoise = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  });
  const breathFilter = new Tone.Filter({ type: "bandpass", frequency: 400, Q: 0.8 }).connect(masterVerb);
  breathNoise.connect(breathFilter);

  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 14) {
      breathNoise.triggerAttackRelease("2m", time, 0.06);
    }
  }, "2m").start("2:0:0");

  Tone.Transport.schedule((time) => {
    droneFilter.frequency.linearRampToValueAtTime(600, time + 8 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    droneFilter.frequency.linearRampToValueAtTime(300, time + 4 * barLen);
  }, "14:0:0");

  window.toneJsInstruments = { drone, pad, bell, glass, subBoom, breathNoise };
  window.toneJsParts = { droneLoop, padLoop, bellLoop, glassLoop, boomLoop, breathLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
