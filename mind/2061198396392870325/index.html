<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, -0.6, 0.6, 0.8);
    for(float i = 0.0; i < 4.0; i++) {
        v += a * noise(p);
        p = m * p * 2.01;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float r = length(uv);

    float ws = smoothstep(0.0, 0.4, ph) * 3.2;
    float breath = 1.0 + 0.03 * sin(t * 0.7);
    vec2 p = uv * 4.0 * breath;

    float w1 = fbm(p + vec2(t * 0.04, t * 0.03));
    float w2 = fbm(p + w1 * ws + vec2(1.7, 9.2) + t * 0.02);
    float w3 = fbm(p + w2 * ws + vec2(8.3, 2.8) + t * 0.01);

    float waves = 0.0;
    for(float i = 0.0; i < 8.0; i++) {
        float ang = i * 0.7854 + w3 * 4.5;
        waves += sin(dot(uv * 14.0, vec2(cos(ang), sin(ang))) + w2 * 5.0 + t * 0.1);
    }
    waves = waves / 8.0 * 0.5 + 0.5;

    float pat = mix(w3, waves, 0.3);

    float gR = ph * 2.3 + 0.05;
    float grow = smoothstep(gR, gR - 0.5, r);
    float front = smoothstep(gR - 0.03, gR, r) * smoothstep(gR + 0.12, gR, r);

    float sharp = smoothstep(0.33, 0.67, pat) * grow;

    vec3 col = vec3(0.012, 0.006, 0.032);
    col = mix(col, vec3(0.04, 0.09, 0.3), smoothstep(0.1, 0.35, sharp));
    col = mix(col, vec3(0.07, 0.5, 0.6), smoothstep(0.35, 0.6, sharp) * min(ph * 2.0, 1.0));
    col = mix(col, vec3(0.12, 0.72, 0.3), smoothstep(0.6, 0.85, sharp) * smoothstep(0.3, 0.8, ph));

    float edge = pow(max(1.0 - abs(pat - 0.5) * 2.4, 0.0), 5.0) * grow;
    vec3 edgeCol = mix(vec3(0.05, 0.3, 0.5), vec3(0.08, 0.5, 0.25), ph);
    col += edgeCol * edge * (0.5 + 0.5 * sin(t * 0.4 + r * 3.0));

    vec3 frontCol = mix(vec3(0.25, 0.65, 0.85), vec3(0.15, 0.8, 0.45), ph);
    col += frontCol * front * 0.7 * (0.6 + 0.4 * noise(uv * 25.0));

    float vein = pow(max(1.0 - abs(fbm(uv * 9.0 + t * 0.02) - 0.5) * 3.5, 0.0), 3.0);
    col += vec3(0.0, 0.1, 0.14) * vein * grow * 0.25;

    col += vec3(0.03, 0.1, 0.18) * exp(-r * 5.0) * (0.35 + 0.15 * sin(t * 0.25)) * (1.0 - ph * 0.4);

    col *= 1.0 + smoothstep(0.5, 1.0, ph) * 0.08 * sin(t * 0.8);
    col *= 1.0 - 0.25 * r * r;

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 60;
    Tone.Transport.bpm.value = bpm;

    const rev = new Tone.Reverb({ decay: 5.0, wet: 0.5 }).toDestination();
    await rev.generate();
    const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.4, wet: 0.3 }).connect(rev);

    const droneFlt = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 2 }).connect(rev);
    const drone = new Tone.MonoSynth({
        oscillator: { type: "sawtooth" },
        envelope: { attack: 3.0, decay: 2.0, sustain: 0.7, release: 3.0 },
        filterEnvelope: { attack: 4.0, decay: 3.0, sustain: 0.2, baseFrequency: 50, octaves: 2 }
    }).connect(droneFlt);

    const droneLoop = new Tone.Loop((time) => {
        drone.triggerAttackRelease("D1", "2m", time, 0.5);
    }, "2m").start(0);

    Tone.Transport.schedule((time) => {
        droneFlt.frequency.linearRampToValueAtTime(500, time + 30);
    }, "2:0:0");
    Tone.Transport.schedule((time) => {
        droneFlt.frequency.linearRampToValueAtTime(180, time + 12);
    }, "12:0:0");

    const bell = new Tone.FMSynth({
        harmonicity: 3.0, modulationIndex: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 2.0, sustain: 0.0, release: 0.5 },
        modulation: { type: "triangle" }
    }).connect(dly);

    const bellNotes = [74, 77, 81, 69, 72, 76, 79, 84, 86, 81, 74, 69];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const sec = Tone.Transport.getSecondsAtTime(time);
        const progress = sec / 60.0;
        if (progress > 0.15 && progress < 0.85 && Math.random() < 0.3 + progress * 0.3) {
            const note = Tone.Frequency(bellNotes[bellIdx % bellNotes.length], "midi");
            bell.triggerAttackRelease(note, "2n", time, 0.08 + progress * 0.1);
            bellIdx++;
        }
    }, "4n").start(0);

    const padCh = new Tone.Chorus({ frequency: 0.2, delayTime: 5, depth: 0.7, wet: 0.5 }).connect(rev);
    padCh.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.4, release: 3.0 }
    }).connect(padCh);

    const chords = [
        ["D3", "F3", "A3"], ["A2", "C3", "E3"],
        ["Bb2", "D3", "F3"], ["G2", "Bb2", "D3"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const sec = Tone.Transport.getSecondsAtTime(time);
        if (sec > 20 && sec < 50) {
            pad.triggerAttackRelease(chords[chordIdx % chords.length], "2m", time, 0.1);
            chordIdx++;
        }
    }, "2m").start(0);

    const crystal = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.8, sustain: 0.0, release: 0.4 }
    }).connect(dly);

    const crystalNotes = [86, 89, 93, 91, 88, 84];
    let crIdx = 0;
    const crystalLoop = new Tone.Loop((time) => {
        const sec = Tone.Transport.getSecondsAtTime(time);
        if (sec > 28 && sec < 48 && Math.random() > 0.55) {
            const note = Tone.Frequency(crystalNotes[crIdx % crystalNotes.length], "midi");
            crystal.triggerAttackRelease(note, "8n", time, 0.06 + Math.random() * 0.05);
            crIdx++;
        }
    }, "4n.").start(0);

    window.toneJsInstruments = { drone, bell, pad, crystal };
    window.toneJsParts = { droneLoop, bellLoop, padLoop, crystalLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
