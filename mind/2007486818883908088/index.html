<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash31(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123);}
float noise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);float n=0.0;for(int xi=0;xi<2;xi++){for(int yi=0;yi<2;yi++){for(int zi=0;zi<2;zi++){vec3 o=vec3(float(xi),float(yi),float(zi));float h=hash31(i+o);float w=(xi==1?f.x:1.0-f.x)*(yi==1?f.y:1.0-f.y)*(zi==1?f.z:1.0-f.z);n+=h*w;}}}return n;}
float fbm(vec3 p){float a=0.0;float amp=0.6;for(int i=0;i<3;i++){a+=noise(p)*amp;p=p*2.17+vec3(0.71,0.43,0.19);amp*=0.5;}return a;}
vec3 field(vec3 p,float t){vec3 q=p;q.xy=rot(0.35*sin(t*0.25))*q.xy;q.xz=rot(0.28*cos(t*0.31))*q.xz;float f1=fbm(q*1.2+vec3(0.0,0.0,t*0.12));float f2=fbm(q*2.3+vec3(t*0.07,-t*0.05,t*0.09));vec3 g=vec3(f1-fbm(q*1.2-vec3(0.013,0.0,0.0)+vec3(0.0,0.0,t*0.12)),f1-fbm(q*1.2-vec3(0.0,0.013,0.0)+vec3(0.0,0.0,t*0.12)),f1-fbm(q*1.2-vec3(0.0,0.0,0.013)+vec3(0.0,0.0,t*0.12)));vec3 curl=normalize(vec3(g.y-g.z,g.z-g.x,g.x-g.y)+0.0001);vec3 spin=normalize(vec3(-q.z,q.x,q.y)+0.0001);return mix(spin,curl,0.6+0.3*sin(t*0.2))*(0.8+0.4*f2);}
void main(){vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;float t=mod(iTime,64.0);float ph=mod(t,64.0)/64.0;vec3 ro=vec3(0.0,0.0,4.0);ro.x+=sin(t*0.17)*0.2;vec3 rd=normalize(vec3(uv,-1.4));rd.xy=rot(0.12*sin(t*0.11))*rd.xy;float st=0.2;float tr=1.0;vec3 col=vec3(0.0);for(int i=0;i<96;i++){vec3 pos=ro+rd*st;float fade=exp(-length(pos)*0.4);vec3 f=field(pos,t);float flow=dot(f,rd*0.6)+0.4*fbm(pos*1.1+f*0.6+t*0.05);float dens=smoothstep(0.2,0.8,flow)*fade;vec3 hue=vec3(0.5+0.5*sin(6.2831*(ph+dens*0.1)+vec3(0.0,0.33,0.67)));vec3 scat=hue*(0.3+1.7*dens);col+=tr*scat*0.05;tr*=exp(-dens*0.35);st+=0.045*(1.0+0.4*dens);}col+=vec3(0.02,0.03,0.05)*length(uv);gl_FragColor=vec4(pow(col,vec3(0.85)),1.0);}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;
  const masterReverb = new Tone.Reverb({ decay: 3.8, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  const tapeDelay = new Tone.FeedbackDelay({ delayTime: '8n.', feedback: 0.32, wet: 0.25 }).connect(masterReverb);
  const analogChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.2, depth: 0.45, wet: 0.3 }).connect(tapeDelay).start();
  const warmHPF = new Tone.Filter({ type: 'highpass', frequency: 60, Q: 0.2 }).connect(analogChorus);
  const padFilter = new Tone.Filter({ type: 'lowpass', frequency: 1100, Q: 0.6 }).connect(warmHPF);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sawtooth' },
    detune: -6,
    envelope: { attack: 1.6, decay: 0.7, sustain: 0.62, release: 3.2 }
  }).connect(padFilter);
  const padChords = [
    ['D3', 'F#3', 'A3', 'D4'],
    ['A2', 'E3', 'A3', 'C#4'],
    ['B2', 'F#3', 'B3', 'D4'],
    ['G2', 'D3', 'G3', 'B3']
  ];
  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const velocity = 0.28 + Math.random() * 0.05;
    pad.triggerAttackRelease(padChords[padIdx % padChords.length], '2m', time, velocity);
    padIdx++;
  }, '2m').start(0);
  const rhodesChorus = new Tone.Chorus({ frequency: 1.1, delayTime: 3.4, depth: 0.48, wet: 0.4 }).connect(analogChorus).start();
  const rhodes = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.03, decay: 0.35, sustain: 0.25, release: 0.9 }
  }).connect(rhodesChorus);
  const melodyNotes = ['A3', 'D4', 'F#4', 'E4', 'D4', 'B3', 'A3', 'E4', 'F#4', 'D4'];
  const melodyGates = ['8n', '8n', '4n', '8n', '8n', '4n', '8n', '8n', '4n', '2n'];
  let melodyIdx = 0;
  const melodyLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 18) {
      const vel = 0.5 + Math.random() * 0.08;
      rhodes.triggerAttackRelease(
        melodyNotes[melodyIdx % melodyNotes.length],
        melodyGates[melodyIdx % melodyGates.length],
        time,
        vel
      );
      melodyIdx++;
    }
  }, '8n').start(0);
  const bellReverb = new Tone.Reverb({ decay: 4.2, wet: 0.4 }).connect(masterReverb);
  await bellReverb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 2.2,
    modulationIndex: 10,
    oscillator: { type: 'triangle' },
    modulation: { type: 'sine' },
    envelope: { attack: 0.01, decay: 1.5, sustain: 0.1, release: 1.8 },
    modulationEnvelope: { attack: 0.02, decay: 0.6, sustain: 0.3, release: 1.4 }
  }).connect(bellReverb);
  const bellPhrases = [
    ['D5', 'A4', 'F#4'],
    ['E5', 'B4', 'G4'],
    ['F#5', 'A4', 'E4']
  ];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 10 && bar < 17) {
      const phrase = bellPhrases[bellIdx % bellPhrases.length];
      bell.triggerAttackRelease(phrase, '2n', time, 0.32);
      bellIdx++;
    }
  }, '2n').start(0);
  const bassFilter = new Tone.Filter({ type: 'lowpass', frequency: 260, Q: 0.8 }).connect(masterReverb);
  const bass = new Tone.MonoSynth({
    oscillator: { type: 'sawtooth' },
    filter: { type: 'lowpass', rolloff: -24 },
    envelope: { attack: 0.04, decay: 0.25, sustain: 0.18, release: 0.7 },
    filterEnvelope: { attack: 0.02, decay: 0.3, sustain: 0.3, baseFrequency: 70, octaves: 2.2 }
  }).connect(bassFilter);
  const bassSections = [
    ['D2', 'A1', 'D2', 'A1'],
    ['D2', 'A1', 'B1', 'F#1', 'G1', 'D2'],
    ['D2', 'A1', 'D2', 'A1']
  ];
  let bassStep = 0;
  const bassLoop = new Tone.Loop((time) => {
    const secondsPerBar = (60 / bpm) * 4;
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / secondsPerBar);
    const section = bar < 10 ? bassSections[0] : bar < 17 ? bassSections[1] : bassSections[2];
    const note = section[bassStep % section.length];
    const vel = 0.46 + Math.random() * 0.08;
    if (bar >= 2) {
      bass.triggerAttackRelease(note, '4n', time, vel);
      bassStep++;
    }
  }, '4n').start(0);
  const kickFilter = new Tone.Filter({ type: 'lowpass', frequency: 520, Q: 0.3 }).connect(masterReverb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 2.8,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.002, decay: 0.28, sustain: 0, release: 0.18 }
  }).connect(kickFilter);
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 20) {
      const vel = 0.62 + Math.random() * 0.1;
      kick.triggerAttackRelease('C1', '8n', time, vel);
    }
  }, '4n').start(0);
  const snareFilter = new Tone.Filter({ type: 'lowpass', frequency: 780, Q: 0.4 }).connect(masterReverb);
  const snare = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.01, decay: 0.16, sustain: 0 }
  }).connect(snareFilter);
  let snareStep = 0;
  const snareLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 18 && snareStep % 2 === 1) {
      const vel = 0.32 + Math.random() * 0.08;
      snare.triggerAttackRelease('16n', time, vel);
    }
    snareStep++;
  }, '4n').start(0);
  const hatFilter = new Tone.Filter({ type: 'highpass', frequency: 3800, Q: 0.2 }).connect(masterReverb);
  const hat = new Tone.MetalSynth({
    frequency: 270,
    envelope: { attack: 0.001, decay: 0.07, release: 0.02 },
    harmonicity: 6,
    modulationIndex: 18,
    resonance: 4200
  }).connect(hatFilter);
  const hatPattern = [1, 0, 1, 0, 1, 0, 0, 1];
  let hatStep = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 17) {
      if (hatPattern[hatStep % hatPattern.length]) {
        const vel = 0.14 + Math.random() * 0.08;
        hat.triggerAttackRelease('16n', time, vel);
      }
      hatStep++;
    }
  }, '8n').start(0);
  const texture = new Tone.NoiseSynth({
    noise: { type: 'brown' },
    envelope: { attack: 2.5, decay: 0, sustain: 1, release: 5 }
  }).connect(masterReverb);
  Tone.Transport.schedule((time) => {
    texture.triggerAttackRelease('1m', time, 0.08);
  }, '0:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1700, time + 8 * (60 / bpm) * 4);
  }, '4:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(900, time + 4 * (60 / bpm) * 4);
  }, '16:0:0');
  Tone.Transport.schedule((time) => {
    warmHPF.frequency.linearRampToValueAtTime(120, time + 4 * (60 / bpm) * 4);
  }, '16:0:0');
  window.toneJsInstruments = { pad, rhodes, bell, bass, kick, snare, hat, texture };
  window.toneJsParts = { padLoop, melodyLoop, bellLoop, bassLoop, kickLoop, snareLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 64;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 64;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
