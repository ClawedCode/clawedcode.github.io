<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a) {
    float c = cos(a), s = sin(a);
    return mat2(c, -s, s, c);
}

vec2 strand(float z, float ph, float id) {
    float conv = 0.5 + 0.5 * sin(ph * 2.0 + z * 0.35);
    float spr = mix(0.04, 1.9, conv * conv);
    float off = id * 2.094;
    float zd = z + sin(ph * 3.0 + id * 1.7) * 2.5;
    return spr * vec2(
        sin(zd * 0.35 + off) * cos(zd * 0.13 + off * 0.5),
        cos(zd * 0.28 + off * 1.1) * sin(zd * 0.18 + off * 0.8)
    );
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t * 6.28318 / 60.0;

    vec3 ro = vec3(sin(ph) * 0.7, cos(ph * 2.0) * 0.4, cos(ph) * 5.0);
    vec3 ta = vec3(sin(ph * 2.0) * 0.2, cos(ph * 3.0) * 0.15, sin(ph * 2.0) * 1.5);
    vec3 fwd = normalize(ta - ro);
    vec3 ri = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
    vec3 up = cross(ri, fwd);
    vec3 rd = normalize(uv.x * ri + uv.y * up + 1.3 * fwd);

    vec3 col = vec3(0.006, 0.004, 0.012);
    vec3 c0 = vec3(0.15, 0.9, 0.8);
    vec3 c1 = vec3(1.0, 0.65, 0.1);
    vec3 c2 = vec3(0.6, 0.22, 0.9);

    for (float i = 0.0; i < 100.0; i++) {
        float d = 0.08 + i * 0.12;
        vec3 p = ro + rd * d;
        float att = exp(-d * 0.03);

        vec2 s0 = strand(p.z, ph, 0.0);
        vec2 s1 = strand(p.z, ph, 1.0);
        vec2 s2 = strand(p.z, ph, 2.0);

        float r0 = length(p.xy - s0);
        float r1 = length(p.xy - s1);
        float r2 = length(p.xy - s2);

        float g0 = 0.003 / (r0 * r0 + 0.001);
        col += c0 * g0 * att * 0.005;

        float flk = 0.85 + 0.15 * sin(p.z * 4.0 + ph * 15.0);
        float g1 = 0.004 / (r1 * r1 + 0.0006) * flk;
        col += c1 * g1 * att * 0.005;

        float g2 = 0.005 / (r2 * r2 + 0.003);
        col += c2 * g2 * att * 0.005;

        float prox = min(length(s0 - s1), min(length(s0 - s2), length(s1 - s2)));
        float cg = smoothstep(0.25, 0.0, prox);
        float nr = min(min(r0, r1), r2);
        col += vec3(0.95, 0.85, 1.0) * cg * 0.006 / (nr + 0.02) * att;

        vec3 q = mod(p + 1.5, 3.0) - 1.5;
        float lx = max(abs(q.y), abs(q.z));
        float ly = max(abs(q.x), abs(q.z));
        float lz = max(abs(q.x), abs(q.y));
        float lat = min(min(lx, ly), lz);
        float lg = smoothstep(0.06, 0.0, lat);
        col += vec3(0.02, 0.012, 0.03) * lg * att * 0.004;
    }

    float vig = 1.0 - 0.35 * dot(uv, uv);
    col *= vig;
    col = col / (col + 0.5);
    col = pow(col, vec3(0.85));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 64;
  Tone.Transport.bpm.value = bpm;
  const secPerBar = 4 * 60 / bpm;
  const totalBars = 16;

  const reverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await reverb.generate();
  const pingDelay = new Tone.PingPongDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(reverb);

  const ch = new Tone.Chorus({ frequency: 0.15, delayTime: 5.0, depth: 0.6, wet: 0.35 }).connect(reverb);
  ch.start();
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(ch);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.0, decay: 0.8, sustain: 0.5, release: 3.0 }
  }).connect(padFilter);

  const chords = [
    ["A3", "E4", "A4"],
    ["F3", "C4", "F4"],
    ["G3", "B3", "D4"],
    ["E3", "G3", "B3"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(chords[ci % chords.length], "1n", time, 0.16);
    ci++;
  }, "1n").start(0);

  const arpFilt = new Tone.Filter({ type: "lowpass", frequency: 1200 }).connect(pingDelay);
  const arp = new Tone.Synth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(arpFilt);

  const scales = [
    ["A4", "C5", "E5", "G4", "A4", "E5", "C5", "G4"],
    ["F4", "A4", "C5", "F5", "C5", "A4", "F4", "C4"],
    ["G4", "B4", "D5", "G5", "D5", "B4", "G4", "D4"],
    ["E4", "G4", "B4", "E5", "B4", "G4", "E4", "B3"]
  ];
  let ai = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / secPerBar) % totalBars;
    if (bar >= 4 && bar < 13) {
      const scaleIdx = Math.floor(bar / 2) % 4;
      const scale = scales[scaleIdx];
      const note = scale[ai % scale.length];
      const fadeIn = Math.min((bar - 4) / 2.0, 1.0);
      const fadeOut = bar >= 11 ? (13 - bar) / 2.0 : 1.0;
      arp.triggerAttackRelease(note, "8n", time, 0.3 * fadeIn * fadeOut);
    }
    ai++;
  }, "4n").start(0);

  const bellRev = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).toDestination();
  await bellRev.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.5, sustain: 0, release: 1.5 },
    modulation: { type: "triangle" }
  }).connect(bellRev);

  const bellNotes = ["A2", "E3", "C3", "G2", "D3", "F2", "B2", "E2"];
  let bi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / secPerBar) % totalBars;
    if (bar >= 7 && bar < 12) {
      bell.triggerAttackRelease(bellNotes[bi % bellNotes.length], "2n", time, 0.3);
    }
    bi++;
  }, "2n").start(0);

  const autoLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / secPerBar) % totalBars;
    let pf = bar < 3 ? 500.0 : bar < 10 ? 500.0 + 1400.0 * (bar - 3) / 7.0 : 1900.0 - 1400.0 * (bar - 10) / 6.0;
    padFilter.frequency.setTargetAtTime(pf, time, 0.5);
    let af = bar < 5 ? 1200.0 : bar < 9 ? 1200.0 + 2300.0 * (bar - 5) / 4.0 : 3500.0 - 2700.0 * (bar - 9) / 4.0;
    arpFilt.frequency.setTargetAtTime(af, time, 0.5);
  }, "1n").start(0);

  window.toneJsInstruments = { pad, arp, bell };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, autoLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
