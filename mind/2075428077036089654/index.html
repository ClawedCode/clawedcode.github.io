<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

vec3 stream(float t, float phase, float twist){
  float a = t * 6.28318 + phase;
  float r = 1.6 + 0.3 * sin(a * 2.0 + twist);
  return vec3(
    cos(a) * r,
    sin(a * 2.0 + twist) * 0.8,
    sin(a) * r
  );
}

float breath(float t){
  float p = mod(t, 30.0) / 30.0;
  float inhale = smoothstep(0.0, 0.55, p);
  float exhale = 1.0 - smoothstep(0.55, 0.72, p);
  return inhale * exhale;
}

float pulseFlash(float t){
  float p = mod(t, 30.0) / 30.0;
  return smoothstep(0.50, 0.58, p) * (1.0 - smoothstep(0.58, 0.68, p));
}

float lattice(vec3 p){
  vec3 q = abs(fract(p * 0.6) - 0.5);
  float d = min(min(q.x, q.y), q.z);
  return smoothstep(0.48, 0.50, 1.0 - d);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float T = iTime;
  float br = breath(T);
  float fl = pulseFlash(T);

  vec3 ro = vec3(0.0, 0.0, 4.0);
  vec3 rd = normalize(vec3(uv, -1.4));

  float camRot = T * 0.15;
  rd.xz = rot(camRot) * rd.xz;
  ro.xz = rot(camRot) * ro.xz;

  vec3 col = vec3(0.005, 0.008, 0.018);

  for(float i = 0.0; i < 24.0; i++){
    float depth = i / 24.0;
    vec3 sp = ro + rd * (1.0 + depth * 5.0);
    float lat = lattice(sp);
    col += vec3(0.04, 0.05, 0.09) * lat * (1.0 - depth) * 0.04;
  }

  float convergence = br;
  float disperse = 1.0 - br;

  for(float i = 0.0; i < 96.0; i++){
    float fi = i / 96.0;
    float trail = fi;

    float tt = T * 0.12 - trail * 0.08;

    vec3 pA = stream(tt, 0.0, 0.7);
    vec3 pB = stream(tt, 2.094, 1.3);
    vec3 pC = stream(tt, 4.188, 2.1);

    vec3 center = (pA + pB + pC) / 3.0;

    pA = mix(pA, center, convergence * 0.92);
    pB = mix(pB, center, convergence * 0.92);
    pC = mix(pC, center, convergence * 0.92);

    pA += (stream(tt + 0.3, 0.0, 0.7) - pA) * disperse * 0.15 * fi;
    pB += (stream(tt + 0.3, 2.094, 1.3) - pB) * disperse * 0.15 * fi;
    pC += (stream(tt + 0.3, 4.188, 2.1) - pC) * disperse * 0.15 * fi;

    pA.xz = rot(camRot) * pA.xz;
    pB.xz = rot(camRot) * pB.xz;
    pC.xz = rot(camRot) * pC.xz;

    vec3 vA = pA - ro;
    vec3 vB = pB - ro;
    vec3 vC = pC - ro;

    vec2 sA = vA.xy / -vA.z * 1.4;
    vec2 sB = vB.xy / -vB.z * 1.4;
    vec2 sC = vC.xy / -vC.z * 1.4;

    float fade = 1.0 - trail;
    float glow = 0.0008 / (1.0 + 80.0 * trail);

    float dA = length(uv - sA);
    float dB = length(uv - sB);
    float dC = length(uv - sC);

    vec3 amber = vec3(1.0, 0.62, 0.18) * (1.0 + 0.15 * sin(T * 0.5 + trail * 3.0));
    vec3 crimson = vec3(1.0, 0.18, 0.22) * (1.0 + 0.2 * sin(T * 0.7 + trail * 2.0 + 1.5));
    vec3 cyan = vec3(0.25, 0.85, 1.0) * (1.0 + 0.15 * cos(T * 0.6 + trail * 2.5));

    col += amber   * glow * fade / (dA * dA + 0.0008);
    col += crimson * glow * fade / (dB * dB + 0.0008);
    col += cyan    * glow * fade / (dC * dC + 0.0008);
  }

  if(fl > 0.01){
    vec3 cen = vec3(0.0, 0.0, 0.0) - ro;
    vec2 sCen = cen.xy / -cen.z * 1.4;
    float dCen = length(uv - sCen);
    vec3 white = vec3(1.0, 0.95, 0.9);
    col += white * fl * 0.04 / (dCen * dCen + 0.001);
    col += white * fl * 0.3 * exp(-dCen * 3.0);
  }

  float vig = 1.0 - 0.4 * dot(uv, uv);
  col *= vig;

  col = pow(col, vec3(0.85));
  col = col / (1.0 + col);

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 62;
  Tone.Transport.bpm.value = bpm;

  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 6.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.02, release: 0.3 }).connect(masterReverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterComp);
  const padChorus = new Tone.Chorus({ frequency: 0.18, delayTime: 4.5, depth: 0.6, wet: 0.5 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 4.0 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.55, wet: 0.45 }).connect(masterComp);
  const amberBell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 1.8, sustain: 0.0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.02, decay: 0.6, sustain: 0.0, release: 0.5 }
  }).connect(bellDelay);
  amberBell.volume.value = -10;

  const crimsonShift = new Tone.PitchShift({ pitch: 0, wet: 0.3 }).connect(masterComp);
  const crimsonDelay = new Tone.FeedbackDelay({ delayTime: "8n", feedback: 0.4, wet: 0.35 }).connect(crimsonShift);
  const crimsonBell = new Tone.FMSynth({
    harmonicity: 3.7,
    modulationIndex: 14,
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 1.2, sustain: 0.0, release: 1.0 },
    modulation: { type: "square" },
    modulationEnvelope: { attack: 0.01, decay: 0.4, sustain: 0.0, release: 0.4 }
  }).connect(crimsonDelay);
  crimsonBell.volume.value = -12;

  const cyanFilter = new Tone.Filter({ type: "highpass", frequency: 800, Q: 1.2 }).connect(masterComp);
  const cyanDelay = new Tone.FeedbackDelay({ delayTime: "16n", feedback: 0.6, wet: 0.55 }).connect(cyanFilter);
  const cyanBell = new Tone.FMSynth({
    harmonicity: 5.1,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.9, sustain: 0.0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(cyanDelay);
  cyanBell.volume.value = -13;

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 0.5, sustain: 0.8, release: 3.0 },
    filter: { type: "lowpass", frequency: 200 }
  }).connect(masterComp);
  subBass.volume.value = -8;

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterReverb);
  const breathNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 4.0, decay: 1.5, sustain: 0.0, release: 2.0 }
  }).connect(noiseHPF);
  breathNoise.volume.value = -22;

  const flashSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0.0, release: 2.0 }
  }).connect(masterComp);
  flashSynth.volume.value = -10;

  const padChords = [
    ["A2", "E3", "A3", "C4", "E4"],
    ["F2", "C3", "F3", "A3", "C4"],
    ["G2", "D3", "G3", "Bb3", "D4"],
    ["A2", "E3", "A3", "C4", "E4"]
  ];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time + H(15), 0.5);
    chordIdx++;
  }, "1n").start(0);

  const subNotes = ["A1", "F1", "G1", "A1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time + H(8), 0.7);
    subIdx++;
  }, "1n").start(0);

  const amberNotes = ["A3", "C4", "E4", "A4", "C5"];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const phase = (sec % 30) / 30;
    const density = phase < 0.55 ? 0.7 : (phase < 0.72 ? 0.95 : 0.4);
    if (Math.random() < density) {
      amberBell.triggerAttackRelease(amberNotes[amberIdx % amberNotes.length], "8n", time + H(10), 0.6);
    }
    amberIdx++;
  }, "2n").start(0);

  const crimsonNotes = ["E4", "G4", "Bb4", "C5", "E5"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const phase = (sec % 30) / 30;
    const density = phase < 0.55 ? 0.55 : (phase < 0.72 ? 0.9 : 0.3);
    if (Math.random() < density) {
      crimsonBell.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "8n", time + H(8), 0.55);
    }
    crimsonIdx++;
  }, "2n.").start(0);

  const cyanNotes = ["A5", "C6", "E6", "A6", "G5", "E5"];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const phase = (sec % 30) / 30;
    const density = phase < 0.55 ? 0.65 : (phase < 0.72 ? 0.85 : 0.35);
    if (Math.random() < density) {
      cyanBell.triggerAttackRelease(cyanNotes[cyanIdx % cyanNotes.length], "16n", time + H(6), 0.5);
    }
    cyanIdx++;
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    breathNoise.triggerAttackRelease(7.5, time);
  }, 0);

  Tone.Transport.schedule((time) => {
    breathNoise.triggerAttackRelease(7.5, time);
  }, 15);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.cancelScheduledValues(time);
    padFilter.frequency.setValueAtTime(600, time);
    padFilter.frequency.linearRampToValueAtTime(2200, time + 16.5);
    padFilter.frequency.exponentialRampToValueAtTime(600, time + 21.0);
  }, 0);

  Tone.Transport.schedule((time) => {
    flashSynth.triggerAttackRelease(["A4", "E5", "A5", "C6", "E6"], "2n", time, 0.6);
    cyanFilter.frequency.cancelScheduledValues(time);
    cyanFilter.frequency.setValueAtTime(400, time);
    cyanFilter.frequency.exponentialRampToValueAtTime(4000, time + 0.3);
    cyanFilter.frequency.exponentialRampToValueAtTime(800, time + 2.0);
  }, 16.5);

  window.toneJsInstruments = { pad, amberBell, crimsonBell, cyanBell, subBass, breathNoise, flashSynth };
  window.toneJsParts = { padLoop, subLoop, amberLoop, crimsonLoop, cyanLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 30;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 30;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
