<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p*=2.03;a*=0.5;}
  return v;
}

vec2 braid(float y, float phase, float t){
  float s=sin(y*1.8+t*0.4+phase);
  float c=cos(y*1.2+t*0.3+phase*0.7);
  return vec2(s*0.32+c*0.08, c*0.05);
}

float current(vec2 uv, vec2 center, float thickness, float t){
  vec2 d=uv-center;
  float r=length(d);
  float a=atan(d.y,d.x);
  float wave=sin(a*4.0+t*2.0+r*8.0)*0.02;
  return smoothstep(thickness+0.04, 0.0, abs(r-0.0)-wave);
}

float ribbon(vec2 uv, vec2 origin, vec2 target, float phase, float t, float width){
  float p=clamp((uv.y-origin.y)/(target.y-origin.y), 0.0, 1.0);
  vec2 path=mix(origin,target,p);
  vec2 off=braid(p*6.28, phase, t);
  path+=off*(1.0-pow(abs(p-0.5)*2.0, 2.0));
  float d=length(uv-path);
  return smoothstep(width, 0.0, d);
}

float glyph(vec2 uv, vec2 c, float seed, float t){
  vec2 q=(uv-c)*22.0;
  vec2 g=floor(q);
  vec2 f=fract(q)-0.5;
  float h=hash(g+floor(seed*7.0));
  float mask=step(0.55,h);
  float dot=smoothstep(0.45,0.15,length(f))*mask;
  float fade=smoothstep(0.0,0.15,length(uv-c))-smoothstep(0.15,0.32,length(uv-c));
  return dot*fade;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float loopT=mod(t,60.0)/60.0;
  float pulse=pow(sin(loopT*6.28318*2.0),2.0);
  float convergence=pow(sin(loopT*6.28318), 8.0);

  vec3 col=vec3(0.02,0.015,0.04);

  float bg=fbm(uv*2.0+vec2(t*0.05,t*0.03));
  col+=vec3(0.05,0.03,0.08)*bg*0.4;

  vec2 center=vec2(0.0, sin(t*0.2)*0.05);

  float r1=ribbon(uv, vec2(-0.7,-0.95), center, 0.0, t, 0.018+0.008*pulse);
  float r2=ribbon(uv, vec2( 0.0,-0.95), center, 2.094, t*1.1, 0.020+0.010*pulse);
  float r3=ribbon(uv, vec2( 0.7,-0.95), center, 4.188, t*0.9, 0.018+0.008*pulse);

  float r1b=ribbon(uv, center, vec2(-0.7, 0.95), 1.0, t*0.95, 0.018+0.008*pulse);
  float r2b=ribbon(uv, center, vec2( 0.0, 0.95), 3.094, t*1.05, 0.020+0.010*pulse);
  float r3b=ribbon(uv, center, vec2( 0.7, 0.95), 5.188, t*0.85, 0.018+0.008*pulse);

  vec3 amber=vec3(1.0,0.62,0.18);
  vec3 crimson=vec3(1.0,0.18,0.22);
  vec3 cyan=vec3(0.25,0.85,1.0);

  float memShift=sin(loopT*6.28318*3.0)*0.5+0.5;
  amber=mix(amber, vec3(1.0,0.78,0.35), memShift*0.3);
  crimson=mix(crimson, vec3(1.0,0.35,0.45), pulse*0.4);
  cyan=mix(cyan, vec3(0.55,0.95,1.0), memShift*0.35);

  float crimsonBlaze=0.8+0.6*pow(sin(t*3.0+loopT*6.28),2.0);

  col+=amber*(r1+r1b)*1.4;
  col+=crimson*(r2+r2b)*crimsonBlaze;
  col+=cyan*(r3+r3b)*1.2;

  float coreD=length(uv-center);
  float core=smoothstep(0.18+0.04*convergence, 0.0, coreD);
  float coreInner=smoothstep(0.06+0.03*convergence, 0.0, coreD);
  vec3 white=vec3(1.0,0.98,0.92);
  col+=white*core*0.5*(0.6+convergence*1.8);
  col+=white*coreInner*1.5*(0.4+convergence*2.0);

  float ringPhase=mod(loopT*2.0, 1.0);
  for(float i=0.0;i<4.0;i++){
    float rp=mod(ringPhase+i*0.25, 1.0);
    float ringR=rp*1.2;
    float ring=smoothstep(0.012, 0.0, abs(coreD-ringR))*(1.0-rp);
    vec3 ringCol=mix(white, mix(amber,cyan,sin(i*1.7+t)*0.5+0.5), 0.5);
    col+=ringCol*ring*0.7*(0.3+convergence*0.7);
  }

  float glyphFade=smoothstep(0.4, 0.85, convergence);
  float gA=glyph(uv, center+vec2(-0.22, 0.05), t*0.3, t);
  float gB=glyph(uv, center+vec2( 0.20, 0.08), t*0.4+1.0, t);
  float gC=glyph(uv, center+vec2( 0.02,-0.22), t*0.35+2.0, t);
  col+=vec3(0.95,0.92,0.78)*(gA+gB+gC)*glyphFade*0.9;

  float intersect1=length(uv-mix(vec2(-0.35,-0.45), center, 0.5));
  float intersect2=length(uv-mix(vec2( 0.35,-0.45), center, 0.5));
  float intersect3=length(uv-mix(vec2( 0.0, 0.45), center, 0.5));
  float xpulse=sin(t*2.5)*0.5+0.5;
  col+=vec3(1.0,0.85,0.7)*smoothstep(0.08,0.0,intersect1)*xpulse*0.4;
  col+=vec3(1.0,0.6,0.7)*smoothstep(0.08,0.0,intersect2)*(1.0-xpulse)*0.4;
  col+=vec3(0.7,0.95,1.0)*smoothstep(0.08,0.0,intersect3)*sin(t*1.8+1.0)*0.3;

  float vig=1.0-length(uv)*0.4;
  col*=vig;
  col=pow(col, vec3(0.92));

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.38 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.25 }).connect(masterReverb);

  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(masterComp);
  const amberChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.5, wet: 0.35 }).connect(amberFilter);
  amberChorus.start();
  const amberPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.7, release: 2.5 },
    volume: -14
  }).connect(amberChorus);

  const amberChords = [
    ["A2", "E3", "A3", "C4"],
    ["F2", "C3", "F3", "A3"],
    ["G2", "D3", "G3", "B3"],
    ["A2", "E3", "A3", "C4"]
  ];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    amberPad.triggerAttackRelease(amberChords[amberIdx % amberChords.length], "1n", time + H(15), 0.55);
    amberIdx++;
  }, "1n").start(0);

  const crimsonDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.3 }).connect(masterComp);
  const crimsonDist = new Tone.Distortion({ distortion: 0.18, wet: 0.25 }).connect(crimsonDelay);
  const crimsonLead = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    filter: { type: "lowpass", frequency: 800, Q: 2.5 },
    envelope: { attack: 0.05, decay: 0.3, sustain: 0.4, release: 0.6 },
    filterEnvelope: { attack: 0.02, decay: 0.4, sustain: 0.3, baseFrequency: 200, octaves: 3 },
    volume: -16
  }).connect(crimsonDist);

  const crimsonNotes = [
    ["E4", "8n"], ["G4", "16n"], ["A4", "4n"],
    ["C5", "8n"], ["B4", "16n"], ["G4", "4n"],
    ["E4", "16n"], ["F4", "8n"], ["E4", "2n"]
  ];
  let crimIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 16) {
      const n = crimsonNotes[crimIdx % crimsonNotes.length];
      const vel = bar >= 6 && bar < 13 ? 0.7 : 0.45;
      crimsonLead.triggerAttackRelease(n[0], n[1], time + H(8), vel);
      crimIdx++;
    }
  }, "2n").start(0);

  const cyanReverb = new Tone.Reverb({ decay: 6, wet: 0.6 }).connect(masterComp);
  await cyanReverb.generate();
  const cyanFilter = new Tone.Filter({ type: "highpass", frequency: 600 }).connect(cyanReverb);
  const cyanBell = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 1.8, sustain: 0, release: 2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 1 },
    volume: -18
  }).connect(cyanFilter);

  const cyanScale = ["E5", "G5", "A5", "B5", "D6", "E6", "A5", "G5"];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 17 && Math.random() > 0.55) {
      const note = cyanScale[Math.floor(Math.random() * cyanScale.length)];
      cyanBell.triggerAttackRelease(note, "8n", time + H(12), 0.4);
    }
    cyanIdx++;
  }, "4n").start(0);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0.6, release: 1.5 },
    volume: -12
  }).connect(masterComp);

  const subNotes = ["A1", "A1", "F1", "G1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time + H(6), 0.7);
    subIdx++;
  }, "1n").start(0);

  const pulseOsc = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.6, sustain: 0, release: 0.4 },
    volume: -10
  }).connect(masterComp);

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 14) {
      pulseOsc.triggerAttackRelease("A2", "2n", time + H(3), 0.55);
    }
  }, "1n").start(0);

  const shimmerNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.5, decay: 1, sustain: 0.3, release: 2 },
    volume: -28
  }).connect(new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterReverb));

  Tone.Transport.schedule((time) => {
    shimmerNoise.triggerAttackRelease(4, time);
  }, "6:0:0");
  Tone.Transport.schedule((time) => {
    shimmerNoise.triggerAttackRelease(4, time);
  }, "10:0:0");

  window.toneJsInstruments = { amberPad, crimsonLead, cyanBell, subBass, pulseOsc, shimmerNoise };
  window.toneJsParts = { amberLoop, crimsonLoop, cyanLoop, subLoop, pulseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
