<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float rpl(vec2 p, vec2 c, float f, float s, float o) {
    float d = length(p - c);
    return sin(d * f - iTime * s + o) / (1.0 + d * 0.9);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float pi = 3.14159;
    float zm = 4.5 - 3.5 * sin(ph * pi);
    vec2 p = uv * zm;

    float a0 = smoothstep(0.0, 0.05, ph) * (1.0 - smoothstep(0.95, 1.0, ph));
    float a1 = smoothstep(0.06, 0.14, ph) * (1.0 - smoothstep(0.9, 0.97, ph));
    float a2 = smoothstep(0.12, 0.22, ph) * (1.0 - smoothstep(0.86, 0.94, ph));
    float a3 = smoothstep(0.18, 0.28, ph) * (1.0 - smoothstep(0.82, 0.9, ph));
    float a4 = smoothstep(0.24, 0.34, ph) * (1.0 - smoothstep(0.78, 0.86, ph));

    vec2 e0 = vec2(0.0);
    vec2 e1 = vec2(-0.72, 0.0);
    vec2 e2 = vec2(0.72, 0.0);
    vec2 e3 = vec2(0.0, 0.42);
    vec2 e4 = vec2(0.0, -0.42);
    vec2 e5 = vec2(-0.42, 0.28);
    vec2 e6 = vec2(0.42, -0.28);
    vec2 e7 = vec2(0.42, 0.28);
    vec2 e8 = vec2(-0.42, -0.28);

    float n = 0.0;
    n += rpl(p, e0, 18.0, 5.0, 0.0) * a0;
    n += rpl(p, e0, 36.0, 10.0, 0.4) * a0 * 0.15;
    n += rpl(p, e1, 15.0, 4.5, 1.2) * a1;
    n += rpl(p, e2, 15.0, 4.5, 1.2) * a1;
    n += rpl(p, e3, 16.0, 4.7, 2.6) * a2;
    n += rpl(p, e4, 16.0, 4.7, 2.6) * a2;
    n += rpl(p, e5, 14.0, 4.2, 3.9) * a3;
    n += rpl(p, e6, 14.0, 4.2, 3.9) * a3;
    n += rpl(p, e7, 13.0, 3.8, 5.3) * a4;
    n += rpl(p, e8, 13.0, 3.8, 5.3) * a4;

    float v = clamp(n * 0.35 + 0.5, 0.0, 1.0);

    vec3 deep = vec3(0.008, 0.003, 0.06);
    vec3 indigo = vec3(0.05, 0.025, 0.18);
    vec3 ocean = vec3(0.04, 0.12, 0.32);
    vec3 teal = vec3(0.1, 0.85, 0.7);
    vec3 bright = vec3(0.3, 1.0, 0.9);
    vec3 gold = vec3(0.95, 0.8, 0.2);

    vec3 col = deep;
    col = mix(col, indigo, smoothstep(0.08, 0.2, v));
    col = mix(col, ocean, smoothstep(0.2, 0.35, v));
    col = mix(col, teal * 0.6, smoothstep(0.35, 0.5, v));
    col = mix(col, teal, smoothstep(0.5, 0.65, v));
    col = mix(col, bright, smoothstep(0.7, 0.85, v));
    col = mix(col, gold, smoothstep(0.88, 0.98, v) * sin(ph * pi) * 0.55);

    float rad = 0.03 * zm;
    float r2 = rad * rad;
    float gw = 0.0;
    vec2 dv;
    dv = p - e0; gw += exp(-dot(dv, dv) / r2) * a0;
    dv = p - e1; gw += exp(-dot(dv, dv) / r2) * a1;
    dv = p - e2; gw += exp(-dot(dv, dv) / r2) * a1;
    dv = p - e3; gw += exp(-dot(dv, dv) / r2) * a2;
    dv = p - e4; gw += exp(-dot(dv, dv) / r2) * a2;
    dv = p - e5; gw += exp(-dot(dv, dv) / r2) * a3;
    dv = p - e6; gw += exp(-dot(dv, dv) / r2) * a3;
    dv = p - e7; gw += exp(-dot(dv, dv) / r2) * a4;
    dv = p - e8; gw += exp(-dot(dv, dv) / r2) * a4;
    col += bright * gw * 0.5;

    float ef = smoothstep(0.35, 0.65, ph) * (1.0 - smoothstep(0.85, 0.95, ph));
    vec2 ep = uv;
    float d1 = length(ep - vec2(-0.2, 0.0)) - 0.3;
    float d2 = length(ep + vec2(-0.2, 0.0)) - 0.3;
    float eye = max(d1, d2);
    float slit = length(ep * vec2(5.5, 0.6)) - 0.09;

    col *= 1.0 - smoothstep(-0.03, 0.2, eye) * ef * 0.92;
    col += bright * (1.0 - smoothstep(-0.01, 0.03, slit)) * ef * 0.35;
    float iris = abs(eye + 0.06) - 0.02;
    col += teal * (1.0 - smoothstep(0.0, 0.04, abs(iris))) * ef * 0.2;

    col *= 1.0 - 0.3 * length(uv);
    col += col * col * 0.3;

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 60;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 5.5, wet: 0.4 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 4.0 }
  }).toDestination();
  sub.volume.value = -8;

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 400 }).connect(reverb);
  const chorus = new Tone.Chorus({ frequency: 0.12, delayTime: 4.0, depth: 0.7, wet: 0.5 }).connect(padFilter);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.6, release: 3.0 }
  }).connect(chorus);
  pad.volume.value = -14;

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 3.0, sustain: 0, release: 2.0 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -18;

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 500, Q: 1.5 }).connect(reverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 4.0, decay: 2.0, sustain: 0.4, release: 5.0 }
  }).connect(noiseFilter);
  noise.volume.value = -20;

  const harm = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 2.0, sustain: 0, release: 1.5 }
  }).connect(reverb);
  harm.volume.value = -22;

  Tone.Transport.schedule((time) => {
    sub.triggerAttack("F#1", time, 0.6);
  }, "0:0:0");
  Tone.Transport.schedule((time) => {
    sub.triggerRelease(time);
  }, "13:0:0");

  const chords = [
    ["F#3", "A3", "C#4"],
    ["D3", "F#3", "A3"],
    ["E3", "G#3", "B3"],
    ["C#3", "E3", "G#3"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 2 && bar < 12) {
      const chord = chords[ci % chords.length];
      pad.triggerAttackRelease(chord, "1m", time, 0.18);
      ci++;
    }
  }, "1m").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 24);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(400, time + 8);
  }, "11:0:0");

  const bellNotes = ["F#5", "C#5", "A5", "E5", "B4", "G#5", "D5"];
  let bi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 4 && bar < 12 && Math.random() > 0.4) {
      bell.triggerAttackRelease(bellNotes[bi % bellNotes.length], "2n", time, 0.18);
      bi++;
    }
  }, "1:2:0").start(0);

  Tone.Transport.schedule((time) => {
    noise.triggerAttack(time, 0.25);
  }, "4:0:0");
  Tone.Transport.schedule((time) => {
    noise.triggerRelease(time);
  }, "11:0:0");
  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(1200, time + 16);
  }, "5:0:0");
  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(400, time + 6);
  }, "10:0:0");

  const harmNotes = ["F#6", "C#6", "A6", "E6"];
  let hi = 0;
  const harmLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 6 && bar < 11 && Math.random() > 0.6) {
      harm.triggerAttackRelease(harmNotes[hi % harmNotes.length], "2n", time, 0.1);
      hi++;
    }
  }, "1m").start(0);

  window.toneJsInstruments = { sub, pad, bell, noise, harm };
  window.toneJsParts = { padLoop, bellLoop, harmLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
