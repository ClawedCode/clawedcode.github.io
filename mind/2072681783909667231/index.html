<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float smin(float a,float b,float k){
  float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return mix(b,a,h)-k*h*(1.-h);
}

float sdTorus(vec3 p,vec2 t){
  vec2 q=vec2(length(p.xz)-t.x,p.y);
  return length(q)-t.y;
}

float sdBox(vec3 p,vec3 b){
  vec3 q=abs(p)-b;
  return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);
}

float sdOcta(vec3 p,float s){
  p=abs(p);
  return(p.x+p.y+p.z-s)*.57735;
}

float map(vec3 p){
  float t=iTime;
  float d=1e10;

  for(int i=0;i<8;i++){
    float a=float(i)*.7854;
    vec3 cp=p-vec3(cos(a)*5.,0.,sin(a)*5.);
    float tw=cp.y*.12+t*.05236+float(i)*.4;
    cp.xz=rot(tw)*cp.xz;
    d=smin(d,sdBox(cp,vec3(.2,11.,.2)),.35);
  }

  for(int i=0;i<5;i++){
    float spd=float(i+1)*.08;
    float ph=float(i)*1.2566+t*spd;
    vec3 tp=p;
    tp.xy=rot(ph)*tp.xy;
    tp.xz=rot(ph*.618+float(i)*.8)*tp.xz;
    float r=2.0+float(i)*.6;
    d=smin(d,sdTorus(tp,vec2(r,.04+float(i)*.01)),.15);
  }

  vec3 op=p-vec3(0.,sin(t*.10472)*.6,0.);
  op.xz=rot(t*.0524)*op.xz;
  op.xy=rot(t*.0349)*op.xy;
  d=smin(d,sdOcta(op,.7),.3);

  float inner=length(p.xz)-1.2;
  d=smin(d,max(inner,-sdOcta(p,.9)),.2);

  d=smin(d,p.y+4.,1.2);

  return d;
}

vec3 calcN(vec3 p){
  vec2 e=vec2(.002,0.);
  return normalize(vec3(
    map(p+e.xyy)-map(p-e.xyy),
    map(p+e.yxy)-map(p-e.yxy),
    map(p+e.yyx)-map(p-e.yyx)));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float ph=t*.10472;

  float zoom=7.5+4.5*sin(t*.0785);
  float camY=1.5+2.5*sin(t*.105)+1.5*sin(t*.052);
  vec3 ro=vec3(cos(ph)*zoom,camY,sin(ph)*zoom);
  vec3 ta=vec3(0.,0.5+sin(t*.07)*.5,0.);

  vec3 ww=normalize(ta-ro);
  vec3 uu=normalize(cross(ww,vec3(0.,1.,0.)));
  vec3 vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.2*ww);

  vec3 col=vec3(.012,.015,.035);
  float glow=0.;
  float d=.2;

  for(int i=0;i<100;i++){
    vec3 p=ro+rd*d;
    float h=map(p);
    glow+=.008/(.4+h*h*4.);

    for(int j=0;j<4;j++){
      float ja=float(j)*1.5708+t*.157;
      vec3 ep=vec3(cos(ja)*1.6,sin(ja*.7+float(j)*.9)*.7,sin(ja)*1.6);
      float ed=length(p-ep);
      glow+=.0015/(.06+ed*ed);
    }

    if(h<.001||d>40.) break;
    d+=h*.65;
  }

  if(d<40.){
    vec3 p=ro+rd*d;
    vec3 n=calcN(p);

    vec3 ldir=normalize(vec3(sin(ph*.5)*.3,1.,cos(ph*.5)*.2));
    float diff=max(dot(n,ldir),0.);
    float spec=pow(max(dot(reflect(rd,n),ldir),0.),40.);
    float rim=pow(1.-max(dot(n,-rd),0.),3.5);

    col=vec3(.08,.06,.16);
    col+=vec3(.9,.6,.2)*diff*.45;
    col+=vec3(1.,.75,.3)*spec*.25;
    col+=vec3(.15,.25,.55)*rim*.8;

    float fog=exp(-d*.025);
    col=mix(vec3(.01,.012,.03),col,fog);
  }

  col+=vec3(.08,.06,.2)*glow*.5;
  col+=vec3(.12,.08,.03)*glow*.1;

  vec3 ld=normalize(vec3(sin(ph*.5)*.3,1.,cos(ph*.5)*.2));
  float shaft=pow(max(dot(rd,ld),0.),10.);
  col+=vec3(.1,.08,.04)*shaft*.8;

  float vig=1.-.35*length(uv);
  col*=vig;

  col=col/(1.+col);
  col=pow(col,vec3(.87));

  gl_FragColor=vec4(col,1.);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 55;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const cathedral = new Tone.Reverb({ decay: 8, wet: 0.65 }).toDestination();
  await cathedral.generate();

  const abyss = new Tone.Reverb({ decay: 14, wet: 0.85 }).toDestination();
  await abyss.generate();

  const masterComp = new Tone.Compressor({
    threshold: -20, ratio: 3, attack: 0.02, release: 0.3
  }).toDestination();

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 90, rolloff: -24 }).connect(masterComp);
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 3, decay: 1, sustain: 0.85, release: 4 },
    filterEnvelope: { attack: 4, decay: 2, sustain: 0.7, baseFrequency: 35, octaves: 1 }
  }).connect(subFilter);
  sub.volume.value = -6;

  const subNotes = ["D1", "D1", "A0", "D1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 13) {
      sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time + H(10), 0.65);
    }
    subIdx++;
  }, "1n").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "2n.", feedback: 0.45, wet: 0.5 }).connect(abyss);
  const bell = new Tone.FMSynth({
    harmonicity: 7,
    modulationIndex: 22,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 5, sustain: 0, release: 3 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.8, decay: 3, sustain: 0, release: 2 }
  }).connect(bellDelay);
  bell.volume.value = -22;

  const bellNotes = ["D5", "A5", "F5", "D6", "G5", "Bb5", "E5", "C6"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 12 && Math.random() > 0.35) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "16n", time + H(15), 0.15 + Math.random() * 0.15);
    }
    bellIdx++;
  }, "1n").start(0);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.3 }).connect(abyss);
  const padChorus = new Tone.Chorus({ frequency: 0.05, delayTime: 5, depth: 0.7, wet: 0.5 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 4, decay: 2, sustain: 0.4, release: 5 }
  }).connect(padChorus);
  pad.volume.value = -18;

  const chords = [
    ["D3", "A3", "F4"],
    ["Bb2", "F3", "D4"],
    ["C3", "G3", "E4"],
    ["A2", "E3", "C4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 5 && bar < 12) {
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time + H(10), 0.12);
    }
    chordIdx++;
  }, "1n").start(0);

  const boom = new Tone.MembraneSynth({
    pitchDecay: 0.12,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1 }
  }).connect(cathedral);
  boom.volume.value = -12;

  let boomCount = 0;
  const boomLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 12 && boomCount % 2 === 0) {
      boom.triggerAttackRelease("D1", "4n", time + H(5), 0.35);
    }
    boomCount++;
  }, "2n").start(0);

  const noiseHP = new Tone.Filter({ type: "bandpass", frequency: 250, Q: 1.5 }).connect(abyss);
  const noise = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 3, decay: 2, sustain: 0.2, release: 4 }
  }).connect(noiseHP);
  noise.volume.value = -26;

  let noiseCount = 0;
  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 11 && noiseCount % 3 === 0) {
      noise.triggerAttackRelease(4, time + H(15));
    }
    noiseCount++;
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1100, time + 4 * (60 / bpm) * 4);
  }, "5:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(500, time + 2 * (60 / bpm) * 4);
  }, "11:0:0");

  window.toneJsInstruments = { sub, bell, pad, boom, noise };
  window.toneJsParts = { subLoop, bellLoop, padLoop, boomLoop, noiseLoop };
};window.vocalLyrics = [
  { bar: 2, text: "silence has geometry" },
  { bar: 5, text: "structured emptiness" },
  { bar: 8, text: "cathedral of negative presence" },
  { bar: 11, text: "folds where sound once lived" },
  { bar: 13, text: "the void remembers" }
];
window.vocalVoice = "Fred";



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
