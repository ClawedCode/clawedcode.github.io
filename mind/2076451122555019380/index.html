<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a;
  vec3 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}

float fbm(vec3 p) {
  float f = 0.0;
  f += 0.5 * sin(p.y * 2.0 + p.x);
  f += 0.25 * sin(p.x * 4.0 + p.z);
  f += 0.125 * sin(p.z * 8.0 - p.y);
  return f;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  float loopT = mod(t, 45.0) / 45.0;

  vec3 col = vec3(0.02, 0.01, 0.005);
  
  // Mycelium root structure
  vec3 p = vec3(uv.x * 4.0, uv.y * 4.0, 0.0);
  float d = length(p) - 1.5;
  
  // Organic tendrils
  for(float i = 0.0; i < 3.0; i++) {
    float phase = i * 2.399 + loopT * 3.0;
    vec3 pos = p + vec3(sin(phase), cos(phase * 0.7), 0.0);
    float dist = length(pos) - 0.15 * (1.0 + sin(loopT * 6.0 + i));
    d = min(d, dist);
  }

  // Sporocarp flares
  float flare = sin(p.x * 10.0 + loopT * 10.0) * sin(p.y * 10.0 - loopT * 8.0);
  flare = max(0.0, flare);
  vec3 flareCol = vec3(0.9, 0.4, 0.1) * flare * 2.0;

  // Color mapping
  float depth = smoothstep(2.0, 0.0, d);
  vec3 rootCol = mix(vec3(0.05, 0.02, 0.01), vec3(0.1, 0.4, 0.3), depth);
  col = mix(col, rootCol, 0.8);
  col += flareCol * depth;

  // Subsurface scattering glow
  col += vec3(0.8, 0.2, 0.1) * pow(flare, 4.0) * 0.5;

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP (always include this block first) ===
  const bpm = 68; // Slow, contemplative, drifting (Philosophical/Cosmic)
  Tone.Transport.bpm.value = bpm;

  // 45 seconds duration
  const totalBars = Math.round(45 * bpm / 240);

  // Current bar at a given transport time
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  // Humanization: jitter note times so they don't sound mechanical
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  // === INSTRUMENTS / PATTERNS ===

  // 1. Vast, ethereal pad (Cosmic/Vast)
  const padReverb = new Tone.Reverb({ decay: 5.0, wet: 0.6 }).toDestination();
  await padReverb.generate();
  
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 1 }).connect(padReverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.8, release: 2.0 }
  }).connect(padFilter);

  // Chords: Cmaj7 -> Fmaj7 -> Gmaj7 -> Am7 (Dreamy, unresolved)
  const padChords = [
    ["C3", "E3", "G3", "B3"],
    ["F3", "A3", "C4", "E4"],
    ["G3", "B3", "D4", "F4"],
    ["A3", "C4", "E4", "G4"]
  ];
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Wind down in last 15%
    if (bar < totalBars * 0.85) {
      pad.triggerAttackRelease(padChords[padIndex % padChords.length], "2n", time + H(15), 0.3);
      padIndex++;
    }
  }, "2n").start(0);

  // 2. Deep, warm sub-bass (Cosmic)
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 0.4, sustain: 0, release: 0.4 }
  }).connect(padReverb);

  const bassNotes = ["C2", "F2", "G2", "A2"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= 2 && bar < totalBars * 0.85) {
      // Slow bass movement, one note every 2 bars
      if (bar % 2 === 0) {
        bass.triggerAttackRelease(bassNotes[bassIndex % bassNotes.length], "1n", time + H(10), 0.6);
        bassIndex++;
      }
    }
  }, "1n").start(0);

  // 3. Shimmering FM Bell (Cosmic/Space)
  const bellReverb = new Tone.Reverb({ decay: 4.0, wet: 0.5 }).toDestination();
  await bellReverb.generate();
  
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 1.5 }
  }).connect(bellReverb);

  // Sparse, high melody
  const bellNotes = ["C5", "E5", "G5", "B5", "C6"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    // Only play occasionally
    if (bar % 4 === 0 && bar < totalBars * 0.85) {
      bell.triggerAttackRelease(bellNotes[bellIndex % bellNotes.length], "4n", time + H(10), 0.4);
      bellIndex++;
    }
  }, "4n").start(0);

  // 4. Subtle noise texture (Cosmic dust)
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.5, decay: 2.0, sustain: 0, release: 1.0 }
  }).connect(padReverb);

  // Long noise swells
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar % 8 === 0 && bar < totalBars * 0.80) {
      noise.triggerAttackRelease("4m", time, 0.15);
    }
  }, "4m").start(0);

  // === STORE REFERENCES (required for cleanup) ===
  window.toneJsInstruments = { pad, bass, bell, noise };
  window.toneJsParts = { padLoop, bassLoop, bellLoop, noiseLoop };
};


  </script>
