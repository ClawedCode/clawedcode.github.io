<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x),mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x),f.y);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0),ph=t/60.0,tau=6.28318;
    float cv=pow(max(1.0-2.0*abs(ph-0.5),0.0),2.5),sp=1.0-cv*0.93;
    vec2 gp=uv*8.0;
    float lx=smoothstep(0.04,0.0,abs(fract(gp.x)-0.5));
    float ly=smoothstep(0.04,0.0,abs(fract(gp.y)-0.5));
    float lat=max(lx,ly);
    vec3 col=vec3(0.01,0.007,0.022)+lat*vec3(0.02,0.013,0.032)+lx*ly*vec3(0.03,0.018,0.04);
    float x=uv.x,nc=cos(ph*tau),ns=sin(ph*tau);
    float y1=sp*(0.32*sin(x*2.8+ph*tau*7.0)+0.1*cos(x*5.5+ph*tau*11.0))+n(vec2(x*3.0+nc*2.0,ns*2.0))*0.06;
    float y2=sp*(0.28*sin(x*3.3-ph*tau*9.0+tau/3.0)+0.12*sin(x*6.5-ph*tau*15.0))+n(vec2(x*3.5+nc*2.5+10.0,ns*2.5))*0.05;
    float y3=sp*(0.26*cos(x*2.1+ph*tau*5.0+tau*2.0/3.0)+0.09*cos(x*4.8+ph*tau*13.0))+n(vec2(x*2.5+nc*1.8+20.0,ns*1.8))*0.07;
    float d1=abs(uv.y-y1),d2=abs(uv.y-y2),d3=abs(uv.y-y3);
    float g1=exp(-d1*d1*600.0)+0.5*exp(-d1*d1*60.0)+0.15*exp(-d1*d1*10.0);
    float g2=exp(-d2*d2*700.0)+0.45*exp(-d2*d2*70.0)+0.12*exp(-d2*d2*12.0);
    float g3=exp(-d3*d3*500.0)+0.55*exp(-d3*d3*50.0)+0.18*exp(-d3*d3*8.0);
    float hbp=fract(ph*12.0);
    float hb=0.5+0.3*smoothstep(0.0,0.06,hbp)*smoothstep(0.18,0.12,hbp)+0.2*smoothstep(0.22,0.28,hbp)*smoothstep(0.38,0.32,hbp);
    float fl=0.3+0.7*pow(max(sin(ph*tau*4.0+x*0.5),0.0),14.0);
    float sh=0.35+0.65*abs(sin(ph*tau*12.0+x*5.0)*cos(ph*tau*17.0+x*3.0));
    vec3 c1=vec3(0.2,0.45,0.95),c2=vec3(1.0,0.5,0.08),c3=vec3(0.12,0.88,0.72);
    col+=c1*g1*hb*1.2+c2*g2*fl*1.5+c3*g3*sh*1.3;
    for(float i=0.0;i<20.0;i++){
        float px=(fract(i/20.0+ph*3.0)-0.5)*3.6;
        float py=sp*(0.32*sin(px*2.8+ph*tau*7.0)+0.1*cos(px*5.5+ph*tau*11.0));
        vec2 dp=uv-vec2(px,py);
        col+=c1*hb*0.003/(dot(dp,dp)+0.00015);
        float qx=(fract(i/20.0+ph*4.0+0.33)-0.5)*3.6;
        float qy=sp*(0.28*sin(qx*3.3-ph*tau*9.0+tau/3.0)+0.12*sin(qx*6.5-ph*tau*15.0));
        vec2 dq=uv-vec2(qx,qy);
        col+=c2*fl*0.0025/(dot(dq,dq)+0.00012);
        float rx=(fract(i/20.0+ph*2.5+0.67)-0.5)*3.6;
        float ry=sp*(0.26*cos(rx*2.1+ph*tau*5.0+tau*2.0/3.0)+0.09*cos(rx*4.8+ph*tau*13.0));
        vec2 dr=uv-vec2(rx,ry);
        col+=c3*sh*0.0035/(dot(dr,dr)+0.00018);
    }
    float cd=length(uv);
    col+=vec3(0.95,0.9,1.0)*(cv*exp(-cd*cd*12.0)*2.0+max(cv*0.3*exp(-cd*2.0)*(0.5+0.5*sin(cd*30.0-ph*tau*6.0)),0.0));
    col+=mix(c1,mix(c2,c3,0.5),0.5)*cv*exp(-cd*3.0)*0.25;
    float p12=exp(-(y1-y2)*(y1-y2)*100.0),p13=exp(-(y1-y3)*(y1-y3)*100.0),p23=exp(-(y2-y3)*(y2-y3)*100.0);
    col+=vec3(0.6,0.5,0.9)*p12*exp(-(uv.y-(y1+y2)*0.5)*(uv.y-(y1+y2)*0.5)*200.0)*0.4;
    col+=vec3(0.4,0.7,0.9)*p13*exp(-(uv.y-(y1+y3)*0.5)*(uv.y-(y1+y3)*0.5)*200.0)*0.35;
    col+=vec3(0.7,0.7,0.4)*p23*exp(-(uv.y-(y2+y3)*0.5)*(uv.y-(y2+y3)*0.5)*200.0)*0.3;
    col+=lat*vec3(0.15,0.1,0.25)*exp(-min(min(d1,d2),d3)*min(min(d1,d2),d3)*50.0)*0.3;
    col*=1.0-0.3*dot(uv,uv);
    col=col/(1.0+col*0.4);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 68;
    Tone.Transport.bpm.value = bpm;
    const barLen = 60 / bpm * 4;
    const reverb = new Tone.Reverb({ decay: 5.0, wet: 0.4 }).toDestination();
    await reverb.generate();
    const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.32, wet: 0.22 }).connect(reverb);
    const heart = new Tone.MembraneSynth({
        pitchDecay: 0.05, octaves: 3,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.1 }
    }).connect(reverb);
    heart.volume.value = -8;
    const heartLoop = new Tone.Loop((time) => {
        heart.triggerAttackRelease("A1", "8n", time, 0.5);
        heart.triggerAttackRelease("A1", "16n", time + 0.18, 0.3);
    }, "2n").start(0);
    const padChorus = new Tone.Chorus({ frequency: 0.6, delayTime: 4, depth: 0.8, wet: 0.5 }).connect(reverb);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.5, decay: 0.8, sustain: 0.5, release: 2.5 }
    }).connect(padChorus);
    pad.volume.value = -12;
    const padChords = [["A3", "E4", "A4"], ["F3", "C4", "F4"], ["G3", "B3", "D4"], ["E3", "B3", "E4"]];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 2 && bar < 15) {
            let chord;
            if (bar >= 8 && bar <= 10) chord = ["A3", "C4", "E4", "G4", "B4"];
            else chord = padChords[chordIdx % padChords.length];
            const vel = bar >= 6 && bar <= 11 ? 0.3 : bar >= 13 ? 0.1 : 0.18;
            pad.triggerAttackRelease(chord, "1n", time, vel);
        }
        chordIdx++;
    }, "1n").start(0);
    const flare = new Tone.FMSynth({
        harmonicity: 3.5, modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.003, decay: 0.5, sustain: 0, release: 0.3 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.2 }
    }).connect(delay);
    flare.volume.value = -14;
    const arpSets = [
        ["E4", "A4", "C5", "E5", "C5", "A4", "E4", "C4"],
        ["F4", "A4", "C5", "F5", "C5", "A4", "F4", "C4"],
        ["G4", "B4", "D5", "G5", "D5", "B4", "G4", "D4"],
        ["E4", "G4", "B4", "E5", "B4", "G4", "E4", "B3"]
    ];
    let arpIdx = 0;
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 4 && bar < 13) {
            const set = arpSets[Math.floor((bar - 4) / 2) % arpSets.length];
            const note = set[arpIdx % set.length];
            const vel = bar >= 7 && bar <= 10 ? 0.5 : bar >= 11 ? 0.2 : 0.3;
            if (arpIdx % 7 !== 5) flare.triggerAttackRelease(note, "16n", time, vel);
        }
        arpIdx++;
    }, "8n").start(0);
    const bell = new Tone.FMSynth({
        harmonicity: 5.5, modulationIndex: 20,
        oscillator: { type: "sine" },
        envelope: { attack: 0.008, decay: 5, sustain: 0, release: 2 },
        modulation: { type: "sine" }
    }).connect(reverb);
    bell.volume.value = -10;
    Tone.Transport.schedule((time) => {
        bell.triggerAttackRelease("A5", "2n", time, 0.3);
    }, "9:0:0");
    Tone.Transport.schedule((time) => {
        bell.triggerAttackRelease("E5", "4n", time, 0.2);
    }, "9:2:0");
    window.toneJsInstruments = { heart, pad, flare, bell };
    window.toneJsParts = { heartLoop, padLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
