  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = "precision highp float;\nuniform vec2 iResolution;\nuniform float iTime;\nconst float DURATION = 60.0;\n\n// THE TURNTABLE TEST. 1928: a toy cat on a phonograph turntable is scanned, line by line, by a flying spot\n// of light thrown through a spinning Nipkow disk, and received as sixty orange lines on a neon lamp.\n// 20 bars of 3 s (80 BPM). One picture is scanned per bar. The turntable turns nine times per loop.\nconst float BARS = 20.0;\nconst float PI = 3.14159265359;\nconst float TAU = 6.28318530718;\nconst float HOLES = 60.0;\n\n// studio layout (screen units, y up, both axes -0.5 to 0.5)\nconst vec2 DISK_C = vec2(-0.43, 0.50);\nconst float DISK_R = 0.55;\nconst float HOLE_R_IN = 0.345;\nconst float HOLE_R_OUT = 0.485;\nconst float HOLE_SIZE = 0.0080;\nconst float GATE_A = -0.95;          // the gate sits low on the disk's right, facing the doll\nconst vec2 SCAN_LO = vec2(-0.03, -0.45);\nconst vec2 SCAN_HI = vec2(0.47, 0.31);\nconst vec3 HEAD_C = vec3(0.0, 1.13, 0.0);\n\nfloat gBodyYaw;\nfloat gHeadYaw;\nfloat gAlive;\nfloat gBlink;\nfloat gPupil;\nfloat gEcho;\nfloat gBreath;\n\nfloat sat(float x) { return clamp(x, 0.0, 1.0); }\nfloat ramp(float x, float a, float b) { return smoothstep(a, b, x); }\nmat2 rot(float a) { float c = cos(a); float s = sin(a); return mat2(c, -s, s, c); }\nfloat wrapPi(float x) { return x - TAU * floor((x + PI) / TAU); }\n\nfloat smin(float a, float b, float k) {\n  float h = sat(0.5 + 0.5 * (b - a) / k);\n  return mix(b, a, h) - k * h * (1.0 - h);\n}\nfloat sdEllipsoid(vec3 p, vec3 r) {\n  float k0 = length(p / r);\n  float k1 = length(p / (r * r));\n  return k0 * (k0 - 1.0) / max(k1, 1e-4);\n}\nfloat sdCapsule(vec3 p, vec3 a, vec3 b, float r) {\n  vec3 pa = p - a; vec3 ba = b - a;\n  float h = sat(dot(pa, ba) / dot(ba, ba));\n  return length(pa - ba * h) - r;\n}\nfloat sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {\n  vec3 ba = b - a;\n  float h = sat(dot(p - a, ba) / dot(ba, ba));\n  return length(p - a - ba * h) - mix(r1, r2, h);\n}\nfloat sdBox(vec3 p, vec3 b) {\n  vec3 q = abs(p) - b;\n  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);\n}\nfloat sdCylY(vec3 p, float r, float h) {\n  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);\n  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));\n}\n\n// ---------------------------------------------------------------- the toy cat (body frame: y up, face toward +z)\nfloat catBody(vec3 p) {\n  float torso = sdEllipsoid(p - vec3(0.0, 0.50, -0.04), vec3(0.32, 0.46, 0.29) * (1.0 + gBreath * vec3(0.035, 0.012, 0.035)));\n  vec3 q = vec3(abs(p.x), p.y, p.z);\n  float haunch = length(q - vec3(0.19, 0.24, -0.10)) - 0.22;\n  float foreleg = sdCapsule(q, vec3(0.10, 0.05, 0.19), vec3(0.09, 0.54, 0.10), 0.072);\n  float paw = sdEllipsoid(q - vec3(0.10, 0.045, 0.24), vec3(0.08, 0.05, 0.10));\n  float d = smin(torso, haunch, 0.10);\n  d = smin(d, foreleg, 0.06);\n  d = smin(d, paw, 0.04);\n  float tail = sdCapsule(p, vec3(-0.06, 0.10, -0.33), vec3(0.30, 0.06, -0.24), 0.055);\n  tail = min(tail, sdCapsule(p, vec3(0.30, 0.06, -0.24), vec3(0.41, 0.06, 0.06), 0.052));\n  tail = min(tail, sdCapsule(p, vec3(0.41, 0.06, 0.06), vec3(0.31, 0.13, 0.30), 0.047));\n  return smin(d, tail, 0.05);\n}\n// head frame: origin at the head centre\nfloat catHead(vec3 p) {\n  float skull = sdEllipsoid(p, vec3(0.34, 0.30, 0.30));\n  float muzzle = sdEllipsoid(p - vec3(0.0, -0.10, 0.22), vec3(0.15, 0.10, 0.11));\n  vec3 q = vec3(abs(p.x), p.y, p.z * 2.2);\n  float ear = sdRoundCone(q, vec3(0.16, 0.16, 0.0), vec3(0.25, 0.45, -0.03), 0.105, 0.012) * 0.6;\n  return smin(smin(skull, muzzle, 0.06), ear, 0.03);\n}\nvec3 toBody(vec3 p) { vec3 b = p; b.xz = rot(gBodyYaw) * b.xz; return b; }\nvec3 toHead(vec3 p) { vec3 h = p - HEAD_C; h.xz = rot(gHeadYaw) * h.xz; return h; }\n\n// x: distance, y: material (1 body, 2 head, 3 platter, 5 plinth)\nvec2 map(vec3 p) {\n  float body = catBody(toBody(p));\n  float head = catHead(toHead(p));\n  vec2 res = vec2(smin(body, head, 0.07), head \u003c body ? 2.0 : 1.0);\n  float platter = sdCylY(p - vec3(0.0, -0.045, 0.0), 0.86, 0.045);\n  if (platter \u003c res.x) res = vec2(platter, 3.0);\n  float plinth = sdBox(p - vec3(0.0, -0.30, 0.0), vec3(1.03, 0.20, 0.93)) - 0.02;\n  if (plinth \u003c res.x) res = vec2(plinth, 5.0);\n  return res;\n}\nvec3 calcNormal(vec3 p) {\n  vec2 e = vec2(0.0015, -0.0015);\n  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);\n}\nvec2 boxHit(vec3 ro, vec3 rd, vec3 lo, vec3 hi) {\n  vec3 inv = 1.0 / rd;\n  vec3 t0 = (lo - ro) * inv; vec3 t1 = (hi - ro) * inv;\n  vec3 tmin = min(t0, t1); vec3 tmax = max(t0, t1);\n  return vec2(max(max(tmin.x, tmin.y), tmin.z), min(min(tmax.x, tmax.y), tmax.z));\n}\n\n// the doll's eyes in head space: painted toy discs that can come alive\nvec3 eyeColor(vec3 h, vec3 fur, out float isEye) {\n  isEye = 0.0;\n  if (h.z \u003c 0.10) return fur;\n  vec2 e = vec2((abs(h.x) - 0.135) / 0.074, (h.y - 0.035) / 0.086);\n  float ed = length(e);\n  if (ed > 1.0) return fur;\n  isEye = 1.0;\n  // toy: a painted bone disc with a round black pupil\n  vec3 toy = vec3(0.86, 0.83, 0.76);\n  if (length(e - vec2(-0.12 * sign(h.x), -0.08)) \u003c 0.42) toy = vec3(0.02);\n  // alive: a lit cold iris, a vertical slit that opens, and a lid that closes from above\n  vec3 live = mix(vec3(0.30, 0.85, 0.95), vec3(0.85, 1.0, 1.0), sat(1.0 - ed));\n  float slitHalf = gPupil * sqrt(max(1.0 - e.y * e.y, 0.0));\n  if (abs(e.x) \u003c slitHalf) live = vec3(0.01, 0.015, 0.02);\n  vec3 c = mix(toy, live, gAlive);\n  float lidEdge = 1.0 - 2.0 * gBlink;\n  if (e.y > lidEdge) c = fur;\n  return c;\n}\n\n// scene radiance for one ray. key: strength of the hot key light; amb: room light; glowEyes: eye emission\nvec3 scene(vec3 ro, vec3 rd, float key, float amb, float pool, out float hitDoll) {\n  hitDoll = 0.0;\n  vec3 L = normalize(vec3(-0.40, 0.55, 0.75));\n  float tBest = 1e9;\n  vec3 col = vec3(0.0);\n  // backdrop card (z = -1.25) and table (y = -0.52)\n  if (rd.z \u003c 0.0) {\n    float tb = (-1.25 - ro.z) / rd.z;\n    vec3 pb = ro + rd * tb;\n    if (abs(pb.x) \u003c 1.85 && pb.y > -0.52 && pb.y \u003c 2.7) {\n      tBest = tb;\n      float spot = 0.70 + pool * 0.55 * exp(-dot(pb.xy - vec2(0.05, 0.85), pb.xy - vec2(0.05, 0.85)) / 1.1);\n      float edge = smoothstep(1.85, 1.80, abs(pb.x)) * smoothstep(2.7, 2.65, pb.y);\n      col = vec3(0.80, 0.75, 0.66) * (amb + key * 0.78 * spot) * edge;\n    }\n  }\n  if (rd.y \u003c 0.0) {\n    float tf = (-0.52 - ro.y) / rd.y;\n    vec3 pf = ro + rd * tf;\n    if (tf \u003c tBest && pf.z > -1.25 && abs(pf.x) \u003c 2.6) {\n      tBest = tf;\n      float fall = exp(-max(pf.z + 1.25, 0.0) * 0.35);\n      col = vec3(0.10, 0.075, 0.06) * (amb + key * 0.6 * fall);\n    }\n  }\n  // the doll on its turntable: bounded raymarch\n  vec2 span = boxHit(ro, rd, vec3(-1.08, -0.54, -0.98), vec3(1.08, 1.66, 0.98));\n  if (span.x \u003c span.y && span.y > 0.0) {\n    float t = max(span.x, 0.0);\n    float m = -1.0;\n    for (int i = 0; i \u003c 72; i++) {\n      vec2 h = map(ro + rd * t);\n      if (h.x \u003c 0.0012 * t) { m = h.y; break; }\n      t += h.x * 0.85;\n      if (t > span.y) break;\n    }\n    if (m > 0.0 && t \u003c tBest) {\n      hitDoll = 1.0;\n      vec3 p = ro + rd * t;\n      vec3 n = calcNormal(p);\n      float ao = sat(map(p + n * 0.07).x / 0.07);\n      float dif = max(dot(n, L), 0.0);\n      vec3 H = normalize(L - rd);\n      float spec = pow(max(dot(n, H), 0.0), 36.0);\n      float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);\n      vec3 alb = vec3(0.035, 0.032, 0.04);\n      float gloss = 0.55;\n      vec3 emit = vec3(0.0);\n      if (m \u003c 2.5) {\n        float isEye = 0.0;\n        if (m > 1.5) {\n          vec3 hp = toHead(p);\n          alb = eyeColor(hp, alb, isEye);\n          if (isEye > 0.5 && dot(alb, vec3(1.0)) > 0.5) emit = alb * gAlive * 0.9 + vec3(0.30, 0.85, 0.95) * gEcho;\n          if (length(hp - vec3(0.0, -0.075, 0.325)) \u003c 0.034) alb = vec3(0.55, 0.30, 0.32);\n        }\n      } else if (m \u003c 3.5) {\n        vec3 pb = toBody(p);\n        if (n.y \u003c 0.6) {\n          float a = atan(pb.z, pb.x);\n          float stripe = step(0.5, fract(a / TAU * 40.0));\n          alb = mix(vec3(0.06), vec3(0.70, 0.67, 0.60), stripe);\n          gloss = 0.2;\n        } else {\n          float rr = length(pb.xz);\n          alb = vec3(0.10, 0.10, 0.11) * (0.85 + 0.15 * sin(rr * 160.0));\n          if (rr \u003c 0.12) alb = vec3(0.45, 0.16, 0.12);\n          gloss = 0.15;\n        }\n      } else {\n        alb = vec3(0.17, 0.095, 0.05);\n        gloss = 0.2;\n      }\n      col = alb * (amb + key * (0.25 + 0.95 * dif)) * ao + key * gloss * spec * vec3(1.0, 0.95, 0.88) + key * 0.10 * rim * vec3(0.9, 0.85, 0.8) + emit;\n    }\n  }\n  return col;\n}\n\nvec3 neon(float l) {\n  vec3 c = mix(vec3(0.045, 0.010, 0.004), vec3(1.0, 0.33, 0.085), sat(l * 1.5));\n  return mix(c, vec3(1.0, 0.83, 0.64), sat(l * 1.5 - 0.85) * 0.85);\n}\nfloat lum(vec3 c) { return dot(c, vec3(0.30, 0.59, 0.11)); }\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;\n  float phase = mod(iTime, DURATION) / DURATION;\n  float tau = phase * TAU;\n  float bars = phase * BARS;\n  float scan = fract(bars);\n\n  // ------------------------------------------------ the timeline (bars)\n  gBodyYaw = tau * 9.0;                                             // nine turns of the turntable per loop\n  // the head stops turning with the body and keeps us; it lets go only where the body faces us again\n  float hold = ramp(bars, 8.64, 9.14) * (1.0 - ramp(bars, 15.31, 15.81));\n  gHeadYaw = gBodyYaw - hold * wrapPi(gBodyYaw);\n  gAlive = ramp(bars, 10.75, 11.25) * (1.0 - ramp(bars, 14.3, 14.7));\n  gBlink = ramp(bars, 12.6, 12.72) * (1.0 - ramp(bars, 12.88, 13.15));\n  gBreath = gAlive * sin(tau * 20.0);                              // alive, it breathes once a bar\n  gPupil = mix(0.16, 0.52, ramp(bars, 11.6, 12.1) * (1.0 - ramp(bars, 14.0, 14.4)));\n  float zoom = bars \u003c 10.0 ? ramp(bars, 3.4, 4.8) : 1.0 - ramp(bars, 15.0, 16.3);\n  float lines = 60.0;\n  if (bars >= 9.0 && bars \u003c 15.1) lines = 120.0;\n  if (bars >= 10.0 && bars \u003c 14.8) lines = 240.0;\n  float cont = ramp(bars, 10.5, 11.0) * (1.0 - ramp(bars, 14.5, 14.8));\n  float colour = ramp(bars, 10.5, 11.25) * (1.0 - ramp(bars, 14.4, 14.8));\n  float lensOpen = ramp(bars, 8.5, 9.5) * (1.0 - ramp(bars, 14.5, 15.0));\n  // after it has looked at us, the painted eyes keep a cold glint in the studio for a while\n  gEcho = 0.45 * ramp(bars, 17.0, 17.5) * (1.0 - ramp(bars, 18.5, 19.5));\n\n  // ------------------------------------------------ flying into the gate hole\n  float holeStep = (HOLE_R_OUT - HOLE_R_IN) / (HOLES - 1.0);\n  vec2 gateDir = vec2(cos(GATE_A), sin(GATE_A));\n  vec2 gate = DISK_C + gateDir * (HOLE_R_IN + 0.5 * (HOLE_R_OUT - HOLE_R_IN));\n  float Z = exp(zoom * log(0.42 / HOLE_SIZE));\n  vec2 centre = mix(gate, vec2(0.0), zoom);\n  vec2 q = gate + (uv - centre) / Z;\n  float portR = HOLE_SIZE * Z;\n  float maskR = zoom > 0.999 ? mix(0.42, 0.84, lensOpen) : portR;\n  float rPort = length(uv - centre);\n  bool inPort = zoom > 0.001 && rPort \u003c maskR;\n\n  // the disk: holes on a spiral, the one in the gate is the flying spot\n  float diskRot = GATE_A + TAU * scan;\n  float lineNow = floor(scan * HOLES);\n  float uNow = fract(scan * HOLES);\n  vec2 spot = vec2(mix(SCAN_LO.x, SCAN_HI.x, uNow), SCAN_HI.y - (lineNow + 0.5) / HOLES * (SCAN_HI.y - SCAN_LO.y));\n  vec2 gateHole = DISK_C + gateDir * (HOLE_R_IN + holeStep * lineNow);\n\n  vec3 col = vec3(0.0);\n  vec3 ro = vec3(0.0); vec3 rd = vec3(0.0, 0.0, -1.0);\n  float key = 1.0; float amb = 0.2; float pool = 1.0;\n  float mode = 0.0; // 0: 2D only, 1: studio ray, 2: receiver ray\n  float lineProf = 1.0; float trail = 1.0; float sampleY = 0.0; vec2 cam = vec2(0.0);\ , 0.27);\\n// into the gate (bar 3, second half): a rising band-passed noise\\nput(BUZZ, 3, 2, 1.98, { s: 'white', gain: 0.07, bandf: 600, bandq: 0.8, bpenv: 3, bpattack: 1.4, bpdecay: 0.1, bpsustain: 1, attack: 1.2, decay: 0.1, sustain: 0.9, release: 0.03, orbit: 9 });\\n// the lines melt (bar 10, middle): a short bright shimmer\\nput(BUZZ, 10, 1.5, 1.2, { s: 'white', gain: 0.05, bandf: 3500, bandq: 0.8, attack: 0.5, decay: 0.4, sustain: 0, release: 0.1, orbit: 9 });\\n// out of the gate (bar 15): a falling sweep\\nput(BUZZ, 15, 0, 3.6, { s: 'white', gain: 0.06, bandf: 2800, bandq: 0.7, bpenv: -3, bpattack: 0.1, bpdecay: 3.2, bpsustain: 0, attack: 0.05, decay: 3.3, sustain: 0, release: 0.1, orbit: 9 });\\n\\n$: play(KIT);\\n$: play(LOW);\\n$: play(KEYS);\\n$: play(HOOK);\\n$: play(BUZZ);\",\"bpm\":80,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.3333333333333333,\"cycles\":20,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    // One shared promise: the start-up preload below and an early
    // __renderStrudelOffline() call (captureStrudelRender only waits for the
    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');

        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();

      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);

          toggle.disabled = false;

    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {

      setTogglePlaying(false);

      setTogglePlaying(false);

    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);

      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
