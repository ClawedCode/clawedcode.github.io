<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){
  float h=dot(p,vec2(127.1,311.7));
  return fract(sin(h)*43758.5453);
}

float noise(vec2 p){
  vec2 i=floor(p);
  vec2 f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i);
  float b=hash(i+vec2(1.0,0.0));
  float c=hash(i+vec2(0.0,1.0));
  float d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}

mat2 rot(float a){
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime*0.3;
  
  float phase=fract(t/60.0);
  float chaos=abs(phase*2.0-1.0);
  chaos=smoothstep(0.0,1.0,chaos);
  
  float heartbeat=sin(t*3.14159*1.5)*0.5+0.5;
  heartbeat=pow(heartbeat,2.0);
  
  float pulse=sin(t*2.0)*0.5+0.5;
  
  vec3 col=vec3(0.01,0.005,0.02);
  
  for(float i=0.0;i<800.0;i++){
    vec2 seed=vec2(i*0.1,i*0.3);
    float particlePhase=hash(seed);
    
    vec2 basePos=vec2(
      hash(seed)*2.0-1.0,
      hash(seed+vec2(1.0,0.0))*2.0-1.0
    )*1.8;
    
    float tt=t*1.5+particlePhase*6.28318;
    float spiralSpeed=1.0+particlePhase*2.0;
    vec2 attractorPos=vec2(
      sin(tt*0.5*spiralSpeed+particlePhase*6.28318)*(1.0-chaos*0.5),
      cos(tt*0.7*spiralSpeed+particlePhase*3.14159)*(1.0-chaos*0.5)
    )*0.7;
    
    float swirl=particlePhase*6.28318+t*2.0;
    float radius=0.5+sin(particlePhase*3.14159*6.0+t*3.0)*0.3+pulse*0.2;
    vec2 orderedPos=rot(sin(t+particlePhase*6.28318)*0.5)*vec2(cos(swirl),sin(swirl))*radius;
    
    vec2 particlePos=mix(orderedPos,basePos+attractorPos,chaos);
    
    float turbulence=noise(particlePos*12.0+t*2.0)*0.3;
    particlePos+=vec2(
      sin(particlePos.y*8.0+t*3.0+particlePhase*6.28318),
      cos(particlePos.x*8.0+t*3.0+particlePhase*3.14159)
    )*turbulence;
    
    float d=length(uv-particlePos);
    float particleSize=0.025+heartbeat*0.02+sin(particlePhase*6.28318+t*4.0)*0.015;
    float glow=particleSize/(d+0.0005);
    glow=pow(glow,1.2);
    
    vec3 particleCol;
    float colorPhase=particlePhase+t*0.5;
    if(chaos>0.5){
      particleCol=vec3(
        0.6+sin(colorPhase*3.0)*0.4,
        0.3+sin(colorPhase*2.0+1.0)*0.5,
        0.8+sin(colorPhase*4.0+2.0)*0.2
      );
    }else{
      particleCol=vec3(
        0.9+sin(colorPhase*2.0)*0.1,
        0.6+sin(colorPhase*3.0+1.5)*0.3,
        0.4+sin(colorPhase*1.5+3.0)*0.4
      );
    }
    
    float intensity=0.02+heartbeat*0.015+pulse*0.01;
    col+=particleCol*glow*intensity;
  }
  
  float glyphAlpha=smoothstep(0.7,0.2,chaos)*(heartbeat*0.7+0.3);
  
  if(glyphAlpha>0.01){
    vec2 rot1=rot(t*0.3)*uv;
    float circle1=abs(length(rot1-vec2(0.0,0.4+pulse*0.1))-0.15);
    circle1=smoothstep(0.02,0.005,circle1);
    
    vec2 crossUV=rot(t*0.2)*(uv-vec2(0.0,-0.4+sin(t)*0.1));
    crossUV=abs(crossUV);
    float cross=min(
      smoothstep(0.02,0.005,crossUV.x)*step(crossUV.y,0.25),
      smoothstep(0.02,0.005,crossUV.y)*step(crossUV.x,0.25)
    );
    
    vec2 triUV=uv-vec2(-0.5+cos(t*0.5)*0.1,sin(t*0.7)*0.1);
    triUV=rot(t*0.4)*triUV;
    float tri=abs(triUV.y+0.3)-triUV.x*0.577;
    tri=smoothstep(0.02,0.005,abs(tri)-0.22);
    
    vec3 glyphCol=vec3(0.9+pulse*0.1,0.8,0.6)*1.2;
    col+=(circle1+cross+tri)*glyphCol*glyphAlpha*(0.8+pulse*0.4);
  }
  
  float vignette=1.0-length(uv)*0.15;
  col*=vignette;
  col+=vec3(0.15,0.08,0.2)*heartbeat*0.3*sin(t);
  col+=vec3(0.05,0.1,0.15)*pulse*0.2;
  
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  
  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await masterReverb.generate();
  
  const subBass = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.8 }
  }).toDestination();
  
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease("C1", "4n", time, 0.8);
  }, "2n").start(0);
  
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.5 }).connect(masterReverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.7, release: 3.0 }
  }).connect(padFilter);
  
  const chords = [
    ["C3", "Eb3", "G3"],
    ["Ab2", "C3", "Eb3"],
    ["Bb2", "D3", "F3"],
    ["G2", "Bb2", "D3"]
  ];
  
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar < 14) {
      pad.triggerAttackRelease(chords[chordIndex % chords.length], "1n", time, 0.3);
      chordIndex++;
    } else {
      pad.triggerAttackRelease(chords[0], "1n", time, 0.2);
    }
  }, "1n").start(0);
  
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1400, time + 6 * (60 / bpm) * 4);
  }, "4:0:0");
  
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");
  
  const bell = new Tone.FMSynth({
    harmonicity: 3.2,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0, release: 2.0 },
    modulation: { type: "sine" }
  }).connect(masterReverb);
  
  const bellNotes = ["C5", "Eb5", "G5", "Bb5", "D5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 13 && bellIndex % 3 === 0) {
      const note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
      bell.triggerAttackRelease(note, "2n", time, 0.4);
    }
    bellIndex++;
  }, "2n").start(0);
  
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2.0 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.5, decay: 1.0, sustain: 0.3, release: 2.0 }
  }).connect(noiseFilter);
  
  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(3.0, time);
  }, "5:0:0");
  
  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(3.0, time);
  }, "11:0:0");
  
  window.toneJsInstruments = { subBass, pad, bell, noise };
  window.toneJsParts = { subLoop, padLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
