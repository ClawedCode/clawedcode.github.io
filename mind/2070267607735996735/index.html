<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0), w = t * 0.10472;
    vec3 col = vec3(0.005, 0.003, 0.014);
    float r = length(uv);
    for (float i = 0.0; i < 5.0; i++) {
        float rp = fract(t * 0.05 + i * 0.2);
        float ring = smoothstep(0.012 + 0.008 * (1.0 - rp), 0.0, abs(r - rp * 1.5));
        col += (0.5 + 0.4 * cos(6.2832 * i * 0.18 + vec3(4.0, 2.0, 0.5))) * ring * (1.0 - rp) * (1.0 - rp) * 0.1;
    }
    vec2 z = uv * (2.5 + 0.6 * sin(w));
    float xings = 0.0, tMin = 100.0, tLay = 0.0;
    for (float i = 0.0; i < 8.0; i++) {
        z = abs(z) - (0.82 + 0.13 * sin(w * 2.0 + i * 0.85));
        z = rot(0.785 + 0.11 * sin(w * 3.0 + i * 0.55)) * z;
        float dx = abs(z.x), dy = abs(z.y), d = min(dx, dy);
        if (d < tMin) { tMin = d; tLay = i; }
        xings += smoothstep(0.08, 0.0, dx) * smoothstep(0.08, 0.0, dy) * exp(-i * 0.12);
        col += (0.5 + 0.4 * cos(6.2832 * (i * 0.12 + w * 0.16) + vec3(4.0, 2.0, 0.7))) * (0.003 / (d + 0.003)) * 0.04 * exp(-i * 0.1);
    }
    col += (0.6 + 0.4 * cos(6.2832 * (tLay * 0.13 + w * 0.08) + vec3(0.3, 0.7, 1.1))) * exp(-tMin * 12.0) * 0.18;
    float gOn = smoothstep(0.8, 0.95, sin(w * 7.0) * sin(w * 11.0) * sin(w * 19.0));
    col += vec3(0.5, 0.6, 1.0) * xings * gOn * 0.5;
    col = mix(col, col.gbr * 1.3, step(0.97, sin(uv.y * 70.0 + w * 40.0)) * gOn * 0.3);
    col += vec3(0.28, 0.2, 0.52) * exp(-r * 5.0) * (0.5 + 0.35 * sin(w * 2.0));
    col += vec3(0.08, 0.05, 0.18) * exp(-r * 1.5);
    col.r *= 1.0 + r * 0.06;
    col.b *= 1.0 + r * 0.03;
    col *= 1.0 - 0.25 * r;
    col = pow(1.0 - exp(-col * 2.8), vec3(0.87));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const reverb = new Tone.Reverb({ decay: 5.5, wet: 0.45 }).toDestination();
    await reverb.generate();
    const echoDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.52, wet: 0.4 }).connect(reverb);

    const bell = new Tone.FMSynth({
        harmonicity: 3.0, modulationIndex: 6,
        oscillator: { type: "sine" },
        envelope: { attack: 0.008, decay: 3.5, sustain: 0, release: 2.0 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 0.5 }
    }).connect(echoDelay);
    bell.volume.value = -10;

    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.5 }).connect(reverb);
    const padChorus = new Tone.Chorus({ frequency: 0.06, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(padFilter);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 2.5, decay: 1.0, sustain: 0.5, release: 3.5 }
    }).connect(padChorus);
    pad.volume.value = -16;

    const subFilter = new Tone.Filter({ type: "lowpass", frequency: 100 }).toDestination();
    const sub = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.5 }
    }).connect(subFilter);
    sub.volume.value = -12;

    const glitchFilter = new Tone.Filter({ type: "bandpass", frequency: 3500, Q: 2.5 }).connect(reverb);
    const glitch = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.01 }
    }).connect(glitchFilter);
    glitch.volume.value = -20;

    const pulse = new Tone.MembraneSynth({
        pitchDecay: 0.04, octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.1 }
    }).connect(reverb);
    pulse.volume.value = -22;

    const bellPats = [
        ["A4", "E5", "C5", "G5"],
        ["D5", "A5", "F5", "C6"],
        ["G4", "D5", "B4", "E5"],
        ["A4", "C5", "E5", "A5"]
    ];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        const sec = bar < 14 ? Math.min(Math.floor(bar / 4), 3) : 0;
        const play = bellIdx % 3 === 0 || (sec >= 1 && sec <= 2 && bellIdx % 2 === 0);
        if (play && bar < 15) {
            bell.triggerAttackRelease(bellPats[sec][bellIdx % 4], "2n", time, 0.22 + Math.random() * 0.1);
        }
        bellIdx++;
    }, "4n").start(0);

    const chords = [["A3", "C4", "E4"], ["D3", "F3", "A3"], ["E3", "G3", "B3"], ["F3", "A3", "C4"]];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 2 && bar < 14) {
            pad.triggerAttackRelease(chords[chordIdx % 4], "1n", time, 0.15);
        }
        chordIdx++;
    }, "1n").start(0);

    const subNotes = ["A1", "D1", "E1", "A1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 14) sub.triggerAttackRelease(subNotes[subIdx % 4], "1n", time, 0.35);
        subIdx++;
    }, "1n").start(0);

    const pulseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 1 && bar < 15) pulse.triggerAttackRelease("C1", "4n", time, 0.25);
    }, "1n").start(0);

    const glitchLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 4 && bar < 13 && Math.random() > 0.82) {
            glitch.triggerAttackRelease("32n", time, 0.25);
        }
    }, "8n").start(0);

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(1800, time + 8 * barLen);
    }, "4:0:0");
    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(500, time + 3 * barLen);
    }, "11:0:0");

    window.toneJsInstruments = { bell, pad, sub, glitch, pulse };
    window.toneJsParts = { bellLoop, padLoop, subLoop, glitchLoop, pulseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
