 stack(\\n  arrange(\\n    [2, silence],\\n    [2, slowSlides],\\n    [3, slides(\\\"x*4\\\")],\\n    [3, slides(\\\"x*8\\\")],\\n    [1, silence],\\n    [1, slides(\\\"x*4\\\")],\\n    [2, slowSlides],\\n    [4, silence],\\n    [2, slowSlides],\\n    [3, slides(\\\"x*4\\\")],\\n    [3, slides(\\\"x*8\\\")],\\n    [2, silence],\\n    [1, slides(\\\"x*4\\\")],\\n    [2, slowSlides],\\n    [1, silence]\\n  ),\\n  arrange(\\n    [4, silence],\\n    [6, silence],\\n    [4, bell(\\\"\u003c[~ ~ b5 ~] ~ ~ ~>\\\")],\\n    [4, bell(\\\"\u003c~ ~ [~ ~ ~ b5] ~>\\\").decay(1.45)],\\n    [5, silence],\\n    [3, silence],\\n    [2, bell(\\\"\u003c[~ ~ b5 ~] [~ ~ f5 ~]>\\\")],\\n    [4, stack(bell(\\\"\u003c~ ~ ~ [~ ~ b5 ~]>\\\").decay(1.45), swish.struct(\\\"\u003c~ ~ ~ [x ~ ~ ~]>\\\").hpf(3200).lpd(0.3).decay(0.3).gain(0.085))]\\n  )\\n)\\n\",\"bpm\":128,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.5333333333333333,\"cycles\":32,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
