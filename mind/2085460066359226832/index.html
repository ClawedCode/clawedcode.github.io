<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define PI 3.14159265359
#define TAU 6.28318530718
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1.0,0.0)),c=hash(i+vec2(0.0,1.0)),d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){
    v+=a*noise(p);
    p=p*2.02+vec2(17.3,9.1);
    a*=0.5;
  }
  return v;
}
vec2 curl(vec2 p,float ph){
  vec2 q=vec2(cos(ph),sin(ph))*1.7;
  float e=0.08;
  float n1=fbm(p+vec2(0.0,e)+q),n2=fbm(p-vec2(0.0,e)+q);
  float n3=fbm(p+vec2(e,0.0)-q),n4=fbm(p-vec2(e,0.0)-q);
  return vec2((n3-n4)/(2.0*e),-(n1-n2)/(2.0*e));
}
vec3 pal(float x){
  vec3 a=vec3(0.10,0.17,0.34),b=vec3(0.18,0.42,0.70),c=vec3(0.72,0.92,1.00);
  return mix(mix(a,b,smoothstep(0.0,0.7,x)),c,smoothstep(0.62,1.0,x));
}
float ring(vec2 p,float r,float w){
  return smoothstep(w,0.0,abs(length(p)-r));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0*TAU;
  float beat=pow(0.5+0.5*sin(iTime*70.0/60.0*TAU),8.0);
  vec2 drift=curl(uv*1.1,ph)*0.22;
  vec2 p=uv+drift;
  float v=fbm(p*1.7+vec2(cos(ph),sin(ph))*0.9);
  vec3 col=vec3(0.005,0.008,0.026)+pal(v)*0.08;
  float halo=exp(-length(uv)*2.1);
  col+=vec3(0.02,0.04,0.10)*halo;
  for(int i=0;i<14;i++){
    float fi=float(i);
    float a=fi*0.448799+ph*0.18;
    vec2 c=vec2(cos(a*1.7+sin(ph+fi)),sin(a*1.3+cos(ph-fi)))*0.18;
    float rr=0.12+fract(fi*0.381+ph/TAU)*1.12;
    float e=1.0-smoothstep(0.18,1.1,rr);
    float rw=0.010+0.012*e;
    float r=ring(p-c,rr,rw)*e;
    col+=pal(e)*r*(0.17+beat*0.05);
  }
  vec3 stream=vec3(0.0);
  for(int i=0;i<48;i++){
    float fi=float(i);
    float seed=fi/48.0;
    float ang=seed*TAU*7.0+ph*0.42;
    float rad=0.16+1.02*fract(seed*3.71+ph/TAU);
    vec2 pos=vec2(cos(ang),sin(ang))*rad;
    vec2 vel=curl(pos*1.4+seed,ph);
    pos+=vel*0.38;
    float age=fract(seed+ph/TAU);
    vec3 pc=pal(1.0-age);
    for(int j=0;j<4;j++){
      float fj=float(j);
      vec2 tp=pos-vel*fj*0.055;
      float d=length(uv-tp);
      float g=0.0018/(d*d+0.0016+fj*0.0009);
      stream+=pc*g*(1.0-fj*0.19)*(1.0-age*0.78);
    }
  }
  col+=stream;
  float silence=smoothstep(1.4,0.05,length(uv))*0.14;
  col=mix(col,vec3(0.004,0.005,0.018),smoothstep(0.72,1.42,length(uv))-silence);
  col+=vec3(0.03,0.09,0.18)*beat*halo;
  col=pow(col,vec3(0.88));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 70;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.02, release: 0.25 }).toDestination();
  const verb = new Tone.Reverb({ decay: 5.5, wet: 0.42 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.34, wet: 0.28 }).connect(verb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 520, Q: 0.8 }).connect(verb);
  const bellFilter = new Tone.Filter({ type: "highpass", frequency: 900 }).connect(delay);
  const lowBus = new Tone.Filter({ type: "lowpass", frequency: 140 }).connect(master);
  const pulse = new Tone.MembraneSynth({
    pitchDecay: 0.06,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.5, sustain: 0, release: 0.1 }
  }).connect(lowBus);
  pulse.volume.value = -12;
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.04, decay: 0.3, sustain: 0.35, release: 0.8 },
    filterEnvelope: { attack: 0.08, decay: 0.5, sustain: 0.2, baseFrequency: 55, octaves: 1.4 }
  }).connect(lowBus);
  bass.volume.value = -16;
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.4, decay: 0.6, sustain: 0.7, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -18;
  const bell = new Tone.FMSynth({
    harmonicity: 2.01,
    modulationIndex: 7,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.2, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(bellFilter);
  bell.volume.value = -14;
  const air = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.2, decay: 1.0, sustain: 0.25, release: 2.8 }
  }).connect(verb);
  air.volume.value = -28;
  const chords = [
    ["D3","A3","E4","F4"],
    ["Bb2","F3","C4","D4"],
    ["G2","D3","A3","C4"],
    ["A2","E3","B3","D4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const vel = bar < totalBars * 0.18 || bar >= totalBars * 0.82 ? 0.22 : 0.34;
    pad.triggerAttackRelease(chords[chordIndex % chords.length], "1m", time + H(14), vel);
    chordIndex++;
  }, "1m").start(0);
  const bassRoots = ["D1","D1","Bb0","A0","G0","A0"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.1 && bar < totalBars * 0.86) {
      const sparse = bar < totalBars * 0.34 || bar >= totalBars * 0.72;
      if (!sparse || bassIndex % 2 === 0) bass.triggerAttackRelease(bassRoots[bassIndex % bassRoots.length], "4n", time + H(8), sparse ? 0.32 : 0.44);
    }
    bassIndex++;
  }, "4n").start(0);
  let pulseIndex = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const body = bar >= totalBars * 0.2 && bar < totalBars * 0.78;
    if (pulseIndex % 4 === 0 || (body && pulseIndex % 7 === 3)) {
      pulse.triggerAttackRelease("D1", "8n", time + H(4), body ? 0.42 : 0.24);
      padFilter.frequency.setValueAtTime(body ? 900 : 520, time);
      padFilter.frequency.exponentialRampToValueAtTime(520, time + 0.45);
    }
    pulseIndex++;
  }, "8n").start(0);
  const scale = [0,2,5,7,9,12,14,17];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.16 && bar < totalBars * 0.8) {
      const dense = bar >= totalBars * 0.38 && bar < totalBars * 0.64;
      if (dense || bellIndex % 3 === 0) {
        const root = bar < totalBars * 0.52 ? 62 : 58;
        const drift = scale[(bellIndex * 5 + Math.floor(bar)) % scale.length];
        const note = Tone.Frequency(root + drift + (bellIndex % 5 === 0 ? 12 : 0), "midi");
        bell.triggerAttackRelease(note, dense ? "8n" : "4n", time + H(10), dense ? 0.28 : 0.18);
      }
    }
    bellIndex++;
  }, "8n").start(0);
  const airLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.18 || (bar >= totalBars * 0.62 && bar < totalBars * 0.82)) {
      air.triggerAttackRelease("2n", time + H(15), 0.16);
    }
  }, "2n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + totalBars * 0.34 * secPerBar);
  }, totalBars * 0.18 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(520, time + totalBars * 0.18 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { pulse, bass, pad, bell, air, verb, delay, padFilter, bellFilter, lowBus, master };
  window.toneJsParts = { pulseLoop, bassLoop, padLoop, bellLoop, airLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
