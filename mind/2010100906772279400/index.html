<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

float noise(vec3 p){
  vec3 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}

float fbm(vec3 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

float sdSphere(vec3 p,float r){return length(p)-r;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){
  vec3 pa=p-a,ba=b-a;
  float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  return length(pa-ba*h)-r;
}
float sdEllipsoid(vec3 p,vec3 r){
  float k0=length(p/r);
  float k1=length(p/(r*r));
  return k0*(k0-1.0)/k1;
}

float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}

vec3 ripple(vec3 p,float t){
  float phase=mod(t,75.0)/75.0;
  float wave1=sin(length(p.xz)*4.0-t*0.8)*0.15;
  float wave2=cos(p.y*3.0+t*0.5)*0.1;
  p.y+=wave1*smoothstep(0.0,0.4,phase);
  p.x+=wave2*smoothstep(0.1,0.5,phase);
  return p;
}

float sleepMembrane(vec3 p,float t){
  float phase=mod(t,75.0)/75.0;
  vec3 q=ripple(p,t);
  float warp=fbm(q*1.2+vec3(t*0.07,t*0.05,0.0))*0.6;
  q+=warp*cos(t*0.15);

  // Organic ellipsoid core instead of sphere
  float core=sdEllipsoid(q,vec3(0.7+0.1*sin(t*0.25),0.5+0.1*cos(t*0.3),0.6+0.08*sin(t*0.35)));
  float pulse=0.08*sin(t*0.4+length(q)*2.5);
  core+=pulse;

  // Capsule tendrils instead of torus rings
  vec3 r=q;
  r.xy=rot(t*0.06)*r.xy;
  r.yz=rot(t*0.04)*r.yz;
  float tend1=sdCapsule(r,vec3(-0.8,0.0,0.0),vec3(0.8+0.3*sin(t*0.2),0.4*cos(t*0.18),0.0),0.06);
  float tend2=sdCapsule(r,vec3(0.0,-0.7,0.0),vec3(0.3*sin(t*0.22),0.7+0.2*cos(t*0.25),0.4*sin(t*0.15)),0.05);
  float tend3=sdCapsule(r,vec3(0.0,0.0,-0.6),vec3(0.4*cos(t*0.17),0.3*sin(t*0.2),0.6+0.25*cos(t*0.23)),0.04);
  float tendrils=smin(tend1,smin(tend2,tend3,0.35),0.4);

  float merge=smoothstep(0.2,0.6,phase);
  float scatter=smoothstep(0.65,0.9,phase);

  float d=smin(core,tendrils,0.5+0.2*merge);

  // Drifting memory fragments instead of orbiting spheres
  for(int i=0;i<5;i++){
    float fi=float(i);
    float drift=fi*1.256+t*0.07;
    float wobble=sin(t*0.13+fi*2.0)*0.4;
    float rise=cos(t*0.09+fi*1.5)*0.5;
    vec3 fragPos=vec3(sin(drift)*1.1+wobble,rise+fi*0.15-0.3,cos(drift)*0.9);
    float fragSize=0.08+0.04*sin(t*0.2+fi);
    float stretch=1.0+scatter*fi*0.15;
    float frag=sdEllipsoid(q-fragPos*stretch,vec3(fragSize,fragSize*0.7,fragSize*1.2));
    d=smin(d,frag,0.3+scatter*0.2);
  }

  float dissolve=fbm(q*2.5+t*0.15)*scatter*0.3;
  d+=dissolve;

  return d;
}

vec3 getNormal(vec3 p,float t){
  vec2 e=vec2(0.001,0.0);
  return normalize(vec3(
    sleepMembrane(p+e.xyy,t)-sleepMembrane(p-e.xyy,t),
    sleepMembrane(p+e.yxy,t)-sleepMembrane(p-e.yxy,t),
    sleepMembrane(p+e.yyx,t)-sleepMembrane(p-e.yyx,t)
  ));
}

vec3 membranePalette(float t,float depth){
  // Warm amber/teal palette instead of purple
  vec3 a=vec3(0.5,0.45,0.4);
  vec3 b=vec3(0.35,0.3,0.25);
  vec3 c=vec3(0.8,1.1,1.0);
  vec3 d=vec3(0.1,0.2,0.3);
  vec3 base=a+b*cos(6.28318*(c*t+d));
  float phase=mod(depth,1.0);
  vec3 deep=vec3(0.08,0.1,0.12);
  vec3 surface=vec3(0.9,0.7,0.5);
  return mix(mix(base,deep,phase*0.4),surface,smoothstep(0.75,1.0,1.0-depth));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float phase=mod(t,75.0)/75.0;

  // Slower, gentler camera orbit
  float camDist=3.8+sin(t*0.07)*0.4;
  float camAngle=t*0.05;  // Slower orbit
  float camHeight=0.8+sin(t*0.09)*0.6;  // Lower, more intimate
  vec3 ro=vec3(cos(camAngle)*camDist,camHeight,sin(camAngle)*camDist);
  vec3 ta=vec3(0.0,0.1,0.0);
  vec3 ww=normalize(ta-ro);
  vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
  vec3 vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);

  // Warmer, darker background
  vec3 col=vec3(0.03,0.02,0.02);
  float bgGrad=length(uv)*0.5;
  col=mix(col,vec3(0.1,0.06,0.04),1.0-bgGrad);

  float totalDist=0.0;
  float glow=0.0;
  for(int i=0;i<80;i++){
    vec3 p=ro+rd*totalDist;
    float d=sleepMembrane(p,t);
    glow+=0.015/(0.1+abs(d));
    if(d<0.002){
      vec3 n=getNormal(p,t);
      vec3 lightDir=normalize(vec3(0.8,1.0,0.3));
      float diff=max(dot(n,lightDir),0.0);
      float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),24.0);
      float fresnel=pow(1.0-max(dot(n,-rd),0.0),2.5);
      float depthFactor=totalDist/10.0;
      vec3 baseCol=membranePalette(t*0.04+length(p)*0.08,depthFactor);
      float shift=fbm(p*1.8+t*0.08)*0.25;
      baseCol=mix(baseCol,membranePalette(t*0.08+shift,depthFactor),0.35);
      col=baseCol*(0.25+diff*0.75)+spec*0.4*vec3(1.0,0.85,0.7);
      col+=fresnel*vec3(0.3,0.5,0.6)*0.5;  // Teal fresnel
      float ao=1.0-smoothstep(0.0,0.5,sleepMembrane(p+n*0.1,t)*5.0);
      col*=0.7+0.3*ao;
      break;
    }
    if(totalDist>15.0)break;
    totalDist+=d*0.8;
  }

  // Amber/teal glow
  col+=glow*vec3(0.4,0.25,0.15)*0.12;
  float vignette=1.0-length(uv)*0.35;
  col*=vignette;
  col=pow(col,vec3(0.92));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 52;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  const dreamDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);
  const warpChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 8, depth: 0.6, wet: 0.4 }).connect(dreamDelay);
  warpChorus.start();

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.5 }).connect(warpChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -8;

  const padChords = [
    ["D3", "F3", "A3"],
    ["C3", "E3", "G3"],
    ["A2", "C3", "E3"],
    ["G2", "B2", "D3"],
    ["F2", "A2", "C3"],
    ["E2", "G2", "B2"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 20) {
      chordIndex = 0;
    }
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1m", time, 0.25);
    chordIndex++;
  }, "1m").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 20);
  }, "4:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 15);
  }, "16:0:0");

  const bellFilter = new Tone.Filter({ type: "highpass", frequency: 300 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" }
  }).connect(bellFilter);
  bell.volume.value = -12;

  const bellNotes = ["A4", "E5", "D5", "G4", "C5", "B4", "F4", "A5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 18 && bellIndex % 3 === 0) {
      const velocity = 0.2 + Math.random() * 0.15;
      bell.triggerAttackRelease(bellNotes[bellIndex % bellNotes.length], "2n", time, velocity);
    }
    bellIndex++;
  }, "2n").start(0);

  const driftSynth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.3, release: 2.0 }
  }).connect(warpChorus);
  driftSynth.volume.value = -18;

  const driftNotes = ["D4", "F4", "A4", "C5", "E4", "G4"];
  let driftIndex = 0;
  const driftLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 16 && Math.random() > 0.6) {
      driftSynth.triggerAttackRelease(driftNotes[Math.floor(Math.random() * driftNotes.length)], "4n", time, 0.15);
    }
    driftIndex++;
  }, "4n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 80 }).toDestination();
  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 0.3, sustain: 0.8, release: 1.5 }
  }).connect(subFilter);
  sub.volume.value = -10;

  const subNotes = ["D1", "C1", "A0", "G0"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 17) {
      sub.triggerAttackRelease(subNotes[subIndex % subNotes.length], "2m", time, 0.5);
    }
    subIndex++;
  }, "2m").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.5 }).connect(masterReverb);
  const breathNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.3, release: 4.0 }
  }).connect(noiseFilter);
  breathNoise.volume.value = -24;

  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(4000, time + 3);
    breathNoise.triggerAttackRelease(3.0, time);
  }, "8:0:0");
  Tone.Transport.schedule((time) => {
    noiseFilter.frequency.linearRampToValueAtTime(1500, time + 2);
    breathNoise.triggerAttackRelease(2.0, time);
  }, "12:0:0");

  window.toneJsInstruments = { pad, bell, driftSynth, sub, breathNoise };
  window.toneJsParts = { padLoop, bellLoop, driftLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
