<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float cycle = mod(t, 60.0) / 60.0;
    float breath = sin(cycle * 6.28318 * 2.0) * 0.5 + 0.5;
    float breathSlow = sin(cycle * 6.28318) * 0.5 + 0.5;

    float r = length(uv);
    float a = atan(uv.y, uv.x);

    float expand = 1.0 + breath * 0.3;
    vec2 warped = uv / expand;

    float warpStr = 0.15 + 0.1 * breathSlow;
    vec2 q = warped * 3.0 + vec2(t * 0.05);
    float warp1 = fbm(q);
    float warp2 = fbm(q + vec2(warp1 * warpStr + t * 0.02, warp1 * warpStr - t * 0.03));
    float warp3 = fbm(q + vec2(warp2 * warpStr * 1.5, warp2 * warpStr * 1.2 + t * 0.01));

    float pattern = warp3;

    float pulse = smoothstep(0.8, 0.0, r * (1.8 - breath * 0.6));

    float fractalDetail = 0.0;
    vec2 fp = uv * 4.0;
    float fa = 0.5;
    for(float i = 0.0; i < 4.0; i++) {
        float phase = t * 0.08 + i * 1.3;
        fp = abs(fp) / dot(fp, fp) - vec2(0.8 + 0.15 * sin(phase), 0.8 + 0.15 * cos(phase * 0.7));
        fractalDetail += fa * exp(-3.0 * abs(length(fp) - 0.5));
        fa *= 0.6;
    }

    float codePulse = fractalDetail * (0.3 + 0.4 * breath);

    vec3 inhaleCol = vec3(0.12, 0.08, 0.18);
    vec3 coreWarm = vec3(0.55, 0.28, 0.45);
    vec3 midTone = vec3(0.32, 0.18, 0.42);
    vec3 accentGlow = vec3(0.7, 0.4, 0.55);

    vec3 col = inhaleCol;
    col = mix(col, midTone, pattern * pulse);
    col = mix(col, coreWarm, smoothstep(0.4, 0.0, r) * breath * 0.7);
    col += accentGlow * codePulse * pulse * 0.5;

    float ring = abs(r - 0.3 - breath * 0.15);
    float ringGlow = exp(-ring * 12.0) * 0.25 * (0.6 + 0.4 * sin(a * 6.0 + t * 0.5));
    col += vec3(0.5, 0.25, 0.55) * ringGlow;

    float outerWave = sin(r * 20.0 - t * 2.0 - breath * 3.0) * 0.5 + 0.5;
    outerWave *= smoothstep(0.0, 0.2, r) * smoothstep(0.7, 0.3, r);
    col += vec3(0.15, 0.08, 0.25) * outerWave * (1.0 - breath) * 0.4;

    float vignette = 1.0 - smoothstep(0.3, 0.85, r);
    col *= vignette;

    col = pow(col, vec3(0.95));
    col += vec3(0.02, 0.01, 0.03);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.25, wet: 0.2 }).connect(masterReverb);
  const masterChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 5, depth: 0.6, wet: 0.35 }).connect(masterReverb);
  masterChorus.start();

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -10;

  const chords = [
    ["D3", "A3", "F4"],
    ["C3", "G3", "E4"],
    ["Bb2", "F3", "D4"],
    ["A2", "E3", "C4"],
    ["D3", "A3", "F4"],
    ["F3", "C4", "A4"],
    ["G3", "D4", "Bb4"],
    ["A3", "E4", "C5"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const idx = bar % chords.length;
    pad.triggerAttackRelease(chords[idx], "1n", time, 0.25);
    chordIdx++;
  }, "1n").start(0);

  const breathSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 2.0, sustain: 0.0, release: 1.0 }
  }).connect(masterReverb);
  breathSynth.volume.value = -16;

  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const notes = ["D4", "C4", "Bb3", "A3", "D4", "F4", "G4", "A4"];
    breathSynth.triggerAttackRelease(notes[bar % notes.length], "2n", time, 0.3);
  }, "2n").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 3.0, sustain: 0.0, release: 2.0 },
    modulation: { type: "sine" }
  }).connect(bellFilter);
  bell.volume.value = -20;

  const bellNotes = ["A4", "F5", "D5", "C5", "E5", "G5", "A5", "D5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 12) {
      if (Math.random() > 0.4) {
        bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.15 + Math.random() * 0.1);
      }
      bellIdx++;
    }
  }, "2n").start("0:2:0");

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 1.0, sustain: 0.4, release: 2.0 }
  }).toDestination();
  subBass.volume.value = -14;

  const subNotes = ["D2", "C2", "Bb1", "A1", "D2", "F2", "G2", "A2"];
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 1 && bar < 13) {
      subBass.triggerAttackRelease(subNotes[bar % subNotes.length], "1n", time, 0.35);
    }
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + barLen * 4);
  }, barLen * 2);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + barLen * 2);
  }, barLen * 11);

  window.toneJsInstruments = { pad, breathSynth, bell, subBass };
  window.toneJsParts = { padLoop, breathLoop, bellLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
