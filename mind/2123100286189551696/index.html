<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
// NOT THE BIRDS. Project Acoustic Kitty, 1960s: a microphone in the ear canal, a transmitter at the base of the skull, an antenna
// up the tail, and a second wire because the cat walked off when it was hungry. The whole frame is one amber eye. Inside its pupil
// a fluoroscope watches the wired cat walk, on a backbeat its own paws play, to a bench it has been told to listen to. The lead film markers carry the
// brief. Sixteen of those letters fall on sixteen sixteenths and leave a different instruction. What it attends to gets painted;
// what it does not stays a skeleton. The palette after the turn is only blue and yellow, the two channels a cat has.
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
document.body.style.margin = '0';
document.body.style.background = '#000';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
(function () {
  'use strict';
  const W = 900, H = 900, CX = 450, CY = 450;
  const DUR = 60, BPM = 96, BAR = 240 / BPM, BEAT = BAR / 4, SIX = BEAT / 4;
  const TAU = Math.PI * 2;
  const R0 = 372;            // the pupil at rest
  const G = 660;             // the cat's ground line
  const G2 = 590;            // the far side of the pavement, where the bench stands
  const STRIDE = 190;        // pixels per stride
  const STRIDE_T = BEAT * 2; // a hind paw lands on 1 and 3, the other on 2 and 4, the fore paws on the "and"s
  const V = STRIDE / STRIDE_T;

  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let z = a;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }
  // piecewise value over bars, eased between keys
  const keys = (table, b) => {
    if (b <= table[0][0]) return table[0][1];
    for (let i = 1; i < table.length; i++) {
      if (b <= table[i][0]) {
        const [b0, v0] = table[i - 1], [b1, v1] = table[i];
        return lerp(v0, v1, smooth(b0, b1, b));
      }
    }
    return table[table.length - 1][1];
  };

  const INK = (a) => `rgba(206,226,250,${a})`;
  const METAL = (a) => `rgba(255,255,255,${a})`;
  const PAL = {
    plate: '#04070e',
    sky: '#1d49b8', skyDeep: '#10286f', navy: '#0c1740', pale: '#8db2ea', cream: '#f4ead0',
    amber: '#e6a31c', lemon: '#ffd81f', ochre: '#c9a23a', black: '#08080d', farcat: '#171b33'
  };

  // ---------------------------------------------------------------- film densities
  function line(c, pts, a, w = 1) {
    c.strokeStyle = INK(a);
    c.lineWidth = w;
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
  }
  function disc(c, x, y, r, fa, sa = 0, w = 1) {
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
    if (fa) { c.fillStyle = INK(fa); c.fill(); }
    if (sa) { c.strokeStyle = INK(sa); c.lineWidth = w; c.stroke(); }
  }
  // A long bone: a dim medullary core between two bright cortical edges, with flared ends. Film adds, so overlaps brighten.
  function bone(c, ax, ay, bx, by, wa, ws, wb, i = 1) {
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
    const st = [[0, wa * 0.72], [0.05, wa], [0.16, lerp(wa, ws, 0.75)], [0.32, ws], [0.68, ws], [0.84, lerp(wb, ws, 0.75)], [0.95, wb], [1, wb * 0.72]];
    const left = st.map(([t, w]) => [ax + dx * t + nx * w, ay + dy * t + ny * w]);
    const right = st.map(([t, w]) => [ax + dx * t - nx * w, ay + dy * t - ny * w]);
    c.beginPath();
    c.moveTo(left[0][0], left[0][1]);
    for (let k = 1; k < left.length; k++) c.lineTo(left[k][0], left[k][1]);
    for (let k = right.length - 1; k >= 0; k--) c.lineTo(right[k][0], right[k][1]);
    c.closePath();
    c.fillStyle = INK(0.24 * i);
    c.fill();
    c.strokeStyle = INK(0.62 * i);
    c.lineWidth = 1.05;
    c.stroke();
    // cortex: the shaft's walls read denser than its ends
    c.strokeStyle = INK(0.5 * i);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(left[2][0], left[2][1]); c.lineTo(left[5][0], left[5][1]);
    c.moveTo(right[2][0], right[2][1]); c.lineTo(right[5][0], right[5][1]);
    c.stroke();
    // growth plates
    c.strokeStyle = INK(0.3 * i);
    c.lineWidth = 0.8;
    c.beginPath();
    c.moveTo(left[1][0], left[1][1]); c.lineTo(right[1][0], right[1][1]);
    c.moveTo(left[6][0], left[6][1]); c.lineTo(right[6][0], right[6][1]);
    c.stroke();
  }
  // Same-winding polygons so a single nonzero fill can union every part of a body without cancelling
  function addPoly(path, pts) {
    let area = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      area += p[0] * q[1] - q[0] * p[1];
    }
    const list = area < 0 ? pts.slice().reverse() : pts;
    path.moveTo(list[0][0], list[0][1]);
    for (let i = 1; i < list.length; i++) path.lineTo(list[i][0], list[i][1]);
    path.closePath();
  }
  function capsule(path, a, b, ra, rb) {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), pts = [];
    for (let i = 0; i <= 6; i++) { const th = ang + Math.PI / 2 + (i / 6) * Math.PI; pts.push([a[0] + Math.cos(th) * ra, a[1] + Math.sin(th) * ra]); }
    for (let i = 0; i <= 6; i++) { const th = ang - Math.PI / 2 + (i / 6) * Math.PI; pts.push([b[0] + Math.cos(th) * rb, b[1] + Math.sin(th) * rb]); }
    addPoly(path, pts);
  }
  function catmull(pts, n = 6, closed = true) {
    const out = [], N = pts.length;
    const lim = closed ? N : N - 1;
    for (let i = 0; i < lim; i++) {
      const p0 = pts[closed ? (i - 1 + N) % N : Math.max(0, i - 1)], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[closed ? (i + 2) % N : Math.min(N - 1, i + 2)];
      for (let j = 0; j < n; j++) {
        const u = j / n, u2 = u * u, u3 = u2 * u;
        out.push([
          0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    if (!closed) out.push(pts[N - 1]);
    return out;
  }
  const bez = (a, b, c, d, t) => {
    const m = 1 - t, m2 = m * m, t2 = t * t;
    return [m2 * m * a[0] + 3 * m2 * t * b[0] + 3 * m * t2 * c[0] + t2 * t * d[0], m2 * m * a[1] + 3 * m2 * t * b[1] + 3 * m * t2 * c[1] + t2 * t * d[1]];
  };

  // ---------------------------------------------------------------- the rig: one set of joints for bones, soft tissue and fur
  const L = { fem: 56, tib: 60, mt: 38, hum: 52, rad: 54, mc: 22 };
  function ik2(a, b, l1, l2, bend) {
    let dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
    const m = l1 + l2 - 0.01;
    if (d > m) { dx *= m / d; dy *= m / d; d = m; }
    const k = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - k * k));
    const ux = dx / d, uy = dy / d;
    return [a[0] + ux * k - uy * h * bend, a[1] + uy * k + ux * h * bend];
  }
  const POSE_KEYS = ['hx', 'hy', 'sx', 'sy', 'arch', 'bx', 'by', 'ba', 'jaw', 'ear', 'tH', 'tC', 'tW', 'tP', 'tL',
    'nhx', 'nhy', 'nhA', 'fhx', 'fhy', 'fhA', 'nfx', 'nfy', 'nfA', 'ffx', 'ffy', 'ffA', 'heart', 'slim'];
  function mixPose(a, b, k) {
    const out = {};
    for (const key of POSE_KEYS) out[key] = lerp(a[key], b[key], k);
    return out;
  }
  // one leg's walking foot: planted and locked to the ground during stance, an arc during swing
  function walkFoot(s, phase, base, duty, ground) {
    const phi = ((s - phase) % 1 + 1) % 1;
    const reach = STRIDE * duty / 2;
    if (phi < duty) return { x: base + reach - (phi / duty) * reach * 2, y: ground, stance: phi / duty, swing: 0, u: 0 };
    const u = (phi - duty) / (1 - duty), e = u * u * (3 - 2 * u);
    return { x: base - reach + e * reach * 2, y: ground - Math.sin(u * Math.PI) * 24, stance: 0, swing: 1, u };
  }
  function walkPose(s, cx) {
    const duty = 0.62;
    const hx = cx - 74, sx = cx + 76;
    const nh = walkFoot(s, 0, hx + 2, duty, G), nf = walkFoot(s, 0.25, sx + 10, duty, G);
    const fh = walkFoot(s, 0.5, hx + 2, duty, G), ff = walkFoot(s, 0.75, sx + 10, duty, G);
    const bob = Math.cos(s * TAU * 2);
    const hindA = (f) => (f.swing ? lerp(-0.1, 0.5, Math.pow(f.u, 1.2)) - Math.sin(f.u * Math.PI) * 0.9 : lerp(0.5, -0.1, f.stance));
    const foreA = (f) => (f.swing ? lerp(-0.55, 0.18, f.u) - Math.sin(f.u * Math.PI) * 0.55 : lerp(0.18, -0.55, f.stance));
    return {
      hx, hy: G - 113 + bob * 2.2, sx, sy: G - 114 - bob * 1.8, arch: 12,
      bx: sx + 50, by: G - 164 - bob * 1.4, ba: -0.1 + Math.sin(s * TAU * 2 + 0.6) * 0.012, jaw: 0, ear: 0,
      tH: Math.PI - 0.4, tC: 1.5, tW: 0.18, tP: s * TAU, tL: 0,
      nhx: nh.x, nhy: nh.y, nhA: hindA(nh), fhx: fh.x, fhy: fh.y, fhA: hindA(fh),
      nfx: nf.x, nfy: nf.y, nfA: foreA(nf), ffx: ff.x, ffy: ff.y, ffA: foreA(ff), heart: 0, slim: 1
    };
  }
  // Seated: hips on the ground, the spine rising to the withers, forelegs straight, a tail laid along the ground
  function sitPose(cx) {
    const hx = cx - 46, sx = cx + 34;
    return {
      hx, hy: G - 42, sx, sy: G - 128, arch: 22,
      bx: sx + 34, by: G - 206, ba: -0.2, jaw: 0, ear: 0,
      tH: Math.PI - 0.62, tC: 0.95, tW: 0.0, tP: 0, tL: 0,
      nhx: hx + 78, nhy: G, nhA: 1.28, fhx: hx + 88, fhy: G - 1, fhA: 1.28,
      nfx: sx + 8, nfy: G, nfA: 0.1, ffx: sx + 24, ffy: G, ffA: 0.1, heart: 0, slim: 1
    };
  }
  // A low stalk: the chest near the ground, the head out flat, the hips high and ready
  function stalkPose(cx, wig) {
    const hx = cx - 54 + wig * 6, sx = cx + 66;
    return {
      hx, hy: G - 98 - Math.abs(wig) * 3, sx, sy: G - 88, arch: 14,
      bx: sx + 56, by: G - 118, ba: -0.1, jaw: 0, ear: 0,
      tH: Math.PI - 0.34, tC: 0.9, tW: 0.3, tP: wig * 2, tL: 0,
      nhx: hx + 52, nhy: G, nhA: 0.95, fhx: hx + 70, fhy: G, fhA: 0.95,
      nfx: sx + 34, nfy: G, nfA: 0.42, ffx: sx + 60, ffy: G, ffA: 0.42, heart: 0, slim: 0.94
    };
  }
  // A bound, one stride per beat: hinds land together under the belly, the spine opens, the fores reach and land, the spine closes.
  function gallopPose(g, cx) {
    const open = Math.cos((g - 0.42) * TAU);         // +1 fully extended, -1 gathered
    const half = 76 + open * 26;
    const lift = 24 + 7 * Math.cos((g - 0.4) * TAU) + 5 * Math.cos((g - 0.9) * TAU);
    const hx = cx - half, sx = cx + half;
    const hy = G - 108 - lift - Math.max(0, open) * 6, sy = G - 104 - lift + Math.max(0, -open) * 8;
    const stance = (ph, a, b, front, rear, liftH) => {
      const u = ((ph - a) % 1 + 1) % 1, span = ((b - a) % 1 + 1) % 1;
      if (u < span) return [lerp(front, rear, u / span), G];
      const w = (u - span) / (1 - span), e = w * w * (3 - 2 * w);
      return [lerp(rear, front, e), G - Math.sin(w * Math.PI) * liftH];
    };
    const nh = stance(g, 0.0, 0.24, hx + 104, hx - 62, 30), fh = stance(g, 0.06, 0.30, hx + 112, hx - 54, 30);
    const nf = stance(g, 0.48, 0.70, sx + 94, sx - 76, 34), ff = stance(g, 0.54, 0.76, sx + 106, sx - 64, 34);
    return {
      hx, hy, sx, sy, arch: -open * 24 + 4,
      bx: sx + 62, by: sy - 46 - open * 4, ba: -0.1 + open * 0.08, jaw: 0, ear: 0,
      tH: Math.PI + 0.1 + open * 0.2, tC: 0.5 - open * 0.5, tW: 0.1, tP: g * TAU, tL: 0,
      nhx: nh[0], nhy: nh[1], nhA: nh[1] < G - 1 ? -0.35 : 0.55,
      fhx: fh[0], fhy: fh[1], fhA: fh[1] < G - 1 ? -0.35 : 0.55,
      nfx: nf[0], nfy: nf[1], nfA: nf[1] < G - 1 ? -0.5 : 0.05,
      ffx: ff[0], ffy: ff[1], ffA: ff[1] < G - 1 ? -0.5 : 0.05, heart: 0, slim: 0.78
    };
  }
  // The reach: at the top of the leap the whole cat is one vertical line, paws up, hind legs and tail straight down
  function reachPose(cx, cy) {
    const hx = cx - 40, sx = cx + 36;
    return {
      hx, hy: cy + 56, sx, sy: cy - 60, arch: -14,
      bx: sx + 22, by: cy - 124, ba: -1.12, jaw: 0.55, ear: 0,
      tH: 2.0, tC: 2.2, tW: 0.24, tP: 1.4, tL: 0,
      nhx: cx - 138, nhy: cy + 146, nhA: -2.2, fhx: cx - 46, fhy: cy + 186, fhA: -2.7,
      nfx: cx + 136, nfy: cy - 116, nfA: 2.2, ffx: cx + 34, ffy: cy - 196, ffA: 3.0, heart: 0, slim: 0.8
    };
  }

  function solve(P) {
    const J = {};
    J.H = [P.hx, P.hy];
    J.S = [P.sx, P.sy];
    const d = Math.hypot(P.sx - P.hx, P.sy - P.hy) || 1;
    const u = [(P.sx - P.hx) / d, (P.sy - P.hy) / d], n = [u[1], -u[0]];
    J.u = u; J.n = n; J.d = d;
    const loc = (o, a, b) => [o[0] + u[0] * a + n[0] * b, o[1] + u[1] * a + n[1] * b];
    J.loc = loc;
    // spine, sacrum to withers
    const sac = loc(J.H, -6, 28), t1 = loc(J.S, -10, 48);
    const c1 = [sac[0] + u[0] * d * 0.33 + n[0] * P.arch, sac[1] + u[1] * d * 0.33 + n[1] * P.arch];
    const c2 = [t1[0] - u[0] * d * 0.33 + n[0] * P.arch * 0.6, t1[1] - u[1] * d * 0.33 + n[1] * P.arch * 0.6];
    J.sac = sac; J.t1 = t1;
    J.spine = [];
    for (let i = 0; i <= 20; i++) J.spine.push(bez(sac, c1, c2, t1, i / 20));
    // neck
    const ba = P.ba, hd = [Math.cos(ba), Math.sin(ba)];
    J.B = [P.bx, P.by];
    const nc1 = [t1[0] + u[0] * 16 + n[0] * 4, t1[1] + u[1] * 16 + n[1] * 4];
    const nc2 = [P.bx - hd[0] * 26 + hd[1] * 6, P.by - hd[1] * 26 - hd[0] * 6];
    J.neck = [];
    for (let i = 0; i <= 8; i++) J.neck.push(bez(t1, nc1, nc2, J.B, i / 8));
    J.ba = ba;
    // legs
    const hind = (toeX, toeY, A) => {
      const hock = [toeX - Math.sin(A) * L.mt, toeY - Math.cos(A) * L.mt];
      const knee = ik2(J.H, hock, L.fem, L.tib, -1);
      return { hip: J.H, knee, hock, toe: [toeX, toeY], A };
    };
    const fore = (toeX, toeY, A) => {
      const wrist = [toeX - Math.sin(A) * L.mc, toeY - Math.cos(A) * L.mc];
      const elbow = ik2(J.S, wrist, L.hum, L.rad, 1);
      return { shoulder: J.S, elbow, wrist, toe: [toeX, toeY], A };
    };
    J.nh = hind(P.nhx, P.nhy, P.nhA);
    J.fh = hind(P.fhx, P.fhy, P.fhA);
    J.nf = fore(P.nfx, P.nfy, P.nfA);
    J.ff = fore(P.ffx, P.ffy, P.ffA);
    // tail, built forward from the sacrum
    J.tail = [loc(J.H, -30, 20)];
    let h = P.tH;
    const N = 20;
    for (let i = 0; i < N; i++) {
      const f = i / (N - 1), seg = lerp(11.5, 6.4, f);
      h = P.tH + P.tC * f + P.tW * Math.sin(P.tP + f * 3.4) * (0.3 + f) + P.tL * f * f * f;
      const p = J.tail[J.tail.length - 1];
      J.tail.push([p[0] + Math.cos(h) * seg, p[1] + Math.sin(h) * seg]);
    }
    // skull-space to frame
    const hs = 1;
    J.toFrame = (x, y) => [P.bx + (hd[0] * x - hd[1] * y) * hs, P.by + (hd[1] * x + hd[0] * y) * hs];
    J.ear = J.toFrame(4, -14);
    J.eye = J.toFrame(34, -6);
    J.mouth = J.toFrame(56, 8);
    J.P = P;
    return J;
  }

  // ---------------------------------------------------------------- soft tissue: the same outline is flesh on film and fur in daylight
  function softPaths(J) {
    const P = J.P, near = new Path2D(), far = new Path2D();
    const offs = [6, -5];
    const leg = (path, jt, o, kind) => {
      const off = (p) => [p[0] + o[0], p[1] + o[1]];
      if (kind === 'hind') {
        capsule(path, off(jt.hip), off(jt.knee), 27 * P.slim, 15 * P.slim);
        capsule(path, off(jt.knee), off(jt.hock), 14, 6.5);
        capsule(path, off(jt.hock), off(jt.toe), 6, 7);
        const t = off(jt.toe);
        addPoly(path, catmull([[t[0] - 9, t[1] - 5], [t[0] + 5, t[1] - 7], [t[0] + 14, t[1] - 2], [t[0] + 10, t[1] + 1], [t[0] - 8, t[1] + 1]], 3));
      } else {
        capsule(path, off(jt.shoulder), off(jt.elbow), 22 * P.slim, 13 * P.slim);
        capsule(path, off(jt.elbow), off(jt.wrist), 11.5, 6.5);
        capsule(path, off(jt.wrist), off(jt.toe), 6.5, 7);
        const t = off(jt.toe);
        addPoly(path, catmull([[t[0] - 8, t[1] - 5], [t[0] + 5, t[1] - 7], [t[0] + 13, t[1] - 2], [t[0] + 9, t[1] + 1], [t[0] - 8, t[1] + 1]], 3));
      }
    };
    leg(far, J.fh, offs, 'hind');
    leg(far, J.ff, offs, 'fore');
    leg(near, J.nh, [0, 0], 'hind');
    leg(near, J.nf, [0, 0], 'fore');

 + 0.04, six % 4 === 2 ? 'oh' : 'hh', LN, 0, (six % 4 === 2 ? 0.085 : 0.12) * (i % 2 && hats === 16 ? 0.62 : 1), six % 4 === 2 ? { cut: 1 } : { cut: 1 });\\n  }\\n};\\nfor (const bar of [14, 15, 18, 19]) fullBar(bar, bar >= 18 ? { hats: 16, kicks: [0, 8] } : {});\\nfullBar(16, { kicks: [0, 8], hats: 16 });\\nfullBar(17, { kicks: [0, 8], hats: 16 });\\n// the wiggle before the launch: sixteenths on the shaker, in time with the hips\\nfor (let i = 0; i \u003c 10; i++) drum(KIT, 15, 1.5 + i / 4, 'sh', LN, 0, 0.1 + i * 0.012);\\n// the drop\\ndrum(KIT, 14, 0.02, 'cr', LN, 0, 0.17);\\ndrum(KIT, 16, 0.02, 'cr', LN, 0, 0.13);\\n// the gallop: a flam on every eighth, hinds then fores, from the bound's own stance table\\nfor (let bb = 16.25; bb \u003c 20.25; bb += 0.25) {\\n  const bar = Math.floor(bb), beat = (bb - bar) * 4;\\n  drum(KIT, bar, beat + 0.045, 'lt', LN, 0, 0.12);\\n  drum(KIT, bar, beat + 0.105, 'lt', LN, 0, 0.065);\\n  drum(KIT, bar, beat + 0.48, 'mt', LN, 0, 0.1);\\n  drum(KIT, bar, beat + 0.54, 'mt', LN, 0, 0.05);\\n}\\n// a pushed fill into the taxi\\n[0, 2, 4, 6, 8, 10, 11, 12, 13, 14, 15].forEach((six) => drum(KIT, 19, 2 + six / 8, 'sd', LN, 0, 0.07 + six * 0.006));\\n// the horn stops the kit; only a cymbal climbs under the leap\\nfor (let i = 0; i \u003c 4; i++) drum(KIT, 20, i * 0.25, i % 2 ? 'rim' : 'bd', LN, 0, 0.17);\\nput(BAND, 20, 1, 2.96, { s: 'white', gain: 0.05, hcutoff: 3000, bandf: 1800, bandq: 0.3, bpenv: 3, bpattack: 1.8, bpdecay: 0.1, bpsustain: 1, attack: 1.8, decay: 0.1, sustain: 0.9, release: 0.02, orbit: 5 });\\nput(BAND, 21, 0, 3.96, { s: 'white', gain: 0.1, bandf: 3800, bandq: 0.3, attack: 0.3, decay: 0.1, sustain: 0.9, release: 0.02, orbit: 5 });\\n// the pulse under the air, tightening to the hit\\nfor (let i = 0; i \u003c 16; i++) drum(KIT, 21, i / 4, 'sh', LN, 0, 0.09 + i * 0.008);\\n[0, 2, 4, 6, 8, 10, 12, 13, 14, 15].forEach((six) => {\\n  drum(KIT, 21, six / 4, 'bd', LN, 0, 0.14 + six * 0.009);\\n  put(KIT, 21, six / 4, 0.2, { s: 'sine', freq: 56, penv: 20, pattack: 0.001, pdecay: 0.04, psustain: 0, attack: 0.002, decay: 0.12, sustain: 0, release: 0.02, gain: 0.07 + six * 0.006, orbit: 1 });\\n});\\n// the hit\\ndrum(KIT, 22, 0, 'bd', LN, 0, 0.21);\\ndrum(KIT, 22, 0.03, 'cr', LN, 0, 0.15);\\ndrum(KIT, 22, 0.05, 'sd', LN, 0, 0.13);\\n\\n$: play(KIT);\\n$: play(LOW);\\n$: play(MEN);\\n$: play(BIRD);\\n$: play(BAND);\",\"bpm\":96,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.4,\"cycles\":24,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    // One shared promise: the start-up preload below and an early
    // __renderStrudelOffline() call (captureStrudelRender only waits for the
    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });
      }
      return initPromise;
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);

    let playStartedAt = null;

      await ensureInit();
      await S.evaluate(CONFIG.code, true);

        ? S.getAudioContext()

      playStartedAt = performance.now();

      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        CONFIG.offlineMaxPolyphony,
        false,
        'clawedcode-strudel'

      return true;

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;

    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and

    window.addEventListener('message', event => {

      setTogglePlaying(false);

  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);

    window._errors.push('strudel init failed: ' + window.strudelError);

      toggle.dataset.strudelPlaying = '0';
