<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime * 0.15;
  
  float breathCycle = sin(t * 0.8) * 0.5 + 0.5;
  float coherence = smoothstep(0.2, 0.8, breathCycle);
  
  vec3 col = vec3(0.02, 0.01, 0.03);
  float totalGlow = 0.0;
  
  int numParticles = 1200;
  
  for(int i = 0; i < 1200; i++) {
    float fi = float(i);
    float phase = hash(vec2(fi * 0.1, fi * 0.3)) * 6.28318;
    
    vec2 basePos = vec2(
      hash(vec2(fi * 0.7, fi * 0.2)) * 2.0 - 1.0,
      hash(vec2(fi * 0.4, fi * 0.9)) * 2.0 - 1.0
    ) * 1.8;
    
    float chaosX = noise(vec2(fi * 0.03, t * 0.5)) * 2.0 - 1.0;
    float chaosY = noise(vec2(fi * 0.05, t * 0.3 + 10.0)) * 2.0 - 1.0;
    vec2 chaosPos = basePos + vec2(chaosX, chaosY) * 0.6;
    
    float gridX = mod(fi, 20.0) / 20.0 * 2.0 - 1.0;
    float gridY = floor(fi / 20.0) / 60.0 * 2.0 - 1.0;
    float waveOffset = sin(gridX * 8.0 + t * 2.0) * 0.3;
    vec2 orderPos = vec2(gridX * 1.2, gridY * 1.5 + waveOffset);
    
    vec2 p = mix(chaosPos, orderPos, coherence);
    
    float d = length(uv - p);
    float size = 0.015 + coherence * 0.01;
    float glow = size / (d * d * 80.0);
    
    float velocity = length(chaosPos - orderPos);
    float hue = phase + velocity * 3.0 + t * 0.5;
    
    vec3 pCol = vec3(
      0.5 + 0.5 * sin(hue),
      0.5 + 0.5 * sin(hue + 2.09),
      0.5 + 0.5 * sin(hue + 4.19)
    );
    
    pCol = mix(
      vec3(0.6, 0.3, 0.8),
      vec3(0.2, 0.7, 0.9),
      coherence
    );
    
    float brightness = mix(0.4, 1.0, coherence);
    col += pCol * glow * brightness;
    totalGlow += glow;
  }
  
  col = pow(col, vec3(0.85));
  col += vec3(0.15, 0.05, 0.2) * (1.0 - coherence) * 0.3;
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 82;
  Tone.Transport.bpm.value = bpm;
  
  const masterReverb = new Tone.Reverb({ decay: 2.8, wet: 0.25 }).toDestination();
  await masterReverb.generate();
  
  const compressor = new Tone.Compressor({ threshold: -22, ratio: 8, attack: 0.005, release: 0.18 }).toDestination();
  
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.04 }
  }).toDestination();
  
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14) {
      kick.triggerAttackRelease("C1", "8n", time, 0.9);
      compressor.threshold.setValueAtTime(-32, time);
      compressor.threshold.exponentialRampToValueAtTime(-22, time + 0.18);
    }
  }, "4n").start(0);
  
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.5 }).connect(compressor);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.15, sustain: 0, release: 0.08 },
    filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0, baseFrequency: 100, octaves: 2.5 }
  }).connect(bassFilter);
  
  const bassPattern1 = ["C2", "C2", "G1", "G1"];
  const bassPattern2 = ["C2", "D#2", "G1", "A#1", "C2", "F1", "G1", "D#2"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 14) {
      let pattern = (bar >= 6 && bar < 12) ? bassPattern2 : bassPattern1;
      bass.triggerAttackRelease(pattern[bassIndex % pattern.length], "8n", time, 0.85);
      bassIndex++;
    }
  }, "8n").start(0);
  
  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.8 }).connect(compressor);
  const arp = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.002, decay: 0.1, sustain: 0, release: 0.06 }
  }).connect(arpFilter);
  
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 12) {
      const scale = [0, 3, 7, 10, 12, 15, 19, 22];
      const rootMidi = 60;
      const degree = scale[arpIndex % scale.length];
      const note = Tone.Frequency(rootMidi + degree, "midi");
      const velocity = 0.5 + Math.sin(arpIndex * 0.3) * 0.2;
      arp.triggerAttackRelease(note, "16n", time, velocity);
      arpIndex++;
    }
  }, "16n").start(0);
  
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2200, time + 6 * (60 / bpm) * 4);
  }, "4:0:0");
  
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(600, time + 2 * (60 / bpm) * 4);
  }, "12:0:0");
  
  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(masterReverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).connect(padChorus);
  
  const padChords = [
    ["C3", "G3", "C4"],
    ["D#3", "A#3", "D#4"],
    ["G3", "D4", "G4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const velocity = (bar >= 4 && bar < 12) ? 0.22 : 0.12;
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "2n", time, velocity);
    chordIndex++;
  }, "2n").start(0);
  
  const bell = new Tone.FMSynth({
    harmonicity: 4.2,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.8, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(masterReverb);
  
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 11 && bellIndex % 4 < 1) {
      const notes = ["C5", "G5", "D#5", "A#4"];
      const note = notes[Math.floor(bellIndex / 4) % notes.length];
      bell.triggerAttackRelease(note, "4n", time, 0.3);
    }
    bellIndex++;
  }, "4n").start(0);
  
  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.6, decay: 0.4, sustain: 0, release: 0.8 }
  }).connect(noiseHPF);
  
  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(3500, time + 1.2);
    noise.triggerAttackRelease(1.2, time);
  }, "5:3:0");
  
  window.toneJsInstruments = { kick, bass, arp, pad, bell, noise };
  window.toneJsParts = { kickLoop, bassLoop, arpLoop, padLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
