<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(float n){return fract(sin(n)*43758.5453);}

vec3 pal(float ph,float d){
    vec3 indigo=vec3(0.22,0.1,0.58);
    vec3 teal=vec3(0.1,0.7,0.6);
    vec3 b=mix(indigo,teal,max(sin(ph*3.14159),0.0));
    return b*(1.0-clamp(d,0.0,1.0)*0.6);
}

float lattice(vec3 p,float t){
    float d=1e10,sc=1.0,br=sin(t*0.8)*0.12;
    for(float i=0.0;i<6.0;i++){
        p=abs(p)-vec3(1.15+br+sin(t*0.35+i*1.1)*0.04,1.1+br+cos(t*0.28+i*0.9)*0.05,1.2+br+sin(t*0.31+i*1.4)*0.03);
        p.xy=rot(0.785+sin(t*0.22+i*0.7)*0.07)*p.xy;
        p.yz=rot(0.524+cos(t*0.16+i*1.3)*0.05)*p.yz;
        float spike=pow(max(0.0,sin(t*2.5+i*2.618+hash(i*7.3)*6.28)),12.0);
        d=min(d,length(p)/sc-(0.09+spike*0.14+br*0.25));
        p*=2.15;sc*=2.15;
    }
    return d;
}

float map(vec3 p){return lattice(p,iTime);}

vec3 nrm(vec3 p){
    vec2 e=vec2(0.002,0.0);
    return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime,ph=mod(t,60.0)/60.0;
    float ca=t*0.09;
    vec3 ro=vec3(sin(ca)*5.5,sin(t*0.065)*1.5,cos(ca)*5.5);
    vec3 fw=normalize(-ro),rt=normalize(cross(vec3(0,1,0),fw)),up=cross(fw,rt);
    vec3 rd=normalize(fw*1.5+rt*uv.x+up*uv.y);
    vec3 col=vec3(0.015,0.008,0.045),glow=vec3(0.0);
    float td=0.2,ht=0.0;
    for(float i=0.0;i<100.0;i++){
        vec3 p=ro+rd*td;
        float d=map(p),g=0.004/(0.004+d*d);
        float c1=sin(length(p)*2.0+t*1.4)*0.5+0.5;
        float c2=pow(max(0.0,sin(length(p.xz)*3.0-t*2.3)),6.0);
        float c3=sin(dot(p,vec3(0.7,0.5,0.3))+t*0.6)*0.5+0.5;
        vec3 gc=pal(ph+sin(length(p)*0.3)*0.15,td/25.0);
        gc=gc*(0.6+c1*0.4)+vec3(0.9,0.4,0.12)*c2*0.35+vec3(0.35,0.55,0.8)*c3*0.15;
        glow+=gc*g;
        if(d<0.002){ht=1.0;break;}
        td+=d;
        if(td>25.0)break;
    }
    if(ht>0.5){
        vec3 p=ro+rd*td,n=nrm(p),l=normalize(vec3(1,1,-0.5));
        float df=max(dot(n,l),0.0),sp=pow(max(dot(reflect(rd,n),l),0.0),24.0);
        float fr=pow(1.0-max(dot(-rd,n),0.0),3.0);
        vec3 sc=pal(ph,0.0);
        col=sc*(df*0.8+0.25)+vec3(0.65,0.8,0.9)*sp*0.45+pal(ph+0.5,0.0)*fr*0.4;
        col=mix(vec3(0.015,0.008,0.045),col,exp(-td*0.07));
    }
    col+=glow*0.03;
    col+=vec3(0.06,0.12,0.18)*step(0.988,sin(uv.y*80.0+t*11.0))*hash(floor(t*14.0)+floor(uv.y*40.0)*13.0);
    float bd=smoothstep(0.0,0.012,abs(sin(uv.y*18.0+t*2.5+sin(t*6.0)*4.0)));
    col=mix(col+vec3(0.015,0.03,0.05),col,bd);
    col*=(1.0-dot(uv,uv)*0.35)*(0.95+sin(t*0.8)*0.05);
    col=col/(1.0+col);
    col=pow(col,vec3(0.88));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  const masterComp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).toDestination();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.0 }).connect(masterComp);
  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.6, release: 2.0 },
    volume: -14
  }).connect(padChorus);

  const chords = [
    ["A2", "E3", "B3", "D4"],
    ["F2", "C3", "A3", "E4"],
    ["G2", "D3", "B3", "D4"],
    ["E2", "B2", "G3", "B3"],
    ["A2", "E3", "C4", "E4"],
    ["F2", "C3", "G3", "C4"],
    ["D2", "A2", "F3", "A3"],
    ["E2", "B2", "E3", "G3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 17) return;
    pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time + H(12), 0.18 + (bar < 12 ? bar * 0.008 : (17 - bar) * 0.02));
    chordIdx++;
  }, "1n").start(0);

  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, rolloff: -24 }).connect(masterComp);
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.3, decay: 0.5, sustain: 0.4, release: 1.0 },
    volume: -10
  }).connect(subFilter);

  const subNotes = ["A1", "F1", "G1", "E1", "A1", "D1", "F1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 1 || bar >= 16) return;
    sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "2n", time + H(8), 0.6);
    subIdx++;
  }, "1n").start(0);

  const pulseInst = new Tone.MembraneSynth({
    pitchDecay: 0.05, octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 0.3 },
    volume: -18
  }).connect(masterComp);

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 15) {
      pulseInst.triggerAttackRelease("C1", "2n", time + H(5), 0.4);
    }
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "bandpass", frequency: 2200, Q: 0.8 }).connect(delay);
  const bell = new Tone.FMSynth({
    harmonicity: 4.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.5, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    volume: -16
  }).connect(bellFilter);

  const spikeNotes = ["E5", "B4", "G5", "D5", "A4", "C5", "F5", "E4", "A5", "G4"];
  let spikeIdx = 0;
  const spikeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 15) return;
    const density = bar < 8 ? 0.25 : (bar < 12 ? 0.45 : 0.2);
    if (Math.random() < density) {
      bell.triggerAttackRelease(spikeNotes[spikeIdx % spikeNotes.length], "4n", time + H(15), 0.35 + Math.random() * 0.25);
      spikeIdx++;
    }
  }, "4n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 1000, Q: 1.5 }).connect(masterReverb);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.15, sustain: 0, release: 0.1 },
    volume: -20
  }).connect(arpFilter);

  const scale = [57, 59, 60, 62, 64, 65, 67, 69, 71, 72, 74, 76];
  let arpStep = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 14) return;
    const progress = (bar - 4) / 10;
    if (Math.random() < 0.25 + progress * 0.4) {
      const root = chords[Math.floor(bar / 2) % chords.length][0];
      const rootMidi = Tone.Frequency(root).toMidi();
      const degree = scale[arpStep % scale.length];
      const octShift = Math.random() > 0.7 ? 12 : 0;
      arp.triggerAttackRelease(Tone.Frequency(degree + octShift, "midi"), "16n", time + H(10), 0.25 + progress * 0.2);
    }
    arpStep++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 7 * barLen);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
  }, "13:0:0");
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(3200, time + 5 * barLen);
  }, "5:0:0");
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(800, time + 3 * barLen);
  }, "12:0:0");

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 300, Q: 0.5 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 },
    volume: -28
  }).connect(noiseFilter);

  Tone.Transport.schedule((time) => { noise.triggerAttackRelease(3.0, time); }, "3:0:0");
  Tone.Transport.schedule((time) => { noise.triggerAttackRelease(4.0, time); }, "7:0:0");

  window.toneJsInstruments = { pad, sub, pulseInst, bell, arp, noise };
  window.toneJsParts = { padLoop, subLoop, pulseLoop, spikeLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
