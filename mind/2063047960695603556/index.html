<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) {
  return fract(sin(n) * 43758.5453);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  vec3 col = vec3(0.01, 0.01, 0.02);
  
  float t = iTime * 0.15;
  
  float cycle = mod(t, 1.0);
  float coherence = sin(cycle * 3.14159);
  coherence = smoothstep(0.0, 1.0, coherence);
  
  float pattern = 0.0;
  
  for(int i = 0; i < 12; i++) {
    float fi = float(i);
    
    float angle = fi * 0.52359 + coherence * fi * 0.1;
    float radius = 0.6 + hash(fi) * 0.3 * (1.0 - coherence);
    vec2 source = vec2(cos(angle), sin(angle)) * radius;
    
    float dist = length(uv - source);
    
    float baseFreq = 12.0;
    float randomFreq = hash(fi) * 8.0;
    float freq = mix(baseFreq + randomFreq, baseFreq, coherence);
    
    float randomPhase = hash(fi + 10.0) * 6.28;
    float syncPhase = t * 4.0;
    float phase = mix(randomPhase, syncPhase, coherence);
    
    pattern += sin(dist * freq - phase) / (1.0 + dist * 2.0);
  }
  
  pattern *= 0.3;
  
  float intensity = abs(pattern);
  
  vec3 chaosColor = vec3(0.8, 0.3, 0.9);
  vec3 orderColor = vec3(0.3, 0.9, 0.95);
  vec3 waveColor = mix(chaosColor, orderColor, coherence);
  
  col += waveColor * intensity;
  
  if(intensity > 0.5) {
    col += vec3(0.4, 0.6, 0.8) * (intensity - 0.5) * coherence;
  }
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 92;
  Tone.Transport.bpm.value = bpm;

  const mainReverb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).toDestination();
  await mainReverb.generate();

  const compressor = new Tone.Compressor({ 
    threshold: -24, 
    ratio: 8, 
    attack: 0.003, 
    release: 0.2 
  }).toDestination();

  const noiseFilter = new Tone.Filter({ 
    type: "bandpass", 
    frequency: 800, 
    Q: 2 
  }).connect(mainReverb);
  
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.1, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(noiseFilter);

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if ((bar < 6 || bar >= 18) && Math.random() > 0.6) {
      const freq = 400 + Math.random() * 1600;
      noiseFilter.frequency.setValueAtTime(freq, time);
      noise.triggerAttackRelease(0.1 + Math.random() * 0.2, time);
    }
  }, "8n").start(0);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.03,
    octaves: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.02 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 4 && bar < 18) {
      const velocity = bar < 8 ? 0.5 + (bar - 4) * 0.1 : 0.9;
      kick.triggerAttackRelease("C1", "8n", time, velocity);
      
      compressor.threshold.setValueAtTime(-35, time);
      compressor.threshold.exponentialRampToValueAtTime(-24, time + 0.18);
    }
  }, "4n").start(0);

  const bassFilter = new Tone.Filter({ 
    type: "lowpass", 
    frequency: 200, 
    Q: 1 
  }).connect(compressor);
  
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.02, decay: 0.15, sustain: 0, release: 0.08 },
    filterEnvelope: { attack: 0.02, decay: 0.2, sustain: 0, baseFrequency: 100, octaves: 2 }
  }).connect(bassFilter);

  const bassNotes = ["C2", "C2", "G1", "G1"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 3 && bar < 17) {
      const probability = bar < 6 ? 0.4 : (bar < 14 ? 0.9 : 0.5);
      if (Math.random() < probability) {
        bass.triggerAttackRelease(bassNotes[bassIndex % bassNotes.length], "8n", time, 0.7);
      }
    }
    bassIndex++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(600, time + 6 * (60 / bpm) * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(200, time + 4 * (60 / bpm) * 4);
  }, "14:0:0");

  const arpFilter = new Tone.Filter({ 
    type: "lowpass", 
    frequency: 600, 
    Q: 1.5 
  }).connect(mainReverb);
  
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.06 }
  }).connect(arpFilter);

  const arpPattern = ["C4", "E4", "G4", "E4", "C4", "G3"];
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 16) {
      const regularity = bar < 10 ? (bar - 6) * 0.2 : (bar < 14 ? 0.9 : (16 - bar) * 0.3);
      if (Math.random() < regularity) {
        const note = arpPattern[arpIndex % arpPattern.length];
        arp.triggerAttackRelease(note, "16n", time, 0.6);
      }
    }
    arpIndex++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2400, time + 6 * (60 / bpm) * 4);
  }, "8:0:0");

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(800, time + 2 * (60 / bpm) * 4);
  }, "14:0:0");

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.4, sustain: 0.6, release: 1.5 }
  }).connect(mainReverb);

  const padChords = [
    ["C3", "E3", "G3"],
    ["G2", "B2", "D3"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 10 && bar < 14) {
      pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "2n", time, 0.25);
    }
    chordIndex++;
  }, "2n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.5, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(mainReverb);

  Tone.Transport.schedule((time) => {
    bell.triggerAttackRelease("C5", 1.0, time, 0.4);
  }, "8:0:0");

  Tone.Transport.schedule((time) => {
    bell.triggerAttackRelease("G5", 1.0, time, 0.3);
  }, "12:0:0");

  window.toneJsInstruments = { kick, bass, noise, arp, pad, bell };
  window.toneJsParts = { kickLoop, bassLoop, noiseLoop, arpLoop, padLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
