<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
        mix(hash(i), hash(i + vec2(1, 0)), f.x),
        mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x),
        f.y
    );
}

void main() {
    vec2 fc = gl_FragCoord.xy;
    vec2 uv = fc / iResolution.xy;
    vec2 p = (fc - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;

    vec3 amber = vec3(1.0, 0.76, 0.28);
    vec3 green = vec3(0.32, 0.95, 0.5);
    vec3 blue = vec3(0.2, 0.45, 0.92);
    vec3 white = vec3(1.0, 0.93, 0.82);

    float b1 = pow(sin(phase * 25.133) * 0.5 + 0.5, 1.5);
    float b2 = pow(sin(phase * 12.566 + 1.5) * 0.5 + 0.5, 1.2);
    float b3 = sin(phase * 6.283) * 0.5 + 0.5;
    float breath = b1 * 0.5 + b2 * 0.3 + b3 * 0.2;

    float centerWeight = 1.0 - 2.0 * abs(uv.y - 0.5);
    centerWeight = pow(max(centerWeight, 0.0), 0.8);
    float localBreath = breath * (0.35 + centerWeight * 0.65);

    vec3 col = vec3(0.004, 0.003, 0.006);

    float baseFreq = 40.0;
    float wy = uv.y + sin(uv.y * 18.85 + t * 0.3) * localBreath * 0.025;
    float scanY = wy * baseFreq;
    float lineIdx = floor(scanY);
    float lf = fract(scanY);

    float lw = mix(0.22, 0.025, localBreath);
    float wobble = noise(vec2(lineIdx * 0.5, t * 0.15)) * 0.006;
    float ld = abs(lf - 0.5);
    float w = lw + wobble;
    float scanLine = exp(-ld * ld / (w * w));

    float lineInt = 0.55 + 0.45 * noise(vec2(lineIdx * 0.4, t * 0.08));
    float cm = hash(vec2(lineIdx, 7.0));
    vec3 lineColor = mix(amber, green, cm * 0.35);
    lineColor = mix(lineColor, white, 0.12);

    float subPx = 0.85 + 0.15 * sin(fc.x * 2.094);
    col += lineColor * scanLine * lineInt * subPx;

    float agw = w * 4.5;
    float ag = exp(-ld * ld / (agw * agw)) * 0.08 * (1.0 - scanLine * 0.6);
    col += mix(lineColor * 0.3, blue, 0.45) * ag;

    float trail = exp(-ld * 5.0) * 0.04 * localBreath;
    float flicker = 0.7 + 0.3 * noise(vec2(lineIdx * 2.0, t * 2.0));
    col += blue * 0.65 * trail * flicker;

    float gap = smoothstep(w * 2.0, w * 5.0, ld);
    float voidReveal = gap * localBreath;

    float echoLine = exp(-pow(fract(wy * 120.0) - 0.5, 2.0) * 300.0) * 0.015;
    col += amber * 0.25 * echoLine * voidReveal;

    vec2 hUV = vec2(p.x * 4.0, (lf - 0.5) / max(localBreath, 0.01) * 1.5);
    float haze = noise(hUV * 0.5 + t * 0.04);
    col += mix(amber * 0.12, blue * 0.18, haze) * pow(haze, 3.0) * 0.03 * voidReveal;

    float arch = pow(max(cos(p.x * 8.0 + noise(p * 2.0 + t * 0.05) * 1.5), 0.0), 12.0);
    col += blue * 0.12 * arch * 0.02 * voidReveal;

    for(float i = 0.0; i < 30.0; i++) {
        vec2 seed = vec2(i * 7.31 + 0.5, i * 13.17 + 0.3);
        vec2 pp = vec2(hash(seed), hash(seed + 1.0)) * 2.0 - 1.0;
        pp *= 0.45;
        pp += vec2(
            sin(t * (0.08 + hash(seed + 4.0) * 0.08) + i * 0.7) * 0.06,
            cos(t * (0.06 + hash(seed + 5.0) * 0.06) + i * 1.1) * 0.04
        );
        float d = length(p - pp);
        float sz = 0.002 + hash(seed + 2.0) * 0.003;
        float bright = exp(-d * d / (sz * sz)) * 0.05 * (localBreath * 0.6 + 0.1);
        col += mix(amber * 0.4, blue * 0.6, hash(seed + 3.0)) * bright;
    }

    float beamPos = mod(t * 0.67, 1.15) - 0.075;
    float beamDist = uv.y - beamPos;
    float beam = exp(-beamDist * beamDist * 4000.0) * 0.2;
    float beamTrail = max(0.0, exp(-max(beamDist, 0.0) * 18.0) - 0.08) * 0.03;
    col += vec3(0.75, 0.88, 1.0) * (beam + beamTrail);

    vec2 dc = uv * 2.0 - 1.0;
    col *= 1.0 - dot(dc, dc) * 0.15;
    vec4 edges = vec4(uv.x, uv.y, 1.0 - uv.x, 1.0 - uv.y);
    col *= smoothstep(0.0, 0.06, min(min(edges.x, edges.y), min(edges.z, edges.w)));
    col = max(col, vec3(0.002, 0.001, 0.003));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 60;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.3 }).toDestination();
  await masterReverb.generate();

  const darkDelay = new Tone.FeedbackDelay({
    delayTime: "4n.", feedback: 0.35, wet: 0.2
  }).connect(masterReverb);

  const hum = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 1.0, sustain: 0.7, release: 4.0 }
  }).toDestination();
  hum.volume.value = -26;

  const humLoop = new Tone.Loop((time) => {
    hum.triggerAttackRelease("B0", "2m", time, 0.25);
  }, "2m").start(0);

  const padFilter = new Tone.Filter({
    type: "lowpass", frequency: 400, Q: 1.0
  }).connect(masterReverb);

  const padChorus = new Tone.Chorus({
    frequency: 0.25, delayTime: 4.5, depth: 0.5, wet: 0.35
  }).connect(padFilter);
  padChorus.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.5, release: 2.5 }
  }).connect(padChorus);
  pad.volume.value = -16;

  const padChords = [
    ["A2", "E3"], ["F2", "C3"], ["G2", "D3"],
    ["A2", "E3"], ["D2", "A2"], ["F2", "C3"]
  ];
  let chordIdx = 0;

  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 1 && bar < 14) {
      pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1m", time, 0.22);
      chordIdx++;
    }
  }, "1m").start(0);

  const breathLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const phase = (sec % 60) / 60;
    const b = Math.pow(Math.sin(phase * 8 * Math.PI) * 0.5 + 0.5, 1.3);
    const freq = 250 + b * 1500;
    padFilter.frequency.linearRampToValueAtTime(freq, time + 0.3);
  }, "8n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 5.0,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.0, sustain: 0, release: 0.8 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
  }).connect(darkDelay);
  bell.volume.value = -24;

  const bellNotes = ["A4", "E5", "C5", "G4", "D5", "B4", "F5", "A5", "E4", "G5"];
  let bellIdx = 0;

  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 3 && bar < 13 && Math.random() > 0.5) {
      bell.triggerAttackRelease(
        bellNotes[bellIdx % bellNotes.length],
        "8n", time, 0.1 + Math.random() * 0.12
      );
      bellIdx++;
    }
  }, "2n").start(0);

  const sub = new Tone.MembraneSynth({
    pitchDecay: 0.1,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.8, sustain: 0, release: 0.4 }
  }).toDestination();
  sub.volume.value = -22;

  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 2 && bar < 14) {
      sub.triggerAttackRelease("A0", "4n", time, 0.4);
    }
  }, "1m").start(0);

  const sweepFilter = new Tone.Filter({
    type: "bandpass", frequency: 600, Q: 2.5
  }).connect(masterReverb);
  const sweep = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0, release: 1.5 }
  }).connect(sweepFilter);
  sweep.volume.value = -32;

  const sweepLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 4 && bar < 12) {
      sweep.triggerAttackRelease("1m", time);
      sweepFilter.frequency.setValueAtTime(150, time);
      sweepFilter.frequency.linearRampToValueAtTime(2500, time + 2.0);
    }
  }, "2m").start(0);

  const tick = new Tone.MetalSynth({
    frequency: 1000,
    envelope: { attack: 0.001, decay: 0.04, release: 0.01 },
    harmonicity: 6,
    modulationIndex: 18,
    resonance: 5000
  }).connect(masterReverb);
  tick.volume.value = -38;

  const tickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / 4);
    if (bar >= 5 && bar < 13 && Math.random() > 0.65) {
      tick.triggerAttackRelease("32n", time, 0.06 + Math.random() * 0.08);
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(250, time + 6.0);
    pad.volume.linearRampToValueAtTime(-24, time + 6.0);
    bell.volume.linearRampToValueAtTime(-40, time + 4.0);
    tick.volume.linearRampToValueAtTime(-50, time + 3.0);
  }, "13:0:0");

  window.toneJsInstruments = { hum, pad, bell, sub, sweep, tick };
  window.toneJsParts = { humLoop, padLoop, breathLoop, bellLoop, subLoop, sweepLoop, tickLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
