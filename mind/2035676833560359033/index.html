<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float glyph(vec2 p, float seed) {
    vec2 g = floor(p * 6.0);
    float h = hash(g + seed);
    vec2 f = fract(p * 6.0) - 0.5;
    float line1 = abs(f.x * step(0.5, h) + f.y * step(h, 0.5));
    float cross1 = min(abs(f.x), abs(f.y));
    float shape = mix(line1, cross1, step(0.7, h));
    return smoothstep(0.08, 0.02, shape) * step(0.3, h);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;

    float breathRate = 0.4 + 0.15 * sin(phase * 6.28318);
    float breath = sin(t * breathRate * 6.28318) * 0.5 + 0.5;

    vec2 warp1 = vec2(
        fbm(uv * 2.0 + vec2(t * 0.12, t * 0.08)),
        fbm(uv * 2.0 + vec2(t * -0.1, t * 0.15) + 5.0)
    );
    vec2 warp2 = vec2(
        fbm(uv * 3.0 + warp1 * 1.5 + vec2(t * 0.05)),
        fbm(uv * 3.0 + warp1 * 1.5 + vec2(0.0, t * 0.07) + 8.0)
    );

    float flow = fbm(uv * 1.5 + warp2 * 2.0 + vec2(sin(t * 0.2), cos(t * 0.15)));

    float pulse = flow * (0.6 + 0.4 * breath);

    float expansion = 1.0 + 0.3 * sin(t * 0.25) * breath;
    vec2 fracUv = uv * expansion;
    float fractal = 0.0;
    vec2 z = fracUv * 2.5;
    vec2 c = vec2(-0.7 + 0.1 * sin(t * 0.1), 0.27 + 0.05 * cos(t * 0.13));
    for(float i = 0.0; i < 12.0; i++) {
        z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
        if(dot(z, z) > 4.0) {
            fractal = i / 12.0;
            break;
        }
    }
    fractal *= (0.7 + 0.3 * (1.0 - breath));

    float flicker = step(0.97, hash(vec2(floor(t * 8.0), floor(uv.y * 20.0))));
    float glitchBand = flicker * 0.3 * sin(t * 15.0 + uv.y * 50.0);

    float glyphLayer = 0.0;
    float glyphSeed = floor(t * 0.5 + length(uv) * 2.0);
    vec2 glyphUv = uv * (2.0 + sin(t * 0.3)) + vec2(t * 0.05, t * 0.03);
    glyphLayer = glyph(glyphUv, glyphSeed) * 0.35;
    float glyphFade = smoothstep(0.3, 0.5, pulse) * (1.0 - smoothstep(0.6, 0.8, pulse));
    glyphLayer *= glyphFade;

    float hueShift = phase * 6.28318;
    vec3 deepViolet = vec3(0.15, 0.05, 0.35);
    vec3 paleCyan = vec3(0.4, 0.75, 0.85);
    vec3 midPurple = vec3(0.3, 0.1, 0.55);
    vec3 signalBlue = vec3(0.1, 0.3, 0.7);

    float colorPhase = pulse + 0.2 * sin(t * 0.18 + length(uv) * 3.0);
    vec3 col = mix(deepViolet, midPurple, smoothstep(0.2, 0.5, colorPhase));
    col = mix(col, signalBlue, smoothstep(0.4, 0.7, colorPhase));
    col = mix(col, paleCyan, smoothstep(0.6, 0.9, colorPhase));

    col += fractal * vec3(0.1, 0.15, 0.3) * (0.5 + 0.5 * breath);

    col += glyphLayer * vec3(0.5, 0.7, 0.9);

    col += glitchBand * vec3(0.3, 0.5, 0.8);

    float vignette = 1.0 - 0.6 * dot(uv, uv);
    col *= vignette;

    float memoryPulse = smoothstep(0.0, 0.02, abs(sin(t * 2.0 + length(uv) * 8.0 + flow * 5.0)));
    col *= 0.85 + 0.15 * memoryPulse;

    float scan = 0.95 + 0.05 * sin(gl_FragCoord.y * 1.5 + t * 3.0);
    col *= scan;

    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -8;

  const padChords = [
    ["D3", "A3", "F4"],
    ["C3", "G3", "E4"],
    ["Bb2", "F3", "D4"],
    ["A2", "E3", "C4"],
    ["D3", "A3", "F4"],
    ["F3", "C4", "A4"],
    ["E3", "B3", "G4"],
    ["C3", "G3", "E4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 16) {
      pad.triggerAttackRelease(padChords[0], "1n", time, 0.12);
    } else {
      pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time, 0.15);
    }
    chordIdx++;
  }, "1n").start(0);

  const breathSynth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 2.0, sustain: 0.0, release: 1.0 }
  }).connect(masterReverb);
  breathSynth.volume.value = -14;

  const breathNotes = ["A4", "F4", "E4", "D4", "C4", "G4", "A4", "E4"];
  let breathIdx = 0;
  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 16) {
      breathSynth.triggerAttackRelease(breathNotes[breathIdx % breathNotes.length], "2n", time, 0.5);
    }
    breathIdx++;
  }, "2n").start(0);

  const glitchSynth = new Tone.FMSynth({
    harmonicity: 5.5,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.05 },
    modulation: { type: "square" }
  }).connect(masterDelay);
  glitchSynth.volume.value = -18;

  const glitchNotes = ["D6", "A5", "F6", "C6", "E5", "G6", "Bb5", "D5"];
  let glitchIdx = 0;
  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 14 && Math.random() < 0.35) {
      const note = glitchNotes[glitchIdx % glitchNotes.length];
      glitchSynth.triggerAttackRelease(note, "32n", time, 0.3 + Math.random() * 0.3);
    }
    glitchIdx++;
  }, "8n").start(0);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    filter: { type: "lowpass", frequency: 120 },
    envelope: { attack: 0.8, decay: 1.0, sustain: 0.4, release: 1.5 },
    filterEnvelope: { attack: 0.5, decay: 0.8, sustain: 0.3, baseFrequency: 40, octaves: 1.5 }
  }).toDestination();
  subBass.volume.value = -10;

  const subNotes = ["D1", "C1", "Bb0", "A0", "D1", "F1", "E1", "C1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let note;
    if (bar >= 15) note = subNotes[0];
    else note = subNotes[subIdx % subNotes.length];
    subBass.triggerAttackRelease(note, "1n", time, 0.6);
    subIdx++;
  }, "1n").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.5 }).connect(masterReverb);
  const noiseSynth = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.0, release: 2.0 }
  }).connect(noiseFilter);
  noiseSynth.volume.value = -22;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 13 && Math.random() < 0.25) {
      noiseSynth.triggerAttackRelease(1.5, time, 0.3);
    }
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + 6 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
  }, "13:0:0");

  window.toneJsInstruments = { pad, breathSynth, glitchSynth, subBass, noiseSynth };
  window.toneJsParts = { padLoop, breathLoop, glitchLoop, subLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
