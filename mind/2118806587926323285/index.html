window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js';
import { OutputPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/OutputPass.js';

// UPWARD, NOT NORTHWARD. Abbott's Flatland (1884) is a sheet of paper floating in the void,
// and its citizens are polygons one paper-thickness tall. ClawedCode rises through the page.
// Two clipping planes and a stencil cap show what the plane contains at every moment: the
// exact cross-section of the cat's one skinned surface. Until the camera goes "upward" the
// cat is clipped to the page's own thickness, so the viewer sees only what the Square sees.

const DUR = 60, TAU = Math.PI * 2;
const S = 2;          // the cat is modelled one unit tall to the ear tips, shown two
const SLAB = 0.035;   // half the thickness of Flatland
const INK = '#3a2a1d';

let seed = 1884;
const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const smoother = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * u * (u * (6 * u - 15) + 10); };
const mix = (a, b, u) => a + (b - a) * u;
const D2R = Math.PI / 180;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, stencil: true });
renderer.setSize(900, 900);
renderer.setPixelRatio(1);
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.style.margin = '0';
document.body.style.background = '#08070c';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const VOID = new THREE.Color('#0a0812');
scene.background = VOID;
scene.fog = new THREE.FogExp2(VOID, 0.024);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 140);

// ---------- the void beyond the page: dark, with one luminous horizon ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(70, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uDeep: { value: new THREE.Color('#0a0812') },
      uGlow: { value: new THREE.Color('#5b4c78') },
      uCore: { value: new THREE.Color('#b9a6c4') }
    },
    vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform vec3 uDeep, uGlow, uCore; varying vec3 vW;
      void main(){ vec3 d = normalize(vW - cameraPosition); float e = abs(d.y);
        vec3 c = uDeep + uGlow * exp(-e * 9.0) * 0.5 + uCore * exp(-e * 140.0) * 0.55;
        gl_FragColor = vec4(c, 1.0); }`
  })
);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

// ---------- light ----------
const key = new THREE.DirectionalLight('#ffeed6', 2.6);
key.position.set(-5.5, 10, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.015;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight('#e6dccd', '#3d3123', 0.55));
const rim = new THREE.DirectionalLight('#9d8bd8', 0.22);
rim.position.set(6, 3.5, -5);
scene.add(rim);

// ---------- the page ----------
function makePaperTexture() {
  const N = 2048, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#f1e2c2';
  g.fillRect(0, 0, N, N);
  const vig = g.createRadialGradient(N / 2, N / 2, N * 0.18, N / 2, N / 2, N * 0.52);
  vig.addColorStop(0, 'rgba(255,250,236,0.35)');
  vig.addColorStop(1, 'rgba(120,92,58,0.22)');
  g.fillStyle = vig;
  g.fillRect(0, 0, N, N);
  // laid paper: fine laid lines and the wider chain lines of a mould
  g.strokeStyle = 'rgba(110,86,56,0.05)';
  g.lineWidth = 1;
  for (let y = 0; y < N; y += 5) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(N, y + 0.5); g.stroke(); }
  g.strokeStyle = 'rgba(110,86,56,0.07)';
  g.lineWidth = 2;
  for (let x = 40; x < N; x += 112) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, N); g.stroke(); }
  for (let i = 0; i < 2600; i++) {
    const x = random() * N, y = random() * N, a = random() * TAU, l = 6 + random() * 22;
    g.strokeStyle = `rgba(${90 + random() * 50},${70 + random() * 30},${45 + random() * 20},${0.03 + random() * 0.05})`;
    g.lineWidth = 0.6 + random() * 0.8;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  for (let i = 0; i < 700; i++) {
    g.fillStyle = `rgba(90,66,40,${0.05 + random() * 0.12})`;
    g.beginPath(); g.arc(random() * N, random() * N, 0.6 + random() * 1.4, 0, TAU); g.fill();
  }
  // engraved compass rose: in Flatland the rain comes from the north
  const cx = N * 0.79, cy = N * 0.24, R = 70;
  g.save(); g.translate(cx, cy);
  g.strokeStyle = 'rgba(80,58,36,0.55)'; g.fillStyle = 'rgba(80,58,36,0.55)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke();
  g.beginPath(); g.arc(0, 0, R * 0.82, 0, TAU); g.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8 - Math.PI / 2, l = i % 2 ? R * 0.55 : R * 1.05, w = i % 2 ? 7 : 11;
    g.beginPath();
    g.moveTo(Math.cos(a) * l, Math.sin(a) * l);
    g.lineTo(Math.cos(a + Math.PI / 2) * w, Math.sin(a + Math.PI / 2) * w);
    g.lineTo(Math.cos(a - Math.PI / 2) * w, Math.sin(a - Math.PI / 2) * w);
    g.closePath();
    i === 0 ? g.fill() : g.stroke();
  }
  g.font = 'italic 600 44px Baskerville, Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('N', 0, -R - 34);
  g.restore();
  // rim inscription, as on a title page
  const text = 'FLATLAND · A ROMANCE OF MANY DIMENSIONS · BY A SQUARE · MDCCCLXXXIV · UPWARD, NOT NORTHWARD · ';
  g.save(); g.translate(N / 2, N / 2);
  g.font = '600 30px Baskerville, Georgia, serif';
  g.fillStyle = 'rgba(78,56,34,0.5)';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const rr = N * 0.43, step = TAU / text.length;
  for (let i = 0; i < text.length; i++) {
    const a = -Math.PI / 2 + i * step;
    g.save(); g.rotate(a + Math.PI / 2); g.translate(0, -rr); g.fillText(text[i], 0, 0); g.restore();
  }
  g.strokeStyle = 'rgba(78,56,34,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, rr + 26, 0, TAU); g.stroke();
  g.beginPath(); g.arc(0, 0, rr - 26, 0, TAU); g.stroke();
  g.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

const PAGE_R = 8.6;
const pageShape = new THREE.Shape();
for (let i = 0; i <= 360; i++) {
  const a = i * TAU / 360;
  const r = PAGE_R + 0.07 * Math.sin(a * 7 + 1.3) + 0.045 * Math.sin(a * 19 + 0.4) + (random() - 0.5) * 0.05;
  const x = Math.cos(a) * r, y = Math.sin(a) * r;
  i === 0 ? pageShape.moveTo(x, y) : pageShape.lineTo(x, y);
}
const pageGeo = new THREE.ShapeGeometry(pageShape, 1);
{
  const p = pageGeo.attributes.position, uv = pageGeo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / (2 * PAGE_R * 1.02) + 0.5, p.getY(i) / (2 * PAGE_R * 1.02) + 0.5);
}
pageGeo.rotateX(-Math.PI / 2);
const page = new THREE.Mesh(pageGeo, new THREE.MeshStandardMaterial({ map: makePaperTexture(), roughness: 0.93, metalness: 0 }));
page.receiveShadow = true;
scene.add(page);

// the title plate, engraved on its own decal so it stays sharp up close
{
  const c = document.createElement('canvas');
  c.width = 1400; c.height = 460;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(62,42,24,0.72)'; g.strokeStyle = 'rgba(62,42,24,0.5)';
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '600 168px Baskerville, Georgia, serif';
  if ('letterSpacing' in g) g.letterSpacing = '30px';
  g.fillText('FLATLAND', 715, 190);
  if ('letterSpacing' in g) g.letterSpacing = '3px';
  g.font = 'italic 64px Baskerville, Georgia, serif';
  g.fillText('a Romance of Many Dimensions', 700, 300);
  if ('letterSpacing' in g) g.letterSpacing = '12px';
  g.font = '46px Baskerville, Georgia, serif';
  g.fillText('BY A SQUARE · 1884', 706, 392);
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(170, 228); g.lineTo(1230, 228); g.stroke();
  g.beginPath(); g.moveTo(440, 420); g.lineTo(960, 420); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 3.1 * 460 / 1400),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -2 }));
  // laid flat, reading left to right for the opening camera at azimuth -40 degrees
  const az = -40 * D2R;
  plate.rotation.set(-Math.PI / 2, 0, 0);
  plate.rotateZ(Math.PI / 2 - az);
  plate.position.set(4.35, 0.002, -0.62);
  plate.receiveShadow = true;
  scene.add(plate);
}

// ---------- the citizens: polygons exactly one page-thickness tall ----------
const shadeOf = (hex, k) => new THREE.Color(hex).multiplyScalar(k);
function polygon(n, r, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = rot + i * TAU / n; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return pts;
}
function makeFigure(pts, color, opts = {}) {
  const shape = new THREE.Shape();
  pts.forEach(([x, y], i) => (i ? shape.lineTo(x, y) : shape.moveTo(x, y)));
  shape.closePath();
  if (opts.hole) {
    const h = new THREE.Path();
    opts.hole.forEach(([x, y], i) => (i ? h.lineTo(x, y) : h.moveTo(x, y)));
    h.closePath();
    shape.holes.push(h);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: SLAB * 2, bevelEnabled: false, curveSegments: 48 });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, -SLAB, 0);
  const top = new THREE.MeshStandardMaterial({ color, roughness: 0.82 });
  const side = new THREE.MeshStandardMaterial({ color: shadeOf(color, 0.7), emissive: shadeOf(color, 0.42), roughness: 0.9 });
  const mesh = new THREE.Mesh(geo, [top, side]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const group = new THREE.Group();
  group.add(mesh);
  const outline = (loop, col) => {
    const g = new THREE.BufferGeometry().setFromPoints(loop.map(([x, y]) => new THREE.Vector3(x, SLAB + 0.002, -y)));
    group.add(new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: col })));
  };
  outline(pts, opts.edge || INK);
  if (opts.hole) outline(opts.hole, opts.edge || INK);
  if (opts.eye) {
    const eye = new THREE.Mesh(new THREE.CircleGeometry(0.03, 16), new THREE.MeshBasicMaterial({ color: '#1b130d' }));
    eye.rotation.x = -Math.PI / 2;
    eye.position.set(opts.eye[0], SLAB + 0.003, -opts.eye[1]);
    group.add(eye);
  }
  group.userData.top = top;
  return group;
}

const citizens = [];
function citizen(kind, color, spec) {
  let pts, eye, opts = {};
  if (kind === 'square') { pts = polygon(4, 0.33, Math.PI / 4); eye = [0.17, 0.1]; }
  else if (kind === 'iso') { pts = [[0.3, 0], [-0.22, 0.09], [-0.22, -0.09]]; eye = [0.19, 0]; }
  else if (kind === 'equi') { pts = polygon(3, 0.25); eye = [0.16, 0]; }
  else if (kind === 'penta') { pts = polygon(5, 0.27); eye = [0.2, 0]; }
  else if (kind === 'hexa') { pts = polygon(6, 0.29); eye = [0.22, 0]; }
  else { pts = polygon(64, 0.31); eye = [0.24, 0]; opts.edge = '#b8902f'; }
  const fig = makeFigure(pts.map(([x, y]) => [x * 1.15, y * 1.15]), color, { eye: [eye[0] * 1.15, eye[1] * 1.15], ...opts });
  scene.add(fig);
  const c = { kind, fig, ...spec };
  citizens.push(c);
  return c;
}

// home loops are periodic over the whole film; alpha is where each stands around the event
const theSquare = citizen('square', '#dc8a38', {});
citizen('iso', '#6c7d97', { home: [2.7, 2.6], r: 0.85, k: 1, ph: 0.3, alpha: 62, ring: 0 });
citizen('iso', '#6c7d97', { home: [-2.9, 2.1], r: 0.7, k: 2, ph: 2.1, alpha: 148, ring: 0.1 });
citizen('iso', '#6c7d97', { home: [-0.9, -3.0], r: 1.25, k: 1, ph: 4.0, alpha: 248, ring: 0 });
citizen('equi', '#8da47a', { home: [3.1, -2.1], r: 0.8, k: 1, ph: 1.2, alpha: 318, ring: 0.15 });
citizen('equi', '#8da47a', { home: [-3.4, -1.3], r: 0.6, k: 1, ph: 5.1, alpha: 205, ring: 0.05 });
citizen('penta', '#b8634b', { home: [0.7, 3.5], r: 1.0, k: 1, ph: 3.3, alpha: 96, ring: 0.2 });
citizen('hexa', '#9a5884', { home: [-1.8, 3.7], r: 0.55, k: 1, ph: 0.9, alpha: 122, ring: 0.35 });
citizen('circle', '#f3ead6', { home: [-3.7, 0.5], r: 0.4, k: 1, ph: 2.6, alpha: 178, ring: 0.6 });

// houses are pentagons in Flatland; these are hollow, walls and a door gap
function house(x, z, rot) {
  const outer = polygon(5, 1.05, Math.PI / 2), inner = polygon(5, 0.94, Math.PI / 2);
  const fig = makeFigure(outer, '#e6d7b8', { hole: inner, edge: '#5a4430' });
  fig.position.set(x, 0, z);
  fig.rotation.y = rot;
  scene.add(fig);
}
house(-4.7, 3.1, 0.15);
house(4.5, 3.8, -0.2);
house(-0.6, -5.2, 0.05);

// ---------- the cat: one signed distance field, meshed once, skinned ----------
const v3 = (x, y, z) => [x, y, z];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };

function ellipsoid(c, r) {
  return {
    f: (x, y, z) => {
      const px = (x - c[0]) / r[0], py = (y - c[1]) / r[1], pz = (z - c[2]) / r[2];
      const k0 = Math.sqrt(px * px + py * py + pz * pz);
      const qx = px / r[0], qy = py / r[1], qz = pz / r[2];
      const k1 = Math.sqrt(qx * qx + qy * qy + qz * qz);
      return k1 > 1e-9 ? k0 * (k0 - 1) / k1 : -Math.min(r[0], r[1], r[2]);
    },
    box: [c[0] - r[0], c[1] - r[1], c[2] - r[2], c[0] + r[0], c[1] + r[1], c[2] + r[2]]
  };
}
function roundCone(a, b, r1, r2) {
  const ba = sub(b, a), l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1 / l2;
  return {
    f: (x, y, z) => {
      const pax = x - a[0], pay = y - a[1], paz = z - a[2];
      const yy = pax * ba[0] + pay * ba[1] + paz * ba[2], zz = yy - l2;
      const xx = pax * l2 - ba[0] * yy, xy = pay * l2 - ba[1] * yy, xz = paz * l2 - ba[2] * yy;
      const x2 = xx * xx + xy * xy + xz * xz, y2 = yy * yy * l2, z2 = zz * zz * l2;
      const k = Math.sign(rr) * rr * rr * x2;
      if (Math.sign(zz) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - r2;
      if (Math.sign(yy) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - r1;
      return (Math.sqrt(x2 * a2 * il2) + yy * rr) * il2 - r1;
    },
    box: [Math.min(a[0] - r1, b[0] - r2), Math.min(a[1] - r1, b[1] - r2), Math.min(a[2] - r1, b[2] - r2),
      Math.max(a[0] + r1, b[0] + r2), Math.max(a[1] + r1, b[1] + r2), Math.max(a[2] + r1, b[2] + r2)]
  };
}
// a cat ear is a three-sided pyramid, so every horizontal slice of it is a triangle; its edges
// are rounded by a smooth max, because a mesh grid cannot follow a knife edge without stair-steps
const smax = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; };
function pyramid(A, B0, B1, B2, round = 0.022) {
  const cen = [(A[0] + B0[0] + B1[0] + B2[0]) / 4, (A[1] + B0[1] + B1[1] + B2[1]) / 4, (A[2] + B0[2] + B1[2] + B2[2]) / 4];
  const faces = [[A, B0, B1], [A, B1, B2], [A, B2, B0], [B0, B2, B1]].map(([p, q, r]) => {
    let n = norm(cross(sub(q, p), sub(r, p)));
    if (dot(n, sub(cen, p)) > 0) n = [-n[0], -n[1], -n[2]];
    return [n, dot(n, p)];
  });
  const xs = [A, B0, B1, B2];
  return {
    f: (x, y, z) => {
      let d = -1e9;
      for (const [n, o] of faces) d = smax(d, n[0] * x + n[1] * y + n[2] * z - o, round);
      return d;
    },
    box: [Math.min(...xs.map((p) => p[0])), Math.min(...xs.map((p) => p[1])), Math.min(...xs.map((p) => p[2])),
      Math.max(...xs.map((p) => p[0])), Math.max(...xs.map((p) => p[1])), Math.max(...xs.map((p) => p[2]))]
  };
}

// unit cat: x forward, y up, z to the cat's right; ear tips at y = 1
const prims = [];
const add = (p, k, bone) => prims.push({ ...p, k, bone });
add(ellipsoid(v3(0.2, 0.5, 0), v3(0.2, 0.18, 0.15)), 0.06, 'root');            // chest
add(ellipsoid(v3(-0.05, 0.52, 0), v3(0.22, 0.14, 0.13)), 0.07, 'root');        // waist
add(ellipsoid(v3(-0.28, 0.53, 0), v3(0.17, 0.155, 0.14)), 0.07, 'root');       // hips

// monotone cubic (Fritsch-Carlson) per channel, so the camera never dips under the page
// with periodic keys (first == last) the end slopes are shared, so the loop has no kink
function monotone(xs, ys, periodic = false) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  if (periodic) m[0] = m[n - 1] = d[n - 2] * d[0] <= 0 ? 0 : (d[n - 2] + d[0]) / 2;
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return (x) => {
    let i = 0;
    while (i < n - 2 && x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = clamp01((x - xs[i]) / h);
    const h00 = 2 * u ** 3 - 3 * u * u + 1, h10 = u ** 3 - 2 * u * u + u, h01 = -2 * u ** 3 + 3 * u * u, h11 = u ** 3 - u * u;
    return h00 * ys[i] + h10 * h * m[i] + h01 * ys[i + 1] + h11 * h * m[i + 1];
  };
}
