<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const ctx = canvas.getContext('2d');

(() => {
  const DURATION = 60;
  const W = 300, H = 300, SCALE = 3;
  const BPM = 84, BEAT = 60 / BPM;

  // ---- logical pixel buffer -------------------------------------------------
  const buf = document.createElement('canvas');
  buf.width = W; buf.height = H;
  const b = buf.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // ---- palette (named roles) ------------------------------------------------
  const P = {
    skyTop: '#070b18', skyLow: '#0c1326', skyGlow: '#14203a',
    farTower: '#121b31', farTowerLit: '#1b2744',
    midTower: '#0e1626', midEdge: '#172338',
    block: '#131a28', blockLit: '#1d273a', blockDark: '#0a0e18',
    stone: '#1a2233', stoneEdge: '#243049',
    teal: '#1f4a4f', tealDim: '#153439',
    roof: '#141b27', roofWet: '#1c2a3a', roofPool: '#23364a',
    shack: '#1b212c', shackEdge: '#2a3341', corrug: '#121823',
    amber: '#ffc46a', amberDim: '#c98a3c', amberDeep: '#8a5a22',
    gold: '#ffe3a0', orange: '#ff8a3c', orangeDeep: '#b4531c',
    rain: '#5f93a8', rainDim: '#2c4b5c', rainBright: '#9ed2e2',
    magenta: '#d2459b', magentaDim: '#7d2a5e',
    violet: '#8f5cff', violetDim: '#50338f',
    green: '#6fe08a', greenDim: '#2f6b44',
    tv: '#7fb6ff', tvDim: '#3d5f8c',
    cat: '#05070b', eye: '#ffd27a',
    fern: '#2e6d4e', fernDim: '#1d4433',
    cable: '#0b0f16', rail: '#101722', railEdge: '#1b2533',
    white: '#f2f6ff'
  };

  // ---- seeded rng (init only) ----------------------------------------------
  let seed = 6980594 % 233280;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const ri = (a, c) => a + Math.floor(rnd() * (c - a + 1));

  const px = (x, y, col) => { b.fillStyle = col; b.fillRect(x | 0, y | 0, 1, 1); };
  const rect = (x, y, w, h, col) => { b.fillStyle = col; b.fillRect(x | 0, y | 0, w | 0, h | 0); };
  const hash = (a, c) => {
    let h = (a * 374761393 + c * 668265263) | 0;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967296;
  };
  const sstep = (e0, e1, x) => {
    const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return u * u * (3 - 2 * u);
  };
  // bayer 4x4, fixed in screen space
  const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)] / 16;

  // ---- 3x5 bitmap glyph squiggles for the CRT ------------------------------
  const GLYPH = [
    [0b111,0b010,0b010,0b010,0b111], [0b101,0b101,0b111,0b001,0b001],
    [0b110,0b100,0b110,0b010,0b011], [0b111,0b001,0b010,0b100,0b111],
    [0b010,0b111,0b010,0b111,0b010], [0b101,0b010,0b101,0b010,0b101],
    [0b100,0b100,0b100,0b100,0b111], [0b011,0b100,0b010,0b001,0b110]
  ];

  // ---- pre-baked static layers ---------------------------------------------
  const layer = (draw) => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { alpha: true });
    const sx = b; // swap target
    const saveRect = rect, savePx = px;
    draw(g);
    return c;
  };
  // simpler: draw into b then snapshot
  const snapshot = (drawFn, transparent) => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { alpha: true });
    drawFn(g);
    return c;
  };
  const R = (g) => (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x | 0, y | 0, w | 0, h | 0); };

  // --- sky + distant city ---
  const skyLayer = snapshot((g) => {
    const r = R(g);
    for (let y = 0; y < 150; y++) {
      const u = y / 150;
      let col = P.skyTop;
      if (u > 0.30) col = P.skyLow;
      if (u > 0.58) col = P.skyGlow;
      r(0, y, W, 1, col);
      // static dither band between steps so shadows keep steps, no crawl
      if (u > 0.22 && u < 0.36) for (let x = 0; x < W; x++) if (bay(x, y) < 0.25) r(x, y, 1, 1, P.skyLow);
      if (u > 0.50 && u < 0.62) for (let x = 0; x < W; x++) if (bay(x, y) < 0.3) r(x, y, 1, 1, P.skyGlow);
    }
    // far skyline (cold layer 1)
    let x = -4;
    while (x < W) {
      const w = ri(7, 20), h = ri(14, 46), top = 118 - h;
      r(x, top, w, h + 8, P.farTower);
      // roofline details
      if (rnd() < 0.5) r(x + 2, top - 3, 2, 3, P.farTower);
      if (rnd() < 0.35) r(x + w - 4, top - 5, 1, 5, P.farTower);
      for (let wy = top + 3; wy < 120; wy += 4)
        for (let wx = x + 2; wx < x + w - 2; wx += 3)
          if (rnd() < 0.10) r(wx, wy, 1, 1, P.farTowerLit);
      x += w + ri(1, 4);
    }
    // nearer cold layer 2 with setbacks + tanks
    x = -6;
    while (x < W) {
      const w = ri(12, 28), h = ri(22, 58), top = 140 - h;
      r(x, top, w, h + 10, P.midTower);
      r(x, top, w, 1, P.midEdge);
      const sb = ri(3, 7);
      r(x + sb, top - ri(4, 11), w - sb * 2, 11, P.midTower);
      if (rnd() < 0.6) { r(x + 3, top - 7, 4, 4, P.midTower); r(x + 4, top - 3, 1, 3, P.midTower); }
      for (let wy = top + 4; wy < 142; wy += 5)
        for (let wx = x + 3; wx < x + w - 3; wx += 4)
          if (rnd() < 0.14) r(wx, wy, 1, 2, P.farTowerLit);
      x += w + ri(2, 6);
    }
    // viaduct across the far band
    r(0, 108, W, 2, P.stone);
    r(0, 110, W, 1, P.midEdge);
    for (let vx = 4; vx < W; vx += 26) { r(vx, 111, 3, 10, P.stone); r(vx, 121, 3, 1, P.midEdge); }
    // nearer cold layer 3: the rooftops of the neighbouring block, the band between the far
    // city and the shack roof. Its own hashed sequence, so the seeded layout after it is unchanged.
    r(0, 148, W, 152, P.midTower);
    for (let y = 148; y < 154; y++) for (let x = 0; x < W; x++) if (bay(x, y) < (154 - y) / 7) r(x, y, 1, 1, P.skyGlow);
    let nx = -3, k = 0;
    while (nx < W) {
      const nw = 14 + Math.floor(hash(k, 71) * 22), top = 152 + Math.floor(hash(k, 72) * 26);
      r(nx, top, nw, 300 - top, k & 1 ? P.blockDark : P.block);
      r(nx, top, nw, 1, P.midEdge);
      r(nx + nw - 1, top + 1, 1, 300 - top, P.blockDark);
      if (hash(k, 73) < 0.5) {
        const tx = nx + 2 + Math.floor(hash(k, 74) * Math.max(1, nw - 9));
        r(tx, top - 7, 6, 5, P.midEdge); r(tx, top - 7, 6, 1, P.stoneEdge);
        r(tx + 1, top - 2, 1, 2, P.midEdge); r(tx + 4, top - 2, 1, 2, P.midEdge);
      } else if (hash(k, 75) < 0.6) {
        r(nx + 3, top - 3, 5, 3, P.midEdge); r(nx + 4, top - 4, 3, 1, P.midEdge);
      }
      for (let wy = top + 4; wy < 238; wy += 6)
        for (let wx = nx + 2; wx < nx + nw - 2; wx += 4) {
          const v = hash(k * 977 + wx, wy);
          if (v < 0.035) r(wx, wy, 2, 2, P.amberDeep);
          else if (v < 0.16) r(wx, wy, 2, 2, P.farTowerLit);
        }
      nx += nw + 1 + Math.floor(hash(k, 76) * 3);
      k++;
    }
  });

  // --- the apartment block (midground right) ---
  const BLOCK = { x: 168, y: 86, w: 126, h: 214 };
  const windows = [];   // {x,y,w,h,floor,kind}
  const blockLayer = snapshot((g) => {
    const r = R(g);
    const { x, y, w, h } = BLOCK;
    // stair tower (left edge, taller)
    r(x, y - 16, 22, h + 16, P.block);
    r(x, y - 16, 22, 1, P.stoneEdge);
    for (let sy = y - 10; sy < y + h; sy += 12) { r(x + 3, sy, 16, 1, P.blockLit); r(x + 3, sy + 1, 1, 11, P.blockDark); }
    // main mass with setbacks
    r(x + 22, y, w - 22, h, P.block);
    r(x + 22, y, w - 22, 1, P.stoneEdge);
    r(x + 34, y - 12, 54, 12, P.block);
    r(x + 34, y - 12, 54, 1, P.stoneEdge);
    r(x + 96, y - 6, 22, 6, P.block);
    r(x + 96, y - 6, 22, 1, P.stoneEdge);
    // brick courses: value steps so shadow never goes muddy
    for (let cy = y + 3; cy < y + h; cy += 6) r(x + 22, cy, w - 22, 1, P.blockLit);
    for (let cx = x + 24; cx < x + w; cx += 9) r(cx, y + 1, 1, h - 1, P.blockDark);
    // vertical pipe + fire escape
    r(x + 28, y + 6, 2, h - 6, P.blockDark);
    for (let fy = y + 28; fy < y + h - 10; fy += 26) {
      r(x + 100, fy, 24, 1, P.stoneEdge);
      r(x + 100, fy + 1, 1, 25, P.stoneEdge);
      r(x + 123, fy + 1, 1, 25, P.blockDark);
      for (let dx = 0; dx < 10; dx++) r(x + 112 + dx, fy + 3 + dx * 2, 10, 1, P.stone);
    }
    // balconies with laundry lines
    for (let by = y + 40; by < y + h - 24; by += 38) {
      r(x + 40, by, 46, 1, P.stoneEdge);
      r(x + 40, by + 1, 46, 3, P.blockDark);
      for (let bx = x + 41; bx < x + 86; bx += 4) r(bx, by - 5, 1, 5, P.stone);
      r(x + 44, by - 9, 36, 1, P.stone);
      for (let k = 0; k < 4; k++) { const lx = x + 47 + k * 9; r(lx, by - 8, 5, ri(4, 7), k % 2 ? P.tealDim : P.stoneEdge); }
    }
    // roof clutter: tanks, dishes, AC boxes, ducts
    r(x + 40, y - 24, 14, 12, P.stone);
    r(x + 40, y - 25, 14, 1, P.stoneEdge);
    r(x + 42, y - 12, 2, 4, P.blockDark); r(x + 51, y - 12, 2, 4, P.blockDark);
    r(x + 66, y - 20, 9, 8, P.stone); r(x + 66, y - 21, 9, 1, P.stoneEdge);
    for (let d = 0; d < 5; d++) r(x + 76 + d, y - 24 + d, 1, 2, P.stoneEdge); // dish rim
    r(x + 81, y - 22, 1, 10, P.blockDark);
    // windows grid: 6 cols x 5 rows, floor 0 = bottom
    const cols = 6, rows = 5;
    for (let row = 0; row < rows; row++) {
      for (let c = 0; c < cols; c++) {
        const wx = x + 32 + c * 15, wy = y + 16 + row * 36;
        if (wx > x + w - 12) continue;
        r(wx - 1, wy - 1, 10, 14, P.blockDark);
        r(wx, wy, 8, 12, P.stone);
        r(wx, wy, 8, 1, P.stoneEdge);
        windows.push({ x: wx, y: wy, floor: rows - 1 - row, col: c });
      }
    }
    // AC boxes hung under some windows
    for (let k = 0; k < 5; k++) {
      const wi = [2, 7, 12, 16, 22][k] % windows.length;
      const ww = windows[wi];
      r(ww.x + 1, ww.y + 13, 7, 5, P.stone);
      r(ww.x + 1, ww.y + 13, 7, 1, P.stoneEdge);
      ww.ac = { x: ww.x + 2, y: ww.y + 14 };
    }
  });

  // assign window roles with the seeded rng (after layer baked windows[])
  for (let i = 0; i < windows.length; i++) {
    const wn = windows[i];
    wn.lit = rnd() < 0.55;
    wn.k = [2, 3, 5, 7, 9, 11, 13][ri(0, 6)];
    wn.ph = rnd();
    wn.curtain = rnd() < 0.22;
    wn.pane = rnd() < 0.5;
  }
  windows[8].tv = true; windows[8].lit = true;
  windows[3].toggle = 'off';     // goes dark during the life beat
  windows[17].toggle = 'on';     // comes on during the life beat
  // relight order for the return: bottom floor first
  const relight = windows.filter(w => w.lit).sort((a, c) => (c.floor - a.floor) || (a.col - c.col));

  // --- rooftop, shack, street level, foreground frame ---
  const SHACK = { x: 26, y: 186, w: 84, h: 70 };
  const roofLayer = snapshot((g) => {
    const r = R(g);
    // street canyon between shack roof and block
    r(0, 240, W, 60, P.skyTop);
    r(150, 246, 150, 54, '#090d16');
    // wet street + puddles (static base; reflections animate)
    r(150, 268, 150, 32, '#0b1220');
    r(150, 268, 150, 1, P.teal);
    r(188, 280, 34, 7, P.roofPool);
    r(240, 288, 44, 6, P.roofPool);
    r(160, 292, 20, 4, P.roofPool);

    // noodle stall (bottom right) — awning, counter, stools
    r(210, 250, 54, 3, P.magentaDim);
    for (let sx2 = 210; sx2 < 264; sx2 += 6) r(sx2, 253, 3, 2, P.magentaDim);
    r(214, 256, 46, 12, '#161018');
    r(214, 268, 46, 2, '#0d0a10');
    for (let k = 0; k < 4; k++) r(219 + k * 11, 270, 3, 6, '#140f16');
    r(246, 247, 1, 3, P.magentaDim);
    // vending machine
    r(272, 248, 18, 24, '#151c28');
    r(273, 250, 16, 14, P.stoneEdge);
    for (let k = 0; k < 3; k++) r(275, 251 + k * 4, 12, 3, P.stone);
    r(273, 266, 16, 4, '#0d1420');

    // rooftop deck (foreground plane)
    r(0, 248, 152, 52, P.roof);
    r(0, 248, 152, 1, P.roofWet);
    for (let ry = 254; ry < 300; ry += 7) r(0, ry, 152, 1, P.roofWet);
    for (let rx2 = 6; rx2 < 152; rx2 += 11) r(rx2, 249, 1, 51, '#101620');
    // standing water on the deck
    r(16, 274, 40, 6, P.roofPool);
    r(74, 286, 46, 7, P.roofPool);
    r(112, 262, 22, 4, P.roofPool);

    // water tank on stilts, right of shack
    r(116, 170, 28, 24, P.stone);
    r(116, 169, 28, 1, P.stoneEdge);
    r(116, 176, 28, 1, P.stoneEdge);
    r(116, 186, 28, 1, P.blockDark);
    for (let k = 0; k < 4; k++) r(118 + k * 8, 194, 2, 56, P.stone);
    r(116, 194, 28, 1, P.blockDark);
    r(138, 194, 2, 30, P.stoneEdge); // downpipe
    r(138, 224, 6, 1, P.stoneEdge);

    // the shack
    const { x, y, w, h } = SHACK;
    r(x - 2, y + 8, w + 4, h, P.shack);
    r(x - 2, y + 8, w + 4, 1, P.shackEdge);
    // corrugated roof: alternating value steps, overhanging
    for (let cx = x - 8; cx < x + w + 8; cx += 3) {
      r(cx, y, 2, 9, P.corrug);
      r(cx + 2, y, 1, 9, P.shackEdge);
    }
    r(x - 8, y + 9, w + 16, 2, P.blockDark);
    // wall panels + rivets
    for (let py = y + 14; py < y + h + 8; py += 9) r(x - 2, py, w + 4, 1, P.shackEdge);
    for (let rx2 = x + 2; rx2 < x + w; rx2 += 14) r(rx2, y + 12, 1, h + 2, '#141a24');
    // doorway cavity (light fills it per frame)
    r(x + 26, y + 20, 30, 50, P.blockDark);
    // shelves inside, left of the door
    r(x + 4, y + 26, 20, 1, P.shackEdge);
    r(x + 4, y + 40, 20, 1, P.shackEdge);
    // window slit right of door
    r(x + 62, y + 24, 14, 10, P.blockDark);
    r(x + 62, y + 24, 14, 1, P.shackEdge);
    // potted fern by the door
    r(x + 58, y + 62, 9, 8, P.orangeDeep);
    r(x + 58, y + 62, 9, 1, P.orange);
    r(x + 61, y + 66, 1, 4, '#5d2a10'); // crack
    // railing (foreground frame) along deck edge
    r(0, 232, 152, 1, P.railEdge);
    for (let rx2 = 4; rx2 < 152; rx2 += 16) r(rx2, 233, 2, 20, P.rail);
    r(0, 240, 152, 1, P.rail);
    r(152, 228, 148, 1, P.railEdge);
    for (let rx2 = 156; rx2 < 300; rx2 += 18) r(rx2, 229, 2, 16, P.rail);
  });

  // --- foreground cable along the top edge, with junction box ---
  const cablePts = [];
  for (let x = 0; x < W; x++) {
    const u = x / (W - 1);
    const y = 16 + 26 * Math.sin(Math.PI * u) * (0.6 + 0.4 * Math.sin(Math.PI * u * 1.7));
    cablePts.push(y | 0);
  }
  const JBOX = { x: 196, y: 0 };
  JBOX.y = cablePts[196] - 5;

  // ---- animated element tables (immutable) ---------------------------------
  const K = [2, 3, 5, 7, 9, 11, 13];
  // rain: three depth planes, closed-form wrap
  const mkRain = (n, span, cycles, len, col, dim) => Array.from({ length: n }, () => ({
    x: ri(-20, W + 10), y0: rnd() * span, span, v: (span * cycles) / DURATION,
    len, col, dim, lean: 0.18 + rnd() * 0.08
  }));
  const rainFar = mkRain(150, 300, 9, 1, P.rainDim, true);
  const rainMid = mkRain(190, 320, 14, 2, P.rain, false);
  const rainNear = mkRain(120, 340, 22, 4, P.rainBright, false);

  // drips from named ledges
  const drips = [
    { x: 36, y: 196, land: 248, k: 5, ph: 0.1 },      // shack roof edge
    { x: 104, y: 196, land: 258, k: 7, ph: 0.4 },
    { x: 131, y: 224, land: 264, k: 3, ph: 0.7 },     // tank downpipe
    { x: 236, y: 255, land: 288, k: 5, ph: 0.25 },    // stall awning
    { x: 252, y: 255, land: 288, k: 9, ph: 0.62 },
    { x: 84, y: 233, land: 288, k: 11, ph: 0.33 }     // railing
  ];
  // ripple ring (precomputed pixel offsets per radius)
  const rings = [];
  for (let rad = 1; rad <= 6; rad++) {
    const pts = [];
    let rx = rad, ry = 0, err = 0;
    while (rx >= ry) {
      const o = [[rx, ry], [ry, rx], [-rx, ry], [-ry, rx], [rx, -ry], [ry, -rx], [-rx, -ry], [-ry, -rx]];
      for (const p of o) pts.push(p);
      ry++; err += 1 + 2 * ry;
      if (2 * (err - rx) + 1 > 0) { rx--; err += 1 - 2 * rx; }
    }
    rings.push(pts);
  }
  // steam puffs from the mug, vent smoke from the block
  const puffs = Array.from({ length: 10 }, (_, i) => ({ k: K[i % 7], ph: i / 10, dx: (i % 3) - 1 }));
  const vents = Array.from({ length: 8 }, (_, i) => ({ k: K[(i + 2) % 7], ph: (i * 0.37) % 1, dx: (i % 2) ? 1 : 0 }));
  // AC fan blades: 4-step
  const fans = windows.filter(w => w.ac).map((w, i) => ({ x: w.ac.x, y: w.ac.y, k: [9, 11, 13, 7, 5][i % 5] }));
  // LEDs on the vending machine / terminal / dishes
  const leds = [
    { x: 288, y: 250, k: 7, col: P.green }, { x: 288, y: 256, k: 11, col: P.orange },
    { x: 258, y: 249, k: 13, col: P.magenta }, { x: 249, y: 87, k: 5, col: P.green },
    { x: 182, y: 70, k: 9, col: P.orange }
  ];
  // rain beads sliding along the top cable
  const beads = Array.from({ length: 7 }, (_, i) => ({ k: [3, 5, 7, 9, 11, 13, 5][i], ph: i / 7, dir: i % 2 ? 1 : -1 }));
  // CRT glyph rows
  const crtRows = Array.from({ length: 6 }, () => Array.from({ length: 5 }, () => ri(0, 7)));
  // billboard koi body: pixel list in local coords
  const koi = [];
  for (let i = 0; i < 26; i++) {
    const u = i / 25;
    const bx = u * 24, byy = 4 * Math.sin(u * 3.1), th = 3.2 * Math.sin(Math.PI * Math.pow(u, 0.7));
    for (let o = -th; o <= th; o++) koi.push([bx, byy + o, u]);
  }

  // helper: how lit is the city at time t (brownout envelope)
  const cityPower = (p) => {
    // dark from 0.455 → wave down, hold, relight 0.72..0.90
    if (p < 0.45) return 1;
    if (p < 0.72) return 0;
    return sstep(0.72, 0.90, p);
  };

  window.renderFrame = function (time) {
    const t = ((time % DURATION) + DURATION) % DURATION;
    const p = t / DURATION;

      if (wn.pane) { rect(wn.x + 4, wn.y + 1, 1, 11, P.amberDeep); rect(wn.x, wn.y + 6, 8, 1, P.amberDeep); }

      if (step === 0) { rect(f.x + 1, f.y + 1, 5, 1, c); }

    }

Settle = note('\u003c[c5 eb5 c5] ~>')\\n  .clip(0.22)\\n  .adsr('0.012:0.48:0:0.08')\\nconst bellForm = arrange(\\n  [2, bellFragment],\\n  [8, bellBeat],\\n  [6, bellBrownout],\\n  [4, bellRelight],\\n  [2, bellSettle]\\n)\\nconst rainWarm = s('pink')\\n  .hpf('\u003c620 760 680 840>')\\n  .clip(1)\\n  .attack(0.18)\\n  .release(0.32)\\n  .velocity(0.68)\\nconst rainCold = s('pink')\\n  .hpf('\u003c920 1080>')\\n  .clip(1)\\n  .attack(0.18)\\n  .release(0.32)\\n  .velocity(0.68)\\nconst rainForm = arrange(\\n  [2, rainWarm],\\n  [8, rainWarm],\\n  [6, rainCold],\\n  [4, rainWarm],\\n  [2, rainWarm]\\n)\\nconst closeRain = s('pink')\\n  .bpf(3000)\\n  .clip(1)\\n  .attack(0.2)\\n  .release(0.3)\\n  .velocity(0.16)\\nconst spark = stack(\\n  s('[white white white] ~ ~ ~')\\n    .hpf(4000)\\n    .clip(0.04)\\n    .adsr('0.002:0.025:0:0.03'),\\n  s('white')\\n    .hpf(4500)\\n    .clip(0.32)\\n    .adsr('0.005:0.45:0:0.1')\\n    .velocity(0.35)\\n)\\n  .velocity(0.9)\\nconst sparkWindow = arrange(\\n  [7.7, silence],\\n  [0.33, spark],\\n  [13.97, silence]\\n)\\nconst neonBuzz = stack(\\n  s('[white ~ white white] [~ white] ~ ~')\\n    .bpf(1200)\\n    .clip(0.055)\\n    .adsr('0.004:0.06:0:0.04'),\\n  s('white')\\n    .bpf(1200)\\n    .clip(0.4)\\n    .adsr('0.02:0.62:0:0.08')\\n    .velocity(0.28)\\n)\\n  .velocity(0.72)\\nconst neonWindow = arrange(\\n  [18.7, silence],\\n  [0.44, neonBuzz],\\n  [2.86, silence]\\n)\\n$: drumForm\\n  .bank('AkaiMPC60')\\n  .lpf(9000)\\n  .gain(0.24)\\n$: stack(\\n  bassForm.s('sine'),\\n  bassForm.add(note(12)).s('triangle').velocity(0.33),\\n  powerSag\\n)\\n  .late(0.01)\\n  .gain(0.16)\\n$: stack(\\n  pianoForm.add(note(-0.06)).s('triangle').velocity(0.52).pan(0.42),\\n  pianoForm.add(note(0.06)).s('triangle').velocity(0.52).pan(0.58),\\n  pianoForm.s('sawtooth').velocity(0.12).pan(0.5)\\n)\\n  .lpf(2400)\\n  .room(0.18)\\n  .roomsize(0.55)\\n  .gain(0.3)\\n$: stack(\\n  bellForm.s('sine'),\\n  bellForm.add(note(19)).s('sine').velocity(0.25)\\n)\\n  .late(0.012)\\n  .gain(0.18)\\n$: stack(\\n  rainForm,\\n  closeRain,\\n  sparkWindow,\\n  neonWindow\\n)\\n  .pan('\u003c0.28 0.72 0.4 0.64>')\\n  .gain(0.07)\",\"bpm\":88,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.36666666666666664,\"cycles\":22,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"offlineMaxPolyphony\":1000000000,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);

    // function to exist) must not both evaluate the program, or every $: voice
    // is registered twice and the offline render plays each one doubled (+6 dB).
    let initPromise = null;
    function ensureInit() {
      if (!initPromise) {
        initPromise = (async () => {
          await S.initStrudel({ autoplay: false });
          await S.evaluate(CONFIG.code, false);
          await buildTimeline();
          console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
        })().catch(error => {
          initPromise = null; // a failed init may be retried, as before
          throw error;
        });

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};

        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),

        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)

      const cycle = tSeconds * tl.cps;

      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);

    window.addEventListener('message', event => {

        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');

    }

  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
