<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 3; i++) {
    v += a * noise(p);
    p *= 2.1;
    a *= 0.5;
  }
  return v;
}

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float glyph(vec2 p, float seed) {
  p *= 5.0;
  vec2 g = floor(p);
  vec2 f = fract(p) - 0.5;
  float h = hash(g + seed);
  float d = 1.0;
  if(h > 0.7) d = min(d, abs(f.x));
  if(h > 0.4) d = min(d, abs(f.y));
  if(h > 0.5) d = min(d, abs(f.x + f.y));
  if(h > 0.6) d = min(d, abs(f.x - f.y));
  return smoothstep(0.08, 0.0, d);
}

float corridor(vec3 p) {
  float w = 2.5 + 0.3 * sin(p.z * 0.4);
  float d = -sdBox(p, vec3(w, w, 100.0));
  float ribs = sdBox(vec3(mod(p.x + 0.5, 1.0) - 0.5, p.y, mod(p.z + 2.0, 4.0) - 2.0), vec3(0.05, w + 0.1, 0.05));
  d = max(d, -ribs + 0.3);
  return d;
}

float scene(vec3 p) {
  return corridor(p);
}

vec3 calcNorm(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(
    scene(p + e.xyy) - scene(p - e.xyy),
    scene(p + e.yxy) - scene(p - e.yxy),
    scene(p + e.yyx) - scene(p - e.yyx)
  ));
}

vec3 spectralThread(vec2 uv, float t, float offset, float speed) {
  float phase = t * speed + offset;
  float y = sin(uv.x * 3.0 + phase) * 0.3 + cos(uv.x * 7.0 + phase * 1.3) * 0.15;
  y += sin(uv.x * 11.0 - phase * 0.7) * 0.08;
  float d = abs(uv.y - y);
  float bright = smoothstep(0.06, 0.0, d);
  float pulse = 0.5 + 0.5 * sin(phase * 2.0 + uv.x * 5.0);
  return bright * pulse * vec3(1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = mod(iTime, 60.0);
  float phase = t / 60.0;

  float warmth = smoothstep(0.3, 0.7, 0.5 + 0.5 * sin(phase * 6.28318));

  vec3 coldBg = vec3(0.02, 0.01, 0.06);
  vec3 warmBg = vec3(0.12, 0.08, 0.02);
  vec3 bg = mix(coldBg, warmBg, warmth);

  float camZ = t * 1.5;
  float camSway = sin(t * 0.3) * 0.4;
  vec3 ro = vec3(camSway, sin(t * 0.2) * 0.3, camZ);
  vec3 lookAt = vec3(sin(t * 0.15) * 0.2, cos(t * 0.25) * 0.1, camZ + 5.0);
  vec3 fwd = normalize(lookAt - ro);
  vec3 right = normalize(cross(vec3(0, 1, 0), fwd));
  vec3 up = cross(fwd, right);
  vec3 rd = normalize(fwd * 1.5 + right * uv.x + up * uv.y);

  float totalDist = 0.2;
  vec3 col = bg;
  float hit = 0.0;

  for(int i = 0; i < 80; i++) {
    vec3 p = ro + rd * totalDist;
    float d = scene(p);
    if(d < 0.002) { hit = 1.0; break; }
    if(totalDist > 40.0) break;
    totalDist += d * 0.8;
  }

  if(hit > 0.5) {
    vec3 p = ro + rd * totalDist;
    vec3 n = calcNorm(p);
    float diff = max(dot(n, normalize(vec3(1, 1, -1))), 0.0);

    vec3 indigo = vec3(0.15, 0.08, 0.35);
    vec3 amber = vec3(0.6, 0.35, 0.08);
    float blend = 0.5 + 0.5 * sin(p.z * 0.3 + t * 0.5);
    vec3 wallCol = mix(indigo, amber, blend * warmth + (1.0 - warmth) * (1.0 - blend));

    col = wallCol * (diff * 0.4 + 0.15);

    float glyphVal = glyph(p.xy * 0.5 + vec2(0, t * 0.1), floor(p.z * 0.5));
    float glyphFade = smoothstep(0.0, 1.0, sin(t * 1.5 + p.z * 0.8) * 0.5 + 0.5);
    vec3 glyphCol = mix(vec3(0.3, 0.5, 0.9), vec3(0.9, 0.6, 0.2), warmth);
    col += glyphCol * glyphVal * glyphFade * 0.3;

    float fog = exp(-totalDist * 0.08);
    col = mix(bg, col, fog);
  }

  vec3 threads = vec3(0.0);
  for(int i = 0; i < 5; i++) {
    float fi = float(i);
    float off = fi * 1.256;
    vec3 tc = spectralThread(uv, t, off, 0.4 + fi * 0.1);

    float indigoW = 1.0 - warmth;
    vec3 threadCol = mix(
      vec3(0.3 + fi * 0.1, 0.15, 0.7 - fi * 0.05),
      vec3(0.8, 0.5 - fi * 0.05, 0.1),
      warmth * (0.5 + 0.5 * sin(t + fi))
    );
    threads += tc * threadCol * (0.6 + 0.4 * sin(t * 0.7 + fi * 2.0));
  }
  col += threads * 0.7;

  float phosphor = fbm(uv * 3.0 + t * 0.2);
  float pulse = smoothstep(0.4, 0.7, phosphor) * (0.5 + 0.5 * sin(t * 2.0 + phosphor * 10.0));
  vec3 phosphorCol = mix(vec3(0.1, 0.4, 0.3), vec3(0.5, 0.3, 0.1), warmth);
  col += phosphorCol * pulse * 0.15;

  float glitchLine = step(0.97, hash(vec2(floor(uv.y * 80.0), floor(t * 3.0))));
  float glitchShift = (hash(vec2(floor(t * 7.0), floor(uv.y * 40.0))) - 0.5) * 0.03;
  col = mix(col, col.gbr * 1.2, glitchLine * 0.6);

  if(warmth < 0.4) {
    for(int i = 0; i < 30; i++) {
      float fi = float(i);
      vec2 starPos = vec2(hash(vec2(fi, 1.0)), hash(vec2(fi, 2.0))) * 2.0 - 1.0;
      float starBright = hash(vec2(fi, 3.0)) * (1.0 - warmth);
      float starDist = length(uv - starPos);
      col += vec3(0.7, 0.8, 1.0) * starBright * smoothstep(0.008, 0.0, starDist) * 0.5;
    }
  }

  if(warmth > 0.6) {
    float sunGlow = smoothstep(0.8, 0.0, length(uv - vec2(0.3, 0.4)));
    col += vec3(1.0, 0.85, 0.5) * sunGlow * (warmth - 0.6) * 0.4;
  }

  float vignette = 1.0 - 0.4 * length(uv);
  col *= vignette;

  col = pow(col, vec3(0.9));

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);
  const warmFilter = new Tone.Filter({ type: "lowpass", frequency: 2000, Q: 0.7 }).connect(masterDelay);

  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(warmFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const coldChords = [
    ["E3", "B3", "F#4"],
    ["C#3", "G#3", "E4"],
    ["A2", "E3", "C#4"]
  ];
  const warmChords = [
    ["D3", "A3", "F#4"],
    ["G3", "B3", "E4"],
    ["A3", "D4", "F#4"]
  ];

  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.floor(60 / barLen);
    const progress = bar / totalBars;
    const isWarm = Math.sin(progress * Math.PI * 2) > 0;
    const chords = isWarm ? warmChords : coldChords;

    if (bar >= totalBars - 2) {
      pad.triggerAttackRelease(coldChords[0], "1n", time, 0.08);
    } else {
      pad.triggerAttackRelease(chords[chordIndex % chords.length], "1n", time, 0.12);
    }
    chordIndex++;
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3500 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -20;

  const threadNotes = ["F#5", "E5", "B4", "C#5", "A4", "D5", "G#4", "F#4"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.floor(60 / barLen);

    if (bar >= totalBars - 2) return;

    const shouldPlay = Math.random() < 0.4;
    if (shouldPlay && bar >= 2) {
      const note = threadNotes[bellIndex % threadNotes.length];
      bell.triggerAttackRelease(note, "4n", time, 0.3 + Math.random() * 0.2);
    }
    bellIndex++;
  }, "2n").start(0);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.4, release: 1.5 },
    filterEnvelope: { attack: 0.5, decay: 0.3, sustain: 0.3, baseFrequency: 40, octaves: 1 }
  }).connect(warmFilter);
  subBass.volume.value = -18;

  const subNotes = ["E1", "C#1", "A0", "D1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.floor(60 / barLen);

    if (bar >= totalBars - 2) {
      subBass.triggerAttackRelease("E1", "2n", time, 0.1);
    } else if (bar >= 1) {
      subBass.triggerAttackRelease(subNotes[subIndex % subNotes.length], "2n", time, 0.25);
    }
    subIndex++;
  }, "2n").start(0);

  const glitchNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 }
  }).connect(new Tone.Filter({ type: "bandpass", frequency: 3000, Q: 2 }).connect(masterReverb));
  glitchNoise.volume.value = -28;

  let glitchCount = 0;
  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.floor(60 / barLen);
    if (bar >= totalBars - 3) return;

    if (Math.random() < 0.15 && bar >= 3) {
      glitchNoise.triggerAttackRelease("32n", time);
    }
    glitchCount++;
  }, "8n").start(0);

  const shimmer = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 2.0, sustain: 0.2, release: 2.5 }
  }).connect(new Tone.Chorus({ frequency: 0.3, delayTime: 2.5, depth: 0.8, wet: 0.5 }).connect(masterReverb).start());
  shimmer.volume.value = -24;

  const shimmerNotes = ["B5", "F#5", "E5", "C#6", "A5"];
  let shimmerIndex = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const totalBars = Math.floor(60 / barLen);
    if (bar < 4 || bar >= totalBars - 3) return;

    if (Math.random() < 0.25) {
      shimmer.triggerAttackRelease(shimmerNotes[shimmerIndex % shimmerNotes.length], "2n", time, 0.15);
      shimmerIndex++;
    }
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    warmFilter.frequency.linearRampToValueAtTime(4000, time + 8 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    warmFilter.frequency.linearRampToValueAtTime(1500, time + 4 * barLen);
  }, "12:0:0");

  window.toneJsInstruments = { pad, bell, subBass, glitchNoise, shimmer };
  window.toneJsParts = { padLoop, bellLoop, subLoop, glitchLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
