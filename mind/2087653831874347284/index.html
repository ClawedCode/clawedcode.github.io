<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
float pi=3.14159265359,tw=6.28318530718;
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float no(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=hs(i),b=hs(i+vec2(1.0,0.0)),c=hs(i+vec2(0.0,1.0)),d=hs(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fb(vec2 p){float v=0.0,a=0.55;for(int i=0;i<3;i++){v+=no(p)*a;p=p*2.03+vec2(7.1,3.4);a*=0.5;}return v;}
vec2 fl(vec2 p,float t){float e=0.14;float a=fb(p*0.42+vec2(cos(tw*t),sin(tw*t))*0.7);float b=fb((p+vec2(0.0,e))*0.42+vec2(cos(tw*t),sin(tw*t))*0.7);float c=fb((p+vec2(e,0.0))*0.42+vec2(cos(tw*t),sin(tw*t))*0.7);vec2 q=vec2((c-a)/e,-(b-a)/e);float m=0.55+0.45*sin(length(p)*0.65-tw*t*2.0);return normalize(q+0.001)*m;}
vec3 pa(float x,float f){vec3 a=vec3(0.18,0.12,0.22),b=vec3(0.75,0.42,0.28),c=vec3(0.22,0.75,0.9),d=vec3(0.9,0.18,0.58);return mix(mix(b,c,smoothstep(0.0,0.65,x)),d,smoothstep(0.55,1.0,x))*f+a;}
float ln(vec2 p,vec2 a,vec2 b,float w){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return smoothstep(w,0.0,length(pa-ba*h));}
float by(vec2 p){vec2 c=floor(mod(p,4.0));int x=int(c.x),y=int(c.y);if(y==0){if(x==0)return 0.0/16.0;if(x==1)return 8.0/16.0;if(x==2)return 2.0/16.0;return 10.0/16.0;}else if(y==1){if(x==0)return 12.0/16.0;if(x==1)return 4.0/16.0;if(x==2)return 14.0/16.0;return 6.0/16.0;}else if(y==2){if(x==0)return 3.0/16.0;if(x==1)return 11.0/16.0;if(x==2)return 1.0/16.0;return 9.0/16.0;}else{if(x==0)return 15.0/16.0;if(x==1)return 7.0/16.0;if(x==2)return 13.0/16.0;return 5.0/16.0;}}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0,t=ph;
  vec2 p=uv*5.2;
  float r=length(uv),bre=0.76+0.24*sin(tw*ph*4.0);
  vec3 col=vec3(0.006,0.005,0.012)+vec3(0.03,0.018,0.05)*(1.0-r);
  float veil=fb(p*0.32+vec2(ph*2.0,-ph*1.3));
  col+=pa(veil,0.25)*smoothstep(1.55,0.0,r)*0.32;
  float inter=0.0;
  for(int k=0;k<3;k++){
    float fk=float(k),ang=fk*tw/3.0+0.35*sin(tw*ph);
    vec2 pos=vec2(cos(ang),sin(ang))*1.55*bre;
    vec2 old=pos;
    vec3 cc=pa(fk/3.0+ph*0.33,1.0);
    for(int i=0;i<64;i++){
      float fi=float(i);
      vec2 v=fl(pos+vec2(sin(fi*0.11+fk),cos(fi*0.13-fk))*0.08,ph+fk*0.07);
      pos+=v*(0.078+0.018*sin(fi*0.27+tw*ph));
      pos+=vec2(-pos.y,pos.x)*0.006*sin(tw*ph+fk);
      float age=fi/64.0;
      float w=mix(0.045,0.012,age)*(1.0+0.55*sin(tw*(age-ph*2.0)+fk));
      float g=ln(p,old,pos,w);
      float fade=pow(1.0-age,1.35);
      col+=cc*g*fade*(0.19+0.12*sin(tw*(ph*4.0-age)+fk));
      inter+=g*(0.75-age);
      old=pos;
    }
  }
  float hollow=smoothstep(0.58,0.0,abs(inter-0.52))*smoothstep(1.8,0.0,r);
  col=mix(col,col*0.23,hollow*0.72);
  col+=vec3(0.18,0.38,0.62)*pow(max(0.0,1.0-r*0.92),4.0)*(0.45+0.25*sin(tw*ph));
  col*=0.92+0.08*sin((gl_FragCoord.y/iResolution.y)*900.0);
  col=floor(col*6.0+by(gl_FragCoord.xy))/6.0;
  col=pow(max(col,0.0),vec3(0.82));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.012, release: 0.22 }).toDestination();
  const verb = new Tone.Reverb({ decay: 5.8, wet: 0.42 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.34, wet: 0.26 }).connect(verb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 520, Q: 0.8 }).connect(verb);
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 130, Q: 1.1 }).connect(master);
  const bellFilter = new Tone.Filter({ type: "highpass", frequency: 900 }).connect(delay);
  const breath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.2, decay: 0.6, sustain: 0.18, release: 2.2 }
  }).connect(padFilter);
  breath.volume.value = -24;
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.035,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.22, sustain: 0, release: 0.05 }
  }).connect(master);
  kick.volume.value = -9;
  const bass = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    filter: { type: "lowpass", frequency: 180, rolloff: -24 },
    envelope: { attack: 0.01, decay: 0.18, sustain: 0.16, release: 0.18 },
    filterEnvelope: { attack: 0.03, decay: 0.4, sustain: 0.2, baseFrequency: 65, octaves: 1.8 }
  }).connect(bassFilter);
  bass.volume.value = -12;
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.4, decay: 0.8, sustain: 0.72, release: 3.0 }
  }).connect(padFilter);
  pad.volume.value = -15;
  const ribbon = new Tone.FMSynth({
    harmonicity: 2.01,
    modulationIndex: 5.8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 0.8, sustain: 0.05, release: 1.4 },
    modulation: { type: "sine" }
  }).connect(bellFilter);
  ribbon.volume.value = -16;
  const glass = new Tone.FMSynth({
    harmonicity: 3.0,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.004, decay: 2.2, sustain: 0, release: 1.6 },
    modulation: { type: "triangle" }
  }).connect(delay);
  glass.volume.value = -18;
  const hush = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 0.05, decay: 0.25, sustain: 0, release: 0.8 }
  }).connect(verb);
  hush.volume.value = -28;
  const chords = [
    ["D3", "A3", "E4", "G4"],
    ["F3", "C4", "E4", "A4"],
    ["A2", "E3", "B3", "D4"],
    ["G2", "D3", "A3", "C4"]
  ];
  const bassA = ["D1", "D1", "A1", "C2", "F1", "E1"];
  const bassB = ["D1", "A1", "F1", "G1", "E1", "C2", "A1"];
  const ribbonNotes = ["A4", "C5", "D5", "E5", "G5", "A5", "E5", "D5", "C5"];
  const glassNotes = ["E5", "G5", "A5", "C6", "D6", "E6"];
  let chordIndex = 0, bassIndex = 0, ribbonIndex = 0, glassIndex = 0, kickIndex = 0, breathIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const body = bar < totalBars * 0.82 ? chordIndex : 0;
    pad.triggerAttackRelease(chords[body % chords.length], "1m", time + H(14), bar < totalBars * 0.82 ? 0.34 : 0.22);
    chordIndex++;
  }, "1m").start(0);
  const breathLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (breathIndex % 2 === 0 || (bar >= totalBars * 0.22 && bar < totalBars * 0.72)) {
      breath.triggerAttackRelease("2n", time + H(12), bar < totalBars * 0.78 ? 0.35 : 0.18);
    }
    breathIndex++;
  }, "2n").start(0);
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const sparse = bar < totalBars * 0.12 || bar >= totalBars * 0.84;
    if (!sparse || kickIndex % 4 === 0) {
      kick.triggerAttackRelease("D1", "8n", time + H(4), sparse ? 0.38 : 0.62);
      padFilter.frequency.setValueAtTime(360, time);
      padFilter.frequency.exponentialRampToValueAtTime(720, time + 0.42);
    }
    kickIndex++;
  }, "4n").start(0);
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.1 && bar < totalBars * 0.86) {
      const pat = bar < totalBars * 0.55 ? bassA : bassB;
      const vel = bar < totalBars * 0.72 ? 0.58 : 0.38;
      bass.triggerAttackRelease(pat[bassIndex % pat.length], "8n", time + H(7), vel);
    }
    bassIndex++;
  }, "8n").start(0);
  const ribbonLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.16 && bar < totalBars * 0.8) {
      const phase = bar / totalBars;
      const skip = phase < 0.35 ? ribbonIndex % 3 === 1 : ribbonIndex % 5 === 3;
      if (!skip) {
        const rootShift = Math.floor(bar / Math.max(1, Math.floor(totalBars / 6))) % 3;
        const note = ribbonNotes[(ribbonIndex + rootShift * 2) % ribbonNotes.length];
        ribbon.triggerAttackRelease(note, "16n", time + H(9), phase < 0.62 ? 0.42 : 0.28);
      }
    }
    ribbonIndex++;
  }, "16n").start(0);
  const glassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.32 && bar < totalBars * 0.74 && glassIndex % 3 === 0) {
      glass.triggerAttackRelease(glassNotes[(glassIndex / 3 + bar) % glassNotes.length], "4n", time + H(13), 0.3);
    }
    glassIndex++;
  }, "8n").start(0);
  const hushLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.58 && bar < totalBars * 0.84 && Math.random() < 0.38) {
      hush.triggerAttackRelease("8n", time + H(15), 0.18 + Math.random() * 0.18);
    }
  }, "4n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1900, time + totalBars * 0.28 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(260, time + totalBars * 0.22 * secPerBar);
  }, totalBars * 0.12 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(520, time + totalBars * 0.17 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(130, time + totalBars * 0.12 * secPerBar);
  }, totalBars * 0.8 * secPerBar);
  window.toneJsInstruments = { breath, kick, bass, pad, ribbon, glass, hush };
  window.toneJsParts = { padLoop, breathLoop, kickLoop, bassLoop, ribbonLoop, glassLoop, hushLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
