    { role: 'ghost', note: 'Eb5', velocity: 0.14 },
    { role: 'upper', note: stateBUpper[1], duration: '2n', velocity: 0.36, cutoff: 1950 },
    { role: 'glass', note: motif[2], duration: '4n', velocity: 0.32, cutoff: 2550 },
    { role: 'ghost', note: 'Bb4', velocity: 0.12 },
    { role: 'upper', note: stateBUpper[2], duration: '2n', velocity: 0.32, cutoff: 1850 },
    { role: 'glass', note: motif[0], duration: '8n', velocity: 0.27, cutoff: 2250 },
    { role: 'ghost', note: 'Ab4', velocity: 0.1 }
  ];
  centerSection.forEach((event, index) => {
    constellationEvents.push(eventAt(0.405 + index * (0.17 / 8), event));
  });
  const fourthSection = [
    { role: 'upper', note: transformedMotif[0], duration: '4n', velocity: 0.3, cutoff: 1850 },
    { role: 'ghost', note: 'Db5', velocity: 0.1 },
    { role: 'upper', note: transformedMotif[1], duration: '2n', velocity: 0.32, cutoff: 1700 },
    { role: 'ghost', note: 'Bb4', velocity: 0.09 },
    { role: 'upper', note: transformedMotif[2], duration: '2n', velocity: 0.3, cutoff: 1600 },
    { role: 'ghost', note: 'Eb4', velocity: 0.08 },
    { role: 'upper', note: transformedMotif[4], duration: '2n', velocity: 0.29, cutoff: 1450 }
  ];
  fourthSection.forEach((event, index) => {
    constellationEvents.push(eventAt(0.64 + index * (0.14 / 6), event));
  });
  motif.forEach((note, index) => {
    constellationEvents.push(eventAt(0.842 + index * 0.018, {
      role: 'upper',
      note,
      duration: index === 4 ? '2n' : '4n',
      velocity: index === 0 ? 0.38 : 0.28,
      cutoff: 1500 - index * 90
    }));
  });
  const pedalPart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (bar < 0 || bar >= totalBars * 0.94) return;
    pedalFilter.frequency.setValueAtTime(event.cutoff * 0.84, time);
    pedalFilter.frequency.linearRampToValueAtTime(event.cutoff, time + 1.2);
    pedalVoice.triggerAttackRelease(event.note, '1m', time, event.velocity);
  }, pedalEvents).start(0);
  const constellationPart = new Tone.Part((time, event) => {
    const bar = barAt(time);
    if (bar < 0 || bar >= totalBars * 0.97) return;
    if (event.role === 'glass') {
      glassFilter.frequency.setValueAtTime(event.cutoff * 0.76, time);
      glassFilter.frequency.linearRampToValueAtTime(event.cutoff, time + 0.7);
      glassVoice.triggerAttackRelease(event.note, event.duration, time, event.velocity);
      return;
    }
    if (event.role === 'upper') {
      upperFilter.frequency.setValueAtTime(event.cutoff * 0.82, time);
      upperFilter.frequency.linearRampToValueAtTime(event.cutoff, time + 0.9);
      upperVoice.triggerAttackRelease(event.note, event.duration, time, event.velocity);
      return;
    }
    metallicGhost.frequency.setValueAtTime(
      Tone.Frequency(event.note).toFrequency(),
      time
    );
    metallicGhost.triggerAttackRelease('32n', time, event.velocity);
  }, constellationEvents).start(0);
  window.toneJsInstruments = {
    masterLimiter,
    mixCompressor,
    masterGain,
    pedalBus,
    pedalFilter,
    pedalVoice,
    upperBus,
    upperFilter,
    upperVoice,
    glassBus,
    glassEcho,
    glassFilter,
    glassVoice,
    ghostBus,
    ghostFilter,
    metallicGhost
  };
  window.toneJsParts = {
    pedalPart,
    constellationPart
  };
};





window.audioDuration = 60;

window.ready = true;
