<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hs(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float ns(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hs(i), hs(i + vec2(1.0, 0.0)), f.x),
               mix(hs(i + vec2(0.0, 1.0)), hs(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fb(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
    for (float i = 0.0; i < 3.0; i++) {
        v += a * ns(p);
        p = m * p;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 45.0);
    float tau = 6.28318;
    float ph = t * tau / 45.0;
    vec3 col = vec3(0.01, 0.007, 0.022);

    vec2 w = vec2(fb(uv * 1.5 + t * 0.025), fb(uv * 1.5 + 50.0 + t * 0.025));
    vec2 wu = uv + w * 0.05;

    float em = fb(uv * 0.6 + vec2(fb(uv + t * 0.012), fb(uv + 80.0 + t * 0.012)));
    col += em * 0.02 * vec3(0.12, 0.1, 0.22);

    float r1c = 0.22 * sin(wu.x * 1.8 + ph) + 0.06 * cos(wu.x * 3.1 + ph);
    float r1d = abs(wu.y - r1c);
    float r1w = 0.08 + 0.012 * sin(wu.x * 2.3 + ph);
    float r1 = smoothstep(r1w, r1w * 0.12, r1d);
    float r1n = fb(vec2(uv.x * 3.5 - t * 0.3, uv.y * 2.0 + 10.0));
    r1 *= (0.4 + 0.6 * r1n) * (0.55 + 0.45 * sin(wu.x * 18.0 - ph * 2.0 + r1c * 10.0));
    r1 += r1 * pow(ns(vec2(uv.x * 16.0 - t * 1.4, uv.y * 10.0 + 5.0)), 4.0) * 2.5;
    col += r1 * mix(vec3(0.05, 0.28, 0.38), vec3(0.18, 0.62, 0.68), r1n);

    float r2c = -0.1 + 0.32 * sin(wu.x * 2.4 + ph * 4.0 + 0.8) + 0.13 * sin(wu.x * 4.6 + ph * 7.0);
    float r2d = abs(wu.y - r2c);
    float r2w = 0.055 + 0.02 * fb(vec2(wu.x * 3.0, t * 0.5));
    float r2 = smoothstep(r2w, r2w * 0.08, r2d);
    float r2n = fb(vec2(uv.x * 5.0 - t * 0.7, uv.y * 2.8 + 25.0));
    r2 *= 0.3 + 0.7 * r2n;
    float r2s = pow(ns(vec2(uv.x * 20.0 - t * 2.5, uv.y * 13.0)), 4.0);
    r2 += r2 * r2s * 3.0;
    col += r2 * mix(vec3(0.55, 0.15, 0.02), vec3(0.95, 0.48, 0.07), r2s);

    float minD = 1.0, csP = 0.0;
    float cr = cos(ph), sr = sin(ph);
    for (float i = 0.0; i < 32.0; i++) {
        float s = i / 32.0 * tau;
        vec2 cp = 0.32 * vec2(sin(s), sin(2.0 * s) * 0.62);
        cp = vec2(cr * cp.x - sr * cp.y, sr * cp.x + cr * cp.y);
        float d = length(wu - cp);
        if (d < minD) { minD = d; csP = s; }
    }
    float r3w = 0.04 + 0.01 * sin(csP * 2.0 + ph);
    float r3 = smoothstep(r3w, r3w * 0.15, minD);
    float r3n = fb(vec2(csP * 1.5 - t * 0.18, minD * 6.0 + 20.0));
    r3 *= 0.4 + 0.6 * r3n;
    r3 += r3 * pow(ns(vec2(csP * 8.0 - t * 0.8, minD * 12.0)), 4.0) * 2.0;
    col += r3 * mix(vec3(0.25, 0.04, 0.45), vec3(0.55, 0.2, 0.75), r3n);

    for (float i = 0.0; i < 5.0; i++) {
        float sd = i * 2.618 + 0.5;
        vec2 gp = vec2(0.42 * sin(sd * 1.3 + ph), 0.32 * cos(sd * 2.1 + ph));
        vec2 dp = uv - gp;
        float r = length(dp), a = atan(dp.y, dp.x);
        float circle = abs(r - 0.035);
        float tri = abs(r - 0.035 * (1.0 + 0.35 * cos(3.0 * a)));
        float sq = abs(r - 0.035 * (1.0 + 0.25 * cos(4.0 * a)));
        float morph = mod(t * 0.2 + sd, 3.0);
        float w1 = smoothstep(1.0, 0.0, abs(morph)) + smoothstep(1.0, 0.0, abs(morph - 3.0));
        float w2 = smoothstep(1.0, 0.0, abs(morph - 1.0));
        float w3 = smoothstep(1.0, 0.0, abs(morph - 2.0));
        float sh = (circle * w1 + tri * w2 + sq * w3) / max(w1 + w2 + w3, 0.001);
        float ga = smoothstep(0.004, 0.0, sh) * 0.1;
        col += ga * mix(vec3(0.25, 0.5, 0.6), vec3(0.5, 0.18, 0.65), sin(sd * 3.0) * 0.5 + 0.5);
    }

    col *= 1.0 - 0.32 * dot(uv, uv);
    col += col * col * 0.15;
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 76;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.0, wet: 0.4 }).toDestination();
  await masterReverb.generate();

  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4.5, depth: 0.7, wet: 0.45 }).connect(masterReverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.55, release: 2.5 }
  }).connect(padChorus);

  const chords = [
    ["A3", "C4", "E4"],
    ["F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["E3", "G#3", "B3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    let chord = bar >= 12 ? chords[0] : chords[chordIdx % chords.length];
    pad.triggerAttackRelease(chord, "1n", time, 0.13);
    chordIdx++;
  }, "1n").start(0);

  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 280 }).connect(masterReverb);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.02, decay: 0.2, sustain: 0.25, release: 0.15 },
    filterEnvelope: { attack: 0.02, decay: 0.25, sustain: 0.1, baseFrequency: 80, octaves: 1.5 }
  }).connect(bassFilter);

  const bassP = [
    ["A1", "A1", "E1", "E1"],
    ["F1", "G1", "A1", "E1"],
    ["A1", "E1", "A1", "E1"]
  ];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 2 || bar >= 13) return;
    let pattern = bar < 6 ? bassP[0] : bar < 10 ? bassP[1] : bassP[2];
    bass.triggerAttackRelease(pattern[bassIdx % pattern.length], "8n", time, 0.6);
    bassIdx++;
  }, "4n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(delay);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.008, decay: 0.12, sustain: 0, release: 0.1 }
  }).connect(arpFilter);

  const arpSets = [
    ["A3", "C4", "E4", "A4", "E4", "C4"],
    ["F3", "A3", "C4", "F4", "C4", "A3"],
    ["G3", "B3", "D4", "G4", "D4", "B3"],
    ["E3", "G#3", "B3", "E4", "B3", "G#3"]
  ];
  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 4 || bar >= 11) return;
    let filterProg = bar < 8 ? (bar - 4) / 4.0 : 1.0 - (bar - 8) / 3.0;
    arpFilter.frequency.value = 500 + filterProg * 1700;
    let notes = bar < 6 ? arpSets[0] : bar < 8 ? arpSets[1] : bar < 10 ? arpSets[2] : arpSets[3];
    arp.triggerAttackRelease(notes[arpIdx % notes.length], "16n", time, 0.25 + 0.1 * Math.sin(arpIdx * 0.4));
    arpIdx++;
  }, "16n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.008, decay: 2.0, sustain: 0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(delay);

  const bellNotes = ["E5", "A5", "C6", "B5", "G5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 11 && Math.random() > 0.55) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.12);
      bellIdx++;
    }
  }, "2n").start(0);

  window.toneJsInstruments = { pad, bass, arp, bell };
  window.toneJsParts = { padLoop, bassLoop, arpLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
