<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){
  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);
}

vec2 hash2(vec2 p){
  return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5);
}

float noise(vec2 p){
  vec2 i=floor(p);
  vec2 f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i);
  float b=hash(i+vec2(1,0));
  float c=hash(i+vec2(0,1));
  float d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}

vec2 flowField(vec2 p,float t,float coherence){
  float angle=noise(p*3.0+t*0.3)*6.28;
  angle=mix(angle,floor(angle*4.0)/4.0*6.28,coherence);
  return vec2(cos(angle),sin(angle));
}

vec2 particlePos(vec2 id,float t,float coherence){
  vec2 home=(id+0.5)/16.0-vec2(0.5);
  vec2 pos=home;
  
  for(float i=0.0;i<8.0;i++){
    vec2 field=flowField(pos*8.0,t-i*0.05,coherence);
    pos+=field*0.01*(1.0-coherence);
  }
  
  return mix(pos,home,coherence*coherence);
}

float glyph(vec2 p,float seed){
  p=abs(p);
  float type=fract(seed*7.3);
  if(type<0.33)return step(max(p.x,p.y),0.06);
  if(type<0.66)return step(length(p),0.06);
  return step(abs(p.x-p.y),0.015)*step(p.x+p.y,0.09);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime*0.12;
  
  float coherence=sin(t*0.6)*0.5+0.5;
  coherence=smoothstep(0.1,0.9,coherence);
  
  vec3 col=vec3(0.03,0.01,0.06);
  float density=0.0;
  
  vec2 gridUV=uv*16.0+8.0;
  vec2 gid=floor(gridUV);
  
  for(float y=-2.0;y<=2.0;y++){
    for(float x=-2.0;x<=2.0;x++){
      vec2 id=gid+vec2(x,y);
      vec2 pPos=particlePos(id,t,coherence);
      
      float d=length(uv-pPos);
      float p=smoothstep(0.025,0.01,d);
      
      float h=hash(id);
      vec3 c1=vec3(0.2,0.5,0.9);
      vec3 c2=vec3(0.8,0.3,0.6);
      vec3 pCol=mix(c1,c2,h);
      
      col+=p*pCol*0.5;
      density+=p*0.1;
      
      for(float trail=1.0;trail<4.0;trail++){
        vec2 tPos=particlePos(id,t-trail*0.08,coherence);
        float td=length(uv-tPos);
        float tp=smoothstep(0.015,0.005,td);
        col+=tp*pCol*0.15/(trail*trail);
      }
    }
  }
  
  vec2 ggid=floor(uv*16.0+8.0);
  vec2 ghome=(ggid+0.5)/16.0-vec2(0.5);
  float gd=length(uv-ghome);
  if(gd<0.12&&coherence>0.75){
    float g=glyph((uv-ghome)*12.0,hash(ggid));
    float fade=smoothstep(0.75,0.95,coherence);
    col+=vec3(0.4,0.6,1.0)*g*0.25*fade;
  }
  
  float shimmer=noise(uv*12.0+t*0.8);
  col+=vec3(shimmer)*density*vec3(0.3,0.5,0.7);
  
  if(coherence>0.9){
    float glitch=step(0.97,sin(uv.y*100.0+t*25.0));
    col.r+=glitch*0.2*shimmer;
  }
  
  col*=1.0+density*2.0;
  
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 88;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 1.8, wet: 0.25 }).toDestination();
  await reverb.generate();

  const compressor = new Tone.Compressor({ 
    threshold: -20, 
    ratio: 8, 
    attack: 0.003, 
    release: 0.12 
  }).toDestination();

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.02,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.14, sustain: 0, release: 0.02 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    kick.triggerAttackRelease("C1", "16n", time, 0.9);
    compressor.threshold.setValueAtTime(-30, time);
    compressor.threshold.exponentialRampToValueAtTime(-20, time + 0.1);
  }, "4n").start(0);

  const bassFilter = new Tone.Filter({ 
    type: "lowpass", 
    frequency: 120, 
    Q: 1.5 
  }).connect(compressor);

  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.08 }
  }).connect(bassFilter);

  const bassNotes = ["A1", "F1", "G1", "A1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const coherence = Math.abs(Math.sin((bar / 24) * Math.PI * 2));
    
    if (bar >= 2 && bar < 20 && coherence > 0.3) {
      bass.triggerAttackRelease(bassNotes[bassIdx % bassNotes.length], "8n", time, 0.7);
      bassIdx++;
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(800, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(120, time + 4 * (60 / bpm) * 4);
  }, "16:0:0");

  const glitchFilter = new Tone.Filter({ 
    type: "highpass", 
    frequency: 2000 
  }).connect(reverb);

  const glitch = new Tone.MetalSynth({
    frequency: 400,
    envelope: { attack: 0.001, decay: 0.08, release: 0.02 },
    harmonicity: 6.5,
    modulationIndex: 40,
    resonance: 5000
  }).connect(glitchFilter);

  let glitchCount = 0;
  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const coherence = Math.abs(Math.sin((bar / 24) * Math.PI * 2));
    
    if (bar >= 4 && Math.random() < coherence * 0.3) {
      glitch.triggerAttackRelease("32n", time, 0.4 + Math.random() * 0.3);
    }
    glitchCount++;
  }, "16n").start(0);

  const bellFilter = new Tone.Filter({ 
    type: "lowpass", 
    frequency: 1200 
  }).connect(compressor);

  const bell = new Tone.FMSynth({
    harmonicity: 4.2,
    modulationIndex: 15,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.5, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(bellFilter);

  const bellNotes = ["A4", "C5", "E5", "A5", "G5", "E5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 18 && bellIdx % 4 < 1) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "8n", time, 0.5);
    }
    bellIdx++;
  }, "8n").start(0);

  const noiseFilter = new Tone.Filter({ 
    type: "bandpass", 
    frequency: 1500, 
    Q: 2 
  }).connect(reverb);

  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.01, decay: 0.2, sustain: 0 }
  }).connect(noiseFilter);

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(0.3, time);
  }, "7:3:0");

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(0.4, time);
  }, "15:3:0");

  window.toneJsInstruments = { kick, bass, glitch, bell, noise };
  window.toneJsParts = { kickLoop, bassLoop, glitchLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
