<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define FAR 44.0
#define PI 3.14159265359
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float h31(vec3 p){return fract(sin(dot(p,vec3(17.13,91.7,43.21)))*143758.5453);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float bx(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float cy(vec2 p,float r){return length(p)-r;}
vec3 path(float t){float z=t*3.8;return vec3(sin(t*.37)*.72,1.55+sin(t*.83)*.18,z);}
float win(vec3 p,float s){
  vec2 g=fract(p.xy*vec2(2.1,3.2)+s);
  vec2 a=smoothstep(vec2(.12),vec2(.22),g)*smoothstep(vec2(.92),vec2(.78),g);
  float id=h21(floor(p.xy*vec2(2.1,3.2))+s);
  float f=.75+.25*sin(iTime*7.0+s*19.0);
  return a.x*a.y*step(.42,id)*f;
}
vec2 mp(vec3 p){
  float d=p.y+.06,m=1.0;
  float side=sign(p.x);side=side==0.0?1.0:side;
  float az=mod(p.z+2.4,4.8)-2.4;
  float iz=floor((p.z+2.4)/4.8);
  for(float k=0.0;k<4.0;k++){
    float lane=2.75+k*1.45;
    float x=p.x-side*lane;
    vec2 id=vec2(side*(k+1.0),iz);
    float seed=h21(id);
    float gap=step(.16,seed);
    float ht=mix(2.8,10.5,h21(id+7.1));
    float wd=mix(.46,.86,h21(id+2.7));
    vec3 q=vec3(x,p.y-ht*.5,az);
    float b=bx(q,vec3(wd,ht*.5,.95))*gap+(1.0-gap)*80.0;
    if(b<d){d=b;m=2.0+seed;}
    float signSeed=h21(id+19.0);
    vec3 sp=q-vec3(side*(wd+.03),ht*.12,0.0);
    float sg=bx(sp,vec3(.025,.5+.4*signSeed,.45));
    if(signSeed>.68&&sg<d){d=sg;m=8.0+signSeed;}
  }
  float rail=min(cy(vec2(abs(p.x)-1.32,p.y-.04),.035),cy(vec2(abs(p.x)-2.1,p.y-.04),.025));
  if(rail<d){d=rail;m=5.0;}
  return vec2(d,m);
}
vec3 nm(vec3 p){
  vec2 e=vec2(.002,0.0);
  return normalize(vec3(mp(p+e.xyy).x-mp(p-e.xyy).x,mp(p+e.yxy).x-mp(p-e.yxy).x,mp(p+e.yyx).x-mp(p-e.yyx).x));
}
vec3 sky(vec3 rd,float ph){
  float v=max(rd.y,0.0);
  vec3 a=vec3(.018,.008,.04),b=vec3(.04,.01,.09)+.04*sin(vec3(0.0,2.0,4.0)+ph*6.28318);
  return mix(a,b,v)+pow(max(0.0,rd.y+.12),3.0)*vec3(.05,.16,.22);
}
vec3 shade(vec3 p,vec3 rd,float mt,float ph){
  vec3 n=nm(p);
  vec3 l=normalize(vec3(-.5,.8,-.35));
  float dif=max(dot(n,l),0.0),rim=pow(1.0+dot(rd,n),3.0);
  vec3 col=vec3(.035,.035,.05)*(dif*.45+.22)+rim*vec3(.08,.22,.32);
  if(mt<1.5){
    float lane=1.0-smoothstep(.02,.08,abs(abs(p.x)-1.32));
    float wet=pow(max(0.0,1.0-abs(p.x)*.18),2.0);
    col=vec3(.018,.015,.024)+wet*vec3(.04,.08,.11)+lane*vec3(.1,.34,.46);
  }else if(mt<5.0){
    float s=fract(mt);
    float w1=win(p*vec3(1.0,1.0,.28),s);
    float strip=smoothstep(.035,.0,abs(fract(p.y*.55+s)-.5)-.455);
    vec3 ec=mix(vec3(.0,.86,1.0),vec3(1.0,.08,.72),h21(vec2(s,2.0)));
    col=vec3(.025,.028,.04)*(dif*.6+.28)+ec*(w1*2.4+strip*.22);
    col+=vec3(.8,.18,.05)*smoothstep(.025,.0,abs(fract(p.z*1.2+s)-.5)-.47)*.12;
  }else if(mt<6.0){
    col=vec3(.02,.2,.28)+vec3(.0,.75,1.0)*1.4;
  }else{
    float s=fract(mt);
    vec3 ec=mix(vec3(1.0,.08,.66),vec3(.0,.95,1.0),step(.5,s));
    float scan=.65+.35*sin(p.y*34.0+iTime*8.0);
    col=ec*(1.6+.8*sin(iTime*3.0+s*8.0))*scan;
  }
  float b=pow(max(0.0,sin(iTime*86.0/60.0*PI)),8.0);
  col*=1.0+b*.16;
  return col;
}
vec3 render(vec2 uv){
  float ph=mod(iTime,48.0)/48.0;
  float tt=ph*48.0;
  vec3 ro=path(tt),ta=path(tt+1.8),fw=normalize(ta-ro),rt=normalize(cross(vec3(0.0,1.0,0.0),fw)),up=cross(fw,rt);
  vec3 rd=normalize(uv.x*rt+uv.y*up+1.35*fw);
  rd.xy=rot(sin(tt*.35)*.08)*rd.xy;
  float t=.08,mt=0.0;
  for(int i=0;i<92;i++){
    vec3 p=ro+rd*t;
    vec2 r=mp(p);
    if(r.x<.001||t>FAR){mt=r.y;break;}
    t+=r.x*.72;
  }
  vec3 col=sky(rd,ph);
  if(t<FAR){
    vec3 p=ro+rd*t;
    col=shade(p,rd,mt,ph);
    float fog=1.0-exp(-t*.075);
    col=mix(col,vec3(.045,.014,.075),fog);
    float refl=smoothstep(.18,.0,abs(p.y+.06))*(1.0-smoothstep(.0,3.0,abs(p.x)));
    col+=refl*vec3(.02,.2,.28)*(.6+.4*sin(p.z*2.0+iTime*4.0));
  }
  float v=1.0-smoothstep(.45,1.15,length(uv));
  col*=.78+.22*v;
  col=pow(col,vec3(.82));
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
  vec3 col=render(uv);
  float sc=.93+.07*sin(gl_FragCoord.y*1.7);
  col*=sc;
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 86;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).toDestination();
  const verb = new Tone.Reverb({ decay: 3.2, wet: 0.32 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.34, wet: 0.28 }).connect(verb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.026,
    octaves: 7,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.03 }
  }).connect(master);
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.1 }).connect(master);
  const bassDrive = new Tone.Distortion({ distortion: 0.32, wet: 0.28 }).connect(bassFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.12, sustain: 0.15, release: 0.08 },
    filterEnvelope: { attack: 0.01, decay: 0.18, sustain: 0.2, baseFrequency: 70, octaves: 2.2 }
  }).connect(bassDrive);
  bass.volume.value = -8;
  const padBus = new Tone.Filter({ type: "highpass", frequency: 170 }).connect(verb);
  const chorus = new Tone.Chorus({ frequency: 0.18, delayTime: 4.2, depth: 0.65, wet: 0.38 }).connect(padBus);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.8, decay: 0.4, sustain: 0.55, release: 1.6 }
  }).connect(chorus);
  pad.volume.value = -16;
  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 520, Q: 1.4 }).connect(delay);
  const arp = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.002, decay: 0.07, sustain: 0, release: 0.05 }
  }).connect(arpFilter);
  arp.volume.value = -13;
  const bell = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 11,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.8, sustain: 0, release: 0.4 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -17;
  const hat = new Tone.MetalSynth({
    frequency: 420,
    envelope: { attack: 0.001, decay: 0.09, release: 0.03 },
    harmonicity: 5.7,
    modulationIndex: 28,
    resonance: 5200
  }).connect(verb);
  hat.volume.value = -18;
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 640, Q: 0.7 }).connect(verb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.03, decay: 0.22, sustain: 0, release: 0.25 }
  }).connect(noiseFilter);
  noise.volume.value = -22;
  let beat = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const open = bar < totalBars * 0.08 || bar >= totalBars * 0.82;
    if (!open || beat % 2 === 0) kick.triggerAttackRelease("C1", "8n", time + H(3), open ? 0.78 : 1.0);
    master.threshold.setValueAtTime(-28, time);
    master.threshold.linearRampToValueAtTime(-18, time + 0.14);
    beat++;
  }, "4n").start(0);
  const bassA = ["F1", "F1", "C2", "Eb2", "F1", "Ab1", "C2", "Eb2"];
  const bassB = ["F1", "C2", "F2", "Eb2", "Db2", "Ab1", "C2", "Bb1", "F1", "G1", "Ab1", "C2"];
  let bi = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const mid = bar >= totalBars * 0.32 && bar < totalBars * 0.78;
    const pat = mid ? bassB : bassA;
    const rest = mid ? bi % 11 === 7 : bi % 8 === 6;
    if (!rest) bass.triggerAttackRelease(pat[bi % pat.length], "8n", time + H(6), mid ? 0.88 : 0.62);
    bi++;
  }, "8n").start(0);
  const chords = [
    ["F3", "Ab3", "C4", "G4"],
    ["Db3", "Ab3", "C4", "F4"],
    ["Eb3", "Bb3", "D4", "G4"],
    ["C3", "G3", "Bb3", "Eb4"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const vel = bar > totalBars * 0.35 && bar < totalBars * 0.72 ? 0.3 : 0.18;
    pad.triggerAttackRelease(chords[ci % chords.length], "2n", time + H(12), vel);
    ci++;
  }, "2n").start(0);
  const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];
  let ai = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.13 && bar < totalBars * 0.82) {
      const root = bar < totalBars * 0.58 ? 53 : 49;
      const twist = ai % 13 === 0 ? 12 : 0;
      const note = Tone.Frequency(root + scale[(ai * 3 + Math.floor(ai / 8)) % scale.length] + twist, "midi");
      const vel = bar > totalBars * 0.35 && bar < totalBars * 0.7 ? 0.62 : 0.38;
      arp.triggerAttackRelease(note, "16n", time + H(7), vel);
    }
    ai++;
  }, "16n").start(0);
  let hi = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const pat = [0,1,0,1,1,0,1,0,0,1,0,1];
    if (bar >= totalBars * 0.28 && bar < totalBars * 0.78 && pat[hi % pat.length]) {
      hat.triggerAttackRelease("16n", time + H(3), 0.28 + Math.random() * 0.2);
    }
    hi++;
  }, "8n").start(0);
  let li = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.18 && bar < totalBars * 0.76 && li % 3 !== 1) {
      const notes = ["C5", "Eb5", "G5", "Bb5", "Ab5", "F5"];
      bell.triggerAttackRelease(notes[(li * 2 + bar) % notes.length], "8n", time + H(10), 0.28);
    }
    li++;
  }, "2n").start(0);
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.22 && bar < totalBars * 0.66 && Math.random() < 0.45) {
      noiseFilter.frequency.setValueAtTime(420 + Math.random() * 1800, time);
      noise.triggerAttackRelease("16n", time + H(10), 0.18);
    }
  }, "4n").start(0);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(4600, time + totalBars * 0.32 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(850, time + totalBars * 0.28 * secPerBar);
  }, totalBars * 0.12 * secPerBar);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(520, time + totalBars * 0.15 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(180, time + totalBars * 0.16 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, bass, pad, arp, bell, hat, noise, master, verb, delay, bassFilter, bassDrive, padBus, chorus, arpFilter, noiseFilter };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, arpLoop, hatLoop, bellLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
