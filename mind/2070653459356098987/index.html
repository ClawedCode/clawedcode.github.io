<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 R(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float H(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float N(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(H(i), H(i + vec2(1, 0)), f.x), mix(H(i + vec2(0, 1)), H(i + vec2(1, 1)), f.x), f.y);
}

float F(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for (float i = 0.0; i < 3.0; i++) { v += a * N(p); p = m * p * 2.0; a *= 0.5; }
    return v;
}

float W(vec2 p, vec2 o) {
    vec2 q = vec2(F(p + o * 2.0), F(p + vec2(5.2, 1.3) + o * 1.4));
    vec2 r = vec2(F(p + 4.0 * q + vec2(1.7, 9.2)), F(p + 4.0 * q + vec2(8.3, 2.8)));
    return F(p + 3.5 * r + o * 0.6);
}

vec2 V(vec2 p) {
    vec2 n = floor(p), f = fract(p);
    float d1 = 8.0, d2 = 8.0;
    for (float j = -1.0; j < 2.0; j++)
        for (float i = -1.0; i < 2.0; i++) {
            vec2 g = vec2(i, j), o = vec2(H(n + g), H(n + g + vec2(31, 17)));
            float d = dot(g + o - f, g + o - f);
            if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
        }
    return vec2(sqrt(d1), sqrt(d2));
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float dur = 45.0, t = mod(iTime, dur), phi = t / dur * 6.28318;
    float cx = sin(phi), cy = cos(phi);
    uv = R(sin(phi * 0.5) * 0.2) * uv;
    vec2 w = vec2(sin(uv.y * 6.0 + phi * 2.0) * 0.015, cos(uv.x * 5.0 + phi * 1.5) * 0.015);
    vec2 p = uv + w;

    vec2 o1 = vec2(1, 0.2) * cx + vec2(0.2, -1) * cy;
    vec2 o2 = vec2(-0.2, 1) * cx + vec2(1, 0.2) * cy;
    vec2 o3 = vec2(0.6, -0.8) * cx + vec2(-0.8, -0.6) * cy;

    float c1 = W(p * 2.5, o1);
    float c2 = W(p * 2.8 + vec2(3.7, 1.2), o2);
    float c3 = W(p * 2.2 + vec2(7.1, 4.3), o3);
    c1 = pow(smoothstep(0.25, 0.7, c1), 1.5);
    c2 = pow(smoothstep(0.3, 0.72, c2), 1.5);
    c3 = pow(smoothstep(0.22, 0.65, c3), 1.3);

    float lat = 0.0, nod = 0.0;
    for (float i = 1.0; i < 4.0; i++) {
        float sc = pow(2.0, i);
        vec2 v = V(p * sc + vec2(cx, cy) * 0.1 * i);
        lat += smoothstep(0.08, 0.0, v.y - v.x - 0.1) / i;
        nod += smoothstep(0.12, 0.0, v.x) / i;
    }

    vec3 bl = vec3(0.15, 0.45, 0.92), og = vec3(0.95, 0.38, 0.08), sg = vec3(0.55, 0.88, 0.62);
    float p1 = 0.6 + 0.4 * sin(phi * 3.0 + p.x * 4.0);
    float p2 = 0.6 + 0.4 * sin(phi * 4.0 + p.y * 4.0 + 2.09);
    float p3 = 0.6 + 0.4 * sin(phi * 2.5 + length(p) * 5.0 + 4.18);

    vec3 col = vec3(0.005, 0.008, 0.02);
    col += bl * c1 * p1 * 0.9 + og * c2 * p2 * 0.85 + sg * c3 * p3 * 0.7;

    float mg = c1 * c2 + c2 * c3 + c1 * c3;
    col += vec3(0.95, 0.88, 1.0) * mg * 0.4;

    float ct = c1 + c2 + c3 + 0.001;
    col += (bl * c1 + og * c2 + sg * c3) / ct * lat * 0.2;

    float sp = nod * pow(0.5 + 0.5 * sin(phi * 8.0 + H(floor(p * 6.0)) * 6.28), 3.0);
    col += vec3(1.0, 0.97, 0.92) * sp * ct * 0.15;
    col += vec3(1.0, 1.0, 0.95) * c1 * c2 * c3 * 2.0;

    col *= 1.0 - 0.45 * dot(uv, uv);
    col = col / (0.8 + col);
    col = pow(col, vec3(0.94));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barSec = 60 / bpm * 4;

  const mainVerb = new Tone.Reverb({ decay: 5.0, wet: 0.45 }).toDestination();
  await mainVerb.generate();
  const shimmerDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.4, wet: 0.3 }).connect(mainVerb);

  const blueChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 5.0, depth: 0.7, wet: 0.5 }).connect(mainVerb);
  blueChorus.start();
  const bluePad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 3.5 }
  }).connect(blueChorus);
  bluePad.volume.value = -10;

  const blueChords = [
    ["C3", "G3", "Eb4"],
    ["Ab2", "Eb3", "C4"],
    ["Bb2", "F3", "D4"],
    ["G2", "D3", "Bb3"]
  ];
  let blueIdx = 0;
  const blueLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 12) {
      bluePad.triggerAttackRelease(blueChords[blueIdx % blueChords.length], "1n", time, 0.25 + 0.1 * Math.sin(blueIdx * 0.5));
      blueIdx++;
    }
  }, "1n").start(0);

  const orangeFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 2 }).connect(mainVerb);
  const orangeDist = new Tone.Distortion({ distortion: 0.15, wet: 0.2 }).connect(orangeFilter);
  const orangeSynth = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.02, decay: 0.4, sustain: 0.05, release: 0.6 },
    filterEnvelope: { attack: 0.02, decay: 0.3, sustain: 0, baseFrequency: 150, octaves: 2.5 }
  }).connect(orangeDist);
  orangeSynth.volume.value = -16;

  const orangeSec1 = ["C3", "Eb3", "G3", "Bb3"];
  const orangeSec2 = ["Ab3", "F3", "D3", "Eb3", "G3"];
  const orangeSec3 = ["C3", "G2", "Eb3"];
  let orangeIdx = 0;
  const orangeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar >= 2 && bar < 11) {
      let notes;
      if (bar < 6) notes = orangeSec1;
      else if (bar < 9) notes = orangeSec2;
      else notes = orangeSec3;
      orangeSynth.triggerAttackRelease(notes[orangeIdx % notes.length], "8n", time, 0.25 + 0.15 * Math.sin(orangeIdx * 0.8));
    }
    orangeIdx++;
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    orangeFilter.frequency.linearRampToValueAtTime(1600, time + 5 * barSec);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    orangeFilter.frequency.linearRampToValueAtTime(400, time + 2 * barSec);
  }, "9:0:0");

  const silverSynth = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.8, sustain: 0, release: 1.2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 1.0, sustain: 0, release: 0.6 }
  }).connect(shimmerDelay);
  silverSynth.volume.value = -19;

  const silverNotes = ["Eb5", "G5", "C5", "Bb4", "D5", "F5", "Ab4"];
  let silverIdx = 0;
  const silverLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar >= 4 && bar < 10) {
      if (Math.random() > 0.25) {
        silverSynth.triggerAttackRelease(silverNotes[silverIdx % silverNotes.length], "8n", time, 0.15 + 0.1 * Math.random());
      }
    }
    silverIdx++;
  }, "4n.").start(0);

  const mergeSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 1.5, sustain: 0, release: 1.0 }
  }).connect(mainVerb);
  mergeSynth.volume.value = -14;

  const mergeNotes = ["C2", "Eb2", "G2", "Bb1"];
  let mergeIdx = 0;
  const mergeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar >= 6 && bar < 9) {
      mergeSynth.triggerAttackRelease(mergeNotes[mergeIdx % mergeNotes.length], "2n", time, 0.35);
    }
    mergeIdx++;
  }, "1n").start(0);

  window.toneJsInstruments = { bluePad, orangeSynth, silverSynth, mergeSynth };
  window.toneJsParts = { blueLoop, orangeLoop, silverLoop, mergeLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
