<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define PI 3.14159265359
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
vec3 pal(float x){
  vec3 a=vec3(0.44,0.34,0.48),b=vec3(0.30,0.22,0.25),c=vec3(0.75,0.92,1.10),d=vec3(0.08,0.18,0.35);
  return a+b*cos(6.28318*(c*x+d));
}
float fold(vec3 p,float ph){
  float r=length(p.xz),a=atan(p.z,p.x);
  float b=0.50+0.50*cos(ph*6.28318);
  float h=0.0;
  h+=0.34*sin(5.0*r-2.0*ph*6.28318+sin(a*3.0+ph*6.28318))*exp(-r*0.62);
  h+=0.18*sin(8.0*p.x+3.0*p.z+ph*6.28318)*exp(-r*0.36);
  h+=0.13*cos(11.0*r-a*4.0-ph*6.28318)*exp(-r*0.72);
  h*=0.70+0.34*b;
  return h;
}
float map(vec3 p){
  float ph=mod(iTime,48.0)/48.0;
  p.xz=rot(0.24*sin(ph*6.28318))*p.xz;
  float br=0.18*sin(ph*6.28318);
  p.xz*=1.0+br;
  float h=fold(p,ph);
  float d=abs(p.y-h)-0.030;
  float shell=length(vec2(length(p.xz)*0.58,p.y*0.90))-1.45;
  float cut=abs(p.y+0.10)-0.82;
  return smax(smax(d,shell,0.18),cut,0.12);
}
vec3 norm(vec3 p){
  vec2 e=vec2(0.002,0.0);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
}
float bayer4(vec2 p){
  vec2 c=floor(mod(p,4.0));int x=int(c.x);int y=int(c.y);
  if(y==0){if(x==0)return 0.0/16.0;if(x==1)return 8.0/16.0;if(x==2)return 2.0/16.0;return 10.0/16.0;}
  if(y==1){if(x==0)return 12.0/16.0;if(x==1)return 4.0/16.0;if(x==2)return 14.0/16.0;return 6.0/16.0;}
  if(y==2){if(x==0)return 3.0/16.0;if(x==1)return 11.0/16.0;if(x==2)return 1.0/16.0;return 9.0/16.0;}
  if(x==0)return 15.0/16.0;if(x==1)return 7.0/16.0;if(x==2)return 13.0/16.0;return 5.0/16.0;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0;
  float breath=0.5+0.5*cos(ph*6.28318);
  vec3 ro=vec3(0.0,0.20,4.20-0.35*breath);
  vec3 rd=normalize(vec3(uv,-1.42));
  rd.yz=rot(-0.08+0.06*sin(ph*6.28318))*rd.yz;
  float t=0.15,glow=0.0,hit=0.0;
  for(int i=0;i<72;i++){
    vec3 p=ro+rd*t;
    float d=map(p);
    glow+=0.010/(0.045+d*d*18.0)*exp(-t*0.18);
    if(abs(d)<0.0018){hit=1.0;break;}
    t+=max(d*0.68,0.012);
    if(t>8.0)break;
  }
  vec3 col=vec3(0.002,0.002,0.003);
  float vign=smoothstep(1.35,0.15,length(uv));
  col+=vec3(0.008,0.006,0.012)*vign;
  if(hit>0.5){
    vec3 p=ro+rd*t,n=norm(p);
    vec3 l=normalize(vec3(-0.35,0.55,0.70));
    float dif=max(dot(n,l),0.0);
    float rim=pow(1.0-max(dot(n,-rd),0.0),3.0);
    float bands=0.5+0.5*sin(16.0*length(p.xz)+atan(p.z,p.x)*5.0-ph*6.28318*2.0);
    vec3 base=pal(bands*0.35+ph*0.18);
    vec3 mem=mix(vec3(0.86,0.46,0.28),vec3(0.20,0.78,0.92),smoothstep(0.15,0.85,ph));
    col=mix(base,mem,0.40+0.25*breath)*(0.14+1.15*dif);
    col+=rim*vec3(0.58,0.76,0.95)*(0.72+0.35*breath);
    col+=glow*vec3(0.17,0.28,0.42);
    col*=exp(-0.035*t*t);
  }else{
    col+=glow*vec3(0.05,0.10,0.16);
  }
  for(int i=0;i<22;i++){
    float fi=float(i);
    vec2 sp=vec2(sin(fi*19.17),cos(fi*27.31))*vec2(0.92,0.78);
    float tw=hash(vec2(fi,floor(ph*96.0)))*0.7+0.3;
    float g=smoothstep(0.020,0.0,length(uv-sp));
    col+=g*vec3(0.34,0.45,0.58)*tw*(0.38*breath);
  }
  col=mix(col,floor(col*7.0+bayer4(gl_FragCoord.xy))/7.0,0.18);
  col*=0.82+0.18*sin(gl_FragCoord.y*1.7);
  col=pow(max(col,0.0),vec3(0.86));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 64;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.02, release: 0.25 }).toDestination();
  const verb = new Tone.Reverb({ decay: 7.5, wet: 0.42 }).connect(master);
  await verb.generate();
  const echo = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.38, wet: 0.28 }).connect(verb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 520, Q: 0.6 }).connect(verb);
  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 0.8 }).connect(master);
  const bellFilter = new Tone.Filter({ type: "highpass", frequency: 1200, Q: 0.4 }).connect(echo);
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 360, Q: 0.7 }).connect(verb);
  const chorus = new Tone.Chorus({ frequency: 0.07, delayTime: 4.2, depth: 0.55, wet: 0.38 }).connect(padFilter).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.2, decay: 0.5, sustain: 0.72, release: 3.8 }
  }).connect(chorus);
  pad.volume.value = -13;
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.04, decay: 0.8, sustain: 0.15, release: 1.1 },
    filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0, baseFrequency: 45, octaves: 1.2 }
  }).connect(subFilter);
  sub.volume.value = -10;
  const bell = new Tone.FMSynth({
    harmonicity: 1.618,
    modulationIndex: 6.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.4, sustain: 0, release: 2.2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.02, decay: 1.8, sustain: 0, release: 1.4 }
  }).connect(bellFilter);
  bell.volume.value = -14;
  const breath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.5, decay: 2.5, sustain: 0.1, release: 2.0 }
  }).connect(noiseFilter);
  breath.volume.value = -22;
  const tap = new Tone.MembraneSynth({
    pitchDecay: 0.08,
    octaves: 2,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.24, sustain: 0, release: 0.08 }
  }).connect(verb);
  tap.volume.value = -18;
  const chords = [
    ["D3", "A3", "E4", "F4"],
    ["Bb2", "F3", "C4", "E4"],
    ["C3", "G3", "D4", "E4"],
    ["A2", "E3", "B3", "D4"]
  ];
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const body = bar >= totalBars * 0.10 && bar < totalBars * 0.82;
    pad.triggerAttackRelease(chords[chordIndex % chords.length], body ? "1m" : "2n", time + H(14), body ? 0.42 : 0.26);
    chordIndex++;
  }, "1m").start(0);
  const roots = ["D1", "D1", "Bb0", "C1", "A0", "C1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const wind = bar >= totalBars * 0.82;
    const sparse = bar < totalBars * 0.16 || wind;
    if (!sparse || subIndex % 2 === 0) sub.triggerAttackRelease(roots[subIndex % roots.length], sparse ? "2n" : "4n", time + H(8), sparse ? 0.42 : 0.66);
    subIndex++;
  }, "2n").start(0);
  const bellNotes = ["A4", "D5", "E5", "F5", "C5", "B4", "G4", "E5", "A5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.18 && bar < totalBars * 0.78) {
      const dense = bar >= totalBars * 0.38 && bar < totalBars * 0.66;
      if (dense || bellIndex % 3 === 0) bell.triggerAttackRelease(bellNotes[(bellIndex * 5 + Math.floor(bar)) % bellNotes.length], "8n", time + H(12), dense ? 0.34 : 0.22);
    }
    bellIndex++;
  }, "4n").start(0);
  let breathIndex = 0;
  const breathLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.88 && breathIndex % 2 === 0) {
      noiseFilter.frequency.setValueAtTime(bar < totalBars * 0.5 ? 340 : 520, time);
      breath.triggerAttackRelease("2n", time + H(15), bar > totalBars * 0.30 && bar < totalBars * 0.72 ? 0.28 : 0.18);
    }
    breathIndex++;
  }, "1n").start(0);
  let tapIndex = 0;
  const tapLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.35 && bar < totalBars * 0.74 && tapIndex % 4 !== 2) {
      tap.triggerAttackRelease("D2", "16n", time + H(4), tapIndex % 5 === 0 ? 0.30 : 0.16);
      master.threshold.setValueAtTime(-25, time);
      master.threshold.exponentialRampToValueAtTime(-18, time + 0.22);
    }
    tapIndex++;
  }, "8n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1900, time + totalBars * 0.30 * secPerBar);
    noiseFilter.frequency.linearRampToValueAtTime(760, time + totalBars * 0.28 * secPerBar);
  }, totalBars * 0.12 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(520, time + totalBars * 0.16 * secPerBar);
    noiseFilter.frequency.linearRampToValueAtTime(360, time + totalBars * 0.13 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { pad, sub, bell, breath, tap, verb, echo, padFilter, subFilter, bellFilter, noiseFilter, chorus, master };
  window.toneJsParts = { padLoop, subLoop, bellLoop, breathLoop, tapLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
