<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

float noise(vec3 p){
    vec3 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                   mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                   mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}

float fbm(vec3 p){
    float v=0.0,a=0.5;
    for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
    return v;
}

float sdOctahedron(vec3 p,float s){
    p=abs(p);
    return(p.x+p.y+p.z-s)*0.57735027;
}

float sdBox(vec3 p,vec3 b){
    vec3 q=abs(p)-b;
    return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);
}

float smin(float a,float b,float k){
    float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);
    return mix(b,a,h)-k*h*(1.0-h);
}

float crystalCore(vec3 p,float t){
    float pulse=1.0+0.08*sin(t*0.7);
    p.xz=rot(t*0.15)*p.xz;
    p.xy=rot(t*0.11)*p.xy;
    float oct=sdOctahedron(p,0.6*pulse);
    float box1=sdBox(p-vec3(0.0,0.0,0.0),vec3(0.35)*pulse);
    box1=max(box1,-sdOctahedron(p,0.45*pulse));
    float core=smin(oct,box1,0.15);
    for(int i=0;i<6;i++){
        float fi=float(i);
        float angle=fi*1.047197+t*0.2;
        vec3 offset=vec3(cos(angle),sin(fi*0.7+t*0.3)*0.3,sin(angle))*0.5;
        float spike=sdOctahedron(p-offset*pulse,0.12+0.03*sin(t+fi));
        core=smin(core,spike,0.08);
    }
    return core;
}

float metatron(vec3 p,float t){
    p.xz=rot(-t*0.08)*p.xz;
    p.yz=rot(t*0.06)*p.yz;
    float d=1e10;
    for(int i=0;i<6;i++){
        float fi=float(i);
        float a=fi*1.047197;
        vec3 c=vec3(cos(a),0.0,sin(a))*1.2;
        float sphere=length(p-c)-0.15;
        d=min(d,sphere);
        float next=mod(fi+1.0,6.0);
        vec3 c2=vec3(cos(next*1.047197),0.0,sin(next*1.047197))*1.2;
        vec3 ab=c2-c,ap=p-c;
        float h=clamp(dot(ap,ab)/dot(ab,ab),0.0,1.0);
        float line=length(ap-ab*h)-0.02;
        d=min(d,line);
    }
    float centerSphere=length(p)-0.2;
    d=min(d,centerSphere);
    for(int i=0;i<6;i++){
        float fi=float(i);
        vec3 c=vec3(cos(fi*1.047197),0.0,sin(fi*1.047197))*1.2;
        vec3 ab=-c,ap=p-c;
        float h=clamp(dot(ap,ab)/dot(ab,ab),0.0,1.0);
        float line=length(ap-ab*h)-0.015;
        d=min(d,line);
    }
    return d;
}

float scene(vec3 p,float t){
    float phase=mod(t/75.0,1.0);
    float breathe=1.0+0.05*sin(t*0.4);
    vec3 crystalP=p*breathe;
    float crystal=crystalCore(crystalP,t);
    float sacred=metatron(p*0.8,t)*1.25;
    float blend=smoothstep(0.3,0.7,sin(t*0.15)*0.5+0.5);
    float structure=mix(crystal,smin(crystal,sacred,0.3),blend*0.6);
    float fracture=fbm(p*3.0+t*0.1)*0.15;
    float fracturePhase=smoothstep(0.4,0.6,sin(t*0.2)*0.5+0.5);
    structure+=fracture*fracturePhase*0.3;
    return structure;
}

vec3 calcNormal(vec3 p,float t){
    vec2 e=vec2(0.001,0.0);
    return normalize(vec3(
        scene(p+e.xyy,t)-scene(p-e.xyy,t),
        scene(p+e.yxy,t)-scene(p-e.yxy,t),
        scene(p+e.yyx,t)-scene(p-e.yyx,t)
    ));
}

float particles(vec3 ro,vec3 rd,float t){
    float glow=0.0;
    for(int i=0;i<40;i++){
        float fi=float(i);
        float seed=hash(vec3(fi,fi*1.3,fi*0.7));
        float angle=seed*6.28318+t*0.3*(0.5+seed);
        float radius=0.8+seed*1.5;
        float height=sin(seed*6.28+t*0.5)*0.8;
        float inward=sin(t*0.4+seed*3.0)*0.5+0.5;
        radius*=mix(1.0,0.2,inward);
        vec3 particlePos=vec3(cos(angle)*radius,height,sin(angle)*radius);
        vec3 toParticle=particlePos-ro;
        float proj=dot(toParticle,rd);
        if(proj>0.0){
            vec3 closest=ro+rd*proj;
            float dist=length(closest-particlePos);
            float brightness=exp(-dist*15.0)*(0.5+0.5*inward);
            glow+=brightness*0.08;
        }
    }
    return glow;
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime;
    float camDist=4.5+0.5*sin(t*0.1);
    float camAngle=t*0.08;
    float camHeight=sin(t*0.07)*0.8;
    vec3 ro=vec3(cos(camAngle)*camDist,camHeight,sin(camAngle)*camDist);
    vec3 ta=vec3(0.0,0.0,0.0);
    vec3 ww=normalize(ta-ro);
    vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
    vec3 vv=cross(uu,ww);
    vec3 rd=normalize(uv.x*uu+uv.y*vv+1.5*ww);
    vec3 col=vec3(0.02,0.01,0.04);
    float depth=length(uv)*0.3;
    col+=vec3(0.08,0.03,0.12)*exp(-depth*2.0);
    float dist=0.0;
    float totalDist=0.0;
    bool hit=false;
    for(int i=0;i<80;i++){
        vec3 p=ro+rd*totalDist;
        dist=scene(p,t);
        if(dist<0.001){hit=true;break;}
        if(totalDist>20.0)break;
        totalDist+=dist*0.8;
    }
    if(hit){
        vec3 p=ro+rd*totalDist;
        vec3 n=calcNormal(p,t);
        vec3 lightDir=normalize(vec3(1.0,1.0,0.5));
        float diff=max(dot(n,lightDir),0.0);
        float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),32.0);
        float fresnel=pow(1.0-max(dot(n,-rd),0.0),3.0);
        float crystalDepth=fbm(p*2.0+t*0.05);
        vec3 deepPurple=vec3(0.15,0.05,0.25);
        vec3 electricBlue=vec3(0.2,0.5,0.9);
        vec3 crystalWhite=vec3(0.85,0.9,1.0);
        float colorPhase=sin(t*0.2+length(p)*2.0)*0.5+0.5;
        vec3 baseColor=mix(deepPurple,electricBlue,colorPhase);
        baseColor=mix(baseColor,crystalWhite,crystalDepth*0.4);
        col=baseColor*(0.3+diff*0.5);
        col+=spec*crystalWhite*0.6;
        col+=fresnel*electricBlue*0.4;
        float ao=1.0-smoothstep(0.0,0.5,scene(p+n*0.1,t));
        col*=0.7+0.3*ao;
        float fog=exp(-totalDist*0.15);
        col=mix(vec3(0.05,0.02,0.1),col,fog);
    }
    float particleGlow=particles(ro,rd,t);
    vec3 particleColor=mix(vec3(0.4,0.2,0.8),vec3(0.3,0.7,1.0),sin(t*0.3)*0.5+0.5);
    col+=particleGlow*particleColor;
    col=pow(col,vec3(0.9));
    col*=1.0-0.3*length(uv);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
    await masterReverb.generate();

    const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

    const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 2 }).toDestination();
    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.4, decay: 0.8, sustain: 0.6, release: 2.0 }
    }).connect(subFilter);

    const subNotes = ["C1", "G1", "A#1", "F1"];
    let subIndex = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 16) {
            const noteIdx = Math.floor(bar / 4) % subNotes.length;
            sub.triggerAttackRelease(subNotes[noteIdx], "1n", time, 0.7);
        }
        subIndex++;
    }, "2n").start(0);

    const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(masterReverb);
    padChorus.start();
    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600 }).connect(padChorus);
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        envelope: { attack: 1.5, decay: 1.0, sustain: 0.5, release: 3.0 }
    }).connect(padFilter);

    const chordProgressions = [
        [["C3", "G3", "C4"], ["G3", "D4", "G4"]],
        [["A#2", "F3", "A#3"], ["F3", "C4", "F4"]],
        [["G#2", "D#3", "G#3"], ["D#3", "A#3", "D#4"]]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 1 && bar < 17) {
            const progIdx = Math.floor(bar / 4) % chordProgressions.length;
            const chordInProg = chordIdx % 2;
            pad.triggerAttackRelease(chordProgressions[progIdx][chordInProg], "1n", time, 0.25);
        }
        chordIdx++;
    }, "2n").start(0);

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(1800, time + 8 * (60 / bpm) * 4);
    }, "4:0:0");

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
    }, "14:0:0");

    const bellFilter = new Tone.Filter({ type: "highpass", frequency: 400 }).connect(masterDelay);
    const bell = new Tone.FMSynth({
        harmonicity: 4.5,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 1.0 },
        modulation: { type: "sine" }
    }).connect(bellFilter);

    const crystalNotes = ["C5", "G5", "C6", "D#5", "G4", "A#5", "F5", "D5"];
    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 3 && bar < 15) {
            if (Math.random() > 0.4) {
                const noteIdx = Math.floor(Math.random() * crystalNotes.length);
                const velocity = 0.15 + Math.random() * 0.2;
                bell.triggerAttackRelease(crystalNotes[noteIdx], "4n", time, velocity);
            }
        }
        bellIndex++;
    }, "4n").start("0:1:0");

    const glassFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 2 }).connect(masterReverb);
    const glass = new Tone.MetalSynth({
        frequency: 800,
        envelope: { attack: 0.001, decay: 0.8, release: 0.5 },
        harmonicity: 8,
        modulationIndex: 16,
        resonance: 3000
    }).connect(glassFilter);

    const glassLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 6 && bar < 14) {
            if (Math.random() > 0.7) {
                glass.triggerAttackRelease("16n", time, 0.08 + Math.random() * 0.06);
            }
        }
    }, "8n").start("0:2:0");

    const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 300 }).connect(masterDelay);
    const arp = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
    }).connect(arpFilter);

    const arpScale = [60, 63, 67, 70, 72, 75, 79, 72, 70, 67, 63, 60];
    let arpIdx = 0;
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 8 && bar < 14) {
            const note = Tone.Frequency(arpScale[arpIdx % arpScale.length], "midi");
            arp.triggerAttackRelease(note, "16n", time, 0.25);
            arpIdx++;
        }
    }, "16n").start(0);

    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(1600, time + 4 * (60 / bpm) * 4);
    }, "8:0:0");

    Tone.Transport.schedule((time) => {
        arpFilter.frequency.linearRampToValueAtTime(300, time + 2 * (60 / bpm) * 4);
    }, "12:0:0");

    const noiseFilter = new Tone.Filter({ type: "highpass", frequency: 1000 }).connect(masterReverb);
    const noise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 2.0 }
    }).connect(noiseFilter);

    Tone.Transport.schedule((time) => {
        noiseFilter.frequency.linearRampToValueAtTime(4000, time + 2.0);
        noise.triggerAttackRelease(3.0, time, 0.06);
    }, "7:0:0");

    window.toneJsInstruments = { sub, pad, bell, glass, arp, noise };
    window.toneJsParts = { subLoop, padLoop, bellLoop, glassLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
