<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

// Constants
#define PI 3.14159265359
#define TAU 6.28318530718

// 2D Rotation
mat2 rot(float a) {
    float c = cos(a), s = sin(a);
    return mat2(c, -s, s, c);
}

// 3D Rotation
void pR(inout vec2 p, float a) {
    p = cos(a)*p + sin(a)*vec2(p.y, -p.x);
}

// Color Palette - Cyber/Synthwave
vec3 getCyberColor(float t) {
    // Cyan to Magenta gradient
    vec3 colA = vec3(0.0, 0.9, 1.0); // Cyan
    vec3 colB = vec3(1.0, 0.0, 0.9); // Magenta
    return mix(colA, colB, 0.5 + 0.5 * sin(t));
}

// Grid Distance Function
float grid3D(vec3 p, float spacing) {
    vec3 grid = abs(fract(p / spacing - 0.5) - 0.5) * spacing;
    float dx = min(grid.y, grid.z);
    float dy = min(grid.x, grid.z);
    float dz = min(grid.x, grid.y);
    return min(dx, min(dy, dz));
}

// Animated Wireframe Tunnel
float wireTunnel(vec3 p, float radius, float time) {
    // Pulse radius
    float r = radius + 0.2 * sin(p.z * 0.5 + time * 2.0);
    
    // Twist
    vec3 q = p;
    pR(q.xy, p.z * 0.1 + time * 0.2);
    
    // Cylinder SDF
    float d = length(q.xy) - r;
    
    // Grid pattern on surface
    // Only render grid near the surface
    if (abs(d) < 0.5) {
        float g = grid3D(q, 1.0);
        return g;
    }
    
    return 10.0;
}

// Floating Data Cubes
float wireCubes(vec3 p, float spacing, float time) {
    vec3 id = floor(p / spacing);
    vec3 q = mod(p, spacing) - spacing * 0.5;
    
    // Random offset per cube
    float hash = fract(sin(dot(id, vec3(12.989, 78.233, 45.164))) * 43758.5453);
    
    // Animate cubes
    float anim = sin(time * 1.5 + hash * TAU) * 0.3;
    q.y += anim;
    
    // Rotate cubes
    pR(q.xz, time + hash * TAU);
    pR(q.xy, time * 0.5);
    
    // Box SDF
    vec3 d = abs(q) - vec3(spacing * 0.2);
    float box = length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);
    
    // Only show edges
    float gridDist = grid3D(q, spacing * 0.4); // Local grid on cube
    
    if (box < 0.1) return gridDist;
    return 10.0;
}

// Main Scene Render
vec3 render(vec3 ro, vec3 rd, float time) {
    vec3 col = vec3(0.0);
    float t = 0.5; // Start slightly offset to avoid camera clip
    float lineThickness = 0.02;
    
    // Raymarch loop
    for(int i = 0; i < 90; i++) {
        vec3 p = ro + rd * t;
        
        // 1. Tunnel Walls
        float dTunnel = wireTunnel(p, 4.0, time);
        
        // 2. Floating Cubes inside
        float dCubes = wireCubes(p + vec3(0.0, 0.0, time), 3.0, time);
        
        // Combine (min distance)
        float d = min(dTunnel, dCubes);
        
        // Check for "hit" (close to a grid line)
        if (d < lineThickness) {
            float intensity = 1.0 - smoothstep(0.0, lineThickness, d);
            float fade = 1.0 - smoothstep(5.0, 40.0, t); // Fog
            
            // Color based on Z depth and type
            float colorT = p.z * 0.05 + time * 0.2;
            vec3 lineColor = getCyberColor(colorT);
            
            // Cubes get a slightly different hue
            if (dCubes < dTunnel) {
                lineColor = vec3(1.0, 0.8, 0.2); // Gold accents
                intensity *= 1.5;
            }
            
            // Accumulate color (additive blending for glow)
            col += lineColor * intensity * fade * 0.8;
            
            // Add extra glow for very close hits
            col += lineColor * (0.02 / (d + 0.001)) * fade * 0.1;
            
            // Don't break immediately, allow some transparency/accumulation
            if (intensity > 0.8) break; 
        }
        
        // Step forward - fixed step for grid rendering technique
        t += 0.1; // Larger steps since we check grid proximity, not SDF surface
        if (t > 40.0) break;
    }
    
    // Background / Fog
    col += vec3(0.05, 0.0, 0.1) * (rd.y * 0.5 + 0.5);
    
    return col;
}

// Scanline Effect
float scanlines(vec2 uv, float time) {
    float val = sin(uv.y * 300.0 + time * 10.0);
    return 0.9 + 0.1 * val;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float time = iTime;
    
    // Camera Setup - Flying through tunnel
    vec3 ro = vec3(0.0, 0.0, time * 6.0); // Move forward fast
    
    // Camera Sway
    ro.x += sin(time * 0.5) * 1.5;
    ro.y += cos(time * 0.3) * 1.0;
    
    // Look ahead
    vec3 target = ro + vec3(sin(time * 0.2) * 2.0, 0.0, 10.0);
    vec3 fwd = normalize(target - ro);
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
    vec3 up = cross(fwd, right);
    
    // Ray direction
    vec3 rd = normalize(fwd + uv.x * right + uv.y * up);
    
    // Fish-eye distortion for retro feel
    rd.xy *= 1.0 + dot(uv, uv) * 0.1;
    rd = normalize(rd);
    
    // Render
    vec3 col = render(ro, rd, time);
    
    // Post-Processing
    // 1. Vignette
    col *= 1.2 - length(uv) * 0.8;
    
    // 2. Scanlines
    col *= scanlines(uv, time);
    
    // 3. Color Grading (push towards synthwave palette)
    col = pow(col, vec3(0.9, 0.8, 1.1)); // Cool tint
    
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 110;
  Tone.Transport.bpm.value = bpm;

  // === INSTRUMENTS ===

  // 1. Kick - Punchy & Deep
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 1 }
  }).toDestination();

  // 2. Snare - Gated Reverb Style
  const snareReverb = new Tone.Reverb({ decay: 1.5, wet: 0.4 }).toDestination();
  await snareReverb.generate();
  const snare = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
  }).connect(snareReverb);

  // 3. Bass - Rolling Sawtooth
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 2 }).toDestination();
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 }
  }).connect(bassFilter);

  // 4. Pad - Lush Chorus
  const chorus = new Tone.Chorus({ frequency: 2, delayTime: 3.5, depth: 0.7, wet: 0.5 }).toDestination();
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.8, release: 2.0 }
  }).connect(chorus);
  pad.volume.value = -6;

  // 5. Arp - Plucky Square
  const arpDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).toDestination();
  const arp = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 }
  }).connect(arpDelay);
  arp.volume.value = -8;

  // === PATTERNS ===

  // Drum Loop (Basic Rock Beat)
  let beatStep = 0;
  const drumLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    // Kick on 1 and 3 (and syncopations)
    if (beatStep % 4 === 0) kick.triggerAttackRelease("C1", "8n", time);
    if (beatStep % 16 === 7) kick.triggerAttackRelease("C1", "16n", time); // Ghost kick
    
    // Snare on 2 and 4
    if (beatStep % 8 === 4) snare.triggerAttackRelease("8n", time);
    
    beatStep++;
  }, "8n").start("4:0:0"); // Drums start at bar 4

  // Bass Loop (Rolling Eighths - D Minor)
  const bassNotes = ["D2", "D2", "D2", "D2", "F2", "F2", "C2", "C2"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    // Simple bass in intro/outro, moving bass in middle
    let note = "D2";
    if (bar >= 4 && bar < 16) {
       note = bassNotes[bassIdx % bassNotes.length];
    }
    
    bass.triggerAttackRelease(note, "16n", time);
    bassIdx++;
  }, "8n").start(0);

  // Pad Loop (Chords)
  const padChords = [
    ["D3", "F3", "A3"], // Dm
    ["A#2", "D3", "F3"], // Bb
    ["C3", "E3", "G3"], // C
    ["F3", "A3", "C4"]  // F
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    // Don't play in last 2 bars for fade out
    if (bar < 18) {
      pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time);
    }
    chordIdx++;
  }, "1n").start(0);

  // Arp Loop (16th notes)
  const arpScale = ["D4", "F4", "G4", "A4", "C5", "A4", "G4", "F4"];
  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    // Arp plays from bar 8 to 16 (Peak section)
    if (bar >= 8 && bar < 16) {
        let note = arpScale[arpIdx % arpScale.length];
        // Variation every 4th note
        if (arpIdx % 4 === 3) note = "D5";
        arp.triggerAttackRelease(note, "16n", time);
    }
    arpIdx++;
  }, "16n").start(0);

  // Filter Automation
  Tone.Transport.schedule((time) => {
    // Open bass filter for drop
    bassFilter.frequency.linearRampToValueAtTime(2000, time + 4 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    // Close bass filter for outro
    bassFilter.frequency.linearRampToValueAtTime(400, time + 4 * (60 / bpm) * 4);
  }, "16:0:0");

  // Cleanup storage
  window.toneJsInstruments = { kick, snare, bass, pad, arp };
  window.toneJsParts = { drumLoop, bassLoop, padLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
