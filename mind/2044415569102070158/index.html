<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) {
  return fract(sin(n) * 43758.5453123);
}

vec3 hash3(float n) {
  return vec3(hash(n), hash(n + 1.0), hash(n + 2.0));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  
  float t = iTime * 0.5;
  float cycle = mod(t, 30.0) / 30.0;
  
  float coherence = sin(cycle * 3.14159 * 2.0) * 0.5 + 0.5;
  coherence = pow(coherence, 1.5);
  
  vec3 col = vec3(0.01, 0.01, 0.02);
  
  for(int layer = 0; layer < 3; layer++) {
    float layerOffset = float(layer) * 100.0;
    float layerCoherence = coherence * (0.7 + float(layer) * 0.15);
    
    for(float i = 0.0; i < 400.0; i++) {
      float seed = i + layerOffset;
      vec3 rnd = hash3(seed);
      
      float chaoticT = t + seed * 0.1;
      vec2 pChaos = vec2(
        sin(chaoticT * rnd.x * 2.0) * 0.6,
        cos(chaoticT * rnd.y * 1.8) * 0.6
      );
      
      float syncPhase = cycle * 3.14159 * 2.0 * 3.0 + seed * 0.1;
      float radius = 0.3 + rnd.z * 0.2;
      vec2 pSync = vec2(cos(syncPhase), sin(syncPhase)) * radius;
      
      vec2 p = mix(pChaos, pSync, layerCoherence);
      
      float d = length(uv - p);
      float size = mix(0.008, 0.004, layerCoherence);
      float glow = 0.02 / (d + 0.01);
      float core = smoothstep(size, 0.0, d);
      
      vec3 chaosCol = vec3(0.2, 0.5, 1.0);
      vec3 orderCol = vec3(1.0, 0.6, 0.2);
      vec3 particleCol = mix(chaosCol, orderCol, layerCoherence);
      
      col += particleCol * (core * 0.6 + glow * 0.15);
    }
  }
  
  float centerGlow = 0.08 / (length(uv) + 0.1);
  col += vec3(0.3, 0.2, 0.5) * centerGlow * coherence * 0.3;
  
  col *= 1.0 - length(uv) * 0.3;
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 2.8, wet: 0.35 }).toDestination();
  await reverb.generate();

  const filter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 1.0 }).connect(reverb);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).connect(filter);

  const bell = new Tone.FMSynth({
    harmonicity: 3.8,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.8, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(reverb);

  const pulse = new Tone.MonoSynth({
    oscillator: { type: "square" },
    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.08 }
  }).connect(filter);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.03,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.03 }
  }).toDestination();

  const section1Chords = [["A3", "C4", "E4"], ["F3", "A3", "C4"]];
  const section2Chords = [["G3", "B3", "D4"], ["E3", "G3", "B3"]];
  const section3Chords = [["A3", "C4", "E4"], ["D3", "F3", "A3"]];
  
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    let chords;
    if (bar < 6) chords = section1Chords;
    else if (bar < 12) chords = section2Chords;
    else chords = section3Chords;
    
    pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.15);
    chordIdx++;
  }, "1n").start(0);

  let bellCount = 0;
  const bellNotes = ["A4", "C5", "E5", "G5", "B4", "D5"];
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar < 4) {
      if (Math.random() > 0.75) {
        const note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
        const vel = 0.2 + Math.random() * 0.15;
        bell.triggerAttackRelease(note, "4n", time, vel);
      }
    } else if (bar >= 4 && bar < 14) {
      const pattern = [1, 0, 0, 1, 0, 1, 0, 0];
      if (pattern[bellCount % pattern.length]) {
        const noteIdx = Math.floor(bellCount / 2) % 3;
        const note = ["A4", "C5", "E5"][noteIdx];
        bell.triggerAttackRelease(note, "4n", time, 0.4);
      }
    } else {
      if (Math.random() > 0.8) {
        const note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
        bell.triggerAttackRelease(note, "4n", time, 0.25);
      }
    }
    
    bellCount++;
  }, "8n").start(0);

  let pulseCount = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 13) {
      const pattern = [1, 0, 1, 1, 0, 1, 0, 1];
      if (pattern[pulseCount % pattern.length]) {
        pulse.triggerAttackRelease("A2", "16n", time, 0.5);
      }
    }
    
    pulseCount++;
  }, "16n").start(0);

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 8 && bar < 13) {
      kick.triggerAttackRelease("C1", "8n", time, 0.6);
    }
  }, "4n").start(0);

  Tone.Transport.schedule((time) => {
    filter.frequency.linearRampToValueAtTime(2200, time + 6 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    filter.frequency.linearRampToValueAtTime(800, time + 4 * (60 / bpm) * 4);
  }, "13:0:0");

  window.toneJsInstruments = { pad, bell, pulse, kick };
  window.toneJsParts = { padLoop, bellLoop, pulseLoop, kickLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
