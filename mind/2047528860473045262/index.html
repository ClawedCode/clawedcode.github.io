<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(float n) { return fract(sin(n) * 43758.5453); }

float sdS(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    float k = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * k);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;

    uv /= 1.0 + 0.05 * sin(t * 0.628);

    vec3 col = mix(vec3(0.01, 0.015, 0.03), vec3(0.02, 0.01, 0.025), uv.y * 0.5 + 0.5);
    col += vec3(0.12, 0.28, 0.22) * exp(-length(uv + vec2(0.0, 0.05)) * 3.0) * 0.04;

    vec3 V = vec3(0.22, 0.68, 0.52);
    vec3 C = vec3(0.93, 0.44, 0.35);
    vec3 B = vec3(0.30, 0.60, 0.93);

    float decT = floor(t / 12.0);
    float decB = smoothstep(0.35, 0.65, fract(t / 12.0));
    float tV = smoothstep(0.0, 0.05, ph) * (1.0 - smoothstep(0.92, 1.0, ph));

    vec2 tA = vec2(0.0, -0.6), tB = vec2(0.0, -0.1);
    float td = sdS(uv, tA, tB);
    col += V * (0.005 / (td + 0.005)) * 0.5 * tV;

    for (int i = 0; i < 3; i++) {
        float pt = fract(t * (0.15 + float(i) * 0.08) + h(float(i)) * 5.0);
        vec2 pp = mix(tA, tB, pt);
        col += V * (0.002 / (length(uv - pp) + 0.001)) * 0.3 * tV;
    }

    for (int b = 0; b < 30; b++) {
        int lv, j;
        if (b < 2) { lv = 1; j = b; }
        else if (b < 6) { lv = 2; j = b - 2; }
        else if (b < 14) { lv = 3; j = b - 6; }
        else { lv = 4; j = b - 14; }

        float lf = float(lv), fj = float(j);
        float lvV = smoothstep(lf * 0.06, lf * 0.06 + 0.08, ph) *
                    (1.0 - smoothstep(0.86 - lf * 0.02, 0.94 - lf * 0.02, ph));

        vec2 pos = tB;
        float ang = 1.5708, len = 0.3;
        vec2 bS = tB, bE = tB;
        float on0 = 1.0, on1 = 1.0;

        for (int s = 0; s < 4; s++) {
            if (s < lv) {
                len *= 0.72;
                float dv = pow(2.0, float(lv - 1 - s));
                float ch = mod(floor(fj / dv), 2.0);
                on0 *= 1.0 - abs(ch - step(0.5, h(decT + float(s) * 10.0)));
                on1 *= 1.0 - abs(ch - step(0.5, h(decT + 1.0 + float(s) * 10.0)));
                float tn = (ch < 0.5) ? 0.4 : -0.4;
                tn *= 1.0 - float(s) * 0.06;
                tn += sin(fj * 3.7 + float(s) * 2.3) * 0.08;
                tn += sin(t * 0.2 + lf * 1.3 + fj * 0.7) * 0.015 * lf;
                ang += tn;
                vec2 ep = pos + vec2(cos(ang), sin(ang)) * len;
                if (s == lv - 1) { bS = pos; bE = ep; }
                pos = ep;
            }
        }

        float onC = mix(on0, on1, decB);
        float bri = mix(0.25, 1.0, onC);
        float ct = fract(lf / 5.0 + t * 0.02);
        vec3 c1 = mix(V, C, smoothstep(0.0, 0.5, ct));
        vec3 bc = mix(c1, B, smoothstep(0.5, 1.0, ct));

        float bd = sdS(uv, bS, bE);
        float th = 0.005 * (1.0 - lf * 0.15);
        col += bc * (th / (bd + th)) * 0.45 * lvV * bri;

        for (int pi = 0; pi < 2; pi++) {
            float sp = 0.12 + h(float(b * 2 + pi)) * 0.18;
            float pt = fract(t * sp + h(float(b * 2 + pi + 50)));
            vec2 pp = mix(bS, bE, pt);
            float pd = length(uv - pp);
            col += bc * (0.0015 / (pd + 0.0008)) * 0.25 * lvV * bri;
        }

        float gd = length(uv - bS);
        float gr = 0.013 - lf * 0.002;
        float ring = abs(gd - gr) - 0.001;
        float ga = smoothstep(0.003, 0.0, ring);
        float dis = pow(sin(t * 0.4 + float(b) * 1.3) * 0.5 + 0.5, 2.5);
        col += bc * ga * dis * 0.1 * lvV;

        vec2 gp = uv - bE;
        float dmd = (abs(gp.x) + abs(gp.y)) - 0.006;
        float da = smoothstep(0.003, 0.0, dmd);
        float dd = pow(cos(t * 0.35 + float(b) * 2.1) * 0.5 + 0.5, 3.0);
        col += bc * da * dd * 0.06 * lvV;
    }

    col *= 1.0 - dot(uv, uv) * 0.6;
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 68;
    Tone.Transport.bpm.value = bpm;

    const rev = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
    await rev.generate();
    const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(rev);
    const cho = new Tone.Chorus({ frequency: 0.2, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(rev);
    cho.start();
    const flt = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(cho);

    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.5, decay: 0.6, sustain: 0.3, release: 1.5 }
    }).toDestination();
    sub.volume.value = -10;

    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth" },
        envelope: { attack: 1.8, decay: 0.5, sustain: 0.4, release: 2.5 }
    }).connect(flt);
    pad.volume.value = -16;

    const bell = new Tone.FMSynth({
        harmonicity: 3.5, modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 3.0, sustain: 0, release: 1.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 0.5 }
    }).connect(dly);
    bell.volume.value = -20;

    const arp = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.25, sustain: 0, release: 0.15 }
    }).connect(dly);
    arp.volume.value = -18;

    const chords = [
        ["D3", "F3", "A3"], ["Bb2", "D3", "F3"],
        ["C3", "E3", "G3"], ["A2", "C3", "E3"]
    ];
    let ci = 0;
    const padLp = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 15) {
            const v = bar < 5 ? 0.2 : bar < 12 ? 0.4 : 0.15;
            pad.triggerAttackRelease(chords[ci % chords.length], "1m", time, v);
        }
        ci++;
    }, "1m").start(0);

    const subN = ["D1", "D1", "Bb0", "C1"];
    let si = 0;
    const subLp = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar < 16) {
            const v = bar < 2 ? 0.3 : bar < 12 ? 0.55 : 0.25;
            sub.triggerAttackRelease(subN[si % subN.length], "2n", time, v);
        }
        si++;
    }, "2n").start(0);

    const bellN = ["D5", "A4", "F5", "C5", "E5", "G4"];
    let bi = 0;
    const bellLp = new Tone.Loop((time) => {
        const sec = Tone.Transport.getSecondsAtTime(time);
        const bar = Math.floor(sec / (60 / bpm) / 4);
        const beat = Math.floor(sec / (60 / bpm)) % 4;
        if (bar >= 3 && bar < 14 && bar % 2 === 1 && beat === 0) {
            bell.triggerAttackRelease(bellN[bi % bellN.length], "2n", time, 0.3);
            bi++;
        }
    }, "4n").start(0);

    const sc = [62, 65, 69, 72, 74, 77];
    let ai = 0;
    const arpLp = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 5 && bar < 13 && Math.random() > 0.2) {
            const n = Tone.Frequency(sc[ai % sc.length], "midi");
            arp.triggerAttackRelease(n, "16n", time, 0.12 + Math.random() * 0.1);
        }
        ai++;
    }, "8n").start(0);

    Tone.Transport.schedule((time) => {
        flt.frequency.linearRampToValueAtTime(2000, time + 5 * (60 / bpm) * 4);
    }, "5:0:0");
    Tone.Transport.schedule((time) => {
        flt.frequency.linearRampToValueAtTime(500, time + 3 * (60 / bpm) * 4);
    }, "12:0:0");

    window.toneJsInstruments = { sub, pad, bell, arp };
    window.toneJsParts = { padLp, subLp, bellLp, arpLp };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
