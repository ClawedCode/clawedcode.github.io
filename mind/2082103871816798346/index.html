<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int k=0;k<3;k++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

float band(vec2 uv,vec2 dir,float w){
  float d=abs(dot(uv,dir));
  return smoothstep(w,0.0,d);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float phase=mod(t,30.0)/30.0;
  
  float convergence=0.5+0.5*sin(phase*6.28318*3.0);
  float merge=pow(convergence,4.0);
  float radius=1.6*(1.0-convergence);
  
  vec2 pAmber=vec2(cos(0.0),sin(0.0))*radius;
  vec2 pCrimson=vec2(cos(2.094),sin(2.094))*radius;
  vec2 pCyan=vec2(cos(4.188),sin(4.188))*radius;
  
  float warp=fbm(uv*3.0+t*0.3)*0.15*(1.0-merge);
  vec2 wuv=uv+vec2(cos(t+uv.y*4.0),sin(t+uv.x*4.0))*warp;
  
  vec3 amber=vec3(1.0,0.65,0.15);
  vec3 crimson=vec3(1.0,0.12,0.18);
  vec3 cyan=vec3(0.25,0.85,1.0);
  
  vec3 col=vec3(0.02,0.01,0.04);
  
  float bw=0.04+0.08*(1.0-merge);
  
  for(int i=0;i<32;i++){
    float fi=float(i)/32.0;
    float ang=fi*6.28318;
    vec2 dir=vec2(cos(ang),sin(ang));
    vec2 sp=dir*radius;
    
    vec2 toCenter=normalize(-sp+vec2(0.001));
    vec2 along=vec2(-toCenter.y,toCenter.x);
    
    float d=abs(dot(wuv-sp,along));
    float beam=smoothstep(bw,0.0,d);
    beam*=smoothstep(radius+0.3,0.0,length(wuv-sp*0.3));
    
    vec3 c;
    float seg=mod(fi*3.0,3.0);
    if(seg<1.0)c=amber;
    else if(seg<2.0)c=crimson;
    else c=cyan;
    
    col+=c*beam*0.35;
  }
  
  float r=length(wuv);
  float ripple=0.0;
  for(int j=0;j<5;j++){
    float fj=float(j);
    float freq=8.0+fj*6.0;
    float speed=2.0+fj*1.5;
    float ring=sin(r*freq-t*speed-merge*8.0);
    ripple+=ring*exp(-r*1.2)*pow(0.6,fj);
  }
  ripple*=merge;
  
  vec3 rippleCol=mix(amber,cyan,0.5+0.5*sin(r*12.0-t*2.0));
  rippleCol=mix(rippleCol,crimson,0.5+0.5*cos(r*7.0+t*1.3));
  col+=rippleCol*ripple*0.6;
  
  float core=exp(-r*r*8.0)*merge;
  col+=vec3(1.0,0.95,0.9)*pow(core,1.5)*3.0;
  
  float halo=exp(-r*r*1.5)*merge*0.4;
  col+=vec3(1.0)*halo;
  
  float glitch=step(0.97,sin(uv.y*120.0+t*8.0))*merge;
  vec2 chr=normalize(uv+vec2(0.001))*0.012*merge;
  col.r+=ripple*0.3*sin(r*15.0-t*3.0+chr.x*100.0);
  col.b+=ripple*0.3*cos(r*15.0-t*3.0-chr.x*100.0);
  col=mix(col,col.brg,glitch*0.5);
  
  float vign=smoothstep(1.4,0.3,length(uv));
  col*=vign;
  
  float scan=0.92+0.08*sin(gl_FragCoord.y*2.5);
  col*=scan;
  
  col=pow(col,vec3(0.85));
  
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 84;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.2 }).connect(masterReverb);

  // === AMBER BAND: warm sustained pad ===
  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 1.5 }).connect(masterComp);
  const amberPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.8, sustain: 0.6, release: 2.5 }
  }).connect(amberFilter);
  amberPad.volume.value = -16;

  const amberChords = [
    ["A2", "E3", "A3", "C4"],
    ["F2", "C3", "F3", "A3"],
    ["G2", "D3", "G3", "B3"]
  ];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    amberPad.triggerAttackRelease(amberChords[amberIdx % amberChords.length], "1m", time + H(15), 0.4);
    amberIdx++;
  }, "1m").start(0);

  // === CRIMSON BAND: distorted sub bass with grit ===
  const crimsonDist = new Tone.Distortion({ distortion: 0.3, wet: 0.4 }).connect(masterComp);
  const crimsonFilter = new Tone.Filter({ type: "lowpass", frequency: 220, Q: 2 }).connect(crimsonDist);
  const crimsonBass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.05, decay: 0.4, sustain: 0.3, release: 0.5 }
  }).connect(crimsonFilter);
  crimsonBass.volume.value = -10;

  const crimsonNotes = ["A1", "A1", "F1", "G1", "A1", "C2", "F1", "G1"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar % 4 !== 3 || crimsonIdx % 8 < 4) {
      crimsonBass.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "8n", time + H(6), 0.7 + Math.random() * 0.2);
    }
    crimsonIdx++;
  }, "4n").start(0);

  // === CYAN BAND: shimmering FM bells ===
  const cyanDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.4 }).connect(masterComp);
  const cyanFilter = new Tone.Filter({ type: "highpass", frequency: 600 }).connect(cyanDelay);
  const cyanBell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.5, sustain: 0.0, release: 1.8 },
    modulation: { type: "sine" }
  }).connect(cyanFilter);
  cyanBell.volume.value = -14;

  const cyanNotes = ["E5", "G5", "B5", "D6", "A5", "C6", "E6", "G5"];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const beat = cyanIdx % 16;
    const playPattern = [1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 0];
    if (playPattern[beat] && bar < 16) {
      cyanBell.triggerAttackRelease(cyanNotes[cyanIdx % cyanNotes.length], "16n", time + H(8), 0.5 + Math.random() * 0.2);
    }
    cyanIdx++;
  }, "16n").start(0);

  // === MERGE PULSE: white noise burst on convergence ===
  const pulseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.8 }).connect(masterComp);
  const pulseNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.3 }
  }).connect(pulseFilter);
  pulseNoise.volume.value = -22;

  // Convergence happens 3 times in 30s - schedule pulse triggers
  let pulseCount = 0;
  const pulseLoop = new Tone.Loop((time) => {
    pulseNoise.triggerAttackRelease(0.5, time + H(5), 0.6);
    pulseFilter.frequency.setValueAtTime(800, time);
    pulseFilter.frequency.exponentialRampToValueAtTime(6000, time + 0.4);
    pulseCount++;
  }, "2:2:0").start("0:2:0");

  // === SUB KICK: marks each merge moment subtly ===
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.06,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.5, sustain: 0, release: 0.1 }
  }).connect(masterComp);
  kick.volume.value = -8;

  let kickCount = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const pattern = [1, 0, 0, 0];
    if (pattern[kickCount % 4] && bar < 17) {
      kick.triggerAttackRelease("A0", "8n", time + H(3), 0.9);
    }
    kickCount++;
  }, "4n").start(0);

  // === GLITCH HATS: appear in middle, fade for loop ===
  const hatFilter = new Tone.Filter({ type: "highpass", frequency: 5000 }).connect(masterComp);
  const hat = new Tone.MetalSynth({
    frequency: 420,
    envelope: { attack: 0.001, decay: 0.05, release: 0.02 },
    harmonicity: 6.2,
    modulationIndex: 28,
    resonance: 5000
  }).connect(hatFilter);
  hat.volume.value = -28;

  let hatBeat = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 14) {
      const pattern = [0, 1, 0, 1, 0, 1, 1, 0];
      if (pattern[hatBeat % 8]) {
        hat.triggerAttackRelease("32n", time + H(4), 0.4 + Math.random() * 0.3);
      }
    }
    hatBeat++;
  }, "8n").start(0);

  // === FILTER AUTOMATION: opens during merge, closes for loop ===
  Tone.Transport.schedule((time) => {
    amberFilter.frequency.linearRampToValueAtTime(2400, time + 4 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    crimsonFilter.frequency.linearRampToValueAtTime(900, time + 4 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    amberFilter.frequency.linearRampToValueAtTime(800, time + 4 * (60 / bpm) * 4);
    crimsonFilter.frequency.linearRampToValueAtTime(220, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  window.toneJsInstruments = { amberPad, crimsonBass, cyanBell, pulseNoise, kick, hat };
  window.toneJsParts = { amberLoop, crimsonLoop, cyanLoop, pulseLoop, kickLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 30;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 30;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
