<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

#define PI 3.14159265
#define TAU 6.28318530

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float n(vec2 p){
    vec2 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x),mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x),f.y);
}

float fb(vec2 p){
    float v=0.0,a=0.5;
    mat2 r=mat2(.8,.6,-.6,.8);
    for(float i=0.0;i<3.0;i++){v+=a*n(p);p=r*p*2.0;a*=.5;}
    return v;
}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
    float ph=mod(iTime,60.0)/60.0,t=ph*TAU;
    float br=1.0+.12*sin(t*9.0)+.06*sin(t*14.0);
    vec3 col=vec3(.012,.008,.02);
    col+=vec3(.04,.025,.06)*fb(uv*2.5+vec2(sin(t*2.0),cos(t*3.0))*.3);
    float g1=0.0,g2=0.0,g3=0.0;
    for(float i=0.0;i<80.0;i++){
        float s=fract(i/80.0+ph*3.0);
        float d=sin(s*PI)*1.6,a=s*TAU*.8+t*4.0;
        vec2 p=d*vec2(cos(a),sin(a*.7+.5))*br;
        g1+=.0025/(length(uv-p)+.008);
        float sg=fract(i/80.0+ph*3.0-.012);
        float dg=sin(sg*PI)*1.6,ag=sg*TAU*.8+t*4.0;
        g1+=.0008/(length(uv-dg*vec2(cos(ag),sin(ag*.7+.5))*br)+.015);
    }
    for(float i=0.0;i<100.0;i++){
        float s=fract(i/100.0+ph*5.0);
        float d=sin(s*PI)*1.3,a=s*TAU*1.5-t*6.0+TAU*.33;
        float j=sin(s*25.0+t*40.0)*.12+sin(s*37.0-t*55.0)*.08;
        vec2 p=d*vec2(cos(a)+j,sin(a*1.2+1.0)+j*.7)*br;
        float b=.5+.5*fract(sin(i*7.3)*43758.5);
        g2+=b*.002/(length(uv-p)+.008);
    }
    for(float i=0.0;i<50.0;i++){
        float s=fract(i/50.0+ph*2.0);
        float d=sin(s*PI)*2.0,a=s*TAU*.5+t*2.0+TAU*.67;
        float w=sin(s*4.0+t*5.0)*.2;
        vec2 p=d*vec2(cos(a+w),sin(a*.5+.8))*br;
        g3+=.004/(length(uv-p)+.006);
        float sg=fract(i/50.0+ph*2.0-.008);
        float dg=sin(sg*PI)*2.0,ag=sg*TAU*.5+t*2.0+TAU*.67;
        float wg=sin(sg*4.0+t*5.0)*.2;
        g3+=.0015/(length(uv-dg*vec2(cos(ag+wg),sin(ag*.5+.8))*br)+.012);
    }
    col+=vec3(1.0,.45,.12)*min(g1,2.5)*.35;
    col+=vec3(.15,.55,1.0)*min(g2,2.5)*.3;
    col+=vec3(.55,.45,.65)*min(g3,2.5)*.35;
    float cd=length(uv),cp=.6+.4*sin(t*7.0);
    vec3 cc=mix(vec3(1.0,.5,.2),vec3(.3,.5,1.0),sin(t*3.0)*.5+.5);
    cc=mix(cc,vec3(.55,.45,.65),sin(t*5.0+1.0)*.5+.5);
    col+=cc*cp*.02/(cd+.03);
    for(float i=0.0;i<12.0;i++){
        float s=fract(i/12.0+ph);
        float d1=sin(s*PI)*1.6,a1=s*TAU*.8+t*4.0;
        vec2 p1=d1*vec2(cos(a1),sin(a1*.7+.5))*br;
        float d2=sin(s*PI)*1.3,a2=s*TAU*1.5-t*6.0+TAU*.33;
        vec2 p2=d2*vec2(cos(a2),sin(a2*1.2+1.0))*br;
        float d3=sin(s*PI)*2.0,a3=s*TAU*.5+t*2.0+TAU*.67;
        vec2 p3=d3*vec2(cos(a3),sin(a3*.5+.8))*br;
        float pr=smoothstep(.5,.1,min(length(p1-p2),min(length(p1-p3),length(p2-p3))));
        vec2 c=(p1+p2+p3)/3.0,q=(uv-c)*10.0;
        float rn=abs(length(q)-.5)-.05,cr=min(abs(q.x),abs(q.y))-.04;
        col+=vec3(.7,.6,.9)*smoothstep(.03,.0,min(rn,cr))*smoothstep(.3,.0,length(uv-c))*pr*.4;
    }
    float ghost=0.0,pho=ph-.08,to=pho*TAU;
    for(float i=0.0;i<25.0;i++){
        float s=fract(i/25.0+pho*3.0),gb=br*.95;
        float d1=sin(s*PI)*1.6,a1=s*TAU*.8+to*4.0;
        ghost+=.001/(length(uv-d1*vec2(cos(a1),sin(a1*.7+.5))*gb)+.02);
        float d2=sin(s*PI)*1.3,a2=s*TAU*1.5-to*6.0+TAU*.33;
        ghost+=.001/(length(uv-d2*vec2(cos(a2),sin(a2*1.2+1.0))*gb)+.02);
        float d3=sin(s*PI)*2.0,a3=s*TAU*.5+to*2.0+TAU*.67;
        float wg=sin(s*4.0+to*5.0)*.2;
        ghost+=.001/(length(uv-d3*vec2(cos(a3+wg),sin(a3*.5+.8))*gb)+.02);
    }
    col+=vec3(.3,.25,.4)*min(ghost,1.0)*.12;
    col*=1.0-.35*length(uv);
    col=col/(1.0+col);
    col=pow(col,vec3(.92));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const rev = new Tone.Reverb({ decay: 3.0, wet: 0.25 }).toDestination();
  await rev.generate();

  const warmFlt = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1 }).connect(rev);
  const warm = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.3, decay: 0.4, sustain: 0.6, release: 0.8 },
    filterEnvelope: { attack: 0.2, decay: 0.3, sustain: 0.5, baseFrequency: 200, octaves: 2 }
  }).connect(warmFlt);
  warm.volume.value = -8;

  const warmSets = {
    a: ["C2", "C2", "G2", "G2"],
    b: ["C2", "Eb2", "F2", "G2", "Ab2", "Bb2"],
    c: ["C2", "D2", "Eb2", "G2", "Bb2", "C3", "Bb2", "G2"]
  };
  let warmIdx = 0;
  const warmLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let notes;
    if (bar < 3 || bar >= 18) notes = warmSets.a;
    else if (bar < 8 || bar >= 14) notes = warmSets.b;
    else notes = warmSets.c;
    warm.triggerAttackRelease(notes[warmIdx % notes.length], "4n", time, 0.7);
    warmIdx++;
  }, "4n").start(0);

  const coolDel = new Tone.FeedbackDelay({ delayTime: "16n.", feedback: 0.3, wet: 0.25 }).connect(rev);
  const coolFlt = new Tone.Filter({ type: "lowpass", frequency: 800 }).connect(coolDel);
  const cool = new Tone.FMSynth({
    harmonicity: 3, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.15, sustain: 0, release: 0.08 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.01, decay: 0.1, sustain: 0 }
  }).connect(coolFlt);
  cool.volume.value = -14;

  const coolScl = {
    sparse: [60, 63, 67],
    mid: [60, 63, 65, 67, 70, 72],
    dense: [60, 62, 63, 65, 67, 68, 70, 72, 74, 75]
  };
  let coolIdx = 0;
  const coolLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 19) {
      if (coolIdx % 4 === 0) {
        cool.triggerAttackRelease(Tone.Frequency(coolScl.sparse[coolIdx % 3], "midi"), "16n", time, 0.3);
      }
    } else if (bar >= 8 && bar < 14) {
      const s = coolScl.dense;
      const oct = Math.floor(coolIdx / s.length) % 2 === 0 ? 0 : 12;
      cool.triggerAttackRelease(Tone.Frequency(s[coolIdx % s.length] + oct, "midi"), "16n", time, 0.4 + Math.random() * 0.2);
    } else {
      if (coolIdx % 2 === 0) {
        cool.triggerAttackRelease(Tone.Frequency(coolScl.mid[coolIdx % coolScl.mid.length], "midi"), "16n", time, 0.35);
      }
    }
    coolIdx++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    coolFlt.frequency.linearRampToValueAtTime(3200, time + 6 * barLen);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    coolFlt.frequency.linearRampToValueAtTime(800, time + 4 * barLen);
  }, "14:0:0");

  const mutCho = new Tone.Chorus({ frequency: 0.3, delayTime: 3.5, depth: 0.6, wet: 0.4 }).connect(rev);
  mutCho.start();
  const mutFlt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.8 }).connect(mutCho);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(mutFlt);
  pad.volume.value = -10;

  const padCh = {
    a: [["C4", "Eb4", "G4"]],
    b: [["Ab3", "C4", "Eb4"], ["Bb3", "D4", "F4"], ["G3", "Bb3", "D4"]],
    c: [["F3", "Ab3", "C4", "Eb4"], ["Db3", "F3", "Ab3", "C4"], ["Eb3", "G3", "Bb3", "D4"]]
  };
  let chIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let chords;
    if (bar < 3 || bar >= 18) chords = padCh.a;
    else if (bar < 8 || bar >= 14) chords = padCh.b;
    else chords = padCh.c;
    pad.triggerAttackRelease(chords[chIdx % chords.length], "1n", time, 0.25);
    chIdx++;
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    mutFlt.frequency.linearRampToValueAtTime(200, time + 5 * barLen);
  }, "5:0:0");
  Tone.Transport.schedule((time) => {
    mutFlt.frequency.linearRampToValueAtTime(500, time + 4 * barLen);
  }, "14:0:0");

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04, octaves: 4,
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.05 }
  }).toDestination();
  kick.volume.value = -18;
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 16) kick.triggerAttackRelease("C1", "8n", time, 0.5);
  }, "2n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 5, modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.5, sustain: 0, release: 0.5 },
    modulation: { type: "sine" }
  }).connect(rev);
  bell.volume.value = -20;
  const bellNotes = ["C5", "Eb5", "G5", "Bb5", "C6"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 16 && bellIdx % 3 === 0) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "8n", time, 0.2 + Math.random() * 0.1);
    }
    bellIdx++;
  }, "2n").start(0);

  window.toneJsInstruments = { warm, cool, pad, kick, bell };
  window.toneJsParts = { warmLoop, coolLoop, padLoop, kickLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
