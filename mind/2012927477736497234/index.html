<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

vec3 lorenz(vec3 p,float dt){
  float sigma=10.0,rho=28.0,beta=8.0/3.0;
  return p+vec3(sigma*(p.y-p.x),p.x*(rho-p.z)-p.y,p.x*p.y-beta*p.z)*dt;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float phase=mod(t,75.0)/75.0;
  float breathe=0.5+0.5*sin(t*0.3);
  float dreamPhase=smoothstep(0.0,0.3,phase)*smoothstep(1.0,0.7,phase);
  vec3 col=vec3(0.02,0.01,0.04);
  float warp=fbm(uv*2.0+t*0.1)*0.3*dreamPhase;
  vec2 warped=uv+vec2(warp,warp*0.7);
  float ring=abs(length(warped)-0.3-0.1*sin(t*0.5))-0.02;
  ring=smoothstep(0.03,0.0,ring);
  col+=ring*vec3(0.3,0.1,0.5)*dreamPhase;
  float particles=0.0;
  for(int i=0;i<200;i++){
    float fi=float(i);
    float seed=hash(vec2(fi,fi*0.7));
    float life=mod(t*0.3+seed*10.0,1.0);
    float fade=smoothstep(0.0,0.1,life)*smoothstep(1.0,0.8,life);
    vec2 origin=vec2(hash(vec2(fi*1.3,fi))-0.5,hash(vec2(fi,fi*2.1))-0.5)*1.5;
    vec2 target=vec2(0.0);
    float cluster=smoothstep(0.3,0.7,sin(t*0.2+fi*0.1)*0.5+0.5);
    vec2 pos=mix(origin,target,life*cluster);
    pos+=vec2(sin(t+fi),cos(t*0.7+fi*1.3))*0.05*(1.0-cluster);
    float d=length(uv-pos);
    float glow=0.003/(d+0.001)*fade;
    float hue=seed+t*0.05;
    vec3 pcol=0.5+0.5*cos(6.28*(hue+vec3(0,0.33,0.67)));
    particles+=glow;
    col+=glow*pcol*0.15;
  }
  vec3 attractorCol=vec3(0.0);
  vec3 ap=vec3(0.1,0.1,0.1);
  for(int i=0;i<80;i++){
    ap=lorenz(ap,0.005);
    vec2 proj=ap.xy*0.015;
    proj=rot(t*0.1)*proj;
    float d=length(uv-proj);
    float trail=0.002/(d+0.002);
    float hue=float(i)*0.01+t*0.02;
    attractorCol+=trail*0.5*(0.5+0.5*cos(6.28*(hue+vec3(0,0.33,0.67))));
  }
  col+=attractorCol*0.3*smoothstep(0.2,0.5,phase)*smoothstep(0.8,0.5,phase);
  float neural=0.0;
  for(int i=0;i<15;i++){
    float fi=float(i);
    vec2 n1=vec2(sin(fi*2.1+t*0.2),cos(fi*1.7+t*0.15))*0.4;
    vec2 n2=vec2(sin(fi*1.3+t*0.25+3.14),cos(fi*2.5+t*0.18))*0.4;
    vec2 closest=n1+clamp(dot(uv-n1,n2-n1)/dot(n2-n1,n2-n1),0.0,1.0)*(n2-n1);
    float d=length(uv-closest);
    float pulse=0.5+0.5*sin(t*3.0+fi*0.5);
    float line=0.002/(d+0.002)*pulse;
    neural+=line;
  }
  col+=neural*vec3(0.2,0.4,0.8)*0.2*dreamPhase;
  float remCycle=sin(t*0.15)*0.5+0.5;
  float vignette=1.0-length(uv)*0.7;
  col*=vignette;
  col=mix(col,col*vec3(0.8,0.7,1.0),remCycle*0.3);
  float hypnagogia=smoothstep(0.0,0.15,phase)+smoothstep(1.0,0.85,phase);
  float dissolve=fbm(uv*5.0+t*0.5)*hypnagogia;
  col=mix(col,col*1.5,dissolve*0.3);
  col=pow(col,vec3(0.9));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 78;
  Tone.Transport.bpm.value = bpm;
  const masterReverb = new Tone.Reverb({ decay: 3.8, wet: 0.32 }).toDestination();
  await masterReverb.generate();
  const tapeDelay = new Tone.FeedbackDelay({ delayTime: '8n.', feedback: 0.32, wet: 0.24 }).connect(masterReverb);
  const wobble = new Tone.Chorus({ frequency: 0.28, delayTime: 4.2, depth: 0.45, wet: 0.32 }).connect(tapeDelay).start();
  const padFilter = new Tone.Filter({ type: 'lowpass', frequency: 1400, Q: 0.6 }).connect(wobble);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sawtooth' },
    detune: -6,
    envelope: { attack: 1.4, decay: 0.7, sustain: 0.62, release: 3.4 }
  }).connect(padFilter);
  const padChordsIntro = [
    ['D3', 'F#3', 'A3', 'D4'],
    ['G3', 'A3', 'D4', 'E4']
  ];
  const padChordsMiddle = [
    ['D3', 'A3', 'D4', 'F#4'],
    ['B2', 'F#3', 'A3', 'C#4'],
    ['G3', 'B3', 'D4', 'G4'],
    ['A2', 'E3', 'A3', 'C#4']
  ];
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const velocity = 0.28 + Math.random() * 0.05;
    if (bar < 8 || bar >= 20) {
      const chord = padChordsIntro[padIndex % padChordsIntro.length];
      pad.triggerAttackRelease(chord, '2m', time, velocity);
    } else {
      const chord = padChordsMiddle[padIndex % padChordsMiddle.length];
      pad.triggerAttackRelease(chord, '2m', time, velocity);
    }
    padIndex++;
  }, '2m').start(0);
  const rhodesDelay = new Tone.FeedbackDelay({ delayTime: '4n.', feedback: 0.28, wet: 0.22 }).connect(wobble);
  const rhodes = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.03, decay: 0.32, sustain: 0.24, release: 0.9 }
  }).connect(rhodesDelay);
  const melodyNotes = ['D4', 'E4', 'F#4', 'A4', 'F#4', 'E4', 'D4', 'B3', 'D4', 'A3'];
  const melodyDurations = ['8n', '8n', '4n', '8n', '8n', '8n', '4n', '8n', '8n', '2n'];
  let melodyIndex = 0;
  const melodyLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 20) {
      const vel = 0.48 + Math.random() * 0.08;
      rhodes.triggerAttackRelease(
        melodyNotes[melodyIndex % melodyNotes.length],
        melodyDurations[melodyIndex % melodyDurations.length],
        time,
        vel
      );
      melodyIndex++;
    }
  }, '8n').start(0);
  const bassFilter = new Tone.Filter({ type: 'lowpass', frequency: 260, Q: 0.8 }).connect(masterReverb);
  const bass = new Tone.MonoSynth({
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.05, decay: 0.26, sustain: 0.22, release: 0.62 }
  }).connect(bassFilter);
  const bassSections = [
    ['D2', 'A1', 'D2', 'A1'],
    ['D2', 'A1', 'B1', 'F#1', 'G1', 'D2', 'A1', 'E2'],
    ['D2', 'A1', 'D2', 'A1']
  ];
  let bassStep = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4) {
      let pattern;
      if (bar < 12) {
        pattern = bassSections[0];
      } else if (bar < 20) {
        pattern = bassSections[1];
      } else {
        pattern = bassSections[2];
      }
      const note = pattern[bassStep % pattern.length];
      const vel = 0.44 + Math.random() * 0.06;
      bass.triggerAttackRelease(note, '4n', time, vel);
      bassStep++;
    }
  }, '4n').start(0);
  const kickFilter = new Tone.Filter({ type: 'lowpass', frequency: 320, Q: 0.5 }).connect(masterReverb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 3,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.002, decay: 0.28, sustain: 0, release: 0.18 }
  }).connect(kickFilter);
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 22) {
      const vel = 0.52 + Math.random() * 0.1;
      kick.triggerAttackRelease('C1', '8n', time, vel);
    } else if (bar >= 22 && bar < 24) {
      const vel = 0.35 + Math.random() * 0.06;
      kick.triggerAttackRelease('C1', '8n', time, vel);
    }
  }, '4n').start(0);
  const snareFilter = new Tone.Filter({ type: 'lowpass', frequency: 900, Q: 0.5 }).connect(masterReverb);
  const snare = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.01, decay: 0.16, sustain: 0 }
  }).connect(snareFilter);
  let snareCount = 0;
  const snareLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 20 && snareCount % 2 === 1) {
      const vel = 0.34 + Math.random() * 0.07;
      snare.triggerAttackRelease('16n', time, vel);
    } else if (bar >= 20 && bar < 22 && snareCount % 4 === 3) {
      const vel = 0.26 + Math.random() * 0.05;
      snare.triggerAttackRelease('16n', time, vel);
    }
    snareCount++;
  }, '4n').start(0);
  const hatFilter = new Tone.Filter({ type: 'highpass', frequency: 4200, Q: 0.4 }).connect(masterReverb);
  const hat = new Tone.MetalSynth({
    frequency: 300,
    envelope: { attack: 0.001, decay: 0.09, release: 0.02 },
    harmonicity: 5.3,
    modulationIndex: 22,
    resonance: 3800
  }).connect(hatFilter);
  const hatVelocities = [0.18, 0.12, 0.16, 0.1, 0.2, 0.11, 0.17, 0.09];
  let hatIndex = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 10 && bar < 18) {
      const vel = hatVelocities[hatIndex % hatVelocities.length] * 0.45;
      hat.triggerAttackRelease('16n', time, vel);
      hatIndex++;
    }
  }, '8n').start(0);
  const texture = new Tone.NoiseSynth({
    noise: { type: 'brown' },
    envelope: { attack: 2.0, decay: 0, sustain: 1.0, release: 4.0 }
  }).connect(masterReverb);
  Tone.Transport.schedule((time) => {
    texture.triggerAttackRelease('2m', time, 0.08);
  }, '0:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2200, time + 12 * (60 / bpm) * 4);
  }, '6:0:0');
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + 8 * (60 / bpm) * 4);
  }, '18:0:0');
  window.toneJsInstruments = { pad, rhodes, bass, kick, snare, hat, texture };
  window.toneJsParts = { padLoop, melodyLoop, bassLoop, kickLoop, snareLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
