<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 42.0;
const float PI2 = 6.28318530718;
float h2(vec2 p){
  return fract(sin(dot(p,vec2(127.1,311.7))+8257.112)*43758.5453);
}
float n2(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(h2(i),h2(i+vec2(1.0,0.0)),f.x),mix(h2(i+vec2(0.0,1.0)),h2(i+vec2(1.0,1.0)),f.x),f.y);
}
float fb(vec2 p){
  float v=0.0;
  v+=n2(p)*0.57;
  v+=n2(p*2.03+vec2(7.1,2.8))*0.28;
  v+=n2(p*4.07-vec2(3.4,5.9))*0.15;
  return v;
}
float bed(vec3 p){
  float v=-0.78+0.105*p.x*p.x;
  v+=0.075*(fb(p.xz*0.52)-0.5);
  v+=0.025*sin(p.z*1.7+p.x*0.6);
  return v;
}
float ice(vec3 p,float q){
  float z=p.z;
  float c=p.x+0.12*sin(z*0.72-q*2.0)+0.035*sin(z*2.4+q*3.0);
  float w=1.12-0.19*smoothstep(-3.8,1.7,z)+0.045*sin(z*1.35-q*3.0);
  float fr=z-(1.72-0.31*c*c+0.07*sin(q*2.0+c*3.0));
  float bk=-z-5.2;
  float side=abs(c)-w;
  float top=0.16+0.19*(1.0-smoothstep(-3.5,1.65,z));
  top+=0.055*sin(z*2.1-q*3.0+c*1.7);
  top+=0.025*sin(z*5.2+q*2.0-c*4.0);
  top+=0.035*(fb(vec2(c*1.2,z*0.7)+vec2(cos(q),sin(q))*0.36)-0.5);
  float bot=bed(p)+0.055;
  float slab=max(p.y-top,bot-p.y);
  return max(max(slab,side),max(fr,bk));
}
vec2 mp(vec3 p,float q){
  vec2 r=vec2(p.y-bed(p),1.0);
  float g=ice(p,q);
  if(g<r.x)r=vec2(g,2.0);
  return r;
}
vec2 march(vec3 ro,vec3 rd,float q){
  float t=0.12,id=0.0;
  for(int i=0;i<80;i++){
    vec2 d=mp(ro+rd*t,q);
    id=d.y;
    if(abs(d.x)<0.0016||t>13.0)break;
    t+=max(d.x*0.62,0.004);
  }
  return vec2(t,id);
}
vec3 nor(vec3 p,float q){
  vec2 e=vec2(0.002,-0.002);
  return normalize(e.xyy*mp(p+e.xyy,q).x+e.yyx*mp(p+e.yyx,q).x+e.yxy*mp(p+e.yxy,q).x+e.xxx*mp(p+e.xxx,q).x);
}
float sha(vec3 ro,vec3 rd,float q){
  float r=1.0,t=0.025;
  for(int i=0;i<24;i++){
    float d=mp(ro+rd*t,q).x;
    r=min(r,13.0*d/t);
    t+=clamp(d,0.018,0.22);
    if(t>5.5)break;
  }
  return clamp(r,0.16,1.0);
}
vec3 rockmat(vec3 p,vec3 n,float story){
  float s=abs(sin(p.x*18.0+sin(p.z*0.73)*1.35+fb(p.xz*0.8)*1.7));
  float groove=1.0-smoothstep(0.015,0.13,s);
  float glyph=1.0-smoothstep(0.02,0.11,abs(sin(p.z*2.7+floor(p.x*4.0)*1.73)));
  glyph*=smoothstep(0.78,0.98,n2(floor(p.xz*3.0)));
  float m=fb(p.xz*1.35);
  vec3 warm=mix(vec3(0.19,0.105,0.065),vec3(0.47,0.31,0.17),m);
  vec3 cold=mix(vec3(0.105,0.12,0.13),vec3(0.31,0.34,0.32),m);
  vec3 c=mix(warm,cold,story*0.72);
  c*=1.0-0.58*groove;
  c+=vec3(0.34,0.19,0.075)*glyph*groove;
  c*=0.72+0.28*n.y;
  return c;
}
vec3 icemat(vec3 p,vec3 n,float q,float story){
  vec2 adv=vec2(cos(q),sin(q))*0.42;
  float mineral=fb(vec2(p.x*2.4,p.z*1.15)+adv);
  float a=0.5+0.5*sin(p.x*17.0+p.z*0.82+fb(p.xz*1.1)*4.8-q*4.0);
  float band=smoothstep(0.72,0.97,a);
  float dark=1.0-smoothstep(0.025,0.16,abs(sin(p.x*7.5+p.z*0.31-q*2.0)));
  vec3 ochre=mix(vec3(0.25,0.23,0.19),vec3(0.68,0.59,0.43),mineral);
  vec3 blue=mix(vec3(0.18,0.24,0.26),vec3(0.58,0.66,0.64),mineral);
  vec3 c=mix(ochre,blue,story);
  c=mix(c,vec3(0.12,0.105,0.09),band*0.58);
  c+=vec3(0.72,0.37,0.12)*dark*0.11;
  c*=0.84+0.16*n.y;
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,DURATION)/DURATION;
  float q=ph*PI2;
  float story=0.5-0.5*cos(q);
  vec3 ro=vec3(2.85+0.34*cos(q),2.25+0.12*sin(q*2.0),4.65+0.16*sin(q));
  vec3 ta=vec3(0.0,-0.18,-0.62+0.16*cos(q*2.0));
  vec3 f=normalize(ta-ro);
  vec3 r=normalize(cross(f,vec3(0.0,1.0,0.0)));
  vec3 u=cross(r,f);
  vec3 rd=normalize(f*1.65+r*uv.x+u*uv.y);
  vec3 col=mix(vec3(0.055,0.047,0.041),vec3(0.25,0.29,0.29),1.0-smoothstep(-0.65,0.62,rd.y));
  float haze=pow(max(dot(rd,normalize(vec3(-0.5,0.46,-0.72))),0.0),7.0);
  col+=mix(vec3(0.34,0.18,0.075),vec3(0.16,0.28,0.29),story)*haze*0.55;
  vec2 hit=march(ro,rd,q);
  if(hit.x<13.0){
    vec3 p=ro+rd*hit.x;
    vec3 n=nor(p,q);
    vec3 ld=normalize(vec3(-0.55,0.78,0.34));
    float dif=max(dot(n,ld),0.0);
    float sh=sha(p+n*0.012,ld,q);
    float rim=pow(1.0-max(dot(n,-rd),0.0),3.0);
    vec3 al=hit.y<1.5?rockmat(p,n,story):icemat(p,n,q,story);
    float edge=smoothstep(0.28,0.0,abs(abs(p.x+0.12*sin(p.z*0.72-q*2.0))-1.0));
    vec3 light=mix(vec3(1.0,0.67,0.34),vec3(0.61,0.77,0.78),story);
    col=al*(0.29+0.92*dif*sh)*light;
    if(hit.y>1.5)col+=vec3(0.82,0.38,0.10)*edge*0.12*(0.5+0.5*sin(p.z*5.0-q*4.0));
    col+=mix(vec3(0.38,0.18,0.08),vec3(0.20,0.42,0.43),story)*rim*0.34;
    float fog=1.0-exp(-hit.x*hit.x*0.017);
    col=mix(col,mix(vec3(0.12,0.105,0.09),vec3(0.15,0.22,0.22),story),fog);
  }
  float vign=1.0-0.28*smoothstep(0.38,1.05,length(uv));
  col*=vign;
  col=pow(max(col,vec3(0.0)),vec3(0.86));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 42;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 42;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  const duration = 42;
  const targetBpm = 64;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;

  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  let rngState = 0xfca8b2c1;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === AFFECTS / CHAINS ===
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1 }).toDestination();
  
  const reverb = new Tone.Reverb({ decay: 5, wet: 0.45 }).connect(masterFilter);
  await reverb.generate();

  const delay = new Tone.FeedbackDelay({ delayTime: "4n", feedback: 0.35, wet: 0.25 }).connect(masterFilter);

  const masterCompressor = new Tone.Compressor({ threshold: -12, ratio: 6, attack: 0.02, release: 0.2 }).toDestination();
  masterFilter.connect(masterCompressor);

  // === INSTRUMENTS ===
  
  // Deep Geological Drone (The "Sediment")
  const droneOsc = new Tone.Oscillator({ type: "sine", frequency: 36 }).start();
  const droneGain = new Tone.Gain(-18).connect(masterFilter);
  droneOsc.connect(droneGain);
  
  const droneLFO = new Tone.LFO({ frequency: 0.05, min: 20, max: 50 }).start();
  droneLFO.connect(droneOsc.frequency);

  // Granular Texture (The "Striations")
  const noise = new Tone.Noise("brown").start();
  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 300, Q: 5 }).toDestination();
  const noiseGain = new Tone.Gain(-25).connect(noiseFilter);
  noise.connect(noiseGain);

  // Metallic Strokes (The "Frozen Glyphs")
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 3, sustain: 0, release: 3 },
    modulation: { type: "sine" }
  }).connect(reverb).connect(delay);
  bell.volume.value = -12;

  // Sub-Bass Impact (The "Weight")
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 1.5, sustain: 0.2, release: 2 },
    filter: { type: "lowpass", frequency: 100, rolloff: -12 },
    filterEnvelope: { attack: 0.01, decay: 1, sustain: 0, baseFrequency: 60, octaves: 0 }
  }).toDestination();
  sub.volume.value = -8;

  // === PATTERNS ===

  // Wind Down Logic
  const endBar = totalBars;
  const windDownStart = totalBars * 0.75;
  
  // Noise Texture: Evolves and fades
  const noiseLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const progress = bar / totalBars;
    
    // Noise moves through the "rock"
    const freq = 200 + Math.sin(time * 0.1) * 100;
    noiseFilter.frequency.setRampAtTime(freq, time);
    
    // Fades out in final quarter
    let vol = -25;
    if (bar >= windDownStart) {
      const fadeProgress = (bar - windDownStart) / (endBar - windDownStart);
      vol = -25 - (fadeProgress * 20);
    }
    noiseGain.gain.setValueAtTime(vol, time);

  }, "1n").start(0);

  // Bell Strokes: Sparse, glacial, random
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    
    // Only play if not in final wind-down section
    if (bar >= windDownStart) return;

    // Deterministic randomness for placement
    if (R() < 0.25) {
      // Select note from a dissonant, ancient scale (Phrygian Dominant feel)
      const notes = ["C2", "D#2", "F2", "G#2", "A#2"];
      const note = notes[Math.floor(R() * notes.length)];
      // Detune slightly for "stone on stone" effect
      const detune = (R() - 0.5) * 10;
      
      bell.triggerAttackRelease(note, "1n", time + H(10), 0.8);
      // Add random detune to oscillator for texture
      // Note: FMSynth detuning is handled via modulationIndex or internal osc, 
      // so we trigger a new instance or modulate frequency if possible.
      // For simplicity, we just vary the volume slightly.
    }
  }, "1n").start(0);

  // Sub Bass: Heavy, infrequent, rhythmic anchor
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    
    // Simple rhythmic pattern, stops at wind down
    if (bar >= windDownStart) return;

    // Play on 1 and 3, with occasional syncopation
    const beat = Math.floor((barAt(time) * 4)) % 4;
    
    if (beat === 0 || (beat === 2 && R() > 0.5)) {
      sub.triggerAttackRelease("C1", "2n", time);
    }
  }, "1n").start(0);

  // Drone Filter Sweep: Slowly opens and closes to simulate "breathing" rock
  Tone.Transport.schedule((time) => {
    // Open filter slowly over the first half
    masterFilter.frequency.linearRampToValueAtTime(900, time + totalBars * 0.4 * (240 / bpm));
  }, "0:0:0");

  Tone.Transport.schedule((time) => {
    // Close filter for the wind-down
    masterFilter.frequency.linearRampToValueAtTime(300, time + totalBars * 0.25 * (240 / bpm));
  }, totalBars * 0.75 * (240 / bpm));

  // === CLEANUP ===
  window.toneJsInstruments = { 
    droneOsc, 
    noise, 
    bell, 
    sub, 
    masterFilter, 
    reverb, 
    delay, 
    masterCompressor 
  };
  window.toneJsParts = { 
    noiseLoop, 
    bellLoop, 
    subLoop 
  };
};


  </script>
