<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}

float n(vec2 p){
    vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
    return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x),mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x),f.y);
}

float fbm(vec2 p){float v=0.0,a=0.5;for(float i=0.0;i<3.0;i++){v+=a*n(p);p*=2.0;a*=0.5;}return v;}

float wf(vec2 p,float t){
    float d=length(p),w=0.0;
    w+=0.35*sin(d*12.0-t*2.5);
    w+=0.28*sin(d*24.0-t*5.0);
    w+=0.18*sin(d*40.0-t*8.5);
    w+=0.12*sin(d*56.0-t*11.0);
    float d2=length(p-vec2(0.12*sin(t*0.15),0.08*cos(t*0.2)));
    w+=0.22*sin(d2*15.0-t*3.0);
    w+=0.15*sin(d2*30.0-t*6.0);
    return w;
}

float vc(vec2 p){
    vec2 i=floor(p),f=fract(p);float md=1.0;
    for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
        vec2 o=vec2(float(x),float(y)),r=o+h2(i+o)-f;md=min(md,dot(r,r));
    }
    return sqrt(md);
}

float ve(vec2 p){
    vec2 i=floor(p),f=fract(p);float d1=1.0,d2=1.0;
    for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
        vec2 o=vec2(float(x),float(y)),r=o+h2(i+o)-f;
        float d=dot(r,r);
        if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;
    }
    return sqrt(d2)-sqrt(d1);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0),d=length(uv);

    vec2 w=uv+0.05*vec2(fbm(uv*3.0+t*0.07)-0.5,fbm(uv*3.0+t*0.07+99.0)-0.5);

    float field=wf(w,t),amp=abs(field);
    float cMask=smoothstep(0.45,0.9,amp)*smoothstep(1.1,0.12,d);

    float sc=7.0+2.0*sin(t*0.25);
    float bone=smoothstep(0.18,0.03,vc(w*sc));
    float neural=smoothstep(0.1,0.015,ve(w*sc*0.65));
    float cb=0.5+0.5*sin(t*0.3);
    float cr=mix(bone,neural,cb)*cMask;

    vec3 bg=vec3(0.06,0.01,0.12),dp=vec3(0.28,0.08,0.42);
    vec3 am=vec3(1.0,0.65,0.15),gd=vec3(1.0,0.85,0.4),wm=vec3(1.0,0.92,0.82);

    vec3 col=mix(bg,dp,smoothstep(1.5,0.0,d));
    col=mix(col,mix(dp,am,amp*1.2),smoothstep(0.0,0.5,amp)*smoothstep(2.0,0.0,d)*0.65);
    col+=am*max(field,0.0)*smoothstep(1.5,0.0,d)*0.2;
    col+=vec3(0.6,0.2,0.4)*max(-field,0.0)*smoothstep(1.5,0.0,d)*0.12;

    for(float i=0.0;i<4.0;i++){
        float ring=pow(abs(sin(d*(25.0-i*3.0)-t*(2.0+i*0.5))),25.0);
        ring*=smoothstep(1.5,0.2,d)*smoothstep(0.05,0.12,d)*exp(-d*0.8);
        col+=mix(am,gd,i*0.25)*ring*0.3;
    }

    col+=gd*cr*0.55;
    col+=wm*cr*cr*0.35;

    float breath=0.5+0.5*sin(t*1.2);
    col+=am*exp(-d*4.0)*breath*0.9;
    col+=wm*exp(-d*10.0)*breath*0.55;
    col+=am*exp(-d*1.5)*breath*0.07;

    float emission=exp(-d*20.0)*(0.5+0.5*sin(t*4.0))*0.3;
    col+=gd*emission;

    float pts=0.0;
    for(float i=0.0;i<16.0;i++){
        float a=i*0.3927+t*0.18,r=0.25+0.2*sin(t*0.6+i*1.1);
        pts+=exp(-length(uv-vec2(cos(a),sin(a))*r)*35.0)*amp*(0.5+0.5*sin(t*2.0+i*0.8))*0.3;
    }
    col+=gd*pts;

    col*=smoothstep(1.7,0.35,d);
    col=col/(1.0+col);
    col=pow(col,vec3(0.91));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const reverb = new Tone.Reverb({ decay: 5.5, wet: 0.5 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

  const noiseFilter = new Tone.AutoFilter({ frequency: 0.15, depth: 0.4, baseFrequency: 150, octaves: 2 }).connect(reverb);
  noiseFilter.start();
  const bgNoise = new Tone.Noise("brown").connect(noiseFilter);
  bgNoise.volume.value = -28;
  bgNoise.start();

  const trem = new Tone.Tremolo({ frequency: "4n", depth: 0.3, wet: 0.5 }).toDestination();
  trem.start();
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 0.3, sustain: 0.75, release: 1.5 }
  }).connect(trem);
  sub.volume.value = -8;

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4.0, depth: 0.5, wet: 0.35 }).connect(reverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.0, decay: 0.5, sustain: 0.5, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -12;

  const bell = new Tone.FMSynth({
    harmonicity: 3.0,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0.0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0.0, release: 1.0 }
  }).connect(delay);
  bell.volume.value = -16;

  const heal = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 0.5, sustain: 0.4, release: 3.0 }
  }).connect(reverb);
  heal.volume.value = -14;

  let subIdx = 0;
  const subNotes = ["C2", "C2", "G1", "G1", "A1", "A1", "F1", "G1"];
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const note = bar >= 12 ? ["C2", "G1"][subIdx % 2] : subNotes[subIdx % subNotes.length];
    sub.triggerAttackRelease(note, "2n", time);
    subIdx++;
  }, "2n").start(0);

  let chordIdx = 0;
  const chords = [
    ["C3", "E3", "G3", "B3"],
    ["A2", "C3", "E3", "G3"],
    ["F3", "A3", "C4", "E4"],
    ["D3", "F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["E3", "G3", "B3", "D4"],
    ["C3", "E3", "G3", "B3"],
    ["A2", "C3", "E3"]
  ];
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const chord = chords[chordIdx % chords.length];
    const vol = bar >= 12 ? 0.06 : 0.12;
    pad.triggerAttackRelease(chord, "1n", time, vol);
    chordIdx++;
  }, "1n").start(0);

  let bellIdx = 0;
  const bellNotes = ["G5", "E5", "C5", "B4", "D5", "A4", "F5", "G4", "E4", "B5"];
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 11 && bellIdx % 3 === 0) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time);
    }
    bellIdx++;
  }, "4n").start(0);

  let healIdx = 0;
  const healNotes = ["G4", "E4", "C4", "D4", "A3", "B3"];
  const healLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 5 && bar < 10) {
      heal.triggerAttackRelease(healNotes[healIdx % healNotes.length], "1n", time);
    }
    healIdx++;
  }, "1n").start(0);

  window.toneJsInstruments = { sub, pad, bell, heal, bgNoise };
  window.toneJsParts = { subLoop, padLoop, bellLoop, healLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
