<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) {
  return fract(sin(n) * 43758.5453);
}

mat2 rot(float a) {
  float c = cos(a);
  float s = sin(a);
  return mat2(c, -s, s, c);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i.x + i.y * 57.0);
  float b = hash(i.x + 1.0 + i.y * 57.0);
  float c = hash(i.x + (i.y + 1.0) * 57.0);
  float d = hash(i.x + 1.0 + (i.y + 1.0) * 57.0);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float f = 0.0;
  f += 0.5000 * noise(p); p = p * 2.02;
  f += 0.2500 * noise(p); p = p * 2.03;
  f += 0.1250 * noise(p);
  return f;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime * 0.12;
  
  float coherence = 0.5 + 0.48 * sin(t * 0.35);
  float breathe = 0.5 + 0.5 * sin(t * 0.6);
  
  vec3 col = vec3(0.008, 0.006, 0.015);
  
  vec2 p = uv * 2.5;
  
  vec2 flowR = vec2(fbm(p + t * 0.2), fbm(p + t * 0.2 + 10.0));
  vec2 flowG = vec2(fbm(p + t * 0.2 + 20.0), fbm(p + t * 0.2 + 30.0));
  vec2 flowB = vec2(fbm(p + t * 0.2 + 40.0), fbm(p + t * 0.2 + 50.0));
  
  float chaosAmt = (1.0 - coherence) * 0.5;
  vec2 warpR = p + flowR * chaosAmt;
  vec2 warpG = p + flowG * chaosAmt;
  vec2 warpB = p + flowB * chaosAmt;
  
  float freqBase = 6.0 + coherence * 4.0;
  
  float wave1R = sin(length(warpR) * freqBase - t * 2.5);
  float wave2R = sin(warpR.x * freqBase * 0.7 + warpR.y * freqBase * 0.3 + t * 1.8);
  float patternR = wave1R * wave2R;
  
  float wave1G = sin(length(warpG) * freqBase - t * 2.5 + 2.1);
  float wave2G = sin(warpG.x * freqBase * 0.7 + warpG.y * freqBase * 0.3 + t * 1.8 + 2.1);
  float patternG = wave1G * wave2G;
  
  float wave1B = sin(length(warpB) * freqBase - t * 2.5 + 4.2);
  float wave2B = sin(warpB.x * freqBase * 0.7 + warpB.y * freqBase * 0.3 + t * 1.8 + 4.2);
  float patternB = wave1B * wave2B;
  
  col.r += patternR * 0.18 + smoothstep(0.6, 1.0, patternR) * coherence * 0.25;
  col.g += patternG * 0.18 + smoothstep(0.6, 1.0, patternG) * coherence * 0.3;
  col.b += patternB * 0.18 + smoothstep(0.6, 1.0, patternB) * coherence * 0.35;
  
  vec3 particles = vec3(0.0);
  for (float i = 0.0; i < 150.0; i++) {
    float seed = i * 0.217;
    float angle = hash(seed) * 6.28318;
    float radius = 0.3 + hash(seed + 1.0) * 0.6;
    vec2 pos = vec2(cos(angle), sin(angle)) * radius;
    
    float orbitSpeed = 0.3 + hash(seed + 2.0) * 1.2;
    float phase = hash(seed + 3.0) * 6.28318;
    pos = rot(t * orbitSpeed + phase) * pos;
    
    vec2 chaos = vec2(noise(pos * 4.0 + t * 0.5), noise(pos * 4.0 + t * 0.5 + 7.0));
    chaos = (chaos * 2.0 - 1.0) * chaosAmt * 0.4;
    pos += chaos;
    
    float dist = length(uv - pos);
    float size = 0.006 + hash(seed + 4.0) * 0.004;
    float intensity = smoothstep(size, 0.0, dist);
    
    float hue = hash(seed + 5.0);
    particles.r += intensity * (0.4 + 0.6 * sin(hue * 6.28318));
    particles.g += intensity * (0.4 + 0.6 * sin(hue * 6.28318 + 2.0));
    particles.b += intensity * (0.4 + 0.6 * sin(hue * 6.28318 + 4.0));
  }
  
  col += particles * 0.35;
  
  float centerGlow = exp(-length(uv) * 1.5) * breathe * 0.15;
  col += centerGlow * vec3(0.1, 0.15, 0.25);
  
  float totalDensity = (col.r + col.g + col.b) / 3.0;
  col += totalDensity * totalDensity * vec3(0.08, 0.12, 0.18);
  
  col *= 1.0 - length(uv) * 0.3;
  
  gl_FragColor = vec4(col, 1.0);
}



function hash(n) {
  return Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1;
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 74;
  Tone.Transport.bpm.value = bpm;
  
  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  
  const compressor = new Tone.Compressor({ threshold: -22, ratio: 6, attack: 0.005, release: 0.2 }).toDestination();
  
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.04 }
  }).toDestination();
  
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 18) {
      kick.triggerAttackRelease("C1", "8n", time, 0.85);
      compressor.threshold.setValueAtTime(-32, time);
      compressor.threshold.exponentialRampToValueAtTime(-22, time + 0.18);
    }
  }, "4n").start(0);
  
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.0 }).connect(compressor);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.12, sustain: 0, release: 0.06 }
  }).connect(bassFilter);
  
  const bassPatternA = ["A1", "A1", "E1", "G1"];
  const bassPatternB = ["A1", "C2", "E1", "G1", "F1", "E1"];
  const bassPatternC = ["A1", "A1", "E1", "E1"];
  
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    let pattern;
    if (bar < 4) pattern = bassPatternA;
    else if (bar < 12) pattern = bassPatternB;
    else if (bar < 16) pattern = bassPatternA;
    else pattern = bassPatternC;
    
    if (bar >= 4 && bar < 17) {
      bass.triggerAttackRelease(pattern[bassIndex % pattern.length], "8n", time, 0.75);
    }
    bassIndex++;
  }, "8n").start(0);
  
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(420, time + 6 * (60 / bpm) * 4);
  }, "6:0:0");
  
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(180, time + 3 * (60 / bpm) * 4);
  }, "15:0:0");
  
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 800 }).connect(compressor);
  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -6,
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.5, release: 1.8 }
  }).connect(padChorus);
  
  const chordProgression = [
    ["A2", "C3", "E3"],
    ["G2", "B2", "D3"],
    ["F2", "A2", "C3"],
    ["E2", "G2", "B2"]
  ];
  
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const velocity = bar < 2 ? 0.12 : bar < 16 ? 0.18 : 0.10;
    
    pad.triggerAttackRelease(chordProgression[chordIndex % chordProgression.length], "1n", time, velocity);
    chordIndex++;
  }, "1n").start(0);
  
  const bellReverb = new Tone.Reverb({ decay: 4.5, wet: 0.6 }).toDestination();
  await bellReverb.generate();
  
  const bell = new Tone.FMSynth({
    harmonicity: 3.2,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 2.5, sustain: 0, release: 0.5 },
    modulation: { type: "sine" }
  }).connect(bellReverb);
  
  const bellNotes = ["A4", "E5", "C5", "G4", "B4"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 14 && bellIndex % 3 === 0) {
      const noteChoice = Math.floor(hash(bellIndex) * bellNotes.length);
      bell.triggerAttackRelease(bellNotes[noteChoice], "4n", time, 0.25);
    }
    bellIndex++;
  }, "8n").start(0);
  
  const hat = new Tone.MetalSynth({
    frequency: 280,
    envelope: { attack: 0.001, decay: 0.15, release: 0.04 },
    harmonicity: 4.8,
    modulationIndex: 28,
    resonance: 3500
  }).connect(masterReverb);
  
  let hatBeat = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 8 && bar < 16 && hatBeat % 2 === 1) {
      hat.triggerAttackRelease("16n", time, 0.35);
    }
    hatBeat++;
  }, "8n").start(0);
  
  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 600 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.6, decay: 0.3, sustain: 0, release: 0.8 }
  }).connect(noiseHPF);
  
  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(2800, time + 1.2);
    noise.triggerAttackRelease(1.2, time);
  }, "5:3:0");
  
  window.toneJsInstruments = { kick, bass, pad, bell, hat, noise };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, bellLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
