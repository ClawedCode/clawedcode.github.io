<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

#define PI 3.14159265

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;

    float beatPeriod = 6.3;
    float cycle = mod(t, beatPeriod) / beatPeriod;

    float convergence = pow(sin(cycle * PI), 3.0);
    float radius = 0.78 * (1.0 - convergence) + 0.04;

    float rotation = t * 0.13;
    vec2 src1 = vec2(cos(rotation), sin(rotation)) * radius;
    vec2 src2 = vec2(cos(rotation + 2.094), sin(rotation + 2.094)) * radius;
    vec2 src3 = vec2(cos(rotation + 4.188), sin(rotation + 4.188)) * radius;

    float d1 = length(uv - src1);
    float d2 = length(uv - src2);
    float d3 = length(uv - src3);

    float w1 = sin(d1 * 22.0 - t * 2.2);
    float w2 = sin(d2 * 32.0 - t * 5.5);
    float w3 = sin(d3 * 17.0 - t * 3.1 + sin(d3 * 6.0 + t) * 0.6);

    vec3 amber   = vec3(1.0, 0.62, 0.18);
    vec3 crimson = vec3(1.0, 0.16, 0.22);
    vec3 cyan    = vec3(0.28, 0.85, 1.0);

    float i1 = exp(-d1 * 1.3) * (0.65 + 0.35 * w1);
    float i2 = exp(-d2 * 1.4) * (0.55 + 0.45 * w2);
    float i3 = exp(-d3 * 1.2) * (0.65 + 0.35 * w3);

    vec3 col = vec3(0.0);
    col += amber   * i1 * 1.6;
    col += crimson * i2 * 1.7;
    col += cyan    * i3 * 1.5;

    col += amber   * (0.5 + 0.5 * w1) * 0.12;
    col += crimson * (0.5 + 0.5 * w2) * 0.12;
    col += cyan    * (0.5 + 0.5 * w3) * 0.12;

    float interference = w1 * w2 * w3;
    col += vec3(0.9, 0.8, 1.0) * abs(interference) * 0.18 * convergence;

    float centerD = length(uv);
    float heart = pow(sin(cycle * PI), 14.0);
    float pulse = exp(-centerD * 4.5) * heart * 3.2;
    col += vec3(1.0, 0.98, 0.95) * pulse;

    float halo = exp(-abs(centerD - 0.18 * heart) * 16.0) * heart * 1.4;
    col += vec3(1.0, 0.92, 0.82) * halo;

    float disperse = max(0.0, cycle - 0.32);
    for (int k = 0; k < 5; k++) {
        float fk = float(k);
        float rPhase = disperse - fk * 0.085;
        if (rPhase > 0.0) {
            float rRadius = rPhase * 2.6;
            float rD = abs(centerD - rRadius);
            float rIntensity = exp(-rD * 22.0) * exp(-rPhase * 1.7);
            vec3 memColor = mix(
                mix(amber, crimson, 0.4 + 0.4 * sin(t * 0.3 + fk * 1.7)),
                cyan,
                fk / 5.0 + 0.15 * sin(t * 0.4 + fk)
            );
            col += memColor * rIntensity * 0.7;
        }
    }

    float shimmer = sin(d1 * 11.0 + d2 * 13.0 + d3 * 9.0 - t * 3.5);
    col += vec3(0.12, 0.08, 0.18) * shimmer * (1.0 - convergence) * 0.35;

    col += vec3(0.025, 0.015, 0.045);

    col *= 1.0 - length(uv) * 0.28;

    col = col / (1.0 + col);
    col = pow(col, vec3(0.86));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 76;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 5.5, wet: 0.32 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.005, release: 0.2 }).connect(masterReverb);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.045,
    octaves: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.45, sustain: 0, release: 0.12 }
  }).toDestination();
  kick.volume.value = -4;

  const heartLoop = new Tone.Loop((time) => {
    kick.triggerAttackRelease("C1", "4n", time + H(2), 1.0);
    kick.triggerAttackRelease("C1", "8n", time + (60 / bpm) * 0.42 + H(2), 0.55);
  }, "1m").start(0);

  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 900, Q: 0.7 }).connect(masterComp);
  const amberChorus = new Tone.Chorus({ frequency: 0.35, delayTime: 4, depth: 0.55, wet: 0.45 }).connect(amberFilter);
  amberChorus.start();
  const amber = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.7, release: 2.4 }
  }).connect(amberChorus);
  amber.volume.value = -11;

  const amberChords = [
    ["A3", "E4"],
    ["A3", "E4"],
    ["G3", "D4"],
    ["F3", "C4"]
  ];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    amber.triggerAttackRelease(amberChords[amberIdx % amberChords.length], "1m", time + H(15), 0.5);
    amberIdx++;
  }, "1m").start(0);

  const crimsonDist = new Tone.Distortion({ distortion: 0.38, wet: 0.32 }).connect(masterComp);
  const crimsonFilter = new Tone.Filter({ type: "lowpass", frequency: 380, Q: 2.2 }).connect(crimsonDist);
  const crimson = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.18, sustain: 0.2, release: 0.1 },
    filterEnvelope: { attack: 0.01, decay: 0.22, sustain: 0.3, baseFrequency: 100, octaves: 2 }
  }).connect(crimsonFilter);
  crimson.volume.value = -9;

  const crimsonNotes = ["A1", "A1", "G1", "A1", "F1", "G1", "A1", "E1"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 15) {
      const pattern = [1, 0, 1, 1, 0, 1, 0, 1];
      const sub = crimsonIdx % 8;
      if (pattern[sub]) {
        crimson.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "8n", time + H(6), 0.85);
      }
    }
    crimsonIdx++;
  }, "8n").start(0);

  const cyanDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.48, wet: 0.5 }).connect(masterComp);
  const cyanReverb = new Tone.Reverb({ decay: 7, wet: 0.65 }).connect(cyanDelay);
  await cyanReverb.generate();
  const cyan = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 1.8, sustain: 0, release: 1.2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.4 }
  }).connect(cyanReverb);
  cyan.volume.value = -13;

  const cyanNotes = ["E5", "G5", "A5", "B5", "E6", "B5", "A5", "G5", "E5", "D5"];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 16) {
      const pattern = [1, 0, 0, 1, 0, 1, 0, 0];
      const sub = cyanIdx % 8;
      if (pattern[sub]) {
        const vel = 0.4 + Math.random() * 0.25;
        cyan.triggerAttackRelease(cyanNotes[cyanIdx % cyanNotes.length], "8n", time + H(10), vel);
      }
    }
    cyanIdx++;
  }, "8n").start(0);

  const whiteReverb = new Tone.Reverb({ decay: 9, wet: 0.7 }).connect(masterComp);
  await whiteReverb.generate();
  const white = new Tone.FMSynth({
    harmonicity: 2,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 3, sustain: 0, release: 2.4 },
    modulation: { type: "sine" }
  }).connect(whiteReverb);
  white.volume.value = -7;

  let whiteIdx = 0;
  const whiteLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 14) {
      const pickNotes = ["A4", "E5", "A5", "E5"];
      white.triggerAttackRelease(pickNotes[whiteIdx % pickNotes.length], "2n", time + H(5), 0.78);
      whiteIdx++;
    }
  }, "2m").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 900, Q: 4 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.6, decay: 1.6, sustain: 0, release: 1 }
  }).connect(noiseFilter);
  noise.volume.value = -22;

  Tone.Transport.schedule((time) => {
    crimsonFilter.frequency.linearRampToValueAtTime(2400, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    crimsonFilter.frequency.linearRampToValueAtTime(380, time + 4 * (60 / bpm) * 4);
  }, "13:0:0");

  Tone.Transport.schedule((time) => {
    noise.triggerAttackRelease(2.5, time);
  }, "6:2:0");

  window.toneJsInstruments = { kick, amber, crimson, cyan, white, noise };
  window.toneJsParts = { heartLoop, amberLoop, crimsonLoop, cyanLoop, whiteLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
