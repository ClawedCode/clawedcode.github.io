<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float n(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f *= f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1, 0)), f.x),
               mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y);
}

float fb(vec2 p) {
    float v = 0.0, a = 0.5;
    for (float i = 0.0; i < 3.0; i++) { v += a * n(p); p *= 2.01; a *= 0.5; }
    return v;
}

float sw(float x, float id, float t) {
    return 0.12 * sin(x * 2.5 + t * 0.31416 + id * 3.7)
         + 0.06 * cos(x * 4.0 + t * 0.20944 + id * 5.2)
         + 0.04 * sin(x * 1.5 + t * 0.10472 + id * 2.1);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    vec3 c = vec3(0.008, 0.01, 0.03);

    float bp = t * 5.027;
    float bt = pow(max(sin(bp), 0.0), 8.0);
    float bs = pow(max(sin(bp * 0.5), 0.0), 4.0);

    vec2 gu = uv * 7.0;
    float ri = floor(gu.y);
    float gt = step(0.82, h(vec2(ri * 0.13, floor(t * 5.0))));
    float hd = gt * (h(vec2(ri, floor(t * 8.0))) - 0.5) * 0.6;
    vec2 gs = vec2(gu.x + hd * 7.0, gu.y);
    vec2 gf = fract(gs) - 0.5;
    float gr = max(smoothstep(0.02, 0.0, abs(gf.y)), smoothstep(0.02, 0.0, abs(gf.x)));
    c += mix(vec3(0.03, 0.04, 0.08), vec3(0.06, 0.08, 0.15), bt) * gr * (0.12 + 0.2 * bt + 0.1 * bs);

    vec2 ni = floor(gs + 0.5);
    c += vec3(0.1, 0.12, 0.2) * step(0.88, h(ni + floor(t * 1.5))) * exp(-dot(gf, gf) * 200.0) * (0.5 + bt);

    float cv = smoothstep(-0.5, 0.5, sin(t * 0.31416));
    float sp = mix(0.35, 0.02, cv);

    for (float s = 0.0; s < 3.0; s++) {
        float bo = s < 0.5 ? sp : (s < 1.5 ? 0.0 : -sp);
        float sy = bo + sw(uv.x, s, t);
        float d = abs(uv.y - sy), w = 0.03 + 0.015 * cv;
        float core = exp(-d * d / (w * w));
        float glow = exp(-d * 5.0) * 0.35;
        float fl = fb(vec2(uv.x * 8.0 - t * (2.5 + s * 0.7) + s * 13.0, (uv.y - sy) * 20.0 + s * 9.0));
        float it = core * (0.35 + 0.65 * fl) + glow;
        it *= 0.55 + 0.45 * pow(max(sin(bp + s * 0.4), 0.0), 6.0);
        vec3 sc = s < 0.5 ? vec3(0.12, 0.4, 1.0) : (s < 1.5 ? vec3(1.0, 0.3, 0.04) : vec3(0.5, 0.22, 0.85));
        c += sc * it;
    }

    for (float i = 0.0; i < 30.0; i++) {
        float s = mod(i, 3.0), si = floor(s);
        float h1 = h(vec2(i * 1.731, 0.5)), h2 = h(vec2(i * 2.531, 1.5));
        float px = mod(h2 * 5.0 + t * (0.6 + h1 * 0.5), 2.2) - 1.1;
        float bo = si < 0.5 ? sp : (si < 1.5 ? 0.0 : -sp);
        float py = bo + sw(px, si, t) + (h(vec2(i, 3.0)) - 0.5) * 0.03;
        float pd = length(uv - vec2(px, py));
        float br = exp(-pd * pd * 4000.0) * 1.2 * (0.4 + 0.6 * abs(sin(t * 6.28318 + i * 2.7)));
        vec3 pc = si < 0.5 ? vec3(0.5, 0.75, 1.0) : (si < 1.5 ? vec3(1.0, 0.6, 0.25) : vec3(0.75, 0.5, 1.0));
        c += pc * br;
    }

    if (cv > 0.6) {
        float cy = 0.1 * sin(t * 0.62832);
        vec2 cp = uv - vec2(0.0, cy);
        c += vec3(0.5, 0.35, 0.8) * exp(-dot(cp, cp) * 15.0) * (cv - 0.6) * 2.5 * 0.4 * (0.7 + 0.3 * bt);
    }

    c *= 1.0 - dot(uv * 0.7, uv * 0.7);
    c *= 0.96 + 0.04 * sin(gl_FragCoord.y * 2.5);
    gl_FragColor = vec4(c, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 76;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60.0 / 19.0;

  const rev = new Tone.Reverb({ decay: 3.5, wet: 0.2 }).toDestination();
  await rev.generate();
  const dly = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.15 }).connect(rev);

  const subFilt = new Tone.Filter({ type: "lowpass", frequency: 180, rolloff: -24 }).toDestination();
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.3, sustain: 0.9, release: 1.5 },
    filterEnvelope: { attack: 0.5, decay: 0.3, sustain: 1.0, baseFrequency: 50, octaves: 1 }
  }).connect(subFilt);

  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    const note = bar < 4 ? "C1" : bar < 8 ? "A#0" : bar < 12 ? "G#0" : bar < 16 ? "G0" : "C1";
    sub.triggerAttackRelease(note, "1n", time, 0.55);
  }, "1n").start(0);

  const arpFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 2.5 }).connect(dly);
  const arpDist = new Tone.Distortion({ distortion: 0.12, wet: 0.15 }).connect(arpFilt);
  const arp = new Tone.Synth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.1, sustain: 0, release: 0.06 }
  }).connect(arpDist);

  const scales = [[48,51,55,60,55,51],[46,49,53,58,53,49],[44,47,51,56,51,47],[43,46,50,55,50,46]];
  let aIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    if (bar < 3 || bar >= 16) { aIdx++; return; }
    const sec = Math.floor(bar / 4) % 4;
    const sc = scales[sec];
    const progress = (bar - 3) / 13.0;
    arpFilt.frequency.value = 500 + 3500 * Math.sin(progress * Math.PI);
    arp.triggerAttackRelease(
      Tone.Frequency(sc[aIdx % sc.length], "midi"), "16n", time, 0.3 + 0.15 * Math.sin(bar * 0.8)
    );
    aIdx++;
  }, "8n").start(0);

  const bellRev = new Tone.Reverb({ decay: 5.0, wet: 0.55 }).toDestination();
  await bellRev.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.0, sustain: 0.05, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0.1, release: 0.3 }
  }).connect(bellRev);

  const bellNotes = [72, 67, 76, 74, 70, 79, 77, 72, 65, 74, 70, 67];
  let bIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    const density = bar < 2 ? 6 : bar < 6 ? 3 : bar < 12 ? 1 : bar < 16 ? 4 : 8;
    if (bIdx % density !== 0 || bar >= 17) { bIdx++; return; }
    bell.triggerAttackRelease(
      Tone.Frequency(bellNotes[bIdx % bellNotes.length], "midi"), "4n", time, 0.2 + 0.08 * Math.random()
    );
    bIdx++;
  }, "4n").start(0);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04, octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.03 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    if (bar >= 2 && bar < 17) kick.triggerAttackRelease("C1", "8n", time, 0.8);
  }, "2n").start(0);

  const padCh = new Tone.Chorus({ frequency: 0.2, delayTime: 4, depth: 0.5, wet: 0.35 }).connect(rev);
  padCh.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 0.4, sustain: 0.35, release: 2.0 }
  }).connect(padCh);

  const chords = [["C3","G3","C4"],["A#2","F3","A#3"],["G#2","D#3","G#3"],["G2","D3","G3"]];
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    if (bar >= 17) return;
    pad.triggerAttackRelease(chords[Math.floor(bar / 4) % 4], "1n", time, bar >= 14 ? 0.08 : 0.14);
  }, "1n").start(0);

  const noiseF = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(rev);
  const glitch = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.01 }
  }).connect(noiseF);

  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    if (bar >= 4 && bar < 14 && Math.random() > 0.7)
      glitch.triggerAttackRelease("32n", time, 0.15 + 0.1 * Math.random());
  }, "16n").start(0);

  const hat = new Tone.MetalSynth({
    frequency: 400,
    envelope: { attack: 0.001, decay: 0.06, release: 0.02 },
    harmonicity: 5.1, modulationIndex: 28, resonance: 4500
  }).connect(rev);

  let hc = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 19;
    if (bar >= 6 && bar < 13 && [0,0,1,0,0,1,0,1][hc % 8])
      hat.triggerAttackRelease("32n", time, 0.15 + 0.08 * Math.random());
    hc++;
  }, "8n").start(0);

  window.toneJsInstruments = { sub, arp, bell, kick, pad, glitch, hat };
  window.toneJsParts = { subLoop, arpLoop, bellLoop, kickLoop, padLoop, glitchLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
