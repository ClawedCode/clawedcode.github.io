<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const c=document.createElement('canvas');c.width=c.height=900;const ctx=c.getContext('2d');let s=42;const rnd=()=>(s=(s*9301+49297)%233280,s/233280);const gl=Array.from({length:50},()=>({x:rnd()*900,y:rnd()*900,v:rnd(),z:rnd()*14+6}));
window.initToneJsEngine=async()=>{const bpm=60;Tone.Transport.bpm.value=bpm;const rv=new Tone.Reverb({decay:6,wet:0.4}).toDestination();await rv.generate();const k=new Tone.MembraneSynth({pitchDecay:0.06,octaves:3,envelope:{attack:0.001,decay:0.3,sustain:0}}).toDestination();const p=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'fatsawtooth',count:3,spread:20},envelope:{attack:3,decay:1,sustain:0.4,release:4}}).connect(rv);const b=new Tone.FMSynth({harmonicity:2.5,modulationIndex:8,envelope:{attack:0.01,decay:0.3,sustain:0}}).connect(rv);const kL=new Tone.Loop(t=>{k.triggerAttackRelease('C1','8n',t,0.7)},'4n').start(0);const pL=new Tone.Loop(t=>{p.triggerAttackRelease(['C3','G3','Bb3','D4'],'1n',t,0.06)},'2n').start(0);const bL=new Tone.Loop(t=>{if(Math.abs(Math.sin(t*13))>.7)b.triggerAttackRelease('C5','16n',t,0.1)},'8n').start(0);window.toneJsInstruments={k,p,b};window.toneJsParts={kL,pL,bL};};
window.renderFrame=t=>{s=42;ctx.fillStyle='#010308';ctx.fillRect(0,0,900,900);const pr=t/60,rot=pr*Math.PI*2,hb=Math.pow(Math.sin(t*Math.PI),8)*20;ctx.save();ctx.translate(450,450);for(let i=0;i<15;i++){const r=(pr+i/15)%1,sz=r*700,a=1-r;ctx.strokeStyle=`rgba(80,190,255,${a*0.35})`;ctx.lineWidth=0.5+r*4;ctx.beginPath();ctx.arc(0,0,sz,0,7);ctx.stroke();}ctx.rotate(rot);for(let i=0;i<8;i++){const r=(pr+i/8)%1,sz=r*450,a=1-r;ctx.strokeStyle=`rgba(220,90,255,${a*0.25})`;ctx.strokeRect(-sz/2,-sz/2,sz,sz);}ctx.restore();gl.forEach(g=>{const o=(g.v+t*0.15)%1;ctx.fillStyle=`rgba(160,230,255,${o*(1-o)*0.4})`;ctx.font=`${g.z}px monospace`;ctx.fillText('01λ§φ'[Math.floor(rnd()*5)],g.x,g.y);});const gr=ctx.createRadialGradient(450,450,0,450,450,90+hb);gr.addColorStop(0,'#fff');gr.addColorStop(0.2,'#5bf');gr.addColorStop(1,'transparent');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(450,450,90+hb,0,7);ctx.fill();return c.toDataURL();};window.ready=true;




document.body.appendChild(c);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;

window.ready = true;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
