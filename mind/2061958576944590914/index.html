<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(float n){return fract(sin(n)*43758.5453);}
float sdBox(vec3 p,vec3 b){vec3 d=abs(p)-b;return min(max(d.x,max(d.y,d.z)),0.0)+length(max(d,0.0));}
float sdOct(vec3 p,float s){p=abs(p);return(p.x+p.y+p.z-s)*0.57735;}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}

float heal,gt;

float map(vec3 p){
    float d=1e10;
    for(float i=0.0;i<10.0;i++){
        vec3 dir=normalize(vec3(sin(i*2.1+0.5),cos(i*1.7),sin(i*3.3+1.0)));
        float disp=(1.0-heal)*1.8*(0.4+0.6*hash(i+3.0));
        vec3 fp=p-dir*disp;
        fp.xy=rot(i*0.7+gt*0.15)*fp.xy;
        fp.yz=rot(i*1.1+gt*0.08)*fp.yz;
        float sz=0.04+0.07*hash(i+7.0);
        d=min(d,sdBox(fp,vec3(sz,sz*2.8,sz*0.5)));
    }
    vec3 q=p;
    q.xy=rot(gt*0.1)*q.xy;
    q.yz=rot(gt*0.07)*q.yz;
    float bR=0.15+0.45*heal;
    float blob=length(q)-bR+0.12*heal*sin(q.x*5.0+gt)*sin(q.y*4.0-gt*0.7)*sin(q.z*6.0+gt*0.5);
    float evolved=smin(sdOct(q,0.2+0.45*heal),blob,0.2+0.1*heal);
    d=smin(d,evolved,0.1+0.4*heal);
    return d;
}

vec3 norm(vec3 p){vec2 e=vec2(0.001,0.0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    gt=mod(iTime,60.0);
    heal=smoothstep(8.0,48.0,gt);
    float ca=gt*6.28318/60.0;
    vec3 ro=vec3(3.0*sin(ca),1.0+0.4*sin(ca*2.0),3.0*cos(ca));
    vec3 fwd=normalize(-ro);
    vec3 rgt=normalize(cross(fwd,vec3(0,1,0)));
    vec3 up=cross(rgt,fwd);
    vec3 rd=normalize(uv.x*rgt+uv.y*up+1.5*fwd);
    vec3 col=vec3(0.012,0.006,0.022);
    float rl=length(uv);
    float wf=gt*0.2;
    for(float i=0.0;i<6.0;i++){
        float wr=mod(wf-i*0.35,2.8);
        float ring=abs(rl-wr);
        float inten=exp(-ring*20.0)*smoothstep(0.0,0.15,wr)*exp(-wr*0.6);
        col+=vec3(1.0,0.72,0.2)*inten*0.4;
    }
    float d=0.2;
    for(float i=0.0;i<64.0;i++){
        float h=map(ro+rd*d);
        if(h<0.001||d>15.0)break;
        d+=h;
    }
    if(d<15.0){
        vec3 p=ro+rd*d;
        vec3 n=norm(p);
        vec3 ldir=normalize(vec3(1.0,2.0,0.5));
        float diff=max(dot(n,ldir),0.0);
        float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
        float wire=min(abs(fract(p.x*4.0+0.5)-0.5),min(abs(fract(p.y*4.0+0.5)-0.5),abs(fract(p.z*4.0+0.5)-0.5)));
        float wg=smoothstep(0.04,0.0,wire)*(1.0-heal*0.85);
        vec3 cy=vec3(0.15,0.78,0.92);
        vec3 mg=vec3(0.88,0.28,0.68);
        vec3 am=vec3(1.0,0.72,0.22);
        vec3 sc=mix(cy,mg,heal)*(diff*0.65+0.25);
        sc+=fres*am*0.35;
        sc+=cy*wg*0.7;
        float pd=length(p);
        for(float j=0.0;j<5.0;j++){
            float wr2=mod(wf-j*0.35,3.5);
            sc+=am*exp(-abs(pd-wr2)*12.0)*0.45;
        }
        col=mix(col,sc,exp(-d*0.1));
    }
    col*=1.0-0.3*length(uv);
    col=pow(col,vec3(0.9));
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 65;
  Tone.Transport.bpm.value = bpm;
  const reverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);
  const purr = new Tone.MembraneSynth({
    pitchDecay: 0.08, octaves: 2,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.9, sustain: 0.15, release: 0.5 }
  }).toDestination();
  purr.volume.value = -6;
  const purrNotes = ["C1", "C1", "G0", "C1"];
  let purrIdx = 0;
  const purrLoop = new Tone.Loop((time) => {
    purr.triggerAttackRelease(purrNotes[purrIdx % purrNotes.length], "2n", time, 0.5 + Math.random() * 0.15);
    purrIdx++;
  }, "2n").start(0);
  const padFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 0.7 }).connect(reverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 0.4, sustain: 0.6, release: 2.5 }
  }).connect(padFilt);
  pad.volume.value = -14;
  const chords = [
    ["C3", "Eb3", "G3", "Bb3"],
    ["Ab2", "C3", "Eb3", "G3"],
    ["Bb2", "D3", "F3", "Ab3"],
    ["G2", "Bb2", "D3", "F3"]
  ];
  let cIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 13) {
      pad.triggerAttackRelease(chords[cIdx % chords.length], "1n", time, 0.25);
      cIdx++;
    }
  }, "1n").start(0);
  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(1600, time + 6 * (60 / bpm) * 4);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    padFilt.frequency.linearRampToValueAtTime(500, time + 3 * (60 / bpm) * 4);
  }, "11:0:0");
  const bell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 2.5, sustain: 0, release: 1.0 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -18;
  const bellNotes = ["G4", "Eb5", "Bb4", "C5", "F4", "D5", "Ab4"];
  let bIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 12 && Math.random() > 0.3) {
      bell.triggerAttackRelease(bellNotes[bIdx % bellNotes.length], "4n", time, 0.25 + Math.random() * 0.2);
      bIdx++;
    }
  }, "2n").start(0);
  window.toneJsInstruments = { purr, pad, bell };
  window.toneJsParts = { purrLoop, padLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
