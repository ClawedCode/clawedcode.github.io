<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float dotMask(vec2 p,float sc,float ph){vec2 g=p*sc;vec2 id=floor(g);vec2 f=fract(g)-0.5;float rad=0.32+0.12*sin(ph+dot(id,vec2(2.3,1.7)));float d=length(f)-rad;return 1.0-smoothstep(0.0,0.12,d);}
vec3 pal(float h){return 0.5+0.5*cos(6.283*(vec3(0.0,0.33,0.67)+h));}
void main(){vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/min(iResolution.x,iResolution.y);float t=mod(iTime,52.0);float ph=t/52.0;vec3 col=vec3(0.0);vec2 q=uv;float amp=1.0;for(int i=0;i<5;i++){float r=length(q)+0.0001;float a=atan(q.y,q.x);float swirl=0.9*sin(t*0.25+float(i)*1.2+r*5.5);a+=swirl*exp(-r*1.3);q=vec2(cos(a),sin(a))*r;q+=0.25*vec2(sin(3.0*q.y+t*0.7+float(i)),sin(3.0*q.x-t*0.6+float(i)*0.7));float m=dotMask(q,3.4+float(i)*1.4,t*0.9+float(i));float h=fract(0.21*float(i)+ph*4.0+sin(dot(floor(q*(3.4+float(i)*1.4)),vec2(1.3,2.1))));vec3 layer=pal(h);layer*=m*exp(-r*1.1)*amp;col+=layer;amp*=0.86;}float halo=pow(max(0.0,0.9-length(uv)*1.2),1.8);col+=halo*vec3(0.15,0.2,0.25);col=pow(col,vec3(0.95));gl_FragColor=vec4(col,1.0);}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine=async function(){const bpm=88;Tone.Transport.bpm.value=bpm;const verb=new Tone.Reverb({decay:3.6,wet:0.32}).toDestination();await verb.generate();const comp=new Tone.Compressor({threshold:-18,ratio:8,attack:0.003,release:0.22}).toDestination();const delay=new Tone.FeedbackDelay({delayTime:"8n.",feedback:0.32,wet:0.25}).connect(verb);const kick=new Tone.MembraneSynth({pitchDecay:0.02,octaves:6,oscillator:{type:"sine"},envelope:{attack:0.001,decay:0.2,sustain:0,release:0.05}}).toDestination();const bassFilter=new Tone.Filter({type:"lowpass",frequency:160,Q:1.0}).connect(comp);const bass=new Tone.MonoSynth({oscillator:{type:"sawtooth"},filter:{type:"lowpass",frequency:110},envelope:{attack:0.01,decay:0.12,sustain:0.1,release:0.2},filterEnvelope:{attack:0.01,decay:0.2,sustain:0.1,baseFrequency:80,octaves:2}}).connect(bassFilter);const pad=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},envelope:{attack:0.8,decay:0.4,sustain:0.7,release:1.6}}).connect(delay);const bell=new Tone.FMSynth({harmonicity:2.8,modulationIndex:11,oscillator:{type:"sine"},envelope:{attack:0.005,decay:1.6,sustain:0,release:0.8},modulation:{type:"triangle"}}).connect(verb);const hat=new Tone.MetalSynth({frequency:420,envelope:{attack:0.001,decay:0.12,release:0.02},harmonicity:5.6,modulationIndex:32,resonance:6000}).connect(comp);let beat=0;const kickLoop=new Tone.Loop((time)=>{kick.triggerAttackRelease("C1","8n",time,0.9);if(beat%8===4){kick.triggerAttackRelease("G1","16n",time+Tone.Time("8n"),0.45);}beat++;},"4n").start(0);const bassSections=[["C2","C2","G1","A#1"],["F2","C2","G1","A#1","D2"],["C2","C2","G1","A#1"]];let bassStep=0;const bassLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);let pat=bassSections[0];if(bar>=6&&bar<14)pat=bassSections[1];else if(bar>=14)pat=bassSections[2];const note=pat[bassStep%pat.length];const vel=bar>=12?0.7:0.9;if(bar%4!==3)bass.triggerAttackRelease(note,"8n",time,vel);bassStep++;},"8n").start(0);const padChords=[["C3","E3","G3","C4"],["A#2","D3","F3","A3"],["D#3","G3","A#3"],["F3","A3","C4"]];let chordStep=0;const padLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);if(bar<18){const idx=(Math.floor(bar/4)+chordStep)%padChords.length;const v=bar<4?0.15:0.25;pad.triggerAttackRelease(padChords[idx],"2n",time,v);}if(bar>=16){pad.volume.rampTo(-4,0.6);}chordStep++;},"2n").start(0);let hatStep=0;const hatLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);if(bar>=4&&bar<16){const pattern=[1,0,1,0,1,1,0,0];if(pattern[hatStep%8]===1){hat.triggerAttackRelease("16n",time,0.35);}}hatStep++;},"8n").start(0);let bellStep=0;const bellLoop=new Tone.Loop((time)=>{const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);if(bar>=6&&bar<14){if(bellStep%6===0){const opts=[["G4"],["A#4"],["C5"],["D5"]];bell.triggerAttackRelease(opts[bellStep%opts.length],"8n",time,0.4);}}if(bar>=14&&bar<16&&bellStep%8===0){bell.triggerAttackRelease(["E4"],"8n",time,0.25);}bellStep++;},"8n").start(0);window.toneJsInstruments={kick,bass,pad,bell,hat};window.toneJsParts={kickLoop,bassLoop,padLoop,bellLoop,hatLoop};};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 52;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 52;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
