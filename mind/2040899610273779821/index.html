<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h21(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

vec2 h22(vec2 p) {
    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);
}

float nse(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x),
               mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i = 0; i < 3; i++) {
        v += a * nse(p);
        p = m * p * 2.0;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;

    float em = smoothstep(0.08, 0.5, ph) * (1.0 - smoothstep(0.83, 1.0, ph));
    float wm = smoothstep(0.45, 0.72, ph) * (1.0 - smoothstep(0.78, 1.0, ph));

    float sn = nse(uv * 25.0 + t * 40.0) * 0.5 + nse(uv * 15.0 - t * 30.0) * 0.5;

    float waves = 0.0;
    for(int i = 0; i < 12; i++) {
        float fi = float(i);
        float golden = fi * 1.618;
        vec2 src = vec2(sin(golden * 6.28) * 0.5, cos(golden * 6.28) * 0.5);
        float d = length(uv - src);
        float freq = 10.0 + fi * 3.0;
        float spd = 1.5 + fi * 0.2;
        waves += sin(d * freq - t * spd + fi * 0.8) / 12.0;
    }
    waves = waves * 0.5 + 0.5;

    vec2 w1 = vec2(fbm(uv * 3.5 + t * 0.04 + 10.0), fbm(uv * 3.5 + t * 0.03 + 20.0));
    vec2 w2 = vec2(fbm((uv + w1 * 0.3) * 4.0 + t * 0.02), fbm((uv + w1 * 0.3) * 4.0 + 30.0 - t * 0.025));
    float organic = fbm((uv + w1 * 0.35 + w2 * 0.2) * 5.0 + t * 0.015);

    float signal = waves * 0.55 + organic * 0.45;
    float field = mix(sn, signal, em);

    float pBright = 0.0;
    vec3 pCA = vec3(0.0);
    float sc = 22.0;
    vec2 gid = floor(uv * sc);
    vec2 guv = fract(uv * sc);

    for(int x = -1; x <= 1; x++) {
        for(int y = -1; y <= 1; y++) {
            vec2 nb = vec2(float(x), float(y));
            vec2 id = gid + nb;
            vec2 rnd = h22(id);

            vec2 cp = rnd * 0.8 + 0.1;
            cp += vec2(
                sin(t * (5.0 + rnd.x * 12.0) + rnd.y * 40.0),
                cos(t * (6.0 + rnd.y * 10.0) + rnd.x * 35.0)
            ) * 0.15 * (1.0 - em);

            vec2 wpos = (id + 0.5) / sc;
            float lw = sin(length(wpos) * 12.0 - t * 1.5) * 0.5
                      + sin(atan(wpos.y, wpos.x) * 3.0 + t * 0.5) * 0.3;
            vec2 sp = vec2(0.5 + lw * 0.1, 0.5 + sin(lw * 3.14) * 0.07);

            vec2 pos = mix(cp, sp, em);
            float d = length(guv - pos - nb);

            float res = lw * 0.5 + 0.5;
            float glow = (0.003 + 0.005 * res * em) / (d * d + 0.004);

            float hue = rnd.x * 6.28 + res * em * 3.0 + t * 0.08;
            vec3 pc = mix(
                vec3(0.55 + rnd.y * 0.2),
                vec3(0.5 + 0.4 * sin(hue), 0.5 + 0.4 * sin(hue + 2.094), 0.5 + 0.4 * sin(hue + 4.189)),
                em
            );

            pBright += glow;
            pCA += pc * glow;
        }
    }

    pCA = pCA / (pBright + 0.001);

    float bar1 = smoothstep(0.025, 0.0, abs(uv.y - sin(t * 0.7) * 0.35)) * (1.0 - em) * 0.5;
    float bar2 = smoothstep(0.018, 0.0, abs(uv.y + cos(t * 0.5) * 0.3)) * (1.0 - em) * 0.3;

    vec3 gray = vec3(0.3 + sn * 0.35);

    vec3 iris = vec3(
        0.5 + 0.45 * sin(field * 14.0 + t * 0.3),
        0.5 + 0.45 * sin(field * 14.0 + t * 0.3 + 2.094),
        0.5 + 0.45 * sin(field * 14.0 + t * 0.3 + 4.189)
    );

    vec3 amber = vec3(0.95, 0.72, 0.35) * (0.15 + field * 0.85);
    amber += vec3(0.12, 0.04, 0.0) * smoothstep(0.5, 0.8, field);

    vec3 col = gray;
    col = mix(col, iris, smoothstep(0.1, 0.35, ph));
    col = mix(col, amber, wm);
    col = mix(col, gray, smoothstep(0.83, 1.0, ph));

    col += pCA * min(pBright, 2.5) * 0.18;
    col += vec3(0.4, 0.6, 0.8) * (bar1 + bar2);

    col *= smoothstep(1.1, 0.15, length(uv * 0.7));
    col = col / (col + 0.5) * 1.5;

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const reverb = new Tone.Reverb({ decay: 5.0, wet: 0.45 }).toDestination();
  await reverb.generate();
  const dly = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.25, wet: 0.2 }).connect(reverb);
  const lpf = new Tone.Filter({ type: "lowpass", frequency: 600 }).connect(dly);

  const noiseBP = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 0.8 }).connect(reverb);
  const noise = new Tone.Noise({ type: "brown", volume: -8 }).connect(noiseBP);
  noise.start();

  Tone.Transport.schedule((time) => {
    noise.volume.linearRampToValueAtTime(-35, time + 25);
  }, "0:0:0");
  Tone.Transport.schedule((time) => {
    noiseBP.frequency.linearRampToValueAtTime(400, time + 18);
  }, "2:0:0");

  const seek1 = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.6, release: 1.5 }
  }).connect(reverb);
  const seek2 = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.6, release: 1.5 }
  }).connect(reverb);

  let seekStep = 0;
  const seekLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 8) {
      const progress = (bar - 3) / 5.0;
      const detune = (1.0 - progress) * 350;
      seek1.detune.value = detune * Math.sin(seekStep * 0.7);
      seek1.triggerAttackRelease("A4", "2n", time, 0.06 + progress * 0.1);
      seek2.detune.value = -detune * Math.cos(seekStep * 0.9);
      seek2.triggerAttackRelease("E4", "2n", time, 0.05 + progress * 0.08);
      seekStep++;
    }
  }, "2n").start(0);

  const padCh = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.5, wet: 0.3 }).connect(lpf);
  padCh.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.0 }
  }).connect(padCh);

  const chords = [
    ["A3", "E4", "A4"],
    ["F3", "C4", "A4"],
    ["D3", "A3", "F4"],
    ["E3", "B3", "G4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 14) {
      const vol = Math.min((bar - 6) * 0.035, 0.22);
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, vol);
      chordIdx++;
    }
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    lpf.frequency.linearRampToValueAtTime(2400, time + 12);
  }, "5:0:0");

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
  }).connect(dly);

  const bellNotes = ["A5", "E5", "C5", "A4", "F5", "G5", "E5", "B4"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 8 && bar < 13) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.12);
      bellIdx++;
    }
  }, "2n").start(0);

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.3, decay: 0.4, sustain: 0.3, release: 0.8 }
  }).connect(reverb);

  const subNotes = ["A1", "A1", "F1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 7 && bar < 13) {
      sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1n", time, 0.2);
      subIdx++;
    }
  }, "1n").start(0);

  Tone.Transport.schedule((time) => {
    lpf.frequency.linearRampToValueAtTime(600, time + 8);
    noise.volume.linearRampToValueAtTime(-8, time + 8);
    noiseBP.frequency.linearRampToValueAtTime(1200, time + 8);
  }, "13:0:0");

  window.toneJsInstruments = { noise, seek1, seek2, pad, bell, sub };
  window.toneJsParts = { seekLoop, padLoop, bellLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
