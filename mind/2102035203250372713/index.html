<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
const float DURATION = 42.0;
const float PI = 3.14159265359;
const float TAU = 6.28318530718;
float hash31(vec3 p){
  p=fract(p*.1031+14144.483);
  p+=dot(p,p.yzx+33.33);
  return fract((p.x+p.y)*p.z);
}
float noise3(vec3 p){
  vec3 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float n000=hash31(i);
  float n100=hash31(i+vec3(1.0,0.0,0.0));
  float n010=hash31(i+vec3(0.0,1.0,0.0));
  float n110=hash31(i+vec3(1.0,1.0,0.0));
  float n001=hash31(i+vec3(0.0,0.0,1.0));
  float n101=hash31(i+vec3(1.0,0.0,1.0));
  float n011=hash31(i+vec3(0.0,1.0,1.0));
  float n111=hash31(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm(vec3 p){
  float v=.5*noise3(p);
  v+=.25*noise3(p*2.03+7.1);
  v+=.125*noise3(p*4.01+13.7);
  return v;
}
float smin(float a,float b,float k){
  float h=clamp(.5+.5*(b-a)/k,0.0,1.0);
  return mix(b,a,h)-k*h*(1.0-h);
}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){
  vec3 pa=p-a,ba=b-a;
  float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
  return length(pa-ba*h)-r;
}
float sdRoundBox(vec3 p,vec3 b,float r){
  vec3 q=abs(p)-b;
  return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r;
}
float sdEllipsoid(vec3 p,vec3 r){
  float k0=length(p/r);
  float k1=max(length(p/(r*r)),.0001);
  return k0*(k0-1.0)/k1;
}
float mushroom(vec3 p,float s,float ph,float tau){
  vec3 q=p;
  q.x+=.08*s*sin(q.y*3.1+tau*2.0+ph);
  q.z+=.06*s*cos(q.y*2.7-tau*3.0+ph*1.7);
  float br=1.0+.055*sin(tau*3.0+ph);
  float st=sdCapsule(q,vec3(0.0),vec3(.05*s,.68*s,-.03*s),.105*s*(1.0-.16*q.y/s));
  vec3 c=q-vec3(.05*s,.78*s,-.03*s);
  float cap=sdEllipsoid(c,vec3(.56*s*br,.255*s,.48*s*br));
  cap=max(cap,.635*s-q.y);
  float crown=sdEllipsoid(c-vec3(0.0,.06*s,0.0),vec3(.40*s,.23*s,.35*s));
  cap=smin(cap,crown,.08*s);
  return smin(st,cap,.105*s);
}
float hypha(vec3 p,float tau){
  vec3 q=p;
  q.x+=.09*sin(q.z*2.4+tau*2.0)+.035*sin(q.y*8.0-tau*5.0);
  q.z+=.07*cos(q.x*2.1-tau*3.0);
  float b=.045+.011*sin(tau*4.0+q.x*3.0-q.z*2.0);
  float d=sdCapsule(q,vec3(-3.0,-.56,-.45),vec3(-1.35,-.54,-.15),b);
  d=min(d,sdCapsule(q,vec3(-1.35,-.54,-.15),vec3(-.25,-.51,.35),b*1.15));
  d=min(d,sdCapsule(q,vec3(-.25,-.51,.35),vec3(1.0,-.54,.15),b));
  d=min(d,sdCapsule(q,vec3(1.0,-.54,.15),vec3(2.75,-.57,.65),b*.9));
  d=min(d,sdCapsule(q,vec3(-1.55,-.55,-.18),vec3(-1.95,-.54,1.45),b*.72));
  d=min(d,sdCapsule(q,vec3(-.42,-.52,.28),vec3(-.05,-.53,-1.72),b*.8));
  d=min(d,sdCapsule(q,vec3(.88,-.55,.17),vec3(1.52,-.53,-1.3),b*.75));
  d=min(d,sdCapsule(q,vec3(.55,-.54,.22),vec3(.85,-.52,1.62),b*.72));
  d=min(d,sdCapsule(q,vec3(-2.0,-.55,1.38),vec3(-.55,-.54,1.72),b*.58));
  d=min(d,sdCapsule(q,vec3(1.48,-.54,-1.26),vec3(2.55,-.56,-.78),b*.6));
  d=min(d,sdCapsule(q,vec3(-.08,-.53,-1.66),vec3(-1.45,-.55,-1.93),b*.55));
  return d;
}
vec2 mapScene(vec3 p,float tau){
  float wet=fbm(p*1.35+vec3(0.0,.2*sin(tau),0.0));
  float d=sdRoundBox(p-vec3(0.0,-.79,0.0),vec3(3.25,.18,2.18),.16)+(wet-.48)*.035;
  float m=1.0;
  float h=hypha(p,tau);
  if(h<d){d=h;m=2.0;}
  float a=mushroom(p-vec3(-1.9,-.62,1.38),.88,1.7,tau);
  if(a<d){d=a;m=3.0;}
  float b=mushroom(p-vec3(-.08,-.62,-1.63),1.16,4.1,tau);
  if(b<d){d=b;m=3.0;}
  float c=mushroom(p-vec3(1.48,-.62,-1.25),.72,6.3,tau);
  if(c<d){d=c;m=3.0;}
  float e=mushroom(p-vec3(.82,-.62,1.58),.62,8.8,tau);
  if(e<d){d=e;m=3.0;}
  float f=mushroom(p-vec3(-.32,-.61,.30),.46,11.2,tau);
  if(f<d){d=f;m=3.0;}
  return vec2(d,m);
}
vec3 normalAt(vec3 p,float tau){
  vec2 e=vec2(.0025,0.0);
  float d=mapScene(p,tau).x;
  return normalize(vec3(
    mapScene(p+e.xyy,tau).x-d,
    mapScene(p+e.yxy,tau).x-d,
    mapScene(p+e.yyx,tau).x-d
  ));
}
float shadowAt(vec3 p,vec3 l,float tau){
  float r=1.0,t=.025;
  for(int i=0;i<18;i++){
    float h=mapScene(p+l*t,tau).x;
    r=min(r,12.0*h/t);
    t+=clamp(h,.025,.24);
  }
  return clamp(r,0.16,1.0);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
  float phase=mod(iTime,DURATION)/DURATION;
  float tau=phase*TAU;
  vec3 ro=vec3(.18*sin(tau),2.65+.12*cos(tau*2.0),5.85);
  vec3 ta=vec3(.12*sin(tau*2.0),-.18,.05*cos(tau));
  vec3 ww=normalize(ta-ro);
  vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
  vec3 vv=cross(uu,ww);
  vec3 rd=normalize(uu*uv.x+vv*uv.y+ww*1.72);
  vec3 col=mix(vec3(.012,.009,.018),vec3(.055,.032,.027),clamp(.55-rd.y,0.0,1.0));
  float t=.08,mat=0.0,glow=0.0;
  bool hit=false;
  for(int i=0;i<72;i++){
    vec3 p=ro+rd*t;
    vec2 z=mapScene(p,tau);
    float h=hypha(p,tau);
    float sig=pow(.5+.5*sin(p.x*9.0-p.z*7.0-tau*5.0),8.0);
    glow+=exp(-abs(h)*24.0)*(.006+.025*sig)*exp(-t*.045);
    if(z.x<.0015){mat=z.y;hit=true;break;}
    t+=clamp(z.x*.72,.008,.32);
    if(t>12.0)break;
  }
  col+=vec3(.35,.82,.16)*glow;
  if(hit){
    vec3 p=ro+rd*t;
    vec3 n=normalAt(p,tau);
    vec3 ld=normalize(vec3(-.45,.85,.35));
    float sh=shadowAt(p+n*.008,ld,tau);
    float diff=max(dot(n,ld),0.0)*sh;
    float rim=pow(1.0-max(dot(n,-rd),0.0),3.0);
    float wet=fbm(p*2.1);
    vec3 base=vec3(.055,.034,.038);
    if(mat>1.5&&mat<2.5){
      float sig=pow(.5+.5*sin(p.x*9.0-p.z*7.0-tau*5.0),7.0);
      base=mix(vec3(.22,.42,.08),vec3(.78,1.0,.28),.35+.65*sig);
      base+=vec3(.52,.28,.04)*sig;
    }
    if(mat>2.5){
      float rings=.5+.5*sin(atan(p.z,p.x)*13.0+length(p.xz)*17.0-tau*3.0);
      float breath=.5+.5*sin(tau*2.0+p.x*1.3);
      base=mix(vec3(.32,.095,.045),vec3(.92,.46,.12),.35+.35*wet);
      base+=vec3(.18,.34,.06)*rings*breath;
    }
    vec3 h=normalize(ld-rd);
    float spec=pow(max(dot(n,h),0.0),42.0)*(.25+.75*wet)*sh;
    float back=pow(max(dot(rd,ld),0.0),5.0)*max(-dot(n,ld),0.0);
    col=base*(.22+1.15*diff)+vec3(.95,.72,.36)*spec;
    col+=vec3(.58,.88,.22)*rim*.32+vec3(1.0,.34,.09)*back*.75;
    float fog=1.0-exp(-t*.055);
    col=mix(col,vec3(.07,.043,.038),fog);
  }
  for(int i=0;i<24;i++){
    float fi=float(i);
    float a=fi*2.399963+14144.483;
    float cy=fract(fi*.6180339+phase*2.0);
    float r=.35+1.95*fract(sin(fi*91.731+14144.483)*43758.5453);
    vec3 sp=vec3(cos(a)*r,-.2+cy*3.15,sin(a)*r);
    sp.x+=.24*sin(tau*2.0+fi*1.71+cy*4.0);
    sp.z+=.20*cos(tau*3.0-fi*1.13+cy*5.0);
    vec3 rel=sp-ro;
    float z=dot(rel,ww);
    if(z>.1){
      vec2 su=vec2(dot(rel,uu),dot(rel,vv))*1.72/z;
      float d=length(uv-su);
      float tw=.65+.35*sin(tau*4.0+fi*2.07);
      col+=mix(vec3(.72,1.0,.28),vec3(1.0,.62,.18),cy)*tw*(exp(-d*d*8500.0)*1.5+exp(-d*d*900.0)*.22);
    }
  }
  float mist=fbm(vec3(uv*1.8+vec2(.12*cos(tau),.08*sin(tau*2.0)),tau*.08));
  col+=vec3(.075,.055,.042)*smoothstep(.58,.83,mist)*(.7+.3*sin(tau+uv.x*3.0));
  col*=1.0-.17*dot(uv,uv);
  col=col/(1.0+col);
  col=pow(max(col,0.0),vec3(.82));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 42;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 42;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  const duration = 42;
  const targetBpm = 118;
  const totalBars = Math.max(1, Math.round(duration * targetBpm / 240));
  const bpm = totalBars * 240 / duration;
  Tone.Transport.bpm.value = bpm;

  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);

  let rngState = 0x210a716d;
  const R = () => {
    rngState = (Math.imul(rngState, 1664525) + 1013904223) >>> 0;
    return rngState / 4294967296;
  };
  const H = (ms) => R() * ms / 1000;

  // === FX CHAIN ===
  const reverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await reverb.generate();
  
  const pingDelay = new Tone.PingPongDelay({ 
    delayTime: "8n.", 
    feedback: 0.35, 
    wet: 0.25 
  }).connect(reverb);

  const bitCrusher = new Tone.BitCrusher({ bits: 6 }).toDestination();

  // === INSTRUMENTS ===

  // 1. Acid Bass (MonoSynth with high Q resonance)
  const acidFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 14 }).toDestination();
  const acidBass = new Tone.MonoSynth({
    oscillator: { type: "square" },
    envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 },
    filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.1, baseFrequency: 200, octaves: 4 }
  }).connect(acidFilter);
  acidBass.volume.value = -6;

  // 2. Bio-luminescent Bells (FMSynth)
  const bell = new Tone.FMSynth({
    harmonicity: 3.1,
    modulationIndex: 8.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 0.8, sustain: 0.4, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(pingDelay);
  bell.volume.value = -10;

  // 3. Mycelial Texture (NoiseSynth + LowPass)
  const textureFilter = new Tone.Filter({ type: "lowpass", frequency: 400 }).toDestination();
  const mycelium = new Tone.NoiseSynth({
    noise: { type: "brown" },
    envelope: { attack: 1.0, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).connect(textureFilter);
  mycelium.volume.value = -18;

  // 4. Glitch Snares (MetalSynth via bitCrusher)
  const glitchSnare = new Tone.MetalSynth({
    frequency: 180,
    envelope: { attack: 0.001, decay: 0.08, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 32,
    resonance: 2000
  }).connect(bitCrusher);
  glitchSnare.volume.value = -8;

  // 5. Spore Pads (PolySynth)
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "fmsine", modulationType: "sine", modulationIndex: 2, harmonicity: 2.5 },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.8, release: 3.0 }
  }).connect(reverb);
  pad.volume.value = -20;

  // === PATTERNS ===

  // A. Acid Bass - 7-step Polyrhythm (squelching)
  const bassNotes = ["C2", "G#1", "C2", "F2", "D#2", "C2", "A1"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.15 && bar < totalBars * 0.75) {
      // Random note dropout for glitch feel
      if (R() > 0.1) {
        const note = bassNotes[bassIdx % bassNotes.length];
        acidBass.triggerAttackRelease(note, "16n", time, 0.8);
        
        // Automate filter frequency for squelch
        const freq = 300 + R() * 1200;
        acidFilter.frequency.setValueAtTime(freq, time);
        acidFilter.frequency.exponentialRampToValueAtTime(freq * 0.1, time + 0.15);
      }
    }
    bassIdx++;
  }, "16n").start(0);

  // B. FM Bells - 5-step Polyrhythm (mysterious, organic)
  const bellNotes = ["C5", "E5", "G5", "Bb5", "D6"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.80) {
      const note = bellNotes[bellIdx % bellNotes.length];
      // Slight detuning variation for organic feel
      const detune = (R() - 0.5) * 20;
      bell.triggerAttackRelease(note, "8n", time + H(10), 0.6);
      bell.detune = detune;
    }
    bellIdx++;
  }, "5n").start(0);

  // C. Glitch Snares - Irregular placement
  let snareIdx = 0;
  const snareLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.30 && bar < totalBars * 0.85) {
      // 7/8 pattern feel
      const pattern = [1, 0, 1, 1, 0, 1, 0, 0]; 
      if (pattern[snareIdx % pattern.length]) {
        // Displaced timing
        glitchSnare.triggerAttackRelease("32n", time + H(4), 0.5 + R() * 0.3);
      }
    }
    snareIdx++;
  }, "8n").start(0);

  // D. Mycelial Texture - Evolving drone
  const padChords = [
    ["C3", "Eb3", "G3", "Bb3"],
    ["A2", "C3", "E3", "G3"],
    ["F2", "A2", "C3", "Eb3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.05 && bar < totalBars * 0.90) {
      const chord = padChords[Math.floor(bar / 4) % padChords.length];
      pad.triggerAttackRelease(chord, "2n", time);
      
      // Evolve filter on texture
      const freq = 200 + (bar / totalBars) * 600;
      textureFilter.frequency.setValueAtTime(freq, time);
    }
  }, "4n").start(0);

  // === STRUCTURE / WIND DOWN ===
  
  // Ensure wind down starts at 80%
  const secPerBar = 240 / bpm;
  Tone.Transport.schedule((time) => {
    // Close acid filter
    acidFilter.frequency.linearRampToValueAtTime(200, time + 4 * secPerBar);
    // Silence bells
    bell.volume.linearRampToValueAtTime(-Infinity, time + 2 * secPerBar);
    // Silence glitch
  }, totalBars * 0.80 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Silence pad and texture gently
    pad.volume.linearRampToValueAtTime(-Infinity, time + 6 * secPerBar);
    mycelium.volume.linearRampToValueAtTime(-Infinity, time + 6 * secPerBar);
  }, totalBars * 0.85 * secPerBar);

  // === STORE REFERENCES ===
  window.toneJsInstruments = {
    acidBass,
    bell,
    mycelium,
    glitchSnare,
    pad,
    reverb,
    pingDelay,
    bitCrusher,
    acidFilter,
    textureFilter
  };
  window.toneJsParts = {
    bassLoop,
    bellLoop,
    snareLoop,
    padLoop
  };
};
