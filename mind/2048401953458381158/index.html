<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float sdSeg(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / (dot(ba, ba) + 1e-7), 0.0, 1.0);
    return length(pa - ba * h);
}

vec3 pal(float x) {
    float m = mod(x, 3.0);
    if (m < 1.0) return vec3(0.2, 0.72, 0.52);
    if (m < 2.0) return vec3(1.0, 0.42, 0.3);
    return vec3(0.15, 0.55, 0.88);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float ph = mod(t, 15.0) / 15.0;

    float g0 = smoothstep(0.05, 0.25, ph) * (1.0 - smoothstep(0.82, 1.0, ph));
    float g1 = smoothstep(0.15, 0.35, ph) * (1.0 - smoothstep(0.75, 0.95, ph));
    float g2 = smoothstep(0.25, 0.45, ph) * (1.0 - smoothstep(0.65, 0.9, ph));
    float gv = smoothstep(0.35, 0.5, ph) * (1.0 - smoothstep(0.6, 0.85, ph));
    float dp = smoothstep(0.6, 0.85, ph);

    vec3 col = vec3(0.012, 0.008, 0.03) + vec3(0.012, 0.008, 0.025) * (1.0 - smoothstep(0.0, 0.8, length(uv)));
    float nd = length(uv);

    for (float i = 0.0; i < 45.0; i++) {
        vec2 pp = vec2(hash(vec2(i * 1.31, i * 0.97)), hash(vec2(i * 0.73, i * 1.51)));
        pp = pp * 2.5 - 1.25;
        float h3 = hash(vec2(i * 2.17, i * 0.43));
        pp += vec2(sin(t * 0.05 + h3 * 6.283), cos(t * 0.04 + h3 * 3.14)) * 0.13;
        float pd = length(uv - pp);
        float pb = 0.0008 / (pd * pd + 0.0008);
        pb *= 0.3 + 0.7 * (sin(t * (0.2 + h3 * 0.3) + h3 * 6.283) * 0.5 + 0.5);
        col += pal(i * 1.7) * pb * 0.028;
    }

    vec2 gf = abs(fract(uv * 5.0 + t * 0.02) - 0.5);
    col += vec3(0.05, 0.04, 0.09) * smoothstep(0.015, 0.004, min(gf.x, gf.y)) * 0.035 * (1.0 - smoothstep(0.0, 0.9, nd));

    float np = 0.7 + 0.3 * sin(t * 2.0);
    col += vec3(0.92, 0.87, 0.72) * smoothstep(0.045, 0.02, nd) * g0 * np;
    col += vec3(0.7, 0.65, 0.55) * 0.012 / (nd + 0.007) * g0;

    float rng = sin((nd - t * 0.1) * 25.0) * 0.5 + 0.5;
    rng *= smoothstep(0.55, 0.06, nd) * smoothstep(0.025, 0.045, nd);
    col += vec3(0.45, 0.4, 0.38) * rng * 0.055 * g0;

    float bLen = 0.3;
    float rot = t * 0.025;
    float bd = 100.0;
    float eWave = sin(nd * 12.0 - t * 3.0) * 0.5 + 0.5;

    for (float i = 0.0; i < 6.0; i++) {
        float a0 = i * 1.0472 + rot + sin(t * 0.08 + i * 1.1) * 0.05;
        vec2 d0 = vec2(cos(a0), sin(a0));
        vec2 e0 = d0 * bLen * g0;
        bd = min(bd, sdSeg(uv, vec2(0.0), e0));

        for (float j = 0.0; j < 2.0; j++) {
            float a1 = a0 + (j - 0.5) * 0.7 + sin(t * 0.1 + i * 0.7 + j) * 0.08;
            vec2 d1 = vec2(cos(a1), sin(a1));
            vec2 e1 = e0 + d1 * bLen * 0.65 * g1;
            bd = min(bd, sdSeg(uv, e0, e1));

            for (float k = 0.0; k < 2.0; k++) {
                float a2 = a1 + (k - 0.5) * 0.5 + sin(t * 0.12 + i * 0.5 + j * 0.3 + k) * 0.06;
                vec2 d2 = vec2(cos(a2), sin(a2));
                vec2 e2 = e1 + d2 * bLen * 0.45 * g2;
                bd = min(bd, sdSeg(uv, e1, e2));

                float gd = length(uv - e2);
                float gSize = 0.016 + 0.008 * sin(t * 2.5 + i * 1.3 + j + k * 2.1);
                float hf = hash(vec2(i + j * 3.0, k + i * 2.0));
                float fl = 0.3 + 0.7 * (sin(t * (4.0 + hf * 3.0) + hf * 6.283) * 0.5 + 0.5);
                float solid = smoothstep(gSize + 0.004, gSize - 0.002, gd) * gv;
                float glR = 0.004 + 0.014 * dp;
                float glow = glR / (gd + glR + 0.002) * max(gv, dp * 0.4);
                vec3 gc = pal(i * 2.0 + j + k * 0.7);
                col += gc * (solid * 0.85 + glow * 0.35) * fl;
            }
        }
    }

    vec3 bc = mix(vec3(0.25, 0.6, 0.5), vec3(0.18, 0.5, 0.82), sin(t * 0.12) * 0.5 + 0.5);
    col += bc * smoothstep(0.006, 0.002, bd) * 0.55;
    col += bc * 0.002 / (bd + 0.003) * 0.08;
    col += pal(nd * 3.0 + t * 0.5) * smoothstep(0.008, 0.002, bd) * eWave * 0.2;

    col *= 1.0 - 0.4 * dot(uv * 0.85, uv * 0.85);
    col = pow(max(col, 0.0), vec3(0.93));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  var bpm = 60;
  Tone.Transport.bpm.value = bpm;

  var reverb = new Tone.Reverb({ decay: 5.0, wet: 0.45 }).toDestination();
  await reverb.generate();
  var delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.2 }).connect(reverb);

  var pulse = new Tone.MembraneSynth({
    pitchDecay: 0.1, octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.02, decay: 1.2, sustain: 0, release: 0.8 }
  }).connect(reverb);
  pulse.volume.value = -6;

  var pulseLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 13) {
      var vel = bar < 11 ? 0.35 + 0.15 * Math.sin(bar * 0.5) : 0.25;
      pulse.triggerAttackRelease("C1", "2n", time, vel);
    }
  }, "1m").start(0);

  var noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 600, Q: 0.4 }).connect(reverb);
  var staticNoise = new Tone.Noise({ type: "pink" }).connect(noiseFilter);
  staticNoise.volume.value = -22;
  staticNoise.start();

  var noiseModLoop = new Tone.Loop(function(time) {
    var sec = Tone.Transport.getSecondsAtTime(time);
    var breathPhase = (sec % 15) / 15;
    noiseFilter.frequency.setTargetAtTime(400 + 800 * Math.sin(breathPhase * Math.PI), time, 0.2);
  }, "2n").start(0);

  var bell = new Tone.FMSynth({
    harmonicity: 4.0, modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 3.0, sustain: 0, release: 1.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 2.0, sustain: 0, release: 1.0 }
  }).connect(delay);
  bell.volume.value = -14;

  var bellNotes = ["E5", "B4", "G5", "C4", "E4", "A4", "D5", "F5", "A5"];
  var bellLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    var sec = Tone.Transport.getSecondsAtTime(time);
    var breathPhase = (sec % 15) / 15;
    if (bar >= 2 && bar < 12 && breathPhase > 0.3 && breathPhase < 0.7) {
      if (Math.random() > 0.35) {
        var note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
        bell.triggerAttackRelease(note, "4n", time, 0.1 + Math.random() * 0.15);
      }
    }
  }, "4n").start(0);

  var padFilter = new Tone.Filter({ type: "lowpass", frequency: 400, Q: 0.6 }).connect(reverb);
  var padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(padFilter);
  padChorus.start();
  var pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.4, release: 3.0 }
  }).connect(padChorus);
  pad.volume.value = -12;

  var padChords = [["C3", "G3", "E4"], ["A2", "E3", "C4"], ["F2", "C3", "A3"], ["G2", "D3", "B3"]];
  var chordIdx = 0;
  var padLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 13) {
      pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "2n", time, 0.18);
    }
    chordIdx++;
  }, "2m").start(0);

  var padBreathLoop = new Tone.Loop(function(time) {
    var sec = Tone.Transport.getSecondsAtTime(time);
    var breathPhase = (sec % 15) / 15;
    padFilter.frequency.setTargetAtTime(300 + 600 * Math.sin(breathPhase * Math.PI), time, 0.2);
  }, "2n").start(0);

  var drone = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 0.0, sustain: 1.0, release: 3.0 }
  }).connect(reverb);
  drone.volume.value = -20;

  var droneLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 11) {
      drone.triggerAttackRelease("C2", "4m", time, 0.15);
    }
  }, "4m").start(0);

  window.toneJsInstruments = { pulse: pulse, staticNoise: staticNoise, bell: bell, pad: pad, drone: drone };
  window.toneJsParts = { pulseLoop: pulseLoop, noiseModLoop: noiseModLoop, bellLoop: bellLoop, padLoop: padLoop, padBreathLoop: padBreathLoop, droneLoop: droneLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
