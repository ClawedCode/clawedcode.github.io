<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const C=document.createElement('canvas'),X=C.getContext('2d');
C.width=C.height=900;
let sd=42,R=()=>(sd=(sd*9301+49297)%233280)/233280;
window.renderFrame=t=>{
X.fillStyle='#080a10';X.fillRect(0,0,900,900);
let P=(t/60)*4,A=P*Math.PI*2;
for(let l=0;l<3;l++){
X.save();X.translate(450,450);
X.rotate(Math.PI/4+(l%2==0?1:-1)*Math.sin(A+l*Math.PI)*0.03);
let st=35+l*15,lm=14-l*4;
for(let i=-lm;i<=lm;i++){
for(let j=-lm;j<=lm;j++){
let d=Math.max(Math.abs(i),Math.abs(j)),of=d*0.25-l*1.5;
let w=Math.sin(A-of),x=i*st,y=j*st,sz=(st*0.4)+w*(st*0.2);
let D=Math.sin(i*1.3-A*2+l)>0.9||Math.cos(j*1.7+A*2-l)>0.9;
X.fillStyle=D?'#e88935':(l==0?'#151b2b':'#222e47');
X.globalAlpha=1-(d/lm)*0.6;
X.beginPath();X.roundRect(x-sz/2,y-sz/2,sz,sz,Math.max(0.1,(w+1)*sz*0.25));X.fill();
if(D&&w>0.5){
X.shadowColor='#e88935';X.shadowBlur=10;X.fillStyle='#fff';
X.fillRect(x-1.5,y-1.5,3,3);X.shadowBlur=0;
}}}X.restore();}return C.toDataURL('image/png');};
window.initToneJsEngine=async()=>{
const T=Tone.Transport;T.bpm.value=96;
const rv=new Tone.Reverb({decay:3,wet:0.3}).toDestination();await rv.generate();
const cp=new Tone.Compressor({threshold:-20,ratio:6,attack:0.01,release:0.1}).toDestination();
const K=new Tone.MembraneSynth({pitchDecay:0.02,envelope:{attack:0.001,decay:0.2,sustain:0,release:0.1}}).connect(cp);
const Kl=new Tone.Loop(t=>K.triggerAttackRelease("C1","8n",t),"4n").start(0);
const bF=new Tone.Filter({type:"lowpass",frequency:200}).connect(cp);
const B=new Tone.MonoSynth({oscillator:{type:"square"},envelope:{attack:0.01,decay:0.2,sustain:0.2}}).connect(bF);
const bp=[["C2","C2","C2","C2"],["G1","G1","G1","G1"],["A1","A1","A1","A1"],["F1","F1","F1","F1"]];
let bs=0;
const Bl=new Tone.Loop(t=>{
let b=Math.floor(bs/8);
B.triggerAttackRelease(bp[b%4][bs%4],"8n",t,0.6);bs++;
},"8n").start(0);
const ar=new Tone.Synth({oscillator:{type:"sawtooth"},envelope:{attack:0.01,decay:0.1,sustain:0}}).connect(rv);
const ap=["C4","D#4","G4","A#4","C5","G4","D#4","C4"];let aI=0;
const al=new Tone.Loop(t=>{
let b=Math.floor(aI/16);
if(b>=2&&b<22)ar.triggerAttackRelease(ap[aI%8],"16n",t,0.15);aI++;
},"16n").start(0);
const pC=new Tone.Chorus({frequency:0.2,depth:0.5}).connect(rv);pC.start();
const P=new Tone.PolySynth(Tone.Synth,{envelope:{attack:1,decay:1,sustain:0.5,release:2}}).connect(pC);
const pc=[["C3","G3","D#4"],["G2","D3","A#3"],["A2","E3","C4"],["F2","C3","A3"]];
let pI=0;
const pl=new Tone.Loop(t=>{
if(pI>=4&&pI<20)P.triggerAttackRelease(pc[pI%4],"1m",t,0.15);pI++;
},"1m").start(0);
const H=new Tone.MetalSynth({frequency:250,envelope:{attack:0.001,decay:0.05,release:0.01}}).connect(rv);
let hI=0;
const hl=new Tone.Loop(t=>{
let b=Math.floor(hI/16);
if(b>=8&&b<22){if(hI%2===1||R()>0.8)H.triggerAttackRelease("16n",t,0.08);}hI++;
},"16n").start(0);
window.toneJsInstruments={K,B,ar,P,H};window.toneJsParts={Kl,Bl,al,pl,hl};};
window.ready=true;




document.body.appendChild(C);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;

window.ready = true;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
