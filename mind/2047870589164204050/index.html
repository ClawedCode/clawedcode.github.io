<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float nse(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 3; i++) { v += a * nse(p); p *= 2.0; a *= 0.5; }
    return v;
}

float turi(vec2 p, float T, float s, float m) {
    float act = sin(p.x * s + T) * sin(p.y * s * 1.1 - T * 2.0)
              + sin((p.x * 0.866 + p.y * 0.5) * s * 0.9 + T * 3.0) * 0.8
              + sin((p.x * 0.5 - p.y * 0.866) * s * 1.05 - T * 2.0) * 0.6;
    float q = s * mix(0.28, 0.45, m);
    float inh = sin(p.x * q + T) * sin(p.y * q - T)
              + sin((p.x + p.y) * q * 0.8 + T * 2.0) * 0.7;
    return act - inh * 0.65;
}

void main() {
    vec2 uv = gl_FragCoord.xy / iResolution.xy;
    vec2 p = (uv - 0.5) * 8.0;
    p.x *= iResolution.x / iResolution.y;

    float lp = mod(iTime, 60.0) / 60.0;
    float T = lp * 6.28318;
    float cx = cos(T) * 0.3, cy = sin(T) * 0.3;

    vec2 w = vec2(fbm(p * 0.5 + vec2(cx, cy)),
                  fbm(p * 0.5 + vec2(5.2 + cy, 1.3 + cx)));
    vec2 wp = p + w * 1.8;
    w = vec2(fbm(wp * 0.7 + vec2(cy, -cx) + vec2(8.3, 2.1)),
             fbm(wp * 0.7 + vec2(-cy, cx) + vec2(1.7, 9.4)));
    wp += w * 0.7;

    float m = (1.0 - cos(T)) * 0.5;
    float raw = turi(wp, T * 3.0 + 1.5, 3.5, m);
    raw += (fbm(wp * 1.5 + vec2(cx * 2.0, cy * 2.0) + vec2(3.1, 7.2)) - 0.5) * 0.5;

    float sh = mix(0.12, 0.05, m);
    float pat = smoothstep(-sh, sh, raw);
    float fn = turi(wp * 2.2 + vec2(11.3, 7.7), T * 5.0 + 2.7, 5.0, m * 0.5);
    pat = mix(pat, smoothstep(-0.1, 0.1, fn), 0.1);

    float cs = (1.0 - cos(T)) * 0.5;
    vec3 bg = mix(vec3(0.06, 0.03, 0.01), vec3(0.02, 0.01, 0.06), cs);
    vec3 hi = mix(vec3(0.95, 0.72, 0.28), vec3(0.42, 0.52, 0.88), cs);
    vec3 md = mix(vec3(0.72, 0.42, 0.1), vec3(0.25, 0.2, 0.65), cs);

    vec3 col = mix(mix(bg, md, smoothstep(0.2, 0.45, pat)), hi, smoothstep(0.55, 0.85, pat));
    float edge = smoothstep(0.14, 0.0, abs(raw));
    col += mix(vec3(1.0, 0.82, 0.35), vec3(0.55, 0.65, 1.0), cs) * edge * 0.18;
    col *= 0.93 + 0.07 * sin(T * 2.0);
    col *= smoothstep(0.0, 0.65, 1.0 - length((uv - 0.5) * 1.5));

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const H = ms => (Math.random() * ms * 2 - ms) / 1000;
  const barLen = 4 * 60 / bpm;

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.2 }).toDestination();
  const verb = new Tone.Reverb({ decay: 3.8, wet: 0.38 }).connect(masterComp);
  await verb.generate();
  const tapeChorus = new Tone.Chorus({ frequency: 0.25, delayTime: 5.0, depth: 0.65, wet: 0.42 }).connect(verb);
  tapeChorus.start();
  const lofi = new Tone.Filter({ type: "lowpass", frequency: 3200, Q: 0.7 }).connect(masterComp);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 1.0 }).connect(tapeChorus);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -14,
    envelope: { attack: 1.4, decay: 0.5, sustain: 0.55, release: 2.2 },
    volume: -14
  }).connect(padFilter);

  const chords = [
    ["B3", "D4", "F#4"],
    ["G3", "B3", "D4"],
    ["A3", "C#4", "E4"],
    ["F#3", "A3", "C#4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 17;
    const vel = bar < 3 ? 0.24 : bar < 13 ? 0.36 : 0.24;

    let freq = 800;
    if (bar >= 3 && bar < 10) freq = 800 + (bar - 3) * 200;
    else if (bar >= 10 && bar < 13) freq = 2200;
    else if (bar >= 13) freq = Math.max(800, 2200 - (bar - 12) * 350);
    padFilter.frequency.linearRampToValueAtTime(freq, time + barLen);

    pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time + H(12), vel);
    chordIdx++;
  }, "1n").start(0);

  const kickFilt = new Tone.Filter({ type: "lowpass", frequency: 180 }).connect(lofi);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.045, octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.28, sustain: 0, release: 0.05 },
    volume: -9
  }).connect(kickFilt);

  let kickBeat = 0;
  const kickPat = [1, 0, 0, 1, 0, 0, 1, 0];
  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 17;
    if (bar >= 3 && bar < 15 && kickPat[kickBeat % 8]) {
      kick.triggerAttackRelease("C1", "8n", time + H(3), 0.72);
    }
    kickBeat++;
  }, "8n").start(0);

  const bassFilt = new Tone.Filter({ type: "lowpass", frequency: 260, Q: 0.8 }).connect(masterComp);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.012, decay: 0.35, sustain: 0.4, release: 0.25 },
    filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0, baseFrequency: 90, octaves: 1.5 },
    volume: -10
  }).connect(bassFilt);

  const bassPatterns = [
    ["B1", "B1", "B1", "B1"],
    ["G1", "G1", "A1", "A1"],
    ["F#1", "F#1", "B1", "A1"]
  ];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 17;
    if (bar < 3 || bar >= 15) return;
    let notes;
    if (bar < 7) notes = bassPatterns[0];
    else if (bar < 11) notes = bassPatterns[1];
    else notes = bassPatterns[2];
    if (bassIdx % 2 === 0) {
      bass.triggerAttackRelease(notes[bassIdx % notes.length], "4n", time + H(8), 0.68);
    }
    bassIdx++;
  }, "4n").start(0);

  const noiseFilt = new Tone.Filter({ type: "bandpass", frequency: 350, Q: 0.5 }).connect(verb);
  const texture = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.2, decay: 1.0, sustain: 0.3, release: 2.2 },
    volume: -22
  }).connect(noiseFilt);

  const texLoop = new Tone.Loop((time) => {
    texture.triggerAttackRelease(3.2, time + H(15));
  }, "2n").start(0);

  const bellFilt = new Tone.Filter({ type: "lowpass", frequency: 2200 }).connect(verb);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5, modulationIndex: 3.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 1.8, sustain: 0, release: 0.9 },
    modulation: { type: "sine" },
    volume: -18
  }).connect(bellFilt);

  const bellNotes = ["F#5", "D5", "B4", "A4", "F#4", "E5", "D5", "B4"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 17;
    if (bar >= 6 && bar < 13 && Math.random() > 0.42) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "8n", time + H(10), 0.26 + Math.random() * 0.12);
      bellIdx++;
    }
  }, "2n").start(0);

  const hatFilt = new Tone.Filter({ type: "lowpass", frequency: 1400 }).connect(lofi);
  const hat = new Tone.MetalSynth({
    frequency: 280,
    envelope: { attack: 0.001, decay: 0.055, release: 0.02 },
    harmonicity: 5.1, modulationIndex: 18, resonance: 2800,
    volume: -25
  }).connect(hatFilt);

  let hatBeat = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen) % 17;
    if (bar >= 6 && bar < 14 && hatBeat % 2 === 1) {
      hat.triggerAttackRelease("16n", time + H(5), 0.2 + Math.random() * 0.08);
    }
    hatBeat++;
  }, "8n").start(0);

  window.toneJsInstruments = { pad, kick, bass, texture, bell, hat };
  window.toneJsParts = { padLoop, kickLoop, bassLoop, texLoop, bellLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
