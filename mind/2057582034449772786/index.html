<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);
    vec3 col=vec3(0.02,0.005,0.04);
    float rh=28.0+sin(t*0.2)*1.5;
    for(float k=0.0;k<6.0;k++){
        float ph=k*0.41+t*0.025;
        vec3 p=vec3(sin(ph)*0.7+0.1,cos(ph*1.3)*0.7,25.0+sin(ph*0.8)*2.5);
        float a=t*0.1+k*0.05,ca=cos(a),sa=sin(a);
        for(float i=0.0;i<400.0;i++){
            vec3 v=vec3(10.0*(p.y-p.x),p.x*(rh-p.z)-p.y,p.x*p.y-2.6667*p.z);
            p+=v*0.006;
            vec2 q=vec2(p.x*ca-(p.z-27.0)*sa,p.y)*0.019;
            float d=length(uv-q),w=1.0-i/400.0;
            float g=0.0003/(d*d+0.0001)+0.00012/(d+0.02);
            float lb=clamp(p.x*0.04+0.5,0.0,1.0);
            vec3 c=mix(vec3(0.05,0.01,0.2),vec3(0.08,0.95,0.38),lb);
            col+=c*g*w*w*0.065;
        }
    }
    col=1.0-exp(-col*2.0);
    col=pow(col,vec3(0.88,0.93,1.0));
    col*=1.0-0.3*length(uv);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const rev = new Tone.Reverb({decay:4.5,wet:0.4}).toDestination();
  await rev.generate();
  const dly = new Tone.FeedbackDelay({delayTime:"4n.",feedback:0.3,wet:0.2}).connect(rev);

  const pad = new Tone.PolySynth(Tone.Synth,{
    oscillator:{type:"sine"},
    envelope:{attack:2.0,decay:1.0,sustain:0.6,release:3.0}
  }).connect(rev);
  const chords=[["D2","A2","F3"],["C2","G2","E3"],["A1","E2","C3"],["B1","F#2","D3"]];
  let ci=0;
  const padL=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);
    if(bar<18) pad.triggerAttackRelease(chords[ci%4],"1m",time,0.12);
    ci++;
  },"1m").start(0);

  const bell=new Tone.FMSynth({
    harmonicity:3.5,modulationIndex:8,
    oscillator:{type:"sine"},
    envelope:{attack:0.001,decay:2.5,sustain:0,release:1.0},
    modulation:{type:"triangle"}
  }).connect(dly);
  const bn=["A4","E5","D5","F#5","C5","G4","B4","E4"];
  let bi=0;
  const bellL=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);
    if(bar>=2&&bar<17&&Math.random()>0.3){
      bell.triggerAttackRelease(bn[bi%8],"4n",time,0.15+Math.random()*0.1);
    }
    bi++;
  },"2n").start(0);

  const sub=new Tone.Synth({
    oscillator:{type:"sine"},
    envelope:{attack:0.5,decay:0.8,sustain:0.3,release:1.5}
  }).connect(rev);
  const sn=["D1","C1","A0","B0"];
  let si2=0;
  const subL=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);
    if(bar>=1&&bar<18) sub.triggerAttackRelease(sn[si2%4],"2n",time,0.2);
    si2++;
  },"1m").start(0);

  const shm=new Tone.Synth({
    oscillator:{type:"triangle"},
    envelope:{attack:0.01,decay:0.6,sustain:0,release:0.5}
  }).connect(dly);
  const sc=[0,2,3,5,7,9,10];
  const shmL=new Tone.Loop((time)=>{
    const bar=Math.floor(Tone.Transport.getSecondsAtTime(time)/(60/bpm)/4);
    if(bar>=4&&bar<16&&Math.random()>0.55){
      const n=Tone.Frequency((Math.random()>0.5?72:84)+sc[Math.floor(Math.random()*7)],"midi");
      shm.triggerAttackRelease(n,"8n",time,0.08);
    }
  },"8n").start(0);

  window.toneJsInstruments={pad,bell,sub,shm};
  window.toneJsParts={padL,bellL,subL,shmL};
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
