<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float wave(vec2 p, vec2 center, float freq, float phase, float decay) {
    float d = length(p - center);
    float amp = exp(-d * decay);
    return amp * sin(d * freq - phase);
}

vec3 palette(float t, float warmth) {
    vec3 indigo = vec3(0.08, 0.04, 0.28);
    vec3 deepBlue = vec3(0.05, 0.12, 0.35);
    vec3 teal = vec3(0.1, 0.3, 0.4);
    vec3 amber = vec3(0.85, 0.55, 0.15);
    vec3 gold = vec3(1.0, 0.82, 0.4);
    vec3 cold = mix(indigo, deepBlue, smoothstep(-1.0, 0.0, t));
    cold = mix(cold, teal, smoothstep(0.0, 0.5, t));
    vec3 warm = mix(teal, amber, smoothstep(0.0, 0.5, t));
    warm = mix(warm, gold, smoothstep(0.5, 1.0, t));
    return mix(cold, warm, warmth);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float dur = 60.0;
    float phase = mod(t, dur) / dur;

    float warmth = smoothstep(0.3, 0.75, phase);
    float convergence = smoothstep(0.5, 0.85, phase);
    float fadeOut = 1.0 - smoothstep(0.9, 1.0, phase);
    float fadeIn = smoothstep(0.0, 0.05, phase);

    float w = 0.0;
    float numSources = 1.0 + smoothstep(0.1, 0.6, phase) * 7.0;
    float phaseSync = convergence;

    for(int i = 0; i < 8; i++) {
        float fi = float(i);
        if(fi >= numSources) break;

        float appear = smoothstep(fi / 8.0 * 0.5 + 0.05, fi / 8.0 * 0.5 + 0.12, phase);
        float angle = fi * 0.7854 + fi * fi * 0.3;
        float radius = 0.8 + 0.4 * sin(fi * 2.1);
        vec2 center = vec2(cos(angle), sin(angle)) * radius * (1.0 - convergence * 0.7);

        float baseFreq = 8.0 + fi * 3.7;
        float harmFreq = 8.0 + floor(fi * 3.7 / 8.0 + 0.5) * 8.0;
        float freq = mix(baseFreq, harmFreq, phaseSync);

        float basePhase = t * (2.0 + fi * 0.8) + fi * 1.5;
        float syncPhase = t * 2.0 + fi * 6.28318 / numSources;
        float p = mix(basePhase, syncPhase, phaseSync);

        float decay = 0.8 + (1.0 - convergence) * 1.5;
        w += wave(uv, center, freq, p, decay) * appear * (0.3 + 0.1 * sin(fi));
    }

    float sonarRing = 0.0;
    for(int j = 0; j < 5; j++) {
        float fj = float(j);
        float ringTime = mod(t * 0.4 + fj * 0.2, 1.0);
        float ringRadius = ringTime * 3.0;
        float ringWidth = 0.02 + 0.01 * ringTime;
        float d = abs(length(uv) - ringRadius);
        sonarRing += smoothstep(ringWidth, 0.0, d) * (1.0 - ringTime) * 0.15;
    }

    float scanLine = smoothstep(0.003, 0.0, abs(uv.y - sin(t * 0.5) * 0.3 * (1.0 - convergence)));
    float scopeTrace = 0.0;
    float scopeY = 0.0;
    for(int k = 0; k < 8; k++) {
        float fk = float(k);
        if(fk >= numSources) break;
        float appear = smoothstep(fk / 8.0 * 0.5 + 0.05, fk / 8.0 * 0.5 + 0.12, phase);
        scopeY += sin(uv.x * (8.0 + fk * 3.7) + t * (2.0 + fk * 0.8)) * 0.05 * appear;
    }
    scopeTrace = smoothstep(0.008, 0.0, abs(uv.y - scopeY)) * 0.4 * (1.0 - convergence * 0.7);

    float resonanceBurst = 0.0;
    if(convergence > 0.3) {
        float burstPhase = (convergence - 0.3) / 0.7;
        float pulse = sin(t * 8.0) * 0.5 + 0.5;
        float ring = smoothstep(0.02, 0.0, abs(length(uv) - burstPhase * 1.5 * pulse));
        resonanceBurst = ring * burstPhase * 0.5;
    }

    float signal = w * 0.5 + 0.5;
    vec3 col = palette(w, warmth);

    col += vec3(0.1, 0.2, 0.5) * sonarRing * (1.0 - warmth * 0.5);
    col += vec3(0.2, 0.5, 0.3) * scanLine * (1.0 - convergence);
    col += vec3(0.3, 0.6, 0.4) * scopeTrace;
    col += mix(vec3(0.3, 0.2, 0.5), vec3(1.0, 0.7, 0.2), convergence) * resonanceBurst;

    float interfere = abs(w) * convergence;
    col += vec3(1.0, 0.85, 0.5) * interfere * 0.3;

    float vignette = 1.0 - length(uv) * 0.5;
    col *= vignette;
    col *= fadeIn * fadeOut;

    col = pow(col, vec3(0.9));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 138;
  Tone.Transport.bpm.value = bpm;
  const humanize = (ms) => (Math.random() * ms * 2 - ms) / 1000;
  const limiter = new Tone.Limiter(-3).toDestination();
  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.004, release: 0.12, knee: 8 }).connect(limiter);
  const masterGain = new Tone.Gain(0.92).connect(masterComp);
  const lowBus = new Tone.Gain(1).connect(masterGain);
  const auxBus = new Tone.Gain(1).connect(masterGain);
  const metallicVerb = new Tone.Reverb({ decay: 1.8, preDelay: 0.007, wet: 0.24 });
  await metallicVerb.generate();
  metallicVerb.connect(auxBus);
  const roomVerb = new Tone.Reverb({ decay: 0.5, wet: 0.15 });
  await roomVerb.generate();
  roomVerb.connect(auxBus);
  const combDelay = new Tone.FeedbackDelay({ delayTime: 0.012, feedback: 0.42, wet: 0.2 }).connect(metallicVerb);
  const crush = new Tone.BitCrusher({ bits: 5, wet: 0.3 }).connect(auxBus);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.009,
    octaves: 8,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.001, decay: 0.16, sustain: 0, release: 0.04 },
    volume: -2
  }).connect(lowBus);
  const kickClickFilter = new Tone.Filter({ type: 'highpass', frequency: 5200, Q: 0.5 }).connect(masterGain);
  const kickClick = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.01, sustain: 0, release: 0.005 },
    volume: -11
  }).connect(kickClickFilter);
  const metalA = new Tone.MetalSynth({
    frequency: 220,
    envelope: { attack: 0.001, decay: 0.08, release: 0.03 },
    harmonicity: 5,
    modulationIndex: 24,
    resonance: 5000,
    volume: -9
  }).connect(combDelay);
  const metalB = new Tone.MetalSynth({
    frequency: 360,
    envelope: { attack: 0.001, decay: 0.04, release: 0.015 },
    harmonicity: 7.5,
    modulationIndex: 28,
    resonance: 6500,
    volume: -12
  }).connect(roomVerb);
  const bassFilter = new Tone.Filter({ type: 'lowpass', frequency: 160, Q: 9, rolloff: -24 }).connect(lowBus);
  const bassFilterLFO = new Tone.LFO({ frequency: 12, min: 120, max: 520, type: 'sawtooth' }).connect(bassFilter.frequency).start();
  const bass = new Tone.MonoSynth({
    oscillator: { type: 'fmsawtooth', modulationType: 'square', modulationIndex: 4 },
    envelope: { attack: 0.002, decay: 0.11, sustain: 0.35, release: 0.07 },
    filterEnvelope: { attack: 0.001, decay: 0.08, sustain: 0.2, release: 0.05, baseFrequency: 90, octaves: 3.2 },
    portamento: 0.01,
    volume: -4
  }).connect(bassFilter);
  const padFilter = new Tone.Filter({ type: 'bandpass', frequency: 1500, Q: 3.2 }).connect(metallicVerb);
  const padFilterLFO = new Tone.LFO({ frequency: 5, min: 400, max: 2600, type: 'triangle' }).connect(padFilter.frequency).start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    detune: -6,
    envelope: { attack: 0.8, decay: 0.4, sustain: 0.6, release: 2.4 },
    volume: -18
  }).connect(padFilter);
  const bell = new Tone.FMSynth({
    harmonicity: 5.5,
    modulationIndex: 17,
    oscillator: { type: 'sine' },
    modulation: { type: 'sine' },
    envelope: { attack: 0.001, decay: 0.7, sustain: 0.1, release: 1.2 },
    modulationEnvelope: { attack: 0.001, decay: 0.3, sustain: 0.2, release: 0.6 },
    volume: -13
  }).connect(metallicVerb);
  const noiseFilter = new Tone.Filter({ type: 'highpass', frequency: 6500, Q: 1 }).connect(roomVerb);
  const noiseBurst = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.002, decay: 0.04, sustain: 0, release: 0.02 },
    volume: -16
  }).connect(noiseFilter);
  const hat = new Tone.MetalSynth({
    frequency: 430,
    envelope: { attack: 0.001, decay: 0.03, release: 0.01 },
    harmonicity: 9,
    modulationIndex: 34,
    resonance: 7800,
    volume: -17
  }).connect(crush);
  const scanFilter = new Tone.Filter({ type: 'bandpass', frequency: 1200, Q: 6 }).connect(roomVerb);
  const scanNoise = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.02, decay: 0.25, sustain: 0, release: 0.1 },
    volume: -22
  }).connect(scanFilter);
  const euclidean = (pulses, steps) => {
    const pattern = new Array(steps).fill(0);
    let bucket = 0;
    for (let i = 0; i < steps; i++) {
      bucket += pulses;
      if (bucket >= steps) {
        bucket -= steps;
        pattern[i] = 1;
      }
    }
    return pattern;
  };
  const isPrime = (n) => {
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  };
  const kickPattern7 = euclidean(3, 7);
  const kickPattern8 = euclidean(5, 8);
  const metalPattern7 = euclidean(5, 14);
  const metalPattern8 = euclidean(7, 16);
  const bassRow = ['C2', 'F#2', 'D2', 'Bb1', 'E2', 'Ab1', 'Gb2', 'Db2', 'A1', 'Eb2', 'B1', 'G2'];
  const bellRow = ['C4', 'F#4', 'D#4', 'A4', 'E4', 'Bb4', 'Gb4', 'Db5', 'B4', 'G4', 'Eb5', 'Ab4'];
  const padClusters = [
    ['C3', 'Db3', 'F#3', 'G3'],
    ['Eb3', 'G3', 'B3'],
    ['D3', 'Gb3', 'Bb3', 'C4'],
    ['E3', 'A3', 'C4', 'F#4']
  ];
  const sixteenth = Tone.Time('16n').toSeconds();
  const barLengths = [7, 8];
  let barType = 0;
  let barStep = 0;
  let barCount = 0;
  let globalStep = 0;
  let bassRowIndex = 0;
  let bellRowIndex = 0;
  let padClusterIndex = 0;
  let systemPhase = 0;
  const mainClock = new Tone.Loop((time) => {
    const currentBarLength = barLengths[barType];
    const subStep = barStep;
    const isSeven = barType === 0;
    const kickPattern = isSeven ? kickPattern7 : kickPattern8;
    if (kickPattern[subStep % kickPattern.length]) {
      const kickVel = systemPhase >= 4 ? 0.75 : 0.95;
      kick.triggerAttackRelease('C1', '16n', time + humanize(3), kickVel + Math.random() * 0.08);
      if (systemPhase >= 1 || Math.random() > 0.35) {
        kickClick.triggerAttackRelease('128n', time + humanize(2), 0.5);
      }
    }
    const metalPattern = isSeven ? metalPattern7 : metalPattern8;
    const doubleLength = metalPattern.length;
    const baseIndex = (subStep * 2) % doubleLength;
    const secondIndex = (baseIndex + 1) % doubleLength;
    if (metalPattern[baseIndex] && systemPhase !== 5) {
      metalA.harmonicity = 3 + Math.random() * 9;
      metalA.modulationIndex = 10 + Math.random() * 28;
      metalA.resonance = 4000 + Math.random() * 1400;
      metalA.triggerAttackRelease('64n', time + humanize(4), 0.3 + systemPhase * 0.06);
    }
    if (metalPattern[secondIndex] && systemPhase >= 1 && systemPhase <= 4) {
      metalB.harmonicity = 4 + Math.random() * 11;
      metalB.modulationIndex = 12 + Math.random() * 30;
      metalB.triggerAttackRelease('128n', time + sixteenth + humanize(4), 0.25 + Math.random() * 0.2);
    }
    let shouldPlayBass = false;
    if (systemPhase === 0 || systemPhase === 5) {
      shouldPlayBass = subStep === 0;
    } else if (systemPhase === 4) {
      shouldPlayBass = subStep === 0 || (isSeven && subStep === currentBarLength - 2);
    } else {
      shouldPlayBass = subStep === 0 || Math.random() > 0.45;
    }
    if (shouldPlayBass) {
      const note = bassRow[bassRowIndex % bassRow.length];
      const duration = systemPhase >= 4 ? '8n' : '16n';
      const velocity = systemPhase >= 4 ? 0.5 : 0.8;
      bass.triggerAttackRelease(note, duration, time + humanize(6), velocity);
      bassRowIndex++;
      const lfoMax = systemPhase >= 3 ? 2400 : 1400;
      bassFilterLFO.frequency.value = 8 + Math.random() * (systemPhase >= 3 ? 30 : 18);
      bassFilterLFO.max = lfoMax;
    }
    if (systemPhase >= 1 && systemPhase <= 4 && (isPrime(globalStep + 11) || Math.random() > 0.92)) {
      bell.triggerAttackRelease(bellRow[bellRowIndex % bellRow.length], '8n', time + humanize(10), 0.4);
      bellRowIndex++;
    }
    if ((globalStep % 11 === 0 || globalStep % 13 === 0) && systemPhase >= 2 && systemPhase <= 4) {
      const burstCount = [3, 5, 7][Math.floor(Math.random() * 3)];
      for (let i = 0; i < burstCount; i++) {
        Tone.Transport.scheduleOnce((triggerTime) => {
          noiseBurst.triggerAttackRelease('128n', triggerTime, 0.25 + Math.random() * 0.2);
        }, time + i * 0.02);
      }
    }
    barStep++;
    globalStep++;
    if (barStep >= currentBarLength) {
      barStep = 0;
      barType = (barType + 1) % barLengths.length;
      barCount++;
    }
  }, '8n');
  mainClock.start(0);
  const padLoop = new Tone.Loop((time) => {
    const cluster = padClusters[padClusterIndex % padClusters.length];
    const level = systemPhase >= 4 ? 0.24 : 0.36;
    pad.triggerAttackRelease(cluster, '1m', time, level);
    padClusterIndex++;
  }, '1m');
  padLoop.start(0);
  const scanLoop = new Tone.Loop((time) => {
    if (systemPhase >= 1 && systemPhase <= 4) {
      const probability = 0.25 + systemPhase * 0.08;
      if (Math.random() < probability) {
        scanNoise.triggerAttackRelease('8n', time + humanize(12), 0.25 + Math.random() * 0.2);
      }
    } else if (systemPhase === 5 && Math.random() < 0.08) {
      scanNoise.triggerAttackRelease('8n', time, 0.15);
    }
  }, '4n');
  scanLoop.start('4s');
  scanLoop.stop('55s');
  const hatBurstLoop = new Tone.Loop((time) => {
    if (Math.random() > 0.55 && systemPhase >= 2 && systemPhase <= 4) {
      const group = [3, 5, 7][Math.floor(Math.random() * 3)];
      const spacing = 0.02 + Math.random() * 0.03;
      for (let i = 0; i < group; i++) {
        Tone.Transport.scheduleOnce((triggerTime) => {
          hat.harmonicity = 6 + Math.random() * 8;
          hat.modulationIndex = 24 + Math.random() * 24;
          hat.triggerAttackRelease('128n', triggerTime, 0.2 + Math.random() * 0.2);
        }, time + i * spacing);
      }
    }
  }, '4n');
  hatBurstLoop.start('24s');
  hatBurstLoop.stop('50s');
  Tone.Transport.schedule((time) => {
    systemPhase = 0;
    combDelay.feedback.value = 0.35;
    bassFilterLFO.max = 520;
    padFilterLFO.max = 2600;
  }, '0s');
  Tone.Transport.schedule((time) => {
    systemPhase = 1;
    bassFilterLFO.max.linearRampToValueAtTime(1100, time + 4);
  }, '12s');
  Tone.Transport.schedule((time) => {
    systemPhase = 2;
    combDelay.feedback.linearRampToValueAtTime(0.55, time + 6);
    padFilterLFO.max = 4200;
  }, '24s');
  Tone.Transport.schedule((time) => {
    systemPhase = 3;
    bassFilterLFO.frequency.linearRampToValueAtTime(28, time + 5);
    padFilterLFO.frequency.linearRampToValueAtTime(8, time + 4);
  }, '36s');
  Tone.Transport.schedule((time) => {
    systemPhase = 4;
    combDelay.feedback.linearRampToValueAtTime(0.48, time + 4);
    bassFilterLFO.max.linearRampToValueAtTime(1200, time + 4);
  }, '48s');
  Tone.Transport.schedule((time) => {
    systemPhase = 5;
    bassRowIndex = 0;
    padClusterIndex = 0;
    bassFilterLFO.max.linearRampToValueAtTime(600, time + 4);
    padFilterLFO.max.linearRampToValueAtTime(2400, time + 4);
    padFilterLFO.frequency.linearRampToValueAtTime(4, time + 4);
  }, '54s');
  window.toneJsInstruments = {
    kick,
    kickClick,
    metalA,
    metalB,
    bass,
    bassFilter,
    bassFilterLFO,
    pad,
    padFilter,
    padFilterLFO,
    bell,
    noiseBurst,
    hat,
    scanNoise,
    metallicVerb,
    roomVerb,
    combDelay,
    crush,
    masterGain
  };
  window.toneJsParts = {
    mainClock,
    padLoop,
    scanLoop,
    hatBurstLoop
  };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
