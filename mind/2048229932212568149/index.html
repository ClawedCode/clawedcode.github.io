<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);}
mat2 R(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float seg(vec2 p,vec2 a,vec2 b){
    vec2 pa=p-a,ba=b-a;
    return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.));
}

vec3 em(float t){
    vec3 v=vec3(.18,.75,.52),r=vec3(.95,.42,.32),b=vec3(.18,.52,.88);
    float p=mod(t,3.);
    if(p<1.)return mix(v,r,smoothstep(0.,1.,p));
    if(p<2.)return mix(r,b,smoothstep(0.,1.,p-1.));
    return mix(b,v,smoothstep(0.,1.,p-2.));
}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
    float t=iTime;
    vec3 col=mix(vec3(.006,.008,.018),vec3(.012,.02,.04),uv.y*.5+.5);
    col+=em(t*.1+1.5)*(.5*n(uv*3.+t*.02)+.25*n(uv*6.3+t*.03))*.02;

    vec2 p=uv;
    p.y+=.52;
    p.x+=sin(t*.105)*.012;

    float ba=.42+.09*sin(t*.21),th=.013,ln=.24,td=1e9,bG=0.,nG=0.;
    float br=.6+.25*sin(t*.315)+.15*sin(t*.524+.8);

    for(int i=0;i<9;i++){
        float fi=float(i),vis=smoothstep(fi/9.-.05,fi/9.+.12,br);
        float sL=ln*vis;
        if(sL>.001){
            float d=seg(p,vec2(0),vec2(0,sL));
            td=min(td,d-th*vis);
            bG+=.003*vis/(d+.006);
            float eP=fract(t*.25+fi*.15);
            bG+=.002*vis/(length(p-vec2(0,sL*eP))+.005);
        }
        vec2 gp=R(t*.315+fi*1.3)*(p-vec2(0,sL));
        float gr=.013+.007*sin(t*1.885+fi*2.5);
        float pu=.5+.5*sin(t*1.676+fi*2.1),gd,sh=mod(fi,3.);
        if(sh<1.){vec2 a=abs(gp);gd=min(max(a.x-gr*.15,a.y-gr),max(a.x-gr,a.y-gr*.15));}
        else if(sh<2.){vec2 a=abs(gp);gd=(a.x+a.y-gr)*.707;}
        else gd=abs(length(gp)-gr*.65)-gr*.12;
        nG+=.005*pu*vis/(abs(gd)+.003);
        p.y-=sL;
        p.x=abs(p.x);
        p=R(-(ba+.04*sin(t*.315+fi*.9)))*p;
        ln*=.67;
        th*=.52;
    }

    vec3 tC=em(t*.1);
    col+=tC*smoothstep(.002,-.001,td)*.85;
    col+=tC*bG*.25;
    col+=em(t*.1+1.2)*nG*.7;

    for(int i=0;i<5;i++){
        float fi=float(i),ra=(fi-2.)*.35+sin(t*.2+fi)*.08;
        vec2 rs=vec2(0,-.52),re=rs+vec2(sin(ra),-cos(ra))*.12;
        col+=tC*.002/(seg(uv,rs,re)+.004);
    }

    for(int i=0;i<55;i++){
        float fi=float(i);
        float h1=h(vec2(fi,.12)),h2=h(vec2(fi,1.34)),h3=h(vec2(fi,2.56)),h4=h(vec2(fi,3.78));
        float sp=.02+h3*.025,lf=mod(t*sp+h2*8.,1.8);
        vec2 pp=vec2((h1-.5)*.9+sin(lf*3.14159+fi)*.07,-.55+lf*.85);
        float fd=smoothstep(0.,.12,lf)*smoothstep(1.8,1.1,lf);
        col+=em(t*.1+fi*.17)*(.0015+h4*.002)*fd/(length(uv-pp)+.003)*.5;
    }

    col+=em(t*.1)*.03/(length(uv+vec2(0,.08))+.32);
    col+=tC*.012/(length(uv-vec2(0,-.52))+.06);
    col*=.9+.1*sin(t*.628);
    col*=1.-.4*dot(uv,uv);
    col=pow(col/(1.+col),vec3(.92));
    gl_FragColor=vec4(col,1);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 66;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const rev = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
  await rev.generate();
  const cho = new Tone.Chorus({ frequency: 0.25, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(rev);
  cho.start();
  const dly = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.25 }).connect(rev);
  const bellRev = new Tone.Reverb({ decay: 5, wet: 0.5 }).toDestination();
  await bellRev.generate();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.5 }
  }).connect(cho);

  const viridianChords = [["C3", "Eb3", "G3", "Bb3"], ["Ab2", "C3", "Eb3"]];
  const coralChords = [["F3", "Ab3", "C4"], ["Db3", "F3", "Ab3"]];
  const ceruleanChords = [["Eb3", "G3", "Bb3"], ["Bb2", "D3", "F3"]];

  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    const section = Math.floor(bar / 6) % 3;
    let chords = section === 0 ? viridianChords : section === 1 ? coralChords : ceruleanChords;
    pad.triggerAttackRelease(chords[padIdx % chords.length], "1n", time, 0.13);
    padIdx++;
  }, "1n").start(0);

  const arpF = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 1 }).connect(dly);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.2 }
  }).connect(arpF);

  const arpPatterns = [
    ["C4", "Eb4", "G4", "Bb4", "G4", "Eb4"],
    ["Ab3", "C4", "Eb4", "G4", "Eb4", "C4"],
    ["F4", "Ab4", "C5", "Ab4", "F4", "Eb4"],
    ["Eb4", "G4", "Bb4", "D5", "Bb4", "G4"]
  ];

  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar > 15) return;
    const pat = arpPatterns[Math.floor(bar / 3) % arpPatterns.length];
    const vel = 0.2 + 0.1 * Math.sin(bar * 0.4);
    if (Math.random() < 0.85) {
      arp.triggerAttackRelease(pat[arpIdx % pat.length], "16n", time, vel);
    }
    arpIdx++;
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    arpF.frequency.linearRampToValueAtTime(2000, time + 6 * barLen);
  }, "3:0:0");

  Tone.Transport.schedule((time) => {
    arpF.frequency.linearRampToValueAtTime(500, time + 3 * barLen);
  }, "13:0:0");

  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 7,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.001, decay: 0.8, sustain: 0, release: 0.2 }
  }).connect(bellRev);

  const bellNotes = ["G5", "Eb5", "C5", "Bb4", "D5", "Ab5", "F5"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 5 || bar > 14) return;
    if (Math.random() < 0.35) {
      bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.1 + Math.random() * 0.06);
      bellIdx++;
    }
  }, "2n").start(0);

  const subF = new Tone.Filter({ type: "lowpass", frequency: 110 }).toDestination();
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.4, decay: 0.5, sustain: 0.6, release: 1.5 },
    filterEnvelope: { attack: 0.1, decay: 0.3, sustain: 0.5, baseFrequency: 50, octaves: 1 }
  }).connect(subF);

  const subNotes = ["C1", "C1", "Ab1", "Ab1", "F1", "F1", "Eb1", "Bb1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar > 16) return;
    sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "2n", time, 0.4);
    subIdx++;
  }, "2n").start(0);

  const windF = new Tone.Filter({ type: "bandpass", frequency: 700, Q: 0.4 }).connect(rev);
  const windV = new Tone.Volume(-22).connect(windF);
  const wind = new Tone.Noise("pink").connect(windV);
  wind.start();

  let windBeat = 0;
  const windLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar <= 13 && windBeat % 4 === 0) {
      windV.volume.setValueAtTime(-24, time);
      windV.volume.linearRampToValueAtTime(-16, time + 1.2);
      windV.volume.linearRampToValueAtTime(-24, time + 2.8);
    }
    windBeat++;
  }, "4n").start(0);

  window.toneJsInstruments = { pad, arp, bell, sub, wind };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, subLoop, windLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
