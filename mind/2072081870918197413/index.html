<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(float n) { return fract(sin(n) * 43758.5453); }

float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float n = i.x + i.y * 157.0;
    return mix(mix(hash(n), hash(n + 1.0), f.x),
               mix(hash(n + 157.0), hash(n + 158.0), f.x), f.y);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float cycle = mod(t, 20.0) / 20.0;

    float converge = smoothstep(0.0, 0.4, cycle);
    float fuse = smoothstep(0.38, 0.5, cycle) * (1.0 - smoothstep(0.52, 0.65, cycle));
    float unravel = smoothstep(0.6, 1.0, cycle);
    float spread = max(1.0 - converge, unravel);

    vec3 col = vec3(0.012, 0.006, 0.025);

    vec2 wuv = uv + 0.03 * vec2(noise(uv * 5.0 + t * 0.12), noise(uv * 5.0 + t * 0.12 + 77.0));
    vec2 g = abs(fract(wuv * 6.0) - 0.5);
    float latticeBoost = 1.0 + fuse * 2.5;
    col += vec3(0.035, 0.025, 0.06) * smoothstep(0.01, 0.0, min(g.x, g.y)) * (0.35 + 0.15 * sin(t * 0.35)) * latticeBoost;

    vec2 nid = floor(wuv * 6.0);
    float nh = hash(nid.x * 31.0 + nid.y * 137.0);
    vec2 nc = (nid + 0.5) / 6.0;
    float nd = length(wuv - nc);
    col += vec3(0.05, 0.04, 0.08) * smoothstep(0.02, 0.0, nd) * (0.3 + 0.2 * sin(t * 1.5 + nh * 6.283));

    vec3 tg = vec3(0.0);

    for(float i = 0.0; i < 100.0; i++) {
        float s = i / 100.0;
        float sw = 1.0 - s * 0.6;

        vec2 o1 = 0.65 * vec2(cos(0.4), sin(0.4));
        vec2 o2 = 0.7 * vec2(cos(2.494), sin(2.494));
        vec2 o3 = 0.6 * vec2(cos(4.589), sin(4.589));

        vec2 p1 = mix(o1, vec2(0.0), s) * spread;
        vec2 p2 = mix(o2, vec2(0.0), s) * spread;
        vec2 p3 = mix(o3, vec2(0.0), s) * spread;

        float w = sw * 0.06;
        p1 += w * vec2(sin(s * 18.0 + t * 1.5), cos(s * 14.0 + t * 1.2));
        p2 += w * 1.3 * vec2(cos(s * 20.0 + t * 2.2), sin(s * 16.0 + t * 1.8));
        p3 += w * 1.15 * vec2(sin(s * 22.0 + t * 0.9 + 2.0), cos(s * 17.0 + t * 1.1));

        float d1 = length(uv - p1);
        float d2 = length(uv - p2);
        float d3 = length(uv - p3);

        float pulse1 = 0.6 + 0.4 * sin(s * 25.0 - t * 3.0);
        float pulse2 = 0.2 + 0.8 * pow(max(sin(s * 12.0 - t * 4.5), 0.0), 3.0);
        float pulse3 = 0.5 + 0.5 * sin(s * 18.0 - t * 2.0 + sin(s * 7.0 + t * 0.5));

        tg += vec3(0.15, 0.55, 0.9) * pulse1 * 0.001 / (d1 + 0.002) * sw;
        tg += vec3(1.0, 0.55, 0.1) * pulse2 * 0.001 / (d2 + 0.002) * sw;
        tg += vec3(0.6, 0.25, 0.9) * pulse3 * 0.001 / (d3 + 0.002) * sw;
    }

    col += tg;

    float cd = length(uv);
    float fp = fuse * (0.85 + 0.25 * sin(t * 10.0));
    col += vec3(0.95, 0.85, 1.0) * fp * 0.012 / (cd * cd + 0.001);
    col += vec3(0.4, 0.35, 0.65) * fuse * 0.003 / (abs(cd - fuse * 0.35) + 0.005);
    col += vec3(0.3, 0.25, 0.5) * fuse * 0.002 / (abs(cd - fuse * 0.55) + 0.006);

    float gt = step(0.92, noise(vec2(floor(t * 2.5), 0.5)));
    if(gt > 0.5) {
        float n = noise(vec2(uv.y * 30.0, t * 10.0));
        col = mix(col, col.grb * 1.3, n * 0.5);
        col += vec3(0.1, 0.03, 0.18) * step(0.47, abs(fract(uv.y * 40.0 + t * 5.0) - 0.5)) * 0.4;
        col.r *= 1.0 + 0.12 * sin(uv.y * 50.0 + t * 20.0);
    }

    col *= 0.92 + 0.08 * sin(t * 0.85);
    col *= 1.0 - 0.3 * dot(uv, uv);
    col = col / (col + 0.7);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    var bpm = 72;
    Tone.Transport.bpm.value = bpm;
    var barSec = 60 / bpm * 4;

    var masterRev = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).toDestination();
    await masterRev.generate();
    var delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.4, wet: 0.25 }).connect(masterRev);

    var heart = new Tone.MembraneSynth({
        pitchDecay: 0.06, octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.008, decay: 0.35, sustain: 0, release: 0.15 }
    }).toDestination();

    var heartBeat = 0;
    var heartLoop = new Tone.Loop(function(time) {
        var bar = Math.floor(heartBeat / 2) % 6;
        var vel = (bar >= 4 && bar < 5) ? 0.85 : (bar >= 5 ? 0.4 : 0.65);
        heart.triggerAttackRelease("C1", "4n", time, vel);
        heartBeat++;
    }, "2n").start(0);

    var flareFilter = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(delay);
    var flare = new Tone.FMSynth({
        harmonicity: 2.5, modulationIndex: 5,
        oscillator: { type: "sine" },
        envelope: { attack: 0.003, decay: 0.12, sustain: 0.08, release: 0.25 },
        modulation: { type: "triangle" },
        modulationEnvelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
    }).connect(flareFilter);

    var flareNotes = ["A3", "C4", "E4", "A4", "G4", "E4", "C4", "B3"];
    var flareStep = 0;
    var flareLoop = new Tone.Loop(function(time) {
        var bar = Math.floor(flareStep / 8) % 6;
        if (bar >= 2 && bar < 5) {
            var progress = (bar - 2) / 3.0;
            flareFilter.frequency.value = 500 + progress * 3500;
            flare.triggerAttackRelease(
                flareNotes[flareStep % flareNotes.length],
                "16n", time, 0.15 + progress * 0.45
            );
        }
        flareStep++;
    }, "8n").start(0);

    var echoChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(delay);
    echoChorus.start();
    var echoPad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.0, decay: 0.6, sustain: 0.4, release: 2.5 }
    }).connect(echoChorus);
    echoPad.volume.value = -10;

    var chords = [
        ["A3", "C4", "E4"], ["F3", "A3", "C4"],
        ["G3", "B3", "D4"], ["E3", "G3", "B3"]
    ];
    var chordStep = 0;
    var echoLoop = new Tone.Loop(function(time) {
        var bar = Math.floor(chordStep / 2) % 6;
        var vel = (bar >= 3 && bar < 5) ? 0.45 : 0.18;
        echoPad.triggerAttackRelease(chords[chordStep % chords.length], "1n", time, vel);
        chordStep++;
    }, "2n").start(0);

    var bell = new Tone.FMSynth({
        harmonicity: 5, modulationIndex: 12,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 2.0, sustain: 0, release: 0.8 },
        modulation: { type: "sine" }
    }).connect(masterRev);
    bell.volume.value = -8;

    for (var c = 0; c < 3; c++) {
        var peak = c * 6 * barSec + 4 * barSec;
        (function(p) {
            Tone.Transport.schedule(function(time) {
                bell.triggerAttackRelease("A5", "4n", time, 0.55);
            }, p);
            Tone.Transport.schedule(function(time) {
                bell.triggerAttackRelease("E5", "4n", time, 0.35);
            }, p + 0.4);
        })(peak);
    }

    var noiseHPF = new Tone.Filter({ type: "highpass", frequency: 3000 }).connect(masterRev);
    var noiseSynth = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 0.2, release: 2.0 }
    }).connect(noiseHPF);
    noiseSynth.volume.value = -22;

    for (var c = 0; c < 3; c++) {
        (function(idx) {
            Tone.Transport.schedule(function(time) {
                noiseSynth.triggerAttackRelease(3.0, time, 0.25);
            }, idx * 6 * barSec + 3 * barSec);
        })(c);
    }

    window.toneJsInstruments = { heart: heart, flare: flare, echoPad: echoPad, bell: bell, noiseSynth: noiseSynth };
    window.toneJsParts = { heartLoop: heartLoop, flareLoop: flareLoop, echoLoop: echoLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
