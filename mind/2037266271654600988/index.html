<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for(int i = 0; i < 3; i++) {
    v += a * noise(p);
    p = rot * p * 2.0;
    a *= 0.5;
  }
  return v;
}

vec3 palette(float t) {
  vec3 a = vec3(0.05, 0.02, 0.12);
  vec3 b = vec3(0.1, 0.15, 0.4);
  vec3 c = vec3(0.2, 0.3, 0.6);
  vec3 d = vec3(0.9, 0.95, 1.0);
  float phase = mod(t, 1.0);
  if(phase < 0.33) return mix(a, b, phase * 3.0);
  if(phase < 0.66) return mix(b, c, (phase - 0.33) * 3.0);
  return mix(c, d, (phase - 0.66) * 3.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  float loop = mod(t, 75.0) / 75.0;
  
  vec3 col = vec3(0.02, 0.01, 0.06);
  
  float turbulence = fbm(uv * 3.0 + t * 0.15);
  float noiseField = fbm(uv * 2.0 - t * 0.1 + turbulence * 0.5);
  
  col += palette(noiseField * 0.5 + 0.2) * noiseField * 0.3;
  
  float signalDensity = 0.0;
  float clarity = 0.0;
  
  for(int i = 0; i < 200; i++) {
    float fi = float(i);
    float seed = hash(vec2(fi * 0.73, fi * 0.29));
    float lifetime = mod(t * (0.3 + seed * 0.4) + seed * 100.0, 8.0);
    float age = lifetime / 8.0;
    
    vec2 origin = vec2(
      hash(vec2(fi, 0.0)) * 2.0 - 1.0,
      hash(vec2(0.0, fi)) * 2.0 - 1.0
    ) * 1.2;
    
    vec2 flowDir = vec2(
      fbm(origin * 2.0 + t * 0.1) - 0.5,
      fbm(origin * 2.0 + t * 0.1 + 100.0) - 0.5
    );
    
    vec2 pos = origin + flowDir * lifetime * 0.3;
    
    float noiseDisplace = fbm(pos * 4.0 + t * 0.5) - 0.5;
    pos += noiseDisplace * 0.15;
    
    float dist = length(uv - pos);
    
    float coherence = sin(lifetime * 3.14159 * 0.5);
    coherence = coherence * coherence;
    
    float size = mix(0.008, 0.025, coherence) * (1.0 + seed * 0.5);
    
    float particle = smoothstep(size, size * 0.3, dist);
    
    float brightness = coherence * (1.0 - age * 0.3);
    
    vec3 particleCol = mix(
      vec3(0.1, 0.2, 0.5),
      vec3(0.9, 0.95, 1.0),
      coherence
    );
    
    col += particleCol * particle * brightness * 0.08;
    signalDensity += particle * 0.5;
    clarity += particle * coherence;
  }
  
  float coherenceWave = sin(t * 0.4) * 0.5 + 0.5;
  
  for(int j = 0; j < 8; j++) {
    float fj = float(j);
    float phase = mod(t * 0.15 + fj * 0.125, 1.0);
    float waveCoherence = sin(phase * 3.14159);
    waveCoherence = pow(waveCoherence, 3.0);
    
    if(waveCoherence > 0.3) {
      vec2 center = vec2(
        sin(fj * 2.4 + t * 0.2) * 0.4,
        cos(fj * 1.7 + t * 0.15) * 0.4
      );
      
      float radius = 0.1 + waveCoherence * 0.3;
      float thickness = 0.02 + waveCoherence * 0.03;
      
      float ring = abs(length(uv - center) - radius);
      float ringGlow = smoothstep(thickness, 0.0, ring);
      
      float segments = 8.0;
      float angle = atan(uv.y - center.y, uv.x - center.x);
      float segmentMask = smoothstep(0.4, 0.6, sin(angle * segments + t + fj));
      
      col += vec3(0.4, 0.6, 1.0) * ringGlow * waveCoherence * segmentMask * 0.5;
    }
  }
  
  for(int k = 0; k < 30; k++) {
    float fk = float(k);
    float streamPhase = mod(t * 0.8 + fk * 0.33, 3.0);
    
    if(streamPhase < 2.0) {
      vec2 streamStart = vec2(
        hash(vec2(fk, 100.0)) * 2.0 - 1.0,
        hash(vec2(100.0, fk)) * 2.0 - 1.0
      ) * 0.8;
      
      vec2 streamDir = normalize(vec2(
        hash(vec2(fk, 200.0)) - 0.5,
        hash(vec2(200.0, fk)) - 0.5
      ));
      
      vec2 streamPos = streamStart + streamDir * streamPhase * 0.4;
      
      float streamDist = length(uv - streamPos);
      float streamGlow = exp(-streamDist * 40.0);
      
      float packetPulse = sin(streamPhase * 10.0) * 0.5 + 0.5;
      
      col += vec3(0.2, 0.5, 0.9) * streamGlow * packetPulse * 0.15;
    }
  }
  
  float staticNoise = hash(uv * 100.0 + t * 10.0);
  float staticIntensity = 0.03 * (1.0 - coherenceWave * 0.5);
  col += staticNoise * staticIntensity;
  
  float interference = sin(uv.y * 200.0 + t * 5.0) * 0.02;
  interference *= (1.0 - coherenceWave);
  col += interference;
  
  float vignette = 1.0 - length(uv) * 0.6;
  vignette = smoothstep(0.0, 1.0, vignette);
  col *= vignette;
  
  col = pow(col, vec3(0.9));
  col = clamp(col, 0.0, 1.0);
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const compressor = new Tone.Compressor({ threshold: -20, ratio: 8, attack: 0.005, release: 0.2 }).toDestination();

  const subBassFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 1.0 }).connect(compressor);
  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.1, decay: 0.3, sustain: 0.6, release: 0.8 }
  }).connect(subBassFilter);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.4, release: 2.0 }
  }).connect(padChorus);

  const signalDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.35 }).connect(masterReverb);
  const signalSynth = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 0.3, sustain: 0.1, release: 0.5 },
    modulation: { type: "triangle" }
  }).connect(signalDelay);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 0.5 }).connect(masterReverb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.5, decay: 1.0, sustain: 0.2, release: 1.5 }
  }).connect(noiseFilter);

  const bellReverb = new Tone.Reverb({ decay: 4.0, wet: 0.5 }).connect(compressor);
  await bellReverb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 4,
    modulationIndex: 15,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.5, sustain: 0, release: 0.8 }
  }).connect(bellReverb);

  const pulseFilter = new Tone.Filter({ type: "lowpass", frequency: 400, Q: 2 }).connect(compressor);
  const pulse = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.002, decay: 0.1, sustain: 0, release: 0.05 }
  }).connect(pulseFilter);

  const subNotes = ["A1", "A1", "E1", "E1", "F1", "F1", "G1", "G1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 2 && bar < 18) {
      subBass.triggerAttackRelease(subNotes[subIndex % subNotes.length], "2n", time, 0.6);
    }
    subIndex++;
  }, "2n").start(0);

  const padChords = [
    ["A2", "E3", "A3"],
    ["F2", "C3", "F3"],
    ["G2", "D3", "G3"],
    ["E2", "B2", "E3"]
  ];
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    let vol = 0.12;
    if (bar < 2) vol = 0.08;
    if (bar >= 16) vol = 0.06;
    pad.triggerAttackRelease(padChords[padIndex % padChords.length], "1n", time, vol);
    padIndex++;
  }, "1n").start(0);

  const signalNotes = ["A4", "E5", "C5", "G4", "F4", "A4", "E4", "B4"];
  let signalIndex = 0;
  const signalLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 16) {
      const coherence = Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.4) * 0.5 + 0.5;
      if (Math.random() < coherence * 0.7) {
        const vol = 0.15 + coherence * 0.2;
        signalSynth.triggerAttackRelease(signalNotes[signalIndex % signalNotes.length], "16n", time, vol);
      }
    }
    signalIndex++;
  }, "8n").start(0);

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar < 17) {
      const intensity = 0.08 + Math.sin(Tone.Transport.getSecondsAtTime(time) * 0.3) * 0.04;
      if (Math.random() < 0.3) {
        noise.triggerAttackRelease("2n", time, intensity);
      }
    }
  }, "2n").start(0);

  const bellNotes = ["A5", "E6", "C6", "G5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 6 && bar < 14 && bellIndex % 4 < 1) {
      bell.triggerAttackRelease(bellNotes[bellIndex % bellNotes.length], "8n", time, 0.25);
    }
    bellIndex++;
  }, "4n").start(0);

  let pulseIndex = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 14) {
      const pattern = [1, 0, 1, 0, 0, 1, 0, 1];
      if (pattern[pulseIndex % 8]) {
        pulse.triggerAttackRelease("A3", "32n", time, 0.2);
      }
    }
    pulseIndex++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "14:0:0");

  window.toneJsInstruments = { subBass, pad, signalSynth, noise, bell, pulse };
  window.toneJsParts = { subLoop, padLoop, signalLoop, noiseLoop, bellLoop, pulseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
