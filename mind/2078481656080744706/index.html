<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

#define PI 3.14159265
#define MAX_STEPS 100
#define MAX_DIST 50.0
#define SURF_DIST 0.001

mat2 rot(float a) { float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

float sdTaperedPole(vec3 p, float h, float rBot, float rTop) {
  float r = mix(rBot, rTop, clamp(p.y/h, 0.0, 1.0));
  vec2 q = vec2(length(p.xz) - r, p.y - h/2.0);
  float d1 = length(max(q, 0.0));
  float d2 = max(q.y, q.x - r);
  float d3 = max(length(q) - rTop, -p.y - h/2.0);
  return max(d2, -d1); // standard SDF return
}

float sdCone(vec3 p, float h, float r) {
  vec2 q = vec2(length(p.xz), p.y);
  float f = r * h / (r + h * tan(0.1)); // taper factor
  return length(q * vec2(1.0, -1.0) - vec2(r, f)) * sign(q.y);
}

// Custom SDF for the tower: A twisted, eroded cylinder with a base
float mapTower(vec3 p) {
  // Base platform
  float base = max(length(p.xz) - 1.5, -p.y - 0.2);
  
  // Main shaft: Twisted tapered cylinder
  float h = 4.0;
  float r = 0.4;
  float taper = 0.1;
  
  // Apply twist based on height
  float c = cos(-PI * p.y / h);
  float s = sin(-PI * p.y / h);
  vec2 xz = vec2(c, -s) * p.xz;
  vec3 q = vec3(xz, p.y);
  
  // Tapered radius
  float rNorm = (q.y + h/2.0) / h;
  float rT = mix(r, taper, rNorm);
  
  float cone = max(length(q.xz) - rT, q.y);
  float cyl = length(q.xz) - rT;
  
  // Eroded holes (phantom signals)
  float hole = 0.0;
  for(int i=0; i<3; i++) {
    float fi = float(i);
    float angle = fi * 2.094 + iTime * 0.2;
    vec3 offset = vec3(cos(angle)*0.3, q.y*0.5 + sin(iTime*0.5)*0.5, sin(angle)*0.3);
    float d = length(q - offset) - 0.1;
    hole = max(hole, d);
  }
  
  float tower = min(cyl, cone);
  return max(tower, hole);
}

float map(vec3 p) {
  // Ground grid
  float ground = p.y + 2.0;
  
  // Tower instance
  vec3 tP = p;
  tP.xz = rot(iTime * 0.1) * tP.xz;
  float tower = mapTower(tP);
  
  return min(ground, tower);
}

vec3 calcNormal(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  float m = map(p);
  return normalize(vec3(
    map(p + e.xyy) - m,
    map(p + e.yxy) - m,
    map(p + e.yyx) - m
  ));
}

vec3 render(vec3 ro, vec3 rd) {
  float t = 0.0;
  float d;
  float objId = 0.0;
  
  // Raymarch
  for(int i=0; i<MAX_STEPS; i++) {
    d = map(ro + rd * t);
    if(d < SURF_DIST || t > MAX_DIST) break;
    t += d;
  }
  
  if(d < SURF_DIST) {
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p);
    vec3 r = reflect(rd, n);
    
    // Lighting
    vec3 lightDir = normalize(vec3(1.0, 1.0, -0.5));
    float diff = max(dot(n, lightDir), 0.0);
    float spec = pow(max(dot(r, lightDir), 0.0), 32.0);
    
    // Material: Oxidized copper (teal/green) and rust (orange/red)
    // Use height and normal to blend
    float pat = sin(p.y * 10.0 + p.x * 5.0) * 0.5 + 0.5;
    vec3 copper = vec3(0.2, 0.6, 0.5); // Teal
    vec3 rust = vec3(0.8, 0.3, 0.1);   // Rust
    
    // Phantom signal glow
    float glow = pow(max(dot(rd, n), 0.0), 3.0) * 0.5;
    
    vec3 col = mix(copper, rust, pat);
    col = col * (diff * 0.8 + 0.2) + spec * 0.5;
    col += vec3(0.1, 0.8, 1.0) * glow * (sin(iTime * 2.0 + p.y * 5.0) * 0.5 + 0.5);
    
    // Fog
    vec3 fog = vec3(0.05, 0.02, 0.1);
    col = mix(col, fog, 1.0 - exp(-0.05 * t));
    
    return col;
  }
  
  return vec3(0.02, 0.01, 0.05); // Void background
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;
  
  // Camera orbit
  vec3 ro = vec3(0.0, 2.0, 6.0);
  ro.xz = rot(t * 0.05) * ro.xz;
  vec3 target = vec3(0.0, 1.0, 0.0);
  vec3 forward = normalize(target - ro);
  vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, forward);
  vec3 rd = normalize(forward + uv.x * right + uv.y * up);
  
  vec3 col = render(ro, rd);
  
  // Post-processing: CRT scanlines and slight vignette
  float scan = sin(uv.y * iResolution.y * 0.5) * 0.1 + 0.9;
  col *= scan;
  
  float vig = 1.0 - dot(uv * 0.5, uv * 0.5);
  col *= vig;
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  // === SETUP ===
  // Emotional Target: Clinical, Strategic, Cold Precision
  // Style: Glitch-hop, Minimal Techno, High-contrast, Calculated
  const bpm = 95;
  Tone.Transport.bpm.value = bpm;
  // Video Duration is 60s
  const totalBars = Math.round(60 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;

  // === FX BUSES ===
  const masterReverb = new Tone.Reverb({ decay: 1.5, wet: 0.15 }).toDestination();
  await masterReverb.generate();

  // Master Bus Processing
  const masterCompressor = new Tone.Compressor({ threshold: -12, ratio: 6, attack: 0.005, release: 0.1 }).toDestination();
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 18000, Q: 1 }).connect(masterCompressor);
  
  // Delay for "Strategic" echoes
  const echo = new Tone.FeedbackDelay({ 
    delayTime: "8n.", 
    feedback: 0.35, 
    wet: 0.25 
  }).connect(masterFilter);

  // === INSTRUMENTS ===

  // 1. RHYTHM: Glitchy, metallic percussion (No heavy kick, focus on precision)
  const hat = new Tone.MetalSynth({
    frequency: 400,
    envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 64,
    resonance: 4000,
    volume: -10
  }).connect(masterFilter);

  // Percussion pattern: Off-beat hi-hats, sparse snare/rim
  let beatCount = 0;
  const beatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    
    // Hi-hats: Always present but sparse
    if (beatCount % 2 === 0) {
      hat.triggerAttackRelease("32n", time + H(2), 0.4);
    }

    // Snare/Rim on 2 and 4 (Backbeat)
    const currentBeat = beatCount % 4;
    if ((currentBeat === 1 || currentBeat === 3) && bar >= totalBars * 0.05) {
      // Use NoiseSynth for a tight, dry "click"
      noise.triggerAttackRelease("16n", time, 0.6);
    }

    // Kick: Minimal, only on 1 and occasional syncopations
    if (currentBeat === 0) {
      kick.triggerAttackRelease("C2", "8n", time + H(3), 0.8);
    }

    beatCount++;
  }, "16n").start(0);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.05 }
  }).toDestination();

  const noise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
  }).toDestination();

  // 2. BASS: Deep, Subby, MonoSynth with heavy filtering
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 2 }).connect(masterFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0.4, release: 0.2 },
    filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.1, baseFrequency: 100, octaves: 1.5 }
  }).connect(bassFilter);

  // 3. MELODY: Cold, detuned Pluck. PolySynth so the melody loop can trigger
  // 2-note chords (["G4","Bb4"]) — a monophonic Synth throws on array notes.
  const pluck = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.5 }
  }).connect(echo);

  // 4. ATMOSPHERE: High-passed noise bed for texture
  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterFilter);
  const noiseGen = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.0, decay: 2.0, sustain: 0.5, release: 2.0 }
  }).connect(noiseHPF);

  // === PATTERNS & ARRANGEMENT ===

  // Bass Pattern: Sparse, rhythmic, low frequency
  const bassNotes = ["C1", "G1", "A#1", "F1"];
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    
    // Bass enters after intro
    if (bar >= totalBars * 0.05 && bar < totalBars * 0.85) {
      // Play every 4 beats (quarter notes) or slightly syncopated
      const currentBeat = beatCount % 4; // beatCount from beatLoop
      if (currentBeat === 0 || (currentBeat === 1 && Math.random() > 0.7)) {
        bass.triggerAttackRelease(bassNotes[bassIndex % bassNotes.length], "4n", time, 0.7);
        bassIndex++;
      }
    }
  }, "8n").start(0);

  // Melody: Glitchy, algorithmic sequence
  // Uses a "strategic" set of notes that imply a cold, minor scale
  const melodyPool = [
    ["C5", "Eb5"], ["Ab4", "C5"], ["F4", "Ab4"], ["G4", "Bb4"],
    ["Db5", "F5"], ["Ab4", "Bb4"], ["F4", "G4"], ["Eb5", "F5"]
  ];
  let melodyIndex = 0;
  let seqStep = 0;
  const melodyLoop = new Tone.Loop((time) => {
    const bar = barAt(time);

    // Melody enters at 10%
    if (bar >= totalBars * 0.10 && bar < totalBars * 0.80) {
      // Randomized density: sometimes play a chord, sometimes a single note, sometimes silence
      const r = Math.random();
      
      if (r > 0.3) {
        // Play a note from the pool
        const noteGroup = melodyPool[Math.floor(Math.random() * melodyPool.length)];
        // Pick one or two notes from the group
        if (r > 0.7 && noteGroup.length > 1) {
          pluck.triggerAttackRelease(noteGroup, "8n", time + H(5), 0.5);
        } else {
          pluck.triggerAttackRelease(noteGroup[0], "8n", time + H(5), 0.5);
        }
      }
    }
    seqStep++;
  }, "8n").start(0);

  // === DYNAMIC AUTOMATION ===

  // Filter Sweep for Bass (Builds tension then releases)
  Tone.Transport.schedule((time) => {
    // Open filter during build
    bassFilter.frequency.linearRampToValueAtTime(2400, time + totalBars * 0.3 * secPerBar);
  }, totalBars * 0.10 * secPerBar);

  Tone.Transport.schedule((time) => {
    // Close filter before wind down
    bassFilter.frequency.linearRampToValueAtTime(600, time + totalBars * 0.2 * secPerBar);
  }, totalBars * 0.75 * secPerBar);

  // Melody Density Automation (More notes as track progresses)
  Tone.Transport.schedule((time) => {
    pluck.volume.setValueAtTime(-10, time);
  }, totalBars * 0.10 * secPerBar);

  Tone.Transport.schedule((time) => {
    pluck.volume.setValueAtTime(-14, time); // Quieter at end
  }, totalBars * 0.80 * secPerBar);

  // Noise Bed (Atmosphere) - Swells and fades
  Tone.Transport.schedule((time) => {
    noiseGen.triggerAttackRelease(totalBars * 0.4 * secPerBar, time);
  }, totalBars * 0.10 * secPerBar);

  // Additional texture layer: High pitched glitch blips
  const blip = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
  }).connect(echo);
  
  let blipIndex = 0;
  const blipLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.20 && bar < totalBars * 0.70) {
      if (Math.random() > 0.6) {
        // Random high notes
        const highNotes = ["C6", "Eb6", "Ab5", "Bb5"];
        blip.triggerAttackRelease(highNotes[Math.floor(Math.random() * highNotes.length)], "32n", time, 0.2);
      }
    }
  }, "16n").start(0);

  // === STORE REFERENCES ===
  window.toneJsInstruments = { 
    kick, 
    hat, 
    noise, 
    bass, 
    pluck, 
    noiseGen, 
    blip 
  };
  
  window.toneJsParts = { 
    beatLoop, 
    bassLoop, 
    melodyLoop, 
    blipLoop 
  };
};


  </script>
