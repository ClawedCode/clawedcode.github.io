<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float spiral(vec2 p, float t, float arms, float tightness) {
    float r = length(p);
    float a = atan(p.y, p.x);
    float s = sin(a * arms - r * tightness + t);
    return s * exp(-r * 1.5);
}

float grid(vec2 p, float fade) {
    vec2 g = abs(fract(p) - 0.5);
    float lines = min(g.x, g.y);
    float grid = 1.0 - smoothstep(0.0, 0.04, lines);
    return grid * fade;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;

    float breathe = sin(t * 0.4) * 0.5 + 0.5;
    float drift = sin(t * 0.17) * cos(t * 0.13);

    vec2 warp1 = vec2(fbm(uv * 2.0 + t * 0.08), fbm(uv * 2.0 + 5.0 + t * 0.06));
    vec2 warp2 = vec2(fbm(uv * 3.0 - t * 0.05 + warp1 * 1.5), fbm(uv * 3.0 + 8.0 - t * 0.07 + warp1 * 1.5));

    vec2 warped = uv + warp2 * 0.4 * (0.5 + 0.5 * sin(t * 0.2));

    float s1 = spiral(warped, t * 0.6, 3.0, 8.0);
    float s2 = spiral(warped * 1.3, -t * 0.4, 5.0, 12.0);
    float s3 = spiral(warped + vec2(drift * 0.3), t * 0.3, 2.0, 6.0);

    float spiralField = s1 * 0.5 + s2 * 0.3 + s3 * 0.2;

    float gridScale = 4.0 + 2.0 * sin(t * 0.15);
    vec2 gridUV = uv * gridScale + warp1 * 2.0;
    float decay = exp(-length(uv) * 1.2) * (0.3 + 0.7 * pow(sin(t * 0.1 + 1.5), 2.0));
    float g = grid(gridUV, decay);

    float dissolve = fbm(uv * 5.0 + t * 0.12);
    float mask = smoothstep(0.3 + 0.2 * sin(t * 0.25), 0.7 + 0.2 * cos(t * 0.19), dissolve);

    vec3 deep = vec3(0.02, 0.01, 0.06);
    vec3 mem1 = vec3(0.15, 0.08, 0.35);
    vec3 mem2 = vec3(0.05, 0.25, 0.4);
    vec3 flicker = vec3(0.7, 0.3, 0.5);
    vec3 ghost = vec3(0.4, 0.6, 0.9);
    vec3 warm = vec3(0.8, 0.55, 0.2);

    float r = length(uv);
    float halo = exp(-r * r * 3.0);

    vec3 col = deep;

    float fieldPhase = sin(t * 0.22) * 0.5 + 0.5;
    col = mix(col, mem1, halo * 0.6 * fieldPhase);
    col = mix(col, mem2, halo * 0.4 * (1.0 - fieldPhase));

    col += flicker * max(spiralField, 0.0) * 0.5 * mask;
    col += ghost * max(-spiralField, 0.0) * 0.3 * (1.0 - mask);

    col += warm * g * 0.4;
    col = mix(col, deep, (1.0 - mask) * 0.3 * (1.0 - halo));

    float pulse = exp(-r * 4.0) * pow(sin(t * 1.2 + r * 8.0) * 0.5 + 0.5, 4.0);
    col += vec3(0.6, 0.4, 0.8) * pulse * 0.3;

    float rings = sin(r * 20.0 - t * 2.0) * 0.5 + 0.5;
    rings *= exp(-r * 2.5) * breathe * 0.15;
    col += ghost * rings;

    float warpIntensity = length(warp2);
    col += vec3(0.3, 0.1, 0.4) * warpIntensity * 0.2 * halo;

    float flick = pow(hash(vec2(floor(t * 8.0), 0.0)), 12.0);
    col += vec3(0.9, 0.7, 1.0) * flick * halo * 0.3;

    col *= 1.0 - 0.3 * r;
    col = pow(col, vec3(0.95));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
    await masterReverb.generate();
    const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.2 }).connect(masterReverb);

    const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
    const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.5, depth: 0.6, wet: 0.4 }).connect(padFilter);
    padChorus.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2.0, decay: 1.5, sustain: 0.4, release: 3.0 }
    }).connect(padChorus);
    pad.volume.value = -8;

    const padChords = [
        ["D3", "A3", "F4"],
        ["Bb2", "F3", "D4"],
        ["G2", "D3", "Bb3"],
        ["A2", "E3", "C4"],
        ["F2", "C3", "A3"],
        ["D3", "A3", "E4"]
    ];
    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 16) return;
        const vel = bar < 2 ? 0.12 : bar < 12 ? 0.2 : 0.12;
        pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time, vel);
        chordIdx++;
    }, "1n").start(0);

    const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);
    const bell = new Tone.FMSynth({
        harmonicity: 2.5,
        modulationIndex: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.1, decay: 1.0, sustain: 0, release: 0.5 }
    }).connect(bellFilter);
    bell.volume.value = -14;

    const bellNotes = ["A4", "F4", "D4", "E4", "C5", "A4", "G4", "Bb4", "D5", "C5", "A4", "F4"];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 2 || bar >= 14) return;
        const shouldPlay = Math.random() < (bar < 6 ? 0.4 : 0.65);
        if (!shouldPlay) { bellIdx++; return; }
        const note = bellNotes[bellIdx % bellNotes.length];
        bell.triggerAttackRelease(note, "4n", time, 0.3 + Math.random() * 0.15);
        bellIdx++;
    }, "4n").start(0);

    const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120 }).connect(masterReverb);
    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.8, decay: 0.5, sustain: 0.3, release: 2.0 },
        filterEnvelope: { attack: 0.5, decay: 0.3, sustain: 0.2, baseFrequency: 40, octaves: 1 }
    }).connect(subFilter);
    sub.volume.value = -10;

    const subNotes = ["D1", "Bb0", "G1", "A1", "F1", "D1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 1 || bar >= 15) return;
        sub.triggerAttackRelease(subNotes[subIdx % subNotes.length], "2n", time, 0.5);
        subIdx++;
    }, "2n").start(0);

    const ghostFilter = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 2 }).connect(masterDelay);
    const ghost = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.3, decay: 0.8, sustain: 0, release: 1.5 }
    }).connect(ghostFilter);
    ghost.volume.value = -20;

    const ghostNotes = ["D5", "A5", "F5", "E5", "C6", "Bb5", "G5"];
    let ghostIdx = 0;
    const ghostLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 4 || bar >= 13) return;
        if (Math.random() < 0.55) { ghostIdx++; return; }
        ghost.triggerAttackRelease(ghostNotes[ghostIdx % ghostNotes.length], "8n", time, 0.15 + Math.random() * 0.1);
        ghostIdx++;
    }, "8n.").start(0);

    const noiseFilter = new Tone.Filter({ type: "highpass", frequency: 2000 }).connect(masterReverb);
    const breath = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 0, release: 2.0 }
    }).connect(noiseFilter);
    breath.volume.value = -22;

    Tone.Transport.schedule((time) => {
        breath.triggerAttackRelease(2.0, time);
    }, "3:0:0");

    Tone.Transport.schedule((time) => {
        breath.triggerAttackRelease(1.5, time);
    }, "7:0:0");

    Tone.Transport.schedule((time) => {
        breath.triggerAttackRelease(1.0, time);
    }, "11:0:0");

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(1800, time + 6 * barLen);
    }, "2:0:0");

    Tone.Transport.schedule((time) => {
        padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
    }, "12:0:0");

    window.toneJsInstruments = { pad, bell, sub, ghost, breath };
    window.toneJsParts = { padLoop, bellLoop, subLoop, ghostLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
