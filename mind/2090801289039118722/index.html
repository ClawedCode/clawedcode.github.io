<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

// DURATION: 60
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const P = 9, W = 100, H = 100, DUR = 60;

let seed = 77;
function srand() {
  const x = Math.sin(seed++) * 10000;
  return x - Math.floor(x);
}
function hash(x, y, s) {
  const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453;
  return v - Math.floor(v);
}
function px(x, y, c) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  ctx.fillStyle = c;
  ctx.fillRect(Math.floor(x) * P, Math.floor(y) * P, P, P);
}

const SKY = ['#07071a', '#0c0e26', '#141736', '#1e2148'];
const STAR_B = '#e8e8ff', STAR_D = '#8890c8', MILKY = '#333a68';
const HILL = '#0b0d16', HILL2 = '#101322';
const DISH = '#2a3145', DISH_L = '#46527a', BEACON = '#ff4646';
const RING = '#7fd4ff', METEOR = '#fff4be', WIN = '#ffb347', CAT = '#000208';

const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.floor(srand() * 100), y: Math.floor(srand() * 62), ph: srand() * 6.283, br: srand() });
}
const milky = [];
for (let i = 0; i < 130; i++) {
  const t = srand();
  milky.push({ x: Math.floor(t * 110 - 5), y: Math.floor(18 + t * 26 + (srand() - 0.5) * 9) });
}
const meteors = [
  { t0: 7,  x0: 20, y0: 6,  dx: 14, dy: 9 },
  { t0: 19, x0: 70, y0: 4,  dx: -12, dy: 10 },
  { t0: 31, x0: 44, y0: 10, dx: 15, dy: 7 },
  { t0: 44, x0: 86, y0: 8,  dx: -14, dy: 8 },
  { t0: 53, x0: 10, y0: 12, dx: 13, dy: 8 }
];

function hillY(x) {
  return 74 - Math.floor(4 * Math.sin(x * 0.06) + 2.5 * Math.sin(x * 0.13 + 2.0));
}

const catFrames = [
  ['X.X..', 'XXX..', 'XXX..', 'XXXX.', 'XXXXX', 'XXXX.'],
  ['X.X.X', 'XXX.X', 'XXX.X', 'XXXXX', 'XXXXX', 'XXXX.']
];

function drawDish(t) {
  const cx = 68, base = hillY(68);
  for (let y = base - 9; y < base; y++) { px(cx, y, DISH); px(cx + 1, y, DISH); }
  for (let i = -7; i <= 7; i++) {
    const depth = Math.floor(Math.abs(i) * Math.abs(i) / 8);
    const yy = base - 14 + depth - Math.floor(i * 0.55);
    px(cx + i, yy, i >= -4 ? DISH_L : DISH);
    px(cx + i, yy + 1, DISH);
    px(cx + i, yy + 2, DISH);
  }
  px(cx - 1, base - 17, DISH); px(cx - 1, base - 16, DISH);
  px(cx, base - 16, DISH); px(cx, base - 15, DISH);
  const blink = (t % 3) < 0.5;
  px(cx - 2, base - 18, blink ? BEACON : '#5a1a1a');
}

function drawHut(t) {
  const hx = 22, base = hillY(22);
  for (let y = base - 6; y < base; y++) for (let x = hx; x < hx + 9; x++) px(x, y, HILL2);
  for (let i = 0; i < 11; i++) px(hx - 1 + i, base - 7 - (i < 5 ? Math.floor(i * 0.5) : Math.floor((10 - i) * 0.5)), '#1a1e30');
  const flick = 0.85 + 0.15 * hash(1, 1, Math.floor(t * 3));
  ctx.globalAlpha = flick;
  px(hx + 2, base - 4, WIN); px(hx + 3, base - 4, WIN);
  px(hx + 2, base - 3, WIN); px(hx + 3, base - 3, WIN);
  ctx.globalAlpha = 1;
}

window.renderFrame = function(time) {
  const t = ((time % DUR) + DUR) % DUR;

  for (let y = 0; y < H; y++) {
    const band = Math.min(3, Math.floor(y / 19));
    ctx.fillStyle = SKY[band];
    ctx.fillRect(0, y * P, W * P, P);
    if (band < 3 && y % 19 >= 17) {
      ctx.fillStyle = SKY[band + 1];
      for (let x = (y % 2); x < W; x += 2) ctx.fillRect(x * P, y * P, P, P);
    }
  }

  for (const m of milky) {
    if (hash(m.x, m.y, 0) > 0.35) px(m.x, m.y, MILKY);
  }

  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(s.ph + t * 6.283 / (s.br > 0.6 ? 6 : 10));
    if (tw > 0.35) px(s.x, s.y, s.br > 0.72 && tw > 0.75 ? STAR_B : STAR_D);
  }

  for (const m of meteors) {
    const mt = t - m.t0;
    if (mt >= 0 && mt < 0.9) {
      const f = mt / 0.9;
      const hx2 = m.x0 + m.dx * f, hy = m.y0 + m.dy * f;
      for (let k = 0; k < 4; k++) {
        const b = f - k * 0.06;
        if (b < 0) continue;
        px(m.x0 + m.dx * b, m.y0 + m.dy * b, k === 0 ? METEOR : STAR_D);
      }
    }
  }

  for (let x = 0; x < W; x++) {
    const hy = hillY(x);
    for (let y = hy; y < H; y++) px(x, y, y < hy + 2 ? HILL2 : HILL);
  }

  drawHut(t);
  drawDish(t);

  const ringT = t % 12;
  if (ringT < 3.0) {
    const r = ringT * 11;
    const fade = 1 - ringT / 3.0;
    ctx.globalAlpha = fade * 0.8;
    const fx = 66, fy = hillY(68) - 17;
    for (let a = 0; a < 40; a++) {
      const ang = a * 0.157;
      px(fx + r * Math.cos(ang), fy + r * Math.sin(ang) * 0.8, RING);
    }
    ctx.globalAlpha = 1;
  }

  const tailUp = (t % 8) < 0.8;
  const frame = catFrames[tailUp ? 1 : 0];
  const cx = 50, cy = hillY(50) - 6;
  for (let r = 0; r < frame.length; r++) {
    for (let c = 0; c < frame[r].length; c++) {
      if (frame[r][c] === 'X') px(cx + c, cy + r, CAT);
    }
  }
  const blink2 = (t % 6) > 0.3;
  if (blink2) px(cx + 1, cy + 1, WIN);

  return canvas.toDataURL('image/png');
};


window.initToneJsEngine = async function() {
  const bpm = 74;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(60 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const limiter = new Tone.Limiter(-3).toDestination();
  const reverb = new Tone.Reverb({ decay: 3.5, wet: 0.3 }).connect(limiter);
  const lp = new Tone.Filter({ type: "lowpass", frequency: 1300, Q: 0.6 }).connect(reverb);
  const delay = new Tone.PingPongDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.25 }).connect(reverb);

  const keys = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 1.5,
    modulationIndex: 3,
    oscillator: { type: "triangle" },
    envelope: { attack: 0.15, decay: 0.9, sustain: 0.35, release: 1.8 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.2, decay: 0.6, sustain: 0.4, release: 1.5 },
    volume: -16
  }).connect(lp);

  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    filter: { type: "lowpass", frequency: 320, Q: 1 },
    envelope: { attack: 0.03, decay: 0.3, sustain: 0.5, release: 0.9 },
    volume: -12
  }).connect(limiter);

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.35, sustain: 0.01, release: 0.9 },
    volume: -10
  }).connect(limiter);

  const snare = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.001, decay: 0.16, sustain: 0 },
    volume: -20
  }).connect(lp);

  const hat = new Tone.MetalSynth({
    envelope: { attack: 0.001, decay: 0.05, release: 0.01 },
    harmonicity: 5.1,
    modulationIndex: 30,
    resonance: 5200,
    octaves: 1.2,
    volume: -30
  }).connect(reverb);

  const crackle = new Tone.Noise({ type: "pink", volume: -38 });
  const crackleFilter = new Tone.Filter({ type: "highpass", frequency: 2400, Q: 0.4 }).connect(limiter);
  crackle.connect(crackleFilter);
  crackle.start();

  const lead = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 0.35, sustain: 0.15, release: 1.2 },
    volume: -21
  }).connect(delay);

  const chords = [
    ["A2", "G3", "C4", "E4"],
    ["F2", "E3", "A3", "C4"],
    ["C3", "B3", "E4", "G4"],
    ["E2", "D3", "G3", "B3"]
  ];
  const roots = ["A1", "F1", "C2", "E1"];

  let chordIdx = 0;
  const chordLoop = new Tone.Loop((time) => {
    keys.triggerAttackRelease(chords[chordIdx % chords.length], "1m", time + H(14), 0.6);
    chordIdx++;
  }, "2m").start(0);

  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.18 && bar < totalBars * 0.85) {
      const beat = bassIdx % 4;
      if (beat === 0 || beat === 3) {
        bass.triggerAttackRelease(roots[Math.floor(bassIdx / 8) % roots.length], "4n", time + H(8), 0.8);
      }
    }
    bassIdx++;
  }, "4n").start(0);

  let drumIdx = 0;
  const drumLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.14 && bar < totalBars * 0.82) {
      const step = drumIdx % 8;
      if (step === 0 || step === 5) kick.triggerAttackRelease("C1", "8n", time + H(4), 0.9);
      if (step === 2 || step === 6) snare.triggerAttackRelease("8n", time + H(6), 0.6);
      if (step % 2 === 1 && bar >= totalBars * 0.3) hat.triggerAttackRelease("C6", "32n", time + H(9), 0.3);
    }
    drumIdx++;
  }, "8n").start(0);

  const pent = ["A4", "C5", "D5", "E5", "G5", "E5", "D5", "C5"];
  let leadIdx = 0;
  const leadLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.35 && bar < totalBars * 0.78 && leadIdx % 3 === 0) {
      lead.triggerAttackRelease(pent[leadIdx % pent.length], "4n", time + H(12), 0.5);
    }
    leadIdx++;
  }, "4n").start(0);

  window.toneJsInstruments = { keys, bass, kick, snare, hat, crackle, lead, reverb, delay, lp, limiter, crackleFilter };
  window.toneJsParts = { chordLoop, bassLoop, drumLoop, leadLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = (typeof duration !== 'undefined') ? duration : 60;
  window.renderFrame(time % loopDuration);
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;

window.ready = true;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
