<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,30.0);
    float ph=t/30.0;
    float w=ph*6.2832;

    float conv=smoothstep(0.2,0.45,ph)*(1.0-smoothstep(0.55,0.8,ph));
    float burst=smoothstep(0.43,0.5,ph)*(1.0-smoothstep(0.5,0.57,ph));
    float sep=1.0-conv;

    float gH=step(0.92,hash(vec2(floor(t*7.0),floor(uv.y*12.0))));
    vec2 q=uv+vec2(gH*0.04,0.0);

    vec3 col=vec3(0.008,0.012,0.022);

    vec2 gp=q*10.0;
    vec2 gc=abs(fract(gp)-0.5);
    float gd=min(gc.x,gc.y);
    col+=vec3(0.018,0.03,0.045)*smoothstep(0.018,0.0,gd)*(0.5+0.5*sin(w*0.5));

    vec2 lid=floor(gp+0.5);
    float lh=hash(lid);
    float lbl=step(0.78,lh)*(0.5+0.5*sin(w*(1.0+lh*3.0)+lh*6.28));
    vec2 lpos=lid/10.0;
    col+=mix(vec3(0.06,0.25,0.12),vec3(0.25,0.06,0.06),step(0.5,hash(lid+77.0)))*lbl*0.002/(length(q-lpos)+0.006);

    float sp=sin(w)*0.12;
    vec3 c1=vec3(0.12+sp,0.5,0.88-sp);
    vec3 c2=vec3(0.95,0.48+sp*0.5,0.06);
    vec3 c3=vec3(0.58-sp,0.18,0.88+sp);

    float rw=0.035;

    float y1=(0.22*sin(q.x*3.5+w*3.0)+0.1*cos(q.x*1.8+w*2.0))*sep;
    float d1=abs(q.y-y1);
    float co1=smoothstep(rw,rw*0.2,d1);
    float gl1=rw*0.6/(d1+0.015);
    float fl1=0.7+0.3*sin(q.x*16.0-w*8.0+sin(q.x*3.1+w*2.0)*1.5);

    float y2=(0.18*sin(q.x*4.5+w*4.0+2.094)+0.13*cos(q.x*2.2+w*3.0+1.0))*sep;
    float d2=abs(q.y-y2);
    float co2=smoothstep(rw,rw*0.2,d2);
    float gl2=rw*0.6/(d2+0.015);
    float fl2=0.7+0.3*sin(q.x*20.0-w*10.0+sin(q.x*4.2+w*3.0)*1.5);

    float y3=(0.2*sin(q.x*2.8+w*2.0+4.189)+0.15*cos(q.x*1.5+w*3.0+3.0))*sep;
    float d3=abs(q.y-y3);
    float co3=smoothstep(rw,rw*0.2,d3);
    float gl3=rw*0.6/(d3+0.015);
    float fl3=0.7+0.3*sin(q.x*13.0-w*6.0+sin(q.x*2.7+w*1.0)*1.5);

    col+=c1*(co1*fl1*1.8+gl1*0.12);
    col+=c2*(co2*fl2*1.8+gl2*0.12);
    col+=c3*(co3*fl3*1.8+gl3*0.12);

    for(int i=0;i<15;i++){
        float fi=float(i)/15.0;
        float px=fract(fi+ph*3.0)*2.6-1.3;
        float py1=(0.22*sin(px*3.5+w*3.0)+0.1*cos(px*1.8+w*2.0))*sep;
        float py2=(0.18*sin(px*4.5+w*4.0+2.094)+0.13*cos(px*2.2+w*3.0+1.0))*sep;
        float py3=(0.2*sin(px*2.8+w*2.0+4.189)+0.15*cos(px*1.5+w*3.0+3.0))*sep;
        col+=c1*0.002/(length(q-vec2(px,py1))+0.004);
        col+=c2*0.002/(length(q-vec2(px,py2))+0.004);
        col+=c3*0.002/(length(q-vec2(px,py3))+0.004);
    }

    float ix=smoothstep(0.05,0.0,abs(y1-y2))*min(co1+gl1*0.3,1.0)*min(co2+gl2*0.3,1.0);
    float iy=smoothstep(0.05,0.0,abs(y2-y3))*min(co2+gl2*0.3,1.0)*min(co3+gl3*0.3,1.0);
    float iz=smoothstep(0.05,0.0,abs(y1-y3))*min(co1+gl1*0.3,1.0)*min(co3+gl3*0.3,1.0);
    col+=vec3(1.0,0.88,0.65)*(ix+iy+iz)*0.4;

    float pd=length(q);
    col+=vec3(1.0,0.9,0.7)*(burst*0.1/(abs(pd-burst*0.7)+0.008)*0.25+burst*2.5*exp(-pd*pd*6.0));

    col=mix(col,col.grb*1.2,gH*0.35);
    col=mix(col,col.bgr,step(0.97,sin(t*15.0+q.y*50.0))*0.2);

    col*=0.97+0.03*sin(gl_FragCoord.y*1.5);
    col*=1.0-dot(uv,uv)*0.45;

    gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 96;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const verb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).toDestination();
  await verb.generate();
  const dly = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(verb);

  const bassF = new Tone.Filter({ type: "lowpass", frequency: 180 }).toDestination();
  const bass = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.25, sustain: 0.15, release: 0.3 },
    filterEnvelope: { attack: 0.01, decay: 0.15, sustain: 0, baseFrequency: 60, octaves: 1.5 }
  }).connect(bassF);

  const bassPatterns = [
    ["C2", "C2", "G1", "G1"],
    ["A#1", "A#1", "F1", "A#1"],
    ["C2", "G1", "A#1", "G1"]
  ];
  let bIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let pat;
    if (bar < 4) pat = bassPatterns[0];
    else if (bar < 8) pat = bassPatterns[1];
    else pat = bassPatterns[0];
    const vel = bar >= 10 ? 0.4 : 0.65;
    bass.triggerAttackRelease(pat[bIdx % pat.length], "8n", time, vel);
    bIdx++;
  }, "4n").start(0);

  const arpF = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(dly);
  const arp = new Tone.Synth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.002, decay: 0.08, sustain: 0, release: 0.05 }
  }).connect(arpF);

  const arpSets = [
    ["C4", "E4", "G4", "C5", "G4", "E4"],
    ["A#3", "D4", "F4", "A#4", "F4", "D4"],
    ["C4", "G3", "E4", "C4", "G4", "E4"]
  ];
  let aIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2 || bar >= 10) return;
    let pat;
    if (bar < 5) pat = arpSets[0];
    else if (bar < 8) pat = arpSets[1];
    else pat = arpSets[2];
    const vel = (bar >= 4 && bar < 8) ? 0.55 : 0.3;
    arp.triggerAttackRelease(pat[aIdx % pat.length], "16n", time, vel);
    aIdx++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    arpF.frequency.linearRampToValueAtTime(2200, time + 4 * barLen);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    arpF.frequency.linearRampToValueAtTime(500, time + 3 * barLen);
  }, "8:0:0");

  const padCh = new Tone.Chorus({ frequency: 0.3, delayTime: 3.5, depth: 0.5, wet: 0.35 }).connect(verb);
  padCh.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.7, decay: 0.4, sustain: 0.45, release: 1.2 }
  }).connect(padCh);

  const chords = [
    ["C4", "E4", "G4"],
    ["A#3", "D4", "F4"],
    ["G3", "C4", "D#4"],
    ["C4", "E4", "G4"]
  ];
  let cIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 10) return;
    pad.triggerAttackRelease(chords[cIdx % chords.length], "1n", time, 0.13);
    cIdx++;
  }, "1n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 2.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 1.8, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(verb);

  Tone.Transport.schedule((time) => {
    bell.triggerAttackRelease("C5", 1.5, time, 0.45);
  }, "6:0:0");

  const hat = new Tone.MetalSynth({
    frequency: 380, envelope: { attack: 0.001, decay: 0.09, release: 0.02 },
    harmonicity: 5.1, modulationIndex: 28, resonance: 4200
  }).connect(verb);

  let hIdx = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 10) return;
    const pattern = [1, 0, 1, 1, 0, 1, 0, 1];
    if (pattern[hIdx % pattern.length]) {
      hat.triggerAttackRelease("16n", time, 0.2 + Math.random() * 0.1);
    }
    hIdx++;
  }, "8n").start(0);

  window.toneJsInstruments = { bass, arp, pad, bell, hat };
  window.toneJsParts = { bassLoop, arpLoop, padLoop, hatLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 30;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 30;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
