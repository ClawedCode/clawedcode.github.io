<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 hash2(vec2 p) {
    p = vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
    return fract(sin(p)*43758.5453);
}

float voronoi(vec2 p, float morph) {
    vec2 n = floor(p);
    vec2 f = fract(p);
    float md = 8.0;
    for(int j = -1; j <= 1; j++)
    for(int i = -1; i <= 1; i++) {
        vec2 g = vec2(float(i),float(j));
        vec2 o = hash2(n+g);
        o = 0.5 + 0.5*sin(iTime*0.4 + 6.2831*o + morph);
        vec2 r = g + o - f;
        float d = dot(r,r);
        md = min(md, d);
    }
    return md;
}

float voronoiEdge(vec2 p, float morph) {
    vec2 n = floor(p);
    vec2 f = fract(p);
    float md = 8.0;
    float md2 = 8.0;
    for(int j = -2; j <= 2; j++)
    for(int i = -2; i <= 2; i++) {
        vec2 g = vec2(float(i),float(j));
        vec2 o = hash2(n+g);
        o = 0.5 + 0.5*sin(iTime*0.4 + 6.2831*o + morph);
        vec2 r = g + o - f;
        float d = dot(r,r);
        if(d < md) { md2 = md; md = d; }
        else if(d < md2) { md2 = d; }
    }
    return md2 - md;
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8,0.6,-0.6,0.8);
    for(int i = 0; i < 3; i++) {
        v += a * (sin(p.x*1.1 + iTime*0.3)*cos(p.y*0.9 - iTime*0.2));
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy) / iResolution.y;

    float cycle = mod(iTime, 60.0) / 60.0;
    float breathe = sin(cycle * 6.2831 * 2.0);
    float phase = smoothstep(-0.3, 0.3, breathe);
    float shatter = smoothstep(0.25, 0.35, abs(breathe - 0.0)) * step(0.0, -breathe * sign(sin(cycle*6.2831*2.0 + 0.01)));

    float sc = mix(3.0, 6.0, phase);
    vec2 p = uv * sc;

    float warp = mix(1.2, 0.0, phase);
    p += warp * vec2(fbm(p + iTime*0.1), fbm(p + 5.0 - iTime*0.15));

    float v = voronoi(p, phase * 3.0);
    float edge = voronoiEdge(p, phase * 3.0);

    float cellShape = mix(sqrt(v), v * v, phase);
    float edgeSharp = mix(
        smoothstep(0.0, 0.3, edge),
        smoothstep(0.0, 0.05, edge),
        phase
    );

    vec3 crystalCol = mix(
        vec3(0.15, 0.25, 0.45),
        vec3(0.5, 0.7, 0.9),
        edgeSharp
    );
    crystalCol += vec3(0.3, 0.5, 0.7) * (1.0 - cellShape) * 0.4;

    vec3 chaosCol = mix(
        vec3(0.6, 0.3, 0.1),
        vec3(0.9, 0.6, 0.2),
        cellShape
    );
    chaosCol += vec3(0.4, 0.15, 0.05) * fbm(uv * 4.0 + iTime*0.5) * 0.5;

    vec3 col = mix(chaosCol, crystalCol, phase);

    float particleBurst = shatter * smoothstep(0.8, 1.0, sin(v * 30.0 + iTime * 5.0)) * 0.6;
    col += vec3(0.8, 0.9, 1.0) * particleBurst;

    float edgeGlow = (1.0 - edgeSharp) * phase;
    col += vec3(0.2, 0.4, 0.8) * edgeGlow * 0.5;

    float stillness = smoothstep(0.9, 1.0, phase) + smoothstep(0.9, 1.0, 1.0 - phase);
    col = mix(col, col * 1.15, stillness * 0.3);

    float vig = 1.0 - 0.4 * dot(uv, uv);
    col *= vig;

    col = pow(col, vec3(0.95));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const masterRev = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterRev.generate();
  const masterDel = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.25, wet: 0.2 }).connect(masterRev);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterRev);
  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 1.0, sustain: 0.5, release: 2.5 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const crystalChords = [
    ["E3", "B3", "E4"],
    ["C3", "G3", "C4"],
    ["A2", "E3", "A3"],
    ["D3", "A3", "D4"]
  ];
  const chaosChords = [
    ["F3", "Ab3", "C4"],
    ["Db3", "F3", "Ab3"],
    ["Bb2", "Db3", "F3"],
    ["Eb3", "Gb3", "Bb3"]
  ];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const cycle = (sec % 60) / 60;
    const breathe = Math.sin(cycle * Math.PI * 4);
    const phase = Math.max(0, Math.min(1, (breathe + 0.3) / 0.6));

    const chords = phase > 0.5 ? crystalChords : chaosChords;
    const idx = chordIdx % chords.length;
    pad.triggerAttackRelease(chords[idx], "1n", time, 0.25 + phase * 0.15);
    chordIdx++;
  }, "1n").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.5, sustain: 0, release: 0.5 }
  }).connect(masterDel);
  bell.volume.value = -18;

  const crystalNotes = ["E5", "B4", "G4", "A4", "E4", "D5", "C5", "B4"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const cycle = (sec % 60) / 60;
    const breathe = Math.sin(cycle * Math.PI * 4);
    const phase = Math.max(0, Math.min(1, (breathe + 0.3) / 0.6));

    if (phase > 0.5 && Math.random() < phase * 0.7) {
      const note = crystalNotes[bellIdx % crystalNotes.length];
      bell.triggerAttackRelease(note, "4n", time, 0.15 + phase * 0.2);
      bellIdx++;
    }
  }, "4n").start(0);

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.4, release: 1.5 },
    filterEnvelope: { attack: 0.5, decay: 0.3, sustain: 0.3, baseFrequency: 40, octaves: 1 }
  }).connect(masterRev);
  subBass.volume.value = -16;

  const subNotes = ["E1", "C1", "A0", "D1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    const note = subNotes[subIdx % subNotes.length];
    subBass.triggerAttackRelease(note, "2n", time, 0.35);
    subIdx++;
  }, "2n").start(0);

  const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 2000, Q: 2 }).connect(masterRev);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.3, decay: 0.8, sustain: 0.1, release: 1.2 }
  }).connect(noiseFilter);
  noise.volume.value = -22;

  const noiseLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const cycle = (sec % 60) / 60;
    const breathe = Math.sin(cycle * Math.PI * 4);
    const phase = Math.max(0, Math.min(1, (breathe + 0.3) / 0.6));

    if (phase < 0.4 && Math.random() < (1.0 - phase) * 0.5) {
      noiseFilter.frequency.value = 800 + Math.random() * 3000;
      noise.triggerAttackRelease("4n", time, 0.15);
    }
  }, "4n").start(0);

  const shimmer = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.4 }
  }).connect(masterDel);
  shimmer.volume.value = -24;

  const shimmerLoop = new Tone.Loop((time) => {
    const sec = Tone.Transport.getSecondsAtTime(time);
    const cycle = (sec % 60) / 60;
    const breathe = Math.sin(cycle * Math.PI * 4);
    const deriv = Math.cos(cycle * Math.PI * 4);

    if (Math.abs(deriv) > 0.8 && Math.random() < 0.4) {
      const midi = 72 + Math.floor(Math.random() * 24);
      shimmer.triggerAttackRelease(Tone.Frequency(midi, "midi"), "16n", time, 0.12);
    }
  }, "8n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + barLen * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + barLen * 4);
  }, "12:0:0");

  window.toneJsInstruments = { pad, bell, subBass, noise, shimmer };
  window.toneJsParts = { padLoop, bellLoop, subLoop, noiseLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
