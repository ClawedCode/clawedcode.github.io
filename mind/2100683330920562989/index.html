<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define TAU 6.28318530718
mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
vec3 pal(float x){vec3 a=vec3(0.38,0.34,0.48),b=vec3(0.36,0.28,0.32),c=vec3(0.85,0.72,1.05),d=vec3(0.04,0.20,0.37);return a+b*cos(TAU*(c*x+d));}
vec2 fld(vec2 p,float t){float a=n2(p*0.72+vec2(cos(t),sin(t))*0.55)*TAU*2.0;float b=n2(p*1.35-vec2(sin(t*0.7),cos(t*0.7))*0.32);vec2 v=vec2(cos(a),sin(a))*(0.32+0.68*b);vec2 q=p;float l=dot(q,q)+0.18;v+=vec2(-q.y,q.x)*(0.58/l);return v;}
vec2 path(float u,float id,float ph){float a=u*TAU*(1.35+0.06*id)+ph*TAU*(0.42+id*0.021)+id*0.91;float fold=sin(u*TAU*3.0+id+ph*TAU)*0.24+sin(u*TAU*5.0-id*1.7-ph*TAU*2.0)*0.09;float rad=0.22+0.64*u+fold;vec2 p=vec2(cos(a),sin(a))*rad;p+=0.13*vec2(sin(a*0.5+id),cos(a*0.7-id));vec2 v=fld(p*1.2,ph*TAU);p+=v*0.18*sin(u*3.14159);return p;}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0,t=ph*TAU;
  vec2 p=uv;
  p=r2(0.18*sin(t))*p;
  float vign=smoothstep(1.45,0.18,length(p));
  vec3 col=vec3(0.006,0.007,0.013)+vec3(0.015,0.011,0.026)*vign;
  float veil=0.0;
  for(int i=0;i<7;i++){
    float id=float(i);
    float ribbon=0.0,core=0.0,echo=0.0;
    vec3 acc=vec3(0.0);
    for(int j=0;j<30;j++){
      float u=(float(j)+0.5)/30.0;
      vec2 a=path(u,id,ph);
      vec2 b=path(u+0.012,id,ph);
      vec2 tg=normalize(b-a+vec2(0.0001));
      vec2 nm=vec2(-tg.y,tg.x);
      vec2 q=p-a;
      float along=dot(q,tg),side=dot(q,nm);
      float w=0.012+0.026*u+0.008*sin(t+id+u*TAU*2.0);
      float seg=smoothstep(0.105,0.0,abs(along))*exp(-side*side/(w*w));
      float c=0.018/(0.006+dot(q,q));
      float fade=smoothstep(0.0,0.16,u)*smoothstep(1.0,0.74,u);
      vec3 cc=pal(u*0.42+id*0.071+0.08*sin(t))*mix(0.65,1.45,fade);
      ribbon+=seg*fade;
      core+=smoothstep(w,0.0,abs(side))*smoothstep(0.07,0.0,abs(along))*fade;
      echo+=c*0.012*fade;
      acc+=cc*(seg*0.22+c*0.007)*fade;
    }
    float breath=0.72+0.28*sin(t+id*1.31);
    col+=acc*breath;
    veil+=ribbon*0.018+echo*0.06+core*0.03;
  }
  float ring=abs(length(p)-0.72-0.06*sin(t*2.0+atan(p.y,p.x)*3.0));
  col+=pal(0.65+0.06*sin(t))*smoothstep(0.035,0.0,ring)*0.09*vign;
  float well=exp(-dot(p,p)*2.7);
  col=mix(col,col+vec3(0.03,0.045,0.075)*well,0.62);
  col+=vec3(0.48,0.72,0.92)*pow(max(0.0,1.0-length(p)*0.82),5.0)*0.08;
  col*=0.82+0.18*sin((gl_FragCoord.y/iResolution.y)*820.0);
  col+=veil*vec3(0.18,0.27,0.35);
  col=pow(col,vec3(0.86));
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.015, release: 0.22 }).toDestination();
  const verb = new Tone.Reverb({ decay: 6.5, wet: 0.42 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.36, wet: 0.28 }).connect(verb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 620, Q: 0.8 }).connect(verb);
  const leadFilter = new Tone.Filter({ type: "bandpass", frequency: 1500, Q: 1.7 }).connect(delay);
  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120, Q: 0.4 }).connect(master);
  const airFilter = new Tone.Filter({ type: "bandpass", frequency: 900, Q: 0.8 }).connect(verb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.045,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 0.32, sustain: 0, release: 0.04 }
  }).connect(master);
  kick.volume.value = -10;
  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.018, decay: 0.18, sustain: 0.22, release: 0.45 },
    filterEnvelope: { attack: 0.03, decay: 0.35, sustain: 0.1, baseFrequency: 50, octaves: 1.2 }
  }).connect(subFilter);
  sub.volume.value = -12;
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 0.6, sustain: 0.62, release: 3.2 }
  }).connect(padFilter);
  pad.volume.value = -14;
  const glass = new Tone.FMSynth({
    harmonicity: 1.502,
    modulationIndex: 7.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.012, decay: 2.4, sustain: 0.02, release: 2.6 },
    modulation: { type: "sine" }
  }).connect(leadFilter);
  glass.volume.value = -15;
  const dust = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.08, decay: 0.4, sustain: 0, release: 0.8 }
  }).connect(airFilter);
  dust.volume.value = -22;
  const chords = [
    ["D3", "A3", "C4", "E4"],
    ["F3", "A3", "C4", "G4"],
    ["C3", "G3", "Bb3", "D4"],
    ["E3", "B3", "D4", "F4"]
  ];
  const roots = ["D1", "D1", "F1", "C1", "E1", "D1"];
  const scale = [0, 2, 3, 7, 9, 10, 14, 15];
  let ci = 0, si = 0, gi = 0, ki = 0, di = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const fade = bar >= totalBars * 0.82 ? 0.16 : 0.26;
    pad.triggerAttackRelease(chords[ci % chords.length], "1m", time + H(14), fade);
    ci++;
  }, "1m").start(0);
  const subLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.88 && ki % 3 !== 2) {
      const note = roots[si % roots.length];
      const vel = bar < totalBars * 0.16 || bar >= totalBars * 0.82 ? 0.42 : 0.68;
      sub.triggerAttackRelease(note, "2n", time + H(8), vel);
      si++;
    }
    ki++;
  }, "2n").start(0);
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.18 && bar < totalBars * 0.78 && ki % 4 !== 3) {
      kick.triggerAttackRelease("D1", "8n", time + H(3), 0.48);
      padFilter.frequency.setValueAtTime(360, time);
      padFilter.frequency.exponentialRampToValueAtTime(760, time + 0.22);
    }
  }, "2n").start(0);
  const glassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const active = bar >= totalBars * 0.12 && bar < totalBars * 0.84;
    if (active) {
      const section = bar < totalBars * 0.4 ? 0 : bar < totalBars * 0.68 ? 7 : 2;
      const root = Tone.Frequency("D4").toMidi() + section;
      const step = scale[(gi * 3 + Math.floor(bar)) % scale.length];
      const oct = gi % 5 === 0 ? 12 : 0;
      glass.triggerAttackRelease(Tone.Frequency(root + step + oct, "midi"), "8n", time + H(11), bar > totalBars * 0.72 ? 0.24 : 0.38);
    }
    gi++;
  }, "4n").start(0);
  const dustLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.28 && bar < totalBars * 0.76 && di % 5 === 0) {
      airFilter.frequency.setValueAtTime(600 + Math.random() * 1400, time);
      dust.triggerAttackRelease("16n", time + H(15), 0.18 + Math.random() * 0.12);
    }
    di++;
  }, "8n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1650, time + totalBars * 0.36 * secPerBar);
    leadFilter.frequency.linearRampToValueAtTime(2600, time + totalBars * 0.34 * secPerBar);
  }, totalBars * 0.14 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(520, time + totalBars * 0.16 * secPerBar);
    leadFilter.frequency.linearRampToValueAtTime(1200, time + totalBars * 0.14 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, sub, pad, glass, dust, master, verb, delay, padFilter, leadFilter, subFilter, airFilter };
  window.toneJsParts = { kickLoop, subLoop, padLoop, glassLoop, dustLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
