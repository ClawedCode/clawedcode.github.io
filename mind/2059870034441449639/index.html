<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec3 lz(vec3 p, float r) {
    return vec3(10.0 * (p.y - p.x), p.x * (r - p.z) - p.y, p.x * p.y - 2.667 * p.z);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t / 60.0;
    float cv = smoothstep(0.0, 0.3, ph) * (1.0 - smoothstep(0.85, 1.0, ph));
    float sc = mix(12.0, 0.01, cv);
    float rho = 28.0 + sin(t * 0.2) * 0.5;
    float a = t * 0.08;
    float ca = cos(a), sa = sin(a);
    vec3 col = vec3(0.0);
    for (float j = 0.0; j < 6.0; j++) {
        float s = j * 2.399 + 0.7;
        vec3 p = vec3(sin(s * 3.14) * sc + sin(j * 0.9) * 4.0 * cv, cos(s * 4.67) * sc + cos(j * 1.3) * 4.0 * cv, sin(s * 6.28) * sc + 25.0 + sin(j * 1.7) * 8.0 * cv);
        for (float i = 0.0; i < 300.0; i++) {
            vec3 dp = lz(p, rho);
            p += dp * 0.005;
            float px = p.x * ca - (p.z - 25.0) * sa;
            vec2 pr = vec2(px, p.y) * 0.018;
            float d = length(uv - pr);
            float sp = length(dp) * 0.004;
            float g = 0.0003 / (d * d + 0.00003);
            float w = cv * smoothstep(0.2, 0.6, sp);
            float tr = i / 300.0;
            vec3 c = mix(vec3(0.08 + tr * 0.04, 0.15 + tr * 0.1, 0.55 + tr * 0.15), vec3(0.95, 0.6 + tr * 0.15, 0.12), w);
            col += c * g * exp(-tr * 2.0) * 0.012;
        }
    }
    col += vec3(0.015, 0.008, 0.04) * exp(-length(uv) * 1.2);
    col = 1.0 - exp(-col * 1.8);
    col = pow(col, vec3(0.9));
    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const reverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(reverb);
  const bell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.0, sustain: 0, release: 0.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0.2, release: 0.3 }
  }).connect(delay);
  bell.volume.value = -10;
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.0, sustain: 0.7, release: 3.0 },
    filterEnvelope: { attack: 1.0, decay: 0.5, sustain: 0.5, baseFrequency: 40, octaves: 1 }
  }).connect(reverb);
  bass.volume.value = -8;
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(reverb);
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.8, decay: 0.5, sustain: 0.5, release: 2.5 }
  }).connect(padFilter);
  pad.volume.value = -16;
  const scatterNotes = ["D4", "F4", "A4", "C5", "E5", "G4", "Bb4", "D5"];
  const orbitNotes = ["D4", "A4", "F4", "D5", "A4", "F4", "C5", "A4"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 5) {
      if (Math.random() > 0.35) {
        const n = scatterNotes[Math.floor(Math.random() * scatterNotes.length)];
        bell.triggerAttackRelease(n, "4n", time, 0.15 + Math.random() * 0.15);
      }
    } else if (bar < 13) {
      bell.triggerAttackRelease(orbitNotes[bellIdx % orbitNotes.length], "4n", time, 0.3);
      bellIdx++;
    } else {
      if (Math.random() > 0.55) {
        const n = scatterNotes[Math.floor(Math.random() * scatterNotes.length)];
        bell.triggerAttackRelease(n, "4n", time, 0.12);
      }
    }
  }, "4n").start(0);
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3 && bar < 14) {
      const notes = ["D1", "D1", "A1", "D1"];
      bass.triggerAttackRelease(notes[Math.floor(bar / 2) % 4], "1n", time, 0.5);
    }
  }, "2n").start(0);
  const chords = [["D3", "F3", "A3"], ["Bb2", "D3", "F3"], ["C3", "E3", "G3"], ["A2", "C3", "E3"]];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 13) {
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, 0.2);
      chordIdx++;
    }
  }, "1n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2200, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(500, time + 3 * (60 / bpm) * 4);
  }, "12:0:0");
  window.toneJsInstruments = { bell, bass, pad };
  window.toneJsParts = { bellLoop, bassLoop, padLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
