<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(float n){return fract(sin(n)*43758.5453);}

float noise3(vec3 p){
    vec3 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    float n=i.x+i.y*157.0+i.z*113.0;
    return mix(mix(mix(hash(n),hash(n+1.0),f.x),
                   mix(hash(n+157.0),hash(n+158.0),f.x),f.y),
               mix(mix(hash(n+113.0),hash(n+114.0),f.x),
                   mix(hash(n+270.0),hash(n+271.0),f.x),f.y),f.z);
}

float fbm(vec3 p){
    float v=0.0,a=0.5;
    for(float i=0.0;i<3.0;i++){v+=a*noise3(p);p*=2.01;a*=0.5;}
    return v;
}

float smin(float a,float b,float k){
    float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);
    return mix(b,a,h)-k*h*(1.0-h);
}

float gRotA,gRotB;

float sdSkull(vec3 p){
    float pulse=1.0+0.03*sin(iTime*3.0);
    p/=pulse;
    float d=length(p*vec3(1.0,0.88,0.95))-1.0;
    d=smin(d,length((p-vec3(0,0.18,0.65))*vec3(0.7,3.5,2.0))-1.0,0.3);
    d=smin(d,length(p-vec3(-0.52,-0.05,0.5))-0.3,0.35);
    d=smin(d,length(p-vec3(0.52,-0.05,0.5))-0.3,0.35);
    d=smin(d,length((p-vec3(0,-0.5,0.45))*vec3(0.9,1.4,1.2))-0.4,0.2);
    d=smin(d,length((p-vec3(0,-0.8,0.3))*vec3(1.2,1.0,1.3))-0.25,0.15);
    d=max(d,-(length((p-vec3(-0.3,0.12,0.78))*vec3(1.0,1.3,1.0))-0.2));
    d=max(d,-(length((p-vec3(0.3,0.12,0.78))*vec3(1.0,1.3,1.0))-0.2));
    d=max(d,-(length((p-vec3(0,-0.18,0.9))*vec3(2.0,1.0,1.0))-0.1));
    d=max(d,-(length((p-vec3(-0.9,0.15,0.0))*vec3(1.0,1.3,1.3))-0.35));
    d=max(d,-(length((p-vec3(0.9,0.15,0.0))*vec3(1.0,1.3,1.3))-0.35));
    d+=fbm(p*3.0+iTime*0.1)*0.04;
    return d*pulse;
}

float map(vec3 p){
    p.xz=rot(gRotA)*p.xz;
    p.xy=rot(gRotB)*p.xy;
    return sdSkull(p);
}

vec3 calcNorm(vec3 p){
    vec2 e=vec2(0.001,0);
    return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),
                         map(p+e.yxy)-map(p-e.yxy),
                         map(p+e.yyx)-map(p-e.yyx)));
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,50.0);
    float surge=smoothstep(4.0,5.0,mod(t,10.0))*smoothstep(7.0,6.0,mod(t,10.0));

    gRotA=sin(t*0.25)*0.4;
    gRotB=sin(t*0.15)*0.1;

    vec3 eyeWL=vec3(-0.3,0.12,0.78);
    eyeWL.xy=rot(-gRotB)*eyeWL.xy; eyeWL.xz=rot(-gRotA)*eyeWL.xz;
    vec3 eyeWR=vec3(0.3,0.12,0.78);
    eyeWR.xy=rot(-gRotB)*eyeWR.xy; eyeWR.xz=rot(-gRotA)*eyeWR.xz;

    float bgN=fbm(vec3(uv*2.0,t*0.1))*0.08;
    vec3 col=vec3(0.04,0.01,0.08)+bgN*vec3(0.2,0.1,0.3);
    float ringD=length(uv);
    col+=(sin(ringD*15.0-t*3.0)*0.5+0.5)*exp(-ringD*3.0)*surge*0.15*vec3(0.6,0.4,0.1);

    vec3 ro=vec3(0,0,3.5),rd=normalize(vec3(uv,-1.2));
    float td=0.2,md=100.0;

    for(float i=0.0;i<80.0;i++){
        vec3 p=ro+rd*td;
        float d=map(p);
        md=min(md,d);
        if(d<0.001){
            vec3 n=calcNorm(p);
            vec3 base=mix(vec3(0.88,0.83,0.75),vec3(1.0,0.75,0.15),surge*0.6);
            vec3 L=normalize(vec3(0.5,1.0,0.8));
            float diff=max(dot(n,L),0.0);
            float spec=pow(max(dot(reflect(-L,n),-rd),0.0),20.0);
            float rim=pow(1.0-max(dot(n,-rd),0.0),2.5);
            col=base*(diff*0.7+0.25)*(0.5+0.5*n.y);
            col+=spec*vec3(1,0.95,0.8)*0.4;
            col+=rim*mix(vec3(0.15,0.2,0.4),vec3(1.0,0.8,0.3),surge)*0.6;
            float eyeG=exp(-length(p-eyeWL)*4.0)+exp(-length(p-eyeWR)*4.0);
            col+=vec3(0.2,0.7,1.0)*eyeG*(0.5+surge*2.5);
            float veins=smoothstep(0.45,0.55,fbm(p*6.0+t*0.3))*surge;
            col+=veins*vec3(0.8,0.5,0.1)*0.6;
            md=-1.0;
            break;
        }
        if(td>15.0)break;
        td+=d;
    }

    if(md>0.0){
        col+=exp(-md*2.5)*mix(vec3(0.2,0.25,0.5),vec3(1.0,0.7,0.15),surge)*0.6;
        float deL=length(cross(eyeWL-ro,rd));
        float deR=length(cross(eyeWR-ro,rd));
        col+=(0.012/(deL*deL+0.003)+0.012/(deR*deR+0.003))*vec3(0.2,0.7,1.0)*(0.8+surge*3.0);
    }

    for(float i=0.0;i<16.0;i++){
        float ang=i*0.3927+t*(0.4+i*0.05);
        float r=1.6+0.3*sin(t*1.5+i*0.8);
        vec3 pp=vec3(cos(ang)*r,sin(t*1.2+i*0.6)*0.7,sin(ang)*r);
        float proj=dot(pp-ro,rd);
        if(proj<0.0)continue;
        float pd=length(ro+rd*proj-pp);
        col+=0.008/(pd*pd+0.003)*mix(vec3(0.3,0.5,1.0),vec3(1.0,0.8,0.2),surge)*(0.5+surge*0.5);
    }

    if(surge>0.1){
        for(float i=0.0;i<4.0;i++){
            float active=step(0.8,sin(t*5.0+i*1.57));
            if(active<0.5)continue;
            float ang=i*1.57+sin(t*0.3)*0.6;
            vec3 bDir=normalize(vec3(cos(ang),0.2*sin(t+i),sin(ang)));
            for(float j=0.0;j<8.0;j++){
                float s=0.3+j*0.2;
                vec3 bp=bDir*s+vec3(noise3(bDir*s*5.0+t*3.0)-0.5,noise3(bDir*s*5.0+t*3.0+100.0)-0.5,noise3(bDir*s*5.0+t*3.0+200.0)-0.5)*0.15;
                float proj=dot(bp-ro,rd);
                float bd=length(ro+rd*proj-bp);
                col+=surge*0.003/(bd*bd+0.002)*vec3(0.7,0.85,1.0);
            }
        }
    }

    col*=1.0-dot(uv,uv)*0.25;
    col+=vec3(1.0,0.9,0.6)*surge*0.12*(1.0-length(uv)*0.8);
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 115;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const masterVerb = new Tone.Reverb({ decay: 2.8, wet: 0.25 }).toDestination();
  await masterVerb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.15 }).connect(masterVerb);
  const comp = new Tone.Compressor({ threshold: -20, ratio: 8, attack: 0.003, release: 0.15 }).toDestination();

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.03, octaves: 7,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.03 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 22) {
      kick.triggerAttackRelease("C1", "8n", time, 0.95);
      comp.threshold.setValueAtTime(-30, time);
      comp.threshold.exponentialRampToValueAtTime(-20, time + 0.15);
    }
  }, "4n").start(0);

  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 200, Q: 1 }).connect(comp);
  const bassDist = new Tone.Distortion({ distortion: 0.3, wet: 0.25 }).connect(bassFilter);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.003, decay: 0.12, sustain: 0, release: 0.06 },
    filterEnvelope: { attack: 0.01, decay: 0.15, sustain: 0, baseFrequency: 100, octaves: 1.5 }
  }).connect(bassDist);

  const bassA = ["D2", "D2", "D2", "D2", "A#1", "A#1", "C2", "C2"];
  const bassB = ["D2", "F2", "D2", "A1", "A#1", "C2", "A#1", "A1"];
  const bassC = ["D2", "D2", "F2", "D2", "A#1", "A#1", "C2", "D2"];
  let bassIdx = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 21) { bassIdx++; return; }
    let pat = bar < 8 ? bassA : bar < 16 ? bassB : bassA;
    if (bar >= 10 && bar < 14) pat = bassC;
    bass.triggerAttackRelease(pat[bassIdx % pat.length], "8n", time, 0.85);
    bassIdx++;
  }, "8n").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 3.5, depth: 0.6, wet: 0.4 }).connect(comp);
  padChorus.start();
  const padVerb = new Tone.Reverb({ decay: 3.5, wet: 0.4 }).connect(padChorus);
  await padVerb.generate();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.8, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(padVerb);
  pad.volume.value = -8;

  const padChords = [
    ["D3", "F3", "A3"], ["A#2", "D3", "F3"],
    ["C3", "E3", "G3"], ["A2", "C3", "E3"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 20) { chordIdx++; return; }
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time, 0.25);
    chordIdx++;
  }, "1n").start(0);

  const hat = new Tone.MetalSynth({
    frequency: 400,
    envelope: { attack: 0.001, decay: 0.1, release: 0.02 },
    harmonicity: 5.1, modulationIndex: 28, resonance: 4500
  }).connect(masterVerb);

  let hatBeat = 0;
  const hatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 8 && bar < 18 && hatBeat % 2 === 1) {
      hat.triggerAttackRelease("16n", time, 0.3 + Math.random() * 0.15);
    }
    hatBeat++;
  }, "8n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 1.5 }).connect(masterDelay);
  const arp = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.002, decay: 0.06, sustain: 0, release: 0.03 }
  }).connect(arpFilter);

  const arpNotes = ["D4", "F4", "A4", "D5", "C5", "A4", "F4", "E4"];
  let arpIdx = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 6 || bar >= 18) { arpIdx++; return; }
    arp.triggerAttackRelease(arpNotes[arpIdx % arpNotes.length], "16n", time, bar >= 10 ? 0.5 : 0.3);
    arpIdx++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(800, time + 4 * barLen);
  }, "6:0:0");
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(3000, time + 4 * barLen);
  }, "8:0:0");
  Tone.Transport.schedule((time) => {
    bassFilter.frequency.linearRampToValueAtTime(200, time + 3 * barLen);
    arpFilter.frequency.linearRampToValueAtTime(600, time + 3 * barLen);
  }, "16:0:0");

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 500 }).connect(masterVerb);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.5, decay: 0.3, sustain: 0, release: 0.5 }
  }).connect(noiseHPF);

  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(3000, time + 1.2);
    noise.triggerAttackRelease(1.2, time);
  }, "5:3:0");
  Tone.Transport.schedule((time) => {
    noiseHPF.frequency.linearRampToValueAtTime(4000, time + 1.5);
    noise.triggerAttackRelease(1.5, time);
  }, "11:3:0");

  window.toneJsInstruments = { kick, bass, pad, hat, arp, noise };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, hatLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 50;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 50;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
