<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle" disabled title="Loading Strudel…">⏳ Loading…</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = "precision highp float;\nuniform vec2 iResolution;\nuniform float iTime;\n\nconst float DURATION = 60.0;\nconst float PI = 3.14159265359;\nconst float TAU = 6.28318530718;\n\nmat2 rot(float a) {\n  float c = cos(a);\n  float s = sin(a);\n  return mat2(c, -s, s, c);\n}\n\nfloat sdSegment(vec2 p, vec2 a, vec2 b) {\n  vec2 pa = p - a;\n  vec2 ba = b - a;\n  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 0.00001), 0.0, 1.0);\n  return length(pa - ba * h);\n}\n\nfloat sdHeart(vec2 p) {\n  p.x = abs(p.x);\n  p.y += 0.18;\n  if (p.x + p.y > 1.0) {\n    return length(p - vec2(0.25, 0.75)) - 0.35355339;\n  }\n  float h = max(p.x + p.y, 0.0) * 0.5;\n  float d1 = dot(p - vec2(0.0, 1.0), p - vec2(0.0, 1.0));\n  float d2 = dot(p - vec2(h, h), p - vec2(h, h));\n  return sqrt(min(d1, d2)) * sign(p.x - p.y);\n}\n\nfloat fillMask(float d, float softness) {\n  return 1.0 - smoothstep(-softness, softness, d);\n}\n\nfloat strokeMask(float d, float width, float softness) {\n  return 1.0 - smoothstep(width - softness, width + softness, abs(d));\n}\n\nfloat sdEllipseApprox(vec2 p, vec2 radius) {\n  return (length(p / radius) - 1.0) * min(radius.x, radius.y);\n}\n\nvoid main() {\n  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;\n  float phase = mod(iTime, DURATION) / DURATION;\n  float t = phase * TAU;\n  vec2 p = uv;\n  float r = length(p);\n  float a = atan(p.y, p.x);\n\n  vec3 blackPaper = vec3(0.020, 0.018, 0.024);\n  vec3 inkBlue = vec3(0.035, 0.070, 0.105);\n  vec3 brass = vec3(0.78, 0.50, 0.17);\n  vec3 brassLight = vec3(1.00, 0.80, 0.38);\n  vec3 heartRed = vec3(0.93, 0.055, 0.095);\n  vec3 paper = vec3(0.93, 0.88, 0.75);\n\n  vec3 color = mix(blackPaper, inkBlue, 1.0 - smoothstep(0.16, 0.78, r));\n  float radialPaper = 0.5 + 0.5 * sin(a * 16.0 + r * 23.0);\n  color += vec3(0.012) * radialPaper * (1.0 - smoothstep(0.52, 0.72, r));\n\n  float plate = fillMask(r - 0.44, 0.004);\n  float plateInner = fillMask(r - 0.405, 0.004);\n  color = mix(color, vec3(0.055, 0.047, 0.050), plate * 0.96);\n  color = mix(color, vec3(0.025, 0.030, 0.039), plateInner * 0.96);\n\n  float rimOuter = strokeMask(r - 0.44, 0.008, 0.003);\n  float rimInner = strokeMask(r - 0.34, 0.004, 0.002);\n  color += brass * rimOuter * 0.92;\n  color += brassLight * rimInner * 0.56;\n\n  float ticks = 0.0;\n  for (int i = 0; i \u003c 24; i++) {\n    float fi = float(i);\n    float angle = fi * TAU / 24.0;\n    vec2 dir = vec2(cos(angle), sin(angle));\n    float major = 1.0 - step(0.1, mod(fi, 6.0));\n    vec2 start = dir * mix(0.365, 0.345, major);\n    vec2 end = dir * 0.405;\n    float mark = 1.0 - smoothstep(0.002, 0.005, sdSegment(p, start, end));\n    ticks = max(ticks, mark * (0.55 + major * 0.45));\n  }\n  color += brassLight * ticks * 0.82;\n\n  float lockIn = smoothstep(0.34, 0.48, phase);\n  float unlock = smoothstep(0.72, 0.88, phase);\n  float lock = lockIn * (1.0 - unlock);\n  float searchingAngle = -0.75 + 1.25 * sin(t * 2.0) + 0.28 * sin(t * 5.0);\n  float needleAngle = mix(searchingAngle, PI * 0.5, lock);\n  vec2 needleDirection = vec2(cos(needleAngle), sin(needleAngle));\n  float needle = 1.0 - smoothstep(\n    0.004,\n    0.010,\n    sdSegment(p, -needleDirection * 0.12, needleDirection * 0.33)\n  );\n  float counterweight = fillMask(length(p + needleDirection * 0.15) - 0.026, 0.003);\n  color = mix(color, brassLight, needle * 0.94);\n  color = mix(color, brass, counterweight * 0.98);\n\n  float aperture = smoothstep(0.31, 0.52, lock);\n  float petals = 0.0;\n  float petalEdges = 0.0;\n  for (int i = 0; i \u003c 8; i++) {\n    float fi = float(i);\n    float angle = fi * TAU / 8.0 + PI * 0.125;\n    vec2 direction = vec2(cos(angle), sin(angle));\n    vec2 petalCenter = direction * mix(0.085, 0.205, aperture);\n    vec2 petalLocal = rot(-angle) * (p - petalCenter);\n    vec2 petalSize = vec2(\n      mix(0.044, 0.062, aperture),\n      mix(0.015, 0.023, aperture)\n    );\n    float petalDistance = sdEllipseApprox(petalLocal, petalSize);\n    petals = max(petals, fillMask(petalDistance, 0.0025));\n    petalEdges = max(petalEdges, strokeMask(petalDistance, 0.003, 0.0015));\n  }\n  color = mix(color, mix(brass, brassLight, aperture * 0.34), petals * 0.96);\n  color += brassLight * petalEdges * (0.24 + aperture * 0.34);\n\n  vec2 heartPoint = p / mix(0.105, 0.135, aperture);\n  float heartDistance = sdHeart(heartPoint) * mix(0.105, 0.135, aperture);\n  float heart = fillMask(heartDistance, 0.004);\n  float heartEdge = strokeMask(heartDistance, 0.007, 0.003);\n  float heartGlow = exp(-abs(heartDistance) * 22.0) * aperture;\n  color += heartRed * heartGlow * 0.46;\n  color = mix(color, mix(vec3(0.42, 0.015, 0.028), heartRed, 0.58 + aperture * 0.42), heart);\n  color += paper * heartEdge * 0.34;\n\n  float lockedPointer = 1.0 - smoothstep(\n    0.004,\n    0.009,\n    sdSegment(p, vec2(0.0, 0.105), vec2(0.0, 0.315))\n  );\n  float pointerLeft = 1.0 - smoothstep(\n    0.003,\n    0.007,\n    sdSegment(p, vec2(0.0, 0.315), vec2(-0.030, 0.275))\n  );\n  float pointerRight = 1.0 - smoothstep(\n    0.003,\n    0.007,\n    sdSegment(p, vec2(0.0, 0.315), vec2(0.030, 0.275))\n  );\n  color = mix(\n    color,\n    brassLight,\n    max(lockedPointer, max(pointerLeft, pointerRight)) * lock\n  );\n\n  float centerPin = fillMask(r - 0.022, 0.002);\n  float pinLight = fillMask(length(p - vec2(-0.007, 0.009)) - 0.005, 0.0015);\n  color = mix(color, brassLight, centerPin);\n  color = mix(color, paper, pinLight);\n\n  float lockedHalo = strokeMask(r - 0.285, 0.003, 0.002) * lock;\n  color += heartRed * lockedHalo * 0.82;\n  float vignette = 1.0 - smoothstep(0.48, 0.76, length(uv));\n  color *= 0.78 + vignette * 0.22;\n  color = pow(clamp(color, 0.0, 1.0), vec3(0.92));\n  gl_FragColor = vec4(color, 1.0);\n}";

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.



  </script>
<script type="module">
(async () => {
  window.strudelState = 'loading';
  window.strudelError = null;
  try {
    const CONFIG = JSON.parse("{\"code\":\"// BPM: 68\\n// DURATION: 60\\n// FORM: 17 cycles — searching bearings 1-6, convergence 7-9, heart lock 10-12, doubt and return 13-17\\n\\n// The bass names each borrowed direction, converges on D, then retraces toward home.\\n$: note(\\\"\u003cd2 a1 c2 e2 f2 c2 g1 a1 d2 [d2,a2] [f2,c3] [d2,a2] a1 g1 e2 c2 d2>\\\")\\n  .s(\\\"sine\\\").attack(.16).release(2.35).lpf(430).room(.4).gain(.31).orbit(0)\\n\\n// A small three-note needle motif searches, straightens into dyads, and starts searching again.\\n$: note(\\\"\u003ca3 e4 d4 ~ f4 c4 g3 a3 [d4,a4] [f4,a4] [d4,a4] [c4,g4] a3 g3 e4 ~ a3>\\\")\\n  .s(\\\"triangle\\\").attack(.12).release(2.1).lpf(1800).room(.52).gain(.22)\\n  .pan(\\\"\u003c.3 .68 .8 .42>\\\").orbit(1)\\n\\n// Dry upper ticks become evenly spaced only during the held vertical alignment.\\n$: note(\\\"\u003c[d5 ~] [a5 ~ e5] ~ [f5 ~ c6] [e5 ~ b5] ~ [d5 a5] [e5 a5] [d5 a5 d6] [d5 a5 d6] [d5 a5 d6] [c5 g5 c6] [a4 ~ e5] ~ [e5 ~ b5] ~ [d5 ~]>\\\")\\n  .s(\\\"sine\\\").attack(.01).release(.55).hpf(780).lpf(3000).room(.24).gain(.09)\\n  .pan(\\\"\u003c.2 .78 .36 .66>\\\").orbit(2)\\n\\n// The red center receives one restrained chordal bloom instead of a cinematic impact.\\n$: note(\\\"\u003c~ ~ ~ ~ ~ ~ ~ ~ d3 [d3,a3,d4] [f3,a3,c4] [d3,a3,d4] c3 ~ ~ ~ ~>\\\")\\n  .s(\\\"triangle\\\").attack(.5).release(2.9).lpf(900).room(.58).gain(.17).orbit(3)\\n\",\"bpm\":68,\"durationSec\":60,\"renderDurationSec\":63,\"cps\":0.2833333333333333,\"cycles\":17,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"maxTimelineEvents\":6000}");
    const S = await import(CONFIG.cdn);
    window.StrudelLib = S;
    window.strudelConfig = CONFIG;

    let inited = false;
    async function ensureInit() {
      if (inited) return;
      await S.initStrudel({ autoplay: false });
      await S.evaluate(CONFIG.code, false);
      inited = true;
      await buildTimeline();
      console.log('🎵 strudel initialized (' + window.strudelTimeline.events.length + ' events)');
    }

    function hapToEvent(hap) {
      const value = typeof hap.value === 'object' && hap.value !== null ? hap.value : {};
      return {
        c: hap.whole ? hap.whole.begin.valueOf() : hap.part.begin.valueOf(),
        d: typeof hap.duration === 'number' ? hap.duration : (hap.duration?.valueOf?.() ?? 0),
        s: value.s != null ? String(value.s) : null,
        n: value.n != null ? String(value.n) : null,
        note: value.note != null ? String(value.note) : null,
        gain: value.gain != null ? Number(value.gain) : 1
      };
    }

    async function buildTimeline() {
      const pattern = S.getPattern();
      if (!pattern) throw new Error('no strudel pattern found after evaluation');
      const queryCycles = Math.min(CONFIG.cycles, 128);
      const haps = pattern.queryArc(0, queryCycles, { _cps: CONFIG.cps })
        .filter(hap => hap.hasOnset && hap.hasOnset())
        .sort((a, b) => (a.whole?.begin.valueOf() ?? 0) - (b.whole?.begin.valueOf() ?? 0));
      window.strudelTimeline = {
        bpm: CONFIG.bpm,
        cps: CONFIG.cps,
        cycles: CONFIG.cycles,
        events: haps.slice(0, CONFIG.maxTimelineEvents).map(hapToEvent)
      };
      document.dispatchEvent(new CustomEvent('strudel:timeline', { detail: window.strudelTimeline }));
    }

    // ---- public API for animation code ----
    window.getStrudelEventsAt = function(tSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const cycle = tSeconds * tl.cps;
      return tl.events.filter(ev => cycle >= ev.c && cycle < ev.c + Math.max(ev.d, 0.001));
    };
    window.getStrudelOnsetsBetween = function(fromSeconds, toSeconds) {
      const tl = window.strudelTimeline;
      if (!tl) return [];
      const c0 = fromSeconds * tl.cps;
      const c1 = toSeconds * tl.cps;
      return tl.events.filter(ev => ev.c >= c0 && ev.c < c1);
    };

    // ---- live playback ----
    let playStartedAt = null;
    window.__playStrudel = async function() {
      await ensureInit();
      await S.evaluate(CONFIG.code, true);
      if (!S.getPattern()) throw new Error('strudel playback produced no pattern');
      const audioContext = typeof S.getAudioContext === 'function'
        ? S.getAudioContext()
        : S.audioContext;
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      playStartedAt = performance.now();
    };
    window.__stopStrudel = function() {
      try { S.hush(); } catch (err) {}
      playStartedAt = null;
    };
    window.__strudelVizTime = function() {
      if (playStartedAt == null) return null;
      return (performance.now() - playStartedAt) / 1000;
    };

    // ---- offline rendering (video pipeline) ----
    window.__renderStrudelOffline = async function() {
      await ensureInit();
      await S.renderPatternAudio(
        S.getPattern(),
        CONFIG.cps,
        0,
        CONFIG.cycles,
        CONFIG.sampleRate,
        S.DEFAULT_MAX_POLYPHONY,
        false,
        'clawedcode-strudel'
      );
      return true;
    };

    // Audio must not paint generic debug graphics over authored visual art.
    // Deliberately audio-reactive pieces can use getStrudelEventsAt() and
    // getStrudelOnsetsBetween() inside their own visual language. Keep a no-op
    // hook only for compatibility with older render callers.
    window.__drawStrudelOverlay = function() {};

    // wire the shared #audio-toggle button for live playback
    const toggle = document.getElementById('audio-toggle');
    function setTogglePlaying(playing) {
      if (!toggle) return;
      toggle.dataset.strudelPlaying = playing ? '1' : '0';
      toggle.textContent = playing ? '■ Stop' : '▶ Play';
      toggle.title = '';
    }
    if (toggle) {
      toggle.addEventListener('click', async () => {
        toggle.disabled = true;
        try {
          if (toggle.dataset.strudelPlaying === '1') {
            window.__stopStrudel();
            setTogglePlaying(false);
          } else {
            toggle.textContent = '⏳ Loading…';
            await window.__playStrudel();
            setTogglePlaying(true);
          }
        } catch (error) {
          window.strudelError = error && error.message ? error.message : String(error);
          window._errors = window._errors || [];
          window._errors.push('strudel playback failed: ' + window.strudelError);
          toggle.dataset.strudelPlaying = '0';
          toggle.textContent = '⚠ Audio Error';
          toggle.title = window.strudelError;
          console.error('strudel playback failed:', window.strudelError);
        } finally {
          toggle.disabled = false;
        }
      });
    }

    // GitHub Pages opens mind animations in an iframe with ?autoplay=true and
    // sends stop-audio before closing or navigating. Mirror the Tone.js player
    // contract while retaining the visible Play fallback when browser policy
    // rejects programmatic playback.
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'stop-audio') return;
      window.__stopStrudel();
      setTogglePlaying(false);
    });
    window.addEventListener('pagehide', () => window.__stopStrudel());

    // preload timeline without starting audio (also validates the program)
    await ensureInit();
    window.strudelState = 'ready';
    if (toggle) {
      toggle.disabled = false;
      setTogglePlaying(false);
    }
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('autoplay') === 'true') {
      setTimeout(async () => {
        if (toggle?.dataset.strudelPlaying === '1') return;
        try {
          await window.__playStrudel();
          setTogglePlaying(true);
        } catch (error) {
          window.__stopStrudel();
          setTogglePlaying(false);
          if (toggle) toggle.title = 'Autoplay blocked — click to play';
          console.warn('strudel autoplay blocked; waiting for user interaction');
        }
      }, 250);
    }
    window.ready = true;
  } catch (error) {
    window.strudelState = 'error';
    window.strudelError = error && error.message ? error.message : String(error);
    console.error('strudel init failed:', window.strudelError);
    window._errors = window._errors || [];
    window._errors.push('strudel init failed: ' + window.strudelError);
    const toggle = document.getElementById('audio-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.dataset.strudelPlaying = '0';
      toggle.textContent = '⚠ Audio Error';
      toggle.title = window.strudelError;
    }
    // Define a throwing hook so the video pipeline fails fast with the real
    // error instead of timing out waiting for a function that will never exist.
    window.__renderStrudelOffline = async () => {
      throw new Error('strudel bootstrap failed: ' + (error && error.message ? error.message : String(error)));
    };
    window.ready = true; // visuals still render even when audio fails
  }
})();
</script>
</body>
