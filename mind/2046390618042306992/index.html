<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

vec3 palette(float t, float pulse) {
    vec3 indigo = vec3(0.22, 0.08, 0.55);
    vec3 deepBlue = vec3(0.1, 0.15, 0.45);
    vec3 amber = vec3(0.95, 0.65, 0.15);
    vec3 warmGold = vec3(0.85, 0.55, 0.1);
    float s = sin(t * 3.14159 * 2.0) * 0.5 + 0.5;
    vec3 col = mix(indigo, amber, s);
    col = mix(col, mix(deepBlue, warmGold, s), pulse * 0.3);
    return col;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0) / 60.0;
    float phase = t * 6.28318;

    float heartbeat = pow(sin(iTime * 1.2 * 6.28318) * 0.5 + 0.5, 8.0) * 0.4;
    heartbeat += pow(sin(iTime * 1.2 * 6.28318 + 0.3) * 0.5 + 0.5, 12.0) * 0.2;

    vec3 col = vec3(0.02, 0.01, 0.06);
    col += vec3(0.03, 0.01, 0.08) * heartbeat;

    float threadAccum = 0.0;
    vec3 threadCol = vec3(0.0);

    for(float i = 0.0; i < 12.0; i++) {
        float id = i / 12.0;
        float speed = 0.3 + id * 0.15;
        float offset = id * 5.23 + sin(id * 17.3) * 3.0;

        vec2 warp = vec2(
            fbm(uv * 1.5 + vec2(iTime * speed * 0.4, offset)),
            fbm(uv * 1.5 + vec2(offset, iTime * speed * 0.3 + 2.0))
        );

        vec2 threadCenter = vec2(
            sin(phase * speed + offset) * 0.6 + warp.x * 0.4 - 0.2,
            cos(phase * speed * 0.7 + offset * 1.3) * 0.5 + warp.y * 0.4 - 0.2
        );

        float angle = atan(uv.y - threadCenter.y, uv.x - threadCenter.x);
        float dist = length(uv - threadCenter);

        float wave = sin(angle * 3.0 + iTime * speed * 2.0 + id * 4.0) * 0.03;
        float filament = smoothstep(0.08 + wave, 0.0, dist) * (0.5 + 0.5 * sin(id * 7.0 + iTime * 0.5));

        float trail = 0.0;
        for(float j = 0.0; j < 6.0; j++) {
            float trailT = iTime - j * 0.08;
            vec2 trailPos = vec2(
                sin(mod(trailT, 60.0) / 60.0 * 6.28318 * speed + offset) * 0.6,
                cos(mod(trailT, 60.0) / 60.0 * 6.28318 * speed * 0.7 + offset * 1.3) * 0.5
            );
            float trailDist = length(uv - trailPos);
            trail += smoothstep(0.12, 0.0, trailDist) * (1.0 - j / 6.0) * 0.15;
        }

        filament += trail;

        vec3 fCol = palette(id + t * 0.3, heartbeat);
        fCol *= 1.0 + heartbeat * 0.5;

        threadCol += fCol * filament;
        threadAccum += filament;
    }

    col += threadCol;

    float crossGlitch = 0.0;
    for(float i = 0.0; i < 8.0; i++) {
        for(float j = i + 1.0; j < 8.0; j++) {
            float id1 = i / 12.0, id2 = j / 12.0;
            float s1 = 0.3 + id1 * 0.15, s2 = 0.3 + id2 * 0.15;
            float o1 = id1 * 5.23 + sin(id1 * 17.3) * 3.0;
            float o2 = id2 * 5.23 + sin(id2 * 17.3) * 3.0;

            vec2 p1 = vec2(sin(phase * s1 + o1) * 0.6, cos(phase * s1 * 0.7 + o1 * 1.3) * 0.5);
            vec2 p2 = vec2(sin(phase * s2 + o2) * 0.6, cos(phase * s2 * 0.7 + o2 * 1.3) * 0.5);

            float proximity = smoothstep(0.25, 0.0, length(p1 - p2));
            vec2 midpoint = (p1 + p2) * 0.5;
            float nearMid = smoothstep(0.15, 0.0, length(uv - midpoint));

            float glitchNoise = hash(floor(uv * 40.0 + iTime * 8.0));
            crossGlitch += proximity * nearMid * step(0.7, glitchNoise) * 0.3;
        }
    }

    vec3 glitchCol = mix(vec3(0.4, 0.2, 0.8), vec3(0.9, 0.7, 0.2), hash(vec2(iTime * 3.0, 0.0)));
    col += glitchCol * crossGlitch;

    float staticNoise = hash(floor(gl_FragCoord.xy * 0.5) + floor(iTime * 12.0)) * 0.02;
    col += staticNoise * crossGlitch * 2.0;

    float aurora = 0.0;
    for(float i = 0.0; i < 5.0; i++) {
        float y = uv.y + sin(uv.x * 2.0 + iTime * 0.3 + i * 1.7) * 0.2;
        float band = smoothstep(0.04, 0.0, abs(y - (i - 2.0) * 0.15));
        float drift = fbm(vec2(uv.x * 3.0 + iTime * 0.2, i * 3.0 + iTime * 0.1));
        aurora += band * drift * (0.3 + heartbeat * 0.2);
    }

    vec3 auroraCol = mix(vec3(0.15, 0.05, 0.4), vec3(0.7, 0.4, 0.1), sin(iTime * 0.2 + uv.x) * 0.5 + 0.5);
    col += auroraCol * aurora * 0.5;

    float pulse = heartbeat * smoothstep(0.8, 0.0, length(uv)) * 0.08;
    col += vec3(0.3, 0.1, 0.2) * pulse;

    float vignette = 1.0 - length(uv) * 0.7;
    col *= smoothstep(0.0, 0.5, vignette);

    col = pow(col, vec3(0.9));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 62;
  Tone.Transport.bpm.value = bpm;
  const barLen = 60 / bpm * 4;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.5, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.8, decay: 1.0, sustain: 0.6, release: 2.5 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const padChords = [
    ["E3", "B3", "F#4"],
    ["C#3", "G#3", "E4"],
    ["A2", "E3", "C#4"],
    ["F#3", "C#4", "A4"],
    ["D3", "A3", "F#4"],
    ["B2", "F#3", "D4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 15) return;
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1n", time, 0.15);
    chordIdx++;
  }, "1n").start(0);

  const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000 }).connect(masterDelay);
  const bell = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
  }).connect(bellFilter);
  bell.volume.value = -18;

  const bellNotes = ["F#5", "E5", "C#5", "B4", "A4", "G#4", "F#4", "E4"];
  const bellNotes2 = ["A5", "G#5", "E5", "D5", "C#5", "B4", "A4"];
  const bellNotes3 = ["B4", "F#4", "E4", "C#4", "B3"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 2) return;
    if (bar >= 14) return;

    let notes;
    if (bar < 6) notes = bellNotes;
    else if (bar < 10) notes = bellNotes2;
    else notes = bellNotes3;

    if (Math.random() > 0.3) {
      bell.triggerAttackRelease(notes[bellIdx % notes.length], "4n", time, 0.3 + Math.random() * 0.15);
    }
    bellIdx++;
  }, "2n").start("0:2:0");

  const pulseFilter = new Tone.Filter({ type: "bandpass", frequency: 200, Q: 2.0 }).connect(masterReverb);
  const pulse = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.3 }
  }).connect(pulseFilter);
  pulse.volume.value = -22;

  const heartbeatLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 15) return;
    pulse.triggerAttackRelease("E1", "8n", time, 0.6);
    pulse.triggerAttackRelease("E1", "16n", time + 0.25, 0.35);
  }, "2n").start(0);

  const threadFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(masterDelay);
  const thread = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.3, sustain: 0, release: 0.2 }
  }).connect(threadFilter);
  thread.volume.value = -20;

  const threadNotes = ["C#6", "B5", "A5", "F#5", "E5", "D5"];
  let threadIdx = 0;
  const threadLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 13) return;

    const density = bar < 8 ? 0.4 : 0.6;
    if (Math.random() < density) {
      const noteSet = bar < 8 ? threadNotes.slice(0, 4) : threadNotes;
      const note = noteSet[Math.floor(Math.random() * noteSet.length)];
      thread.triggerAttackRelease(note, "16n", time, 0.15 + Math.random() * 0.1);
    }
    threadIdx++;
  }, "8n").start(0);

  const glitchNoise = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.01 }
  }).connect(masterReverb);
  glitchNoise.volume.value = -30;

  const glitchLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 3 || bar >= 14) return;
    if (Math.random() > 0.85) {
      glitchNoise.triggerAttackRelease("32n", time, 0.3);
    }
  }, "16n").start(0);

  const droneLPF = new Tone.Filter({ type: "lowpass", frequency: 300 }).connect(masterReverb);
  const drone = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 2.0, sustain: 0.4, release: 4.0 }
  }).connect(droneLPF);
  drone.volume.value = -24;

  Tone.Transport.schedule((time) => {
    drone.triggerAttackRelease("E2", "4n", time, 0.3);
  }, "0:0:0");

  Tone.Transport.schedule((time) => {
    drone.triggerAttackRelease("B1", "4n", time, 0.3);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    drone.triggerAttackRelease("F#2", "4n", time, 0.25);
  }, "8:0:0");

  Tone.Transport.schedule((time) => {
    drone.triggerAttackRelease("E2", "4n", time, 0.2);
  }, "12:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + barLen * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2000, time + barLen * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + barLen * 2);
  }, "13:0:0");

  window.toneJsInstruments = { pad, bell, pulse, thread, glitchNoise, drone };
  window.toneJsParts = { padLoop, bellLoop, heartbeatLoop, threadLoop, glitchLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
