<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

#define PI 3.14159265

float ribbon(vec2 uv, float y, float t) {
  float d = abs(uv.y - y);
  float core = exp(-d * 220.0);
  float bloom = exp(-d * 22.0) * 0.45;
  float halo = exp(-d * 4.5) * 0.12;
  float aura = exp(-d * 1.6) * 0.04;
  return core + bloom + halo + aura;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime;

  float cycle = 5.0;
  float ph = mod(t, cycle) / cycle;
  float conv = 0.5 - 0.5 * cos(ph * 2.0 * PI);

  float hp = (ph - 0.5) * 11.0;
  float beat = exp(-hp * hp * 0.6) * max(0.0, 0.55 + 0.55 * cos(hp * 3.2));

  vec3 col = vec3(0.006, 0.003, 0.012);

  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float pi3 = fi * 2.0 * PI / 3.0;

    float amp = mix(0.42, 0.0, conv);
    float baseY = mix(sin(pi3) * 0.28, 0.0, conv);

    float x = uv.x;
    float w = sin(x * 2.7 + pi3 + t * 0.42)
            + sin(x * 6.1 + pi3 * 1.6 - t * 0.31) * 0.42
            + sin(x * 1.3 + pi3 * 0.8 + t * 0.68) * 0.58;
    w *= 0.36;

    float drift = sin(t * 0.18 + pi3) * 0.05 * (1.0 - conv);

    float y = baseY + drift + amp * w;

    float intensity = ribbon(uv, y, t);

    vec3 c;
    if (i == 0) c = vec3(1.00, 0.58, 0.12);
    else if (i == 1) c = vec3(1.00, 0.12, 0.22);
    else c = vec3(0.18, 0.86, 1.00);

    col += c * intensity;
  }

  float r = length(uv);
  col += vec3(1.0) * beat * conv * exp(-r * r * 2.2) * 1.6;

  vec2 hb = uv * (1.0 + beat * conv * 0.15);
  float crossGlow = beat * conv * exp(-abs(hb.y) * 14.0) * 0.6;
  col += vec3(0.95, 0.95, 1.0) * crossGlow;

  float caustic = 0.0;
  for (int j = 0; j < 3; j++) {
    float fj = float(j);
    float pj = fj * 2.0 * PI / 3.0;
    caustic += 0.04 * (1.0 - conv) * exp(-abs(uv.y - sin(pj) * 0.18) * 9.0)
                                    * (0.5 + 0.5 * sin(uv.x * 12.0 + t * 0.6 + pj));
  }
  col += vec3(caustic * 0.6, caustic * 0.4, caustic * 0.7);

  col = col / (1.0 + col * 0.42);
  col *= 1.0 - 0.32 * pow(length(uv), 2.0);

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 60;
  Tone.Transport.bpm.value = bpm;

  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 7, wet: 0.42 }).toDestination();
  await masterReverb.generate();

  const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.42, wet: 0.22 }).connect(masterReverb);
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 2200, Q: 0.7 }).connect(masterDelay);

  const subDrone = new Tone.Oscillator({ type: "sine", frequency: 55 }).toDestination();
  subDrone.volume.value = -22;
  subDrone.start();

  const subDrone2 = new Tone.Oscillator({ type: "sine", frequency: 82.5 }).toDestination();
  subDrone2.volume.value = -28;
  subDrone2.start();

  const subLFO = new Tone.LFO({ frequency: 0.2, min: -28, max: -18, type: "sine" });
  subLFO.connect(subDrone.volume);
  subLFO.start();

  const heartReverb = new Tone.Reverb({ decay: 2.5, wet: 0.35 }).toDestination();
  await heartReverb.generate();
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.09,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.55, sustain: 0, release: 0.45 }
  }).connect(heartReverb);
  kick.volume.value = -8;

  const heartLoop = new Tone.Loop((time) => {
    kick.triggerAttackRelease("A1", "8n", time + H(3), 0.85);
    kick.triggerAttackRelease("F1", "8n", time + 0.36 + H(3), 0.55);
  }, 5).start(2.5);

  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 850, Q: 1.1 }).connect(masterFilter);
  const amberPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -7,
    envelope: { attack: 1.6, decay: 0.9, sustain: 0.7, release: 3.2 }
  }).connect(amberFilter);
  amberPad.volume.value = -14;

  const crimsonChorus = new Tone.Chorus({ frequency: 0.28, delayTime: 5.5, depth: 0.65, wet: 0.45 }).connect(masterFilter);
  crimsonChorus.start();
  const crimsonFilter = new Tone.Filter({ type: "bandpass", frequency: 620, Q: 1.8 }).connect(crimsonChorus);
  const crimsonPad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.2, decay: 1.0, sustain: 0.55, release: 3.8 }
  }).connect(crimsonFilter);
  crimsonPad.volume.value = -16;

  const cyanReverb = new Tone.Reverb({ decay: 9, wet: 0.7 }).toDestination();
  await cyanReverb.generate();
  const cyanDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.45 }).connect(cyanReverb);
  const cyanBells = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.008, decay: 3.2, sustain: 0, release: 4.5 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.008, decay: 1.2, sustain: 0, release: 1.2 }
  }).connect(cyanDelay);
  cyanBells.volume.value = -17;

  const amberChords = [
    ["A2", "C3", "E3"],
    ["F2", "A2", "C3"],
    ["G2", "B2", "D3"]
  ];
  const crimsonChords = [
    ["E3", "G3", "B3"],
    ["C3", "E3", "G3"],
    ["D3", "F#3", "A3"]
  ];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const ch = chordIdx % 3;
    amberPad.triggerAttackRelease(amberChords[ch], "5m", time + H(15), 0.42);
    crimsonPad.triggerAttackRelease(crimsonChords[ch], "5m", time + 0.12 + H(15), 0.34);
    chordIdx++;
  }, "5m").start(0);

  const cyanClusters = [
    ["A5", "E6", "C6"],
    ["G5", "D6", "B5"],
    ["E5", "B5", "G5"],
    ["C6", "G6", "E6"]
  ];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const cluster = cyanClusters[bellIdx % 4];
    cyanBells.triggerAttackRelease(cluster[0], "2n", time + H(10), 0.62);
    cyanBells.triggerAttackRelease(cluster[1], "2n", time + 0.22 + H(10), 0.45);
    cyanBells.triggerAttackRelease(cluster[2], "2n", time + 0.48 + H(10), 0.38);
    bellIdx++;
  }, 5).start(2.3);

  const breathLFO = new Tone.LFO({
    frequency: 0.2,
    min: 700,
    max: 2800,
    type: "sine"
  });
  breathLFO.connect(masterFilter.frequency);
  breathLFO.start();

  const amberBreathLFO = new Tone.LFO({
    frequency: 0.2,
    min: 500,
    max: 1400,
    type: "sine",
    phase: 90
  });
  amberBreathLFO.connect(amberFilter.frequency);
  amberBreathLFO.start();

  window.toneJsInstruments = { subDrone, subDrone2, kick, amberPad, crimsonPad, cyanBells };
  window.toneJsParts = { heartLoop, padLoop, bellLoop, breathLFO, amberBreathLFO, subLFO };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
