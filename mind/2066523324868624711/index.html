<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 h22(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .103, .0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
}

float h12(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float nse(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h12(i), h12(i + vec2(1.0, 0.0)), f.x),
               mix(h12(i + vec2(0.0, 1.0)), h12(i + vec2(1.0, 1.0)), f.x), f.y);
}

float S(float w, float x) { return 1.0 - smoothstep(0.0, w, x); }

float sdSeg(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
}

float segT(vec2 p, vec2 a, vec2 b) {
    vec2 ba = b - a;
    return clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
}

void main() {
    vec2 uv = gl_FragCoord.xy / iResolution.xy;
    vec2 st = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);

    vec3 cT = vec3(0.0, 0.85, 0.75);
    vec3 cV = vec3(0.55, 0.2, 0.95);
    vec3 cW = vec3(0.9, 0.95, 1.0);

    float gp = step(0.96, sin(t * 5.3 + uv.y * 25.0)) * 0.015
             + step(0.99, sin(t * 13.7 + uv.y * 55.0)) * 0.04;
    st.x += gp * sign(sin(t * 87.0));

    vec3 col = mix(vec3(0.008, 0.012, 0.035), vec3(0.015, 0.022, 0.055), uv.y * 0.5 + 0.5);
    col += vec3(0.012, 0.025, 0.045) * nse(st * 3.0 + t * 0.02) * nse(st * 5.5 - t * 0.015);

    for (float i = 0.0; i < 4.0; i++) {
        vec2 su = st * (4.0 + i * 5.0);
        vec2 sc = floor(su);
        vec2 sf = fract(su);
        float d = length(sf - h22(sc + i * 73.0));
        float b = S(0.02, d) * (0.3 + 0.7 * h12(sc));
        b *= 0.5 + 0.5 * sin(t * (0.3 + h12(sc + 3.0)) + h12(sc + 7.0) * 6.28);
        col += mix(vec3(0.15, 0.45, 0.65), vec3(0.35, 0.25, 0.75), h12(sc + 11.0)) * b * 0.07;
    }

    float gsc = 5.5;
    vec2 guv = st * gsc;
    vec2 gc = floor(guv);
    float netL = 0.0, nodeG = 0.0, filG = 0.0;
    vec3 filC = vec3(0.0);

    float w = 0.10472;
    vec2 s1 = vec2(sin(t * w) * 0.65, cos(t * w * 2.0) * 0.35);
    vec2 s2 = vec2(cos(t * w * 3.0) * 0.55, sin(t * w * 4.0) * 0.4);

    for (float dx = -2.0; dx <= 2.0; dx++) {
        for (float dy = -2.0; dy <= 2.0; dy++) {
            vec2 cell = gc + vec2(dx, dy);
            vec2 np = (cell + h22(cell) * 0.6 + 0.2) / gsc;
            float nd = length(st - np);
            float dp = 0.6 + 0.4 * h12(cell + 99.0);

            float d1 = length(np - s1);
            float d2 = length(np - s2);
            float w1 = sin(d1 * 10.0 - t * 2.83) * S(1.5, d1);
            float w2 = sin(d2 * 10.0 - t * 2.2 + 0.8) * S(1.5, d2);
            float nA = max(smoothstep(0.0, 0.5, w1), smoothstep(0.0, 0.5, w2));
            nA *= 0.6 + 0.4 * sin(t * 10.0 + h12(cell) * 25.0);

            float pl = 0.3 + 0.7 * sin(t * 1.5 + h12(cell) * 6.28);
            nodeG += S(0.015, nd) * (0.1 + 0.9 * nA) * pl * dp;
            nodeG += S(0.035, nd) * (1.0 - S(0.012, nd)) * nA * 0.3 * dp;

            for (float ex = -1.0; ex <= 1.0; ex++) {
                for (float ey = -1.0; ey <= 1.0; ey++) {
                    if (ex == 0.0 && ey == 0.0) continue;
                    vec2 nc = cell + vec2(ex, ey);
                    if (h12(cell + nc) > 0.42) continue;

                    vec2 nnp = (nc + h22(nc) * 0.6 + 0.2) / gsc;
                    float sd = sdSeg(st, np, nnp);
                    float sp = segT(st, np, nnp);
                    float edp = mix(dp, 0.6 + 0.4 * h12(nc + 99.0), sp);

                    netL += S(0.003, sd) * 0.04 * edp;

                    vec2 ep = mix(np, nnp, sp);
                    float ed1 = length(ep - s1);
                    float ed2 = length(ep - s2);
                    float ew1 = sin(ed1 * 10.0 - t * 2.83 + sp * 2.5) * S(1.5, ed1);
                    float ew2 = sin(ed2 * 10.0 - t * 2.2 + sp * 2.0 + 0.8) * S(1.5, ed2);
                    float eA = max(smoothstep(0.1, 0.6, ew1), smoothstep(0.1, 0.6, ew2));
                    float fl = 0.5 + 0.5 * sin(t * 8.0 + h12(cell + nc) * 20.0);

                    float fil = S(0.004, sd) * eA * fl * edp;
                    float hue = smoothstep(0.0, 1.5, ed1) * (1.0 - smoothstep(0.0, 1.5, ed2));
                    vec3 eCol = mix(cT, cV, hue + 0.3 * sin(t * 0.4 + sp * 3.0));

                    filG += fil * 0.5;
                    filC += eCol * fil * 0.5;
                }
            }
        }
    }

    col += vec3(0.0, 0.7, 0.6) * netL * 0.35;
    col += mix(cT, cW, 0.3) * nodeG;
    col += filC * 2.0;
    col += cW * filG * filG * 0.5;

    if (gp > 0.01) {
        col.r += gp * 12.0;
        col.b -= gp * 5.0;
        col *= 0.75 + 0.25 * step(0.5, fract(gl_FragCoord.y * 0.5));
    }

    col *= 0.93 + 0.07 * sin(t * 0.5);
    col *= 1.0 - 0.3 * dot(st, st);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 72;
    Tone.Transport.bpm.value = bpm;
    const barLen = 4 * 60 / bpm;

    const longVerb = new Tone.Reverb({ decay: 6.0, wet: 0.5 }).toDestination();
    await longVerb.generate();
    const mainVerb = new Tone.Reverb({ decay: 3.0, wet: 0.35 }).toDestination();
    await mainVerb.generate();
    const dly = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.4, wet: 0.3 }).connect(longVerb);

    const sub = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.4, decay: 1.8, sustain: 0.0, release: 0.6 }
    }).toDestination();
    sub.volume.value = -8;

    const subProg = ["D1", "D1", "A0", "A0", "Bb0", "Bb0", "C1", "C1", "D1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        const idx = Math.min(Math.floor(bar / 2), subProg.length - 1);
        sub.triggerAttackRelease(subProg[idx], "2n", time, 0.6);
        subIdx++;
    }, "2n").start(0);

    const padCh = new Tone.Chorus({ frequency: 0.12, delayTime: 4.5, depth: 0.6, wet: 0.35 }).connect(longVerb);
    padCh.start();
    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.5, decay: 1.0, sustain: 0.5, release: 2.0 }
    }).connect(padCh);
    pad.volume.value = -14;

    const padChords = [
        ["D3", "F3", "A3"], ["A2", "C3", "E3"],
        ["Bb2", "D3", "F3"], ["C3", "E3", "G3"],
        ["D3", "A3", "D4"], ["G2", "Bb2", "D3"],
        ["F2", "A2", "C3"], ["A2", "C3", "E3"],
        ["D3", "F3", "A3"]
    ];
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        const idx = Math.min(Math.floor(bar / 2), padChords.length - 1);
        pad.triggerAttackRelease(padChords[idx], "1n", time, 0.2);
    }, "1n").start(0);

    const bell = new Tone.FMSynth({
        harmonicity: 4.0, modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 2.0, sustain: 0.0, release: 0.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.001, decay: 0.5, sustain: 0.0, release: 0.3 }
    }).connect(dly);
    bell.volume.value = -18;

    const bellNotes = ["D4", "F4", "A4", "C5", "D5", "F5", "A5", "C6"];
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 3 && bar < 16) {
            const density = bar < 6 ? 0.2 : bar < 14 ? 0.5 : 0.12;
            if (Math.random() < density) {
                const note = bellNotes[Math.floor(Math.random() * bellNotes.length)];
                bell.triggerAttackRelease(note, "8n", time, 0.15 + Math.random() * 0.25);
            }
        }
    }, "4n").start(0);

    const arpFilt = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 1.5 }).connect(mainVerb);
    const arp = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.005, decay: 0.12, sustain: 0.0, release: 0.08 }
    }).connect(arpFilt);
    arp.volume.value = -20;

    const arpPat1 = ["D4", "F4", "A4", "D5", "A4", "F4"];
    const arpPat2 = ["A3", "C4", "E4", "A4", "G4", "E4", "C4", "A3"];
    let arpIdx = 0;
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 6 && bar < 15) {
            const pat = bar < 10 ? arpPat1 : arpPat2;
            const vel = bar < 14 ? 0.25 : 0.1;
            arp.triggerAttackRelease(pat[arpIdx % pat.length], "16n", time, vel);
        }
        arpIdx++;
    }, "16n").start(0);

    Tone.Transport.schedule((time) => {
        arpFilt.frequency.linearRampToValueAtTime(2200, time + 4 * barLen);
    }, barLen * 6);
    Tone.Transport.schedule((time) => {
        arpFilt.frequency.linearRampToValueAtTime(500, time + 3 * barLen);
    }, barLen * 13);

    const nsFilt = new Tone.Filter({ type: "bandpass", frequency: 3000, Q: 2 }).connect(longVerb);
    const ns = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 0.5, decay: 0.3, sustain: 0.1, release: 1.0 }
    }).connect(nsFilt);
    ns.volume.value = -28;

    const nsLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 8 && bar < 14 && Math.random() < 0.12) {
            ns.triggerAttackRelease("4n", time);
        }
    }, "4n").start(0);

    window.toneJsInstruments = { sub, pad, bell, arp, ns };
    window.toneJsParts = { subLoop, padLoop, bellLoop, arpLoop, nsLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
