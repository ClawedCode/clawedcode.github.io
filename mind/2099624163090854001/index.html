// DURATION: 66
const W=900,H=900,TAU=Math.PI*2,SEED=57662,DUR=66,CELL=7;
const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
const out=canvas.getContext('2d');
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function stream(n){const f=mul32((n*2654435761)>>>0);for(let i=0;i<11;i++)f();return f}
const rd=(R,a,b)=>a+R()*(b-a);
const ri=(R,a,b)=>Math.floor(rd(R,a,b+1));
const ch=(R,p)=>R()<p;
const pk=(R,a)=>a[Math.min(a.length-1,(R()*a.length)|0)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t*t*(3-2*t);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hash(x,y){const n=Math.sin(x*127.1+y*311.7+SEED*74.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v}
function fbm(x,y,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<(o||4);i++){t+=vn(x*f,y*f+i*17)*a;n+=a;a*=.5;f*=2.03}return t/n}

function resample(pts,step){
  if(pts.length<2)return pts.slice();
  const o=[[pts[0][0],pts[0][1]]];let need=step;
  for(let i=1;i<pts.length;i++){
    let x0=pts[i-1][0],y0=pts[i-1][1];const x1=pts[i][0],y1=pts[i][1];
    let d=Math.hypot(x1-x0,y1-y0);
    while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;o.push([x0,y0]);d=Math.hypot(x1-x0,y1-y0);need=step}
    need-=d;
  }
  const l=pts[pts.length-1],e=o[o.length-1];
  if(Math.hypot(l[0]-e[0],l[1]-e[1])>step*.2||o.length<2)o.push([l[0],l[1]]);
  return o;
}
function chaikin(pts,closed,it){
  while(it-->0){
    const o=[],n=pts.length;if(n<3)return pts;
    if(!closed)o.push(pts[0]);
    const end=closed?n:n-1;
    for(let i=0;i<end;i++){const a=pts[i],b=pts[(i+1)%n];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}
    if(!closed)o.push(pts[n-1]);
    pts=o;
  }
  return pts;
}
const curve=(pts,it)=>chaikin(pts,false,it===undefined?3:it);
const loop=(pts,it)=>{const c=chaikin(pts,true,it===undefined?3:it);return c.concat([c[0]])};
function arc(cx,cy,rx,ry,a0,a1,n){const p=[];const N=n||Math.max(16,Math.round((rx+ry)*.35));for(let i=0;i<=N;i++){const t=a0+(a1-a0)*i/N;p.push([cx+Math.cos(t)*rx,cy+Math.sin(t)*ry])}return p}
const ring=(cx,cy,r,n)=>arc(cx,cy,r,r,0,TAU,n);
function blob(R,cx,cy,rx,ry,wob){
  const n=ri(R,7,11),p=[],ph=rd(R,0,TAU),k=wob===undefined?.22:wob;
  for(let i=0;i<n;i++){const t=i/n*TAU,m=1+Math.sin(t*2+ph)*k+rd(R,-k*.5,k*.5);p.push([cx+Math.cos(t)*rx*m,cy+Math.sin(t)*ry*m])}
  return loop(p);
}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){if(q[0]<a)a=q[0];if(q[1]<b)b=q[1];if(q[0]>c)c=q[0];if(q[1]>d)d=q[1]}return[a,b,c,d]}
function rot(pts,cx,cy,a){const s=Math.sin(a),c=Math.cos(a);return pts.map(p=>{const x=p[0]-cx,y=p[1]-cy;return[cx+x*c-y*s,cy+x*s+y*c]})}
function wobble(R,rs,amp){
  const n=rs.length,q=new Array(n);
  const P1=rd(R,0,7),P2=rd(R,0,7),P3=rd(R,0,7),F1=rd(R,1.4,3),F2=rd(R,5,9),dr=rd(R,-.4,.4);
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):0,A=rs[i>0?i-1:0],B=rs[i<n-1?i+1:n-1];
    let nx=-(B[1]-A[1]),ny=B[0]-A[0];const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
    const off=amp*(.58*Math.sin(t*F1*2+P1)+.27*Math.sin(t*F2+P2)+.15*Math.sin(t*19+P3)+dr*(t-.5));
    q[i]=[rs[i][0]+nx*off+rd(R,-.3,.3),rs[i][1]+ny*off+rd(R,-.3,.3)];
  }
  return q;
}

const PAPER='#f6f2ea';
const LEVELS=13;
function screens(cx,angleDeg,cell){
  const pats=[];
  for(let i=0;i<LEVELS;i++){
    const t=i/(LEVELS-1);
    const tile=document.createElement('canvas');tile.width=cell;tile.height=cell;
    const c=tile.getContext('2d');
    if(t>=.995){c.fillStyle='#000';c.fillRect(0,0,cell,cell)}
    else if(t>.76){
      c.fillStyle='#000';c.fillRect(0,0,cell,cell);
      const r=cell*Math.sqrt((1-t)/Math.PI);
      c.globalCompositeOperation='destination-out';
      for(const o of [[0,0],[cell,0],[0,cell],[cell,cell]]){c.beginPath();c.arc(o[0],o[1],r,0,TAU);c.fill()}
    } else if(t>.004){
      const r=cell*Math.sqrt(t/Math.PI);
      c.fillStyle='#000';c.beginPath();c.arc(cell/2,cell/2,r,0,TAU);c.fill();
    }
    const p=cx.createPattern(tile,'repeat');
    if(p.setTransform)p.setTransform(new DOMMatrix().rotateSelf(angleDeg));
    pats.push(p);
  }
  return pats;
}

function separation(ink,angleDeg){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d');
  cx.lineCap='round';cx.lineJoin='round';
  const pats=screens(cx,angleDeg,CELL);
  const tone=v=>pats[clamp(Math.round(clamp(v,0,1)*(LEVELS-1)),0,LEVELS-1)];
  const path=P=>{cx.beginPath();for(let i=0;i<P.length;i++){i?cx.lineTo(P[i][0],P[i][1]):cx.moveTo(P[i][0],P[i][1])}cx.closePath()};
  const S={
    name:ink.name,ctx:cx,canvas:cv,
    flood(v,a){cx.save();cx.globalAlpha=a===undefined?1:a;cx.fillStyle=tone(v===undefined?1:v);cx.fillRect(0,0,W,H);cx.restore()},
    fill(P,v,o){o=o||{};cx.save();cx.globalAlpha=o.a===undefined?1:o.a;cx.fillStyle=tone(v);path(P);cx.fill();cx.restore()},
    rect(x,y,w,h,v,o){S.fill([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],v,o)},
    disc(x,y,r,v,o){S.fill(ring(x,y,r),v,o)},
    ramp(P,v0,v1,dir,bands){
      const b=bands||9,[x0,y0,x1,y1]=bbox(P);
      cx.save();path(P);cx.clip();
      for(let i=0;i<b;i++){
        const t=i/(b-1);cx.fillStyle=tone(lerp(v0,v1,t));
        if(dir==='x')cx.fillRect(x0+(x1-x0)*i/b-1,y0-1,(x1-x0)/b+2,y1-y0+2);
        else cx.fillRect(x0-1,y0+(y1-y0)*i/b-1,x1-x0+2,(y1-y0)/b+2);
      }
      cx.restore();
    },
    line(R,pts,o){
      o=o||{};
      const w=o.w===undefined?1.6:o.w;
      const rs=resample(pts,Math.max(2.4,w*1.4));
      if(rs.length<2)return;
      const q=wobble(R,rs,o.amp===undefined?w*.3+.55:o.amp);
      cx.save();cx.globalAlpha=o.a===undefined?1:o.a;cx.strokeStyle='#000';cx.lineCap='round';
      if(o.taper){
        for(let i=1;i<q.length;i++){
          const t=i/(q.length-1);
          let e=o.taper==='out'?.2+.8*(1-t):o.taper==='in'?.2+.8*t:.25+.75*Math.min(1,Math.min(t,1-t)/.22);
          cx.lineWidth=Math.max(.4,w*e);cx.beginPath();cx.moveTo(q[i-1][0],q[i-1][1]);cx.lineTo(q[i][0],q[i][1]);cx.stroke();
        }
      } else {
        cx.lineWidth=w;cx.beginPath();
        let lift=true;
        for(let i=0;i<q.length;i++){
          if(lift)cx.moveTo(q[i][0],q[i][1]);else cx.lineTo(q[i][0],q[i][1]);
          lift=o.gap?ch(R,o.gap):false;
        }
        cx.stroke();
      }
      cx.restore();
      if(o.pool&&w>=1.5){S.dot(R,q[0][0],q[0][1],w*.62);S.dot(R,q[q.length-1][0],q[q.length-1][1],w*.7)}
    },
    dot(R,x,y,r,a){
      const p=[],ph=rd(R,0,7);
      for(let i=0;i<=9;i++){const t=i/9*TAU,m=1+.2*Math.sin(t*2+ph);p.push([x+Math.cos(t)*r*m,y+Math.sin(t)*r*m])}
      cx.save();cx.globalAlpha=a===undefined?1:a;cx.fillStyle='#000';path(p);cx.fill();cx.restore();
    },
    hatch(R,P,sp,ang,o){
      o=o||{};const [x0,y0,x1,y1]=bbox(P);const cxm=(x0+x1)/2,cym=(y0+y1)/2,d=Math.hypot(x1-x0,y1-y0);
      cx.save();path(P);cx.clip();
      const n=Math.ceil(d/sp);
      for(let i=-n;i<=n;i++){
        const seg=rot([[cxm-d,cym+i*sp],[cxm+d,cym+i*sp]],cxm,cym,ang);
        S.line(R,seg,{w:o.w===undefined?1:o.w,a:o.a,amp:o.amp===undefined?.8:o.amp,gap:o.gap});
      }
      cx.restore();
    },
    stipple(R,P,dens,o){
      o=o||{};const [x0,y0,x1,y1]=bbox(P);
      cx.save();path(P);cx.clip();cx.globalAlpha=o.a===undefined?.9:o.a;cx.fillStyle='#000';
      const n=Math.round((x1-x0)*(y1-y0)*dens/1000);
      for(let i=0;i<n;i++){
        const r=rd(R,o.min===undefined?.7:o.min,o.max===undefined?2.2:o.max);
        cx.beginPath();cx.arc(rd(R,x0,x1),rd(R,y0,y1),r,0,TAU);cx.fill();
      }
      cx.restore();
    },
    text(str,x,y,size,o){
      o=o||{};
      cx.save();cx.globalAlpha=o.a===undefined?1:o.a;
      cx.fillStyle=o.tone===undefined?'#000':tone(o.tone);
      cx.font=(o.weight||'700')+' '+size+'px '+(o.font||'Georgia, "Times New Roman", serif');
      cx.textAlign=o.align||'center';cx.textBaseline=o.base||'middle';
      if(o.rot){cx.translate(x,y);cx.rotate(o.rot);cx.fillText(str,0,0)}else cx.fillText(str,x,y);
      cx.restore();
    },
    clip(P,fn){cx.save();path(P);cx.clip();fn();cx.restore()}
  };
  return S;
}

const INKS=[{name:'blue',rgb:'rgb(36,108,178)',angle:15,density:.93},{name:'pink',rgb:'rgb(255,84,170)',angle:75,density:.92},{name:'yellow',rgb:'rgb(255,222,56)',angle:0,density:.9}];
const SEPS=INKS.map(i=>separation(i,i.angle));
const S={blue:SEPS[0],pink:SEPS[1],yellow:SEPS[2],all:SEPS,W:W,H:H};

const GRAIN=(function(){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d'),R=stream(SEED*991+7);
  for(let i=0;i<W*H/240;i++){
    const s=rd(R,.7,2);
    c.fillStyle=ch(R,.5)?'rgba(255,255,255,'+rd(R,.10,.26).toFixed(3)+')':'rgba(40,30,22,'+rd(R,.04,.09).toFixed(3)+')';
    c.fillRect(rd(R,0,W),rd(R,0,H),s,s);
  }
  for(let i=0;i<14;i++){
    const mx=rd(R,0,W),my=rd(R,0,H),mr=rd(R,60,190);
    c.fillStyle='rgba(40,30,22,0.028)';
    for(let k=0;k<mr*2.4;k++){const t=rd(R,0,TAU),d=Math.sqrt(R())*mr;c.fillRect(mx+Math.cos(t)*d,my+Math.sin(t)*d*.75,rd(R,.9,2.2),rd(R,.9,2.2))}
  }
  return cv;
})();

const PLATES=[];
function plate(name,meta,draw){
  PLATES.push({name:name,about:(meta&&meta.about)||'',hold:Math.max(.4,(meta&&meta.hold)||1),draw:draw});
}

plate('dot', { about: 'a single ink dot alone on bare paper with one loose ring settling around it', hold: 0.7 }, (S, R, p) => {
  S.yellow.flood(.05);
  const cx = 452, cy = 458;
  S.blue.dot(R, cx, cy, 15, .95);
  const off = (1 - ease(p)) * 48;
  S.pink.line(R, ring(cx + off, cy - off * .62, 74, 64), { w: 1.8, a: .85, amp: 1.1 });
});

plate('lighthouse', { about: 'a lighthouse on a headland swinging its beam out across flat water', hold: 1.2 }, (S, R, p) => {
  S.blue.ramp([[0, 0], [900, 0], [900, 648], [0, 648]], .74, .16, 'y', 12);
  S.yellow.rect(0, 648, 900, 252, .16);

  const lx = 322, ly = 296;
  const tower = [[lx - 44, 772], [lx - 25, 322], [lx + 25, 322], [lx + 44, 772]];
  S.blue.fill(tower, .92);
  S.pink.clip(tower, () => {
    for (let i = 0; i < 3; i++) S.pink.rect(lx - 60, 372 + i * 132, 120, 64, .8);
  });
  S.blue.rect(lx - 56, 300, 112, 26, .95);
  S.yellow.disc(lx, ly, 34, .92);
  S.pink.disc(lx, ly, 22, .6, { a: .8 });

  const rock = blob(R, lx + 8, 806, 190, 54, .18);
  S.blue.fill(rock, .85);

  for (let i = 0; i < 7; i++) {
    const y = 682 + i * 26;
    S.blue.line(R, curve([[70, y], [330, y - 7], [600, y + 6], [840, y - 4]]), { w: 1.6, a: .5, amp: 1.6, gap: .09 });
  }

  const a = -1.42 + sm(clamp((p - .16) / .56, 0, 1)) * 1.52;
  const sp = .082;
  const beam = [[lx, ly],
    [lx + Math.cos(a - sp) * 1020, ly + Math.sin(a - sp) * 1020],
    [lx + Math.cos(a + sp) * 1020, ly + Math.sin(a + sp) * 1020]];
  S.yellow.fill(beam, .58, { a: .85 });
  S.pink.fill(beam, .2, { a: .55 });
});

plate('telephone', { about: 'a desk telephone with the handset lifted off and its cord paying out below the table', hold: 1.1 }, (S, R, p) => {
  S.yellow.flood(.12);
  S.blue.ramp([[0, 612], [900, 612], [900, 900], [0, 900]], .1, .4, 'y', 8);

  const body = loop([[288, 512], [612, 512], [656, 606], [246, 606]], 1);
  S.pink.fill(body, .78);
  S.blue.fill(body, .3, { a: .85 });
  S.blue.line(R, body, { w: 2.4, a: .9 });

  S.blue.line(R, ring(450, 552, 44, 40), { w: 2.2, a: .9 });
  for (let i = 0; i < 10; i++) {
    const t = -2.5 + i / 10 * 5.2;
    S.blue.disc(450 + Math.cos(t) * 32, 552 + Math.sin(t) * 29, 5.5, .9);
  }

  const cradle = rot(loop([[520, 392], [742, 392], [756, 442], [506, 442]], 1), 630, 418, .34);
  S.pink.fill(cradle, .82);
  S.yellow.fill(cradle, .44, { a: .85 });
  S.blue.line(R, cradle, { w: 2.2, a: .85 });

  const drop = 148 + ease(p) * 236;
  S.blue.line(R, curve([[314, 600], [268, 660], [300, 700 + drop * .5], [352, 760 + drop]]), { w: 3.2, a: .9, amp: 1.2 });
  for (let i = 0; i < 11; i++) {
    const t = i / 11;
    const cy = 646 + t * (232 + drop * .78);
    S.pink.line(R, ring(300 + Math.sin(t * 5.1) * 26, cy, 20 - t * 5, 24), { w: 2.4, a: .82, amp: 1.1 });
  }
  S.blue.text('the line is still open', 450, 236, 30, { a: .88 });
});

plate('dish', { about: 'a satellite dish on a mast tilted up at an empty sky', hold: 1 }, (S, R, p) => {
  S.blue.ramp([[0, 0], [900, 0], [900, 900], [0, 900]], .3, .05, 'y', 10);
  const cx = 468, cy = 424;

  S.blue.line(R, curve([[cx + 26, 486], [cx + 40, 690], [cx + 54, 900]]), { w: 13, a: .95, amp: .6 });
  S.blue.line(R, curve([[cx - 92, 470], [cx + 10, 596]]), { w: 5, a: .9 });

  const face = rot(arc(cx, cy, 204, 94, 0, TAU, 56), cx, cy, -.38);
  S.yellow.fill(face, .8);
  S.pink.fill(face, .2, { a: .7 });
  S.blue.line(R, face, { w: 2.8, a: .95 });
  S.blue.line(R, rot(arc(cx, cy, 138, 62, 0, TAU, 44), cx, cy, -.38), { w: 1.4, a: .45 });
  S.blue.line(R, rot(arc(cx, cy, 68, 30, 0, TAU, 36), cx, cy, -.38), { w: 1.4, a: .45 });

  const horn = [cx + 64, cy - 168];
  for (let i = 0; i < 3; i++) {
    const t = i / 3 * TAU + .6;
    S.blue.line(R, [[cx + Math.cos(t) * 176 * .92, cy + Math.sin(t) * 82 - 22], horn], { w: 2, a: .8 });
  }
  S.blue.disc(horn[0], horn[1], 15, .92);
  S.yellow.disc(horn[0], horn[1], 8, .9);

  for (let i = 0; i < 6; i++) {
    const t = ((i / 6) + p) % 1;
    const r = 236 + (1 - t) * 322;
    S.blue.line(R, arc(cx + 40, cy - 60, r, r * .8, Math.PI * 1.1, Math.PI * 1.9, 56), { w: 1.4, a: .1 + t * .3, amp: 1.5 });
  }
});

plate('shoal', { about: 'a shoal of small fish all turning at once as the turn passes through them', hold: 1.3 }, (S, R, p) => {
  S.blue.ramp([[0, 0], [900, 0], [900, 900], [0, 900]], .56, .2, 'y', 12);
  for (let i = 0; i < 3; i++) {
    S.blue.line(R, curve([[40, 180 + i * 250], [340, 150 + i * 250], [660, 210 + i * 250], [880, 172 + i * 250]]), { w: 1.4, a: .28, amp: 2.2, gap: .14 });
  }

  for (let i = 0; i < 64; i++) {
    const gx = i % 8, gy = (i / 8) | 0;
    const jx = hash(i, 3), jy = hash(i, 11);
    const x = 152 + gx * 86 + (jx - .5) * 50;
    const y = 196 + gy * 74 + (jy - .5) * 46;
    const wave = sm(clamp((p * 1.55 - x / 1100) * 1.35, 0, 1));
    const ang = -.22 + wave * 1.86 + (jx - .5) * .28;
    const dx = Math.cos(ang) * 25, dy = Math.sin(ang) * 25;
    const fish = [[x - dx, y - dy], [x + dx, y + dy]];
    S.pink.line(R, fish, { w: 6, a: .92, taper: 'in' });
    if (i % 3 === 0) S.yellow.line(R, fish, { w: 4.6, a: .75, taper: 'in' });
    S.blue.dot(R, x + dx * .74, y + dy * .74, 2.6, .8);
  }
});

plate('switchboard', { about: 'an old telephone switchboard with patch cords hanging in loops between its jacks', hold: 1.5 }, (S, R, p) => {
  S.yellow.flood(.2);
  const panel = [[112, 96], [788, 96], [788, 704], [112, 704]];
  S.blue.fill(panel, .62);
  S.blue.stipple(R, panel, .5, { a: .35, min: .7, max: 2 });

function slipOf(i,u,since){

}

e6 b5 a5 c6]] [[e6 b5 a5 c6] [e6 b5 a5 c6]] [e6 b5 a5 c6]\\n  ~ ~ ~\\n  ~ ~ [e5@2 a5@2]\\n>`)\\n  .late(0.0625)\\n  .s(\\\"triangle\\\")\\n  .detune(6)\\n  .attack(0.08).release(1.4).sustain(0.5)\\n  .lpf(2600)\\n  .gain(0.042)\\n  .room(0.75).size(0.85).pan(0.82).orbit(4)\",\"bpm\":60,\"durationSec\":66,\"renderDurationSec\":69,\"cps\":0.25,\"cycles\":16.5,\"cdn\":\"https://unpkg.com/@strudel/web@1.3.0/dist/index.mjs\",\"sampleRate\":44100,\"maxTimelineEvents\":6000}");
