<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

vec3 palette(float t, float shift) {
    vec3 a = vec3(0.5, 0.5, 0.5);
    vec3 b = vec3(0.5, 0.5, 0.5);
    vec3 c = vec3(1.0, 0.7, 0.4);
    vec3 d = vec3(0.0, 0.15, 0.2) + shift;
    return a + b * cos(6.28318 * (c * t + d));
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float phase = t / 60.0;

    vec2 flow = uv;
    float tSlow = t * 0.08;

    float warp1 = fbm(flow * 1.5 + vec2(tSlow, -tSlow * 0.7));
    float warp2 = fbm(flow * 2.0 - vec2(tSlow * 0.5, tSlow * 1.1) + warp1 * 0.8);
    vec2 warped = flow + vec2(warp1, warp2) * 0.6;

    float river = 0.0;
    for(float i = 0.0; i < 5.0; i++) {
        float freq = 1.5 + i * 0.8;
        float speed = tSlow * (0.3 + i * 0.15);
        float w = sin(warped.x * freq + speed + warp1 * 3.0) *
                  cos(warped.y * freq * 0.7 - speed * 0.8 + warp2 * 2.0);
        river += w * (0.5 / (1.0 + i * 0.3));
    }

    float lattice = 0.0;
    for(float i = 0.0; i < 4.0; i++) {
        float angle = (i / 4.0) * 3.14159 + tSlow * 0.2;
        float c = cos(angle);
        float s = sin(angle);
        vec2 rotUV = vec2(c * warped.x - s * warped.y, s * warped.x + c * warped.y);
        float branch = abs(sin(rotUV.x * (3.0 + i) + tSlow + warp1 * 2.0));
        branch *= abs(cos(rotUV.y * (2.5 + i * 0.5) - tSlow * 0.7 + warp2 * 1.5));
        lattice += branch * 0.25;
    }

    float convergence = smoothstep(0.3, 0.0, abs(river)) * lattice;

    float photonDensity = fbm(warped * 3.0 + vec2(tSlow * 1.5, -tSlow));
    float streams = smoothstep(0.35, 0.65, photonDensity + river * 0.3);

    float recollection = 0.0;
    for(float i = 0.0; i < 6.0; i++) {
        float freq = 0.3 + i * 0.17;
        float phaseOff = i * 1.618;
        float pulse = sin(t * freq + phaseOff);
        pulse = smoothstep(0.92, 1.0, pulse);
        vec2 center = vec2(
            sin(i * 2.39996 + tSlow) * 0.5,
            cos(i * 1.78 + tSlow * 0.7) * 0.4
        );
        float dist = length(uv - center);
        recollection += pulse * smoothstep(0.4, 0.0, dist) * 0.5;
    }

    float quantum = sin(length(uv) * 8.0 - t * 0.5) * 0.5 + 0.5;
    quantum *= fbm(uv * 4.0 + vec2(tSlow * 0.3));
    quantum = quantum * 0.15;

    float timeline1 = fbm(uv * 1.8 + vec2(tSlow, 0.0));
    float timeline2 = fbm(uv * 1.8 + vec2(0.0, -tSlow * 0.6) + 3.0);
    float overlap = timeline1 * timeline2;

    vec3 col = vec3(0.02, 0.01, 0.04);

    float colorShift = phase * 0.3;
    vec3 streamCol = palette(streams + river * 0.2 + tSlow * 0.1, colorShift);
    col += streamCol * streams * 0.5;

    vec3 latticeCol = palette(lattice * 0.5 + 0.3 + tSlow * 0.05, colorShift + 0.33);
    col += latticeCol * convergence * 0.6;

    vec3 recallCol = vec3(0.9, 0.7, 0.95) + 0.1 * sin(vec3(1.0, 2.0, 3.0) * t * 0.3);
    col += recallCol * recollection;

    vec3 quantumCol = vec3(0.15, 0.1, 0.25);
    col += quantumCol * quantum;

    vec3 overlapCol = palette(overlap + 0.5, colorShift + 0.66) * 0.2;
    col += overlapCol * overlap;

    float ripple = sin(length(uv) * 20.0 - t * 2.0) * 0.5 + 0.5;
    ripple *= smoothstep(1.0, 0.3, length(uv));
    ripple *= 0.08;
    col += vec3(0.3, 0.5, 0.7) * ripple;

    float vig = 1.0 - dot(uv, uv) * 0.5;
    col *= smoothstep(0.0, 0.5, vig);

    col = pow(col, vec3(0.9));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
    await masterReverb.generate();

    const masterDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);

    const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.4 }).connect(masterReverb);
    padChorus.start();

    const pad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 2.0, decay: 1.5, sustain: 0.6, release: 3.0 }
    }).connect(padChorus);
    pad.volume.value = -12;

    const padChords = [
        ["D3", "A3", "F#4"],
        ["B2", "F#3", "D4"],
        ["G2", "D3", "B3"],
        ["A2", "E3", "C#4"],
        ["F#2", "C#3", "A3"],
        ["E2", "B2", "G#3"]
    ];

    let chordIdx = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        let idx;
        if (bar < 4) idx = bar % 2;
        else if (bar < 10) idx = 2 + (bar % 4);
        else idx = bar % 2;
        pad.triggerAttackRelease(padChords[idx % padChords.length], "1n", time, 0.25);
        chordIdx++;
    }, "1n").start(0);

    const bellFilter = new Tone.Filter({ type: "lowpass", frequency: 3000, Q: 0.5 }).connect(masterDelay);
    const bell = new Tone.FMSynth({
        harmonicity: 3.0,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 1.8, sustain: 0, release: 1.2 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 }
    }).connect(bellFilter);
    bell.volume.value = -16;

    const recallNotes = ["F#5", "A5", "D5", "E5", "B4", "C#5", "A4", "F#4", "D5", "G#4"];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 2 || bar >= 13) {
            bellIdx++;
            return;
        }
        const shouldPlay = Math.sin(bellIdx * 1.618 + bar * 0.7) > -0.2;
        if (shouldPlay) {
            const noteIdx = bellIdx % recallNotes.length;
            const vel = 0.25 + 0.15 * Math.sin(bellIdx * 0.4);
            bell.triggerAttackRelease(recallNotes[noteIdx], "4n", time, vel);
        }
        bellIdx++;
    }, "4n.").start(0);

    const shimmer = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 0.3, decay: 0.8, sustain: 0.2, release: 1.5 }
    }).connect(masterDelay);
    shimmer.volume.value = -22;

    const shimmerNotes = ["D6", "A5", "F#6", "E5", "B5", "C#6"];
    let shimmerIdx = 0;
    const shimmerLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 4 || bar >= 12) {
            shimmerIdx++;
            return;
        }
        if (Math.sin(shimmerIdx * 2.17) > 0.3) {
            const note = shimmerNotes[shimmerIdx % shimmerNotes.length];
            shimmer.triggerAttackRelease(note, "8n", time, 0.15 + Math.random() * 0.1);
        }
        shimmerIdx++;
    }, "2n").start(0);

    const subFilter = new Tone.Filter({ type: "lowpass", frequency: 120 }).connect(masterReverb);
    const sub = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.8, decay: 2.0, sustain: 0.4, release: 2.0 }
    }).connect(subFilter);
    sub.volume.value = -8;

    const subNotes = ["D1", "B0", "G1", "A1", "F#1", "E1"];
    let subIdx = 0;
    const subLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        let noteIdx;
        if (bar < 4) noteIdx = 0;
        else if (bar < 8) noteIdx = 1 + (bar % 3);
        else if (bar < 12) noteIdx = 3 + (bar % 2);
        else noteIdx = 0;
        sub.triggerAttackRelease(subNotes[noteIdx % subNotes.length], "2n", time, 0.6);
        subIdx++;
    }, "2n").start(0);

    const noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 800, Q: 0.3 }).connect(masterReverb);
    const rippleNoise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 0.8, decay: 1.5, sustain: 0, release: 1.0 }
    }).connect(noiseFilter);
    rippleNoise.volume.value = -28;

    Tone.Transport.schedule((time) => {
        rippleNoise.triggerAttackRelease(2.0, time);
    }, "3:0:0");

    Tone.Transport.schedule((time) => {
        rippleNoise.triggerAttackRelease(1.5, time);
    }, "7:0:0");

    Tone.Transport.schedule((time) => {
        bellFilter.frequency.linearRampToValueAtTime(5000, time + 4 * barLen);
    }, "4:0:0");

    Tone.Transport.schedule((time) => {
        bellFilter.frequency.linearRampToValueAtTime(2000, time + 4 * barLen);
    }, "10:0:0");

    window.toneJsInstruments = { pad, bell, shimmer, sub, rippleNoise };
    window.toneJsParts = { padLoop, bellLoop, shimmerLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
