<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

#define PI 3.14159265

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

vec3 currentColor(float idx){
  if(idx<0.5) return vec3(1.0,0.62,0.18);
  if(idx<1.5) return vec3(1.0,0.18,0.22);
  return vec3(0.30,0.92,1.0);
}

vec2 strandPath(float s, float idx, float phase, float braid){
  float a = idx * 2.0944 + s * 6.2832;
  float r = mix(0.78, 0.04, braid);
  float wob = sin(s*4.0 + phase*2.0 + idx*1.7) * 0.06 * (1.0-braid);
  vec2 p = vec2(cos(a), sin(a)) * (r + wob);
  p.x += sin(s*2.0 + phase + idx)*0.04*(1.0-braid);
  p.y += cos(s*3.0 + phase*1.3 + idx*2.1)*0.04*(1.0-braid);
  return p;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy)/iResolution.y;

  float T = iTime;
  float cycle = mod(T, 12.0)/12.0;
  float pulse = pow(sin(cycle*PI), 6.0);
  float braid = smoothstep(0.0, 0.45, cycle) * (1.0 - smoothstep(0.55, 1.0, cycle));
  float scatter = smoothstep(0.55, 1.0, cycle);
  float phase = T*0.4;

  float gl = hash(floor(gl_FragCoord.xy*0.5) + floor(T*8.0));
  vec2 glitchOff = vec2(step(0.985, gl)*0.04*sin(T*30.0+uv.y*40.0), 0.0);
  vec2 quv = uv + glitchOff;

  vec3 col = vec3(0.015, 0.012, 0.028);

  float bg = 0.0;
  for(int i=0;i<6;i++){
    float fi = float(i);
    vec2 p = quv;
    p = rot(T*0.05 + fi*0.7) * p;
    bg += 0.012/(abs(p.y - sin(p.x*3.0 + T*0.6 + fi)*0.3) + 0.04);
  }
  col += vec3(0.10,0.06,0.18) * bg * 0.15;

  vec3 strandGlow = vec3(0.0);

  for(int c=0; c<3; c++){
    float ci = float(c);
    vec3 cc = currentColor(ci);

    for(int k=0; k<48; k++){
      float fk = float(k);
      float s = fk/48.0;

      vec2 sp = strandPath(s, ci, phase, braid);

      vec2 scatterDir = normalize(sp + vec2(0.001));
      sp += scatterDir * scatter * (0.6 + s*0.5);
      sp += vec2(sin(fk*7.3+ci*3.1), cos(fk*5.7+ci*2.3)) * scatter * 0.18;

      float d = length(quv - sp);
      float r = mix(0.012, 0.004, scatter);
      float g = r/(d*d + r*0.4);

      float sparkle = 0.5 + 0.5*sin(T*4.0 + fk*1.7 + ci*2.0);
      strandGlow += cc * g * (0.6 + sparkle*0.4);
    }
  }

  col += strandGlow * 0.022;

  float dC = length(quv);
  float core = exp(-dC*dC*30.0) * pulse;
  col += vec3(1.0) * core * 1.8;

  for(int r=0;r<3;r++){
    float fr = float(r);
    float ringT = mod(cycle - fr*0.08, 1.0);
    float rad = ringT * 0.9;
    float ring = exp(-pow(abs(dC - rad)*22.0, 2.0));
    col += vec3(1.0, 0.95, 0.88) * ring * pulse * 0.4;
  }

  float ang = atan(quv.y, quv.x);
  float interference = sin(ang*7.0 + T*1.2)*sin(dC*18.0 - T*2.0);
  col += vec3(0.4,0.6,0.8) * interference * 0.04 * (1.0-scatter);

  vec2 ca = quv*0.5;
  float caR = length(ca - vec2(0.003,0.0));
  float caB = length(ca + vec2(0.003,0.0));
  col.r *= 1.0 + 0.04*sin(caR*40.0 - T);
  col.b *= 1.0 + 0.04*sin(caB*40.0 + T);

  float scan = 0.94 + 0.06*sin(gl_FragCoord.y*2.5 + T*4.0);
  col *= scan;

  float vig = 1.0 - dot(uv,uv)*0.35;
  col *= vig;

  col = pow(col, vec3(0.85));
  col = clamp(col, 0.0, 1.4);

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterReverb = new Tone.Reverb({ decay: 6.5, wet: 0.42 }).toDestination();
  await masterReverb.generate();

  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.01, release: 0.2 }).connect(masterReverb);

  const amberFilter = new Tone.Filter({ type: "lowpass", frequency: 1400, Q: 1.4 }).connect(masterComp);
  const amberChorus = new Tone.Chorus({ frequency: 0.4, delayTime: 5, depth: 0.6, wet: 0.5 }).connect(amberFilter);
  amberChorus.start();
  const amber = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 1.4, decay: 0.8, sustain: 0.6, release: 3.5 }
  }).connect(amberChorus);
  amber.volume.value = -14;

  const crimsonDist = new Tone.Distortion({ distortion: 0.18, wet: 0.22 }).connect(masterComp);
  const crimsonFilter = new Tone.Filter({ type: "bandpass", frequency: 600, Q: 2.2 }).connect(crimsonDist);
  const crimson = new Tone.MonoSynth({
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.4, decay: 0.5, sustain: 0.5, release: 2.2 },
    filterEnvelope: { attack: 0.6, decay: 0.4, sustain: 0.4, baseFrequency: 200, octaves: 3 }
  }).connect(crimsonFilter);
  crimson.volume.value = -16;

  const cyanDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.4 }).connect(masterComp);
  const cyanFilter = new Tone.Filter({ type: "highpass", frequency: 800 }).connect(cyanDelay);
  const cyan = new Tone.FMSynth({
    harmonicity: 2.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 1.2, sustain: 0, release: 1.8 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.3, decay: 0.5, sustain: 0.2, release: 1.0 }
  }).connect(cyanFilter);
  cyan.volume.value = -18;

  const pulseFilter = new Tone.Filter({ type: "lowpass", frequency: 2000 }).connect(masterComp);
  const pulse = new Tone.NoiseSynth({
    noise: { type: "white" },
    envelope: { attack: 0.6, decay: 0.4, sustain: 0, release: 1.4 }
  }).connect(pulseFilter);
  pulse.volume.value = -22;

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 1.5, decay: 1.0, sustain: 0.5, release: 2.5 }
  }).connect(masterComp);
  subBass.volume.value = -18;

  const amberNotes = ["G3", "Bb3", "C4", "D4"];
  let amberIdx = 0;
  const amberLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar % 8 < 6) {
      const n = amberNotes[amberIdx % amberNotes.length];
      amber.triggerAttackRelease(n, "2n", time + H(12), 0.5);
      amberIdx++;
    }
  }, "2n").start(0);

  const crimsonNotes = ["G2", "F2", "Eb2", "D2"];
  let crimsonIdx = 0;
  const crimsonLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 1 && bar % 8 < 6) {
      crimson.triggerAttackRelease(crimsonNotes[crimsonIdx % crimsonNotes.length], "1m", time + H(10), 0.55);
      crimsonIdx++;
    }
  }, "1m").start(0);

  const cyanNotes = ["D5", "F5", "G5", "Bb5", "C6", "G5", "F5", "D5"];
  let cyanIdx = 0;
  const cyanLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar % 8;
    if (phase >= 2 && phase < 6 && Math.random() > 0.35) {
      cyan.triggerAttackRelease(cyanNotes[cyanIdx % cyanNotes.length], "8n", time + H(10), 0.45);
    }
    cyanIdx++;
  }, "4n").start(0);

  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar % 8;
    if (phase === 3) {
      pulse.triggerAttackRelease(1.4, time + H(8), 0.7);
      subBass.triggerAttackRelease("G1", "1m", time + H(8), 0.8);
      pulseFilter.frequency.setValueAtTime(400, time);
      pulseFilter.frequency.linearRampToValueAtTime(3500, time + 0.8);
      pulseFilter.frequency.linearRampToValueAtTime(800, time + 1.6);
    }
  }, "1m").start(0);

  const sparkle = new Tone.MetalSynth({
    frequency: 800,
    envelope: { attack: 0.001, decay: 0.6, release: 0.4 },
    harmonicity: 4.1,
    modulationIndex: 22,
    resonance: 3200
  }).connect(cyanDelay);
  sparkle.volume.value = -28;

  let sparkleIdx = 0;
  const sparkleLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const phase = bar % 8;
    if (phase >= 4 && phase < 6 && Math.random() > 0.6) {
      sparkle.triggerAttackRelease("16n", time + H(6), 0.3);
    }
    sparkleIdx++;
  }, "8n").start(0);

  window.toneJsInstruments = { amber, crimson, cyan, pulse, subBass, sparkle };
  window.toneJsParts = { amberLoop, crimsonLoop, cyanLoop, pulseLoop, sparkleLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
