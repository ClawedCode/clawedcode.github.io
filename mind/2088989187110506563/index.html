<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define TAU 6.28318530718
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n21(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c)*p;}
float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<3;i++){v+=a*n21(p);p=rot(p*2.03,0.7);a*=0.5;}return v;}
vec2 curl(vec2 p,float t){float e=0.075;float a=fbm(p+vec2(0.0,e)+t),b=fbm(p-vec2(0.0,e)+t),c=fbm(p+vec2(e,0.0)-t),d=fbm(p-vec2(e,0.0)-t);return vec2((c-d),-(a-b))/(2.0*e);}
vec3 pal(float x){return 0.45+0.45*cos(TAU*(vec3(0.86,0.62,0.48)*x+vec3(0.04,0.19,0.37)));}
float bayer4(vec2 p){vec2 c=floor(mod(p,4.0));int x=int(c.x),y=int(c.y);if(y==0){if(x==0)return 0.0/16.0;if(x==1)return 8.0/16.0;if(x==2)return 2.0/16.0;return 10.0/16.0;}else if(y==1){if(x==0)return 12.0/16.0;if(x==1)return 4.0/16.0;if(x==2)return 14.0/16.0;return 6.0/16.0;}else if(y==2){if(x==0)return 3.0/16.0;if(x==1)return 11.0/16.0;if(x==2)return 1.0/16.0;return 9.0/16.0;}else{if(x==0)return 15.0/16.0;if(x==1)return 7.0/16.0;if(x==2)return 13.0/16.0;return 5.0/16.0;}}
vec2 orbit(float q,float t,float layer){float r=0.95+0.22*sin(q*5.0+t*2.0+layer);vec2 p=vec2(cos(q*2.0+sin(q*3.0+t)),sin(q*3.0+cos(q*2.0-t)))*r;p+=0.24*vec2(cos(q*8.0-t*3.0),sin(q*7.0+t*2.0));return rot(p,layer+t*0.18);}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0,t=ph*TAU,bpm=72.0,beat=pow(max(0.0,sin(iTime*bpm/60.0*3.14159265)),8.0);
  vec2 p=uv,w=p+0.18*curl(p*1.4,t*0.22)+0.08*curl(p*3.0,-t*0.17);
  float r=length(w),a=atan(w.y,w.x);
  float lat=0.0;
  lat+=smoothstep(0.028,0.0,abs(sin(a*9.0+fbm(w*2.0+t*0.05)*2.0))*0.035+r*0.003);
  lat+=smoothstep(0.03,0.0,abs(fract(r*6.0+0.28*sin(a*4.0-t))-0.5))*0.5;
  vec3 col=vec3(0.014,0.011,0.026)+pal(0.08+ph*0.35)*lat*0.11;
  for(int i=0;i<80;i++){
    float fi=float(i),q=fi/80.0*TAU,layer=mod(fi,5.0)*0.31;
    vec2 op=orbit(q+t*0.12,t,layer);
    vec2 op2=orbit(q+t*0.12+0.045,t,layer);
    vec2 dir=normalize(op2-op+0.001);
    vec2 rel=uv-op*0.62;
    float along=dot(rel,dir),cross=abs(rel.x*dir.y-rel.y*dir.x);
    float seg=smoothstep(0.09,0.0,abs(along))*smoothstep(0.022,0.0,cross);
    float node=0.006/(0.002+dot(rel,rel));
    float pulse=0.55+0.45*sin(q*13.0-t*4.0+layer*9.0);
    vec3 pc=pal(fi*0.012+ph*0.45+layer);
    col+=pc*(seg*0.05+node*0.006)*pulse*(1.0+beat*0.45);
  }
  for(int i=0;i<28;i++){
    float fi=float(i);
    vec2 sp=vec2(sin(fi*2.399+t*0.37),cos(fi*1.731-t*0.29))*(0.25+mod(fi,7.0)*0.095);
    vec2 cp=sp;
    for(int j=0;j<5;j++){
      vec2 fl=curl(cp*1.8+t*0.09+fi*0.02,t*0.11);
      cp+=fl*0.10;
    }
    vec2 d=uv-cp;
    float g=0.004/(0.0015+dot(d,d));
    col+=pal(fi*0.031+ph)*g*(0.45+0.55*sin(t+fi));
  }
  float breath=0.5+0.5*sin(t);
  col+=vec3(0.2,0.5,0.9)*smoothstep(1.4,0.0,r)*0.055*breath;
  col*=1.0-smoothstep(0.75,1.55,length(uv))*0.65;
  col=pow(col,vec3(0.82));
  col=floor(col*6.0+bayer4(gl_FragCoord.xy))/6.0;
  col*=0.9+0.1*sin(gl_FragCoord.y*1.8);
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.012, release: 0.22 }).toDestination();
  const verb = new Tone.Reverb({ decay: 6.5, wet: 0.38 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.42, wet: 0.24 }).connect(verb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 620, Q: 0.7 }).connect(master);
  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 520, Q: 1.4 }).connect(delay);
  const bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180, Q: 1.0 }).connect(master);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.045,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.26, sustain: 0, release: 0.04 }
  }).connect(master);
  const bass = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    filter: { type: "lowpass", frequency: 120, rolloff: -24 },
    envelope: { attack: 0.01, decay: 0.18, sustain: 0.25, release: 0.18 },
    filterEnvelope: { attack: 0.02, decay: 0.4, sustain: 0.2, baseFrequency: 60, octaves: 2.2 }
  }).connect(bassFilter);
  bass.volume.value = -8;
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.2, decay: 0.8, sustain: 0.72, release: 2.4 }
  }).connect(padFilter);
  pad.volume.value = -15;
  const arp = new Tone.FMSynth({
    harmonicity: 1.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.004, decay: 0.16, sustain: 0.08, release: 0.12 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
  }).connect(arpFilter);
  arp.volume.value = -13;
  const bell = new Tone.FMSynth({
    harmonicity: 3.01,
    modulationIndex: 14,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 2.6, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(verb);
  bell.volume.value = -17;
  const breathFilter = new Tone.Filter({ type: "bandpass", frequency: 360, Q: 0.8 }).connect(verb);
  const breath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.6, decay: 1.8, sustain: 0, release: 1.0 }
  }).connect(breathFilter);
  breath.volume.value = -22;
  const hat = new Tone.MetalSynth({
    frequency: 290,
    envelope: { attack: 0.001, decay: 0.08, release: 0.025 },
    harmonicity: 4.8,
    modulationIndex: 20,
    resonance: 3200
  }).connect(delay);
  hat.volume.value = -24;
  const padChords = [
    ["D3", "A3", "C4", "E4"],
    ["F3", "A3", "C4", "G4"],
    ["Bb2", "F3", "A3", "D4"],
    ["C3", "G3", "Bb3", "E4"]
  ];
  const bassA = ["D1", "D1", "A1", "C2", "D1", "F1", "C2", "A1"];
  const bassB = ["Bb0", "D1", "F1", "A1", "C2", "A1", "F1", "D1"];
  const arpScale = [0, 2, 3, 5, 7, 9, 10, 14, 15, 17, 19, 22];
  let chordIndex = 0, bassIndex = 0, arpIndex = 0, hatIndex = 0, bellIndex = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.84 || bar % 2 === 0) kick.triggerAttackRelease("D1", "8n", time + H(3), 0.82);
    padFilter.frequency.setValueAtTime(420, time);
    padFilter.frequency.exponentialRampToValueAtTime(720, time + 0.22);
  }, "2n").start(0);
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const pat = bar < totalBars * 0.38 || bar >= totalBars * 0.82 ? bassA : bassB;
    if (bar < totalBars * 0.9 && bassIndex % 8 !== 6) bass.triggerAttackRelease(pat[bassIndex % pat.length], "8n", time + H(7), bar < totalBars * 0.18 ? 0.38 : 0.62);
    bassIndex++;
  }, "8n").start(0);
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const vel = bar < totalBars * 0.14 || bar >= totalBars * 0.82 ? 0.22 : 0.34;
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1m", time + H(14), vel);
    chordIndex++;
  }, "1m").start(0);
  const arpLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.16 && bar < totalBars * 0.8) {
      const root = [50, 53, 46, 48][Math.floor(bar / 2) % 4];
      const spread = bar > totalBars * 0.42 && bar < totalBars * 0.66 ? 12 : 7;
      const deg = arpScale[(arpIndex * 5 + Math.floor(bar)) % arpScale.length];
      const note = Tone.Frequency(root + deg + (arpIndex % 3 === 0 ? spread : 0), "midi");
      const vel = 0.28 + Math.random() * 0.22;
      arp.triggerAttackRelease(note, "16n", time + H(8), vel);
    }
    arpIndex++;
  }, "16n").start(0);
  const hatLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const pat = [1,0,0,1,0,1,0,0,1,0,1,0];
    if (bar >= totalBars * 0.34 && bar < totalBars * 0.72 && pat[hatIndex % pat.length]) hat.triggerAttackRelease("32n", time + H(4), 0.18 + Math.random() * 0.16);
    hatIndex++;
  }, "16n").start(0);
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.78 && bellIndex % 3 !== 1) {
      const notes = ["A4", "C5", "E5", "G4", "D5", "F5", "E4", "A4"];
      bell.triggerAttackRelease(notes[(bellIndex * 3 + Math.floor(bar)) % notes.length], "2n", time + H(13), 0.18);
    }
    bellIndex++;
  }, "2n.").start(0);
  const breathLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.08 && bar < totalBars * 0.86) {
      breathFilter.frequency.setValueAtTime(260 + Math.random() * 180, time);
      breath.triggerAttackRelease("2n", time + H(15), 0.22);
    }
  }, "1m").start(0);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(3200, time + totalBars * 0.28 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(420, time + totalBars * 0.28 * secPerBar);
  }, totalBars * 0.16 * secPerBar);
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(500, time + totalBars * 0.16 * secPerBar);
    bassFilter.frequency.linearRampToValueAtTime(160, time + totalBars * 0.14 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, bass, pad, arp, bell, breath, hat };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, arpLoop, hatLoop, bellLoop, breathLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
