<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

vec3 threadColor(int idx){
  if(idx==0)return vec3(1.0,0.55,0.15);
  if(idx==1)return vec3(0.95,0.18,0.28);
  return vec3(0.25,0.85,1.0);
}

vec2 threadPos(int idx, float phase, float t){
  float off = float(idx)*2.0944;
  float r = 0.62 + 0.18*sin(t*0.7 + off*1.3);
  float a = phase*6.2831 + off + t*0.35;
  float wob = 0.12*sin(phase*12.566 + t*1.4 + off);
  return vec2(cos(a)*(r+wob), sin(a*1.0 + 0.5*sin(t*0.6+off))*(r+wob));
}

float pulse(float t, float duration){
  float p = mod(t, duration)/duration;
  float burst = pow(max(0.0, 1.0 - abs(p-0.5)*6.0), 4.0);
  return burst;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution.xy)/iResolution.y;
  float t = iTime;
  float loopT = mod(t, 60.0);
  float phase01 = loopT/60.0;

  float burst = pulse(t, 60.0);
  float contract = smoothstep(0.0, 0.5, phase01)*smoothstep(1.0, 0.5, phase01);
  float scatter = smoothstep(0.5, 0.75, phase01)*smoothstep(1.0, 0.75, phase01);

  uv = rot(t*0.05 + burst*0.3) * uv;

  vec3 col = vec3(0.015, 0.01, 0.025);
  col += vec3(0.04, 0.02, 0.06) * (1.0 - length(uv)*0.6);

  for(int k=0; k<3; k++){
    vec3 tc = threadColor(k);
    for(float s=0.0; s<24.0; s++){
      float seg = s/24.0;
      float weave = seg + t*0.08;
      vec2 base = threadPos(k, weave, t);
      vec2 target = base * (1.0 - contract*0.85);
      vec2 scattered = base*2.2 + vec2(sin(s*7.3+t*0.5+float(k)), cos(s*5.1+t*0.4+float(k)))*0.45;
      vec2 p = mix(target, scattered, scatter);
      float d = length(uv - p);
      float glow = 0.018/(d*d + 0.0008);
      float fade = mix(1.0, 0.35 + 0.65*sin(seg*18.84 + t*2.0 + float(k)), scatter);
      col += tc * glow * 0.045 * fade;
    }
  }

  for(float i=0.0; i<40.0; i++){
    float seed = i*1.7;
    float life = mod(phase01 + i*0.025, 1.0);
    float vis = smoothstep(0.55, 0.7, phase01)*smoothstep(1.0, 0.85, phase01);
    vec2 gp = vec2(cos(seed*4.3)*1.1, sin(seed*5.7)*1.1) * (0.3 + life*0.9);
    gp = rot(t*0.15 + seed) * gp;
    float d = length(uv - gp);
    float twinkle = 0.5 + 0.5*sin(t*3.0 + seed*10.0);
    vec3 gc = mix(threadColor(int(mod(seed,3.0))), vec3(1.0), 0.4);
    col += gc * (0.004/(d*d + 0.0004)) * vis * twinkle;
  }

  float burstRing = burst * exp(-length(uv)*length(uv)*4.0);
  col += vec3(1.0, 0.95, 0.9) * burstRing * 1.8;
  float ringD = abs(length(uv) - burst*0.8);
  col += vec3(1.0, 0.9, 0.95) * burst * 0.08/(ringD*ringD + 0.005);

  float vig = 1.0 - dot(uv,uv)*0.35;
  col *= vig;
  col = pow(col, vec3(0.88));
  col = col/(1.0+col*0.6);

  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const masterVerb = new Tone.Reverb({ decay: 6.0, wet: 0.45 }).toDestination();
  await masterVerb.generate();
  const masterComp = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.02, release: 0.25 }).connect(masterVerb);

  const padVerb = new Tone.Reverb({ decay: 8.0, wet: 0.6 }).connect(masterComp);
  await padVerb.generate();
  const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4.0, depth: 0.7, wet: 0.5 }).connect(padVerb);
  padChorus.start();
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(padChorus);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 4.0 }
  }).connect(padFilter);
  pad.volume.value = -16;

  const padChords = [
    ["A3", "C4", "E4", "G4"],
    ["F3", "A3", "C4", "E4"],
    ["G3", "Bb3", "D4", "F4"],
    ["E3", "G3", "B3", "D4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[chordIdx % padChords.length], "1m", time + H(15), 0.45);
    chordIdx++;
  }, "1m").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.5 }).connect(masterComp);
  const bellVerb = new Tone.Reverb({ decay: 5.0, wet: 0.55 }).connect(bellDelay);
  await bellVerb.generate();

  const amberBell = new Tone.FMSynth({
    harmonicity: 2.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 1.8, sustain: 0, release: 1.5 },
    modulation: { type: "sine" }
  }).connect(bellVerb);
  amberBell.volume.value = -14;

  const crimsonBell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 12,
    oscillator: { type: "triangle" },
    envelope: { attack: 0.008, decay: 1.5, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(bellVerb);
  crimsonBell.volume.value = -16;

  const cyanBell = new Tone.FMSynth({
    harmonicity: 4.5, modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 2.2, sustain: 0, release: 2.0 },
    modulation: { type: "triangle" }
  }).connect(bellVerb);
  cyanBell.volume.value = -15;

  const amberNotes = ["A4", "C5", "E5", "G5", "A5"];
  const crimsonNotes = ["F4", "A4", "C5", "E5", "F5"];
  const cyanNotes = ["E5", "G5", "B5", "D6", "E6"];

  let step = 0;
  const threadLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const inBurst = bar >= 6 && bar < 8;
    const inScatter = bar >= 8 && bar < 14;
    const inReturn = bar >= 14;

    if (!inBurst) {
      if (step % 3 === 0) {
        amberBell.triggerAttackRelease(amberNotes[step % amberNotes.length], "8n", time + H(10), 0.7);
      }
      if (step % 4 === 1) {
        crimsonBell.triggerAttackRelease(crimsonNotes[(step+1) % crimsonNotes.length], "8n", time + H(10), 0.6);
      }
      if (step % 3 === 2 && !inReturn) {
        cyanBell.triggerAttackRelease(cyanNotes[(step+2) % cyanNotes.length], "8n", time + H(10), 0.65);
      }
    }
    step++;
  }, "4n").start(0);

  const burstSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 0.05, decay: 2.5, sustain: 0, release: 3.0 }
  }).connect(bellVerb);
  burstSynth.volume.value = -10;

  Tone.Transport.schedule((time) => {
    burstSynth.triggerAttackRelease(["A4", "C5", "E5", "A5", "C6", "E6"], "2n", time, 0.9);
  }, "6:2:0");

  const noiseHPF = new Tone.Filter({ type: "highpass", frequency: 1200 }).connect(bellVerb);
  const shimmer = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 1.5, decay: 1.0, sustain: 0, release: 2.0 }
  }).connect(noiseHPF);
  shimmer.volume.value = -28;

  Tone.Transport.schedule((time) => {
    shimmer.triggerAttackRelease(3.0, time);
  }, "5:0:0");

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 0.5, sustain: 0.8, release: 1.5 }
  }).connect(masterComp);
  subBass.volume.value = -20;

  const subNotes = ["A1", "F1", "G1", "E1"];
  let subIdx = 0;
  const subLoop = new Tone.Loop((time) => {
    subBass.triggerAttackRelease(subNotes[subIdx % subNotes.length], "1m", time + H(8), 0.7);
    subIdx++;
  }, "1m").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(3500, time + 6 * (60/bpm) * 4);
  }, "0:0:0");

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1200, time + 4 * (60/bpm) * 4);
  }, "12:0:0");

  window.toneJsInstruments = { pad, amberBell, crimsonBell, cyanBell, burstSynth, shimmer, subBass };
  window.toneJsParts = { padLoop, threadLoop, subLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
