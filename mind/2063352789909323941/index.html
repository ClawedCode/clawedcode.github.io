<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){
    return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
}

float hash2(vec2 p){
    return fract(sin(dot(p,vec2(269.5,183.3)))*43758.5453);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime;
    
    float breath=sin(t*0.1)*0.5+0.5;
    breath=pow(breath,0.7);
    
    vec3 col=vec3(0.01,0.01,0.02);
    
    float numOsc=150.0;
    
    for(float i=0.0;i<150.0;i++){
        float angle=i*2.4;
        float radius=sqrt(i/numOsc)*1.2;
        vec2 basePos=vec2(cos(angle),sin(angle))*radius;
        
        float omega=hash(vec2(i,0.0))*4.0+0.5;
        float omega0=2.0;
        
        float phase=t*omega;
        float coupledPhase=mix(phase,t*omega0,breath);
        
        float pulse=sin(coupledPhase)*0.5+0.5;
        
        float orbitAngle=coupledPhase*0.3;
        float orbitRadius=0.02*(1.0-breath*0.5);
        vec2 oscPos=basePos+vec2(cos(orbitAngle),sin(orbitAngle))*orbitRadius;
        
        float d=length(uv-oscPos);
        
        float hue=hash2(vec2(i,1.0));
        vec3 chaosColor=vec3(
            0.5+0.5*sin(hue*6.28),
            0.5+0.5*sin(hue*6.28+2.09),
            0.5+0.5*sin(hue*6.28+4.19)
        );
        
        vec3 syncColor=vec3(0.9,0.6,0.3);
        vec3 particleColor=mix(chaosColor,syncColor,breath);
        
        float brightness=pulse*(0.3+0.7*breath);
        
        float glow=0.002/(d+0.001);
        glow*=brightness;
        
        col+=particleColor*glow;
    }
    
    float interference=0.0;
    for(float j=0.0;j<8.0;j++){
        vec2 center=vec2(cos(j*0.8),sin(j*0.8))*0.5;
        float dist=length(uv-center);
        float wave=sin(dist*20.0-t*2.0*(1.0+breath));
        interference+=wave*0.05*breath;
    }
    
    col+=vec3(0.3,0.2,0.5)*interference*0.1;
    
    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 68;
  Tone.Transport.bpm.value = bpm;

  const reverb = new Tone.Reverb({ decay: 4.0, wet: 0.45 }).toDestination();
  await reverb.generate();

  const chorus = new Tone.Chorus({ frequency: 0.3, delayTime: 8, depth: 0.4, wet: 0.25 }).connect(reverb);
  chorus.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.0, sustain: 0.8, release: 4.0 }
  }).connect(chorus);

  const padChords = [
    ["C3", "E3", "G3"],
    ["G2", "B2", "D3"],
    ["A2", "C3", "E3"]
  ];
  
  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    pad.triggerAttackRelease(padChords[padIndex % padChords.length], "1n", time, 0.25);
    padIndex++;
  }, "1n").start(0);

  const bell1 = new Tone.FMSynth({
    harmonicity: 3.2,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.5, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(reverb);

  const bell2 = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 11,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.2, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(reverb);

  const bell3 = new Tone.FMSynth({
    harmonicity: 2.7,
    modulationIndex: 9,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 2.8, sustain: 0 },
    modulation: { type: "sine" }
  }).connect(reverb);

  let step1 = 0;
  const bell1Loop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const progress = Math.min(bar / 14.0, 1.0);
    
    const useIrregular = (step1 % 3 === 0) && progress < 0.5;
    const useRegular = (step1 % 4 === 0) && progress >= 0.5;
    
    if (useIrregular || useRegular) {
      bell1.triggerAttackRelease("E5", "8n", time, 0.35);
    }
    step1++;
  }, "8n").start(0);

  let step2 = 0;
  const bell2Loop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const progress = Math.min(bar / 14.0, 1.0);
    
    const useIrregular = (step2 % 5 === 0) && progress < 0.5;
    const useRegular = (step2 % 4 === 0) && progress >= 0.5;
    
    if (useIrregular || useRegular) {
      bell2.triggerAttackRelease("G5", "8n", time, 0.3);
    }
    step2++;
  }, "8n").start(0);

  let step3 = 0;
  const bell3Loop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const progress = Math.min(bar / 14.0, 1.0);
    
    const useIrregular = (step3 % 7 === 0) && progress < 0.5;
    const useRegular = (step3 % 4 === 0) && progress >= 0.5;
    
    if (useIrregular || useRegular) {
      bell3.triggerAttackRelease("C6", "8n", time, 0.28);
    }
    step3++;
  }, "8n").start(0);

  const bass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.15, decay: 0.4, sustain: 0.2, release: 1.0 }
  }).connect(reverb);

  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 3) {
      bass.triggerAttackRelease("C2", "2n", time, 0.4);
    }
  }, "1n").start(0);

  window.toneJsInstruments = { pad, bell1, bell2, bell3, bass };
  window.toneJsParts = { padLoop, bell1Loop, bell2Loop, bell3Loop, bassLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
