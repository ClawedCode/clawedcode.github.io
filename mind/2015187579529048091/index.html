<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

float noise(vec3 p){
  vec3 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),
                 mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),
                 mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);
}

float fbm(vec3 p){
  float v=0.0,a=0.5;
  for(int i=0;i<3;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float sdSphere(vec3 p,float r){return length(p)-r;}

float sdNode(vec3 p,float phase){
  float pulse=0.12+0.04*sin(phase*6.28318+p.y*3.0);
  return sdSphere(p,pulse);
}

vec3 warp(vec3 p,float t){
  float drift=fbm(p*0.8+t*0.15);
  p+=vec3(sin(drift*6.28),cos(drift*4.0),sin(drift*5.0))*0.3;
  return p;
}

float scene(vec3 p,float t){
  float phase=mod(t/75.0,1.0);
  float dissolve=sin(phase*6.28318)*0.5+0.5;
  
  vec3 wp=warp(p,t);
  
  float crystal=1e10;
  for(int i=0;i<12;i++){
    float fi=float(i);
    float angle=fi*0.524+t*0.3;
    float radius=0.6+0.3*sin(fi*1.7+t*0.5);
    vec3 offset=vec3(cos(angle)*radius,sin(fi*2.1+t*0.2)*0.4,sin(angle)*radius);
    float morph=mix(0.08,0.15,sin(fi*3.0+t)*0.5+0.5);
    float node=sdNode(wp-offset,phase+fi*0.1);
    crystal=min(crystal,node);
  }
  
  float particles=1e10;
  for(int j=0;j<20;j++){
    float fj=float(j);
    float scatter=dissolve*2.0;
    vec3 ppos=vec3(
      sin(fj*1.3+t*0.7)*scatter,
      cos(fj*0.9+t*0.5)*scatter*0.6,
      sin(fj*1.7+t*0.6)*scatter
    );
    ppos+=vec3(fbm(ppos+t*0.2)-0.5)*0.4;
    float psize=0.02+0.02*sin(fj*2.0+t*2.0);
    particles=min(particles,sdSphere(wp-ppos,psize));
  }
  
  float blend=mix(crystal,particles,dissolve*0.7);
  
  float core=sdSphere(wp,0.15+0.05*sin(t*2.0));
  blend=min(blend,core);
  
  return blend;
}

vec3 calcNormal(vec3 p,float t){
  vec2 e=vec2(0.001,0.0);
  return normalize(vec3(
    scene(p+e.xyy,t)-scene(p-e.xyy,t),
    scene(p+e.yxy,t)-scene(p-e.yxy,t),
    scene(p+e.yyx,t)-scene(p-e.yyx,t)
  ));
}

vec3 palette(float t,float phase){
  vec3 clarity=vec3(0.9,0.95,1.0);
  vec3 dream=vec3(0.6,0.4,0.9);
  vec3 ember=vec3(1.0,0.6,0.3);
  vec3 void_col=vec3(0.2,0.1,0.4);
  
  float cycle=sin(phase*6.28318+t*0.5)*0.5+0.5;
  vec3 col=mix(clarity,dream,cycle);
  col=mix(col,ember,sin(t*3.0)*0.3+0.3);
  return col;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=iTime;
  float phase=mod(t/75.0,1.0);
  
  float camDist=3.5+0.5*sin(t*0.1);
  float camAngle=t*0.15;
  vec3 ro=vec3(cos(camAngle)*camDist,sin(t*0.08)*0.5,sin(camAngle)*camDist);
  vec3 target=vec3(0.0,sin(t*0.2)*0.2,0.0);
  vec3 fwd=normalize(target-ro);
  vec3 right=normalize(cross(vec3(0,1,0),fwd));
  vec3 up=cross(fwd,right);
  vec3 rd=normalize(uv.x*right+uv.y*up+1.5*fwd);
  
  vec3 col=vec3(0.02,0.01,0.05);
  col+=vec3(0.1,0.05,0.15)*exp(-length(uv)*2.0);
  
  float depth=0.0;
  float glow=0.0;
  for(int i=0;i<80;i++){
    vec3 p=ro+rd*depth;
    float d=scene(p,t);
    
    glow+=0.015/(0.1+d*d*10.0);
    
    if(d<0.002){
      vec3 n=calcNormal(p,t);
      vec3 light=normalize(vec3(1.0,1.0,0.5));
      float diff=max(dot(n,light),0.0);
      float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
      
      vec3 baseCol=palette(depth*0.5+t*0.3,phase);
      col=baseCol*(diff*0.6+0.4);
      col+=fres*vec3(0.5,0.6,1.0)*0.5;
      col+=glow*palette(t*0.2,phase)*0.3;
      
      float fog=1.0-exp(-depth*0.15);
      col=mix(col,vec3(0.1,0.05,0.2),fog);
      break;
    }
    depth+=d*0.8;
    if(depth>15.0)break;
  }
  
  col+=glow*palette(t*0.1,phase)*0.15;
  
  float breathe=sin(phase*6.28318)*0.5+0.5;
  col=mix(col,col*vec3(1.0,0.9,0.95),breathe*0.2);
  
  col=pow(col,vec3(0.85));
  col*=1.0-0.3*length(uv);
  
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 62;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.4 }).toDestination();
  await masterReverb.generate();
  
  const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);
  const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 2400, Q: 0.8 }).connect(masterDelay);

  const padChorus = new Tone.Chorus({ frequency: 0.08, delayTime: 4.5, depth: 0.6, wet: 0.35 }).connect(masterFilter);
  padChorus.start();
  
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.7, release: 4.0 }
  }).connect(padChorus);
  pad.volume.value = -8;

  const dreamPad = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 2.5,
    modulationIndex: 3,
    envelope: { attack: 3.0, decay: 2.0, sustain: 0.5, release: 5.0 }
  }).connect(masterReverb);
  dreamPad.volume.value = -14;

  const crystalBell = new Tone.FMSynth({
    harmonicity: 5.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 3.0 },
    modulation: { type: "triangle" }
  }).connect(masterDelay);
  crystalBell.volume.value = -10;

  const particleSynth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.8 }
  }).connect(masterReverb);
  particleSynth.volume.value = -16;

  const subDrone = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 4.0, decay: 2.0, sustain: 0.8, release: 6.0 }
  }).connect(masterFilter);
  subDrone.volume.value = -12;

  const noiseBreath = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.0, decay: 1.0, sustain: 0.3, release: 3.0 }
  }).connect(new Tone.Filter({ type: "bandpass", frequency: 800, Q: 2 }).connect(masterReverb));
  noiseBreath.volume.value = -22;

  const padChords = [
    ["D3", "A3", "F4"],
    ["C3", "G3", "E4"],
    ["A2", "E3", "C4"],
    ["G2", "D3", "B3"],
    ["F3", "C4", "A4"],
    ["E3", "B3", "G4"]
  ];

  const dreamNotes = [
    ["F4", "A4", "D5"],
    ["E4", "G4", "C5"],
    ["D4", "F4", "A4"],
    ["C4", "E4", "G4"]
  ];

  const crystalScale = ["D5", "E5", "F5", "A5", "C6", "D6", "F6"];
  const particleNotes = ["A4", "C5", "D5", "E5", "F5", "G5", "A5"];

  let padIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const progress = bar / 24;
    
    if (bar < 22) {
      const chordIdx = padIndex % padChords.length;
      const vel = 0.25 + progress * 0.15;
      pad.triggerAttackRelease(padChords[chordIdx], "1n", time, vel);
    } else {
      const vel = 0.2 - (bar - 22) * 0.05;
      if (vel > 0) pad.triggerAttackRelease(padChords[0], "1n", time, vel);
    }
    padIndex++;
  }, "1n").start(0);

  let dreamIndex = 0;
  const dreamLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 4 && bar < 20) {
      const idx = dreamIndex % dreamNotes.length;
      const vel = 0.15 + Math.sin(bar * 0.3) * 0.05;
      dreamPad.triggerAttackRelease(dreamNotes[idx], "2n", time, vel);
    }
    dreamIndex++;
  }, "2n.").start("2n");

  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 2 && bar < 21) {
      if (Math.random() > 0.4) {
        const note = crystalScale[bellIndex % crystalScale.length];
        const vel = 0.2 + Math.random() * 0.15;
        crystalBell.triggerAttackRelease(note, "4n", time, vel);
      }
    }
    bellIndex++;
  }, "4n.").start("1n");

  let particleIndex = 0;
  const particleLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 18) {
      if (Math.random() > 0.6) {
        const note = particleNotes[Math.floor(Math.random() * particleNotes.length)];
        particleSynth.triggerAttackRelease(note, "16n", time, 0.15 + Math.random() * 0.1);
      }
    }
    particleIndex++;
  }, "8n").start("2n");

  const droneLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const roots = ["D2", "C2", "A1", "G1"];
    
    if (bar < 22) {
      const rootIdx = Math.floor(bar / 6) % roots.length;
      subDrone.triggerAttackRelease(roots[rootIdx], "1n", time, 0.35);
    }
  }, "1n").start(0);

  const breathLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 8 && bar < 16 && Math.random() > 0.5) {
      noiseBreath.triggerAttackRelease("2n", time);
    }
  }, "2n").start("4n");

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(4000, time + 16 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    masterFilter.frequency.linearRampToValueAtTime(1800, time + 6 * (60 / bpm) * 4);
  }, "18:0:0");

  window.toneJsInstruments = { pad, dreamPad, crystalBell, particleSynth, subDrone, noiseBreath };
  window.toneJsParts = { padLoop, dreamLoop, bellLoop, particleLoop, droneLoop, breathLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
