<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(float n){return fract(sin(n)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float nz(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(h2(i),h2(i+vec2(1.0,0.0)),f.x),
             mix(h2(i+vec2(0.0,1.0)),h2(i+vec2(1.0,1.0)),f.x),f.y);
}

float cr(float a){
  return 0.3
    +0.23*exp(-(a-2.18)*(a-2.18)*25.0)
    +0.23*exp(-(a-0.96)*(a-0.96)*25.0)
    -0.04*exp(-(a-4.71)*(a-4.71)*10.0);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0);
  float neb=nz(uv*3.0+t*0.02)*0.5+nz(uv*6.0-t*0.01)*0.3;
  vec3 col=vec3(0.01,0.006,0.03)+vec3(0.02,0.008,0.04)*neb;

  float form=smoothstep(0.0,10.0,t)*(1.0-smoothstep(50.0,60.0,t));
  float breath=sin(t*0.35)*0.01*form;
  float tilt=sin(t*0.12)*0.05*form;
  float ct=cos(tilt),st=sin(tilt);

  for(float i=0.0;i<40.0;i++){
    vec2 sp=vec2(h(i*3.1+1.0)-0.5,h(i*4.7+2.0)-0.5)*1.5;
    float d=length(uv-sp);
    float tw=0.3+0.7*sin(t*(0.6+h(i*5.3)*2.0)+i*7.0);
    col+=vec3(0.6,0.6,0.9)*tw*(1.0-form*0.4)*0.00006/(d*d+0.00008);
  }

  for(float i=0.0;i<700.0;i++){
    float s1=h(i*1.13),s2=h(i*2.37+7.0);
    vec2 scattered=vec2(h(i*5.1)-0.5,h(i*6.3+1.0)-0.5)*0.65;
    scattered+=vec2(sin(t*0.15+s1*4.0),cos(t*0.12+s1*3.5))*0.015;
    float spd=0.10472*(1.0+floor(s2*3.0));
    float a=mod(s1*6.283+t*spd,6.283);
    float r=cr(a)*(0.88+s2*0.24)+breath;
    r+=(h(s1*50.0+floor(t*2.0))-0.5)*0.015;
    vec2 catPos=vec2(cos(a),sin(a))*r;
    catPos.y+=0.015;
    catPos=vec2(catPos.x*ct-catPos.y*st,catPos.x*st+catPos.y*ct);
    vec2 p=mix(scattered,catPos,form);
    float d=length(uv-p);
    vec3 cold=vec3(0.3+0.2*s1,0.35,0.85);
    vec3 warm=mix(vec3(1.0,0.55,0.12),vec3(0.5,0.18,0.85),s1);
    vec3 c=mix(cold,warm,form);
    float sp=0.55+0.45*sin(t*1.8+s1*50.0);
    col+=c*sp*0.00028/(d*d+0.000028);
  }

  for(float i=0.0;i<150.0;i++){
    float s1=h(i*1.7+700.0),s2=h(i*2.9+800.0);
    float a=s1*6.283;
    float r=s2*cr(a)*0.72;
    vec2 fp=vec2(cos(a),sin(a))*r;
    fp.y+=0.015;
    fp+=vec2(sin(t*0.2+s1*9.0),cos(t*0.15+s1*7.0))*0.005;
    fp=vec2(fp.x*ct-fp.y*st,fp.x*st+fp.y*ct);
    fp=mix(vec2(h(i*8.1+900.0)-0.5,h(i*9.3+950.0)-0.5)*0.4,fp,form);
    float d=length(uv-fp);
    col+=vec3(0.25,0.08,0.4)*form*0.0001/(d*d+0.00006);
  }

  float eyeForm=smoothstep(8.0,12.0,t)*(1.0-smoothstep(48.0,52.0,t));
  float bc=mod(t,5.5);
  float blink=1.0-smoothstep(2.5,2.7,bc)*smoothstep(3.0,2.8,bc);
  float eyeVis=eyeForm*blink;

  for(float e=0.0;e<2.0;e++){
    float sx=e<0.5?-1.0:1.0;
    vec2 ep=vec2(sx*0.1,0.065);
    ep=vec2(ep.x*ct-ep.y*st,ep.x*st+ep.y*ct);
    float de=length(uv-ep);
    col+=vec3(0.15,0.85,0.35)*eyeVis*0.002/(de*de+0.0008);
    float ir=abs(de-0.026);
    col+=vec3(0.5,0.7,0.1)*eyeVis*0.0003/(ir*ir+0.00004);
    float pw=0.008+0.005*sin(t*0.2);
    vec2 pu=(uv-ep)/vec2(pw,0.033);
    col=mix(col,col*0.08,smoothstep(1.5,0.4,length(pu))*eyeVis);
  }

  float wVis=smoothstep(10.0,14.0,t)*(1.0-smoothstep(46.0,50.0,t));
  for(float w=0.0;w<6.0;w++){
    float sx=w<3.0?-1.0:1.0;
    float idx=mod(w,3.0);
    float wa=(idx-1.0)*0.17;
    vec2 ws=vec2(sx*0.05,-0.008+idx*0.01);
    ws=vec2(ws.x*ct-ws.y*st,ws.x*st+ws.y*ct);
    vec2 wd=vec2(cos(wa)*sx,sin(wa));
    wd=vec2(wd.x*ct-wd.y*st,wd.x*st+wd.y*ct);
    for(float j=0.0;j<20.0;j++){
      float pg=j/20.0;
      vec2 wp=ws+wd*pg*0.18;
      wp.y+=sin(pg*3.5+t*0.8+w)*0.002*pg;
      float d=length(uv-wp);
      col+=vec3(0.5,0.3,0.7)*(1.0-pg)*wVis*0.00003/(d*d+0.000015);
    }
  }

  vec2 np=vec2(0.0,-0.003);
  np=vec2(np.x*ct-np.y*st,np.x*st+np.y*ct);
  float dn=length(uv-np);
  col+=vec3(0.75,0.25,0.35)*form*0.0002/(dn*dn+0.0003);

  col=1.0-exp(-col*1.5);
  col=pow(col,vec3(0.9));
  col*=smoothstep(0.9,0.2,length(uv));
  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;
  const barLen = (60 / bpm) * 4;

  const mainReverb = new Tone.Reverb({ decay: 4.5, wet: 0.45 }).toDestination();
  await mainReverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.35, wet: 0.25 }).connect(mainReverb);
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.7 }).connect(mainReverb);

  const purr = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    filter: { type: "lowpass", frequency: 120, rolloff: -24 },
    envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.5 },
    filterEnvelope: { attack: 0.4, decay: 0.3, sustain: 0.4, baseFrequency: 55, octaves: 1 }
  }).connect(mainReverb);
  purr.volume.value = -20;

  const purrNotes = ["A1", "A1", "E1", "A1"];
  let purrIdx = 0;
  const purrLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 15) {
      purr.triggerAttackRelease(purrNotes[purrIdx % purrNotes.length], "2n", time, 0.4);
    }
    purrIdx++;
  }, "2n").start(0);

  const crystal = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.8, sustain: 0, release: 1.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.3 }
  }).connect(delay);
  crystal.volume.value = -16;

  const pentatonic = ["A4", "C5", "D5", "E5", "G5", "A5", "C6"];
  let crystalStep = 0;
  const crystalLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    let chance = 0.12;
    if (bar >= 4 && bar < 14) chance = 0.35;
    if (bar >= 6 && bar < 12) chance = 0.55;
    if (bar >= 16) chance = 0.1;

    if (Math.random() < chance) {
      const idx = Math.floor(Math.random() * pentatonic.length);
      crystal.triggerAttackRelease(pentatonic[idx], "8n", time, 0.3 + Math.random() * 0.2);
    }
    crystalStep++;
  }, "4n").start(0);

  const padChorus = new Tone.Chorus({ frequency: 0.15, delayTime: 4.0, depth: 0.6, wet: 0.35 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.5, release: 2.0 }
  }).connect(padChorus);
  pad.volume.value = -22;

  const chords = [
    ["A3", "C4", "E4"],
    ["F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["A3", "C4", "E4"]
  ];
  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 16) {
      const vel = bar >= 6 && bar < 13 ? 0.2 : 0.1;
      pad.triggerAttackRelease(chords[chordIdx % chords.length], "1n", time, vel);
    }
    chordIdx++;
  }, "1n").start(0);

  const heartbeat = new Tone.MembraneSynth({
    pitchDecay: 0.04,
    octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.1 }
  }).connect(mainReverb);
  heartbeat.volume.value = -26;

  const hbLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 4 && bar < 15) {
      heartbeat.triggerAttackRelease("C1", "8n", time, 0.35);
    }
  }, "2n").start(0);

  const chime = new Tone.MetalSynth({
    frequency: 800,
    envelope: { attack: 0.001, decay: 0.4, release: 0.1 },
    harmonicity: 5.1,
    modulationIndex: 20,
    resonance: 5000
  }).connect(delay);
  chime.volume.value = -24;

  let chimeStep = 0;
  const chimeLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 5 && bar < 14 && Math.random() < 0.18) {
      chime.triggerAttackRelease("16n", time, 0.15 + Math.random() * 0.1);
    }
    chimeStep++;
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(2200, time + 6 * barLen);
  }, barLen * 3);

  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(600, time + 4 * barLen);
  }, barLen * 13);

  window.toneJsInstruments = { purr, crystal, pad, heartbeat, chime };
  window.toneJsParts = { purrLoop, crystalLoop, padLoop, hbLoop, chimeLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
