<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
// Error bootstrap in its OWN script block: a parse error in a later <script>
// fires window 'error' with the line number, so it gets captured instead of
// silently preventing everything (including this listener) from running.
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + (e.filename || 'inline') + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});
  </script>
  <script>
const canvas = document.createElement('canvas');
canvas.width = 900;
canvas.height = 900;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,vec3(0.0)))+min(max(q.x,max(q.y,q.z)),0.0);}

vec3 camPath(float t){
  float fwd=t*2.2;
  float sway=sin(t*0.3141593)*0.5;
  float bob=sin(t*0.7330383)*0.12;
  return vec3(sway,1.6+bob,fwd);
}

vec2 map(vec3 p){
  float dF=p.y;
  float cell=3.3;
  float zi=mod(floor(p.z/cell),40.0);
  float qz=mod(p.z+cell*0.5,cell)-cell*0.5;
  float ax=abs(p.x);
  float side=step(0.0,p.x)*2.0-1.0;

  float hL=hash21(vec2(zi,9.1));
  float lintel=step(0.55,hL);
  float hB=hash21(vec2(zi,side*3.7+5.0));
  float broken=step(0.80,hB)*(1.0-lintel);
  float colH=mix(2.9,4.3,hash21(vec2(zi,2.2)));
  colH=mix(colH,mix(0.5,1.3,hB),broken);

  vec3 cq=vec3(ax-2.6,p.y,qz);
  float dC=sdBox(cq-vec3(0.0,colH*0.5,0.0),vec3(0.30,colH*0.5,0.30));
  float dCap=sdBox(cq-vec3(0.0,colH-0.14,0.0),vec3(0.42,0.14,0.42))*(1.0-broken)+broken*100.0;
  float dPl=sdBox(cq-vec3(0.0,0.16,0.0),vec3(0.48,0.16,0.48));
  dC=min(dC,min(dCap,dPl));

  float dL=100.0;
  if(lintel>0.5){
    dL=sdBox(vec3(p.x,p.y-4.5,qz),vec3(3.1,0.22,0.36));
  }

  float dStone=min(dC,dL);
  float m=1.0;
  if(dStone<dF)m=2.0;
  return vec2(min(dF,dStone),m);
}

vec3 calcNormal(vec3 p){
  vec2 e=vec2(0.002,0.0);
  return normalize(vec3(
    map(p+e.xyy).x-map(p-e.xyy).x,
    map(p+e.yxy).x-map(p-e.yxy).x,
    map(p+e.yyx).x-map(p-e.yyx).x));
}

float shadow(vec3 p,vec3 l){
  float s=1.0;
  float t=0.3;
  for(int i=0;i<12;i++){
    float d=map(p+l*t).x;
    s=min(s,9.0*d/t);
    t+=clamp(d,0.15,1.0);
    if(s<0.02||t>12.0)break;
  }
  return clamp(s,0.0,1.0);
}

float ao(vec3 p,vec3 n){
  float a=0.0;
  float w=0.5;
  for(int i=1;i<4;i++){
    float h=float(i)*0.22;
    a+=w*(h-map(p+n*h).x);
    w*=0.6;
  }
  return clamp(1.0-1.6*a,0.0,1.0);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float t=mod(iTime,60.0);

  vec3 ro=camPath(t);
  vec3 ta=camPath(t+1.8);
  vec3 fwd=normalize(ta-ro);
  vec3 rgt=normalize(cross(vec3(0.0,1.0,0.0),fwd));
  vec3 up=cross(fwd,rgt);
  float bank=sin(t*0.3141593)*0.06;
  vec3 rd=normalize(uv.x*rgt+uv.y*up+1.4*fwd);
  rd.xy=rot2(bank)*rd.xy;

  vec3 sunDir=normalize(vec3(0.30,0.42,1.0));
  vec3 sunCol=vec3(1.0,0.72,0.42);
  vec3 duskCol=vec3(0.16,0.15,0.24);

  float dist=0.0;
  float m=0.0;
  for(int i=0;i<170;i++){
    vec2 h=map(ro+rd*dist);
    if(h.x<0.0015+dist*0.0006){m=h.y;break;}
    dist+=min(h.x,0.75)*0.55;
    if(dist>42.0)break;
  }

  vec3 col;
  if(m>0.5&&dist<42.0){
    vec3 p=ro+rd*dist;
    vec3 n=calcNormal(p);
    float wear=hash21(floor(p.xz*3.0)+floor(p.y*3.0));
    vec3 alb=(m<1.5)
      ? vec3(0.30,0.27,0.25)*(0.8+0.2*step(0.5,fract(p.x*0.9)*fract(p.z*0.9)*4.0))
      : vec3(0.60,0.55,0.48)*(0.85+0.15*wear);
    float sh=shadow(p+n*0.05,sunDir);
    float dif=max(dot(n,sunDir),0.0)*sh;
    float amb=0.22+0.12*n.y;
    float rim=pow(1.0-max(dot(n,-rd),0.0),3.0)*0.35;
    col=alb*(amb*vec3(0.55,0.6,0.85)+dif*1.35*sunCol)+rim*sunCol*sh;
    col*=ao(p,n);
    float fogF=1.0-exp(-dist*0.062);
    vec3 fogC=mix(duskCol,sunCol*0.9,pow(max(dot(rd,sunDir),0.0),3.0));
    col=mix(col,fogC,fogF);
  }else{
    float sky=clamp(rd.y*1.6+0.35,0.0,1.0);
    col=mix(vec3(0.42,0.30,0.30),duskCol*1.4,sky);
  }

  float glare=pow(max(dot(rd,sunDir),0.0),8.0);
  col+=sunCol*glare*0.55;
  col+=vec3(1.0,0.9,0.7)*pow(max(dot(rd,sunDir),0.0),64.0)*0.9;

  float vig=1.0-0.32*dot(uv,uv);
  col*=vig;
  col=pow(col,vec3(0.92));

  gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 900, 900);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 900, 900);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
  <script>
// Audio in its OWN script block: a syntax error here must not kill the visual
// init above — it lands in window._errors via the bootstrap listener instead.
window.initToneJsEngine = async function() {
  const bpm = 60;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(60 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);

  const limiter = new Tone.Limiter(-3).toDestination();
  const reverb = new Tone.Reverb({ decay: 7, wet: 0.45 }).connect(limiter);
  const delay = new Tone.PingPongDelay({ delayTime: "4n", feedback: 0.28, wet: 0.22 }).connect(reverb);

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 2.5, decay: 1.0, sustain: 0.8, release: 4.0 },
    volume: -14
  }).connect(reverb);

  const organ = new Tone.FMSynth({
    harmonicity: 2,
    modulationIndex: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 3.0, decay: 0.5, sustain: 0.9, release: 5.0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 3.0, decay: 0.5, sustain: 0.8, release: 5.0 },
    volume: -18
  }).connect(reverb);

  const ostinato = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.6 },
    volume: -19
  }).connect(delay);

  const sub = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    filter: { type: "lowpass", frequency: 220, Q: 0.5 },
    envelope: { attack: 0.4, decay: 0.8, sustain: 0.7, release: 2.5 },
    volume: -11
  }).connect(limiter);

  const tick = new Tone.MetalSynth({
    envelope: { attack: 0.001, decay: 0.08, release: 0.02 },
    harmonicity: 6.2,
    modulationIndex: 24,
    resonance: 3200,
    octaves: 0.6,
    volume: -26
  }).connect(reverb);

  const chords = [
    ["A2", "C4", "E4"],
    ["F2", "A3", "C4"],
    ["C3", "E4", "G4"],
    ["G2", "B3", "D4"]
  ];
  const roots = ["A0", "F1", "C1", "G0"];

  let chordIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const ch = chords[chordIdx % chords.length];
    pad.triggerAttackRelease(ch, "1m", time + H(12), 0.7);
    if (bar >= totalBars * 0.12) {
      sub.triggerAttackRelease(roots[chordIdx % roots.length], "1m", time + H(8), 0.85);
    }
    chordIdx++;
  }, "1m").start(0);

  const organNotes = ["A3", "E4", "A3", "C4"];
  let organIdx = 0;
  const organLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.35 && bar < totalBars * 0.80) {
      organ.triggerAttackRelease(organNotes[organIdx % organNotes.length], "1m", time + H(15), 0.6);
    }
    organIdx++;
  }, "1m").start(0);

  const ostPattern = ["E4", "A4", "C5", "B4", "A4", "E5", "C5", "B4"];
  let ostIdx = 0;
  const ostLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.20 && bar < totalBars * 0.80) {
      const vel = bar >= totalBars * 0.50 ? 0.55 : 0.38;
      ostinato.triggerAttackRelease(ostPattern[ostIdx % ostPattern.length], "8n", time + H(6), vel);
    }
    ostIdx++;
  }, "8n").start(0);

  let tickIdx = 0;
  const tickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.30 && bar < totalBars * 0.78 && tickIdx % 2 === 0) {
      tick.triggerAttackRelease("C6", "32n", time + H(3), 0.5);
    }
    tickIdx++;
  }, "2n").start(0);

  window.toneJsInstruments = { pad, organ, ostinato, sub, tick, reverb, delay, limiter };
  window.toneJsParts = { padLoop, organLoop, ostLoop, tickLoop };
};



  </script>
