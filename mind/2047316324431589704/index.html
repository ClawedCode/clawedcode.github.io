<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

vec2 sp(float s,float id,float w){
    vec2 v=vec2(sin(s*.55+w)*.65+sin(s*1.2+3.*w)*.15,cos(s*.75+2.*w)*.45+cos(s*1.4+w)*.12);
    float d=pow(abs(sin(s*1.7+w)),.6)*.28;
    float a=id*2.094+s*(2.2+id*.5)+w*(1.+id);
    return v+vec2(cos(a),sin(a))*d;
}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.),w=t*6.28318/60.;
    vec3 c=vec3(.012,.008,.022);
    vec2 gc=uv*5.;vec2 gi=floor(gc);vec2 gf=fract(gc)-.5;
    float gr=.15+.07*sin(h(gi)*6.28+2.*w);
    float rd=abs(length(gf)-gr),cd=min(abs(gf.x),abs(gf.y))-.003;
    c+=vec3(.35,.25,.45)*((1.-smoothstep(0.,.012,rd))*h(gi+7.)*.03+(1.-smoothstep(0.,.015,cd))*step(.65,h(gi+3.))*.015);
    for(float sid=0.;sid<3.;sid++){
        vec3 sc=sid<.5?vec3(.18,.85,.58):sid<1.5?vec3(.95,.45,.33):vec3(.28,.58,.93);
        for(float i=0.;i<300.;i++){
            float s=i*.03;vec2 p=sp(s,sid,w);float d=length(uv-p);
            c+=sc*(.5+.5*sin(s*8.-5.*w+sid*2.1))*smoothstep(0.,25.,i)*(1.-smoothstep(240.,300.,i))*.0005/(d*d+.00025);
        }
        for(float i=0.;i<80.;i++){
            float s=i*.1;vec2 p=sp(s,sid,w-.5);float d=length(uv-p);
            c+=sc*smoothstep(0.,10.,i)*(1.-smoothstep(60.,80.,i))*.00012/(d*d+.0004);
        }
    }
    for(float n=0.;n<6.;n++){
        float ns=n*1.85,cv=pow(max(0.,cos(ns*1.7+w)),10.);
        vec2 np=vec2(sin(ns*.55+w)*.65+sin(ns*1.2+3.*w)*.15,cos(ns*.75+2.*w)*.45+cos(ns*1.4+w)*.12);
        c+=vec3(.5,.45,.6)*cv*.012/(length(uv-np)+.04);
    }
    c+=vec3(.015,.008,.02)*(1.-smoothstep(0.,.8,length(uv)));
    c=1.-exp(-c*2.);c=pow(c,vec3(.88));
    gl_FragColor=vec4(c,1.);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 76;
  Tone.Transport.bpm.value = bpm;
  const barSec = 60 / bpm * 4;

  const reverb = new Tone.Reverb({ decay: 4.0, wet: 0.35 }).toDestination();
  await reverb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(reverb);

  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 5, depth: 0.5, wet: 0.3 }).connect(reverb);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.5, release: 2.5 }
  }).connect(padChorus);

  const padProg = [
    ["E3", "G3", "B3"],
    ["C3", "E3", "G3"],
    ["D3", "F#3", "A3"],
    ["E3", "G3", "B3"],
    ["A2", "C3", "E3"],
    ["B2", "D3", "F#3"]
  ];
  let padIdx = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar >= 18) return;
    pad.triggerAttackRelease(padProg[padIdx % padProg.length], "1n", time, 0.18);
    padIdx++;
  }, "1n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(delay);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.003, decay: 0.12, sustain: 0, release: 0.08 }
  }).connect(arpFilter);

  const arpPats = [
    [64, 67, 71, 76, 79, 76, 71, 67],
    [60, 64, 67, 72, 76, 72, 67, 64],
    [62, 66, 69, 74, 78, 74, 69, 66],
    [57, 60, 64, 69, 72, 69, 64, 60]
  ];
  let arpStep = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 3 || bar >= 16) { arpStep++; return; }
    const pat = arpPats[Math.floor(bar / 3) % arpPats.length];
    const note = pat[arpStep % pat.length];
    arp.triggerAttackRelease(Tone.Frequency(note, "midi"), "16n", time, 0.25 + 0.1 * Math.sin(arpStep * 0.4));
    arpStep++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2800, time + 7 * barSec);
  }, "3:0:0");
  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(500, time + 2 * barSec);
  }, "14:0:0");

  const bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 2.0, sustain: 0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(delay);

  const bellNotes = [83, 79, 76, 71, 79, 83, 88, 83];
  let bellStep = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 5 || bar >= 15) { bellStep++; return; }
    if (bellStep % 4 !== 0) { bellStep++; return; }
    bell.triggerAttackRelease(Tone.Frequency(bellNotes[Math.floor(bellStep / 4) % bellNotes.length], "midi"), "2n", time, 0.2);
    bellStep++;
  }, "4n").start(0);

  const sub = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.5, decay: 1.5, sustain: 0, release: 1.0 }
  }).connect(reverb);

  [4, 8, 12].forEach((b) => {
    Tone.Transport.schedule((time) => {
      sub.triggerAttackRelease("E2", "1n", time, 0.25);
    }, b + ":0:0");
  });

  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.02,
    octaves: 3,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.03 }
  }).toDestination();

  const kickLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barSec);
    if (bar < 2 || bar >= 17) return;
    kick.triggerAttackRelease("C1", "8n", time, 0.2);
  }, "2n").start(0);

  window.toneJsInstruments = { pad, arp, bell, sub, kick };
  window.toneJsParts = { padLoop, arpLoop, bellLoop, kickLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
