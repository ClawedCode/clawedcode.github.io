<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec3 getMatrixColor(float t) {
  vec3 brightGreen = vec3(0.0, 1.0, 0.3);
  vec3 darkGreen = vec3(0.0, 0.5, 0.15);
  return mix(brightGreen, darkGreen, t);
}

float grid3D(vec3 p, float spacing) {
  vec3 grid = abs(fract(p / spacing - 0.5) - 0.5) * spacing;
  float dx = min(grid.y, grid.z);
  float dy = min(grid.x, grid.z);
  float dz = min(grid.x, grid.y);
  return min(dx, min(dy, dz));
}

float hash(vec3 p) {
  return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
}

float mountainSDF(vec3 p, float time) {
  float h = 0.0;
  vec2 q = p.xz;
  float freq = 0.15;
  float amp = 2.5;
  for (int i = 0; i < 4; i++) {
    h += sin(q.x * freq + time * 0.1) * cos(q.y * freq * 0.8 + time * 0.05) * amp;
    h += sin(q.y * freq * 1.2 - time * 0.07) * amp * 0.6;
    freq *= 1.8;
    amp *= 0.5;
  }
  return p.y - h - 1.5;
}

float scene(vec3 p, float time) {
  float terrain = mountainSDF(p, time);
  float gridDist = grid3D(p, 1.0);
  if (terrain < 0.5) {
    return min(terrain, gridDist * 0.5);
  }
  return terrain;
}

vec3 calcNormal(vec3 p, float time) {
  vec2 e = vec2(0.01, 0.0);
  return normalize(vec3(
    scene(p + e.xyy, time) - scene(p - e.xyy, time),
    scene(p + e.yxy, time) - scene(p - e.yxy, time),
    scene(p + e.yyx, time) - scene(p - e.yyx, time)
  ));
}

float scanlines(vec2 uv, float time) {
  float line = sin(uv.y * 200.0 + time * 2.0) * 0.5 + 0.5;
  return line * 0.2;
}

vec3 neonGlow(float dist, vec3 color, float intensity) {
  float glow = intensity / (1.0 + dist * dist * 10.0);
  return color * glow;
}

mat3 camera(vec3 ro, vec3 target) {
  vec3 forward = normalize(target - ro);
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
  vec3 up = cross(forward, right);
  return mat3(right, up, forward);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float time = iTime;
  
  vec3 ro = vec3(
    sin(time * 0.15) * 8.0,
    4.0 + sin(time * 0.2) * 1.5,
    time * 1.5
  );
  
  vec3 target = ro + vec3(sin(time * 0.1) * 2.0, -1.0, 5.0);
  mat3 cam = camera(ro, target);
  vec3 rd = cam * normalize(vec3(uv, 1.2));
  
  vec3 col = vec3(0.0);
  float lineThickness = 0.02;
  
  float t = 0.5;
  for (int i = 0; i < 100; i++) {
    vec3 p = ro + rd * t;
    float d = scene(p, time);
    
    if (d < 0.01) {
      vec3 n = calcNormal(p, time);
      float gridDist = grid3D(p, 1.0);
      
      float diff = max(dot(n, normalize(vec3(1.0, 1.0, 0.5))), 0.0);
      float colorT = p.z * 0.05 + time * 0.1 + p.y * 0.1;
      vec3 terrainColor = getMatrixColor(fract(colorT)) * 0.3;
      
      if (gridDist < lineThickness * 2.0) {
        float intensity = 1.0 - smoothstep(0.0, lineThickness * 2.0, gridDist);
        vec3 lineColor = getMatrixColor(fract(colorT + 0.5));
        col = mix(terrainColor * (diff * 0.5 + 0.2), lineColor * 1.5, intensity);
        col += neonGlow(gridDist * 30.0, lineColor, 1.2);
      } else {
        col = terrainColor * (diff * 0.5 + 0.2);
      }
      
      float fade = 1.0 - smoothstep(10.0, 40.0, t);
      col *= fade;
      break;
    }
    
    t += d * 0.5;
    if (t > 50.0) break;
  }
  
  if (length(col) < 0.01) {
    float horizon = smoothstep(-0.2, 0.3, rd.y);
    col = mix(vec3(0.0, 0.15, 0.08), vec3(0.0, 0.02, 0.01), horizon);
    
    float stars = hash(rd * 1000.0);
    if (stars > 0.998 && rd.y > 0.1) {
      col += vec3(0.0, stars * 0.5, stars * 0.2);
    }
  }
  
  vec2 screenUV = gl_FragCoord.xy / iResolution.xy;
  col *= 1.0 - scanlines(screenUV, time) * 0.3;
  
  float vignette = 1.0 - dot(screenUV - 0.5, screenUV - 0.5) * 0.8;
  col *= vignette;
  
  col = pow(col, vec3(0.9));
  
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();
  
  const compressor = new Tone.Compressor({ threshold: -18, ratio: 8, attack: 0.005, release: 0.2 }).toDestination();

  const subBass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.5 },
    filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.3, baseFrequency: 60, octaves: 1 }
  }).connect(compressor);
  subBass.volume.value = -6;

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 600, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.2, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.2, decay: 0.5, sustain: 0.6, release: 2.0 }
  }).connect(padChorus);
  pad.volume.value = -14;

  const arpDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.35, wet: 0.25 }).connect(masterReverb);
  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 800, Q: 1.5 }).connect(arpDelay);
  const arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.005, decay: 0.15, sustain: 0, release: 0.1 }
  }).connect(arpFilter);
  arp.volume.value = -12;

  const bellReverb = new Tone.Reverb({ decay: 4, wet: 0.5 }).toDestination();
  await bellReverb.generate();
  const bell = new Tone.FMSynth({
    harmonicity: 4,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.5 },
    modulation: { type: "sine" }
  }).connect(bellReverb);
  bell.volume.value = -18;

  const bassNotes = [
    ["A1", "A1", "E1", "E1"],
    ["F1", "F1", "C2", "C2"],
    ["G1", "G1", "D1", "D1"],
    ["A1", "A1", "A1", "A1"]
  ];
  
  let bassIndex = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const section = Math.floor(bar / 4) % 4;
    const pattern = bassNotes[section];
    
    if (bar < 16) {
      subBass.triggerAttackRelease(pattern[bassIndex % pattern.length], "2n", time, 0.7);
    }
    bassIndex++;
  }, "2n").start(0);

  const padChords = [
    ["A3", "C4", "E4"],
    ["F3", "A3", "C4"],
    ["G3", "B3", "D4"],
    ["A3", "C4", "E4"]
  ];
  
  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 2 && bar < 14) {
      const section = Math.floor(bar / 4) % 4;
      pad.triggerAttackRelease(padChords[section], "1n", time, 0.25);
    }
    chordIndex++;
  }, "1n").start(0);

  const arpNotes = ["E4", "A4", "C5", "E5", "C5", "A4", "G4", "E4"];
  const arpAlt = ["C4", "F4", "A4", "C5", "A4", "F4", "E4", "C4"];
  
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 4 && bar < 12) {
      const useAlt = bar >= 8;
      const notes = useAlt ? arpAlt : arpNotes;
      const vel = 0.4 + Math.sin(arpIndex * 0.3) * 0.15;
      arp.triggerAttackRelease(notes[arpIndex % notes.length], "16n", time, vel);
    }
    arpIndex++;
  }, "16n").start(0);

  const bellNotes = ["E5", "A5", "C6", "G5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    
    if (bar >= 6 && bar < 10 && bellIndex % 4 < 1) {
      bell.triggerAttackRelease(bellNotes[bellIndex % bellNotes.length], "4n", time, 0.3);
    }
    bellIndex++;
  }, "2n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2400, time + 8 * (60 / bpm) * 4);
  }, "4:0:0");

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
    padFilter.frequency.linearRampToValueAtTime(400, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  window.toneJsInstruments = { subBass, pad, arp, bell };
  window.toneJsParts = { bassLoop, padLoop, arpLoop, bellLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
