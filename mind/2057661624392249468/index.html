<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return-1.0+2.0*fract(sin(p)*43758.5453);}

float gn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return mix(mix(dot(h2(i),f),dot(h2(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(h2(i+vec2(0,1)),f-vec2(0,1)),dot(h2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}

float fbm(vec2 p){float v=0.0,a=0.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<3;i++){v+=a*gn(p);p=m*p;a*=0.5;}return v;}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,75.0);
    float ph=t/75.0;

    float em=smoothstep(0.05,0.4,ph);
    float fo=1.0-smoothstep(0.85,1.0,ph);

    float sp=t*0.08;
    float r1=length(uv-vec2(-0.15,0.1));
    float r2=length(uv-vec2(0.2,-0.15));
    float r3=length(uv-vec2(0.05,0.25));
    float r4=length(uv-vec2(-0.1,-0.2));

    float nc=0.0;
    nc=max(nc,1.0-smoothstep(sp-0.3,sp,r1));
    nc=max(nc,1.0-smoothstep(sp*0.8-0.3,sp*0.8,r2));
    nc=max(nc,1.0-smoothstep(sp*0.6-0.3,sp*0.6,r3));
    nc=max(nc,1.0-smoothstep(sp*0.9-0.3,sp*0.9,r4));
    nc=min(nc,1.0);

    float ef=em*nc*fo;

    vec2 p=uv*5.0;
    float w1=fbm(p+vec2(t*0.018,-t*0.013));
    float w2=fbm(p+vec2(w1*0.25+1.7,t*0.015));
    vec2 wp=p+vec2(w1,w2)*mix(0.05,0.45,ef);

    float act=gn(wp*5.5+t*0.008)+0.3*gn(wp*11.0-t*0.006);
    float inh=gn(wp*2.8+t*0.012+7.0)+0.3*gn(wp*5.6-t*0.01+3.0);
    float bal=0.6+0.08*sin(length(uv)*3.0+t*0.05);
    float rd=act-inh*bal;

    float k=mix(1.0,12.0,ef);
    float pat=1.0/(1.0+exp(-k*rd));

    vec3 mem=vec3(0.04,0.10,0.13);
    vec3 pho=vec3(0.09,0.50,0.42);
    vec3 amb=vec3(0.65,0.35,0.07);
    vec3 cop=vec3(0.14,0.45,0.38);
    vec3 deep=vec3(0.012,0.035,0.055);

    vec3 col=mix(mem,pho,pat);
    float dep=fbm(wp*2.5+t*0.003);
    col=mix(col,amb,dep*0.15*pat);
    col=mix(col,cop,(1.0-dep)*0.1*(1.0-pat));

    float bnd=exp(-abs(rd)*k*0.35);
    col+=vec3(0.06,0.22,0.18)*bnd*ef*0.5;

    float sss=gn(wp*8.0+t*0.02)*0.5+0.5;
    col+=vec3(0.04,0.015,0.0)*sss*pat*0.12;

    float wet=pow(pat,3.0)*0.12;
    col+=vec3(0.15,0.25,0.2)*wet*ef;

    float pre=gn(uv*15.0+t*0.5);
    col+=vec3(0.02,0.05,0.04)*pre*(1.0-ef);

    float fg=0.0;
    fg=max(fg,exp(-abs(r1-sp)*8.0));
    fg=max(fg,exp(-abs(r2-sp*0.8)*8.0));
    fg=max(fg,exp(-abs(r3-sp*0.6)*8.0));
    fg=max(fg,exp(-abs(r4-sp*0.9)*8.0));
    fg*=smoothstep(0.0,0.15,ph)*(1.0-smoothstep(0.5,0.7,ph));
    col+=vec3(0.1,0.3,0.25)*fg*0.4;

    col*=0.93+0.07*sin(t*0.22);

    float v=length(uv);
    col=mix(col,deep,smoothstep(0.35,0.85,v));

    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 56;
  Tone.Transport.bpm.value = bpm;

  const deepReverb = new Tone.Reverb({ decay: 7, wet: 0.55 }).toDestination();
  await deepReverb.generate();

  const shimmerDelay = new Tone.FeedbackDelay({
    delayTime: "4n.", feedback: 0.5, wet: 0.3
  }).connect(deepReverb);

  const warmFilter = new Tone.Filter({
    type: "lowpass", frequency: 350, Q: 0.8
  }).connect(deepReverb);

  const drone = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 4, decay: 2, sustain: 0.8, release: 5 }
  }).connect(warmFilter);
  drone.volume.value = -15;

  const droneChords = [
    ["C2", "G2"],
    ["C2", "Eb2"],
    ["Bb1", "F2"],
    ["C2", "G2"]
  ];
  let droneIdx = 0;
  const droneLoop = new Tone.Loop((time) => {
    drone.triggerAttackRelease(droneChords[droneIdx % droneChords.length], "4m", time, 0.35);
    droneIdx++;
  }, "2m").start(0);

  const bell = new Tone.FMSynth({
    harmonicity: 4.5,
    modulationIndex: 6,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 4, sustain: 0, release: 3 },
    modulation: { type: "triangle" },
    modulationEnvelope: { attack: 0.01, decay: 2, sustain: 0, release: 1.5 }
  }).connect(shimmerDelay);
  bell.volume.value = -12;

  const bellPool = ["C5", "Eb5", "G5", "Bb4", "Ab5", "F5", "D5", "G4", "C6"];
  let bellIdx = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    let density;
    if (bar < 3) density = 0.0;
    else if (bar < 10) density = 0.1 + Math.min(1.0, bar / 14) * 0.5;
    else if (bar < 16) density = 0.4;
    else density = 0.1;
    if (Math.random() < density) {
      const noteIdx = (bellIdx + Math.floor(Math.random() * 3)) % bellPool.length;
      bell.triggerAttackRelease(bellPool[noteIdx], "2n", time, 0.2 + Math.random() * 0.15);
      bellIdx++;
    }
  }, "2n").start(0);

  const noiseHP = new Tone.Filter({ type: "highpass", frequency: 200 }).connect(deepReverb);
  const noiseBP = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 1.5 }).connect(noiseHP);
  const noise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 3, decay: 2, sustain: 0.4, release: 4 }
  }).connect(noiseBP);
  noise.volume.value = -18;

  const noiseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 10) {
      noise.volume.value = -18 - bar * 2;
      noise.triggerAttackRelease("4m", time);
    }
  }, "4m").start(0);

  const chorus = new Tone.Chorus({
    frequency: 0.3, delayTime: 4.5, depth: 0.7, wet: 0.5
  }).connect(shimmerDelay);
  chorus.start();

  const shimmer = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: { attack: 3, decay: 2, sustain: 0.4, release: 4 }
  }).connect(chorus);
  shimmer.volume.value = -20;

  const shimmerVoicings = [
    ["G4", "C5", "Eb5"],
    ["Ab4", "C5", "F5"],
    ["G4", "Bb4", "D5"],
    ["F4", "Ab4", "C5"],
    ["Eb4", "G4", "Bb4"]
  ];
  let shimIdx = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 4 && bar < 15) {
      shimmer.triggerAttackRelease(shimmerVoicings[shimIdx % shimmerVoicings.length], "2m", time, 0.18);
      shimIdx++;
    }
  }, "2m").start(0);

  const sub = new Tone.MembraneSynth({
    pitchDecay: 0.1, octaves: 2.5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.4 }
  }).toDestination();
  sub.volume.value = -14;

  let heartBeat = 0;
  const heartLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    const beat = heartBeat % 8;
    if (bar >= 3 && bar < 16 && (beat === 0 || beat === 1)) {
      sub.triggerAttackRelease("C1", "8n", time, beat === 0 ? 0.5 : 0.3);
    }
    heartBeat++;
  }, "4n").start(0);

  const actSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.8, decay: 1.5, sustain: 0.2, release: 2 }
  }).connect(shimmerDelay);
  actSynth.volume.value = -16;

  const actNotes = ["Eb4", "G4", "Ab4", "Bb4", "C5", "G4", "F4", "Eb4"];
  let actIdx = 0;
  const actLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 8 && bar < 15 && Math.random() < 0.6) {
      actSynth.triggerAttackRelease(actNotes[actIdx % actNotes.length], "2n", time, 0.25);
      actIdx++;
    }
  }, "1m").start(0);

  Tone.Transport.schedule((time) => {
    warmFilter.frequency.linearRampToValueAtTime(800, time + 6 * (60 / bpm) * 4);
  }, "2:0:0");

  Tone.Transport.schedule((time) => {
    warmFilter.frequency.linearRampToValueAtTime(1400, time + 4 * (60 / bpm) * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    warmFilter.frequency.linearRampToValueAtTime(350, time + 4 * (60 / bpm) * 4);
    shimmerDelay.wet.linearRampToValueAtTime(0.2, time + 4 * (60 / bpm) * 4);
  }, "15:0:0");

  window.toneJsInstruments = { drone, bell, noise, shimmer, sub, actSynth };
  window.toneJsParts = { droneLoop, bellLoop, noiseLoop, shimmerLoop, heartLoop, actLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
