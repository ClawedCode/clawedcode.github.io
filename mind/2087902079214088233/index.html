<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
#define PI 3.14159265359
#define TAU 6.28318530718
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float a=h(i),b=h(i+vec2(1.0,0.0)),c=h(i+vec2(0.0,1.0)),d=h(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
mat2 r(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float q=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,q)-k*q*(1.0-q);}
vec3 pal(float x){vec3 a=vec3(0.42,0.34,0.48),b=vec3(0.38,0.28,0.32),c=vec3(1.0,0.82,1.16),d=vec3(0.08,0.22,0.37);return a+b*cos(TAU*(c*x+d));}
vec2 curl(vec2 p,float t){float e=0.08;float a=n(p+vec2(0.0,e)+t),b=n(p-vec2(0.0,e)+t),c=n(p+vec2(e,0.0)-t*0.7),d=n(p-vec2(e,0.0)-t*0.7);return vec2((c-d),(b-a))/(2.0*e);}
vec2 flow(vec2 p,float t){vec2 q=p;float m=length(q)+0.08;vec2 v=vec2(-q.y,q.x)/(m*m)*0.34;v+=curl(p*0.7+vec2(sin(t),cos(t))*0.5,t)*0.8;v-=normalize(q)*0.09/(m+0.1);return v;}
float map(vec3 p,float ph){p.xy=r(sin(ph*TAU)*0.22)*p.xy;p.xz=r(ph*TAU*0.5)*p.xz;float a=atan(p.z,p.x),rr=length(p.xz);float wave=0.13*sin(a*7.0+ph*TAU*3.0)+0.08*sin(p.y*6.0-ph*TAU*2.0);float shell=abs(length(vec2(rr-1.05+wave,p.y*0.72))-0.48)-0.035;float throat=length(p.xz)-0.26-0.04*sin(p.y*9.0+ph*TAU);float cut=max(shell,-throat);float ribs=abs(sin(a*14.0+p.y*3.0+ph*TAU*2.0))*0.018;float shard=abs(length(abs(p)-vec3(0.65,0.22,0.65))-0.32)-0.02;return smin(cut+ribs,shard,0.08);}
vec3 norm(vec3 p,float ph){vec2 e=vec2(0.002,0.0);return normalize(vec3(map(p+e.xyy,ph)-map(p-e.xyy,ph),map(p+e.yxy,ph)-map(p-e.yxy,ph),map(p+e.yyx,ph)-map(p-e.yyx,ph)));}
float bayer4(vec2 p){vec2 c=floor(mod(p,4.0));int x=int(c.x);int y=int(c.y);if(y==0){if(x==0)return 0.0/16.0;if(x==1)return 8.0/16.0;if(x==2)return 2.0/16.0;return 10.0/16.0;}else if(y==1){if(x==0)return 12.0/16.0;if(x==1)return 4.0/16.0;if(x==2)return 14.0/16.0;return 6.0/16.0;}else if(y==2){if(x==0)return 3.0/16.0;if(x==1)return 11.0/16.0;if(x==2)return 1.0/16.0;return 9.0/16.0;}else{if(x==0)return 15.0/16.0;if(x==1)return 7.0/16.0;if(x==2)return 13.0/16.0;return 5.0/16.0;}}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
  float ph=mod(iTime,48.0)/48.0,t=ph*TAU,beat=pow(0.5+0.5*sin(iTime*76.0/60.0*PI),7.0);
  vec3 ro=vec3(0.0,0.0,3.9),rd=normalize(vec3(uv,-1.75));
  rd.xz=r(0.18*sin(t))*rd.xz;
  vec3 col=vec3(0.012,0.011,0.022)+0.04*pal(length(uv)*0.35+ph);
  float glow=0.0,hit=0.0,mt=0.0;
  for(int i=0;i<56;i++){
    vec3 p=ro+rd*mt;
    float d=map(p,ph);
    glow+=0.015/(0.035+abs(d))*exp(-mt*0.17);
    if(d<0.002){hit=1.0;break;}
    mt+=max(d*0.62,0.018);
    if(mt>7.0)break;
  }
  if(hit>0.5){
    vec3 p=ro+rd*mt,no=norm(p,ph),li=normalize(vec3(-0.4,0.7,0.55));
    float dif=max(dot(no,li),0.0),rim=pow(1.0-max(dot(no,-rd),0.0),2.2);
    vec3 base=mix(vec3(0.09,0.05,0.13),pal(p.y*0.18+length(p.xz)*0.14+ph*0.55),0.88);
    col+=base*(dif*0.85+0.18)+vec3(0.25,0.72,0.95)*rim*0.65;
  }
  vec3 pc=vec3(0.0);
  for(int i=0;i<112;i++){
    float fi=float(i);
    float a=fi*2.399963+ph*TAU*1.7;
    vec2 p=vec2(cos(a),sin(a))*(0.25+1.45*h(vec2(fi,4.0)));
    p+=vec2(sin(fi*1.7),cos(fi*1.31))*0.08;
    for(int j=0;j<2;j++){
      vec2 v=flow(p,t*0.18+fi*0.011);
      p+=v*0.19;
    }
    float l=length(p),sil=smoothstep(0.34,0.9,l)*(1.0-smoothstep(1.95,2.35,l));
    float d=length(uv-p*0.43);
    vec3 cc=mix(vec3(0.95,0.58,0.25),vec3(0.16,0.9,1.0),smoothstep(0.2,1.9,l));
    pc+=cc*(0.0055+0.004*beat)*sil/(0.0018+d*d*90.0);
  }
  float ring=abs(length(uv)-0.49-0.035*sin(atan(uv.y,uv.x)*9.0-t*2.0));
  col+=pc+glow*vec3(0.06,0.18,0.32);
  col+=vec3(0.42,0.76,0.95)*smoothstep(0.022,0.0,ring)*0.22;
  col*=1.0-smoothstep(0.75,1.45,length(uv))*0.72;
  col=mix(col,floor(col*6.0+bayer4(gl_FragCoord.xy))/6.0,0.22);
  col*=0.88+0.12*sin(gl_FragCoord.y*1.7);
  gl_FragColor=vec4(pow(max(col,0.0),vec3(0.82)),1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 76;
  Tone.Transport.bpm.value = bpm;
  const totalBars = Math.round(48 * bpm / 240);
  const barAt = (time) => Math.floor(Tone.Transport.getSecondsAtTime(time) * bpm / 240);
  const H = ms => Math.max(0, (Math.random() * ms * 2 - ms) / 1000);
  const secPerBar = 240 / bpm;
  const master = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.24 }).toDestination();
  const verb = new Tone.Reverb({ decay: 5.8, wet: 0.42 }).connect(master);
  await verb.generate();
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.36, wet: 0.26 }).connect(verb);
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.038,
    octaves: 5,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.22, sustain: 0, release: 0.04 }
  }).toDestination();
  kick.volume.value = -7;
  const subFilter = new Tone.Filter({ type: "lowpass", frequency: 140, Q: 0.7 }).connect(master);
  const sub = new Tone.MonoSynth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.18, sustain: 0.28, release: 0.18 },
    filterEnvelope: { attack: 0.02, decay: 0.18, sustain: 0.2, baseFrequency: 60, octaves: 1.5 }
  }).connect(subFilter);
  sub.volume.value = -11;
  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 720, Q: 1.1 }).connect(verb);
  const chorus = new Tone.Chorus({ frequency: 0.09, delayTime: 4.2, depth: 0.55, wet: 0.34 }).connect(padFilter);
  chorus.start();
  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.8, decay: 0.6, sustain: 0.62, release: 2.8 }
  }).connect(chorus);
  pad.volume.value = -17;
  const bell = new Tone.FMSynth({
    harmonicity: 2.7,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 2.2, sustain: 0, release: 1.2 },
    modulation: { type: "sine" }
  }).connect(delay);
  bell.volume.value = -15;
  const arpFilter = new Tone.Filter({ type: "bandpass", frequency: 1800, Q: 1.6 }).connect(delay);
  const arp = new Tone.Synth({
    oscillator: { type: "pulse", width: 0.42 },
    envelope: { attack: 0.004, decay: 0.12, sustain: 0, release: 0.06 }
  }).connect(arpFilter);
  arp.volume.value = -18;
  const hushFilter = new Tone.Filter({ type: "bandpass", frequency: 420, Q: 0.8 }).connect(verb);
  const hush = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.08, decay: 0.8, sustain: 0, release: 0.6 }
  }).connect(hushFilter);
  hush.volume.value = -23;
  let beat = 0;
  const kickLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const strong = bar < totalBars * 0.82 || beat % 4 === 0;
    if (strong) kick.triggerAttackRelease("C1", "8n", time + H(3), bar > totalBars * 0.35 && bar < totalBars * 0.68 ? 0.95 : 0.72);
    master.threshold.setValueAtTime(-26, time);
    master.threshold.exponentialRampToValueAtTime(-18, time + 0.16);
    beat++;
  }, "4n").start(0);
  const bassA = ["D1", "D1", "A1", "C2", "D1", "F1", "C2", "A1"];
  const bassB = ["D1", "F1", "G1", "A1", "C2", "A1", "G1", "F1", "D1", "A1"];
  let bi = 0;
  const bassLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.08 && bar < totalBars * 0.88) {
      const pat = bar < totalBars * 0.38 || bar >= totalBars * 0.74 ? bassA : bassB;
      const v = bar > totalBars * 0.34 && bar < totalBars * 0.68 ? 0.78 : 0.52;
      if (bi % 6 !== 5 || bar > totalBars * 0.42) sub.triggerAttackRelease(pat[bi % pat.length], "8n", time + H(7), v);
    }
    bi++;
  }, "8n").start(0);
  const chords = [
    ["D3", "A3", "E4", "F4"],
    ["Bb2", "F3", "C4", "D4"],
    ["C3", "G3", "D4", "E4"],
    ["A2", "E3", "G3", "D4"]
  ];
  let ci = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    const v = bar > totalBars * 0.32 && bar < totalBars * 0.72 ? 0.26 : 0.16;
    pad.triggerAttackRelease(chords[ci % chords.length], "1m", time + H(14), v);
    ci++;
  }, "1m").start(0);
  const scale = [0, 2, 3, 5, 7, 9, 10, 14, 15];
  let ai = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.18 && bar < totalBars * 0.78) {
      const root = bar < totalBars * 0.55 ? 62 : 58;
      const deg = scale[(ai * 3 + Math.floor(ai / 5)) % scale.length];
      const oct = ai % 11 === 0 ? 12 : 0;
      const note = Tone.Frequency(root + deg + oct, "midi");
      const skip = bar > totalBars * 0.62 && ai % 7 === 3;
      if (!skip) arp.triggerAttackRelease(note, "16n", time + H(8), 0.34 + Math.random() * 0.18);
    }
    ai++;
  }, "16n").start(0);
  let gi = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar < totalBars * 0.82 && gi % 3 !== 1) {
      const notes = ["A4", "C5", "D5", "F5", "E5", "C5", "G4"];
      bell.triggerAttackRelease(notes[(gi * 2 + Math.floor(bar)) % notes.length], "2n", time + H(13), 0.24);
    }
    gi++;
  }, "2n").start(0);
  let hi = 0;
  const hushLoop = new Tone.Loop((time) => {
    const bar = barAt(time);
    if (bar >= totalBars * 0.28 && bar < totalBars * 0.70 && hi % 4 === 0) {
      hush.triggerAttackRelease("4n", time + H(10), 0.28);
    }
    hi++;
  }, "8n").start(0);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(1800, time + totalBars * 0.28 * secPerBar);
    arpFilter.frequency.linearRampToValueAtTime(3100, time + totalBars * 0.25 * secPerBar);
    hushFilter.frequency.linearRampToValueAtTime(980, time + totalBars * 0.22 * secPerBar);
  }, totalBars * 0.14 * secPerBar);
  Tone.Transport.schedule((time) => {
    padFilter.frequency.linearRampToValueAtTime(680, time + totalBars * 0.18 * secPerBar);
    arpFilter.frequency.linearRampToValueAtTime(1250, time + totalBars * 0.15 * secPerBar);
    hushFilter.frequency.linearRampToValueAtTime(420, time + totalBars * 0.12 * secPerBar);
  }, totalBars * 0.78 * secPerBar);
  window.toneJsInstruments = { kick, sub, pad, bell, arp, hush, master, verb, delay, subFilter, padFilter, chorus, arpFilter, hushFilter };
  window.toneJsParts = { kickLoop, bassLoop, padLoop, arpLoop, bellLoop, hushLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 48;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 48;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
