<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

vec2 hash2(vec2 p) {
    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 m = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = m * p * 2.0 + vec2(1.7, 9.2);
        a *= 0.5;
    }
    return v;
}

float voroEdge(vec2 p, float ph) {
    vec2 n = floor(p);
    vec2 f = fract(p);
    float md = 1.0, md2 = 1.0;
    for(float j = -1.0; j <= 1.0; j++) {
        for(float i = -1.0; i <= 1.0; i++) {
            vec2 g = vec2(i, j);
            vec2 o = hash2(n + g);
            o = 0.5 + 0.4 * sin(ph + o * 6.28318);
            float d = length(g + o - f);
            if(d < md) { md2 = md; md = d; }
            else if(d < md2) { md2 = d; }
        }
    }
    return md2 - md;
}

vec2 spectral(vec2 uv, vec2 tc, vec2 off, float spd, float scl, float rw) {
    vec2 toff = tc * spd * 2.0;
    vec2 q = vec2(
        fbm(uv * scl + off + toff),
        fbm(uv * scl + off + vec2(5.2, 1.3) + toff * 0.9)
    );
    vec2 r = vec2(
        fbm(uv * scl + q * 3.5 + vec2(1.7, 9.2) + toff * 0.4),
        fbm(uv * scl + q * 3.5 + vec2(8.3, 2.8) + toff * 0.35)
    );
    float f = fbm(uv * scl + r * 3.0);
    float ridge = 1.0 - smoothstep(0.0, rw, abs(f - 0.5));
    float echo = (1.0 - smoothstep(0.0, rw * 0.6, abs(f - 0.32))) * 0.3;
    float glow = 1.0 - smoothstep(0.0, rw * 2.5, abs(f - 0.5));
    return vec2(ridge + echo, glow);
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float rawT = mod(iTime, 45.0);
    float phase = rawT / 45.0 * 6.28318;
    vec2 tc = vec2(sin(phase), cos(phase));
    float breath = 0.5 + 0.5 * sin(phase * 5.0);

    vec3 col = vec3(0.015, 0.012, 0.035);

    vec2 gp = uv * 10.0;
    float g = min(abs(fract(gp.x) - 0.5), abs(fract(gp.y) - 0.5));
    col += vec3(0.025, 0.02, 0.045) * (1.0 - smoothstep(0.0, 0.03, g)) * (0.3 + 0.15 * breath);

    float ve = voroEdge(uv * 4.5, phase);
    col += vec3(0.04, 0.03, 0.065) * smoothstep(0.06, 0.0, ve) * (0.4 + 0.2 * breath);

    vec2 n = floor(uv * 4.5);
    vec2 fv = fract(uv * 4.5);
    for(float j = -1.0; j <= 1.0; j++) {
        for(float i = -1.0; i <= 1.0; i++) {
            vec2 g2 = vec2(i, j);
            vec2 o = hash2(n + g2);
            o = 0.5 + 0.4 * sin(phase + o * 6.28318);
            float nd = length(g2 + o - fv);
            float nGlow = smoothstep(0.12, 0.0, nd);
            float nPulse = 0.5 + 0.5 * sin(phase * 3.0 + hash(n + g2) * 6.28318);
            col += vec3(0.05, 0.04, 0.08) * nGlow * nPulse * 0.4;
        }
    }

    vec2 s1 = spectral(uv, tc, vec2(0.0), 0.6, 2.0, 0.12);
    vec2 s2 = spectral(uv, tc, vec2(3.7, 7.1), 1.0, 2.5, 0.09);
    vec2 s3 = spectral(uv, tc, vec2(8.3, 2.4), 0.8, 2.2, 0.1);

    vec3 c1 = vec3(0.15, 0.28, 0.9);
    vec3 c2 = vec3(0.95, 0.45, 0.1);
    vec3 c3 = vec3(0.2, 0.78, 0.65);

    col += c1 * s1.y * 0.18;
    col += c2 * s2.y * 0.18;
    col += c3 * s3.y * 0.18;

    col += c1 * s1.x * 0.8;
    col += c2 * s2.x * 0.8;
    col += c3 * s3.x * 0.8;

    float merge = s1.x * s2.x + s2.x * s3.x + s1.x * s3.x;
    float tri = s1.x * s2.x * s3.x;
    vec3 pCol = vec3(1.0, 0.94, 0.84);
    col += pCol * merge * 4.0 * (0.7 + 0.5 * breath);
    col += vec3(1.0, 0.98, 0.93) * tri * 25.0;

    col *= 1.0 - dot(uv * 0.75, uv * 0.75);
    col = col / (1.0 + col * 0.2);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  var bpm = 72;
  Tone.Transport.bpm.value = bpm;
  var barLen = 60 / bpm * 4;

  var masterVerb = new Tone.Reverb({ decay: 3.2, wet: 0.3 }).toDestination();
  await masterVerb.generate();
  var delayBus = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterVerb);
  var comp = new Tone.Compressor({ threshold: -22, ratio: 6, attack: 0.005, release: 0.2 }).toDestination();

  var kick = new Tone.MembraneSynth({
    pitchDecay: 0.04, octaves: 4,
    oscillator: { type: "sine" },
    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.04 }
  }).toDestination();

  var kickCount = 0;
  var kickLoop = new Tone.Loop(function(time) {
    var beat = kickCount % 8;
    if (beat === 0 || beat === 4) {
      kick.triggerAttackRelease("C1", "8n", time, beat === 0 ? 0.5 : 0.28);
    }
    kickCount++;
  }, "8n").start(0);

  var padFilt = new Tone.Filter({ type: "lowpass", frequency: 350, Q: 0.8 }).connect(comp);
  var padChor = new Tone.Chorus({ frequency: 0.1, delayTime: 3.5, depth: 0.5, wet: 0.3 }).connect(padFilt);
  padChor.start();
  var pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    detune: -8,
    envelope: { attack: 1.0, decay: 0.4, sustain: 0.55, release: 1.8 }
  }).connect(padChor);

  var chords = [
    ["A2", "E3", "A3"],
    ["D2", "A2", "F3"],
    ["F2", "C3", "A3"],
    ["E2", "B2", "G3"]
  ];
  var chIdx = 0;
  var padLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    var prog = Math.min(bar / 13, 1.0);
    padFilt.frequency.setValueAtTime(350 + 450 * Math.sin(prog * Math.PI), time);
    pad.triggerAttackRelease(chords[chIdx % chords.length], "1n", time, 0.14);
    chIdx++;
  }, "1n").start(0);

  var arpFilt = new Tone.Filter({ type: "lowpass", frequency: 500 }).connect(delayBus);
  var arp = new Tone.Synth({
    oscillator: { type: "square" },
    envelope: { attack: 0.003, decay: 0.08, sustain: 0, release: 0.04 }
  }).connect(arpFilt);

  var scale = [57, 60, 62, 64, 67, 69, 72, 74, 76];
  var arpStep = 0;
  var arpLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 12) {
      var prog = (bar - 3) / 9;
      arpFilt.frequency.setValueAtTime(500 + 2000 * Math.sin(prog * Math.PI), time);
      var len = scale.length;
      var up = (arpStep % (len * 2)) < len;
      var idx = up ? arpStep % len : len - 1 - (arpStep % len);
      var vel = 0.2 + 0.15 * Math.sin(arpStep * 0.25);
      arp.triggerAttackRelease(Tone.Frequency(scale[idx], "midi"), "16n", time, vel);
    }
    arpStep++;
  }, "16n").start(0);

  var bell = new Tone.FMSynth({
    harmonicity: 3.5, modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 2.0, sustain: 0 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 1.2, sustain: 0 }
  }).connect(masterVerb);

  var bellNotes = ["A4", "E5", "C5", "A5", "D5", "F5", "E4", "B4", "G5", "C6"];
  var bellIdx = 0;
  var bellLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 12) {
      var density = 0.25 + 0.45 * ((bar - 2) / 10);
      if (Math.random() < density) {
        bell.triggerAttackRelease(bellNotes[bellIdx % bellNotes.length], "4n", time, 0.18 + 0.1 * Math.random());
        bellIdx++;
      }
    }
  }, "4n").start(0);

  var hat = new Tone.MetalSynth({
    frequency: 380, harmonicity: 5.1, modulationIndex: 28, resonance: 3500,
    envelope: { attack: 0.001, decay: 0.07, release: 0.02 }
  }).connect(masterVerb);

  var hatCt = 0;
  var hatLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 5 && bar < 11 && hatCt % 3 === 0) {
      hat.triggerAttackRelease("32n", time, 0.06 + 0.04 * Math.random());
    }
    hatCt++;
  }, "16n").start(0);

  var noiseFilt = new Tone.Filter({ type: "bandpass", frequency: 1200, Q: 2 }).connect(masterVerb);
  var noiseSyn = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 0.6, decay: 0.3, sustain: 0, release: 0.8 }
  }).connect(noiseFilt);

  var noiseTriggered = false;
  var noiseLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar === 7 && !noiseTriggered) {
      noiseSyn.triggerAttackRelease(1.2, time);
      noiseFilt.frequency.linearRampToValueAtTime(3500, time + 1.2);
      noiseFilt.frequency.setValueAtTime(1200, time + 1.5);
      noiseTriggered = true;
    }
    if (bar !== 7) noiseTriggered = false;
  }, "2n").start(0);

  window.toneJsInstruments = { kick: kick, pad: pad, arp: arp, bell: bell, hat: hat, noiseSyn: noiseSyn };
  window.toneJsParts = { kickLoop: kickLoop, padLoop: padLoop, arpLoop: arpLoop, bellLoop: bellLoop, hatLoop: hatLoop, noiseLoop: noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 45;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 45;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
