<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = mod(iTime, 60.0);
    float ph = t * 0.10472;

    float z = 1.0 + 0.12 * sin(ph * 2.0);
    vec2 p = uv * z;
    p *= 1.0 + 0.06 * dot(p, p);

    float f = 65.0;
    float dr = sin(ph * 3.0) * 0.06 + 0.05;

    vec2 pa = rot(ph) * p;
    vec2 pb = rot(ph + dr) * p;

    float ga = smoothstep(0.4, 0.6, sin(pa.x * f) * 0.5 + 0.5)
             * smoothstep(0.4, 0.6, sin(pa.y * f) * 0.5 + 0.5);
    float gb = smoothstep(0.4, 0.6, sin(pb.x * f) * 0.5 + 0.5)
             * smoothstep(0.4, 0.6, sin(pb.y * f) * 0.5 + 0.5);
    float gm = ga * gb;

    vec2 c1 = vec2(sin(ph * 2.0), cos(ph * 3.0)) * 0.08;
    vec2 c2 = c1 + vec2(sin(ph * 5.0), cos(ph * 4.0)) * 0.04;
    float rm = (sin(length(p - c1) * f * 0.6) * 0.5 + 0.5)
             * (sin(length(p - c2) * f * 0.6) * 0.5 + 0.5);

    float sa = sin(atan(p.y - c1.y, p.x - c1.x) * 24.0) * 0.5 + 0.5;
    float sb = sin(atan(p.y - c2.y, p.x - c2.x) * 24.0) * 0.5 + 0.5;
    float sm = sa * sb;

    float dial = sin(ph * 4.0) * 0.5 + 0.5;
    float w1 = smoothstep(0.0, 0.3, dial) * (1.0 - smoothstep(0.55, 0.85, dial));
    float w2 = smoothstep(0.2, 0.55, dial) * (1.0 - smoothstep(0.7, 1.0, dial));
    float w3 = smoothstep(0.5, 0.85, dial);
    float ws = w1 + w2 + w3 + 0.001;

    float m = (gm * w1 + rm * w2 + sm * w3) / ws;
    m = mix(m, sin(m * 8.0 + ph * 3.0) * 0.5 + 0.5, 0.06);

    vec3 deep = vec3(0.02, 0.01, 0.1);
    vec3 cool = vec3(0.12, 0.28, 0.55);
    vec3 warm = vec3(0.88, 0.58, 0.1);
    vec3 gold = vec3(1.0, 0.82, 0.3);

    float ct = sin(ph) * 0.5 + 0.5;
    vec3 mid = mix(cool, cool + vec3(0.05, 0.1, 0.0), ct);
    vec3 peak = mix(warm, warm + vec3(0.0, 0.1, 0.15), ct);

    vec3 col = mix(deep, mid, smoothstep(0.05, 0.4, m));
    col = mix(col, peak, smoothstep(0.45, 0.9, m));
    col += gold * pow(m, 8.0) * 0.2;
    col *= 1.0 - dot(uv, uv) * 0.3;

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 68;
    Tone.Transport.bpm.value = bpm;

    const masterRev = new Tone.Reverb({ decay: 5.0, wet: 0.4 }).toDestination();
    await masterRev.generate();

    const pingPong = new Tone.PingPongDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.3 }).connect(masterRev);

    const droneA = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" },
        envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 4.0 },
        detune: 4
    }).connect(masterRev);
    droneA.volume.value = -14;

    const droneB = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 3.0, decay: 1.0, sustain: 0.8, release: 4.0 },
        detune: -4
    }).connect(masterRev);
    droneB.volume.value = -14;

    const chords = [
        ["D3", "A3", "F4"],
        ["Bb2", "F3", "D4"],
        ["G2", "D3", "Bb3"],
        ["A2", "E3", "C4"]
    ];

    let chordIdx = 0;
    const droneLoop = new Tone.Loop((time) => {
        const chord = chords[chordIdx % chords.length];
        droneA.triggerAttackRelease(chord, "1m", time, 0.2);
        droneB.triggerAttackRelease(chord, "1m", time, 0.2);
        chordIdx++;
    }, "1m").start(0);

    const bell = new Tone.FMSynth({
        harmonicity: 5.0,
        modulationIndex: 10,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 4.0, sustain: 0, release: 2.0 },
        modulation: { type: "sine" }
    }).connect(pingPong);
    bell.volume.value = -20;

    const bellScale = ["D5", "F5", "A4", "G5", "E5", "C5", "Bb4", "D5", "A5", "F4"];
    let bellIdx = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 3 && bar < 14) {
            if (bellIdx % 5 !== 2) {
                const vel = 0.2 + Math.random() * 0.15;
                bell.triggerAttackRelease(bellScale[bellIdx % bellScale.length], "8n", time, vel);
            }
        }
        bellIdx++;
    }, "2n.").start(0);

    const sub = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.5, decay: 0.8, sustain: 0.5, release: 2.0 }
    }).toDestination();
    sub.volume.value = -16;

    const bassRoots = ["D2", "Bb1", "G1", "A1"];
    let bassIdx = 0;
    const bassLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 4 && bar < 14) {
            sub.triggerAttackRelease(bassRoots[bassIdx % bassRoots.length], "2n", time, 0.4);
        }
        bassIdx++;
    }, "1m").start(0);

    const noiseFilter = new Tone.AutoFilter({
        frequency: 0.1,
        baseFrequency: 200,
        octaves: 3,
        type: "sine"
    }).connect(masterRev).start();

    const noiseSynth = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 4.0, decay: 2.0, sustain: 0.3, release: 4.0 }
    }).connect(noiseFilter);
    noiseSynth.volume.value = -28;

    let noiseCount = 0;
    const noiseLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
        if (bar >= 2 && bar < 15 && noiseCount % 3 === 0) {
            noiseSynth.triggerAttackRelease(4.0, time, 0.3);
        }
        noiseCount++;
    }, "2m").start(0);

    window.toneJsInstruments = { droneA, droneB, bell, sub, noiseSynth };
    window.toneJsParts = { droneLoop, bellLoop, bassLoop, noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
