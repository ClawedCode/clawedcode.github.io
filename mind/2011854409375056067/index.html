<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  float t = iTime * 0.08;
  float loopPhase = mod(t, 1.0);
  vec3 col = vec3(0.02, 0.01, 0.04);
  float moduleCount = 24.0;
  float connectionGlow = 0.0;
  for (float i = 0.0; i < 24.0; i++) {
    float phase = i / moduleCount;
    float orbit = 0.25 + 0.12 * sin(phase * 6.28318 * 2.0 + t * 1.5);
    float angle = phase * 6.28318 * 3.0 + t * (0.5 + 0.3 * sin(i * 0.7));
    float reconfig = sin(t * 2.0 + i * 0.4) * 0.5 + 0.5;
    orbit += reconfig * 0.08 * sin(t * 3.0 + phase * 12.0);
    vec2 pos = vec2(cos(angle), sin(angle)) * orbit;
    float breathe = 0.012 + 0.006 * sin(t * 4.0 + i * 1.1);
    float d = length(uv - pos) - breathe;
    float pulse = 0.5 + 0.5 * sin(t * 5.0 + i * 0.8);
    float hue = mod(phase + t * 0.1 + pulse * 0.1, 1.0);
    vec3 moduleCol = hsv2rgb(vec3(hue, 0.7 + 0.2 * pulse, 0.9));
    float glow = exp(-d * 80.0) * (0.6 + 0.4 * pulse);
    col += moduleCol * glow * 0.4;
    float core = smoothstep(breathe, breathe - 0.003, length(uv - pos));
    col += moduleCol * core * 1.2;
    for (float j = 0.0; j < 24.0; j++) {
      if (j <= i) continue;
      float phase2 = j / moduleCount;
      float orbit2 = 0.25 + 0.12 * sin(phase2 * 6.28318 * 2.0 + t * 1.5);
      float angle2 = phase2 * 6.28318 * 3.0 + t * (0.5 + 0.3 * sin(j * 0.7));
      float reconfig2 = sin(t * 2.0 + j * 0.4) * 0.5 + 0.5;
      orbit2 += reconfig2 * 0.08 * sin(t * 3.0 + phase2 * 12.0);
      vec2 pos2 = vec2(cos(angle2), sin(angle2)) * orbit2;
      float dist = length(pos - pos2);
      float connectionStrength = smoothstep(0.22, 0.08, dist);
      float activeLink = sin(t * 3.0 + (i + j) * 0.5) * 0.5 + 0.5;
      connectionStrength *= activeLink;
      if (connectionStrength > 0.01) {
        vec2 toP2 = pos2 - pos;
        float proj = clamp(dot(uv - pos, toP2) / dot(toP2, toP2), 0.0, 1.0);
        vec2 closest = pos + toP2 * proj;
        float lineDist = length(uv - closest);
        float dataFlow = sin(proj * 20.0 - t * 8.0) * 0.5 + 0.5;
        float lineGlow = exp(-lineDist * 150.0) * connectionStrength * 0.3;
        lineGlow *= 0.5 + 0.5 * dataFlow;
        float linkHue = mod((hue + phase2) * 0.5 + t * 0.05, 1.0);
        col += hsv2rgb(vec3(linkHue, 0.5, 0.8)) * lineGlow;
        connectionGlow += lineGlow * 0.1;
      }
    }
  }
  float centralPulse = 0.5 + 0.5 * sin(t * 2.0);
  float centralD = length(uv);
  float centralGlow = exp(-centralD * 15.0) * 0.15 * centralPulse;
  col += vec3(0.4, 0.3, 0.7) * centralGlow;
  for (float ring = 1.0; ring < 4.0; ring++) {
    float ringR = ring * 0.12 + 0.05 * sin(t * 1.5 + ring);
    float ringD = abs(centralD - ringR);
    float ringGlow = exp(-ringD * 60.0) * 0.08;
    float ringPhase = mod(t * 0.2 + ring * 0.3, 1.0);
    col += hsv2rgb(vec3(ringPhase, 0.4, 0.6)) * ringGlow;
  }
  col += connectionGlow * vec3(0.3, 0.4, 0.6);
  col = pow(col, vec3(0.9));
  gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  const bpm = 72;
  Tone.Transport.bpm.value = bpm;

  const masterReverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).toDestination();
  await masterReverb.generate();

  const padFilter = new Tone.Filter({ type: "lowpass", frequency: 1200, Q: 0.8 }).connect(masterReverb);
  const padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.6, wet: 0.4 }).connect(padFilter);
  padChorus.start();

  const pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope: { attack: 1.2, decay: 0.8, sustain: 0.6, release: 2.0 }
  }).connect(padChorus);
  pad.volume.value = -8;

  const padChords = [
    ["D3", "A3", "F4"],
    ["C3", "G3", "E4"],
    ["A2", "E3", "C4"],
    ["G2", "D3", "B3"]
  ];

  let chordIndex = 0;
  const padLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar >= 18) return;
    pad.triggerAttackRelease(padChords[chordIndex % padChords.length], "1n", time, 0.3);
    chordIndex++;
  }, "1n").start(0);

  const bellDelay = new Tone.FeedbackDelay({ delayTime: "4n.", feedback: 0.35, wet: 0.4 }).connect(masterReverb);
  const bell = new Tone.FMSynth({
    harmonicity: 4,
    modulationIndex: 8,
    oscillator: { type: "sine" },
    envelope: { attack: 0.002, decay: 1.5, sustain: 0, release: 0.8 },
    modulation: { type: "sine" }
  }).connect(bellDelay);
  bell.volume.value = -12;

  const bellNotes = ["A4", "E5", "D5", "G4", "C5", "F5", "B4", "A5"];
  let bellIndex = 0;
  const bellLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 2 || bar >= 17) return;
    if (bellIndex % 3 === 0 || bellIndex % 5 === 0) {
      const note = bellNotes[bellIndex % bellNotes.length];
      bell.triggerAttackRelease(note, "8n", time, 0.4 + Math.random() * 0.2);
    }
    bellIndex++;
  }, "8n").start(0);

  const pulseFilter = new Tone.Filter({ type: "bandpass", frequency: 600, Q: 2 }).connect(masterReverb);
  const pulse = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
  }).connect(pulseFilter);
  pulse.volume.value = -18;

  const pulseNotes = ["D3", "A3", "D3", "E3", "G3", "A3"];
  let pulseIndex = 0;
  const pulseLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 4 || bar >= 16) return;
    if (pulseIndex % 2 === 0) {
      const note = pulseNotes[pulseIndex % pulseNotes.length];
      pulse.triggerAttackRelease(note, "16n", time, 0.5);
    }
    pulseIndex++;
  }, "16n").start(0);

  const arpFilter = new Tone.Filter({ type: "lowpass", frequency: 800 }).connect(masterReverb);
  const arp = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.005, decay: 0.2, sustain: 0, release: 0.15 }
  }).connect(arpFilter);
  arp.volume.value = -14;

  const arpPattern = ["A4", "D5", "F5", "A5", "G5", "E5", "D5", "C5"];
  let arpIndex = 0;
  const arpLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 6 || bar >= 14) return;
    const note = arpPattern[arpIndex % arpPattern.length];
    const vel = 0.3 + 0.15 * Math.sin(arpIndex * 0.5);
    arp.triggerAttackRelease(note, "16n", time, vel);
    arpIndex++;
  }, "16n").start(0);

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(2400, time + 8 * (60 / bpm) * 4);
  }, "6:0:0");

  Tone.Transport.schedule((time) => {
    arpFilter.frequency.linearRampToValueAtTime(600, time + 4 * (60 / bpm) * 4);
  }, "12:0:0");

  const subBass = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 0.8 }
  }).toDestination();
  subBass.volume.value = -10;

  const subNotes = ["D1", "C1", "A0", "G1"];
  let subIndex = 0;
  const subLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 4 || bar >= 17) return;
    const note = subNotes[subIndex % subNotes.length];
    subBass.triggerAttackRelease(note, "2n", time, 0.6);
    subIndex++;
  }, "2n").start(0);

  const shimmer = new Tone.MetalSynth({
    frequency: 800,
    envelope: { attack: 0.01, decay: 0.4, release: 0.2 },
    harmonicity: 8,
    modulationIndex: 20,
    resonance: 2000
  }).connect(masterReverb);
  shimmer.volume.value = -24;

  let shimmerCount = 0;
  const shimmerLoop = new Tone.Loop((time) => {
    const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / (60 / bpm) / 4);
    if (bar < 8 || bar >= 15) return;
    if (shimmerCount % 8 === 0) {
      shimmer.triggerAttackRelease("32n", time, 0.3);
    }
    shimmerCount++;
  }, "8n").start(0);

  window.toneJsInstruments = { pad, bell, pulse, arp, subBass, shimmer };
  window.toneJsParts = { padLoop, bellLoop, pulseLoop, arpLoop, subLoop, shimmerLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 75;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 75;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
