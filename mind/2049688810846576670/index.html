<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
    vec2 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
               mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

float fbm(vec2 p){
    float v=0.0,a=0.5;
    for(int i=0;i<3;i++){v+=a*noise(p);p*=2.01;a*=0.5;}
    return v;
}

float sdSeg(vec2 p,vec2 a,vec2 b){
    vec2 pa=p-a,ba=b-a;
    float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
    return length(pa-ba*h);
}

vec3 vineField(vec2 p,float t,float growth,float seed){
    float d=1e9,dep=0.0,pg=0.0;
    float s=1.0,len=0.22;
    for(int i=0;i<9;i++){
        float fi=float(i);
        float g=smoothstep(fi*0.1,fi*0.1+0.12,growth);
        float cl=len*g;
        if(g>0.01){
            float seg=sdSeg(p,vec2(0.0),vec2(0.0,cl))/s;
            if(seg<d){d=seg;dep=fi;}
            float pt=fract(t*0.6+fi*0.37+seed*0.5);
            float pd=length(p-vec2(0.0,cl*pt))/s;
            pg+=exp(-pd*350.0)*g;
        }
        p.y-=cl;
        p.x=abs(p.x);
        float ang=0.52+0.1*sin(t*0.6+fi*2.3+seed*2.7);
        p=rot(ang)*p;
        p+=0.01*vec2(sin(fi*3.9+t*0.3+seed*1.5),cos(fi*2.7+t*0.35+seed*2.1));
        p*=1.5;s*=1.5;
    }
    return vec3(d,dep,pg);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=mod(iTime,60.0);
    float ph=t/60.0;
    uv.y+=0.3;

    float bgCyc=sin(ph*3.14159);
    vec3 bgD=vec3(0.01,0.02,0.08);
    vec3 bgL=vec3(0.42,0.45,0.52);
    vec3 bg=mix(bgD,bgL,bgCyc*bgCyc);
    bg+=fbm(uv*2.5+t*0.07)*0.04*mix(vec3(0.05,0.04,0.1),vec3(0.1,0.1,0.06),bgCyc);

    float growth=smoothstep(0.0,0.4,ph)*(1.0-smoothstep(0.85,1.0,ph))*1.25;
    float fade=smoothstep(0.0,0.06,ph)*(1.0-smoothstep(0.88,1.0,ph));
    float breath=1.0+0.08*sin(t*0.7);

    float trunkH=0.22*min(growth*3.5,1.0);
    vec2 tTop=vec2(0.0,trunkH);
    float tD=sdSeg(uv,vec2(0.0,-0.02),tTop);

    vec3 v1=vineField(rot(-0.42)*(uv-tTop),t,max(growth-0.15,0.0),0.0);
    vec3 v2=vineField(rot(0.05)*(uv-tTop),t,max(growth-0.1,0.0)*0.96,1.0);
    vec3 v3=vineField(rot(0.45)*(uv-tTop),t,max(growth-0.2,0.0)*0.9,2.0);

    vec3 cT=vec3(0.6,0.6,0.68);
    vec3 c1=vec3(1.0,0.76,0.15);
    vec3 c2=vec3(0.12,0.92,0.68);
    vec3 c3=vec3(0.7,0.22,0.95);

    float tGlow=exp(-tD*100.0)*0.5+0.001/(tD*tD+0.001);
    float g1=exp(-v1.x*180.0)*0.35+0.0005/(v1.x*v1.x+0.0006);
    float g2=exp(-v2.x*180.0)*0.35+0.0005/(v2.x*v2.x+0.0006);
    float g3=exp(-v3.x*180.0)*0.35+0.0005/(v3.x*v3.x+0.0006);

    float p1=pow(sin(t*2.5-v1.y*1.6)*0.5+0.5,4.0);
    float p2=pow(sin(t*2.2-v2.y*1.6+1.5)*0.5+0.5,4.0);
    float p3=pow(sin(t*1.9-v3.y*1.6+3.0)*0.5+0.5,4.0);

    float prx1=1.0-smoothstep(0.002,0.02,v1.x);
    float prx2=1.0-smoothstep(0.002,0.02,v2.x);
    float prx3=1.0-smoothstep(0.002,0.02,v3.x);

    vec3 col=bg;
    col+=cT*tGlow*0.08*fade*breath;
    col+=c1*(g1*0.15+p1*prx1*0.3+v1.z*0.5)*fade*breath;
    col+=c2*(g2*0.15+p2*prx2*0.3+v2.z*0.5)*fade*breath;
    col+=c3*(g3*0.15+p3*prx3*0.3+v3.z*0.5)*fade*breath;

    for(int i=0;i<25;i++){
        float fi=float(i);
        vec2 bp=vec2(sin(fi*1.83+ph*6.283)*0.5,mod(fi*0.139+t*0.025,1.3)-0.35);
        bp+=0.1*vec2(sin(fi*2.7+t*0.2),cos(fi*1.9+t*0.15));
        float bd=length(uv-bp);
        float bright=0.0001/(bd*bd+0.00004);
        float cm=mod(fi,3.0);
        vec3 bc=cm<1.0?c1:cm<2.0?c2:c3;
        col+=bc*bright*0.1*fade;
    }

    float gly=floor(uv.y*35.0);
    float glt=floor(t*4.5);
    float gl=step(0.965,hash(vec2(gly,glt)));
    col+=gl*0.1*vec3(hash(vec2(gly,glt+1.0)),hash(vec2(gly,glt+2.0)),hash(vec2(gly,glt+3.0)))*fade;

    float ca=0.0025*sin(t*1.3);
    col.r*=1.0+ca*uv.x*4.0;
    col.b*=1.0-ca*uv.x*4.0;

    float vig=1.0-0.3*length((uv-vec2(0.0,0.15))*vec2(1.0,0.85));
    col*=max(vig,0.0);
    col=col/(1.0+col);

    gl_FragColor=vec4(col,1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
  var bpm = 72;
  Tone.Transport.bpm.value = bpm;
  var barLen = (60 / bpm) * 4;

  var masterReverb = new Tone.Reverb({ decay: 4.0, wet: 0.45 }).toDestination();
  await masterReverb.generate();

  var padChorus = new Tone.Chorus({ frequency: 0.3, delayTime: 4, depth: 0.6, wet: 0.35 }).connect(masterReverb);
  padChorus.start();

  var arpDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.25 }).connect(masterReverb);
  var arpFilter = new Tone.Filter({ type: "lowpass", frequency: 500, Q: 1.5 }).connect(arpDelay);

  var pad = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 1.5, decay: 0.8, sustain: 0.5, release: 2.5 }
  }).connect(padChorus);
  pad.volume.value = -14;

  var padChords = [
    ["D3", "F3", "A3"],
    ["Bb2", "D3", "F3"],
    ["C3", "E3", "G3"],
    ["A2", "C3", "E3"],
    ["D3", "F3", "A3", "C4"],
    ["Bb2", "D3", "F3", "A3"],
    ["G2", "Bb2", "D3"],
    ["A2", "E3", "A3"]
  ];
  var chordIdx = 0;

  var padLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    var vol = (bar < 2 || bar >= 16) ? 0.2 : 0.3;
    pad.triggerAttackRelease(
      padChords[chordIdx % padChords.length],
      "1n", time, vol
    );
    chordIdx++;
  }, "1n").start(0);

  var bassFilter = new Tone.Filter({ type: "lowpass", frequency: 180 }).connect(masterReverb);
  var bass = new Tone.MonoSynth({
    oscillator: { type: "sine" },
    envelope: { attack: 0.08, decay: 0.4, sustain: 0.3, release: 0.6 },
    filterEnvelope: { attack: 0.05, decay: 0.3, sustain: 0.2, baseFrequency: 50, octaves: 1.5 }
  }).connect(bassFilter);
  bass.volume.value = -10;

  var bassRoots = ["D2", "Bb1", "C2", "A1", "D2", "Bb1", "G1", "A1"];
  var bassIdx = 0;

  var bassLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 3 && bar < 16) {
      bass.triggerAttackRelease(
        bassRoots[bassIdx % bassRoots.length],
        "2n", time, 0.65
      );
    }
    bassIdx++;
  }, "1n").start(0);

  var arp = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: { attack: 0.008, decay: 0.18, sustain: 0.0, release: 0.12 }
  }).connect(arpFilter);
  arp.volume.value = -18;

  var branch1 = ["D4", "F4", "A4", "D5"];
  var branch2 = ["Bb3", "D4", "F4", "Bb4"];
  var branch3 = ["C4", "E4", "G4", "C5"];
  var branchHigh = ["A4", "C5", "D5", "F5", "A5"];

  var arpStep = 0;
  var arpLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar < 4 || bar >= 16) { arpStep++; return; }

    var section = Math.floor(bar / 2) % 4;
    var pool;
    if (section === 0) pool = branch1;
    else if (section === 1) pool = branch2;
    else if (section === 2) pool = branch3;
    else pool = branchHigh;

    var density = bar < 8 ? 0.5 : 0.7;
    if (Math.random() > density) { arpStep++; return; }

    var noteIdx = arpStep % pool.length;
    var vel = 0.25 + Math.random() * 0.2;
    arp.triggerAttackRelease(pool[noteIdx], "16n", time, vel);
    arpStep++;
  }, "16n").start(0);

  Tone.Transport.schedule(function(time) {
    arpFilter.frequency.linearRampToValueAtTime(2200, time + 8 * barLen);
  }, "4:0:0");

  Tone.Transport.schedule(function(time) {
    arpFilter.frequency.linearRampToValueAtTime(500, time + 3 * barLen);
  }, "13:0:0");

  var bell = new Tone.FMSynth({
    harmonicity: 3.5,
    modulationIndex: 10,
    oscillator: { type: "sine" },
    envelope: { attack: 0.003, decay: 1.8, sustain: 0.0, release: 1.2 },
    modulation: { type: "sine" },
    modulationEnvelope: { attack: 0.01, decay: 0.6, sustain: 0.0, release: 0.4 }
  }).connect(masterReverb);
  bell.volume.value = -22;

  var bellNotes = ["A5", "D5", "F5", "A4", "C5", "D6", "E5", "Bb5"];
  var bellIdx = 0;

  var bellLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 6 && bar < 15 && bellIdx % 3 === 0) {
      bell.triggerAttackRelease(
        bellNotes[bellIdx % bellNotes.length],
        "4n", time, 0.15 + Math.random() * 0.1
      );
    }
    bellIdx++;
  }, "2n").start(0);

  var noiseFilter = new Tone.Filter({ type: "bandpass", frequency: 1500, Q: 0.8 }).connect(masterReverb);
  var ambNoise = new Tone.NoiseSynth({
    noise: { type: "pink" },
    envelope: { attack: 2.5, decay: 1.5, sustain: 0.2, release: 3.0 }
  }).connect(noiseFilter);
  ambNoise.volume.value = -30;

  var noiseIdx = 0;
  var noiseLoop = new Tone.Loop(function(time) {
    var bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
    if (bar >= 2 && bar < 16 && noiseIdx % 4 === 0) {
      ambNoise.triggerAttackRelease(4.0, time);
    }
    noiseIdx++;
  }, "1n").start(0);

  window.toneJsInstruments = { pad: pad, bass: bass, arp: arp, bell: bell, ambNoise: ambNoise };
  window.toneJsParts = { padLoop: padLoop, bassLoop: bassLoop, arpLoop: arpLoop, bellLoop: bellLoop, noiseLoop: noiseLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
