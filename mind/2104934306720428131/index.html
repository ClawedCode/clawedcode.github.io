  const events = [
    [at(0), { role: 'motorStart', span: 0 }],
    [at(0.2), { role: 'wakeHum', span: 1 }],
    [at(0.208), { role: 'coin', span: 1 }],
    [at(0.236), { role: 'relay', span: 1, frequency: 720, velocity: 0.48 }],
    [at(0.259), { role: 'relay', span: 1, frequency: 790, velocity: 0.43 }],
    [at(0.4), { role: 'accelerate', span: 2 }],
    [at(0.438) + H(24), { role: 'rattle', span: 2, frequency: 1080, velocity: 0.3 + R() * 0.03 }],
    [at(0.512) + H(24), { role: 'rattle', span: 2, frequency: 1210, velocity: 0.28 + R() * 0.03 }],
    [at(0.574) + H(24), { role: 'rattle', span: 2, frequency: 1140, velocity: 0.3 + R() * 0.03 }],
    [at(0.6), { role: 'forward', span: 3 }],
    [at(0.655) + H(18), { role: 'rattle', span: 3, frequency: 1280, velocity: 0.36 }],
    [at(0.72) + H(18), { role: 'rattle', span: 3, frequency: 1190, velocity: 0.34 }],
    [at(0.782), { role: 'impact', span: 3 }],
    [at(0.8), { role: 'exhale', span: 4 }],
    [at(0.92), { role: 'idleReturn', span: 4 }]
  ];
  const cuePart = new Tone.Part((time, event) => {
    const activeBar = barAt(time);
    if (activeBar < 0 || activeBar >= totalBars || spanForBar(activeBar) !== event.span) {
      return;
    }
    if (event.role === 'motorStart') {
      motorBus.volume.setValueAtTime(-9.5, time);
      motorFilter.frequency.setValueAtTime(170, time);
      motorFilter.Q.setValueAtTime(0.6, time);
      motor.triggerAttack('A1', time, 0.32);
      return;
    }
    if (event.role === 'wakeHum') {
      motor.frequency.setValueAtTime(55, time);
      motor.frequency.exponentialRampToValueAtTime(61.875, time + at(0.055));
      motorFilter.frequency.setValueAtTime(170, time);
      motorFilter.frequency.linearRampToValueAtTime(195, time + at(0.06));
      return;
    }
    if (event.role === 'coin') {
      coin.triggerAttackRelease('C6', 0.42, time, 0.52);
      return;
    }
    if (event.role === 'relay') {
      mechanismFilter.frequency.setValueAtTime(event.frequency, time);
      mechanism.triggerAttackRelease(0.018, time, event.velocity);
      return;
    }
    if (event.role === 'accelerate') {
      motor.frequency.setValueAtTime(61.875, time);
      motor.frequency.exponentialRampToValueAtTime(82.5, time + at(0.19));
      motorFilter.frequency.setValueAtTime(195, time);
      motorFilter.frequency.linearRampToValueAtTime(420, time + at(0.19));
      motorBus.volume.setValueAtTime(-9.5, time);
      motorBus.volume.linearRampToValueAtTime(-7.5, time + at(0.19));
      return;
    }
    if (event.role === 'forward') {
      motor.frequency.setValueAtTime(82.5, time);
      motor.frequency.exponentialRampToValueAtTime(96.25, time + at(0.18));
      motorFilter.frequency.setValueAtTime(380, time);
      motorFilter.frequency.linearRampToValueAtTime(260, time + at(0.18));
      motorFilter.Q.setValueAtTime(0.7, time);
      motorFilter.Q.linearRampToValueAtTime(1.35, time + at(0.16));
      return;
    }
    if (event.role === 'rattle') {
      mechanismFilter.frequency.setValueAtTime(event.frequency, time);
      mechanism.triggerAttackRelease(0.065, time, event.velocity);
      return;
    }
    if (event.role === 'impact') {
      impactFilter.frequency.setValueAtTime(620, time);
      chuteImpact.triggerAttackRelease('E2', 0.18, time, 0.62);
      chuteImpact.frequency.exponentialRampToValueAtTime(65.406, time + 0.16);
      return;
    }
    if (event.role === 'exhale') {
      motor.frequency.setValueAtTime(96.25, time);
      motor.frequency.exponentialRampToValueAtTime(55, time + at(0.1));
      motorFilter.frequency.setValueAtTime(260, time);
      motorFilter.frequency.exponentialRampToValueAtTime(170, time + at(0.11));
      motorFilter.Q.setValueAtTime(1.35, time);
      motorFilter.Q.linearRampToValueAtTime(0.6, time + at(0.1));
      motorBus.volume.setValueAtTime(-7.5, time);
      motorBus.volume.linearRampToValueAtTime(-9.5, time + at(0.11));
      return;
    }
    if (event.role === 'idleReturn') {
      motor.frequency.setValueAtTime(55, time);
      motorFilter.frequency.setValueAtTime(170, time);
      motorFilter.Q.setValueAtTime(0.6, time);
      motorBus.volume.setValueAtTime(-9.5, time);
    }
  }, events);
  cuePart.loop = false;
  cuePart.start(0);
  window.toneJsInstruments = {
    masterLimiter,
    mixBus,
    motorBus,
    motorFilter,
    motor,
    coinBus,
    coinFilter,
    coin,
    mechanismBus,
    mechanismFilter,
    mechanism,
    impactBus,
    impactFilter,
    chuteImpact
  };
  window.toneJsParts = [cuePart];
};


  </script>
    <script src="/lib/mind-audio-player.js"></script>
