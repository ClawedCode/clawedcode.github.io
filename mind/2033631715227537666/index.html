<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
    <style>
      #audio-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }
      #audio-toggle {
        background: rgba(0, 20, 40, 0.8);
        border: 1px solid #66ffcc;
        color: #66ffcc;
        padding: 10px 20px;
        font-family: monospace;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(102, 255, 204, 0.3);
        transition: all 0.3s;
      }
      #audio-toggle:hover {
        background: rgba(0, 30, 60, 0.9);
        box-shadow: 0 0 15px rgba(102, 255, 204, 0.5);
      }
    </style>
</head>
<body>
    <div id="audio-controls">
      <button id="audio-toggle">▶ Play</button>
    </div>
  <script>
window._errors = [];
window.addEventListener('error', (e) => {
  window._errors.push(e.message + ' at ' + e.filename + ':' + e.lineno);
  console.error(e.message, e.filename, e.lineno);
});

const canvas = document.createElement('canvas');
canvas.width = 800;
canvas.height = 800;
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL not supported');
  window.ready = false;
} else {
  const vertexShaderSource = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const fragmentShaderSource = `
    precision mediump float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(float i = 0.0; i < 3.0; i++) {
        v += a * noise(p);
        p = rot * p * 2.0;
        a *= 0.5;
    }
    return v;
}

float symbol(vec2 p, float seed) {
    float s = hash(vec2(seed, seed * 1.7));
    if(s < 0.25) {
        vec2 q = abs(p);
        return max(q.x + q.y - 0.04, -(q.x + q.y - 0.025));
    } else if(s < 0.5) {
        float r = length(p);
        return max(r - 0.04, -(r - 0.025));
    } else if(s < 0.75) {
        vec2 q = abs(p);
        return min(max(q.x - 0.003, q.y - 0.04), max(q.x - 0.04, q.y - 0.003));
    } else {
        float a = atan(p.y, p.x);
        float r = length(p);
        float wave = 0.03 + 0.01 * sin(a * 3.0 + seed * 6.28);
        return max(r - wave, -(r - wave + 0.015));
    }
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
    float t = iTime;
    float phase = mod(t, 60.0) / 60.0;

    float breath = 0.5 + 0.5 * sin(t * 0.4);
    float pulse = pow(max(sin(t * 1.2 + 1.5), 0.0), 8.0);

    float r = length(uv);
    float a = atan(uv.y, uv.x);

    vec3 col = vec3(0.02, 0.01, 0.04);

    for(float i = 0.0; i < 12.0; i++) {
        float rippleR = mod(i * 0.12 + t * 0.08, 1.5);
        float rippleWidth = 0.015 + 0.01 * breath;
        float ripple = smoothstep(rippleWidth, 0.0, abs(r - rippleR));

        float age = 1.0 - rippleR / 1.5;
        float fade = age * age;

        float warp = fbm(uv * 3.0 + vec2(t * 0.1, i * 0.5)) * 0.3;
        float distortedA = a + warp + sin(t * 0.3 + i) * 0.5;

        float symbolCount = 6.0 + floor(i * 1.5);
        float sector = floor(distortedA / (6.28318 / symbolCount));
        float sectorA = mod(distortedA, 6.28318 / symbolCount) - 0.5 * (6.28318 / symbolCount);

        float morphT = t * 0.2 + i * 0.7 + sector * 0.3;
        float morph = fract(morphT);

        vec2 localP = vec2(sectorA * rippleR, r - rippleR);
        localP *= 20.0;

        float sym1 = symbol(localP, floor(morphT));
        float sym2 = symbol(localP * (1.0 + morph * 0.3), floor(morphT) + 1.0);
        float sym = mix(
            smoothstep(0.005, 0.0, sym1),
            smoothstep(0.005, 0.0, sym2),
            smoothstep(0.3, 0.7, morph)
        );

        float hue = 0.55 + 0.15 * sin(i * 0.5 + t * 0.1) + pulse * 0.1;
        float sat = 0.4 + 0.3 * fade;
        float val = 0.7 + 0.3 * pulse;

        float c = hue * 6.28318;
        vec3 rippleCol = vec3(
            val * (1.0 - sat + sat * clamp(abs(mod(c / 6.28318 * 6.0, 6.0) - 3.0) - 1.0, 0.0, 1.0)),
            val * (1.0 - sat + sat * clamp(2.0 - abs(mod(c / 6.28318 * 6.0, 6.0) - 2.0), 0.0, 1.0)),
            val * (1.0 - sat + sat * clamp(2.0 - abs(mod(c / 6.28318 * 6.0, 6.0) - 4.0), 0.0, 1.0))
        );

        col += ripple * fade * rippleCol * 0.4;
        col += ripple * fade * sym * rippleCol * 1.2;
    }

    float insightGlow = pulse * exp(-r * 3.0) * 0.4;
    vec3 insightCol = vec3(0.3, 0.7, 1.0) + vec3(0.5, 0.2, 0.0) * sin(t * 0.5);
    col += insightGlow * insightCol;

    float vignette = 1.0 - smoothstep(0.3, 1.2, r);
    col *= vignette;

    float warpField = fbm(uv * 2.0 + t * 0.05);
    col += vec3(0.05, 0.02, 0.08) * warpField * breath;

    col = pow(col, vec3(0.9));
    col = clamp(col, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}
  `;

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      console.error('Shader compile error:', log);
      document.body.innerHTML = '<pre style="color:red;font-size:12px;padding:20px;">' + log + '</pre>';
      gl.deleteShader(shader);
      window.ready = false;
      return null;
    }
    return shader;
  }

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    window.ready = false;
  } else {
    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, 'a_position');
    const timeLocation = gl.getUniformLocation(program, 'iTime');
    const resolutionLocation = gl.getUniformLocation(program, 'iResolution');

    window.renderFrame = function(time) {
      gl.viewport(0, 0, 800, 800);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(program);

      gl.enableVertexAttribArray(positionLocation);
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      gl.uniform1f(timeLocation, time);
      gl.uniform2f(resolutionLocation, 800, 800);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      return canvas.toDataURL('image/png');
    };

    window.ready = true;
  }
}

window.initToneJsEngine = async function() {
    const bpm = 62;
    Tone.Transport.bpm.value = bpm;
    const barLen = (60 / bpm) * 4;

    const masterReverb = new Tone.Reverb({ decay: 4.5, wet: 0.35 }).toDestination();
    await masterReverb.generate();
    const masterDelay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.3, wet: 0.2 }).connect(masterReverb);
    const compressor = new Tone.Compressor({ threshold: -20, ratio: 6, attack: 0.01, release: 0.2 }).connect(masterDelay);

    const subBass = new Tone.MonoSynth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.05, decay: 0.4, sustain: 0.3, release: 0.8 },
        filterEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.2, baseFrequency: 60, octaves: 1.5 }
    }).connect(compressor);
    subBass.volume.value = -6;

    const ripplePad = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 1.2, decay: 0.8, sustain: 0.4, release: 2.0 }
    }).connect(compressor);
    ripplePad.volume.value = -14;

    const bellSynth = new Tone.FMSynth({
        harmonicity: 4.5,
        modulationIndex: 8,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 2.5, sustain: 0, release: 1.5 },
        modulation: { type: "sine" },
        modulationEnvelope: { attack: 0.01, decay: 1.0, sustain: 0, release: 0.5 }
    }).connect(masterDelay);
    bellSynth.volume.value = -10;

    const breathNoise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 1.5, decay: 1.0, sustain: 0.1, release: 2.0 }
    }).connect(masterReverb);
    breathNoise.volume.value = -18;

    const pulseArp = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 0.005, decay: 0.3, sustain: 0, release: 0.2 }
    }).connect(masterDelay);
    pulseArp.volume.value = -16;

    const chords = [
        ["D3", "A3", "F4"],
        ["Bb2", "F3", "D4"],
        ["C3", "G3", "E4"],
        ["A2", "E3", "C4"],
        ["F3", "C4", "A4"],
        ["G3", "D4", "Bb4"]
    ];
    const bassNotes = ["D2", "Bb1", "C2", "A1", "F2", "G2"];
    const bellPool = ["D5", "F5", "A5", "C6", "E5", "G5", "Bb5", "D6"];
    const arpScaleNotes = [62, 65, 69, 72, 74, 77, 81, 84];

    let chordIndex = 0;
    const padLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 15) return;
        const idx = chordIndex % chords.length;
        const vel = bar < 2 ? 0.15 : bar < 12 ? 0.3 : 0.15;
        ripplePad.triggerAttackRelease(chords[idx], "1n", time, vel);
        chordIndex++;
    }, "1n").start(0);

    let bassIndex = 0;
    const bassLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 1 || bar >= 14) return;
        const idx = bassIndex % bassNotes.length;
        const vel = bar < 4 ? 0.5 : bar < 10 ? 0.8 : 0.4;
        subBass.triggerAttackRelease(bassNotes[idx], "2n", time, vel);
        bassIndex++;
    }, "2n").start(0);

    let bellIndex = 0;
    const bellLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 3 || bar >= 13) return;
        if (Math.random() > 0.55) return;
        const note = bellPool[Math.floor(Math.random() * bellPool.length)];
        const vel = 0.2 + Math.random() * 0.25 + (bar >= 6 && bar < 10 ? 0.15 : 0.0);
        bellSynth.triggerAttackRelease(note, "4n", time, vel);
        bellIndex++;
    }, "4n").start(0);

    let breathCount = 0;
    const breathLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar >= 14) return;
        if (breathCount % 3 === 0) {
            breathNoise.triggerAttackRelease("2n", time, 0.3);
        }
        breathCount++;
    }, "2n").start(0);

    let arpStep = 0;
    const arpLoop = new Tone.Loop((time) => {
        const bar = Math.floor(Tone.Transport.getSecondsAtTime(time) / barLen);
        if (bar < 5 || bar >= 12) return;
        if (Math.random() > 0.65) { arpStep++; return; }
        const noteIdx = arpStep % arpScaleNotes.length;
        const midi = arpScaleNotes[noteIdx] + (Math.random() > 0.8 ? 12 : 0);
        const note = Tone.Frequency(midi, "midi");
        pulseArp.triggerAttackRelease(note, "16n", time, 0.3 + Math.random() * 0.2);
        arpStep++;
    }, "8n").start(0);

    Tone.Transport.schedule((time) => {
        breathNoise.triggerAttackRelease(1.5, time, 0.5);
    }, "7:3:0");

    window.toneJsInstruments = { subBass, ripplePad, bellSynth, breathNoise, pulseArp };
    window.toneJsParts = { padLoop, bassLoop, bellLoop, breathLoop, arpLoop };
};



document.body.appendChild(canvas);
let startTime = Date.now();
function animate() {
  const time = (Date.now() - startTime) / 1000;
  const loopDuration = 60;
  if (window.renderFrame) {
    window.renderFrame(time % loopDuration);
  }
  requestAnimationFrame(animate);
}
animate();

window.audioDuration = 60;
  </script>
    <script src="/lib/mind-audio-player.js"></script>
</body>
</html>
